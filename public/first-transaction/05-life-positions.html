<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#171233" />
<meta name="description" content="Four beliefs about you and everyone else, decided early, re-proven daily. Game 5 of 5 in the First Transaction series." />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/svg+xml" href="/TA/favicon.svg" />
<link rel="apple-touch-icon" href="/TA/icon-192.png" />
<title>Pick Your Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg); font-family: "IBM Plex Sans", system-ui, sans-serif;
    min-height: 100vh; margin: 0; display: flex; justify-content: center; padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 560px; }
  .masthead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; }
  .tag:hover { color: var(--pink); }
  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 26px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }
  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .scene { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; }
  .scene .who { font-weight: 600; color: var(--accent-deep); }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button.choice {
    font-family: "IBM Plex Sans", sans-serif; font-size: 14.5px; font-weight: 500; text-align: left;
    padding: 14px 15px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.35;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice.correct[disabled], button.choice.wrong[disabled] { opacity: 1; }
  .stamp {
    display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff;
  }
  .stamp.ok { background: var(--ok); } .stamp.cross { background: var(--wrong); }
  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 18px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 12px; padding-top: 2px; }
  .feedback b { color: inherit; }
  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }
  .nextbar { display: flex; justify-content: flex-end; }
  button.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none;
    padding: 12px 20px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
  }
  button.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .intro p { font-size: 15.5px; line-height: 1.65; margin: 0 0 14px; }
  .intro .lede { font-size: 17px; font-weight: 500; font-family: "Fraunces", Georgia, serif; font-style: italic; color: var(--accent-deep); }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .corral-caption { font-size: 13px; color: var(--text-dim); margin: 0 0 10px; line-height: 1.5; }
  .corral { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 18px; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  .corral .cell { border-radius: 14px; padding: 13px 10px; text-align: center; background: var(--surface-2); }
  .corral .cell b { display: block; font-size: 13px; margin-bottom: 4px; letter-spacing: 0.02em; }
  .corral .cell span { color: var(--text-dim); font-size: 11px; }
  .corral .cell.good { background: color-mix(in srgb, var(--ok) 16%, var(--surface-2)); }
  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .recap { margin: 14px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .recap li { font-size: 13.5px; color: var(--text-dim); display: flex; gap: 10px; align-items: baseline; }
  .recap .n { font-family: "IBM Plex Mono", monospace; color: var(--accent-deep); font-weight: 700; }
  .reflect-tag {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block;
    padding: 5px 12px; border-radius: 999px; margin-bottom: 14px;
  }
  textarea.reflect-box {
    width: 100%; min-height: 120px; resize: vertical; font-family: "IBM Plex Sans", sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text);
    background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset;
  }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }
  .foot-link { display: block; text-align: center; margin-top: 18px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--on-bg-dim); letter-spacing: 0.03em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="stage">
  <div class="masthead">
    <div class="series">First Transaction <small>· Game 5 of 5</small></div>
    <a class="tag" href="./index.html">← All games</a>
  </div>
  <div class="card" id="card"></div>
  <div class="foot-link" id="footlink"></div>
</div>

<script>
(function () {
  const POSITIONS = ["I'm OK, You're OK", "I'm not-OK, You're OK", "I'm OK, You're not-OK", "I'm not-OK, You're not-OK"];
  const OPS = ["Get-On-With", "Get-Away-From", "Get-Rid-Of", "Get-Nowhere-With"];

  const ROUND1 = {
    label: "Round 1 · Which corner is this?",
    items: [
      { scene: `<span class="who">Your boss</span> hands you a stack of papers: "I've marked points for your action, see to these and report back, please." You check with yourself, feel competent and fine about it, and say: "Right, I'll do that."`,
        answer: 0,
        why: "You see yourself as capable and her as fair. That's <b>I'm OK, You're OK</b>. The two of you are simply getting on with the job: <b>Get-On-With</b>.",
        example: `You, checking in with a direct report during a tight week: "I know this is a lot, can you get me the draft by Thursday?" They say "yes, I've got it," and you both move on, each trusting the other is capable.`,
        traps: {
          1: "Get-Away-From needs you to feel you <i>can't</i> handle this and look for an exit. Here you feel competent and simply accept the task. There's no avoidance in the scene.",
          2: "Get-Rid-Of needs you to see <i>her</i> as the problem: snapping back, resenting the ask. Nothing here suggests you think she's being unfair.",
          3: "Get-Nowhere-With needs both of you doubting this will ever work. Here you both simply proceed. There's no stalemate." },
      },
      { scene: `<span class="who">Jim</span>, a coworker, corners you again to complain. Your stomach tightens. Without really deciding to, you mumble "sorry, have to go to the bathroom" and bolt.`,
        answer: 1,
        why: "You've decided, without noticing you decided, that you can't cope and he's fine. That's <b>I'm not-OK, You're OK</b>: <b>Get-Away-From</b>, running on autopilot.",
        example: `Jim starts in on his usual complaint at your desk. Your jaw tightens, you say "sorry, gotta run," and leave before he finishes a sentence, relieved once you're clear of him, but never deciding any of that on purpose.`,
        traps: {
          0: "Get-On-With would mean calmly engaging Jim as an equal, confident you can handle the conversation. Here your stomach tightens and you flee without deciding to. That's not calm cooperation.",
          2: "Get-Rid-Of needs you to think <i>Jim's</i> the problem and act to shut him down. Here you don't challenge him at all. You escape, and your own account still rates him as fine, just someone you can't deal with.",
          3: "Get-Nowhere-With needs both of you written off as hopeless. Here it's only your own coping that's in doubt, not whether a conversation with Jim could ever work." },
      },
      { scene: `<span class="who">Your assistant</span> admits he forgot to send a printing job and missed the deadline. You go red, snap "What do you do? You sort this out right now!", and think afterward: "Can't trust anybody unless I do it myself."`,
        answer: 2,
        why: "You come out fine in your own account; he's the one who's not-OK. That's <b>I'm OK, You're not-OK</b>: <b>Get-Rid-Of</b>.",
        example: `A teammate ships a bug to production. You fire back "how did you not catch this?" in front of the group, then tell yourself afterward you're the only one who checks things properly around here.`,
        traps: {
          0: "Get-On-With would mean addressing the mistake calmly, as two capable people solving a problem together. Here you snap and privately write people off. That's not cooperative.",
          1: "Get-Away-From needs you to doubt <i>yourself</i> and avoid the confrontation. Here you come out fine in your own account. He's the one rated not-OK, not you.",
          3: "Get-Nowhere-With needs you doubting things can work at all, for both of you. Here you're confident in yourself, just not in him." },
      },
      { scene: `Two roommates, same fight about chores for the tenth time. Both throw up their hands: "Forget it. This never works. Neither of us is ever going to change." Both walk off to separate rooms.`,
        answer: 3,
        why: "Nobody's OK, nothing's fixable. That's <b>I'm not-OK, You're not-OK</b>. Franklin Ernst's name for it: <b>Get-Nowhere-With</b>.",
        example: `Two co-founders, same argument about roles for the third time this quarter: "There's no point, we're never going to agree on this," and the meeting just ends. Nobody assigned fault, nobody proposed a fix.`,
        traps: {
          0: "Get-On-With is cooperation that's actually working. These two have just declared the opposite. Nothing here is getting resolved.",
          1: "Get-Away-From is one person avoiding while still rating the <i>other</i> person OK. Here both people throw up their hands, and neither comes out of it looking fine.",
          2: "Get-Rid-Of needs one person confident and blaming the other. Here both give up on each other equally, and on themselves." },
      },
    ],
  };

  const ROUND2 = {
    label: "Round 2 · The same move, done on purpose",
    intro: `Here's the part that trips people up: the four corners aren't four personalities, and the "bad" ones aren't always wrong. The same outward move can come from a script, running unaware, or from a clear-eyed Adult choice.`,
    items: [
      { scene: `Same Jim, same complaints. This time: "Right now I'm not willing to listen to Jim. He's got real problems, but it's not my job to solve them. Best thing I can do is step out of range." You say, "Hey Jim, that sounds rough, can't stop now, I've got sources to check. Hope you work it out," and leave.`,
        q: "Is this still the scripty \"I'm not-OK, You're OK\" from before?",
        options: ["Yes, same position, just worded more politely", "No, it's the same operation (Get-Away-From), chosen on purpose from Adult"],
        answer: 1,
        why: "Identical operation, completely different engine. Done with awareness, walking away isn't proof you're not-OK. It's just a boundary. The position becomes a trap only when you slide into it <i>without</i> choosing." },
      { scene: `Same missed deadline. This time: "I'm frustrated, and I need this fixed today." You say it firmly, without the snarl, without going red, and you don't privately conclude anything about trusting people in general.`,
        q: "Is this move, being firm, automatically \"I'm OK, You're not-OK\"?",
        options: ["Yes, firmness always means you've written the other person off", "No, firmness with Adult awareness isn't the same as scripty Get-Rid-Of"],
        answer: 1,
        why: "Being direct isn't the problem. The scripty version uses the moment to <i>confirm a belief</i> you already held about people. The Adult version just solves today's problem and stops there." },
    ],
  };

  const REFLECT_PROMPT = `Under stress, which corner do you default to: Get-On-With, Get-Away-From, Get-Rid-Of, or Get-Nowhere-With? Where in your life does that show up most?`;
  const REFLECT_KEY = "reflect-05-life-positions";

  const TOTAL = ROUND1.items.length + ROUND2.items.length;
  let r1idx = 0, r2idx = 0, doneCount = 0, answered = false;
  const card = document.getElementById("card");

  function progressHTML() {
    let bars = "";
    for (let i = 0; i < TOTAL; i++) bars += `<i class="${i < doneCount ? "done" : (i === doneCount ? "current" : "")}"></i>`;
    return `<div class="progress">${bars}</div>`;
  }

  function renderR1() {
    answered = false;
    const item = ROUND1.items[r1idx];
    const introBlock = r1idx === 0 ? `<p class="deck" style="margin-bottom:16px;">Four beliefs you can hold about yourself and the other person, in the moment. Read the scene, name the corner.</p>` : "";
    card.innerHTML = `
      ${progressHTML()}
      <div class="round-label">${ROUND1.label}</div>
      ${introBlock}
      <p class="scene">${item.scene}</p>
      <div class="grid-choices">${POSITIONS.map((p, i) => `<button class="choice" data-i="${i}"><b style="display:block; font-family:'IBM Plex Mono',monospace; font-size:12.5px; margin-bottom:2px;">${OPS[i]}</b><span style="font-size:13px; color:var(--text-dim);">${p}</span></button>`).join("")}</div>
    `;
    card.querySelectorAll("button.choice").forEach(btn => btn.addEventListener("click", () => selectR1(parseInt(btn.dataset.i, 10))));
  }

  function selectR1(i) {
    if (answered) return;
    answered = true;
    const item = ROUND1.items[r1idx];
    const correct = i === item.answer;
    doneCount++;
    card.querySelectorAll("button.choice").forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === item.answer) btn.classList.add("correct");
      else if (idx === i) btn.classList.add("wrong");
    });
    const whyClass = correct ? "ok" : "cross";
    const bodyHTML = correct
      ? `<p class="feedback"><b>Why:</b> ${item.why}</p>`
      : `<p class="feedback"><b>You picked ${OPS[i]} (${POSITIONS[i]}).</b> ${item.traps[i]}</p>
         <p class="feedback"><b>The right call is ${OPS[item.answer]} (${POSITIONS[item.answer]}).</b> ${item.why}</p>`;
    const exampleHTML = `<div class="example"><div class="ex-label">Real example</div>${item.example}</div>`;
    const box = document.createElement("div");
    box.innerHTML = `<div class="why-box ${whyClass}"><div class="stamp ${whyClass}">${correct ? "✓ Right call" : "✗ Not quite"}</div>
      ${bodyHTML}</div>${exampleHTML}
      <div class="nextbar"><button class="next" id="nextBtn">Continue →</button></div>`;
    card.appendChild(box);
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (r1idx < ROUND1.items.length - 1) { r1idx++; renderR1(); }
      else { renderR2(); }
    });
  }

  function renderR2() {
    answered = false;
    const item = ROUND2.items[r2idx];
    const introBlock = r2idx === 0 ? `<p class="deck" style="margin-bottom:16px;">${ROUND2.intro}</p>` : "";
    card.innerHTML = `
      ${progressHTML()}
      <div class="round-label">${ROUND2.label}</div>
      ${introBlock}
      <p class="scene">${item.scene}</p>
      <p class="scene" style="font-weight:500; font-size:15px;">${item.q}</p>
      <div class="choices">${item.options.map((o, i) => `<button class="choice" data-i="${i}">${o}</button>`).join("")}</div>
    `;
    card.querySelectorAll("button.choice").forEach(btn => btn.addEventListener("click", () => selectR2(parseInt(btn.dataset.i, 10))));
  }

  function selectR2(i) {
    if (answered) return;
    answered = true;
    const item = ROUND2.items[r2idx];
    const correct = i === item.answer;
    doneCount++;
    card.querySelectorAll("button.choice").forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === item.answer) btn.classList.add("correct");
      else if (idx === i) btn.classList.add("wrong");
    });
    const whyClass = correct ? "ok" : "cross";
    const box = document.createElement("div");
    box.innerHTML = `<div class="why-box ${whyClass}"><div class="stamp ${whyClass}">${correct ? "✓ Right call" : "✗ Not quite"}</div>
      <p class="feedback"><b>Why:</b> ${item.why}</p></div>
      <div class="nextbar"><button class="next" id="nextBtn">Continue →</button></div>`;
    card.appendChild(box);
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (r2idx < ROUND2.items.length - 1) { r2idx++; renderR2(); }
      else { renderReflect(); }
    });
  }

  function renderReflect() {
    let saved = "";
    try { saved = localStorage.getItem(REFLECT_KEY) || ""; } catch (e) {}
    card.innerHTML = `
      ${progressHTML()}
      <div class="reflect-tag">Your turn</div>
      <h1 style="font-size:21px;">Which corner is home base for you?</h1>
      <p class="feedback">${REFLECT_PROMPT}</p>
      <textarea class="reflect-box" id="reflectBox" placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>
      <div class="nextbar"><button class="next" id="nextBtn">Continue →</button></div>
    `;
    const box = document.getElementById("reflectBox");
    box.value = saved;
    box.addEventListener("input", () => { try { localStorage.setItem(REFLECT_KEY, box.value); } catch (e) {} });
    document.getElementById("nextBtn").addEventListener("click", renderEnd);
  }

  function renderEnd() {
    card.innerHTML = `
      ${progressHTML()}
      <div class="end-badge">Series complete</div>
      <h1 style="font-size:22px;">A life position is a decision wearing a mood's disguise.</h1>
      <p class="feedback">Most of us settled into one of these four corners early, long before we could have argued about it, and we've been quietly collecting "evidence" for it ever since, mostly through the very operations in this game. None of the four is the villain. The useful move isn't permanent residence in "I'm OK, You're OK." It's running any of the four on purpose, from Adult, instead of sliding into one from habit.</p>
      <p class="feedback" style="font-weight:600; margin-bottom:6px;">You've now played all five:</p>
      <ul class="recap">
        <li><span class="n">1</span><span>Strokes (why any recognition beats none)</span></li>
        <li><span class="n">2</span><span>Who's Talking? (Parent, Adult, Child)</span></li>
        <li><span class="n">3</span><span>Keep It Going or Cross It (transactions)</span></li>
        <li><span class="n">4</span><span>Yes, But... (psychological games)</span></li>
        <li><span class="n">5</span><span>Pick Your Corner (life positions)</span></li>
      </ul>
      <div class="source"><b>From:</b> Ian Stewart &amp; Vann Joines, <i>TA Today</i> (ch. 12, &ldquo;Life Positions,&rdquo; and Franklin Ernst's OK Corral)</div>
      <div class="nextbar" style="margin-top:18px;"><button class="next" id="nextBtn">Play the series again →</button></div>
