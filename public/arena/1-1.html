<title>A Day With No Hellos · You</title>

<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"1.1","setting":"Home & Flatmates","title":"A Day With No Hellos","world":1,"worldName":"Being Noticed","week":1,"weekName":"Being Noticed","mechanic":"Choice-story","concept":"After this one you can tell a warm nod from a cold one, and you can feel what a day with almost none costs you.","plainWord":"a nod","bookTerm":"Stroke","bookIdea":"Any sign that someone registers you, from a greeting to a glare, and people need a steady supply of them to stay well.","bookSource":"Games People Play, Introduction; Scripts People Live, ch. 1","opener":{"setting":"Monday, 7:50am. Hawthorn Court, apartment 3B, the kitchen. You moved in two days ago.","lines":[{"who":"Sam","text":"\u201c...\u201d","cue":"headphones in, pouring cereal, not looking up"},{"who":"You","text":"\u201cMorning.\u201d","cue":"said to his back"}],"ask":"Nothing bad has happened yet, so why does the day already feel like it is draining you?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each card is one line from today. Tap what it was: a <b>warm nod<\/b>, a <b>cold nod<\/b>, or nothing at all.","items":[{"type":"pick","who":"Halden reception","text":"\u201cName?\u201d","cue":"9:35. She looks at her screen, not at you, and prints the badge.","options":["A warm nod","A cold nod","Nothing at all"],"answer":1,"why":"A cold nod still counts. She said one word and printed your badge, so she registered that you exist. Cold nods are still food.","traps":{"0":"A warm nod would mean she was glad you came. Her eyes never left the screen, so calling it warm has you waiting for a smile that won't come.","2":"Nothing would mean she never noticed you. She did, and the day starts draining from this desk."},"example":"A school gate, 8:10am.<br>Teacher: \u201cName?\u201d<br>She ticks the list and says \u201cSit\u201d without lifting her head.<br>The child goes in. That is a nod, even a thin one, because the teacher saw the child."},{"type":"pick","who":"Gran","text":"\u201cOh, new boy! You're too thin. Come, come, I've made flattened rice.\u201d","cue":"stairwell, 8:15, her door already open","options":["A warm nod","A cold nod","Nothing at all"],"answer":0,"why":"A warm nod can sound like a complaint. Gran says you're too thin because she cares whether you eat. The complaint is the affection.","traps":{"1":"A cold nod would need her to be annoyed with you. She is delighted, and she is already holding out the flattened rice.","2":"Nothing would mean she never saw you. She stood in her doorway and called you in."},"example":"A family WhatsApp group.<br>Uncle: \u201cYou look tired, eat something.\u201d<br>It reads like a telling-off, but it is the same worry that makes him ask about your day."},{"type":"pick","who":"Sam","text":"\u201c...\u201d","cue":"You say 'Morning' to his back. He nods at the cereal without turning round.","options":["A warm nod","A cold nod","Nothing at all"],"answer":1,"why":"A cold nod. It was small and it went to the cereal, but it still tells you he knows you are in the kitchen. That is more than nothing.","traps":{"0":"A warm nod needs him to turn round and look at you. He stays facing the cereal, so calling it warm would be a guess.","2":"Nothing would mean you were invisible in that kitchen. He did nod, and a nod counts, even a small one."},"example":"A bus stop, 7:40am.<br>You say \u201cMorning\u201d to the back of a man's head.<br>He lifts two fingers off the rail without turning round."},{"type":"pick","who":"Clara","text":"\u201cOh thank god, someone newer than me.\u201d","cue":"canteen, 13:10, after you ask if you can sit down","options":["A warm nod","A cold nod","Nothing at all"],"answer":0,"why":"A warm nod for being there. She's glad you came, and you didn't have to do anything to earn it.","traps":{"1":"A cold nod would mean she wanted you gone. She is relieved, and cold gets her wrong.","2":"Nothing would mean she didn't hear you. She looked up from her phone the moment you spoke."},"example":"A family lunch.<br>Cousin: \u201cOh good, you came, the kids kept asking for you.\u201d<br>That is warm, and it is for being there, not for anything you did."},{"type":"pick","who":"Mum","text":"\u201cDid you eat?\u201d","cue":"phone, 22:30, six hundred kilometres away","options":["A warm nod","A cold nod","Nothing at all"],"answer":0,"why":"A warm nod. The question sounds like a checklist, but it means she has you in mind when you're not there. Even a worried question is a nod for being.","traps":{"1":"A cold nod would make her a nag. She asks because she misses you, so cold reads her too harshly.","2":"Nothing would mean no word from home at all. A question about your dinner is still her looking after you."},"example":"A neighbour's balcony, evening.<br>\u201cYou're back late. Have you eaten?\u201d<br>It can feel like a checklist. It is also a sign she noticed you were out."}]},{"level":"Play","label":"Play, the day in motion","intro":"The day, then the walk home. Each beat gives you two or three things to say. Watch the <b>You<\/b> meter. It drains whenever nobody notices you.","items":[{"type":"scene","title":"Monday, 7:50 to 22:30","setting":"Six places in one day: the flat, the stairwell, Halden reception, Daniel's desk, the canteen and your room. The You meter starts at 70.","meters":{"you":70,"them":50},"beats":[{"who":"Sam","text":"\u201c...\u201d","cue":"3B kitchen, 7:50. Headphones in, pouring cereal.","lines":[{"text":"\u201cMorning.\u201d You say it to his back.","tag":"ok","you":-4,"them":0,"outcome":"He nods at the cereal.","why":"A hello aimed at someone's back is too small to land. It counts as a nod, but he barely took it in, so the morning starts thin."},{"text":"You tap his shoulder. \u201cHey, I'm the new guy in the back room. We haven't actually met.\u201d","tag":"best","you":5,"them":6,"outcome":"He pulls out one earbud. \u201cOh, yeah! Sam. Sorry, mornings.\u201d","why":"You gave him a reason to look up. Saying who you are is the simplest way to get a nod that actually lands."},{"text":"Say nothing and make tea.","tag":"ok","you":-8,"them":0,"outcome":"The kettle is the loudest thing in the room.","why":"Going quiet so you can't be turned away is the most expensive move of the morning. You gave up a chance to be seen, and the kettle filled the gap."}]},{"who":"Gran","text":"\u201cOh, new boy! You're too thin. Come, come, I've made flattened rice.\u201d","cue":"stairwell, 8:15, her door open. You have twenty minutes to make the bus.","lines":[{"text":"\u201cI'm late, Gran, sorry!\u201d (keep walking)","tag":"ok","you":-2,"them":-5,"outcome":"Her door stays open, but her smile goes. \u201cLate, late, always late,\u201d she tells the stairs.","why":"Walking past a warm nod in a hurry lands as a cold one. You were polite about the bus, but she heard only that the flattened rice could wait."},{"text":"Stop at the door. \u201cI can't today, but I'd love to on Saturday. Keep some for me?\u201d","tag":"best","you":4,"them":8,"outcome":"\u201cSaturday it is. And eat something!\u201d","why":"You said no to today and yes to Saturday, so she still gets to feed you. A no that comes with a yes keeps the nod flowing."},{"text":"Go in and eat. Miss the bus and arrive 25 minutes late.","tag":"ok","you":-10,"them":10,"outcome":"Her kitchen smells of ginger, and the bus leaves without you. You reach Halden 25 minutes late.","why":"The warm nod was real, and it cost you your own time. Keep that in mind, because the cost comes back later in the week.","flags":["late_day1"]}]},{"who":"Halden reception","text":"\u201cName?\u201d She prints the badge. \u201cFourth floor.\u201d","cue":"9:35. No eye contact. The screen takes most of her attention.","lines":[{"text":"\u201cThanks. Fourth floor, got it.\u201d","tag":"best","you":-2,"them":3,"outcome":"Her eyes flick up for a second. Nothing else, but a second is something.","why":"Thanking her costs nothing and gets a flicker back. The drain still happens here, because you can't pull a nod out of a screen."},{"text":"Take the badge in silence.","tag":"ok","you":-4,"them":0,"outcome":"The badge goes on the lanyard. Four more points gone without a word.","why":"Taking the badge without a word is what almost everyone does. It keeps the desk moving and leaves you a little lower."}]},{"who":"Daniel","text":"\u201cYou're the new backend hire. Good. Omar will show you the repo. Standup's at ten, don't be late to it, I hate that.\u201d","cue":"not standing, not looking up. If you came in late, he adds \u201c\u2026and you already were.\u201d","lines":[{"text":"\u201cGot it.\u201d","tag":"ok","you":-2,"them":0,"outcome":"He's already back on his screen.","why":"Got it is correct and flat. Nothing is offered back, so nothing comes back."},{"text":"\u201cThanks, I'm looking forward to it. Anything you want me to read before standup?\u201d","tag":"best","you":3,"them":4,"outcome":"He looks up, surprised. \u201c\u2026The incident log. Nobody reads it.\u201d","why":"Asking for something he knows about gives him a chance to be the expert, and that earns a real answer."},{"text":"\u201cSorry, sorry, won't happen again.\u201d (said whether or not you were late)","tag":"ok","you":-6,"them":0,"outcome":"He frowns. \u201cWon't what happen?\u201d","why":"Saying sorry for nothing hands him a fault he never named. He frowns because he doesn't know what you mean."}]},{"who":"Clara","text":"\u201c...\u201d","cue":"canteen, 13:10. Six tables. Clara is alone at one, laughing at her phone. The others are full of people who already know each other.","lines":[{"text":"Sit alone and eat fast.","tag":"ok","you":-6,"them":0,"outcome":"You finish in twelve minutes, and nobody asks where you went.","why":"Eating alone with a free seat in view is a way of not being looked at. It feels safe, and it is the same as being invisible."},{"text":"\u201cMind if I? I don't know anyone yet.\u201d","tag":"best","you":6,"them":7,"outcome":"\u201cOh thank god, someone newer than me.\u201d She looks up for the first time.","why":"Admitting you're new is a small, true thing to say, and it gets a warm nod back.","flags":["clara_lunch"]},{"text":"Join the big table without asking.","tag":"ok","you":-3,"them":-3,"outcome":"Two people shift along to make room. Nobody introduces themselves.","why":"Sitting down without a word puts you in a conversation you weren't asked into. Everyone makes room, and nobody makes you welcome."}]},{"who":"Mum","text":"\u201cDid you eat? Your father says you should have taken the offer from the other city. I told him you know what you're doing. Did you eat?\u201d","cue":"phone, your room, 22:30, the door shut","lines":[{"text":"\u201cI ate, Mum. It was a long day. I'm fine.\u201d","tag":"ok","you":-3,"them":0,"outcome":"\u201cFine, fine. Everyone's fine. Sleep.\u201d The call ends in forty seconds.","why":"The answer is true and closes the door. She got a report, not a conversation, so the nod doesn't land."},{"text":"\u201cThe truth is, nobody really talked to me today. It was weird.\u201d","tag":"best","you":8,"them":6,"outcome":"A pause. \u201c\u2026First days are like that. Your father's first day at the mill, he came home and sat on the step for an hour.\u201d","why":"Saying the true thing gets the first real nod of the day. It is small and late, but it reaches her.","flags":["ma_open_1"]},{"text":"\u201cMum, I'm 27. You don't have to ask if I ate every day.\u201d","tag":"ok","you":-2,"them":-8,"outcome":"\u201cI'll stop asking, then.\u201d","why":"That line may be true, but it shuts the door. She loses the one thing she can still do from far away, and you lose a nod."}]}],"fallout":{"you":"You run out. You eat standing up and skip the call, and the day closes on an empty screen."},"example":"A new hostel in a new city.<br>Day one, the warden says hello and asks your name. By day ten the corridor has stopped looking up."},{"type":"scene","title":"Monday, 18:05, the way home","setting":"The day is nearly over, and four people stand between Halden and your bed. Each of them has a nod to spare if you give them a reason. The You meter starts at 50.","meters":{"you":50,"them":50},"beats":[{"who":"Halden reception","text":"\u201cNight.\u201d","cue":"18:05. Same woman, same flat voice, coat half on. This time she looks up at you.","lines":[{"text":"\u201cNight. Thanks for sorting my badge this morning.\u201d","tag":"best","you":3,"them":5,"outcome":"A short laugh. \u201cMind the lift on four, it sticks.\u201d","why":"Naming one thing she did tells her it was seen. A nod you hand over tends to come back, and hers is warmer than the one she gave you at 9:35."},{"text":"\u201cNight.\u201d","tag":"ok","you":-1,"them":0,"outcome":"The door swings shut behind her. Even, and no more.","why":"You matched her word for word. A matched hello keeps things square and adds nothing."},{"text":"Look at your phone and walk past.","tag":"ok","you":-5,"them":-4,"outcome":"She says it again, to your back and a little flatter. \u201cNight.\u201d","why":"She gave you a nod and got none back. People notice that straight away."}]},{"who":"Omar","text":"\u201cRepo's a mess, right? Everyone says sorry on day one.\u201d","cue":"18:20, by the lift on four, bag on one shoulder, grinning at his phone.","lines":[{"text":"\u201cIt is. I lost an hour in the build folder. Is it always like that?\u201d","tag":"best","you":4,"them":5,"outcome":"He pockets the phone. \u201cAlways. I'll draw you a map tomorrow.\u201d","why":"You told him one small true thing and asked for his help. Admitting you struggled gives him a nod to hand over, and he hands it over."},{"text":"\u201cYeah, a bit.\u201d","tag":"ok","you":-2,"them":0,"outcome":"He nods. The lift comes, and you ride down watching the floor numbers.","why":"True and flat. Nothing gets offered, so nothing comes back."},{"text":"\u201cI think I got everything wrong today.\u201d","tag":"ok","you":-3,"them":2,"outcome":"\u201cYou didn't. Stop it.\u201d He means it kindly, and it is over in a breath.","why":"Fishing for comfort gets a quick, polite answer. It is a nod, though a thin one, and he only gave it because you asked."}]},{"who":"Sam","text":"\u201cOh. Hey. Sorry about this morning, I'm not a person before ten.\u201d","cue":"3B kitchen, 19:10. Noodles in the pan, headphones round his neck for once.","lines":[{"text":"\u201cNo worries. Is there anything about this flat I should know?\u201d","tag":"best","you":5,"them":6,"outcome":"He puts the fork down. \u201cYeah. Don't use the blue towel. And the boiler hates Mondays.\u201d","why":"Asking for something only he knows gives him a nod to give, and he gives you more than you asked for."},{"text":"\u201cDon't worry about it.\u201d","tag":"ok","you":-1,"them":1,"outcome":"\u201cCool.\u201d He goes back to the noodles.","why":"Kind, and it closes the topic. The nod you gave him was real, and the one you got back is tiny."},{"text":"Take your tea to your room without a word.","tag":"ok","you":-7,"them":0,"outcome":"Your door clicks. A moment later you hear his headphones go back on.","why":"Slipping away protects you from a cold reply, and it costs you the warm one he was holding out. It is the biggest drain of the evening."}]},{"who":"Gran","text":"\u201cYou haven't forgotten Saturday, have you? Eleven o'clock.\u201d","cue":"3B front door, 20:30. She has climbed the stairs with a covered plate.","lines":[{"text":"\u201cEleven on Saturday. I wrote it on my hand.\u201d (hold it up)","tag":"best","you":4,"them":7,"outcome":"She laughs and presses the plate into your hands. \u201cEat it hot!\u201d","why":"A small proof that you listened is worth more to her than a promise. It earns the warmest nod of the evening, and a hot dinner."},{"text":"\u201cI'll try to make it.\u201d","tag":"ok","you":-3,"them":-4,"outcome":"\u201cTry, try.\u201d She sets the plate on the table, and the smile stays on her mouth only.","why":"A hedge in answer to a warm invitation reads as cold. She asked for a yes and got a maybe."},{"text":"\u201cGran, you really don't have to feed me.\u201d","tag":"ok","you":-4,"them":-6,"outcome":"\u201cOf course I don't have to,\u201d she says, and the plate is on the table before you finish.","why":"Waving off a warm nod tells her it was not wanted. She keeps giving, and you take less than she gave."}]}],"example":"A shared lift at the end of a long shift.<br>\u201cNight!\u201d \u201cNight. Thanks for covering the desk.\u201d<br>Two short lines, and both people walk out lighter."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"Nothing bad happened all day, and you still ran out of steam by night. What explains it?","options":["You were late, and everyone was cross with you","Few people gave you nods, and a person runs low without them","You talked too much on the bus and tired yourself out"],"answer":1,"why":"Being noticed is a need. Most of the day had nothing for you, and cold nods still counted. A day with almost none drains you the way a day without food does.","traps":{"0":"Lateness explains one bad moment, but nobody was angry with you all day. Blaming it would have you apologising to everyone, which is one more drain.","2":"Talking on the bus is a guess with no evidence behind it. You barely talked to anyone all day, and that is the problem."},"example":"A class reunion, a week later.<br>Two old classmates say hello and go back to their drinks.<br>You drive home tired. Nobody was rude, and nobody looked for you either."}]}],"debrief":{"nadia":"Being noticed is food. A day without it drains you the way a day without food does. Daniel's \u201cdon't be late\u201d counted, and so did the receptionist saying \u201cName?\u201d. Cold nods are still food, so count them too.","bookTerm":"Stroke","bookNote":"The books call this a stroke: any sign that someone noticed you exist, from a hello to a glare, and people need a steady supply of them to stay well."},"reflection":{"prompt":"Think about the last week. Which person noticed you most, and did you let them?"},"next":"1.2","baseStory":{"setting":"Home & Flatmates","blurb":"A new flatmate's first Monday, full of small greetings and silences, and the tiredness that follows."},"moreStories":[{"setting":"Relationships","blurb":"Two days after a second date, a text sits unanswered and you are watching the silence closely.","opener":{"setting":"Monday, 8:40am. Halden, the team room. Two days after the second date, and your text is still unread.","lines":[{"who":"Clara","text":"\u201cMorning.\u201d","cue":"eyes on the screen, bag already on the chair beside her"},{"who":"You","text":"\u201cMorning. Good weekend?\u201d","cue":"standing there with your coat still on"}],"ask":"Nothing bad has happened yet, so why does the day already feel like it is draining you?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each card is one line from this week. Tap what it was: a <b>warm nod<\/b>, a <b>cold nod<\/b>, or nothing at all.","items":[{"type":"pick","who":"Clara","text":"\u201cMorning.\u201d","cue":"team room, Monday 8:40. She says it to her screen, two days after the second date.","options":["A warm nod","A cold nod","Nothing at all"],"answer":1,"why":"A cold nod. One flat word, so she knows you are there and answered you. It is thin, and it still counts as her registering you.","traps":{"0":"A warm nod would mean she was glad to see you, and her eyes stay on the screen. Reading it as warm sets you up to wait for a smile that is not coming.","2":"Nothing at all would mean she let you walk past without a word. She did say one, and calling it nothing makes the morning look worse than it was."},"example":"A bus stop, 7:40am.<br>You say \u201cMorning\u201d to a neighbour you went for a walk with on Saturday.<br>\u201cMorning.\u201d She keeps reading her phone. She has seen you, just not warmly."},{"type":"pick","who":"Your phone","text":"\u201cDelivered. Saturday, 23:42.\u201d","cue":"under your text 'Home safe, thanks for tonight', still no reply.","options":["A warm nod","A cold nod","Nothing at all"],"answer":2,"why":"Nothing at all. A message that sits unanswered for two days is a nod that never arrived, and that is what the silence costs. There is no word to hold on to, warm or cold.","traps":{"0":"A warm nod needs someone to send it. Nothing came back, so calling it warm has you answering a reply that does not exist.","1":"A cold nod would be a short, flat answer. A flat answer is at least an answer, and this has not got that far."},"example":"A shared fridge note.<br>You write \u201cBack Friday, did you want anything?\u201d and nobody replies.<br>The note hangs there and tells you nothing, which is its own kind of answer."},{"type":"pick","who":"Sam","text":"\u201cYou look terrible. Pint after work. I'll tell you what I think and you'll hate it.\u201d","cue":"text from your oldest friend, 10:55, between meetings.","options":["A warm nod","A cold nod","Nothing at all"],"answer":0,"why":"A warm nod, even though it sounds like an insult. Sam notices you look rough and puts an evening aside for you. The bluntness is how he cares.","traps":{"1":"A cold nod would be a short, flat reply with no interest in it. Sam offers a whole evening, so cold reads him too harshly.","2":"Nothing at all would mean he had not looked at you. He saw the state you were in and wrote it down."},"example":"A group chat for a cousin's wedding.<br>\u201cYou looked shattered at the rehearsal. Come round, I'll feed you.\u201d<br>The first half sounds rude. The second half is why he wrote it."},{"type":"pick","who":"Daniel","text":"\u201cClara says you've got the release notes. Four o'clock.\u201d","cue":"corridor, 14:10. He does not stop walking.","options":["A warm nod","A cold nod","Nothing at all"],"answer":1,"why":"A cold nod. Daniel registered you with a job and a deadline, and nothing warm came with it. It does tell you something new: Clara has been talking about you to him.","traps":{"0":"A warm nod would mean he was glad to see you, and he never slowed down. The warmth in this line is Clara's name, which he did not mean as a gift.","2":"Nothing at all would mean he walked past without a word. He used your name and gave you a task, which is more than nothing."},"example":"A school corridor.<br>A teacher says \u201cMr Hale wants your form by Friday\u201d as she passes.<br>It is a small order. The child still knows two people are thinking of him."},{"type":"pick","who":"Clara","text":"\u201cRelease notes proofed. Two typos, fixed. C.\u201d","cue":"a yellow sticky note on your monitor, 15:40. You were in a meeting.","options":["A warm nod","A cold nod","Nothing at all"],"answer":0,"why":"A warm nod. Clara does not say nice things to your face, she does something useful and signs it with one letter. For her, doing your typos is the kind word.","traps":{"1":"A cold nod would be a bare instruction with nothing done for you. She took time out of her afternoon to fix your mistakes.","2":"Nothing at all would mean you had no sign that anyone thought of you. A note with her initial on it is a sign."},"example":"A shared kitchen.<br>You come home to a note: \u201cFixed the dripping tap. M.\u201d<br>No kiss, no joke. It still says someone thought about you while you were out."}]},{"level":"Play","label":"Play, the week in motion","intro":"The day, then the walk home. Each beat gives you two or three things to say. Watch the <b>You<\/b> meter. It drains whenever nobody notices you.","items":[{"type":"scene","title":"Tuesday, 8:40 to 22:30","setting":"Six places in one day: the kitchen by the lifts, your desk, a pub, the review, a bus seat and your flat. The You meter starts at 70.","meters":{"you":70,"them":50},"beats":[{"who":"Clara","text":"\u201cTea's on the side. I made too much.\u201d","cue":"kitchen by the lifts, 8:40. She talks to the kettle, not to you.","lines":[{"text":"Take the mug. \u201cThanks.\u201d (and go)","tag":"ok","you":-3,"them":0,"outcome":"She nods at the kettle. You are three steps down the corridor before the tea is cool enough to drink.","why":"Polite and safe, and it keeps the question unasked. You walk away with the same worry you came with."},{"text":"\u201cThanks. Saturday was good for me. Was it for you?\u201d","tag":"best","you":5,"them":4,"outcome":"She stirs for a few seconds longer than tea needs. \u201cYes. The soup was too salty, but yes.\u201d","why":"Asking one plain question, with your own answer first, gives her an easy way in. Her joke about the soup is the answer she can manage."},{"text":"\u201cDid you get my text on Saturday?\u201d","tag":"ok","you":-2,"them":-5,"outcome":"\u201cI've been busy.\u201d She is suddenly very interested in a teaspoon.","why":"A fair question, but it sounds like a charge. It makes her defend herself instead of telling you anything."}]},{"who":"Sam","text":"\u201cSo? Did she answer? Don't lie, I'll know.\u201d","cue":"your phone, 10:55. Sam, who has an opinion about everything and tells it to you.","lines":[{"text":"\u201cIt's fine. Don't start.\u201d","tag":"ok","you":-2,"them":-4,"outcome":"\u201cRight. Pint at six or not?\u201d He is smiling, but his thumbs are slower.","why":"Waving him off protects you from his opinion and costs you the person who is offering to listen."},{"text":"\u201cShe made me tea. That's all so far. Pint at six?\u201d","tag":"best","you":4,"them":6,"outcome":"Sam sends back a photograph of a pint glass and \u201cSix. Wear shoes.\u201d","why":"Telling him the small true thing lets him help. He gets to be useful and you get an evening with someone on your side."},{"text":"\u201cBusy, talk later.\u201d","tag":"ok","you":-3,"them":0,"outcome":"The tick next to your message turns blue and stays quiet. He does not ask again.","why":"Closing the thread keeps your business to yourself and makes the afternoon lonelier."}]},{"who":"Daniel","text":"\u201cRelease is Thursday. Clara and you share the checklist. Any reason that's a problem?\u201d","cue":"stand-up circle, 11:30. Pen tapping on his clipboard.","lines":[{"text":"\u201cWhy would it be?\u201d","tag":"ok","you":-2,"them":-3,"outcome":"\u201cI didn't say it would be. I asked.\u201d He writes something down.","why":"Answering a question with a question sounds guarded. He asked the plain thing and got a dodge."},{"text":"\u201cFine.\u201d","tag":"ok","you":-4,"them":0,"outcome":"He nods and moves to the next person. The word sits there a moment.","why":"One word keeps it safe. You also give him nothing to work with, and Clara hears you skip her too."},{"text":"\u201cNo problem. We'll split it by who's free each hour.\u201d","tag":"best","you":3,"them":4,"outcome":"\u201cGood. Put it on the board.\u201d He is already writing your names.","why":"A plain, practical answer lets Daniel treat you both as colleagues. It also tells Clara in public that you are happy to work with her."}]},{"who":"Clara","text":"\u201cI found a bug in your branch. Three, actually. I fixed two.\u201d","cue":"your desk, 15:20, a printout in her hand, arms folded, a little proud.","lines":[{"text":"\u201cYou didn't need to do that.\u201d","tag":"ok","you":-3,"them":-5,"outcome":"\u201cNo. I know.\u201d She takes the printout back and holds it against her chest.","why":"Brushing off a gift tells her it was not wanted. Her only way of saying something kind just got sent back."},{"text":"\u201cThank you. That would have cost me my evening. You're quick.\u201d","tag":"best","you":5,"them":6,"outcome":"She looks at the printout, not at you. \u201cIt was the easy kind.\u201d The corner of her mouth moves.","why":"Naming what she saved you is a compliment she has earned, so she can take it. Saying something specific lands better than saying she is nice."},{"text":"\u201cSorry, I should have checked.\u201d","tag":"ok","you":-4,"them":0,"outcome":"\u201cIt happens.\u201d She puts the printout on your desk and leaves.","why":"An apology turns her help into a telling-off. She only wanted you to see it."}]},{"who":"Sam","text":"\u201cYou haven't told her you like her. You've told her the soup was good.\u201d","cue":"the pub, 18:40, a bowl of crisps between you. He says it while chewing.","lines":[{"text":"\u201cYou don't know her.\u201d","tag":"ok","you":-3,"them":-5,"outcome":"\u201cNo. I know you.\u201d He pushes the crisps over and says nothing for a minute.","why":"Snapping at an honest friend ends the honesty. He stops saying the true thing because you flinched."},{"text":"\u201cPass the crisps.\u201d (laugh and change the subject)","tag":"ok","you":-2,"them":0,"outcome":"He laughs, but his eyes stay on you a beat longer than the joke needed.","why":"A laugh gets you out of the room. He saw you do it, and the point he made is still sitting there."},{"text":"\u201cProbably. I'll say it, in my words, not yours.\u201d","tag":"best","you":4,"them":5,"outcome":"\u201cThat's all I ask.\u201d He clinks his glass against yours.","why":"Agreeing with a blunt friend, and keeping the words your own, gets his help without handing him the script."}]},{"who":"Clara","text":"\u201cSorry. My phone died on Saturday and I only found your text today. I liked it too. Don't make it weird.\u201d","cue":"your phone, 22:30. Three dots appeared and vanished twice before it arrived.","lines":[{"text":"\u201cWhy did it take three days?\u201d","tag":"ok","you":-2,"them":-8,"outcome":"The dots appear and vanish. She does not answer tonight.","why":"You were right to feel the gap. Pressing on it now punishes her for telling you."},{"text":"\u201cHa, okay. Night.\u201d","tag":"ok","you":-3,"them":0,"outcome":"She replies with a single moon. The conversation ends there.","why":"Friendly and safe. It leaves the next move to her, and she is the one who has trouble making it."},{"text":"\u201cNot weird. Thursday after the release, a proper dinner? I'll book.\u201d","tag":"best","you":8,"them":7,"outcome":"Her reply arrives in seconds. \u201cYes. Book somewhere with soup that isn't salty.\u201d","why":"A plain invitation with a day and a plan is easy for her to say yes to. You asked clearly, which is what she cannot do."}]}],"fallout":{"you":"You run out. You eat standing up and put your phone face-down, and the evening closes on an empty screen."}},{"type":"scene","title":"Wednesday, 18:05, the way home","setting":"Four people stand between your desk and your bed, and each one has a nod to spare if you give them a reason. The You meter starts at 50.","meters":{"you":50,"them":50},"beats":[{"who":"Clara","text":"\u201cI'm off early. Dentist.\u201d","cue":"the lift on four, 18:05. Coat on, but she is not pressing the button.","lines":[{"text":"\u201cGood luck. Text me when it's done? I'd like to know how it goes.\u201d","tag":"best","you":3,"them":5,"outcome":"\u201cOkay.\u201d She presses the button at last. \u201cI'll send a picture of my gum.\u201d","why":"Asking to hear back tells her you want to be told. She does not have to guess whether you care."},{"text":"\u201cOkay.\u201d","tag":"ok","you":-1,"them":0,"outcome":"The lift arrives. She steps in and looks at her shoes.","why":"A flat answer to a line that was half an opening. Her chance to say more goes with the lift."},{"text":"Look at your screen and wave a hand.","tag":"ok","you":-5,"them":-4,"outcome":"The doors close on her face.","why":"Not looking up tells her it does not matter. She notices, and she does not say so."}]},{"who":"Mum","text":"\u201cGran says you were whistling in the stairwell. Who is she?\u201d","cue":"phone on the bus, 18:30. Mum, who has been briefed by Gran.","lines":[{"text":"\u201cNobody, Mum.\u201d","tag":"ok","you":-3,"them":-3,"outcome":"\u201cMm.\u201d She lets the silence say what she thinks of that.","why":"A shut door to someone who already knows. She has the facts, and now she has your closed face as well."},{"text":"\u201cMum, I'm a grown man.\u201d","tag":"ok","you":-2,"them":-8,"outcome":"\u201cI know that.\u201d Her voice goes small. \u201cI only asked.\u201d","why":"Protecting your privacy by pushing her away costs you her warm side. She asked because she is pleased."},{"text":"\u201cSomeone I like. If she'll come, I'll bring her one Sunday.\u201d","tag":"best","you":6,"them":7,"outcome":"Mum goes quiet, then asks what she eats. It is the warmest question she has asked all month.","why":"Giving a small, true answer lets Mum be glad with you. A bit of it will go round the family by Sunday, and that is fine."}]},{"who":"Sam","text":"\u201cDid you say it? Or did you say 'the soup was good' again?\u201d","cue":"3B hallway, 19:10. He has let himself in with the spare key.","lines":[{"text":"\u201cNot yet. Thursday. Tell me if I get it wrong.\u201d","tag":"best","you":5,"them":6,"outcome":"\u201cDeal.\u201d He holds out a fist. \u201cIf you get it wrong, I'll tell you kindly. Probably.\u201d","why":"Asking him to catch you out gives his honesty a job. He gets to be useful, and you stay in charge of what gets said."},{"text":"\u201cMind your own business.\u201d","tag":"ok","you":-4,"them":-6,"outcome":"He takes the key off the hook and puts it in his pocket. He goes without finishing his tea.","why":"A hard stop works for tonight and costs you a friend who tells you true things."},{"text":"\u201cMostly.\u201d (and put the kettle on)","tag":"ok","you":-1,"them":1,"outcome":"\u201cMostly,\u201d he says. \u201cRight.\u201d He sits and lets the kettle do the work.","why":"Half an answer is fair, and it gives him half a friend to talk to."}]},{"who":"Clara","text":"\u201cDentist cancelled the filling. Free evening, no plan. Sorry, short notice. Ignore if you're busy.\u201d","cue":"your phone, 21:50. She wrote the last line, deleted it, and sent it anyway.","lines":[{"text":"\u201cShort notice for me, sorry.\u201d","tag":"ok","you":-4,"them":-6,"outcome":"The reply is a thumbs-up, and it lands with a small, sad weight.","why":"She gave you the exit herself and you took it. Her offer was braver than it looked."},{"text":"\u201cSure.\u201d","tag":"ok","you":-1,"them":1,"outcome":"She sends a time and an address. The conversation is flat but it works.","why":"An easy yes. The 'sure' does not tell her you wanted this, and she will wonder."},{"text":"\u201cI'm free. Come over, I'll cook badly. Or I'll come to you. Your pick.\u201d","tag":"best","you":7,"them":8,"outcome":"\u201cYours. I'll bring the salt.\u201d Three dots, then a small laugh sticker.","why":"Saying plainly that you want her there, and giving her the choice, gives her room to accept. She cannot ask. You can, so you do."}]}],"fallout":{"you":"You run out. The bus rolls past your stop and you let it, and the evening goes to a blank phone."}}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"Clara never said anything unkind, and by Tuesday night you felt flat anyway. What explains it?","options":["Clara is losing interest, and the silence is her way of saying so","You were nervous about the release and it wore you out","Almost no clear nods came your way for two days, and a person runs low without them"],"answer":2,"why":"Being noticed is a need. A missed text, a flat 'Morning' and a sticky note are small nods, and a cold one still counts. A stretch with very few of them drains you the way a long gap without food does, whatever anyone meant.","traps":{"0":"It feels likely, and nothing she did proves it. Clara showed up with tea and typo fixes, which is her version of warm. Acting on the guess would have had you cooling off first.","1":"The release is real, and it is a weaker guess. The flat feeling lined up with the gaps between nods, not with the deadlines."},"example":"A holiday week at a seaside rental.<br>Nobody is unkind, and nobody asks how you slept.<br>By Wednesday you are drained and cannot say why."}]}]},{"setting":"School & College","blurb":"A new evening class, a group project due, and a classmate who is probably about to drop out.","opener":{"setting":"Wednesday, 18:28. Room 9, the community college. Introduction to Electronics, week three.","lines":[{"who":"Mrs Hartley","text":"\u201cGroups of three for the circuit project. Sort yourselves out, I've got the soldering irons to count.\u201d","cue":"not looking up, counting from a cardboard box"},{"who":"Sam","text":"\u201c...\u201d","cue":"back row, coat still on, thumb on his phone and eyes on the door"}],"ask":"Nothing bad has happened yet, so why does the evening already feel like it is draining you?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each card is one line from this week. Tap what it was: a <b>warm nod<\/b>, a <b>cold nod<\/b>, or nothing at all.","items":[{"type":"pick","who":"Mrs Hartley","text":"\u201cHere? Good.\u201d","cue":"Room 9, 18:31. She ticks your name on the register and looks up for half a second.","options":["A warm nod","A cold nod","Nothing at all"],"answer":1,"why":"A cold nod. She registered you with a tick and two words, and nothing in it was aimed at you in particular. A tick on a list is a thin nod and it still counts.","traps":{"0":"A warm nod would be someone glad you came. She ticked eleven names the same way, so warm reads too much into it.","2":"Nothing at all would mean she skipped your name. She called it, looked up and wrote it down."},"example":"A doctor's waiting room.<br>The receptionist says \u201cSurname?\u201d without looking up and ticks a sheet.<br>It is brisk and it is a nod. She knows you came."},{"type":"pick","who":"Dennis","text":"\u201cYou look like someone who's lost a screwdriver. Sit here. I've got a spare.\u201d","cue":"front row, 18:33. He pats the stool next to him with a big, freckled hand.","options":["A warm nod","A cold nod","Nothing at all"],"answer":0,"why":"A warm nod. Dennis noticed that you looked lost and made a place for you without being asked. The joke is how he says he is glad you came.","traps":{"1":"A cold nod would be a bare 'Sit' with no interest in you. He made a joke, offered a tool and moved a stool.","2":"Nothing at all would mean he let you hover. He looked at you and spoke."},"example":"A choir rehearsal.<br>\u201cYou look like you need a sheet of music. Share mine.\u201d<br>A stranger moves along the bench and the new voice has a place."},{"type":"pick","who":"Class chat","text":"\u201c(your message) Hi all, I'm in the Wednesday group. Anyone want to pair up for the project?\u201d","cue":"the class group chat, sent Monday 21:15. Two ticks, no replies.","options":["A warm nod","A cold nod","Nothing at all"],"answer":2,"why":"Nothing at all. A question to eleven people that nobody answers is a nod that did not come. There is no word to be warm or cold about, which is why it stings.","traps":{"0":"A warm nod needs a reply. The chat has none, so calling it warm has you thanking people who have not spoken.","1":"A cold nod would be a flat 'maybe' from someone. Nobody has said even that."},"example":"A neighbourhood noticeboard.<br>You pin up \u201cAnyone fancy a walk on Sunday?\u201d and a week later it still says only that.<br>The paper hangs there and nobody wrote on it."},{"type":"pick","who":"Sam","text":"\u201cSeat's free.\u201d","cue":"back row, 18:50. He nudges his bag off the chair, eyes on his phone.","options":["A warm nod","A cold nod","Nothing at all"],"answer":1,"why":"A cold nod. Sam made room, and that is real, and he did it without looking up or smiling. He is a man with one foot out of the door, and this is the most he can manage tonight.","traps":{"0":"A warm nod needs him to look at you. His eyes stay on his phone, and warm would be a guess.","2":"Nothing at all would be a bag left on the chair. He moved it, and that counts."},"example":"A packed train.<br>A man shifts his bag off the seat without a word and goes back to his window.<br>It is small and it was meant for you."},{"type":"pick","who":"Joanne","text":"\u201cYou drew that? Brilliant. Can I copy how you laid it out?\u201d","cue":"the feedback sheets, 20:05. She holds your diagram up to the light.","options":["A warm nod","A cold nod","Nothing at all"],"answer":0,"why":"A warm nod. She noticed what you made and asked to learn from it, which is a compliment with a request attached. She wants a bit of what you have.","traps":{"1":"A cold nod would be 'Fine, that works' and nothing more. She held your page up and asked for more.","2":"Nothing at all would mean she glanced and moved on. She stopped, looked and talked about it."},"example":"A knitting circle.<br>\u201cThat stitch is lovely. Show me?\u201d<br>Someone you barely know has picked out the one thing you did well."}]},{"level":"Play","label":"Play, the week in motion","intro":"The day, then the walk home. Each beat gives you two or three things to say. Watch the <b>You<\/b> meter. It drains whenever nobody notices you.","items":[{"type":"scene","title":"Wednesday, 17:40 to 22:30","setting":"Evening class, Introduction to Electronics, Room 9 at the community college. Six moments in one night. The You meter starts at 70.","meters":{"you":70,"them":50},"beats":[{"who":"Dennis","text":"\u201cIs it the circuit project you're dreading? Everyone is. You're in good company.\u201d","cue":"the corridor outside Room 9, 18:20, a flask under his arm.","lines":[{"text":"\u201cA bit. I can't solder to save my life.\u201d","tag":"ok","you":-1,"them":2,"outcome":"\u201cNobody can,\u201d he says kindly. \u201cThat's why we're here.\u201d","why":"True, and it keeps the door half open. He gives you a kind line and waits to see if you will say more."},{"text":"\u201cDreading it. Do you want to team up?\u201d","tag":"best","you":5,"them":6,"outcome":"Dennis beams. \u201cI thought you'd never ask. I'm hopeless at drawings, you are not.\u201d","why":"Saying you are worried and asking him in one breath gives him a job and a reason to say yes. A plain ask is easy to meet."},{"text":"\u201cIt's fine, I'll manage.\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cRight you are.\u201d He moves along the corridor and holds the door for someone else.","why":"Sounding fine shuts the one person who was offering. You walk in alone with the dread still in your pocket."}]},{"who":"Mrs Hartley","text":"\u201cYour diagram: clear. Your spelling of 'resistor': creative.\u201d","cue":"handing back the feedback sheets, 18:50, smiling at the page rather than at you.","lines":[{"text":"\u201cIt was a rush job.\u201d","tag":"ok","you":-4,"them":-3,"outcome":"\u201cI could tell,\u201d she says. Her smile closes a little.","why":"Explaining it away turns her praise into a point to argue. You miss that she told you the diagram was clear."},{"text":"\u201cSorry, I'll fix it.\u201d","tag":"ok","you":-3,"them":0,"outcome":"\u201cDo.\u201d She moves on to the next sheet.","why":"A quick apology is safe. It also skips the part where she said your diagram worked."},{"text":"\u201cHa, thanks. Which part of the diagram worked?\u201d","tag":"best","you":4,"them":5,"outcome":"She taps the page. \u201cThe way the power flows left to right. Keep doing that.\u201d","why":"Laughing at the joke and then asking what she liked gets you more of the nod. She now knows you want to hear what worked."}]},{"who":"Sam","text":"\u201cI'm probably not coming next week. It's the shift pattern.\u201d","cue":"the break, 19:20. Coat already on, eyes on the door.","lines":[{"text":"\u201cThat's a shame.\u201d","tag":"ok","you":-2,"them":0,"outcome":"He nods, looks at the door and leaves a minute early.","why":"Kind and brief, and it lets him go without a reason to stay."},{"text":"\u201cYou said that last week too.\u201d","tag":"ok","you":-3,"them":-6,"outcome":"\u201cYeah.\u201d His face closes. \u201cWell.\u201d He picks up his bag.","why":"True, and said like a charge. He came to say goodbye and heard that he had been counted."},{"text":"\u201cSorry to hear that. Your joints were the neatest at our table. I can send you my notes if you want them.\u201d","tag":"best","you":5,"them":6,"outcome":"\u201cHonest?\u201d He sits back down. \u201cGo on, then. What was neat?\u201d","why":"One specific, true thing about his work gives him a reason to care that he might lose the class. A nod can pull a person back who is on the way out."}]},{"who":"Joanne","text":"\u201cWe're a third short. Dennis said you might join us.\u201d","cue":"the front bench, 19:50. She slides her notebook along the table.","lines":[{"text":"\u201cIf nobody else is free.\u201d","tag":"ok","you":-4,"them":-4,"outcome":"\u201cSure,\u201d she says, and writes your name small, near the bottom.","why":"Offering to be a fallback makes you the last choice before she even picks. She hears the hedge and shrinks the ask."},{"text":"\u201cOh, I'm probably with Sam, I think.\u201d","tag":"ok","you":-3,"them":-3,"outcome":"\u201cHe's not coming next week,\u201d she says gently. \u201cThink again?\u201d","why":"Staying loyal to someone half out of the door is kind, and it costs you the invitation that was actually on the table."},{"text":"\u201cYes please. I'm better at the drawing than the soldering.\u201d","tag":"best","you":5,"them":6,"outcome":"\u201cPerfect,\u201d she says. \u201cThat's the job nobody wants.\u201d","why":"Saying yes and naming what you can do makes you worth having. A plain yes lets her relax."}]},{"who":"Mrs Hartley","text":"\u201cHand it in by the 14th. Leave it on my desk. I've lost two already.\u201d","cue":"packing up, 21:00. She is counting soldering irons into a box.","lines":[{"text":"\u201cWill do.\u201d","tag":"ok","you":-1,"them":0,"outcome":"She clicks the box shut. The room is nearly empty.","why":"A fine reply to a short instruction. You have not made yourself memorable."},{"text":"\u201cI'll bring ours in on the 12th and tick my name on your list.\u201d","tag":"best","you":3,"them":4,"outcome":"She looks up for the first time tonight. \u201cTick it in pen.\u201d","why":"A small plan with a date makes her task lighter and tells her you are reliable. Warmth from a busy person often looks like this."},{"text":"Nod and slip out without a word.","tag":"ok","you":-5,"them":-3,"outcome":"Your footsteps echo in the corridor. She does not look up.","why":"Leaving unseen is easy and it adds to the quiet you came in with."}]},{"who":"Joanne","text":"\u201cLibrary Saturday, ten? I'll bring the biscuits.\u201d","cue":"your phone, 22:15. She sent the biscuit emoji first, then the words.","lines":[{"text":"\u201cMaybe. I'll check my week.\u201d","tag":"ok","you":-3,"them":-4,"outcome":"\u201cSure, let me know.\u201d The biscuit emoji looks lonely.","why":"A maybe to a clear offer reads as cold. She asked for a yes and got a diary."},{"text":"\u201cCan't do ten. Send me the notes after?\u201d","tag":"ok","you":-4,"them":-6,"outcome":"A thumbs-up. The next message is addressed to the group, not to you.","why":"Opting out of the meeting hands your share to everyone else. You also lose the biscuits and the table."},{"text":"\u201cYes. I'll bring the diagram and a printed copy of everything.\u201d","tag":"best","you":6,"them":6,"outcome":"\u201cYou printed it? Dennis will cry.\u201d A row of biscuit emoji follows.","why":"A plain yes, with something specific you will bring, shows you take it seriously. Preparing is how you say you care."}]}],"fallout":{"you":"You run out. You eat a sandwich on the bus home and leave the class chat unread, and the evening closes on a dark screen."}},{"type":"scene","title":"Saturday, 9:50, the library","setting":"Table six, the quiet floor, coats on the chairs and a lukewarm radiator. Four people and a deadline. The You meter starts at 50.","meters":{"you":50,"them":50},"beats":[{"who":"Librarian","text":"\u201cTable six is booked until ten fifteen.\u201d","cue":"the desk by the door, 9:50. A badge reading Pauline, a pen she keeps clicking.","lines":[{"text":"\u201cCould we use the space by the window until then?\u201d","tag":"best","you":3,"them":4,"outcome":"She looks at the window, then at you, then waves a hand. \u201cKeep your voices down.\u201d","why":"Asking for a specific alternative gives her an easy yes. She was following a rule, and you gave her a way to stay inside it."},{"text":"\u201cWe were told ten.\u201d","tag":"ok","you":-2,"them":-4,"outcome":"\u201cAnd I'm telling you ten fifteen.\u201d The pen clicks twice.","why":"Arguing from what you were told turns a booking into a contest. She was only reading her list."},{"text":"Nod and wait by the door.","tag":"ok","you":-3,"them":0,"outcome":"Fifteen minutes feel like fifty. Your coat grows heavy.","why":"Waiting is polite and it spends your first minutes with nothing to give and nobody to talk to."}]},{"who":"Dennis","text":"\u201cI've brought a thermos and a pencil sharpener. Which of these is the bigger help?\u201d","cue":"by the window table, 10:05. He lays both on the desk with some ceremony.","lines":[{"text":"\u201cBoth. The thermos is more important.\u201d","tag":"best","you":4,"them":6,"outcome":"He laughs so loudly that Pauline shushes him from the desk. He pours.","why":"Joining his joke lets him be useful on his own terms. He is a man who gives things away, and he notices if you take them."},{"text":"\u201cI don't drink flask tea.\u201d","tag":"ok","you":-3,"them":-5,"outcome":"\u201cMore for me, then.\u201d He pours it for himself with a small sigh.","why":"Refusing the one thing he came with reads as turning him down. The refusal was about the tea and it landed on him."},{"text":"\u201cThanks, I'm all right.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"He puts the thermos down gently. The offer is still there on the desk.","why":"Polite and closed. He tried to hand you something and was told he did not need to."}]},{"who":"Joanne","text":"\u201cYour layout's been bothering me. Can I change the order of the pages?\u201d","cue":"10:30, a pencil behind her ear, the printout of your diagram in her hands.","lines":[{"text":"\u201cWhatever you think is best.\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cRight.\u201d She starts rearranging, slightly deflated.","why":"Handing it over sounds generous and it leaves you out of the thing you made. She asked your view and got none."},{"text":"\u201cLet me see what you've got in mind. If it reads better, take it.\u201d","tag":"best","you":5,"them":6,"outcome":"She slides the pages across. \u201cLook. The power goes in on the left now, like you said.\u201d","why":"Looking first and judging by the result shows you care about the work. Her idea gets a fair hearing and your name stays on the project."},{"text":"\u201cIt's fine as it is.\u201d","tag":"ok","you":-2,"them":-6,"outcome":"Her pencil goes back behind her ear. \u201cOkay.\u201d She stops looking at the page.","why":"Shutting her idea down is fair and it costs you the co-author. She was trying to help and read a no."}]},{"who":"Sam","text":"\u201cSorry about Wednesday. Is there room for me? I can do the labels.\u201d","cue":"your phone, 11:00. He sent the message, a second one with the word 'labels' in capitals.","lines":[{"text":"\u201cCourse there's room. Come to table six. Bring a pen.\u201d","tag":"best","you":6,"them":7,"outcome":"\u201cBe there in twenty.\u201d A minute later: \u201cIs Dennis there? Tell him I'm sorry about the wiring.\u201d","why":"Saying yes straight away tells him he was missed. People half out of the door often wait to be told they can come back."},{"text":"\u201cWe've got it covered, thanks.\u201d","tag":"ok","you":-4,"them":-8,"outcome":"He sends a thumbs-up. It is the last message from Sam you get on the project.","why":"A reasonable answer from a group that works. It tells him what he needed to know and loses him for good."},{"text":"\u201cYou'd better ask Joanne.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"\u201cOkay.\u201d A long gap. He does not message Joanne.","why":"Passing it on keeps you out of the decision and keeps him at arm's length. He needed someone to say yes, and you were there."}]}],"fallout":{"you":"You run out. You tell the group you have a headache and go home early, and the library door swings shut behind you."}}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"Nobody was rude to you on Wednesday, and you still left the college tired and flat. What explains it?","options":["Almost no one aimed a nod at you, and a person runs low without them","The course is harder than you expected, and the strain wore you out","You are shy, so a room of strangers always costs you more than anyone else"],"answer":0,"why":"Being noticed is a need. In Room 9 a tick on a register, an unanswered chat message and a bag moved off a chair were the thin ones, and Dennis and Joanne were the warm ones. A night with more of the thin than the warm leaves you running low, whatever the soldering was like.","traps":{"1":"The soldering was hard, and the tiredness did not follow it. You were most drained after the minutes with no one speaking to you.","2":"Shy is a label that fits too easily. Dennis and Joanne picked you out in minutes, and you came to life when they did."},"example":"A first week at a new gym.<br>Nobody is unfriendly and nobody learns your name.<br>You get home drained, though the workout was easy."}]}]},{"setting":"Work","blurb":"A reshuffle puts you by the fire door, four steps from the team and a release due on Friday.","opener":{"setting":"Thursday, 9:02am. Halden, the team room. The desks were reshuffled overnight and yours is by the fire door.","lines":[{"who":"Daniel","text":"\u201cDesk plan's on the wiki. Standup in five.\u201d","cue":"eyes on a spreadsheet, already walking"},{"who":"Omar","text":"\u201c...\u201d","cue":"headphones on, a thumbs-up without turning his head"}],"ask":"Nothing bad has happened yet, so why does the day already feel like it is draining you?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each card is one line from this week. Tap what it was: a <b>warm nod<\/b>, a <b>cold nod<\/b>, or nothing at all.","items":[{"type":"pick","who":"Team channel","text":"\u201c(your post) Morning all, I'm at the window desk now.\u201d","cue":"posted 9:03 Thursday. Fourteen people in the channel, no reactions.","options":["A warm nod","A cold nod","Nothing at all"],"answer":2,"why":"Nothing at all. Nobody replied or gave it so much as a tick, and that is what a quiet channel costs. A cold word would at least have been a word.","traps":{"0":"A warm nod needs a person to send it. Calling a blank screen warm has you thanking people who have not spoken.","1":"A cold nod would be one flat 'ok' from someone. The channel gave you not even that."},"example":"A housing association noticeboard.<br>You pin a note: \u201cNew in number 12, hello!\u201d<br>Weeks later it hangs there with no sign anyone read it."},{"type":"pick","who":"Omar","text":"\u201cThe fire door desk! Only one with natural light and a draught. I'll bring you a cardigan.\u201d","cue":"by the printer, 9:20, laughing as he walks past.","options":["A warm nod","A cold nod","Nothing at all"],"answer":0,"why":"A warm nod. Omar noticed where you were moved and made a joke that says he has you in mind. The cardigan is the kind part.","traps":{"1":"A cold nod would be a bare 'new desk then' with nothing else in it. He joked and offered a cardigan.","2":"Nothing at all would mean he walked past without a word. He stopped, looked and talked to you."},"example":"A warehouse.<br>\u201cYou got the cold corner by the loading door. I'll find you a heater.\u201d<br>A colleague has spotted where you ended up."},{"type":"pick","who":"Daniel","text":"\u201cReview's at two. Bring the numbers.\u201d","cue":"walking past your desk, 10:15. He does not slow down.","options":["A warm nod","A cold nod","Nothing at all"],"answer":1,"why":"A cold nod. Daniel registered you with a time and an instruction, and nothing warm came with it. It still counts, since he named you as part of the review.","traps":{"0":"A warm nod would be someone glad to see you. He never slowed, so warm is a guess.","2":"Nothing at all would mean he went past in silence. He told you when and what to bring."},"example":"A school corridor.<br>A teacher on the move says \u201cCoats on, bus at ten\u201d to the whole class.<br>It is brisk and it includes everyone."},{"type":"pick","who":"Clara","text":"\u201cYour ticket landed in my queue by mistake. I moved it back. Fixed a typo in the title while I was there.\u201d","cue":"11:40, typing while she talks, eyes on her screen.","options":["A warm nod","A cold nod","Nothing at all"],"answer":0,"why":"A warm nod. Clara does not say kind things aloud. She spent a few minutes of her morning fixing your title and told you about it. That is how she says she thought of you.","traps":{"1":"A cold nod would be a bare 'wrong queue'. She did more than she needed and told you.","2":"Nothing at all would be a ticket left to rot. She moved it and cleaned it."},"example":"A shared office kitchen.<br>You find your mug washed and left on the rack.<br>No note, no word, and you know exactly who it was."},{"type":"pick","who":"Sam","text":"\u201cYou're the one who broke staging.\u201d","cue":"the kitchen, 12:50. He is from another team, looking at the milk jug, not smiling.","options":["A warm nod","A cold nod","Nothing at all"],"answer":1,"why":"A cold nod. A dig is still a nod, because it means he knows who you are and what you did. It is a bit sharp, and he registered you.","traps":{"0":"A warm nod would be a friendly joke with a smile in it. This one has no smile, so calling it warm is hopeful.","2":"Nothing at all would be a stranger who did not know your name. He knew it and what you did."},"example":"A school staffroom.<br>\u201cYou're the one who parked in the head's space.\u201d<br>It was meant as a jab. Everyone in the room knows who you are now."}]},{"level":"Play","label":"Play, the day in motion","intro":"The day, then the walk home. Each beat gives you two or three things to say. Watch the <b>You
