<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stay Steady Under Pressure · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"7.4","setting":"Home & Flatmates","title":"Stay Steady Under Pressure","world":7,"worldName":"Free to Choose","week":7,"weekName":"Free to Choose","mechanic":"Replay","concept":"After this one you can refuse a game's chair and stay steady while the other person pushes harder, which gives them the chance to see their own pattern.","plainWord":"stepping out","bookTerm":"Antithesis","bookIdea":"Berne's antithesis is a refusal to play, or a move that undercuts the payoff, without any counter-move from another game, and he says the player then tends to push harder, may fall into a bewildered despair, and in a good outcome ends with the laugh of \u201cThere I go again!\u201d","bookSource":"Games People Play, ch. 5 and 11","opener":{"setting":"Monday, 7:50am, Hawthorn Court, apartment 3B, the kitchen. There is milk spread across the tiles under the fridge.","lines":[{"who":"Sam","text":"\u201cMorning. Sorry, the milk got me. Long story.\u201d","cue":"crouched by the fridge with a rag, not looking up"}],"ask":"When someone offers you a chair in their game, what do you do with it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"A game always offers a chair. Tap what each line is doing to you.","items":[{"type":"pick","who":"Sam","text":"\u201cI'm useless. Go on, tell me I'm useless. I deserve it.\u201d","cue":"rag in hand, eyes on you, waiting","options":["A trap: he is holding out a chair","A real question","A plain request"],"answer":0,"why":"He is offering a chair. Call him useless, or rush in and mop it up, and either one seats you in the game.","traps":{"1":"A real question. It sounds like one, but he hasn't asked anything about the milk. He is asking you to say something about him.","2":"A plain request. It sounds like a request, but what he wants is a verdict on himself, and that is the hook."},"example":"Bus stop, by the station, 8:15am.<br>Man: \u201cStory of my life. I always miss the bus. Go on, say it.\u201d<br>Woman: \u201cThe next one's in ten minutes. Shall we check the app?\u201d"},{"type":"pick","who":"Sam","text":"\u201cNobody even wants me in the flat. I'm just the guy who's late, aren't I?\u201d","cue":"not looking up, the rag still in his fist","options":["Saviour: reassure him and mop up","Blamer: agree he's the late one","Stepping out: stay in the room and ask what's going on"],"answer":2,"why":"Both of the first two chairs keep the game running. Stepping out means you refuse each chair and do not grab a new one.","traps":{"0":"Saviour: reassure him and mop up. It feels kind, but the reassurance hands him the role of the one who can't cope. Now you are the helper, and the game keeps going.","1":"Blamer: agree he's the late one. It sounds like plain talk, but agreeing gives the sting its last push, and he leaves sure he is useless."},"example":"School gate, 8:05am.<br>Mum A: \u201cSorry, I'm always late. Go on, tell me off.\u201d<br>Mum B: \u201cNot telling you off. You do bring the best biscuits.\u201d<br>Mum A laughs. \u201cHa. Fair enough.\u201d"},{"type":"pick","who":"Sam","text":"\u201cUgh, there I go again. Always the mess.\u201d","cue":"stopped mid-sweep, looking at the tiles","options":["He is sulking and about to leave","He has seen his own game","He is asking you to take over"],"answer":1,"why":"That is the moment someone sees their own game. Nothing about it needs winning, and nobody has to be the one who was right.","traps":{"0":"He is sulking. It can look the same, since he is quiet and bent over the rag. But sulking doesn't turn the line into a joke at himself.","2":"He is asking you to take over. That is the hook again. The line itself is him stepping back from the hook."},"example":"Cousins' group chat, Thursday.<br>Ella: \u201cSorry, I forgot the snacks again. I'm the worst host here.\u201d<br>Mei: \u201cYou're not the worst. I'll bring them.\u201d<br>Ella: \u201cHa. There I go again.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Refuse each chair as it is offered. The scene stops when the other person sees the pattern.","items":[{"type":"scene","title":"Monday, 7:50am, the kitchen","setting":"Hawthorn Court, apartment 3B. Milk is spreading under the fridge, and Sam has the rag in one hand and his phone in the other.","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cUgh. Sorry, sorry, I'm the worst. Go on, say it. I'm useless.\u201d","cue":"crouched by the fridge, not looking at you","lines":[{"text":"\u201cIt's milk on the floor, Sam. The cloth's under the sink.\u201d","tag":"best","you":3,"them":2,"outcome":"Sam blinks and reaches for the cloth. \u201cYeah, okay,\u201d he says, a bit quieter.","why":"You name what is there and give one plain thing to do. The chair he is offering stays empty."},{"text":"\u201cDon't worry, I'll mop it. You're hopeless with spills.\u201d","tag":"game","you":-4,"them":-4,"outcome":"The scene stops there. Sam takes the rag off the floor and says nothing else.","why":"This takes the rescuer's chair and then the blamer's. Both help him stay in the game, and you are now in it too."},{"text":"\u201cOh no. How did that happen?\u201d","tag":"ok","you":0,"them":1,"outcome":"Sam starts a long story about the fridge door and the bottle that slipped.","why":"A neutral question that opens his story. It doesn't feed the self-blame, but it doesn't put the game down either."}]},{"who":"Sam","text":"\u201cNobody even wants me in the flat. I'm just the guy who's late, aren't I?\u201d","cue":"not looking up, the rag still in his fist","lines":[{"text":"\u201cThat's a lot to put on a spill. What's going on with you?\u201d","tag":"best","you":3,"them":4,"outcome":"Sam sits down on the floor, next to the tiles. He says Daniel has been on his back about a pitch.","why":"You stay in the room without taking the chair. Asking what's going on is an adult question, and it gives him room to say the real thing."},{"text":"\u201cYou're not that bad. Don't be so hard on yourself.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Sam smiles, a bit lost, and keeps going. \u201cNah, I really am, though.\u201d","why":"Reassurance sits one step from rescue. He hears that you are working on how he feels, and he takes the offer and goes on."},{"text":"\u201cWell, you are late most months, so yeah.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Sam's face closes, and he stops talking about the spill altogether.","why":"This agrees with the sting and then adds a verdict. It is the blamer's chair, and it gives him the proof he wanted."}]},{"who":"Sam","text":"\u201cRight. So I'll move out. You'd be glad.\u201d","cue":"standing up, dropping the rag","lines":[{"text":"\u201cI'd rather you didn't leave over a spill. Let's talk about the rent on Friday, plainly.\u201d","tag":"best","you":4,"them":3,"outcome":"Sam goes quiet. \u201cFriday,\u201d he repeats, as if the word is new to him.","why":"You refuse the rescue and the blame in one breath, and you turn the talk to a dated, plain thing that can be done."},{"text":"\u201cDon't be dramatic, Sam.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Sam says \u201cFine, I'm the drama,\u201d and leaves the kitchen.","why":"Telling someone to stop is a chair too. It gives the sting a bigger stage, and both of you end up playing."},{"text":"\u201cOkay. Do what you need to.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Sam picks up his bag and says he might not come home tonight.","why":"This is quiet and fair, but it hands him the power to make the threat real. Nothing has been refused."}]},{"who":"Sam","text":"\u201cI don't get it. You're not even cross with me. Why aren't you cross?\u201d","cue":"stops with the bag half on his shoulder, voice gone thin, eyes wet","lines":[{"text":"\u201cBecause it's milk, Sam. Friday's rent is the thing to sort, and I'm here for that.\u201d","tag":"best","you":3,"them":3,"outcome":"Sam stares at the tiles. His shoulders drop, and for a moment he looks lost.","why":"He pushed as hard as he could and nothing caught. What is left is bewilderment, and a steady, warm answer is what helps. You don't fix it, and you don't leave."},{"text":"\u201cI'm sorry, I didn't mean to upset you. Sit down, I'll make you a tea.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Sam sags into the offer. The old script is back, and you are looking after him again.","why":"An apology and a tea are the saviour's chair in a soft voice. The bewilderment is the moment the game was losing its grip, and this hands the grip back."},{"text":"\u201cBecause you do this every month, and I've stopped caring.\u201d","tag":"game","you":-5,"them":-7,"outcome":"The scene stops there. Sam goes white, picks up his bag and leaves without a word.","why":"A cold reply meant to sting is payback, and payback is a move in the game. Sam gets a bigger wound to carry and a new reason to keep the pattern."}]},{"who":"Sam","text":"\u201cThere I go again!\u201d","cue":"the bag still half on his shoulder, then a short laugh at himself","lines":[{"text":"\u201cThere you go. Want a cup of tea on the way out?\u201d","tag":"best","you":4,"them":6,"outcome":"He laughs properly for the first time today. \u201cYeah, okay.\u201d","why":"Once he sees the game, you don't need to win it. A warm, plain offer lets him leave the chair by himself."},{"text":"\u201cYeah, you do. Go on.\u201d","tag":"ok","you":1,"them":0,"outcome":"He nods, and the front door closes gently behind him.","why":"It is true and it is flat. The moment happened, but the warmth that would make it land is missing."},{"text":"\u201cRight. I'll be waiting for the next one, then.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Sam's laugh stops with it. He leaves without another word.","why":"This is a sarcastic hook, and it tells him the game is still on. He sees his pattern and gets a reason to keep running it."}]}],"payoff":"Monday, 8:10am. The milk spreads under the fridge while the two of you trade lines. Sam leaves for the office without saying sorry, and the Friday rent stays unsaid.","fallout":{"them":"Sam leaves without his lunch box, and the spill is still on the floor when you get home."}},{"type":"scene","title":"Thursday, 9:40am, meeting room two","setting":"Halden, by the station. Daniel has a printout of the client deck and a pen, and the other chairs are still pushed back from the last meeting.","meters":{"you":55,"them":50},"beats":[{"who":"Daniel","text":"\u201cLet's be rational about this. Who signed off the numbers in this deck? It wasn't me.\u201d","cue":"tapping the printout, not looking up","lines":[{"text":"\u201cI checked the sums on slide four. Let's go through slide four first.\u201d","tag":"best","you":3,"them":3,"outcome":"Daniel nods slowly and pulls the printout closer. \u201cFour,\u201d he says.","why":"You answer the question with what you did, and you don't guess at what anyone else did. That keeps you in the adult chair."},{"text":"\u201cNobody checked it properly, Daniel. We all rushed.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"Daniel frowns. \u201cRushed? You were the one with the spreadsheet.\u201d","why":"Speaking for everyone spreads the blame thin, and it sounds fair. It also lets him pick a new target."},{"text":"\u201cIt was Clara's section. Ask her.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Daniel writes Clara's name on the pad, and the meeting turns into a hearing.","why":"This moves the blame to someone who isn't in the room. It is a chair, and it is the one he most wants you to take."}]},{"who":"Daniel","text":"\u201cYou always leave me to find the mistakes. Every single time. Why is that?\u201d","cue":"leaning back, pen tapping","lines":[{"text":"\u201cIt sounds like you're tired of finding them. What would you like from me before the next deck?\u201d","tag":"best","you":3,"them":4,"outcome":"Daniel stops tapping the pen. \u201cA check before it comes to me. Every sheet.\u201d","why":"You name his feeling without taking the blame, then ask for what he wants. A plain request is the way out of the courtroom."},{"text":"\u201cI'm sorry. I'll do better.\u201d","tag":"ok","you":-3,"them":1,"outcome":"Daniel nods and says, \u201cGood,\u201d and then keeps going about the mistakes.","why":"This apology hands him the verdict. He can keep the case open, and you carry it into next week."},{"text":"\u201cMaybe if you checked your own work, you'd find them.\u201d","tag":"game","you":-5,"them":-7,"outcome":"The scene stops there. Daniel closes the folder and says he'll take it to his manager.","why":"This is the counter-charge, and it keeps the courtroom open with you in the dock next to him."}]},{"who":"Daniel","text":"\u201cSo you admit it. Who's going to fix slide four? You?\u201d","cue":"pushing the printout across the table","lines":[{"text":"\u201cI'll fix slide four today and send you the sums by three. You check whatever you want.\u201d","tag":"best","you":4,"them":3,"outcome":"Daniel looks at the clock, then nods. \u201cThree. Fine.\u201d","why":"You take the piece that is yours, name a time, and let him check. That answers the charge without a defence."},{"text":"\u201cYes, I'll fix it.\u201d","tag":"ok","you":-1,"them":0,"outcome":"He writes it down and moves on, unimpressed.","why":"This takes the job but leaves the case open. There is no time on it and no check on it."},{"text":"\u201cFine. Make it your problem, then.\u201d","tag":"game","you":-6,"them":-6,"outcome":"The scene stops there. Daniel pushes the printout back and says he'll find someone who can read a spreadsheet.","why":"This hands him a sulk and a verdict in one line. The case is still open, and you are the one holding it."}]},{"who":"Daniel","text":"\u201cRight. I want this in writing so there's no confusion. There I go again.\u201d","cue":"stops mid-sentence, the pen still in his hand, and for once looks round the room","lines":[{"text":"\u201cYeah. Want to go through slide four together, now the room's quiet?\u201d","tag":"best","you":4,"them":6,"outcome":"He laughs once, short and surprised. \u201cGo on, then.\u201d","why":"Once he sees the case, the warm, plain move is to get back to the work with him, not against him."},{"text":"\u201cYes, you do. Let's carry on.\u201d","tag":"ok","you":1,"them":0,"outcome":"He nods, and the meeting carries on in a flatter tone.","why":"True, but it leaves out the warmth that would make the moment land."},{"text":"\u201cDon't push it, Daniel. You started this.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Daniel puts the pen down, and the room goes quiet in the wrong way.","why":"This picks the case back up and gives him a reason to keep it. The game has found a new seat, and it's yours."}]}],"payoff":"Thursday, 10:10am. The meeting becomes a hearing. Daniel adds two more charges, Clara is sent out for the sums, and the deck goes back for a full re-check.","fallout":{"them":"Daniel ends the meeting early and walks out with the printout under his arm."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Name the chair that was offered, and the step out of it.","items":[{"type":"pick","who":"Sam","text":"\u201cGo on, say it. I'm useless.\u201d The rag is still in his hand, and the milk is still on the floor.","cue":"What did the offer ask for, and what was the step out?","options":["The offer asked you to take the blamer's chair and call him useless. Refusing that chair and the saviour's chair, with a plain adult line about the spill, is the antithesis.","The offer asked you to take the saviour's chair and mop up. Taking the blamer's chair would be the antithesis, so he learns how it feels to be told off.","The offer asked for nothing. He was only apologising, so the step out was to accept the apology and move on."],"answer":0,"why":"Sam offered a chair and waited for someone to sit in it. Berne's antithesis is a refusal to play, and it only works if you answer with no counter-move from another game. He also warns that reassuring someone who is putting himself down is often a move in a game of trying to help, so the saviour's chair is refused too. Refusing both chairs and grabbing neither left the game with nothing to work with.","traps":{"1":"Blamer's chair. Telling him off is a counter-move, and a counter-move is still a move in the game, so it gets another turn. He would leave with the sting, and you would leave with the job of making him pay for it.","2":"Accepting the apology sounds calm, but it lets the self-blame stand. The offer was the game, and a quick nod to it still answers the game."},"example":"Bank queue, Monday, 11:00am.<br>Man: \u201cI'm useless with forms. Tell me I'm useless.\u201d<br>You: \u201cI'm not going to say that. Want to fill it in together?\u201d<br>Man: \u201cYeah, okay.\u201d"},{"type":"pick","who":"Sam","text":"\u201cI don't get it. You're not even cross with me. Why aren't you cross?\u201d His voice has gone thin, and his eyes are wet.","cue":"You have refused every chair. What is happening to Sam now?","options":["The antithesis has failed. A game that is refused should end with the other person calming down at once.","This is the despair Berne describes. Sam pushed harder, the game did not catch, and he is left bewildered. In a good outcome it can give way to laughter at his own pattern, the Adult noticing \u201cThere I go again!\u201d","This is ordinary depression, so the next move is to cheer him up."],"answer":1,"why":"Berne says a player who meets a firm refusal first tries harder, and may then fall into a sharp, bewildered despair. He adds that in a successful outcome this can soon be replaced by humorous laughter, which signals an Adult realisation. Laughter is not guaranteed, so you stay steady.","traps":{"0":"The antithesis has failed. It sounds logical, since a refused game should stop. But Berne expects the player to push harder before the game gives way, so Sam's distress belongs to the sequence and doesn't show a failure.","2":"Ordinary depression. Berne separates the two: despair is sharper, mixes frustration with bewilderment, and he links it to the Adult, while in depression the Child has the executive power. Cheering Sam up would also put you back in the saviour's chair."},"example":"Book club, Thursday, 8:00pm.<br>Member: \u201cGo on, tell me my review was rubbish.\u201d<br>You: \u201cIt was a bit long. Which bit did you enjoy writing most?\u201d<br>Member (after a pause): \u201cI don't know why I always do that.\u201d Then a laugh."}]}],"debrief":{"nadia":"A game needs two people to keep it going, and the hard part is that the other person usually pushes harder before they feel that. You stayed in the room through a wobble that looked like it might turn into something worse. Sam had to hear his own line back before he could put it down, and for one evening the pattern looked back at him instead of running him.","bookTerm":"Antithesis","bookNote":"The books call this the antithesis: a refusal to play, or a move that undercuts the payoff, with no counter-move from another game. Berne says the player then tends to push harder, may fall into a bewildered despair, and in a good outcome ends with the laugh of \u201cThere I go again!\u201d"},"reflection":{"prompt":"Which game did someone try to pull you into this week? Name the chair you refused, and how long it took before some part of you wanted to sit down in it anyway."},"next":"7.5","baseStory":{"setting":"Home & Flatmates","blurb":"Sam knocks milk across the kitchen floor and begs to be told he is useless."},"moreStories":[{"setting":"Work","blurb":"Clara finds a mistake in the pricing deck on release week and wants someone to sentence her.","opener":{"setting":"Tuesday, 8:05am, Halden, the team room. The pricing deck is open on Clara's screen, and the client call is at ten.","lines":[{"who":"Clara","text":"\u201cFound it. Slide
