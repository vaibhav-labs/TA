.\u201d","why":"You decline the martyr's job for him and put a time on your own part. A dated offer is harder to push against than a pep talk."}]},{"who":"Daniel","text":"\u201cYou're not even going to argue? I just said nobody can be relied on.\u201d","cue":"printout creased in his fist, voice flat","lines":[{"text":"\u201cBecause you say it every release, and nobody listens any more.\u201d","tag":"game","you":-5,"them":-7,"outcome":"The scene stops there. Daniel nods slowly and says he will remember that.","why":"A cold reply meant to sting is payback, and payback is a move in the game. He gets a bigger wound to carry and a new reason to keep the pattern."},{"text":"\u201cI'm not arguing, Daniel. The deck needs doing. Slides one to three by two, and I'm here for that.\u201d","tag":"best","you":3,"them":4,"outcome":"Daniel opens his hand and looks at the paper as if someone else had crumpled it.","why":"He pushed as hard as he could and nothing caught. What is left is bewilderment, and a steady, warm answer is what helps. You don't fix it, and you don't leave."},{"text":"\u201cSorry, I didn't mean it to sound like that. Give me the lot.\u201d","tag":"ok","you":-3,"them":1,"outcome":"Daniel hands over the whole deck and looks relieved, then irritated about it.","why":"An apology and a tea are the saviour's chair in a soft voice. The bewilderment is the moment the game was losing its grip, and this hands the grip back."}]},{"who":"Daniel","text":"\u201cThere I go again. Hurry up, hurry up.\u201d","cue":"stops, looks at the creased page, then gives a short dry laugh","lines":[{"text":"\u201cThere you go. Want the kettle on before slide one?\u201d","tag":"best","you":4,"them":6,"outcome":"He laughs once, short and surprised. \u201cGo on, then.\u201d","why":"Once he sees the game, you don't need to win it. A warm, plain offer lets him leave the chair alone."},{"text":"\u201cGood. I'll hold you to that next release.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Daniel puts the pen down, and the room goes quiet in the wrong way.","why":"This takes the moment he saw something and turns it into evidence. The game has found a new seat, and it is yours."},{"text":"\u201cYou do. Right, slide one.\u201d","tag":"ok","you":1,"them":0,"outcome":"He nods, and the meeting carries on in a flatter tone.","why":"It is true and it is flat. The moment happened, but the warmth that would make it land is missing."}]}],"payoff":"Thursday, 10:15am. The meeting becomes a hearing. Daniel adds two more charges, Clara is called in to explain slide six, and the deck goes back for a full re-check.","fallout":{"them":"Daniel ends the meeting early and walks out with the printout under his arm."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Name the chair that was offered, and the step out of it.","items":[{"type":"pick","who":"Clara","text":"\u201cGo on, say it was careless. Daniel will.\u201d The laptop is open on slide six.","cue":"What did the offer ask for, and what was the step out?","options":["The offer asked you to take the saviour's chair and redo the slide. Taking the blamer's chair next would be the antithesis, so she learns how it feels to be told off for it.","The offer asked for nothing. She was only warning you about Daniel, so the step out was to thank her and wait for him.","The offer asked you to take the blamer's chair and call it careless. Refusing that chair and the saviour's, with one plain line about the cell, is the antithesis."],"answer":2,"why":"Clara offered a chair and waited for someone to sit in it. Berne's antithesis is a refusal to play, and it only works if you answer with no counter-move from another game. Reassuring someone who is putting herself down is often a move in a game of trying to help, so the saviour's chair is refused too. With both chairs empty, the game had nothing to work with.","traps":{"0":"Taking the blamer's chair next is a counter-move, and a counter-move is still a move in the game, so it gets another turn. She would leave with the sting, and you would own the job of making her pay for it.","1":"Warning you about Daniel sounds like information, but the line ends in \u201csay it\u201d, and that is an invitation. Thanking her and waiting still answers the game."},"example":"Dentist's waiting room, Tuesday.<br>Woman: \u201cI never floss. Go on, tell me off.\u201d<br>You: \u201cI'm not going to. Is it the gums that bother you?\u201d<br>Woman: \u201cA bit, yes.\u201d"},{"type":"pick","who":"Clara","text":"\u201cI don't get it. You're not even cross with me. Why aren't you cross?\u201d Her voice has gone thin, and her eyes are bright.","cue":"You have refused every chair. What is happening to Clara now?","options":["The antithesis has failed. A game that is refused should end with the other person calming down at once, so she needs the reassurance after all, and your refusal went too far.","This is the despair Berne describes. Clara pushed harder, the game did not catch, and she is bewildered. It can give way to a laugh at herself.","This is ordinary depression, so the next move is to cheer her up with a tea and a promise that Daniel will not mind the typo."],"answer":1,"why":"Berne says a player who meets a firm refusal first tries harder, and may then fall into a sharp, bewildered despair. He adds that in a successful outcome this can soon be replaced by humorous laughter, a sign of an Adult realisation. Laughter is not guaranteed, so you stay steady.","traps":{"0":"The antithesis has failed. It sounds logical, since a refused game should stop. But Berne expects the player to push harder before the game gives way, so Clara's distress belongs to the sequence and doesn't show a failure.","2":"Ordinary depression. Berne separates the two: despair is sharp, mixes frustration with bewilderment, and he links it to the Adult, while in depression the Child has the executive power. Cheering her up would also put you back in the saviour's chair."},"example":"Allotment shed, Saturday.<br>Neighbour: \u201cGo on, say my beans are rubbish.\u201d<br>You: \u201cThey're a bit thin. What did you feed them?\u201d<br>Neighbour (after a pause): \u201cWhy am I always like this?\u201d Then a laugh."}]}]},{"setting":"School & College","blurb":"Sam has missed a group deadline at his evening class and wants someone to tell him to quit.","opener":{"setting":"Wednesday, 6:50pm, the college library, the study group table. The group slides are due to Mr Hollis at eight.","lines":[{"who":"Sam","text":"\u201cBefore you say anything, I haven't done my section.\u201d","cue":"bag still on his shoulder, eyes on the carpet"},{"who":"Sam","text":"\u201cGo on. Tell me to drop the course. Ella already wants to.\u201d","cue":"dropping into the chair, bag and all"}],"ask":"When someone offers you a chair in their game, what do you do with it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"A game always offers a chair. Tap what each line is doing to you.","items":[{"type":"pick","who":"Sam","text":"\u201cLook at the feedback sheet. 'Late again.' Go on, tell me I should drop the course.\u201d","cue":"holding the sheet out at arm's length, waiting","options":["A real question about the course ahead","A plain request for advice","A trap: he is holding out a chair"],"answer":2,"why":"He is offering a chair. Tell him to quit, or rush in and promise to carry his section, and either one seats you in his game.","traps":{"0":"A real question. It sounds like one, but he hasn't asked anything about the course. He is asking you to pass sentence.","1":"A plain request for advice. It sounds like one, but the answer he wants is already written, and the hook is that you give it."},"example":"Gym reception, Monday.<br>Member: \u201cI've missed three classes. Go on, say I should cancel.\u201d<br>Receptionist: \u201cThursday's at seven. Shall I book you in?\u201d"},{"type":"pick","who":"Sam","text":"\u201cElla does everything in this group. I'm just the passenger, aren't I?\u201d","cue":"twisting the sheet into a roll","options":["Saviour: tell him he does plenty and offer to write his section","Stepping out: ask what is stopping the section","Blamer: agree he is the passenger"],"answer":1,"why":"Both of the other chairs keep the game running. Stepping out means you refuse each chair and do not grab a new one.","traps":{"0":"Saviour. It feels kind, but the reassurance gives him the role of the one who can't cope, and writing his section hands the job to you. The game keeps going.","2":"Blamer. It sounds like plain talk, but agreeing gives the sting its last push, and he leaves sure he is the passenger."},"example":"Rowing club, Sunday.<br>Rower: \u201cI just slow the boat down. Go on, say it.\u201d<br>Cox: \u201cYou were late on the stroke at the bridge. Want to run it again?\u201d<br>Rower: \u201cYeah, okay.\u201d"},{"type":"pick","who":"Sam","text":"\u201cHa. There I go again. Quitting before they can fail me.\u201d","cue":"stopped rolling the sheet, looking at it","options":["He has seen his own game","He is about to walk out of the library","He is asking you to write his section"],"answer":0,"why":"That is the moment someone sees their own game. Nothing about it needs winning, and nobody has to be the one who was right.","traps":{"1":"He is about to walk out. It can look the same, since he is quiet and still has his bag on. But walking out wouldn't turn the line into a joke at himself.","2":"He is asking you to write it. That is the hook again. The line itself is him stepping back from the hook."},"example":"Choir rehearsal, Thursday.<br>Alto: \u201cI've lost my place again. I'm the weak link.\u201d<br>Conductor: \u201cPage six, second verse.\u201d<br>Alto: \u201cHa. There I go again.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Refuse each chair as it is offered. The scene stops when the other person sees the pattern.","items":[{"type":"scene","title":"Wednesday, 6:55pm, the library study table","setting":"The college library, the study group table by the radiator. The slides are due to Mr Hollis at eight, and Sam's section is a title and nothing else.","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cSorry, sorry, I'm the worst. Go on, say it. I've let the whole group down.\u201d","cue":"bag still on his shoulder, not sitting","lines":[{"text":"\u201cYour section is a title so far. Sit down and tell me what slide four has to say.\u201d","tag":"best","you":3,"them":2,"outcome":"Sam sits, a bit slowly. \u201cThe bit about cleaning the data,\u201d he says.","why":"You name what is there and give one plain thing to do. The chair him is offering stays empty."},{"text":"\u201cDon't worry, I'll write it. You've never finished anything anyway.\u201d","tag":"game","you":-4,"them":-4,"outcome":"The scene stops there. Sam hands over his notes and says nothing else.","why":"This takes the rescuer's chair and then the blamer's. Both help him stay in the game, and now you are in it too."},{"text":"\u201cOh no. What happened this week?\u201d","tag":"ok","you":0,"them":1,"outcome":"Sam starts a long story about a night shift and a broken bus.","why":"A neutral question that opens him story. It doesn't feed the self-blame, but it doesn't put the game down either."}]},{"who":"Sam","text":"\u201cElla does everything in this group. Nobody wants me on it. I'm just the passenger, aren't I?\u201d","cue":"twisting the feedback sheet into a roll","lines":[{"text":"\u201cThat's a lot to put on one slide. What's going on with you this week?\u201d","tag":"best","you":3,"them":4,"outcome":"Sam sits on the edge of the chair. He says his shifts changed on Monday and he told nobody.","why":"You stay in the room without taking the chair. Asking what's going on is an adult question, and it gives him room to say the real thing."},{"text":"\u201cYou're not that bad. Don't be so hard on yourself.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Sam smiles, a bit lost. \u201cI really am, though,\u201d he says, and opens the laptop.","why":"Reassurance sits one step from rescue. He hears that you are working on how him feels, takes the offer and goes on."},{"text":"\u201cWell, Ella did do the last two tables on her own.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Sam's face shuts, and he stops talking about slide four altogether.","why":"This agrees with the sting and then adds a verdict. It is the blamer's chair, and it hands him the proof he was after."}]},{"who":"Sam","text":"\u201cRight. I'll email Mr Hollis and withdraw from the course. You'd all be glad.\u201d","cue":"standing, the roll of paper in his fist","lines":[{"text":"\u201cDon't be dramatic, Sam.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Sam says \u201cFine, I'm the drama,\u201d and goes for the lift.","why":"Telling someone to stop is a chair too. It gives the sting a bigger stage, and both of you end up playing."},{"text":"\u201cI'd rather you didn't withdraw over one slide. Write half a page by half seven, and I'll read it.\u201d","tag":"best","you":4,"them":3,"outcome":"Sam goes quiet. \u201cHalf seven,\u201d he repeats, as if the time were new to him.","why":"You refuse the rescue and the blame in one breath, and turn the talk to a timed, plain job that can be done."},{"text":"\u201cOkay. Do what you need to.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Sam picks up his bag and says he might skip Thursday.","why":"Quiet and fair, but it hands him the power to make the threat real. Nothing has been refused."}]},{"who":"Sam","text":"\u201cI don't get it. You're not even cross with me. Why aren't you cross?\u201d","cue":"bag half on his shoulder, voice gone thin, eyes wet","lines":[{"text":"\u201cI'm sorry, I didn't mean to upset you. Sit down, I'll get you a coffee from the machine.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Sam sags into the offer. The old script is back, and you are looking after him again.","why":"An apology and a tea are the saviour's chair in a soft voice. The bewilderment is the moment the game was losing its grip, and this hands the grip back."},{"text":"\u201cBecause you do this before every deadline, and I've stopped caring.\u201d","tag":"game","you":-5,"them":-7,"outcome":"The scene stops there. Sam goes white, picks up his bag and leaves without a word.","why":"A cold reply meant to sting is payback, and payback is a move in the game. He gets a bigger wound to carry and a new reason to keep the pattern."},{"text":"\u201cBecause it's one slide, Sam. The half page by half seven is the thing to sort, and I'm here for that.\u201d","tag":"best","you":3,"them":3,"outcome":"Sam stares at the carpet. His shoulders drop, and for a moment he looks lost.","why":"He pushed as hard as he could and nothing caught. What is left is bewilderment, and a steady, warm answer is what helps. You don't fix it, and you don't leave."}]},{"who":"Sam","text":"\u201cThere I go again!\u201d","cue":"the bag still half on his shoulder, then a short laugh at himself","lines":[{"text":"\u201cYeah, you do. Go on.\u201d","tag":"ok","you":1,"them":0,"outcome":"He nods and sits back down, without looking up.","why":"It is true and it is flat. The moment happened, but the warmth that would make it land is missing."},{"text":"\u201cThere you go. Take the radiator seat. It's the only warm one.\u201d","tag":"best","you":4,"them":6,"outcome":"He laughs properly for the first time today. \u201cYeah, okay.\u201d","why":"Once he sees the game, you don't need to win it. A warm, plain offer lets him leave the chair alone."},{"text":"\u201cRight. I'll be ready for the next one, then.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Sam's laugh stops with it. He leaves without another word.","why":"A sarcastic hook tells him the game is still on. He sees the pattern and gets a reason to keep running it."}]}],"payoff":"Wednesday, 7:30pm. The slides sit half empty while the two of you trade lines. Sam leaves before eight, and the file goes to Mr Hollis with his section still a title.","fallout":{"them":"Sam leaves his coat on the back of the chair, and his section is still a title at eight."}},{"type":"scene","title":"Friday, 12:30pm, the group room","setting":"Second floor of the college library. Mr Hollis has marked the slides incomplete. Ella has the feedback sheet flat under both hands, and Sam's name is crossed out on the cover.","meters":{"you":55,"them":50},"beats":[{"who":"Ella","text":"\u201cGo on, tell me I'm the only one who actually works on this. You know it's true.\u201d","cue":"pressing the feedback sheet flat, not smiling","lines":[{"text":"\u201cYou carried a lot of it, yes. What would you like from me before Monday's draft?\u201d","tag":"best","you":3,"them":3,"outcome":"Ella stops pressing the sheet. \u201cA proper list of sections. With names.\u201d","why":"You say what is true without joining a trial of Sam, then ask for what she wants. A plain request is the way out."},{"text":"\u201cIt's not that simple. Sam has his reasons.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Ella sighs. \u201cEveryone has reasons,\u201d she says, and turns the sheet over.","why":"Defending Sam spreads the blame thin, and it sounds fair. It also gives her a new person to be right against, and that is you."},{"text":"\u201cIt's true. Sam has let us down twice now.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Ella writes Sam's name in the margin, and the group room turns into a hearing.","why":"This takes the blamer's chair on her invitation, and it puts someone who isn't in the room on trial."}]},{"who":"Ella","text":"\u201cFine. I'll rewrite his section and the intro tonight. I always do. Nobody else will.\u201d","cue":"gathering her papers, half out of her chair","lines":[{"text":"\u201cIf you want to, go ahead.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Ella squares the papers and says she will see you on Monday.","why":"Quiet and fair, but it hands her the power to make the threat real. Nothing has been refused."},{"text":"\u201cGreat. Be a martyr, then.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Ella says \u201cI will,\u201d and takes the stairs two at a time.","why":"Telling someone to stop is a chair too. It gives the sting a bigger stage, and both of you end up playing."},{"text":"\u201cYou don't have to take his part. Give me the intro, and I'll bring it to you by six.\u201d","tag":"best","you":4,"them":3,"outcome":"Ella looks at her watch. \u201cSix,\u201d she says. \u201cFine.\u201d","why":"You decline the rescuer's job for her and take a piece that is yours. A dated offer is harder to push against than a pep talk."}]},{"who":"Ella","text":"\u201cYou're not going to argue? I've just said nobody else will.\u201d","cue":"papers squared in her hands, voice flat","lines":[{"text":"\u201cBecause you say it every project, and nobody listens any more.\u201d","tag":"game","you":-5,"them":-7,"outcome":"The scene stops there. Ella nods slowly and says she will remember that.","why":"A cold reply meant to sting is payback, and payback is a move in the game. She gets a bigger wound to carry and a new reason to keep the pattern."},{"text":"\u201cI'm not arguing, Ella. The intro by six, and I'm here for that.\u201d","tag":"best","you":3,"them":4,"outcome":"Ella lets the papers drop an inch and looks at them as if they were someone else's.","why":"She pushed as hard as she could and nothing caught. What is left is bewilderment, and a steady, warm answer is what helps. You don't fix it, and you don't leave."},{"text":"\u201cSorry, I didn't mean it to sound like that. Give me the lot.\u201d","tag":"ok","you":-3,"them":1,"outcome":"Ella hands over everything and looks relieved, then irritated about it.","why":"An apology and a tea are the saviour's chair in a soft voice. The bewilderment is the moment the game was losing its grip, and this hands the grip back."}]},{"who":"Ella","text":"\u201cThere I go again. Collecting jobs like library fines.\u201d","cue":"stops, then laughs once through her nose","lines":[{"text":"\u201cThere you go. Fancy a walk to the machine before the intro?\u201d","tag":"best","you":4,"them":6,"outcome":"She laughs, short and surprised. \u201cGo on, then.\u201d","why":"Once she sees the game, you don't need to win it. A warm, plain offer lets her leave the chair alone."},{"text":"\u201cGood. I'll remind you next project.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Ella puts the papers down, and the room goes quiet in the wrong way.","why":"This takes the moment she saw something and turns it into evidence. The game has found a new seat, and it is yours."},{"text":"\u201cYou do. Right, the intro.\u201d","tag":"ok","you":1,"them":0,"outcome":"She nods, and the work carries on in a flatter tone.","why":"It is true and it is flat. The moment happened, but the warmth that would make it land is missing."}]}],"payoff":"Friday, 1:00pm. The group room becomes a hearing. Ella adds two more charges against Sam, the intro stays unwritten, and the draft goes to Mr Hollis late.","fallout":{"them":"Ella leaves the room with the papers in her arms and does not wait for the lift with you."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Name the chair that was offered, and the step out of it.","items":[{"type":"pick","who":"Sam","text":"\u201cGo on, tell me to drop the course.\u201d The feedback sheet is still rolled in his fist.","cue":"What did the offer ask for, and what was the step out?","options":["The offer asked you to take the blamer's chair and tell him to quit. Refusing that chair and the saviour's chair, with a plain adult line about the slide, is the antithesis.","The offer asked you to take the saviour's chair and write his section. Taking the blamer's chair next would be the antithesis, so he learns how it feels to be told off at last.","The offer asked for nothing. He was only letting off steam about the sheet, so the step out was to let him finish and move on."],"answer":0,"why":"Sam offered a chair and waited for someone to sit in it. Berne's antithesis is a refusal to play, and it only works if you answer with no counter-move from another game. He also warns that reassuring someone who is putting himself down is often a move in a game of trying to help, so the saviour's chair is refused too. With both chairs empty, the game had nothing to work with.","traps":{"1":"Taking the blamer's chair next is a counter-move, and a counter-move is still a move in the game, so it gets another turn. He would leave with the sting, and you would own the job of making him pay for it.","2":"Letting him finish sounds patient, but the line ends in an invitation. Moving on after it still answers the game."},"example":"Bank queue, Monday, 11:00am.<br>Man: \u201cI'm useless with forms. Tell me I'm useless.\u201d<br>You: \u201cI'm not going to say that. Want to fill it in together?\u201d<br>Man: \u201cYeah, okay.\u201d"},{"type":"pick","who":"Sam","text":"\u201cI don't get it. You're not even cross with me. Why aren't you cross?\u201d His voice has gone thin, and his eyes are wet.","cue":"You have refused every chair. What is happening to Sam now?","options":["The antithesis has failed. A game that is refused should end with the other person calming down at once, so the next move is to give him the comfort he is asking for.","This is ordinary depression, so the next move is to cheer him up with a coffee and a reminder that Mr Hollis is generous with extensions.","This is the despair Berne describes. Sam pushed harder, the game did not catch, and he is bewildered. In a good outcome it gives way to a laugh at himself."],"answer":2,"why":"Berne says a player who meets a firm refusal first tries harder, and may then fall into a sharp, bewildered despair. He adds that in a successful outcome this can soon be replaced by humorous laughter, a sign of an Adult realisation. Laughter is not guaranteed, so you stay steady.","traps":{"0":"The antithesis has failed. It sounds logical, since a refused game should stop. But Berne expects the player to push harder before the game gives way, so Sam's distress belongs to the sequence and doesn't show a failure.","1":"Ordinary depression. Berne separates the two: despair is sharp, mixes frustration with bewilderment, and he links it to the Adult, while in depression the Child has the executive power. Cheering him up would also put you back in the saviour's chair."},"example":"Book club, Thursday, 8:00pm.<br>Member: \u201cGo on, tell me my review was rubbish.\u201d<br>You: \u201cIt was a bit long. Which bit did you enjoy writing most?\u201d<br>Member (after a pause): \u201cI don't know why I always do that.\u201d Then a laugh."}]}]},{"setting":"Family","blurb":"Gran sets four bowls for Sunday lunch, then says she is only in the way.","opener":{"setting":"Sunday, 1:10pm, Hawthorn Court, Gran's kitchen downstairs. Four bowls are laid, the soup is on, and Leo is under the table with the tablet.","lines":[{"who":"Gran","text":"\u201cSit, sit. Don't mind me. I'll have mine on a tray later.\u201d","cue":"stirring, back to you"},{"who":"Gran","text":"\u201cNobody wants an old woman at the table. Go on, say it.\u201d","cue":"not turning round"}],"ask":"When someone offers you a chair in their game, what do you do with it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"A game always offers a chair. Tap what each line is doing to you.","items":[{"type":"pick","who":"Gran","text":"\u201cEat without me. I'm only in the way. Go on, say I'm in the way.\u201d","cue":"stirring the pot, back to you","options":["A trap: she is holding out a chair","A real question about lunch today","A plain request to be left in peace"],"answer":0,"why":"She is offering a chair. Agree she is in the way, or rush in with a heap of reassurance, and either one seats you in her game.","traps":{"1":"A real question. It sounds like one, but she hasn't asked anything about lunch. She is asking you to rule on whether she matters.","2":"A plain request. It sounds like one, but if she wanted to be left alone she would not have laid four bowls. The hook is the \u201cgo on, say it\u201d."},"example":"Wedding reception, table six.<br>Aunt: \u201cSit at the other end. Go on, say I'm a nuisance.\u201d<br>Niece: \u201cI'm bringing your chair over. The speeches are about to start.\u201d"},{"type":"pick","who":"Gran","text":"\u201cThese council letters. Nobody reads them for me but you. I'd be lost, wouldn't I, if you were too busy?\u201d","cue":"tapping the envelopes on the dresser","options":["Blamer: agree she leans on you too hard","Saviour: promise to do every letter this week","Stepping out: offer one time to read them"],"answer":2,"why":"Both of the other chairs keep the game running. Stepping out means you refuse each chair and do not grab a new one.","traps":{"0":"Blamer. It sounds like straight talk, but agreeing gives the sting its last push, and she goes away certain she is a burden.","1":"Saviour. It feels loving, but a promise to do the lot hands her the role of someone who can't cope, and you the role of the one who can't say no. The game keeps going."},"example":"Hairdresser, Saturday.<br>Customer: \u201cYou'll be glad when I stop coming, won't you?\u201d<br>Stylist: \u201cYour next one's in six weeks. Want the Thursday?\u201d<br>Customer: \u201cGo on, then.\u201d"},{"type":"pick","who":"Mum","text":"\u201cHa. There I go again. Ringing to ask if you've eaten.\u201d","cue":"on speaker, laughing at herself, Dad's television behind her","options":["She is sulking about the distance","She has seen her own game","She is asking you to promise to ring more"],"answer":1,"why":"That is the moment someone sees their own game. Nothing about it needs winning, and nobody has to be the one who was right.","traps":{"0":"She is sulking. It can sound similar, since the line is about distance. But sulking wouldn't turn the line into a joke at herself.","2":"She is asking you to promise more calls. That is the hook again. The line itself is her stepping back from the hook."},"example":"Book group chat, Wednesday.<br>Jo: \u201cSorry, I've turned up with a casserole again. Nobody asked.\u201d<br>Rita: \u201cI'll have some.\u201d<br>Jo: \u201cHa. There I go again.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Refuse each chair as it is offered. The scene stops when the other person sees the pattern.","items":[{"type":"scene","title":"Sunday, 1:10pm, Gran's kitchen","setting":"Hawthorn Court, Gran's flat downstairs. Four bowls are laid, the soup is hot, and Leo is under the table with the tablet. Mrs Kale's cardigan hangs on the second chair.","meters":{"you":60,"them":50},"beats":[{"who":"Gran","text":"\u201cSorry, sorry, I'm only in the way. Go on, say it. An old woman and her soup.\u201d","cue":"back to you, stirring slowly","lines":[{"text":"\u201cThe soup smells good, Gran. Where do you want me to sit?\u201d","tag":"best","you":3,"them":2,"outcome":"Gran turns, spoon in hand. \u201cBy the window,\u201d she says, a bit quieter.","why":"You name what is there and give one plain thing to do. The chair her is offering stays empty."},{"text":"\u201cSit down, Gran, I'll serve. You're too old to be standing at a stove.\u201d","tag":"game","you":-4,"them":-4,"outcome":"The scene stops there. Gran puts the spoon down and says nothing else.","why":"This takes the rescuer's chair and then the blamer's. Both help her stay in the game, and now you are in it too."},{"text":"\u201cOh no. Has somebody said something?\u201d","tag":"ok","you":0,"them":1,"outcome":"Gran starts on the neighbour's radio and the thin wall.","why":"A neutral question that opens her story. It doesn't feed the self-blame, but it doesn't put the game down either."}]},{"who":"Gran","text":"\u201cNobody wants me at the table these days. I'm just the one who has to be put up with, aren't I?\u201d","cue":"one hand flat on the dresser, still not looking round","lines":[{"text":"\u201cThat's a lot to put on a bowl of soup. What's going on with you today?\u201d","tag":"best","you":3,"them":4,"outcome":"Gran sits down slowly. She says Mum hasn't rung since Tuesday.","why":"You stay in the room without taking the chair. Asking what's going on is an adult question, and it gives her room to say the real thing."},{"text":"\u201cYou're not that old. Don't say things like that.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Gran smiles, a bit lost. \u201cI am, though,\u201d she says, and wipes the spoon.","why":"Reassurance sits one step from rescue. She hears that you are working on how her feels, takes the offer and goes on."},{"text":"\u201cWell, you did say last week you wanted to be left alone.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Gran's face shuts, and she stops talking about the table altogether.","why":"This agrees with the sting and then adds a verdict. It is the blamer's chair, and it hands her the proof she was after."}]},{"who":"Gran","text":"\u201cRight. I'll tell Mrs Kale I'm moving to the home on the hill. You'd all be glad.\u201d","cue":"untying her apron, standing at the stove","lines":[{"text":"\u201cDon't be dramatic, Gran.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Gran says \u201cFine, I'm the drama,\u201d and goes into the back room.","why":"Telling someone to stop is a chair too. It gives the sting a bigger stage, and both of you end up playing."},{"text":"\u201cI'd rather you didn't move over a bowl of soup. Let's do your letters on Thursday at five, plainly.\u201d","tag":"best","you":4,"them":3,"outcome":"Gran goes still. \u201cThursday,\u201d she repeats, as if the day were new to her.","why":"You refuse the rescue and the blame in one breath, and turn the talk to a timed, plain job that can be done."},{"text":"\u201cOkay. If that's what you want.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Gran folds her apron and says she will ask Mrs Kale about the forms.","why":"Quiet and fair, but it hands her the power to make the threat real. Nothing has been refused."}]},{"who":"Gran","text":"\u201cI don't get it. You're not even cross with me. Why aren't you cross?\u201d","cue":"the apron half off, voice gone thin, eyes wet","lines":[{"text":"\u201cI'm sorry, I didn't mean to upset you. Sit down, I'll make you a tea.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Gran sags into the offer. The old script is back, and you are looking after her again.","why":"An apology and a tea are the saviour's chair in a soft voice. The bewilderment is the moment the game was losing its grip, and this hands the grip back."},{"text":"\u201cBecause you do this every Sunday, and I've stopped listening.\u201d","tag":"game","you":-5,"them":-7,"outcome":"The scene stops there. Gran goes white, puts the spoon down and leaves the stove.","why":"A cold reply meant to sting is payback, and payback is a move in the game. She gets a bigger wound to carry and a new reason to keep the pattern."},{"text":"\u201cBecause it's soup, Gran. Thursday is the thing to sort, and I'm here for that.\u201d","tag":"best","you":3,"them":3,"outcome":"Gran stares at the pot. Her shoulders drop, and for a moment she looks lost.","why":"She pushed as hard as she could and nothing caught. What is left is bewilderment, and a steady, warm answer is what helps. You don't fix it, and you don't leave."}]},{"who":"Gran","text":"\u201cThere I go again!\u201d","cue":"the apron still half off, then a short laugh at herself","lines":[{"text":"\u201cYeah, you do. Go on.\u201d","tag":"ok","you":1,"them":0,"outcome":"She nods and turns back to the pot.","why":"It is true and it is flat. The moment happened, but the warmth that would make it land is missing."},{"text":"\u201cThere you go. Shall I call Leo out from under the table?\u201d","tag":"best","you":4,"them":6,"outcome":"She laughs properly for the first time today. \u201cYes, before it goes cold.\u201d","why":"Once she sees the game, you don't need to win it. A warm, plain offer lets her leave the chair alone."},{"text":"\u201cRight. I'll wait for next Sunday, then.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Gran's laugh stops with it. She turns back to the stove without another word.","why":"A sarcastic hook tells her the game is still on. She sees the pattern and gets a reason to keep running it."}]}],"payoff":"Sunday, 1:40pm. The soup goes cold while the two of you trade lines. Gran eats on a tray in the back room, and Thursday's letters stay unread.","fallout":{"them":"Gran does not come back to the table, and Leo asks from under it where the soup went."}},{"type":"scene","title":"Thursday, 7:30pm, the phone call home","setting":"Your room in apartment 3B. Mum's name is on the phone for the second time this week, and Dad's television is going behind her.","meters":{"you":55,"them":50},"beats":[{"who":"Mum","text":"\u201cGo on, tell me I worry too much. Your Dad says I do. Did you eat?\u201d","cue":"the television going behind her, a spoon clinking on a cup","lines":[{"text":"\u201cI had pasta at six. Tell me about your week, Mum.\u201d","tag":"best","you":3,"them":3,"outcome":"Mum pauses. \u201cPasta,\u201d she says. \u201cWell, my week.\u201d She begins with the neighbour's hedge.","why":"You answer the plain question and don't rule on whether she worries. The chair she is offering stays empty."},{"text":"\u201cYou don't worry too much, Mum.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cThat's what you say,\u201d Mum says, and asks about the fridge.","why":"Reassurance feeds the test. She asked for a ruling, got one, and has no reason to believe it."},{"text":"\u201cYou do worry a lot, Mum. It's a bit much.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Mum says \u201cWell, I'll let you go,\u201d and the line goes dead.","why":"This takes the blamer's chair on her invitation. She asked to be told, and you told her."}]},{"who":"Mum","text":"\u201cFine. I'll stop ringing, then. You can ring me when you remember I exist.\u201d","cue":"the spoon stops clinking","lines":[{"text":"\u201cIf that's what you'd like, Mum.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Mum says she will see how the week goes, and asks nothing more.","why":"Quiet and fair, but it hands her the power to make the threat real. Nothing has been refused."},{"text":"\u201cDon't be dramatic, Mum.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Mum says \u201cFine, I'm the drama,\u201d and the line goes quiet.","why":"Telling someone to stop is a chair too. It gives the sting a bigger stage, and both of you end up playing."},{"text":"\u201cDon't stop ringing. Shall we say Sundays at six, and I'll call you?\u201d","tag":"best","you":4,"them":3,"outcome":"Mum is silent. \u201cSundays at six,\u201d she says slowly.","why":"You refuse the sulk and the soothing in one breath and offer a dated, plain arrangement."}]},{"who":"Mum","text":"\u201cYou're not even going to argue? I've just said I'll stop ringing.\u201d","cue":"voice gone thin, the television turned down behind her","lines":[{"text":"\u201cBecause you say it every month, and I've stopped believing it.\u201d","tag":"game","you":-5,"them":-7,"outcome":"The scene stops there. Mum says nothing, and then the call ends.","why":"A cold reply meant to sting is payback, and payback is a move in the game. She gets a bigger wound to carry and a new reason to keep the pattern."},{"text":"\u201cI'm not arguing, Mum. Sundays at six is the thing to sort, and I'm here for that.\u201d","tag":"best","you":3,"them":4,"outcome":"Mum breathes out. For a moment she sounds like someone who has lost her place.","why":"She pushed as hard as she could and nothing caught. What is left is bewilderment, and a steady, warm answer is what helps. You don't fix it, and you don't leave."},{"text":"\u201cSorry, I didn't mean to upset you. I'll ring you every night.\u201d","tag":"ok","you":-3,"them":1,"outcome":"Mum accepts at once, and you both know you will not manage it.","why":"An apology and a tea are the saviour's chair in a soft voice. The bewilderment is the moment the game was losing its grip, and this hands the grip back."}]},{"who":"Mum","text":"\u201cThere I go again. Your Gran's daughter, aren't I?\u201d","cue":"a short laugh, the spoon clinking again","lines":[{"text":"\u201cThere you go. Is Dad in? Put me on speaker for a minute.\u201d","tag":"best","you":4,"them":6,"outcome":"Mum laughs. \u201cHe's got the football on,\u201d she says, and carries the phone through anyway.","why":"Once she sees the game, you don't need to win it. A warm, plain offer lets her leave the chair alone."},{"text":"\u201cGood. Remember that next time.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Mum says \u201cI'll try,\u201d in a smaller voice, and says goodnight.","why":"This takes the moment she saw something and turns it into evidence. The game has found a new seat, and it is yours."},{"text":"\u201cYes, you are. Anyway, Sunday.\u201d","tag":"ok","you":1,"them":0,"outcome":"She says \u201cAnyway,\u201d and the call goes on in a flatter tone.","why":"It is true and it is flat. The moment happened, but the warmth that would make it land is missing."}]}],"payoff":"Thursday, 7:50pm. The call turns into a trial with the two of you as judge and jury. Mum says she must let you go, and Sunday at six stays unsaid.","fallout":{"them":"Mum does not ring on Friday, and Gran asks downstairs whether you have spoken to her."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Name the chair that was offered, and the step out of it.","items":[{"type":"pick","who":"Gran","text":"\u201cEat without me. I'm only in the way. Go on, say it.\u201d The spoon is still in her hand, and the soup is hot.","cue":"What did the offer ask for, and what was the step out?","options":["The offer asked you to take the saviour's chair and serve her soup. Taking the blamer's chair next would be the antithesis, so she learns how it feels to be told she is in the way.","The offer asked you to take the blamer's chair and agree she is in the way. Refusing that chair and the saviour's chair, with a plain adult line about the soup, is the antithesis.","The offer asked for nothing. She was only apologising, so the step out was to accept the apology and sit down."],"answer":1,"why":"Gran offered a chair and waited for someone to sit in it. Berne's antithesis is a refusal to play, and it only works if you answer with no counter-move from another game. He also warns that reassuring someone who is putting herself down is often a move in a game of trying to help, so the saviour's chair is refused too. With both chairs empty, the game had nothing to work with.","traps":{"0":"Taking the blamer's chair next is a counter-move, and a counter-move is still a move in the game, so it gets another turn. She would leave with the sting, and you would own the job of making her pay for it.","2":"Accepting the apology sounds calm, but it lets the self-blame stand. The offer was the game, and a quick nod to it still answers the game."},"example":"Pharmacy counter, Friday.<br>Customer: \u201cI'm a nuisance, coming in again. Go on, say so.\u201d<br>Pharmacist: \u201cI'm not going to say that. Is it the same prescription?\u201d<br>Customer: \u201cYes. Thank you.\u201d"},{"type":"pick","who":"Mum","text":"\u201cYou're not even going to argue? I've just said I'll stop ringing.\u201d Her voice has gone thin, and the television is turned down behind her.","cue":"You have refused every chair. What is happening to Mum now?","options":["This is the despair Berne describes. Mum pushed harder, the game did not catch, and she is bewildered. It can give way to a laugh at herself.","The antithesis has failed. A game that is refused should end with the other person calming down at once, so you should promise more calls to bring her round.","This is ordinary depression, so the next move is to cheer her up with a promise to visit soon and a call every night until then."],"answer":0,"why":"Berne says a player who meets a firm refusal first tries harder, and may then fall into a sharp, bewildered despair. He adds that in a successful outcome this can soon be replaced by humorous laughter, a sign of an Adult realisation. Laughter is not guaranteed, so you stay steady.","traps":{"1":"The antithesis has failed. It sounds logical, since a refused game should stop. But Berne expects the player to push harder before the game gives way, so Mum's distress belongs to the sequence and doesn't show a failure.","2":"Ordinary depression. Berne separates the two: despair is sharp, mixes frustration with bewilderment, and he links it to the Adult, while in depression the Child has the executive power. Cheering her up would also put you back in the saviour's chair."},"example":"Parents' evening, Wednesday.<br>Dad: \u201cGo on, tell me I'm a hopeless father. I missed the last one.\u201d<br>Teacher: \u201cYou're here now. Shall we start with maths?\u201d<br>Dad (after a pause): \u201cI always do this, don't I?\u201d Then a laugh."}]}]}]};</script>

<script>
(function () {
  "use strict";

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and

  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });

    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: MULTI ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
