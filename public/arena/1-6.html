<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Break the Nod Rules · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"1.6","setting":"Friends & Community","title":"Break the Nod Rules","world":1,"worldName":"Being Noticed","week":1,"weekName":"Being Noticed","mechanic":"Rule-breaker","concept":"After this one you can break each of the five Nod Rules in a live scene, and say who benefits from them.","plainWord":"the Nod Rules","bookTerm":"Stroke economy","bookIdea":"Five rules taught in childhood keep nods artificially scarce: people hold back nods they have, hold back from asking for nods they need, turn away nods they want, swallow nods they do not want, and never praise themselves. The scarcity serves whoever controls the supply.","bookSource":"Scripts People Live, ch. 8","opener":{"setting":"Sunday, 16:00. The Corner Table. Your first session. Six people around two pushed-together tables, and Nadia at the end.","lines":[{"who":"Nadia","text":"\u201cNew face. Good. House rule: nobody explains anything until something has happened.\u201d","cue":"two tables, six people, the tea going cold"},{"who":"Nadia","text":"\u201cSo let's make something happen.\u201d","cue":"puts a card face down in front of you"}],"ask":"Can you break all five of the room's unwritten rules before the tea goes cold?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Three lines from the room. Tap which unwritten rule each one is enforcing.","items":[{"type":"pick","who":"Peter","text":"\u201cWe don't do compliments here.\u201d","cue":"to the table, not to you, over his tea","options":["Don't give nods you have","Don't ask for nods you need","Don't refuse nods you don't want"],"answer":0,"why":"Don't give nods you have. Peter says the rule out loud, so the room doesn't have to. A compliment is a nod, and the room keeps them scarce.","traps":{"1":"Don't ask would be about you asking for something. Peter is talking about what other people may give, not what you may want.","2":"Don't refuse is about turning down nods you don't want. Nobody has offered you one yet, so there is nothing to refuse."},"example":"A school staff room.<br>\u201cWe don't praise the new teachers, they'll get ideas.\u201d<br>Nobody is told to be unkind. The praise just doesn't get given."},{"type":"pick","who":"Ruby","text":"\u201cNobody asks for that here, you know.\u201d","cue":"after you say you're having a rough week","options":["Don't give nods you have","Don't ask for nods you need","Don't give yourself nods"],"answer":1,"why":"Don't ask for nods you need. Asking for recognition in this room is a breach, so the reply is a warning, not a comfort.","traps":{"0":"Don't give nods would be about the room handing out praise. Ruby is talking about you asking for something back.","2":"Don't give yourself nods is about praising yourself. She is reacting to a request, not to a boast."},"example":"A family kitchen at a wedding.<br>\u201cNobody asks for help with the dishes, you just do them.\u201d<br>Asking gets a look, and the look is the rule."},{"type":"pick","who":"You","text":"\u201cOh, it was nothing, really.\u201d","cue":"said after someone praised your work","options":["Don't give yourself nods","Don't refuse nods you don't want","Don't accept nods you want"],"answer":2,"why":"Don't accept nods you want. The praise came, and you waved it away. That is the bounce, and it is the rule that keeps a wanted nod from landing.","traps":{"0":"Don't give yourself nods would be praising your own work. You shrank the praise instead, which is the other way round.","1":"Don't refuse nods you don't want is about turning away a nod that felt wrong. This one was praise you could have used, and you batted it away before it could land."},"example":"A friend who says \u201cYou made a brilliant cake.\u201d<br>\u201cOh, it was just the recipe.\u201d<br>The cake was praised, and the praise went nowhere."}]},{"level":"Play","label":"Play, the Sunday session","intro":"Five rules, one each. Break them, and hold steady when the room pushes back.","items":[{"type":"scene","title":"Sunday, 16:00, the Nod Rules","setting":"Nadia at the end of the table. Peter, Hannah, Joseph and Ruby are here, and Omar is at the far end. You have twelve seconds a line.","meters":{"you":60,"them":50},"beats":[{"who":"Nadia","text":"\u201cFive things. Do all five before the tea's cold. I won't tell you what they are.\u201d","cue":"Omar, across the table, nods at you and looks back at the table","lines":[{"text":"Nod back at Omar.","tag":"best","you":2,"them":2,"outcome":"Omar looks at the table again, then back at you. Nobody else has noticed.","why":"You returned the nod, which is what a room of people does with each other. Omar is here, and he has done the first small thing.","flags":["omar_at_group"]},{"text":"\u201cTea's cold already, I think.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"Nadia: \u201cIt's always cold by four. Get on with it.\u201d","why":"A joke about the tea is a way of buying time. It keeps the room comfortable and keeps you out of the five things.","flags":["omar_at_group"]},{"text":"Look at the card and say nothing.","tag":"ok","you":-3,"them":0,"outcome":"Nadia: \u201cGood. Silence is allowed. Five things, though.\u201d","why":"Silence is a way of making yourself small in the room. Nadia lets it pass, once.","flags":["omar_at_group"]}]},{"who":"Hannah","text":"\u201cThe client wants the whole thing redone by Monday. Which is a fine plan, if you enjoy being lied to.\u201d","cue":"sharp, to the table. Peter is watching you.","lines":[{"text":"\u201cThat was a really clear way to put it.\u201d","tag":"best","you":8,"them":-3,"outcome":"Hannah blinks. \u201c\u2026Thanks. People don't usually say.\u201d Peter: \u201cWe don't do compliments here. Nadia will think you're buttering her up.\u201d","why":"Rule one broken. You gave a compliment, which is a nod, and the room saw it. The dip in the room's warmth is real, and it recovers if you hold steady.","flags":["rule_1_broken"]},{"text":"\u201cMm.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Hannah sighs and moves on. The rule holds, and you feel a little lower for it.","why":"A grunt is the safe move. It keeps the room flat and keeps you out of the way."},{"text":"\u201cClients, eh.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Joseph laughs into his tea. Nothing happens, which is exactly what the rule wants.","why":"A shrug about the client is safe, and it gives nothing. The rule stays in place because you didn't test it."}]},{"who":"Nadia","text":"\u201cSay one thing that went right this week. Your turn.\u201d","cue":"the table waits. Everyone is looking at you.","lines":[{"text":"\u201cI'd actually like to know. Do I come across as standoffish? Nobody at work talks to me and I can't tell.\u201d","tag":"best","you":10,"them":4,"outcome":"Silence. Then Joseph: \u201cNot standoffish. Careful.\u201d Ruby: \u201cYou looked terrified walking in, if that helps.\u201d Laughter.","why":"Rule two broken. You asked the room for a nod, and nobody asks for one here, so the question landed like a stone and the answer came back warm.","flags":["rule_2_broken"]},{"text":"\u201cI finished my first PR.\u201d","tag":"ok","you":1,"them":0,"outcome":"Nadia: \u201cAnd?\u201d","why":"A plain fact is safe, and it is a nod for doing. The room waits for the rest, and you don't give it."},{"text":"\u201cNothing much. Same as always.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Nadia: \u201cMm.\u201d The table moves on to Peter.","why":"The small, easy answer asks for nothing and gives nothing. It keeps the rule, and you stay on the edge of the table."}]},{"who":"Joseph","text":"\u201cYou listen well, for a new person.\u201d","cue":"leaning back in his chair, meaning it","lines":[{"text":"\u201cThank you. I'll take that.\u201d","tag":"best","you":8,"them":5,"outcome":"Joseph nods, pleased. Nadia, aside: \u201cDid everyone see that? He kept it.\u201d","why":"Rule three broken. You took a warm nod without shrinking it, and the bounce did not happen. The room's warmth comes back, because you held steady.","flags":["rule_3_broken"]},{"text":"\u201cOh, I'm just quiet.\u201d","tag":"ok","you":-6,"them":0,"outcome":"Joseph's smile closes a little. \u201cRight. Well.\u201d","why":"This is the bounce, the most common way of keeping rule three. The nod goes back across the table and leaves him owed."},{"text":"\u201cThat's kind of you. I'm really not that good.\u201d","tag":"ok","you":-5,"them":0,"outcome":"Joseph shrugs and turns to the teapot. The nod goes back across the table.","why":"It sounds modest and kind, but it still bounces the nod. Kind-sounding bounces keep the rule running, and they are hard to spot for that reason."}]}],"example":"A team meeting.<br>\u201cYour slides were great.\u201d<br>\u201cOh, they're just the template.\u201d<br>The compliment was for the work, and it went back across the table."},{"type":"pick","who":"Nadia","text":"\u201cStop. What just happened when Joseph said you listen well?\u201d","options":["He was being polite","I nearly bounced it","He was asking for something"],"answer":1,"why":"You nearly bounced it. Joseph's nod was warm and meant, and the reflex to wave it off is exactly what the rules protect.","traps":{"0":"Nadia: \u201cLook again.\u201d The line plays back. Joseph meant it, and a polite nod still counts, so you were about to bounce a real one.","2":"Nadia: \u201cLook again.\u201d The line plays back. Joseph wanted nothing back. He only gave a nod."},"example":"A friend says, \u201cYou always know what to say.\u201d<br>Your first move is \u201cOh, no, I just got lucky.\u201d<br>The compliment was meant for you, and it went back across the table."},{"type":"scene","title":"Sunday, 17:10, the walk out","setting":"Rules four and five, then the stairs. Peter is kind, and unbearable. Nadia is smiling at the end of the table.","meters":{"you":60,"them":50},"beats":[{"who":"Peter","text":"\u201cYou remind me of my nephew. Same lost look. He's doing very well now, you know. You'll be fine, these things take time. When I was your age\u2026\u201d","cue":"kindly, and unbearably, one arm along the back of your chair","lines":[{"text":"\u201cPeter, I appreciate it. I don't want to be anyone's nephew today. Can I just be new?\u201d","tag":"best","you":10,"them":-4,"outcome":"Peter, after a beat: \u201c\u2026Fair.\u201d Nadia smiles, and the arm comes off your chair.","why":"Rule four broken. You turned down a nod you didn't want, politely and out loud. The rule says you swallow it, and you didn't. Warmth in the room dips, and it comes back if you hold steady.","flags":["rule_4_broken"]},{"text":"\u201cThanks, Peter.\u201d","tag":"ok","you":-5,"them":0,"outcome":"Peter pats your hand. \u201cThat's the spirit.\u201d","why":"You swallowed a nod you didn't want. The rule holds, and it costs you steadiness. This is what the rule asks for, and you pay for it."},{"text":"\u201cHa. Yes. These things take time.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Peter beams, and the nephew story runs on for another minute.","why":"Agreeing to be the nephew keeps the peace. It looks kind, but the story now has you in it, and the rule keeps running."}]},{"who":"Nadia","text":"\u201cOne thing you did well today. Out loud. Yes, about yourself.\u201d","cue":"the closing round, every face turned your way","lines":[{"text":"\u201cI asked a room of strangers if I was standoffish. That took something.\u201d","tag":"best","you":10,"them":6,"outcome":"Ruby: \u201cIt did.\u201d","why":"Rule five broken. You gave yourself a nod for doing, out loud, and the room accepted it. The warmth that was dipping comes back.","flags":["rule_5_broken","self_nod"]},{"text":"\u201cI\u2026 showed up?\u201d","tag":"ok","you":2,"them":0,"outcome":"Nadia: \u201cThat's a dodge. Try again.\u201d It is the only time she pushes you.","why":"Showing up is true, but it is a shrug. Rule five asks you to name the specific thing you did, with your own name on it."},{"text":"\u201cOh, I'm nothing special. You're all very kind.\u201d","tag":"ok","you":-3,"them":0,"outcome":"Hannah: \u201cNobody asked you to be special. Just to say one thing.\u201d","why":"It looks kind, because it praises the room. Still, it is a bounce, and it hands the nod back to them so you never have to take it."}]},{"who":"Omar","text":"\u201cDidn't know you came here.\u201d","cue":"on the stairs, falling into step beside you, no one else close","lines":[{"text":"\u201cFirst time.\u201d","tag":"best","you":4,"them":5,"outcome":"\u201cYeah. Don't\u2026 mention it at work.\u201d","why":"A warm nod for being, from a man who has forbidden himself to give them. You took it plainly, and that counts for more than it looks."},{"text":"Say nothing, and nod back.","tag":"ok","you":1,"them":2,"outcome":"He nods, once, and walks on towards the car park.","why":"A nod back without words is fine, but it leaves him to decide what it meant."},{"text":"\u201cHave you been coming long?\u201d","tag":"ok","you":-2,"them":-3,"outcome":"\u201cLong enough. Don't\u2026 mention it at work.\u201d","why":"A question about how long he has been here is a small probe. It asks him to account for himself, which is the thing he is avoiding."}]}],"fallout":{"you":"Your steadiness runs out. You apologise to the whole table, and Nadia says, \u201cSame card next Sunday.\u201d"},"example":"A reunion dinner.<br>Your cousin says, \u201cYou've done so well, you must be proud.\u201d<br>You say, \u201cOh, it was all luck,\u201d and the evening moves on without the praise."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"The five rules keep nods scarce. Who gains when nods are scarce?","options":["Whoever controls how they are handed out","The people who are short of them","Nobody, the rules are only manners"],"answer":0,"why":"Scarce nods keep the power with whoever controls the supply, and they suit a world that wants obedient people. The people short of nods pay for the rules.","traps":{"1":"People short of nods are the ones who lose. The rules don't help them, they just keep them hungry.","2":"Manners would be kind and cost nothing. These rules cost the people who need nods, so they are more than manners."},"example":"A workplace where the manager never says well done.<br>The team works just as hard, and the manager's own praise is worth more because it is rare."}]}],"debrief":{"nadia":"Five rules nobody wrote down keep nods scarce: don't give them when you have them, don't ask for them when you need them, don't accept them when you want them, don't refuse the ones you don't want, and don't give them to yourself. They feel like modesty, but they're a diet somebody put you on, and whoever controls the supply of nods benefits. Watch this week for every time you say \u201cit was nothing\u201d.","bookTerm":"Stroke economy","bookNote":"The books call this the stroke economy, Claude Steiner's name for five rules taught in childhood that keep recognition scarce. He argues that the scarcity serves whoever controls the supply of nods, and an order that relies on obedient people."},"reflection":{"prompt":"This week, how many times did you say \u201cit was nothing\u201d, and what did the other person do next?"},"next":"2.1","baseStory":{"setting":"Friends & Community","blurb":"A new face joins Nadia's Sunday group, where the unwritten rules about praise are about to be tested."},"moreStories":[{"setting":"School & College","blurb":"Last study night of an evening bookkeeping class. Mrs Pryce wants five things said aloud before the annexe locks.","opener":{"setting":"Wednesday, 20:15. The library annexe, the long table at the back. Three classmates, a group project due Friday, and Mrs Pryce at the end with a stack of feedback sheets.","lines":[{"who":"Mrs Pryce","text":"\u201cBefore these go home, a house rule. Nobody reads their sheet until each of you has done something out loud.\u201d","cue":"squaring the stack against the table edge"},{"who":"Gwen","text":"\u201cHere we go. Someone is going to have to be nice.\u201d","cue":"pen clicking, eyes on the wall clock"},{"who":"Mrs Pryce","text":"\u201cFive things, before the library locks at nine. I won't say what they are.\u201d","cue":"slides a folded sheet across to you, face down"}],"ask":"Can you break all five of the group's unwritten rules before the doors lock?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Three lines from the study group. Tap which unwritten rule each one is enforcing.","items":[{"type":"pick","who":"Colin","text":"\u201cYou'll know if your page is right when it comes back with a mark on it.\u201d","cue":"after you ask if anyone would look at your cash-flow page","options":["Don't give nods you have","Don't ask for nods you need","Don't give yourself nods"],"answer":1,"why":"Don't ask for nods you need. You asked for a look, which is a request for a nod, and Colin sends you off to wait for a mark instead.","traps":{"0":"Don't give would be about the group holding back praise it has. Colin is answering your request, so the rule at work is about asking.","2":"Don't give yourself nods is about praising your own work. You didn't boast, you asked someone else to look."},"example":"A choir rehearsal.<br>\u201cWas my high note alright?\u201d<br>\u201cJust wait for the conductor's notes.\u201d<br>The question was a request, and it got parked."},{"type":"pick","who":"Gwen","text":"\u201cBit full of yourself, aren't we?\u201d","cue":"after you say your summary page came out well","options":["Don't accept nods you want","Don't refuse nods you don't want","Don't give yourself nods"],"answer":2,"why":"Don't give yourself nods. You said something good about your own work, and Gwen's tease is the room's way of putting it back.","traps":{"0":"Don't accept is about a nod someone else hands you. Nobody praised you yet, so there was nothing to accept.","1":"Don't refuse is about turning down a nod that felt wrong. You offered the nod yourself, and Gwen answered that."},"example":"A kitchen at a family party.<br>\u201cI think my rice turned out really well.\u201d<br>\u201cListen to her.\u201d<br>The cook said one true thing and got teased for it."},{"type":"pick","who":"Mrs Pryce","text":"\u201cWe don't clap for each other in this class. It embarrasses people.\u201d","cue":"as Rhys finishes his short presentation to the table","options":["Don't give nods you have","Don't refuse nods you don't want","Don't ask for nods you need"],"answer":0,"why":"Don't give nods you have. Everyone at the table has something good to say about Rhys, and the rule is there so they don't.","traps":{"1":"Don't refuse is about a nod someone pushes on you. Rhys isn't being offered one he dislikes, because nobody is allowed to give him one.","2":"Don't ask would fit if Rhys had begged for praise. He only finished talking."},"example":"A football club after a match.<br>\u201cNobody makes speeches about a clean sheet, it goes to people's heads.\u201d<br>The keeper heard nothing and went home."}]},{"level":"Play","label":"Play, the last study night","intro":"Five rules, one each. Break them, and hold steady when the table pushes back.","items":[{"type":"scene","title":"Wednesday, 20:20, the long table","setting":"Mrs Pryce at the end. Gwen, Colin and Rhys are here, with the cash-flow pages spread out between the tea cups. You have twelve seconds a line.","meters":{"you":60,"them":50},"beats":[{"who":"Mrs Pryce","text":"\u201cFive things. Start whenever you like. The clock does not care.\u201d","cue":"Rhys, across the table, lifts his chin at you and looks back at his laptop","lines":[{"text":"\u201cIs that the vending machine tea? Brave.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"Mrs Pryce: \u201cIt's always lukewarm by quarter past. Get on with it.\u201d","why":"A joke about the tea buys time. It keeps the table comfortable and keeps you out of the five things."},{"text":"Nod back at Rhys.","tag":"best","you":2,"them":2,"outcome":"Rhys looks at his screen again, then back at you. Nobody else has seen it.","why":"You returned the nod, which is what people at a table do for each other. Rhys has just done the first small thing, and you met it."},{"text":"Turn the folded sheet over and read it in silence.","tag":"ok","you":-3,"them":0,"outcome":"Mrs Pryce: \u201cGood. Silence is allowed. Five things, though.\u201d","why":"Reading in silence is a way of making yourself small at the table. Mrs Pryce lets it pass, once."}]},{"who":"Gwen","text":"\u201cThe reconciliation balanced first time, so that's the afternoon I won't get back. Pages are over there.\u201d","cue":"tapping a page with the end of her pen, not looking at anyone","lines":[{"text":"\u201cGwen, that reconciliation balanced first go. I'd have been at it until midnight.\u201d","tag":"best","you":8,"them":-3,"outcome":"Gwen blinks. \u201c\u2026Right. Thanks.\u201d Colin: \u201cWe don't do that here. It makes everyone feel marked.\u201d","why":"Rule one broken. You gave a nod you had, out loud, and the table saw it. The chill is real, and it eases if you hold steady.","flags":["rule_1_broken"]},{"text":"\u201cMm.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Gwen shrugs and turns a page. The rule holds.","why":"A grunt is the safe move. It keeps the table flat and keeps you out of the way."},{"text":"\u201cBeats my attempt.\u201d","tag":"ok","you":-3,"them":0,"outcome":"Gwen: \u201cEveryone's does.\u201d Nobody has been told anything good.","why":"It puts yourself down in place of saying a good thing about her page. The nod you had stays in your pocket."}]},{"who":"Mrs Pryce","text":"\u201cWhere are you stuck on the project? Out loud, to the table.\u201d","cue":"the whole table waits, even Colin has put his tea down","lines":[{"text":"\u201cFine so far. A few small things.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Mrs Pryce: \u201cMm.\u201d The table moves on to Colin.","why":"An easy answer asks for nothing. It keeps the rule, and you stay at the edge of the table."},{"text":"\u201cI'd like a straight answer on whether my cash-flow page is any good. I've looked at it too long to tell.\u201d","tag":"ok","you":3,"them":0,"outcome":"Mrs Pryce: \u201cAsk them, not me.\u201d You haven't quite asked anyone yet.","why":"Telling the tutor you want an answer is half of it. The ask still has to land on a classmate, with a name on it."},{"text":"\u201cRhys, would you look at my cash-flow page? I can't tell if it's good, and I would like to know.\u201d","tag":"best","you":10,"them":4,"outcome":"Silence. Then Rhys: \u201cThe last column is a bit off, but the layout's good.\u201d Gwen: \u201cI was going to say the same.\u201d","why":"Rule two broken. You asked a person for a nod, by name, and nobody asks for one here, so the question landed like a stone. The answer that came back was useful."}]},{"who":"Gwen","text":"\u201cYour cover note was the only one I could follow.\u201d","cue":"still not looking up, pen going again","lines":[{"text":"\u201cOh, it's mostly the guide with the names changed.\u201d","tag":"ok","you":-6,"them":0,"outcome":"Gwen's pen stops. \u201cRight. Well.\u201d","why":"This is the bounce, the most common way of keeping rule three. The nod goes back across the table, and Gwen is left holding it."},{"text":"\u201cYou're kind. Yours is miles better laid out.\u201d","tag":"ok","you":-5,"them":0,"outcome":"Gwen: \u201cMine's a mess, actually.\u201d She goes back to her page.","why":"It sounds generous because it praises her. It still hands the nod back, and now two people are talking down their own work."},{"text":"\u201cThank you. It took me two evenings.\u201d","tag":"best","you":8,"them":5,"outcome":"Gwen nods, once. Mrs Pryce, aside: \u201cDid everyone see that? She kept it.\u201d","why":"Rule three broken. You took a nod you wanted and added a true detail. The bounce did not happen, and the table warms up again.","flags":["rule_3_broken"]}]}],"fallout":{"you":"Your steadiness runs out. You apologise to the whole table, and Mrs Pryce says, \u201cSame sheet next Wednesday.\u201d"},"example":"A shared office kitchen.<br>A colleague says, \u201cYour brownies went in a minute.\u201d<br>You say, \u201cOh, they were from a packet,\u201d and the compliment goes back into the tin."},{"type":"pick","who":"Mrs Pryce","text":"\u201cStop. When Gwen said your cover note was the only one she could follow, what were you about to do?\u201d","options":["Hand it back by saying it was copied","Swallow it because she looked embarrassed","Ask her what she wanted from me"],"answer":0,"why":"You nearly handed it back. Gwen meant the praise, and the quick wave-off is the very thing the rule exists to protect.","traps":{"1":"Mrs Pryce: \u201cLook again.\u201d Gwen wasn't embarrassed. She gave the nod with her eyes on the page, and it was ready to be taken.","2":"Mrs Pryce: \u201cLook again.\u201d Gwen wanted nothing back. She said one thing she meant, and it was only a nod."},"example":"A friend says, \u201cYou were really good in that meeting.\u201d<br>Your first move is \u201cOh, they just asked easy questions.\u201d<br>The praise was meant, and it didn't land."},{"type":"scene","title":"Wednesday, 20:55, the stairwell","setting":"Rules four and five, then the stairs. Colin is kind, and unbearable. Mrs Pryce is jingling the annexe keys.","meters":{"you":60,"them":50},"beats":[{"who":"Colin","text":"\u201cYou'll scrape a pass, love, don't you worry. I did the resit twice and look at me now. Bookkeeping isn't for everyone.\u201d","cue":"kindly, one hand flat on your cash-flow page","lines":[{"text":"\u201cThanks, Colin.\u201d","tag":"ok","you":-5,"them":0,"outcome":"Colin pats the page. \u201cThat's the spirit.\u201d","why":"You swallowed a nod you didn't want. The rule holds, and it costs you some steadiness. It is exactly what the rule asks of you."},{"text":"\u201cHa. Yes, scraping is the plan.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Colin beams, and the story of his second resit runs for another minute.","why":"Agreeing to be the one who scrapes keeps the peace. It looks easy, but you are now in his story, and the rule keeps running."},{"text":"\u201cColin, I appreciate it. I don't want to be your resit story tonight. Can I just be someone doing the course?\u201d","tag":"best","you":10,"them":-4,"outcome":"Colin, after a beat: \u201c\u2026Fair enough.\u201d His hand comes off the page.","why":"Rule four broken. You turned down a nod you didn't want, politely and out loud. The table cools for a moment, and it comes back if you hold steady.","flags":["rule_4_broken"]}]},{"who":"Mrs Pryce","text":"\u201cLast one on your sheet. One thing you did well on this project. About you, out loud.\u201d","cue":"the keys stop jingling; Gwen puts her bag down again","lines":[{"text":"\u201cI\u2026 turned up every week?\u201d","tag":"ok","you":2,"them":0,"outcome":"Mrs Pryce: \u201cThat's a dodge. Try again.\u201d It is the only time she pushes you.","why":"Turning up is true, but it is a shrug. Rule five asks for the specific thing you did, with your name on it."},{"text":"\u201cOh, I'm nothing special. Gwen's template did most of it.\u201d","tag":"ok","you":-3,"them":0,"outcome":"Gwen: \u201cI did not write your opening balances.\u201d","why":"It credits the room, which looks generous. It is still a bounce, and it hands the nod off so you never have to hold it."},{"text":"\u201cWhen the opening balances wouldn't tie out, I rebuilt them twice. Nobody asked me to.\u201d","tag":"best","you":10,"them":6,"outcome":"Rhys: \u201cIt shows.\u201d Mrs Pryce writes something small on her sheet.","why":"Rule five broken. You gave yourself a nod for something you did, out loud, and the table accepted it. The warmth that was dipping comes back.","flags":["rule_5_broken","self_nod"]}]},{"who":"Rhys","text":"\u201cWhat you said about the opening balances. I liked that.\u201d","cue":"holding the annexe door, looking at the car park, nobody else close","lines":[{"text":"\u201cHa. Don't tell Colin.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Rhys: \u201cWouldn't dream of it.\u201d The door swings shut behind you both.","why":"A joke keeps the secret, and it also tidies the nod away. Rhys is left to decide whether it landed."},{"text":"\u201cThank you. Your note on the last column saved me an hour.\u201d","tag":"best","you":4,"them":5,"outcome":"\u201cYeah. Don't\u2026 say anything on Friday.\u201d","why":"A warm nod from a man who has forbidden himself to give them. You took it plainly and handed one back, and that counts for more than it looks."},{"text":"Say nothing, and nod.","tag":"ok","you":1,"them":2,"outcome":"He nods, once, and heads for the bus stop.","why":"A nod back without words is fine, but it leaves him to decide what it meant."}]}],"fallout":{"you":"Your steadiness runs out. You apologise to the whole table, and Mrs Pryce says, \u201cSame sheet next Wednesday.\u201d"},"example":"A dinner after a graduation.<br>An uncle says, \u201cYou've worked hard, you must be proud.\u201d<br>You say, \u201cOh, it was all luck,\u201d and the table moves on without the praise."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"Colin says the five rules are just how a tired class behaves. When nods stay scarce at that table, who gains?","options":["The students who go without, since wanting a nod makes them work harder to earn one","Nobody, tired people are quiet and a quiet table is easy to sit at","Whoever hands out the marks, because their one well done is worth more"],"answer":2,"why":"When nods are rare, the one who controls them has the most power over the people who want them. The students short of nods pay for the rules.","traps":{"0":"It is true that wanting a nod makes people try harder, and that is the cost. The students are paying for it, so they cannot be the ones gaining.","1":"Tiredness may be part of the mood. These rules still cost the people who need a nod, so they are more than manners."},"example":"An office where the boss never says well done.<br>The team works just as hard, and the boss's own praise is worth a great deal because it is rare."}]}]},{"setting":"Home & Flatmates","blurb":"Rota night in apartment 3B. Maya wants five things said before the pasta is done.","opener":{"setting":"Sunday, 19:40. Hawthorn Court, apartment 3B, the kitchen table. The rota is still stuck to the fridge, half crossed out, and the pasta has eleven minutes left.","lines":[{"who":"Maya","text":"\u201cRota night. Nobody leaves the table until it's sorted.\u201d","cue":"stirring with her back to the room, still in her work shoes"},{"who":"Sam","text":"\u201cWe could do it by text, like people.\u201d","cue":"peeling the label off a squash bottle"},{"who":"Maya","text":"\u201cEleven minutes. Five things get said first, and I'm not telling you which.\u201d","cue":"slides a folded rota page under your plate"}],"ask":"Can you break all five of the flat's unwritten rules before the pasta timer goes?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Three lines from the flat. Tap which unwritten rule each one is enforcing.","items":[{"type":"pick","who":"Maya","text":"\u201cOh, it's nothing. Anyone would have done it.\u201d","cue":"after you thank her for the tub of soup in the fridge door","options":["Don't give nods you have","Don't ask for nods you need","Don't accept nods you want"],"answer":2,"why":"Don't accept nods you want. Your thanks went to her, and she waved it off before it could land.","traps":{"0":"Don't give nods would be about holding praise back. You gave one, so the rule at work now is about what she does with it.","1":"Don't ask would fit if you had begged for thanks. You only handed some over."},"example":"A neighbour who minds your parcel.<br>\u201cThanks so much for taking it in.\u201d<br>\u201cOh, it was nothing at all.\u201d<br>The thanks arrived and went straight back."},{"type":"pick","who":"Sam","text":"\u201cNobody says well done about washing up. That's just living here.\u201d","cue":"to the room, as you stack the last of the pans","options":["Don't give nods you have","Don't refuse nods you don't want","Don't give yourself nods"],"answer":0,"why":"Don't give nods you have. Sam says it out loud, so nobody in the flat has to test it. A thank you for washing up is a nod, and the flat keeps them scarce.","traps":{"1":"Don't refuse is about turning away a nod you didn't want. Nobody has offered you one.","2":"Don't give yourself nods would be you praising your own washing up. Sam is talking about what the flat may say to each other."},"example":"A shared allotment.<br>\u201cWe don't thank people for weeding, it's an allotment.\u201d<br>The weeding gets done, and the thanks never does."},{"type":"pick","who":"Maya","text":"\u201cDon't fish for thanks, it spoils it.\u201d","cue":"after you ask whether anyone noticed you did the shop twice this week","options":["Don't give nods you have","Don't ask for nods you need","Don't refuse nods you don't want"],"answer":1,"why":"Don't ask for nods you need. You asked for a bit of notice, and the flat's reply is a warning, not a thank you.","traps":{"0":"Don't give would be about the flat handing out praise. Maya is reacting to your request, so the rule is about asking.","2":"Don't refuse is about turning away a nod that felt wrong. Nobody has offered you anything you want to refuse."},"example":"A shared lift to work.<br>\u201cDid you see I drove all week?\u201d<br>\u201cDon't keep a tally.\u201d<br>Asking got a frown, and the frown is the rule."}]},{"level":"Play","label":"Play, rota night","intro":"Five rules, one each. Break them, and hold steady when the kitchen pushes back.","items":[{"type":"scene","title":"Sunday, 19:41, the kitchen table","setting":"Maya at the hob. Sam on the other side of the table, picking at a label. The timer ticks on the cooker, and you have twelve seconds a line.","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cEleven minutes. Which means I can nearly finish this label.\u201d","cue":"lifts his glass of squash an inch at you, then pretends he meant the window","lines":[{"text":"\u201cIs that really squash? It looks like a science project.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Sam laughs at his own glass. Maya says, without turning, \u201cTen minutes.\u201d","why":"A joke about the drink keeps the table easy and keeps you out of the five things."},{"text":"Look at the folded rota page and say nothing.","tag":"ok","you":-3,"them":0,"outcome":"Maya: \u201cSilence is allowed. Five things, though.\u201d","why":"Silence is a way of making yourself small at the table. Maya lets it pass, once."},{"text":"Lift your glass back.","tag":"best","you":2,"them":2,"outcome":"Sam looks at the window, then at you. Maya has missed it, or pretends she has.","why":"You returned the nod, which is what people sharing a table do. Sam made the first small move and you met it."}]},{"who":"Maya","text":"\u201cI did the swap for Priti, so that's a double. Don't make a face. It's fine.\u201d","cue":"still stirring, her back to the table, her lanyard still on","lines":[{"text":"\u201cYou did a double and you still cooked. That's a lot, and I noticed.\u201d","tag":"best","you":8,"them":-3,"outcome":"The spoon stops. \u201c\u2026Don't.\u201d Sam: \u201cWe don't do that at this table, it gets weird.\u201d","why":"Rule one broken. You gave a nod you had, in plain words, and the kitchen felt it. The dip is real, and it eases if you hold steady.","flags":["rule_1_broken"]},{"text":"\u201cMm.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Maya reaches for the salt. The rule holds.","why":"A grunt is the safe move. It keeps the room flat and keeps you out of the way."},{"text":"\u201cTell me about it. I did a long day too.\u201d","tag":"ok","you":-3,"them":-2,"outcome":"Maya: \u201cMm.\u201d She does not say any more about her double.","why":"It turns her moment into yours. The nod you had for her stays in your pocket."}]},{"who":"Sam","text":"\u201cAnything to add to the rota? Anyone? No? Brilliant.\u201d","cue":"pen hovering, already closing the page","lines":[{"text":"\u201cFine as it is.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Sam crosses a box and moves on to the bins. Maya taps the timer.","why":"An easy answer asks for nothing. It keeps the rule, and you stay at the edge of the table."},{"text":"\u201cYes. I cleared out the fridge on Thursday and nobody said a word. I'd like one word, even a short one.\u201d","tag":"best","you":10,"them":4,"outcome":"Silence. Then Maya: \u201cIt was a good clear-out. The yoghurt was older than the lease.\u201d Sam: \u201cI did notice. I just didn't say.\u201d","why":"Rule two broken. You asked the flat for a nod, and nobody asks for one here, so the question landed like a stone. The answer came back warm.","flags":["rule_2_broken"]},{"text":"\u201cThe rota could do with a line for fridge clear-outs.\u201d","tag":"ok","you":2,"them":0,"outcome":"Sam writes \u201cfridge\u201d in the margin. Nobody says why you mentioned it.","why":"A rota line is useful, and it is also a way of hinting. You get a box, and still no nod."}]},{"who":"Maya","text":"\u201cThe shelf you labelled for the milk actually works.\u201d","cue":"not turning round, straining the pasta over the sink","lines":[{"text":"\u201cOh, it took thirty seconds. Anyone could have done it.\u201d","tag":"ok","you":-6,"them":0,"outcome":"Maya's shoulders drop a little. \u201cRight. Well.\u201d","why":"This is the bounce, the most common way of keeping rule three. The nod goes back across the kitchen and leaves her holding it."},{"text":"\u201cThanks. It took me three tries to get the labels straight.\u201d","tag":"best","you":8,"them":5,"outcome":"Maya turns, just for a second. Sam, aside: \u201cDid you see that? She kept it.\u201d","why":"Rule three broken. You took a nod you wanted and added a true detail. The bounce did not happen, and the room warms up again.","flags":["rule_3_broken"]},{"text":"\u201cYou're kind. Your fridge shelf is far tidier than mine.\u201d","tag":"ok","you":-5,"them":0,"outcome":"Maya: \u201cIt really isn't.\u201d She carries the colander away.","why":"It sounds generous because it praises her. It still hands the nod back, and it starts a small contest about who is worse."}]}],"fallout":{"you":"Your steadiness runs out. You apologise to the whole table, and Maya says, \u201cSame page next Sunday.\u201d"},"example":"A shared student kitchen.<br>A flatmate says, \u201cThat curry smelled amazing.\u201d<br>You say, \u201cIt was only a jar,\u201d and the compliment goes down the plughole with the water."},{"type":"pick","who":"Sam","text":"\u201cWait, you went red. What was that, when Maya said the milk shelf works?\u201d","options":["She was just being polite about the milk","She wanted something back from me","I nearly waved it away"],"answer":2,"why":"You nearly waved it away. Maya's nod was small and meant, and the reflex to shrink it is what the rules protect.","traps":{"0":"Sam: \u201cLook again.\u201d A polite nod still counts as a nod. If you file it as manners, the reflex to wave it off has a good excuse.","1":"Sam: \u201cLook again.\u201d Maya asked for nothing. She said one true thing over the sink."},"example":"A friend says, \u201cYou always remember my birthday.\u201d<br>Your first move is \u201cIt's just a calendar reminder.\u201d<br>The compliment was for you, and you passed it to your phone."},{"type":"scene","title":"Sunday, 20:02, the balcony","setting":"Rules four and five, then the balcony. Sam is kind, and unbearable. Maya is drying the pan outside because the kitchen is too hot.","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cMate, you look wrecked. Go and lie down, I'll do your bit of the rota. Poor you.\u201d","cue":"kindly, a hand on your shoulder, steering you to the sofa","lines":[{"text":"\u201cHa. I could do with a lie down, actually.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Sam beams, and you are on the sofa before the pasta is finished.","why":"Going along with being poor you keeps the peace. It also puts you into the story, and the rule keeps running."},{"text":"\u201cSam, thanks, but I don't want taking off the rota. I would like you to ask me how the week was.\u201d","tag":"best","you":10,"them":-4,"outcome":"Sam, after a beat: \u201c\u2026Fair. How was the week?\u201d The hand comes off your shoulder.","why":"Rule four broken. You turned down a nod you didn't want, politely and out loud, and said what you would take instead. The kitchen cools for a moment and comes back if you hold steady.","flags":["rule_4_broken"]},{"text":"\u201cThanks, Sam.\u201d","tag":"ok","you":-5,"them":0,"outcome":"Sam pats your arm. \u201cThat's the spirit.\u201d","why":"You swallowed a nod you didn't want. The rule holds, and it costs you some steadiness. It is exactly what the rule asks of you."}]},{"who":"Maya","text":"\u201cLast thing on the page. One thing you did well this week. About you, out loud.\u201d","cue":"from the balcony door, a wet pan in one hand","lines":[{"text":"\u201cI've been here and I washed up. Does that count?\u201d","tag":"ok","you":2,"them":0,"outcome":"Maya: \u201cThat's a dodge. Try again.\u201d It is the only time she pushes you.","why":"Washing up is true, but it is a shrug. Rule five asks for the specific thing you did, with your name on it."},{"text":"\u201cOh, I'm nothing special. You two do all the real work.\u201d","tag":"ok","you":-3,"them":0,"outcome":"Sam: \u201cNobody asked you to be special. Just to say one thing.\u201d","why":"It credits the flat, which looks kind. It is still a bounce, and it hands the nod off so you never have to hold it."},{"text":"\u201cI cleared the fridge, labelled the shelves and nobody had to ask me. I'm proud of the milk shelf.\u201d","tag":"best","you":10,"them":6,"outcome":"Sam: \u201cIt is a good shelf.\u201d Maya: \u201cIt is.\u201d","why":"Rule five broken. You gave yourself a nod for something you did, out loud, and the flat accepted it. The warmth that was dipping comes back.","flags":["rule_5_broken","self_nod"]}]},{"who":"Maya","text":"\u201cThat was brave. Back there, with the fridge thing.\u201d","cue":"alone on the balcony, drying the same pan, not looking at you","lines":[{"text":"\u201cThanks. It helped that you answered.\u201d","tag":"best","you":4,"them":5,"outcome":"\u201cYeah. Don't\u2026 tell Sam I said that. He'll want it on the rota.\u201d","why":"A warm nod from someone who has forbidden herself to give them. You took it plainly and gave one back, and that counts for more than it looks."},{"text":"\u201cWas it? It felt a bit much.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"Maya: \u201cIt was fine.\u201d She dries the pan harder.","why":"Asking if it was brave invites her to defend what she said. It also shrinks the nod you just got."},{"text":"Say nothing, and nod.","tag":"ok","you":1,"them":2,"outcome":"She nods, once, and goes in to fetch the plates.","why":"A nod back without words is fine, but it leaves her to decide what it meant."}]}],"fallout":{"you":"Your steadiness runs out. You apologise to the whole table, and Maya says, \u201cSame page next Sunday.\u201d"},"example":"A family holiday.<br>A cousin says, \u201cYou've really done well this year.\u201d<br>You say, \u201cOh, it was all luck,\u201d and everyone gets on with the sandwiches."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"Sam says the flat's rules are just about being easy to live with. When nobody says thanks, or asks for it, who gains?","options":["Nobody, it keeps the peace and spares everyone a bit of awkwardness","Whoever gets the work done without the thanks, as people keep trying to earn one","The flatmates who get thanked the least, who learn to need less and so cope better"],"answer":1,"why":"Scarce nods keep people working to earn them, and the one who benefits is whoever gets the work. The flatmates short of thanks pay for the rules.","traps":{"0":"Peace sounds like a gain for everyone. The cost lands on whoever does the most and hears the least, so it is not shared evenly.","2":"Learning to need less can feel like strength. It is the flatmate going without who pays, and coping is the price."},"example":"A shared house where the cleaner is never thanked.<br>The house stays clean, and the cleaner starts doing more to be noticed."}]}]},{"setting":"Work","blurb":"Release retro at Halden. Daniel hands you a card with five things to say aloud before the build finishes.","opener":{"setting":"Thursday, 16:30. Halden, the team room. The release build has eleven minutes to run, and Daniel has pulled the chairs into a ring.","lines":[{"who":"Daniel","text":"\u201cRetro, with a timer. Call it an experiment. Praise is not an agenda item.\u201d","cue":"setting a phone on the table, screen up"},{"who":"Clara","text":"\u201cIs the rollback script on the board, or do I just stand near it?\u201d","cue":"laptop open on her knees, a sticky note already in her hand"},{"who":"Daniel","text":"\u201cFive things before the build finishes. I won't say which.\u201d","cue":"hands you a card, face down"}],"ask":"Can you break all five of the team's unwritten rules before the build turns green?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Three lines from the team room. Tap which unwritten rule each one is enforcing.","items":[{"type":"pick","who":"Omar","text":"\u201cAh, it was a team effort. I just clicked deploy.\u201d","cue":"after Daniel says last week's release was the cleanest in a year","options":["Don't give nods you have","Don't accept nods you want","Don't ask for nods you need"],"answer":1,"why":"Don't accept nods you want. Daniel's praise reached Omar, and he spread it thin across the team before it could land on him.","traps":{"0":"Don't give would be about holding praise back. Daniel gave his, and what happened next was about taking it.","2":"Don't ask would fit if Omar had gone looking for praise. It came to him without a request."},"example":"A kitchen team after a busy night.<br>\u201cTable nine said the sauce was incredible.\u201d<br>\u201cOh, the whole line did that.\u201d<br>The praise arrived, and the cook sent it away."},{"type":"pick","who":"Clara","text":"\u201cThanks, that's really lovely.\u201d","cue":"said through a tight smile, after a colleague calls you the new kid again","options":["Don't refuse nods you don't want","Don't give nods you have","Don't give yourself nods"],"answer":0,"why":"Don't refuse nods you don't want. The 'new kid' is a nod you didn't ask for, and swallowing it with a smile is what the rule asks of you.","traps":{"1":"Don't give would be about a person holding back praise. Here a nod was given, and it was the wrong one.","2":"Don't give yourself nods is about praising your own work. Nobody here is boasting."},"example":"A neighbour who calls you 'young man' at the bus stop.<br>\u201cLovely to see you, young man.\u201d<br>\u201cThanks, you too.\u201d<br>The nod you didn't want was swallowed whole."},{"type":"pick","who":"You","text":"\u201cI only did the easy bit, really.\u201d","cue":"said to the team room, when asked how your first ticket went","options":["Don't ask for nods you need","Don't refuse nods you don't want","Don't give yourself nods"],"answer":2,"why":"Don't give yourself nods. You were asked how it went, and the rule steered you to shrink your own work before anyone else could.","traps":{"0":"Don't ask would be about asking others for recognition. You were asked a question, and you didn't answer it fairly.","1":"Don't refuse is about a nod you don't want. This was your own work, and you shrank it yourself."},"example":"A father at a sports day.<br>\u201cHow did you find the 200 metres?\u201d<br>\u201cOh, I only ran it.\u201d<br>The runner had a good race and said nothing about it."}]},{"level":"Play","label":"Play, the release retro","intro":"Five rules, one each. Break them, and hold steady when the room pushes back.","items":[{"type":"scene","title":"Thursday, 16:31, the team room","setting":"Daniel with the timer. Clara, Omar and Sam sit in the ring with you. The build bar is at 12 percent, and you have twelve seconds a line.","meters":{"you":60,"them":50},"beats":[{"who":"Daniel","text":"\u201cFive things. One at a time. The timer does not do favours.\u201d","cue":"Omar, at the end of the row, lifts two fingers off his mug at you and looks away","lines":[{"text":"\u201cDoes the timer take a break if the build fails?\u201d","tag":"ok","you":-2,"them":-1,"outcome":"Daniel: \u201cNo. Get on with it.\u201d Sam laughs once.","why":"A joke about the timer buys time. It keeps the room comfortable and keeps you out of the five things."},{"text":"Study the card without lifting your head.","tag":"ok","you":-3,"them":0,"outcome":"Daniel: \u201cFine. Silence is data too. Five things, though.\u201d","why":"Silence is a way of making yourself small in the room. Daniel lets it pass, once."},{"text":"Lift two fingers back at Omar.","tag":"best","you":2,"them":2,"outcome":"Omar studies his mug, then glances at you again. Nobody else has noticed.","why":"You returned the nod, which is what people on a team do for each other. Omar made the first small move and you met it."}]},{"who":"Clara","text":"\u201cThe rollback script is on the board. It works. It always works. I'm sure it's fine.\u201d","cue":"sticking the note up, eyes on Daniel, not on you","lines":[{"text":"\u201cClara, that rollback script would have saved us last month. It's clean work.\u201d","tag":"best","you":8,"them":-3,"outcome":"Clara blinks. \u201c\u2026Thanks.\u201d Daniel: \u201cWe keep praise out of retro. It biases the data.\u201d","why":"Rule one broken. You gave a nod you had, out loud, and the room saw it. The chill is real, and it eases if you hold steady.","flags":["rule_1_broken"]},{"text":"\u201cMm.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Clara moves on to the next note. The rule holds.","why":"A grunt is the safe move. It keeps the room flat and keeps you out of the way."},{"text":"\u201cAdd a test for it and it'd be perfect.\u201d","tag":"ok","you":-3,"them":-3,"outcome":"Clara's smile goes tight. \u201cNoted.\u201d She writes it on the board.","why":"Turning the nod into a fix keeps the praise out of the room. For someone who earns her place through being useful, it means there is always more to do."}]},{"who":"Daniel","text":"\u201cAnything for the board before I close this? Anyone? No? Efficient.\u201d","cue":"thumb already on the timer","lines":[{"text":"\u201cYes. I'd like to know how my first release looked from outside. Nobody has said either way.\u201d","tag":"best","you":10,"them":4,"outcome":"Silence. Then Omar: \u201cCareful. Slow. Nothing broke.\u201d Clara: \u201cI'd have died asking that in front of Daniel.\u201d","why":"Rule two broken. You asked the room for a nod, and nobody asks for one here, so the question landed like a stone. The answer came back warm.","flags":["rule_2_broken"]},{"text":"\u201cI can wait for the review cycle.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Daniel nods, pleased with himself. \u201cQuite right.\u201d","why":"Waiting for the official review is the polite way of not asking. It keeps the rule, and you go on guessing."},{"text":"\u201cNothing for the board. All good.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Daniel closes the item. The bar says 31 percent.","why":"The easy answer asks for nothing. You stay at the edge of the ring."}]},{"who":"Omar","text":"\u201cYour migration notes were the clearest I've read on this team.\u201d","cue":"to the mug, not to you, meaning it","lines":[{"text":"\u201cYou're kind. Clara's are far better than mine.\u201d","tag":"ok","you":-5,"them":0,"outcome":"Omar: \u201cClara's are in a different style.\u201d Clara looks at her laptop.","why":"It sounds generous because it praises Clara. It still hands the nod back, and it drags her into a comparison she did not ask for."},{"text":"\u201cOh, they're mostly the old wiki page with the names changed.\u201d","tag":"ok","you":-6,"them":0,"outcome":"Omar's face closes a little. \u201cRight. Fair enough.\u201d","why":"This is the bounce, the most common way of keeping rule three. The nod goes back across the ring and leaves him holding it."},{"text":"\u201cThanks. I rewrote them three times.\u201d","tag":"best","you":8,"them":5,"outcome":"Omar nods. Sam, aside: \u201cDid you hear that? He kept it.\u201d","why":"Rule three broken. You took a nod you wanted and added a true detail. The bounce did not happen, and the room warms up again.","flags":["rule_3_broken"]}]}],"fallout":{"you":"Your steadiness runs out. You apologise to the whole ring, and Daniel says, \u201cSame card next release.\u201d"},"example":"A team lunch.<br>A colleague says, \u201cYour slides were great.\u201d<br>You say, \u201cOh, they were just the template,\u201d and the compliment goes back across the table."},{"type":"pick","who":"Daniel","text":"\u201cPause the timer. When Omar called your migration notes the clearest on the team, what were you about to do?\u201d","options":["Check he wasn't being sarcastic","Hand it back by saying they were copied","Ask him to put it in writing"],"answer":1,"why":"You nearly handed it back. Omar meant the praise, and the reflex to wave it off is the thing the rules protect.","traps":{"0":"Daniel: \u201cLook again.\u201d Omar said it to his mug in a flat voice. That was him being steady, and it is no sign of sarcasm.","2":"Daniel: \u201cLook again.\u201d Omar asked for nothing, and a written record would just turn a nod into paperwork."},"example":"A friend says, \u201cYou're brilliant with the kids.\u201d<br>Your first move is \u201cThey're easy.\u201d<br>The compliment was meant, and it left through the door."},{"type":"scene","title":"Thursday, 16:46, the lift down","setting":"Rules four and five, then the lift. Daniel is kind, and unbearable. The build bar is at 80 percent.","meters":{"you":60,"them":50},"beats":[{"who":"Daniel","text":"\u201cYou'll get the hang of it. Everyone's first release is a bit of a car crash. I was far worse at your stage, and look at me.\u201d","cue":"kindly, with his whole weight on the back of your chair","lines":[{"text":"\u201cHa. Car crash, yes.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Daniel beams, and his own first release runs for another minute.","why":"Agreeing to be the car crash keeps the peace. It looks easy, but you are now in his story, and the rule keeps running."},{"text":"\u201cThanks, Daniel.\u201d","tag":"ok","you":-5,"them":0,"outcome":"Daniel pats the chair. \u201cThat's the spirit.\u201d","why":"You swallowed a nod you didn't want. The rule holds, and it costs you some steadiness. It is exactly what the rule asks of you."},{"text":"\u201cDaniel, I appreciate it, but it didn't go like a car crash. I'd like it logged as a clean one.\u201d","tag":"best","you":10,"them":-4,"outcome":"Daniel, after a beat: \u201c\u2026Fair. Logged as clean.\u201d His weight comes off the chair.","why":"Rule four broken. You turned down a nod you didn't want, politely and out loud, and said what you would take instead. The room cools for a moment, and it comes back if you hold steady.","flags":["rule_4_broken"]}]},{"who":"Daniel","text":"\u201cLast card. One thing you did well this release. About you, out loud. Data, not vibes.\u201d","cue":"the timer on the table, the bar creeping to 90 percent","lines":[{"text":"\u201cI found the migration order bug on Wednesday night and fixed it before anyone had to ask.\u201d","tag":"best","you":10,"them":6,"outcome":"Omar: \u201cIt showed.\u201d Clara writes something on a sticky note and doesn't hide it.","why":"Rule five broken. You gave yourself a nod for something you did, out loud, and the room accepted it. The warmth that was dipping comes back.","flags":["rule_5_broken","self_nod"]},{"text":"\u201cOh, I'm nothing special. Clara's script did the heavy lifting.\u201d","tag":"ok","you":-3,"them":0,"outcome":"Daniel: \u201cThat's a deflection. Try again.\u201d Clara looks at her shoes.","why":"It credits Clara, which looks kind. It is still a bounce, and it hands the nod off so you never have to hold it."},{"text":"\u201cI\u2026 made it to the release on time?\u201d","tag":"ok","you":2,"them":0,"outcome":"Daniel: \u201cThat's a dodge. Try again.\u201d It is the only time he pushes you.","why":"Being on time is true, but it is a shrug. Rule five asks for the specific thing you did, with your name on it."}]},{"who":"Clara","text":"\u201cThat index thing. That was good.\u201d","cue":"in the lift, eyes on the floor numbers, nobody else close","lines":[{"text":"\u201cWas that in the official notes, then?\u201d","tag":"ok","you":-2,"them":-3,"outcome":"Clara: \u201cForget it.\u201d The lift stops and she is out of it first.","why":"It is a joke that asks her to put the nod on the record. For someone who cannot take a compliment she has not earned, it takes the nod back."},{"text":"Say nothing, and nod.","tag":"ok","you":1,"them":2,"outcome":"She nods once. The doors open on the ground floor.","why":"A nod back without words is fine, but it leaves her to decide what it meant."},{"text":"\u201cThank you. I'll keep that one.\u201d","tag":"best","you":4,"them":5,"outcome":"\u201cYeah. Don't\u2026 tell Daniel I said something nice. He'll want a metric.\u201d","why":"A warm nod from someone who has forbidden herself to give them. You took it plainly, and that counts for more than it looks."}]}],"fallout":{"you":"Your steadiness runs out. You apologise to the whole ring, and Daniel says, \u201cSame card next release.\u201d"},"example":"A leaving do.<br>A manager says, \u201cYou've done so well here, you must be proud.\u201d<br>You say, \u201cOh, it was all luck,\u201d and the evening moves on without the praise."}]},{"level":"Analyse","label":"A
