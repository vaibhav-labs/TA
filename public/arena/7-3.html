<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Green Light, Safety Net · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"7.3","setting":"Work","title":"Green Light, Safety Net","world":7,"worldName":"Free to Choose","week":7,"weekName":"Free to Choose","mechanic":"Choice-story","concept":"After this one you can give a green light only with a safety net and a backbone behind it.","plainWord":"the green light","bookTerm":"Permission, protection and potency","bookIdea":"Steiner describes a permission as a yes, with a reason the person can accept, that frees them from an old order, and says it works only if the giver also provides protection for the fear that follows and has the potency, the strength, to stand behind it.","bookSource":"Scripts People Live, ch. 21","opener":{"setting":"Wednesday, 6:50pm, Halden, the third floor, by the station. The office is nearly empty, and Clara has been at her desk since five.","lines":[{"who":"Clara","text":"\u201cI've been here since five. Nobody's told me yet, and the demo's on Thursday.\u201d","cue":"hands flat on the desk, not quite looking up"}],"ask":"Which parts of a yes make it safe to give?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"A yes that holds has three parts, and all three are yours to bring. The green light is the yes itself, with a reason the other person can accept. The safety net is you being there when the fear arrives. The backbone is your strength to keep the yes standing when someone pushes against it.","items":[{"type":"pick","who":"You","text":"\u201cYes, run the Thursday demo on your own. You rebuilt the pricing sheet in a day when Omar was out, so you can do this.\u201d","cue":"to Clara, pen in your hand, smiling","options":["The green light","The safety net","The backbone"],"answer":0,"why":"That is the yes, and it comes with a reason Clara can check against her own week. A green light with a reason she believes is one she can use.","traps":{"1":"The safety net. Nothing in the line says what happens if the demo goes wrong. It gives a yes and a reason.","2":"The backbone. Nobody is pushing against the yes in this line, so there is nothing to hold yet."},"example":"Driving school, Saturday, 9:00am.<br>Learner: \u201cCan I take the car up the hill on my own?\u201d<br>Instructor: \u201cYes. You held the clutch perfectly on Tuesday, so you're ready.\u201d"},{"type":"pick","who":"You","text":"\u201cIf it goes wrong, call me. I'll be on the line, and plan B is on the shared drive.\u201d","cue":"to Clara, one hand on the back of her chair","options":["The green light","The safety net","The backbone"],"answer":1,"why":"That is the net. It says who catches the fall and how fast, so the fear that comes after the yes has somewhere to go.","traps":{"0":"The green light. The yes is already given. This line is about what happens when it wobbles.","2":"The backbone. Promising to be there is the net. The backbone is about holding the yes when somebody pushes against it."},"example":"Trek to the lake, 6:00am, the base camp.<br>Guide: \u201cIf the weather turns, we come down the east path, and I'll radio the hut.\u201d<br>Walker: \u201cGood. That's the plan.\u201d"},{"type":"pick","who":"You","text":"\u201cDaniel says Clara is too new for the client. I've told him the yes stands, and I'll say it again in the meeting.\u201d","cue":"to Clara, in the corridor, voice level","options":["The green light","The safety net","The backbone"],"answer":2,"why":"That is the backbone. Someone is pushing against the yes, and you keep it standing. A yes that folds when the first person objects was never a yes she could lean on.","traps":{"0":"The green light. The yes was given earlier. This line is about keeping it standing.","1":"The safety net. A net catches a fall. This line is about stopping the yes from being pulled away in the first place."},"example":"Swimming pool, Saturday, 8:00am.<br>Parent: \u201cShe's too young for the deep end.\u201d<br>Coach: \u201cI've said she can go in, and she will. I'll be on the steps.\u201d<br>The girl climbs down the ladder."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Watch what each yes does to the other person, what happens when the net is missing, and what a yes does when someone leans on it.","items":[{"type":"scene","title":"Wednesday, 6:50pm, the third floor","setting":"Halden, by the station. The lights are off over the empty rows, and the demo file is open on Clara's screen.","meters":{"you":60,"them":50},"beats":[{"who":"Clara","text":"\u201cCan I run the Thursday demo on my own? Just tell me yes or no.\u201d","cue":"hands flat on the desk, not quite looking at you","lines":[{"text":"\u201cYes. Go on, it's yours.\u201d","tag":"game","you":-4,"them":-3,"outcome":"The scene stops there. Clara says thanks in a flat voice and turns back to her slides, with nothing to hold if the client pushes.","why":"A bare green light is a yes with the net cut away. It feels generous for a second, and then the person is alone with the risk you handed over."},{"text":"\u201cYes. You rebuilt the pricing sheet in a day when Omar was out, so you can do this. And if it breaks, I'm on the call with a plan B on the shared drive.\u201d","tag":"best","you":4,"them":4,"outcome":"Clara exhales and starts reading the plan B slides. She says it is the first time all week she has stopped bracing.","why":"You give the yes, a reason from her own week that she can accept, and the safety net in one breath. She knows she will not be left alone if it wobbles."},{"text":"\u201cLet's talk about it Thursday morning.\u201d","tag":"ok","you":0,"them":-3,"outcome":"Clara's shoulders drop. \u201cThursday's too late to prep,\u201d she says, and goes back to her slides.","why":"A delay is not a green light. It is a shrug, and it leaves her guessing for the rest of the evening."}]},{"who":"Clara","text":"\u201cAnd if the client asks something I don't know?\u201d","cue":"pen clicking against the desk","lines":[{"text":"\u201cThen you'll have to think on your feet.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"She looks at the screen and doesn't say anything for a while.","why":"This hands the risk back to her with no way to carry it. It sounds like a shrug, and it leaves her with the fear."},{"text":"\u201cSay you'll come back by Friday with the answer. I'll be on the call, and I'll back you up.\u201d","tag":"best","you":3,"them":4,"outcome":"Clara writes \u201cFriday, with the pricing notes\u201d on the pad and underlines it twice.","why":"That is the net again, now in a sentence she can say in the room. It also says you will stand next to her, which keeps the yes from feeling like a dare."},{"text":"\u201cJust say you don't know. Everyone does.\u201d","tag":"ok","you":0,"them":-1,"outcome":"She nods, but she writes the question on the pad anyway.","why":"This is kind, but it is a shrug with a smile. It isn't a plan, so she has nothing to hold if the client pushes."}]},{"who":"Clara","text":"\u201cI'm not sure I can carry all of it. Pricing is the bit I always get wrong.\u201d","cue":"looking at the lights on the road by the station","lines":[{"text":"\u201cYou'll be fine. Don't worry about it.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"She nods and goes back to the slides, but she doesn't look convinced.","why":"Reassurance with no reason behind it. It sounds warm, and it gives her nothing to stand on."},{"text":"\u201cI said yes and I'm keeping it. Run the pricing slide for me now, and we'll fix whatever wobbles tonight.\u201d","tag":"best","you":4,"them":5,"outcome":"Clara laughs, a bit surprised, and runs the slide twice. The second time she doesn't stop at the figures.","why":"This is the backbone. You keep the yes in place when she wobbles, and you push a little where the wobble is, so the old doubt has to deal with your strength as well as hers."},{"text":"\u201cThen don't do it. Let Daniel handle the pricing.\u201d","tag":"game","you":-6,"them":-5,"outcome":"The scene stops there. Clara sits back, a bit smaller, and says she'll stick to the easy slides.","why":"This takes the yes back at the first wobble and calls it kindness. A green light that folds when the job gets hard has no backbone, and that is the trap."}]}],"payoff":"Thursday, 11:20am. Clara runs the demo with no plan B. When the client asks about pricing she has nothing to point at, and Daniel answers for her in the room. She doesn't speak again until the end.","fallout":{"them":"Clara closes the laptop and walks past the lift without saying goodnight."},"example":"Printing shop, by the station, 7:30pm.<br>Owner: \u201cCan I leave the shop with you for an hour? Just say yes.\u201d<br>You: \u201cYes, and if anything goes wrong I'm two lanes away.\u201d"},{"type":"scene","title":"Friday, 4:40pm, the server corner","setting":"Halden, third floor. Omar is leaning on the server rack with one hand pressed to his lower back. The payment fix is ready, and the release window closes at eleven.","meters":{"you":55,"them":45},"beats":[{"who":"Omar","text":"\u201cI want to ship the payment fix tonight without the second review. I've seen this bug before. Just say yes.\u201d","cue":"not sitting down, not quite standing straight","lines":[{"text":"\u201cFine. Ship it.\u201d","tag":"game","you":-4,"them":-3,"outcome":"The scene stops there. Omar nods and turns back to his laptop. The build goes into the queue, and nobody has checked the refund path.","why":"A bare yes with no net. If the fix breaks, Omar carries it alone, and you carry the knowledge that you signed off a check nobody ran."},{"text":"\u201cYes. Ship it once the refund test passes, and I'll sit with you on the diff at seven.\u201d","tag":"best","you":4,"them":4,"outcome":"Omar looks surprised, then relieved. \u201cSeven, then,\u201d he says, and starts the refund test.","why":"The yes comes with a net: the refund test first, and a check at seven that you will be there for. He is not left to carry the risk by himself."},{"text":"\u201cLet's leave it till Monday.\u201d","tag":"ok","you":0,"them":-3,"outcome":"Omar sighs. \u201cMonday's the release. Fine,\u201d he says, and goes back to his screen.","why":"A delay with no reason. It takes the yes away and leaves him to decide alone, which is much the same as having no net."}]},{"who":"Omar","text":"\u201cIt's always the same, isn't it? Nobody trusts me with the release.\u201d","cue":"a short laugh that isn't really a laugh","lines":[{"text":"\u201cYou're right, nobody does. Why don't you go home?\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Omar's face closes, and he stops talking about the fix altogether.","why":"This agrees with the sting and then pushes him out. It looks like sympathy, but it hands him the verdict and takes you out of the job."},{"text":"\u201cI do trust you, Omar. That's why I want the refund test to run first.\u201d","tag":"best","you":3,"them":5,"outcome":"Omar stops rubbing his back for a second. \u201cOkay,\u201d he says. \u201cFair enough.\u201d","why":"This gives him a reason to be believed, and a check that protects him too. The trust shows in the test, not only in the words."},{"text":"\u201cDon't start. Just do the test.\u201d","tag":"ok","you":-2,"them":-4,"outcome":"Omar shrugs and shuts the laptop. \u201cForget it.\u201d","why":"The request is right, but the tone is sharp. Omar hears a verdict on himself, and the test now feels like a punishment."}]},{"who":"Omar","text":"\u201cSeven o'clock, then. Don't bail on me.\u201d","cue":"pointing at you with the pen","lines":[{"text":"\u201cI won't. Bring the old bug notes, and I'll bring the diff.\u201d","tag":"best","you":2,"them":4,"outcome":"He nods, and the corridor lights click off as he heads for the coffee machine.","why":"The net only works if you turn up. You name what each of you will bring, so both people leave with a job, not a promise."},{"text":"\u201cFine, but if it breaks, it's on you.\u201d","tag":"game","you":-6,"them":-7,"outcome":"The scene stops there. Omar's jaw sets. \u201cRight. Forget seven.\u201d He pushes the release through alone.","why":"This is a green light with the net cut and a sting attached. He will remember the sting, not the review."},{"text":"\u201cSure, whatever you want.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"He says thanks, but he doesn't look at you again before he goes.","why":"It sounds easy, and it lets him ship without a plan. A yes with nothing behind it is only half a yes."}]}],"payoff":"Friday, 11:50pm. The payment fix goes out without the review. For two hours the refund path fails, and Omar answers the calls alone. The yes you gave is the first thing the team mentions on Monday.","fallout":{"them":"Omar goes home without saying goodbye, and the seven o'clock check never happens."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two explanations to check. Name the part that was missing, and when a big yes should wait.","items":[{"type":"pick","who":"Clara","text":"\u201cYes. Go on, it's yours.\u201d That was the whole of it, and then the demo went wrong.","cue":"in the corridor, the week after. Which explanation fits?","options":["Protection was missing. The green light came with no safety net, so Clara was alone with the fear when the demo wobbled. Steiner says the fear arrives after the step is taken, and the giver has to be there for it.","Permission was too strong. A green light should always come with a warning, not a yes.","Potency was the only thing missing. Clara lacked the skill, so no yes would have helped her."],"answer":0,"why":"A permission works when protection stands behind it. Steiner says a person who drops an old order often feels alone and scared afterwards, and without a giver ready to catch them they slide back. This yes had the first part only.","traps":{"1":"Permission too strong. It sounds careful, but a warning gives Clara nothing to hold. The yes then sounds like a risk you are handing her to carry.","2":"Potency missing, and it is Clara's skill. Steiner puts potency in the giver: it is the strength to stand behind the yes. It is not the other person's ability, and it would not have fixed a missing net."},"example":"Swimming pool, Saturday, 8:00am.<br>Coach: \u201cYes, you can go to the deep end. Hold the rail, and I'll stand by the steps.\u201d<br>Girl: \u201cOkay.\u201d"},{"type":"pick","who":"Clara","text":"It is Thursday, 5:00pm. You fly out at nine tonight and are away for two weeks. Clara asks to take the biggest client call alone on Friday.","cue":"What does Steiner's account suggest?","options":["Give the yes now. A yes that is put off is a yes refused.","Hold the big yes until you can be reachable, or give it for something smaller. Steiner says a major permission should be given only when you can also be there for the fear that follows.","Say no flatly. If she wants it, she should have planned better."],"answer":1,"why":"Steiner says the timing of a permission matters. A major yes should not be given just before you go away or when your schedule is full, because the protection that has to follow would not be there.","traps":{"0":"Give the yes now. It feels generous, and putting it off feels like a refusal. But a big yes with nobody to catch her is the bare green light again.","2":"Say no flatly. It protects you from the risk, but it shuts the door on her and teaches her to stop asking. Holding the yes for later is different from refusing it."},"example":"Hill walk, Friday, 3:00pm.<br>Guide: \u201cYou can lead the group tomorrow. But I'm off the radio until Monday, so the route you lead is the short one.\u201d<br>Walker: \u201cThat works.\u201d"}]}],"debrief":{"nadia":"A yes on its own is a door left open with nobody in the room. Give the reason she can believe, and be there when the fear arrives afterwards. The yes only really holds once it has survived someone leaning on it.","bookTerm":"Permission, protection and potency","bookNote":"The books call these permission, protection and potency. Steiner's permission frees a person from an old order, protection means the giver is there for the fear that follows, and potency is the giver's strength to match the old order; protection was first set out by Patricia Crossman."},"reflection":{"prompt":"Think of one yes you gave this week. Which of the three parts did you actually have in place, and which one were you hoping nobody would test?"},"next":"7.4","baseStory":{"setting":"Work","blurb":"Clara wants a yes for Thursday's demo, and you must decide what stands behind it."},"moreStories":[{"setting":"Home & Flatmates","blurb":"Sam wants to switch the flat's gas supplier alone, and Maya wants the ledger kept.","opener":{"setting":"Wednesday, 9:50pm. Hawthorn Court, the shared flat, the kitchen. The gas bill is on the table with a coffee ring on it.","lines":[{"who":"Sam","text":"\u201cI've read the page twice. Can I be the one who switches us to the new supplier? The offer ends Friday.\u201d","cue":"peeling the label off a tin, not looking up"},{"who":"Maya","text":"\u201cHe still owes me for November.\u201d","cue":"back turned, stirring a pan with nothing in it"}],"ask":"Which parts of a yes make it safe to give?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"A yes that holds has three parts, and all three are yours to bring. The green light is the yes itself, with a reason the other person can accept. The safety net is you being there when the fear arrives. The backbone is your strength to keep the yes standing when someone pushes against it.","items":[{"type":"pick","who":"You","text":"Yes, switch us over on your own. You found the cheaper tariff and read the whole page, so you can do this.","cue":"to Sam, tin in your hand, smiling","options":["The green light","The safety net","The backbone"],"answer":0,"why":"That is the yes, and it carries a reason Sam can check against his own evening. He did read the page, so the reason is true, and a true reason is one he can use.","traps":{"1":"The safety net. Nothing in the line says what happens if the supplier argues. It gives a yes and a reason.","2":"The backbone. Nobody is pushing against the yes in this line, so there is nothing to hold yet."},"example":"Bike shop, Saturday, 10:00am.<br>Teenager: \u201cCan I fit the new brakes on my own?\u201d<br>Mechanic: \u201cYes. You trued the wheel perfectly last week, so you're ready.\u201d"},{"type":"pick","who":"You","text":"If they say the reading is wrong, ring me. I'm home by six, and the old account number is stuck to the fridge.","cue":"to Sam, one hand on the back of his chair","options":["The green light","The safety net","The backbone"],"answer":1,"why":"That is the net. It says who is there and how soon, so the worry that comes after the yes has somewhere to go.","traps":{"0":"The green light. The yes is already given. This line is about what happens when it wobbles.","2":"The backbone. Promising to be reachable is the net. The backbone is about keeping the yes standing when somebody pushes against it."},"example":"Ferry crossing, Sunday, 7:00am.<br>Skipper: \u201cIf the swell picks up, we turn back at the second buoy, and I'll radio the harbour.\u201d<br>Passenger: \u201cGood. That's the plan.\u201d"},{"type":"pick","who":"You","text":"Maya thinks the gas money should stay with her. I've told her the yes stands, and I'll say it again at the rota meeting.","cue":"to Sam, in the hall, voice level","options":["The green light","The safety net","The backbone"],"answer":2,"why":"That is the backbone. Someone is pushing against the yes and you keep it standing. A yes that folds when Maya frowns was never one Sam could lean on.","traps":{"0":"The green light. The yes was given earlier. This line is about keeping it standing.","1":"The safety net. A net catches a fall. This line stops the yes from being pulled away in the first place."},"example":"Allotment gate, Sunday, 9:00am.<br>Neighbour: \u201cHe's too new to hold the shed key.\u201d<br>Chair: \u201cI've said he has it, and he does. I'll be at the hut.\u201d<br>The new man unlocks the shed."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Watch what each yes does to the other person, what happens when the net is missing, and what a yes does when someone leans on it.","items":[{"type":"scene","title":"Wednesday, 9:55pm, the kitchen","setting":"Hawthorn Court, the shared flat. Maya has her notebook open at the page headed \u201cSam, gas\u201d, and the new tariff form is on Sam's phone with his thumb over the Confirm button.","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cCan I do the switch on my own? Just tell me yes or no. Sorry, sorry, I know how this looks.\u201d","cue":"thumb hovering over the screen","lines":[{"text":"\u201cYes. Go on, it's yours.\u201d","tag":"game","you":-4,"them":-3,"outcome":"The scene stops there. Sam says thanks, far too fast, and presses Confirm before the last page. Nobody has read the exit fee.","why":"A bare green light is a yes with the net cut away. It feels generous for a second, and then Sam is alone with a contract he skimmed."},{"text":"\u201cYes. You found the cheaper tariff and read the whole page, so you can do this. If it goes wrong, I'm on the phone with the old account number ready.\u201d","tag":"best","you":4,"them":4,"outcome":"Sam breathes out and scrolls back to the top of the page. He says it is the first time this month he has stopped apologising.","why":"You give the yes, a reason from his own evening that he can accept, and the safety net in one go. He knows he will not be left alone with it."},{"text":"\u201cLet's look at it again on Friday morning.\u201d","tag":"ok","you":0,"them":-3,"outcome":"Sam's shoulders drop. \u201cFriday's the deadline,\u201d he says, and puts the phone face down.","why":"A delay is not a green light. It is a shrug, and it leaves him guessing for the rest of the night."}]},{"who":"Sam","text":"\u201cAnd if they say the meter reading is wrong?\u201d","cue":"peeling the label off a tin, not looking up","lines":[{"text":"\u201cThen you'll have to sort it out.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"He looks at the tin and says nothing for a while.","why":"This hands the risk back to him with no way to carry it. It sounds like trust and leaves him with the fear."},{"text":"\u201cPhotograph the meter tonight. If they argue, say you'll ring back Friday, and I'll be sitting next to you.\u201d","tag":"best","you":3,"them":4,"outcome":"Sam types \u201cmeter, tonight, photo\u201d into his phone and underlines it with his thumb.","why":"That is the net again, now in a sentence he can say on the phone. It also says you will sit beside him, which keeps the yes from feeling like a dare."},{"text":"\u201cThey never argue. Don't overthink it.\u201d","tag":"ok","you":0,"them":-1,"outcome":"He nods, but he writes the question on his hand anyway.","why":"Kind, and no help. It is a shrug with a smile, so there is nothing for him to hold if the supplier pushes."}]},{"who":"Sam","text":"\u201cMaya's right though. I always say I'll do it, and then it's a fortnight.\u201d","cue":"glancing at her back at the stove","lines":[{"text":"\u201cYou'll be fine. Don't worry about it.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"He nods and picks up the phone again, though he does not look convinced.","why":"Reassurance with no reason behind it. It sounds warm and gives him nothing to stand on."},{"text":"\u201cI said yes and I'm keeping it. Photograph the meter now, and we'll do the form together until it says done.\u201d","tag":"best","you":4,"them":5,"outcome":"Sam laughs, surprised, and goes to the hall cupboard with his phone torch. Maya turns round from the stove.","why":"This is the backbone. You keep the yes in place when he wobbles and you push a little where the wobble is, so the old habit has to deal with your strength as well as his."},{"text":"\u201cThen don't. Let Maya do the switch.\u201d","tag":"game","you":-6,"them":-5,"outcome":"The scene stops there. Sam sits back, a bit smaller, and says he'll stick to doing the bins.","why":"This takes the yes back at the first wobble and calls it kindness. A green light that folds when the job gets hard has no backbone."}]}],"payoff":"Friday, 6:15pm. Sam confirms the switch without a meter photo. The new supplier bills him for a month nobody ordered, and he has nothing to point at. Maya reads the figures out loud in the kitchen, and Sam says sorry nine times.","fallout":{"them":"Sam takes the tin to his room and shuts the door without saying goodnight."},"example":"Print shop, by the station, 7:30pm.<br>Owner: \u201cCan I leave you with the shop for an hour? Just say yes.\u201d<br>You: \u201cYes, and if anything goes wrong I'm two doors down.\u201d"},{"type":"scene","title":"Friday, 6:30pm, the balcony","setting":"Hawthorn Court, off the kitchen. The boiler has been dead since Monday, and the agent's office shuts at seven. Maya still has her work lanyard on and the agent's number on a sticky note.","meters":{"you":55,"them":45},"beats":[{"who":"Maya","text":"\u201cI'm ringing the agent about the boiler tonight, and I'm doing it my way. Say yes.\u201d","cue":"one hand rubbing the back of her neck","lines":[{"text":"\u201cFine. Ring him.\u201d","tag":"game","you":-4,"them":-3,"outcome":"The scene stops there. Maya dials. Nobody has the repair log or the date of Monday's complaint, and the agent says he has no record of any.","why":"A bare yes with no net. If the call goes badly Maya carries it alone, and you carry the knowledge that you let her ring without the facts."},{"text":"\u201cYes. Ring him. I'll sit beside you with the repair log, and if he stalls I'll take the phone.\u201d","tag":"best","you":4,"them":4,"outcome":"Maya looks surprised, then relieved. \u201cRight,\u201d she says, and flattens the sticky note on her knee.","why":"The yes comes with a net: the log in your hands and a voice ready if he stalls. She is not left to carry the call by herself."},{"text":"\u201cLeave it until Monday.\u201d","tag":"ok","you":0,"them":-3,"outcome":"Maya sighs. \u201cMonday's another cold weekend,\u201d she says, and pockets the note.","why":"A delay with no reason. It takes the yes away and leaves her to decide alone, which is much the same as having no net."}]},{"who":"Maya","text":"\u201cEveryone says I'm too sharp with him. Nobody trusts me to ring.\u201d","cue":"a short laugh with no air in it","lines":[{"text":"\u201cYou're right, you do get sharp. Maybe Sam should ring.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Maya's face closes, and she stops talking about the boiler altogether.","why":"This agrees with the sting and then pushes her out. It looks like honesty, yet it hands her the verdict and takes you out of the job."},{"text":"\u201cI do trust you, Maya. That's why I want the log open when you call.\u201d","tag":"best","you":3,"them":5,"outcome":"Maya stops rubbing her neck. \u201cOkay,\u201d she says. \u201cThat's fair.\u201d","why":"This gives her a reason to be believed, and a check that protects her too. The trust shows in the log, not only in the words."},{"text":"\u201cDon't start. Just ring him.\u201d","tag":"ok","you":-2,"them":-4,"outcome":"Maya shrugs and turns to the railing. \u201cForget it.\u201d","why":"The request is fine, but the tone is sharp. She hears a verdict on herself, and the call now feels like a test."}]},{"who":"Maya","text":"\u201cSeven minutes left. Don't leave me alone when he starts.\u201d","cue":"pointing the sticky note at you","lines":[{"text":"\u201cI won't. You open, I'll hold the log and the Monday email.\u201d","tag":"best","you":2,"them":4,"outcome":"She nods, and the balcony light clicks on as she lifts the phone.","why":"The net only works if you turn up. You name what each of you will hold, so both people leave with a job, not just a promise."},{"text":"\u201cFine, but if he hangs up, that's on you.\u201d","tag":"game","you":-6,"them":-7,"outcome":"The scene stops there. Maya's jaw sets. \u201cRight. Forget the log,\u201d she says, and dials alone.","why":"A green light with the net cut and a sting attached. She will remember the sting and not the log."},{"text":"\u201cSure, whatever you like.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She says thanks, but she does not look at you again before she dials.","why":"It sounds easy, and it lets her go in unprepared. A yes with nothing behind it is half a yes."}]}],"payoff":"Friday, 7:20pm. The agent says there is no record of a Monday complaint, and Maya has nothing in her hand. The flat stays cold all weekend. Sam is the first to offer her a jumper, and she refuses it.","fallout":{"them":"Maya takes her sticky note and goes into her room without a word."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two explanations to check. Name the part that was missing, and when a big yes should wait.","items":[{"type":"pick","who":"Sam","text":"\u201cYes. Go on, it's yours.\u201d That was the whole of it, and then the bill went wrong.","cue":"in the hall, the week after. Which explanation fits?","options":["Permission was too strong. A yes about money should come with a warning, because a warning is the only honest way to hand over a risk.","Protection was missing. The yes came with no net, so Sam met the bill alone. Steiner says the fear arrives after the step.","Potency was the only gap. Sam has no head for money, so no yes from you could have helped him, and you should have doubted it."],"answer":1,"why":"A permission works when protection stands behind it. Steiner says a person who drops an old order often feels alone and scared afterwards, and without a giver ready to catch them they slide back. This yes had the first part only.","traps":{"0":"Permission too strong. It sounds careful, but a warning gives Sam nothing to hold. The yes then sounds like a risk you are handing him to carry.","2":"Potency missing, and blamed on Sam. Steiner puts potency in the giver: it is the strength to stand behind the yes. It is not the other person's ability, and it would not have fixed a missing net."},"example":"Bike shop, Saturday, 10:00am.<br>Mechanic: \u201cYes, fit the brakes. Test the lever before you ride, and ring me if it feels soft.\u201d<br>Teenager: \u201cOkay.\u201d"},{"type":"pick","who":"Maya","text":"It is Thursday, 6:00pm. Your train leaves at eight tonight, and you are at a wedding with your phone off until Tuesday. Maya asks to sign the new tenancy for all three of you on Friday, alone.","cue":"What does Steiner's account suggest?","options":["Give the yes now. A yes that is put off is a yes refused.","Say no flatly. If she wanted it, she should have asked last week.","Hold the big yes until you can be reached, or give it for something smaller. A major permission goes with protection you can actually give."],"answer":2,"why":"Steiner says the timing of a permission matters. A major yes should not be given just before you go away or when your hands are full, because the protection that has to follow would not be there.","traps":{"0":"Give the yes now. It feels generous, and putting it off feels like a refusal. A big yes with nobody to catch her is the bare green light again.","1":"Say no flatly. It protects you from the risk, but it shuts the door on her and teaches her to stop asking. Holding the yes for later is different from refusing it."},"example":"Climbing wall, Friday, 4:00pm.<br>Instructor: \u201cYou can lead the blue route. I'm off for a fortnight, so we do it on Monday when I'm back.\u201d<br>Climber: \u201cOkay, Monday.\u201d"}]}]},{"setting":"Family","blurb":"Leo wants to take the cake tin down to Gran's alone, and Mum has views by phone.","opener":{"setting":"Thursday, 4:15pm. Hawthorn Court, the lift lobby. Leo still has his school bag on, and the lift smells of Gran's onions from the floor below.","lines":[{"who":"Leo","text":"\u201cOn Sunday I want to take the cake tin down to Gran's by myself. In the lift.\u201d","cue":"pressing the call button twice, though it is already lit"},{"who":"Mum","text":"\u201cPut him on. Is anyone going down with him?\u201d","cue":"small on the speaker, 600 km away"}],"ask":"Which parts of a yes make it safe to give?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"A yes that holds has three parts, and all three are yours to bring. The green light is the yes itself, with a reason the other person can accept. The safety net is you being there when the fear arrives. The backbone is your strength to keep the yes standing when someone pushes against it.","items":[{"type":"pick","who":"You","text":"If the lift sticks, press the bell. Grace is in the flat on the second floor, and I'll be at the top of the stairs.","cue":"to Leo, crouching to his height","options":["The green light","The safety net","The backbone"],"answer":1,"why":"That is the net. It names who is there and where, so the fear that comes after the yes has somewhere to go.","traps":{"0":"The green light. The yes is already given. This line is about what happens when the lift misbehaves.","2":"The backbone. Telling him where help is, is the net. The backbone is about keeping the yes standing when somebody pushes against it."},"example":"Beach, Saturday, 11:00am.<br>Lifeguard: \u201cIf the current pulls, wave at the red flag, and I'll be on the tower.\u201d<br>Swimmer: \u201cGot it.\u201d"},{"type":"pick","who":"You","text":"Mum says he's too small for the lift. I've told her the yes stands, and I'll say it again on the phone tonight.","cue":"to Leo, in the lobby, voice level","options":["The green light","The safety net","The backbone"],"answer":2,"why":"That is the backbone. Someone is pushing against the yes and you keep it standing. A yes that folds when Mum objects down the phone was never one Leo could lean on.","traps":{"0":"The green light. The yes was given earlier. This line is about keeping it standing.","1":"The safety net. A net catches a fall. This line stops the yes from being pulled away in the first place."},"example":"Football touchline, Saturday, 10:00am.<br>Dad: \u201cHe's too young for the penalty.\u201d<br>Coach: \u201cI've said he takes it, and he will. I'll be right behind the goal.\u201d<br>The boy walks to the spot."},{"type":"pick","who":"You","text":"Yes, take it down on your own. You carried the shopping up on Tuesday without cracking an egg, so you can do this.","cue":"to Leo, with the cake tin on the bench between you","options":["The green light","The safety net","The backbone"],"answer":0,"why":"That is the yes, and it comes with a reason Leo can check against his own Tuesday. The eggs really did arrive whole, so he can believe it.","traps":{"1":"The safety net. Nothing in the line says what happens if the lift sticks. It gives a yes and a reason.","2":"The backbone. Nobody is pushing against the yes in this line, so there is nothing to hold yet."},"example":"Kitchen, Sunday, 5:00pm.<br>Child: \u201cCan I crack the eggs by myself?\u201d<br>Aunt: \u201cYes. You did the pancakes last week and not one shell got in.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Watch what each yes does to the other person, what happens when the net is missing, and what a yes does when someone leans on it.","items":[{"type":"scene","title":"Thursday, 4:20pm, the lift lobby","setting":"Hawthorn Court. Leo has the cake tin hugged to his chest, and Gran's flat is one floor down. Mum's voice is on speaker from 600 km away.","meters":{"you":60,"them":50},"beats":[{"who":"Leo","text":"\u201cCan I take the cake tin down to Gran's on my own? Just say yes or no.\u201d","cue":"hugging the tin, watching the floor numbers","lines":[{"text":"\u201cYes. Off you go, it's yours.\u201d","tag":"game","you":-4,"them":-3,"outcome":"The scene stops there. Leo thanks you in a small voice and steps in. Nobody has told him what to do if the doors stick.","why":"A bare green light is a yes with the net cut away. It feels like a treat for a second, and then he is alone in a box with a button."},{"text":"\u201cYes. You carried the shopping up on Tuesday without cracking an egg, so you can do this. If the lift sticks, press the bell, and I'll be at the stairs.\u201d","tag":"best","you":4,"them":4,"outcome":"Leo lets out a breath you did not know he was holding. He presses the call button once, very carefully.","why":"You give the yes, a reason from his own Tuesday that he can accept, and the safety net in one go. He knows he will not be left alone if it goes wrong."},{"text":"\u201cAsk me again on Sunday.\u201d","tag":"ok","you":0,"them":-3,"outcome":"Leo's face falls. \u201cSunday's too late for the cake,\u201d he says, and sits on the bottom step.","why":"A delay is not a green light. It is a shrug, and it leaves an eight-year-old guessing for three days."}]},{"who":"Leo","text":"\u201cWhat if Gran's not in?\u201d","cue":"tin pressed to his chest","lines":[{"text":"\u201cThen you'll have to work it out.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"He studies the floor numbers and does not say anything for a while.","why":"This hands the risk back to him with no way to carry it. It sounds like trust and leaves him with the fear."},{"text":"\u201cKnock on Grace's door on the second floor. Say the tin is for Gran, and I'll ring Gran's phone myself.\u201d","tag":"best","you":3,"them":4,"outcome":"Leo says \u201cGrace, second floor, tin for Gran\u201d under his breath, twice.","why":"That is the net again, now in a sentence he can say. It also says you will make a call of your own, which keeps the yes from feeling like a dare."},{"text":"\u201cShe'll be in. She's always in.\u201d","tag":"ok","you":0,"them":-1,"outcome":"He nods, but he looks at the tin as if it might not fit through her door.","why":"This is kind, and it is no help. It is a shrug with a smile, so he has nothing to hold if the door stays shut."}]},{"who":"Leo","text":"\u201cThe button sticks sometimes. I don't think I can push it hard enough.\u201d","cue":"looking at his thumb","lines":[{"text":"\u201cYou'll be fine. Don't worry about it.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"He nods and shifts the tin to his other arm, not convinced.","why":"Reassurance with no reason behind it. It sounds warm and gives him nothing to stand on."},{"text":"\u201cI said yes and I'm keeping it. Press it now while I watch from the door, and we'll sort it before you go.\u201d","tag":"best","you":4,"them":5,"outcome":"Leo laughs, surprised, and jabs the button three times. It lights on the third go, and he grins at you.","why":"This is the backbone. You keep the yes in place when he wobbles and you push a little where the wobble is, so the doubt has to deal with your strength as well as his."},{"text":"\u201cThen don't. I'll carry it down for you.\u201d","tag":"game","you":-6,"them":-5,"outcome":"The scene stops there. Leo hands over the tin, a bit smaller, and says he did not really mind.","why":"This takes the yes back at the first wobble and calls it kindness. A green light that folds when the job gets hard has no backbone."}]}],"payoff":"Sunday, 12:10pm. Leo goes down with no plan. The button sticks, the doors close on him, and he rides to the basement. Gran finds him by the bins with the tin still shut, and Mum hears about it before the soup is on.","fallout":{"them":"Leo sits on the bottom stair with the tin on his knees and will not look up."},"example":"Corner shop, Saturday, 4:00pm.<br>Boy: \u201cCan I pay for the bread myself?\u201d<br>Mum: \u201cYes, and I'll be at the door if the till gets stuck.\u201d"},{"type":"scene","title":"Sunday, 11:40am, Gran's kitchen","setting":"The roast has been in since ten, and the tin is heavy on the hob. Gran is leaning on the counter with one hand pressed to her hip. Mum has already rung twice.","meters":{"you":55,"them":45},"beats":[{"who":"Gran","text":"\u201cI want to carry the roast to the table myself today. Just say yes.\u201d","cue":"not sitting down, not quite standing straight","lines":[{"text":"\u201cFine. Carry it.\u201d","tag":"game","you":-4,"them":-3,"outcome":"The scene stops there. Gran lifts the tin with both hands. Nobody has laid the cloth or cleared the path to the table.","why":"A bare yes with no net. If the tin goes down, Gran carries the fall alone, and you carry the knowledge that you checked nothing."},{"text":"\u201cYes. Carry it once the cloth is down and the path is clear, and I'll walk beside you to her chair.\u201d","tag":"best","you":4,"them":4,"outcome":"Gran looks surprised, then pleased. \u201cCloth first,\u201d she says, and waves you to the drawer.","why":"The yes comes with a net: a clear path first, and you beside her for the walk. She is not left to carry the risk by herself."},{"text":"\u201cLet's leave it until next Sunday.\u201d","tag":"ok","you":0,"them":-3,"outcome":"Gran sighs. \u201cNext Sunday I'll be a week older,\u201d she says, and turns back to the hob.","why":"A delay with no reason. It takes the yes away and leaves her to decide alone, which is much the same as having no net."}]},{"who":"Gran","text":"\u201cIt's always the same. Your mother rings, and nobody lets me lift a spoon.\u201d","cue":"a short laugh with no air in it","lines":[{"text":"\u201cYou're right, nobody does. Why don't you go and sit down?\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Gran's face closes, and she stops talking about the roast altogether.","why":"This agrees with the sting and then sends her to a chair. It sounds like sympathy, yet it hands her the verdict and takes you out of the job."},{"text":"\u201cI do trust you, Gran. That's why I want the path clear first.\u201d","tag":"best","you":3,"them":5,"outcome":"Gran stops pressing at her hip for a second. \u201cWell,\u201d she says. \u201cThat's fair.\u201d","why":"This gives her a reason to be believed, and a check that protects her too. The trust shows in the cleared path, not only in the words."},{"text":"\u201cDon't start, Gran. Just wait for the cloth.\u201d","tag":"ok","you":-2,"them":-4,"outcome":"Gran shrugs and turns the gas down. \u201cForget it.\u201d","why":"The request is sensible, but the tone is sharp. She hears a verdict on herself, and the cloth now feels like a punishment."}]},{"who":"Gran","text":"\u201cBeside me, then. Don't take it off me halfway.\u201d","cue":"pointing the wooden spoon at you","lines":[{"text":"\u201cI won't. You carry, and I'll hold the door and the cloth.\u201d","tag":"best","you":2,"them":4,"outcome":"She nods, and the kitchen door clicks open as she lifts the tin.","why":"The net only works if you turn up and hold your end. You name what each of you will carry, so both people leave with a job, not just a promise."},{"text":"\u201cFine, but if you drop it, that's on you.\u201d","tag":"game","you":-6,"them":-7,"outcome":"The scene stops there. Gran's mouth thins. \u201cRight. Then do it yourself,\u201d she says, and sits.","why":"A green light with the net cut and a sting attached. She will remember the sting and not the cleared path."},{"text":"\u201cSure, whatever you want.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She says thank you, but she does not look at you again before she lifts it.","why":"It sounds easy, and it lets her go with no plan. A yes with nothing behind it is half a yes."}]}],"payoff":"Sunday, 12:30pm. Gran carries the tin before the cloth is laid. Halfway across, her hip catches and the gravy goes over the floor. Mum's name is on the phone before anyone has found the mop, and nobody mentions the yes at lunch.","fallout":{"them":"Gran puts the spoon down and goes to her room without finishing the potatoes."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two explanations to check. Name the part that was missing, and when a big yes should wait.","items":[{"type":"pick","who":"Gran","text":"\u201cYes. Carry it.\u201d That was all, and then the gravy went over the floor.","cue":"in the lobby, an hour later. Which explanation fits?","options":["Potency was the only gap. Gran's hip is too weak for the tin, so no yes from you could have helped her at all.","Permission was too strong. A yes about a hot tin should come with a warning and a rule, because a warning is what protects people.","Protection was missing. The yes had no net, so Gran met the fall alone. Steiner says the fear arrives after the step."],"answer":2,"why":"A permission works when protection stands behind it. Steiner says a person who drops an old order often feels alone and scared afterwards, and without a giver ready to catch them they slide back. This yes had the first part only.","traps":{"0":"Potency missing, and blamed on Gran. Steiner puts potency in the giver: it is the strength to stand behind the yes. It is not the other person's ability, and it would not have fixed a missing net.","1":"Permission too strong. It sounds careful, but a warning gives Gran nothing to hold. The yes then sounds like a risk you are handing her to carry."},"example":"Kitchen, Sunday, 5:00pm.<br>Aunt: \u201cYes, cut the cake. Hold the knife flat, and I'll steady the board.\u201d<br>Child: \u201cOkay.\u201d"},{"type":"pick","who":"Leo","text":"It is Saturday, 5:00pm. You leave for the coast at eight tonight, and your phone is off until Monday. Leo asks to walk home from the school gate on his own on Monday.","cue":"What does Steiner's account suggest?","options":["Hold the big yes until you can be reached, or give it for something smaller. A major permission goes with protection you can give.","Give the yes now. A yes that is put off is a yes refused, and he will stop asking.","Say no flatly. If he wanted it, he should have asked on a day you were in."],"answer":0,"why":"Steiner says the timing of a permission matters. A major yes should not be given just before you go away or when your hands are full, because the protection that has to follow would not be there.","traps":{"1":"Give the yes now. It feels generous, and putting it off feels like a refusal. A big yes with nobody to catch him is the bare green light again.","2":"Say no flatly. It protects you from the risk, but it shuts the door on him and teaches him to stop asking. Holding the yes for later is different from refusing it."},"example":"Swimming lake, Friday, 3:00pm.<br>Coach: \u201cYou can swim to the far buoy, but I'm away until Monday, so we start with the near one.\u201d<br>Swimmer: \u201cThat works.\u201d"}]}]},{"setting":"Friends & Community","blurb":"Hannah asks to open Nadia's Sunday circle, and Peter is not convinced.","opener":{"setting":"Sunday, 6:40pm. The Corner Table, the back table after closing. Nadia has left her keys and a note, and next week's circle is on the table.","lines":[{"who":"Hannah","text":"\u201cI could open the circle next Sunday. Properly, with the paper squares. If you'd let me.\u201d","cue":"folding a napkin smaller and smaller"},{"who":"Peter","text":"\u201cShe's never spoken for more than a minute. I'm only saying.\u201d","cue":"arms folded, checking the clock"}],"ask":"Which parts of a yes make it safe to give?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"A yes that holds has three parts, and all three are yours to bring. The green light is the yes itself, with a reason the other person can accept. The safety net is you being there when the fear arrives. The backbone is your strength to keep the yes standing when someone pushes against it.","items":[{"type":"pick","who":"You","text":"Peter says Hannah is too quiet to open the circle. I've told him the yes stands, and I'll say it again to the whole group.","cue":"to Hannah, by the sugar bowl, voice level","options":["The green light","The safety net","The backbone"],"answer":2,"why":"That is the backbone. Someone is pushing against the yes and you keep it standing. A yes that folds when Peter folds his arms was never one Hannah could lean on.","traps":{"0":"The green light. The yes was given earlier. This line is about keeping it standing.","1":"The safety net. A net catches a fall. This line stops the yes from being pulled away in the first place."},"example":"Choir hall, Tuesday, 7:45pm.<br>Singer: \u201cShe's too new for the solo.\u201d<br>Choirmaster: \u201cI've said she sings it, and she will. I'll be at the piano.\u201d<br>The new girl steps forward."},{"type":"pick","who":"You","text":"Yes, open the circle on your own. You held the room together the night the tea urn broke, so you can do this.","cue":"to Hannah, at the back table, smiling","options":["The green light","The safety net","The backbone"],"answer":0,"why":"That is the yes, and it comes with a reason Hannah can check against her own memory. The urn night really happened, so she can believe it.","traps":{"1":"The safety net. Nothing in the line says what happens if she freezes. It gives a yes and a reason.","2":"The backbone. Nobody is pushing against the yes in this line, so there is nothing to hold yet."},"example":"Bakery, Thursday, 6:00am.<br>Baker: \u201cYes, you can shape the rolls on your own. Your dough last week was the best on the tray.\u201d"},{"type":"pick","who":"You","text":"If you freeze, look at me. I'll be at the back table, and the paper squares are numbered in the order you'll need them.","cue":"to Hannah, tapping the stack of squares","options":["The green light","The safety net","The backbone"],"answer":1,"why":"That is the net. It says where you will be and gives her a signal, so the fear that arrives after the yes has somewhere to go.","traps":{"0":"The green light. The yes is already given. This line is about what happens when she wobbles.","2":"The backbone. Offering a signal is the net. The backbone is about keeping the yes standing when somebody pushes against it."},"example":"Sailing club, Saturday, 9:00am.<br>Instructor: \u201cIf you capsize, hold the hull and wave, and I'll be in the rescue boat.\u201d<br>Sailor: \u201cUnderstood.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Watch what each yes does to the other person, what happens when the net is missing, and what a yes does when someone leans on it.","items":[{"type":"scene","title":"Sunday, 6:45pm, the back table","setting":"The Corner Table, after closing. Nadia is away next Sunday. Hannah has laid the paper squares in four rows and keeps squaring the corners. Peter is by the door with his coat half on.","meters":{"you":60,"them":50},"beats":[{"who":"Hannah","text":"\u201cCan I open the circle next Sunday on my own? Just tell me yes or no.\u201d","cue":"squaring the paper corners again","lines":[{"text":"\u201cYes. Go on, it's yours.\u201d","tag":"game","you":-4,"them":-3,"outcome":"The scene stops there. Hannah thanks you in a flat voice and gathers the squares. She has nothing to look at if the room goes still.","why":"A bare green light is a yes with the net cut away. It feels generous for a second, and then she is alone with a room full of faces."},{"text":"\u201cYes. You held the room together the night the tea urn broke, so you can do this. If you freeze, look at me, and I'll be at the back table with the squares numbered.\u201d","tag":"best","you":4,"them":4,"outcome":"Hannah lets out a breath and starts to number the squares in pencil. She says it is the first time anyone has asked what she wanted.","why":"You give the yes, a reason from her own memory that she can accept, and the safety net in one go. She knows she will not be left alone if it wobbles."},{"text":"\u201cLet's talk about it on Saturday.\u201d","tag":"ok","you":0,"them":-3,"outcome":"Hannah's shoulders drop. \u201cSaturday's too late to prepare,\u201d she says, and puts the squares back in their bag.","why":"A delay is not a green light. It is a shrug, and it leaves her guessing for the whole week."}]},{"who":"Hannah","text":"\u201cAnd if nobody answers the first question?\u201d","cue":"pulling at a corner of the napkin","lines":[{"text":"\u201cThen you'll have to wing it.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"She looks at the napkin and says nothing for a while.","why":"This hands the risk back to her with no way to carry it. It sounds like trust and leaves her with the fear."},{"text":"\u201cCount to ten, then ask it again in plainer words. I'll nod when the ten is up, and I'll step in if you look at me.\u201d","tag":"best","you":3,"them":4,"outcome":"Hannah writes \u201cten, then again\u201d on the back of a square and underlines it twice.","why":"That is the net again, now in a sentence she can use in the room. It also says you will be watching for her, which keeps the yes from feeling like a dare."},{"text":"\u201cThey'll answer. People always do.\u201d","tag":"ok","you":0,"them":-1,"outcome":"She nods, but she writes the question on her hand anyway.","why":"This is kind, and it is no help. It is a shrug with a smile, so she has nothing to hold if the silence comes."}]},{"who":"Hannah","text":"\u201cPeter will watch me the whole time. I'll go red, and I'll forget the first square.\u201d","cue":"looking at Peter's empty chair","lines":[{"text":"\u201cYou'll be fine. Don't worry about it.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"She nods and goes back to squaring the paper, not convinced.","why":"Reassurance with no reason behind it. It sounds warm and gives her nothing to stand on."},{"text":"\u201cI said yes and I'm keeping it. Read the first square out loud now, to Peter's chair, and we'll fix whatever wobbles tonight.\u201d","tag":"best","you":4,"them":5,"outcome":"Hannah laughs, surprised, and reads the square to the chair. The second time, she looks up while she does it.","why":"This is the backbone. You keep the yes in place when she wobbles and you push a little where the wobble is, so the old fear has to deal with your strength as well as hers."},{"text":"\u201cThen don't. Let Peter open it.\u201d","tag":"game","you":-6,"them":-5,"outcome":"The scene stops there. Hannah sits back, a bit smaller, and says she will just make the tea.","why":"This takes the yes back at the first wobble and calls it kindness. A green light that folds when the job gets hard has no backbone."}]}],"payoff":"Next Sunday, 3:05pm. Hannah opens the circle with nobody to look at. Peter's arms are folded, the first square has gone missing, and she stops mid-sentence. Ruby finishes the round, and Hannah says nothing more before the end.","fallout":{"them":"Hannah folds the napkin into a tiny square and leaves before the tea is poured."},"example":"Choir hall, Tuesday, 7:30pm.<br>Singer: \u201cCan I lead the first verse? Just say yes.\u201d<br>Choirmaster: \u201cYes, and if you lose the note, look at me and I'll hum it.\u201d"},{"type":"scene","title":"Saturday, 4:40pm, the five-a-side pitch","setting":"Behind the station. The final kicks off at five. Joseph has his shin pads out and one hand on his knee, and Ruby is jogging on the spot by the goal.","meters":{"you":55,"them":45},"beats":[{"who":"Joseph","text":"\u201cI'm playing the full match today. No sub. Just say yes.\u201d","cue":"taking the shin pads from his bag, one hand on his knee","lines":[{"text":"\u201cFine. Play.\u201d","tag":"game","you":-4,"them":-3,"outcome":"The scene stops there. Joseph nods and goes to stretch. Nobody has asked Ruby to be ready, and nobody has fetched the ice pack.","why":"A bare yes with no net. If the knee goes, Joseph carries it alone, and you carry the knowledge that you let him start without a plan."},{"text":"\u201cYes. Play the first half, and Ruby is warming up to swap on at half-time. I'll stand by the goal with the ice pack.\u201d","tag":"best","you":4,"them":4,"outcome":"Joseph looks surprised, then relieved. \u201cHalf-time, then,\u201d he says, and starts pulling on the pads.","why":"The yes comes with a net: a swap agreed in advance and you at the goal with the ice. He is not left to carry the risk by himself."},{"text":"\u201cLet's see how it feels at kick-off.\u201d","tag":"ok","you":0,"them":-3,"outcome":"Joseph sighs. \u201cKick-off is in twenty minutes. Fine,\u201d he says, and sits on the bench.","why":"A delay with no reason. It takes the yes away and leaves him to decide alone, which is much the same as having no net."}]},{"who":"Joseph","text":"\u201cIt's always the same. Nobody picks me any more.\u201d","cue":"a short laugh with no air in it","lines":[{"text":"\u201cYou're right, nobody does. Why don't you sit this one out?\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Joseph's face closes, and he stops talking about the match altogether.","why":"This agrees with the sting and then benches him. It sounds like sympathy, yet it hands him the verdict and takes you out of the job."},{"text":"\u201cI do pick you, Joseph. That's why I want Ruby ready to swap at half-time.\u201d","tag":"best","you":3,"them":5,"outcome":"Joseph stops rubbing his knee for a second. \u201cOkay,\u201d he says. \u201cFair enough.\u201d","why":"This gives him a reason to be believed, and a plan that protects him too. The trust shows in the swap, not only in the words."},{"text":"\u201cDon't start. Just do the stretches.\u201d","tag":"ok","you":-2,"them":-4,"outcome":"Joseph shrugs and zips his bag. \u201cForget it.\u201d","why":"The request is sensible, but the tone is sharp. He hears a verdict on himself, and the stretches now feel like a punishment."}]},{"who":"Ruby","text":"\u201cHe shouldn't play at all. You shouldn't have said yes.\u201d","cue":"stopping mid-jog, pointing at the pitch","lines":[{"text":"\u201cI said yes and I'm keeping it. Joseph takes the first half, you swap on at the break, and I'm at the goal.\u201d","tag":"best","you":2,"them":4,"outcome":"Ruby looks at Joseph's knee, then at you. \u201cHalf-time, no later,\u201d she says, and goes back to jogging.","why":"The net only works if the yes stays standing. You answer her push with the same plan, so everyone leaves with a job and not just a
