<script>window.TA_GAME = {"slot":"6.1","setting":"Friends & Community","title":"Four Corners of OK","world":6,"worldName":"The Story You Wrote","week":6,"weekName":"The Story You Wrote","mechanic":"Quadrant","concept":"After this one you can hear the verdict inside a line, say which of the four corners it belongs to, and follow one person through the corners across a day.","plainWord":"your verdict","bookTerm":"Life positions","bookIdea":"A life position is the verdict a person settles early about themselves and about other people, and it is the corner they tend to return to under pressure.","bookSource":"TA Today, ch. 12; Scripts People Live, ch. 5 and 6","opener":{"setting":"Sunday, 9:40am. The Corner Table, the back table. Nadia has laid four paper squares in a row, each one labelled with a corner.","lines":[{"who":"Nadia","text":"\u201cEverybody carries a verdict. About themselves, and about the people in front of them. There are four corners, and that's the whole map.\u201d","cue":"tapping the squares one at a time"},{"who":"Clara","text":"\u201cSo I get to be in all four? Brilliant. I'm very good at everything, apparently.\u201d","cue":"laughing before anyone else can"}],"ask":"Which corner does each inner line belong in, and where does one person end up by the end of the day?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line is what someone says to themselves. Find the corner that matches the verdict it carries. Three boards, four lines each.","items":[{"type":"sort","prompt":"Gran, 6:30am, the kitchen, the cooker whistling. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cMy knees are bad, and the children have their own lives. I'll manage, like I always do.\u201d","answer":1,"why":"She puts herself last and counts the others as fine. 'I'll manage' is the not OK part, and 'they have their own lives' is the OK part. That is the corner where you are the one who doesn't count."},{"text":"\u201cAfter everything I did for them, not one of them rings on a Sunday.\u201d","answer":2,"why":"The sting is 'after everything I did'. In her own book she is fine, and the children are the ones letting her down. That is I'm OK, you're not OK."},{"text":"\u201cMy knees are bad today, so I'll ask Maya for the rice. She'll help, and asking is fine.\u201d","answer":0,"why":"She can ask for help without apology, and Maya is allowed to say yes. Both halves are fine: that is I'm OK, you're OK."},{"text":"\u201cNo point asking them. Nobody listens, and at my age I'm just the furniture.\u201d","answer":3,"why":"She is furniture, and the household is not listening. Both halves are down, which is I'm not OK, you're not OK, where asking feels pointless."}]},{"type":"sort","prompt":"Halden, the standup. Daniel and Clara, two lines each.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cThe numbers are fine, and so is the team. We'll get there by Friday.\u201d","answer":0,"why":"Both halves are fine here. The numbers can be fixed, and the team is not the problem. This is the healthy corner, and Daniel sounds like this only on the days he forgets to keep score."},{"text":"\u201cI always get the small things wrong. Everyone else seems to know what they're doing.\u201d","answer":1,"why":"Clara puts herself down and puts everyone else up. She laughs first, so nobody else gets to make the joke. The verdict underneath is I'm not OK, you're OK."},{"text":"\u201cThe numbers are wrong again, and this team can't read a spec. I'll check every line myself.\u201d","answer":2,"why":"He is sure of his own reading and sure the team is short of it. That is I'm OK, you're not OK, the corner he keeps returning to when the numbers slip."},{"text":"\u201cWhatever I touch breaks, so what's the point? None of us will get this release over the line.\u201d","answer":3,"why":"Clara has put herself down and written off the release too. Both halves are down, which is I'm not OK, you're not OK."}]},{"type":"sort","prompt":"Omar, Halden, the day after a failed release. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cI've seen this before. Nothing I say changes it, so I'm not wasting my breath.\u201d","answer":3,"why":"Omar has written off his own pull on things, and he has written off the room as a place where nothing moves. Both halves are down. That is I'm not OK, you're not OK, the corner with no way out."},{"text":"\u201cFine, I'll take the on-call again. Nobody else here can even read the database.\u201d","answer":2,"why":"The verdict sits on 'nobody else'. He is the one who can do it and they can't, so he is OK and they are not. That is I'm OK, you're not OK."},{"text":"\u201cThat release broke at the cache step. We'll look at it together tomorrow, and I'll take the first pass.\u201d","answer":0,"why":"He names the fault without blaming anyone, and he brings the team in as partners. That is I'm OK, you're OK."},{"text":"\u201cI missed the cache warning, and you all flagged it. My fault, I should have listened.\u201d","answer":1,"why":"He puts the miss on himself and gives the team credit for spotting it. That is I'm not OK, you're OK, the corner where the other person got it right."}]}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Sam, one Thursday.<\/b><br>7:40am, the kitchen. Tea over the milk tin. \u201cSorry, sorry, I'm hopeless. You're too good to put up with me.\u201d<br>1:15pm, the fintech office. His team lead finds three errors in his deck. \u201cMe. Sorry. My fault entirely.\u201d<br>9:50pm, apartment 3B. Maya says he owes her for the milk again. He goes quiet and doesn't argue.","items":[{"type":"pick","who":"Sam, the fintech office, 1:15pm","text":"\u201cThat's on me. I should have checked the deck twice. I'll redo all of it.\u201d","cue":"the printout in his hand, three errors circled in red","options":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"answer":1,"why":"'That's on me' and 'I should have checked' put the fault on him, and 'I'll redo all of it' makes him carry the fix. He still treats his team lead as the one who caught it right, so the team lead stays OK. That is I'm not OK, you're OK, his usual corner, the one he keeps returning to.","traps":{"0":"It would sound like \u201cThree errors, fair catch. I'll fix them before ten, and we can check the rest together.\u201d That owns the miss without a verdict on himself, and his team lead would get a plan.","2":"It would sound like \u201cThree errors? The template was yours too. Mark them before I see them next time.\u201d He would point across the table, and lunch would turn into a row about a template.","3":"It would sound like \u201cThree errors. Nothing I touch in this place lands right, so there's no point redoing it.\u201d That is the slide, and his team lead would be left with a deck and a man who has given up on it."},"example":"A cricket club group chat, Sunday night. The scorer posts the wrong total for the second innings, and types, \u201cMy fault, I should have added it twice. Sorry, I'll redo the sheet.\u201d<br>The captain replies with a thumbs up, and the corrected card goes up before dinner.<br>Nobody is told they are bad at cricket."},{"type":"pick","who":"Sam","text":"\u201cFine. I'm the mess. And she's keeping score, so nothing I say matters. Night.\u201d","cue":"10:50pm, his door shut, the light still on under it","options":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"answer":3,"why":"'I'm the mess' puts him down, and 'she's keeping score' puts Maya down too, so both halves are down by bedtime. The breakfast apology still said you're OK. After a bad day, 'nothing I say matters' drops everything, which is the corner with no way out.","traps":{"0":"It would sound like \u201cMaya's right, I'll sort it on Friday.\u201d That is a grown-up line, but it isn't where he is at ten to eleven. She would hear a promise he doesn't believe yet.","1":"It would sound like the breakfast apology: \u201cSorry, I'm hopeless, you're too good for me.\u201d That is his usual corner, the one people mistake for his whole self. Maya would get another apology and nothing she could use.","2":"It would sound like \u201cYou always count the milk, Maya. Not everyone is a bank.\u201d He would point at her, and the night would become a fight about milk."},"example":"A school gate, Monday, 8:20am. A father fills in the trip form wrong and says, \u201cSorry, I'm hopeless with these.\u201d<br>The teacher says it's fine and he can fix it on Friday.<br>By Wednesday, after a second letter, he says, \u201cNobody in this school reads anything. What's the point?\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cSam went through two corners in one day. Which reading helps him most?\u201d","cue":"tapping the squares, then pointing at his empty chair","options":["The breakfast apology was the real Sam, and the night is a mood that means nothing.","His life position is the verdict he tends to return to under pressure. The slide shows where the pressure takes him, and that is what to watch.","His corners are his personality, so one day tells you nothing new about him."],"answer":1,"why":"The books call this life positions. A basic position is the verdict a person settles early and tends to come back to under pressure. Sam's breakfast and lunch sit in I'm not OK, you're OK, his usual corner. The night shows the slide when the apology stops working, and the slide is the thing to watch.","traps":{"0":"Sam would agree and stop looking. Maya would hear 'it's just a mood' and carry the milk problem into next week alone.","2":"Nadia would be right that a person is more than a corner, but the line closes the day down. Nobody learns the slide, and Sam gets filed as a type."},"example":"A family WhatsApp group, Tuesday: \u201cSorry, I'm hopeless at forwards, ignore me.\u201d<br>Thursday, after nobody answers his question about the party times: \u201cFine. Nobody needs me in this group anyway.\u201d<br>The first line is his usual corner. The second is the slide."}]}],"debrief":{"nadia":"Sam's breakfast was the usual him, and his night was the slide. Many people have a corner they go back to when they are tired. Watch the slide, because it shows you where the pressure lands, and that tells you more than a label does.","bookTerm":"Life positions","bookNote":"The books call this life positions, the four corners of the OK Corral: the basic verdict a person settles early and tends to return to under pressure."},"reflection":{"prompt":"Which corner did you sit in most this week, and who was in the room when you got there?"},"next":"6.2","baseStory":{"setting":"Friends & Community","blurb":"Nadia lays out four paper squares at the Corner Table while Sam apologises his way through one Thursday."},"moreStories":[{"setting":"Home & Flatmates","blurb":"Maya wants the rota full before the agent comes on Monday, and Sam keeps saying sorry.","opener":{"setting":"Saturday, 7:05am. Hawthorn Court, apartment 3B, the kitchen. The letting agent comes Monday at ten, and the rota on the fridge has a row of empty boxes.","lines":[{"who":"Maya","text":"\u201cFull by Monday, Sam. Every box. I'm not asking twice.\u201d","cue":"pressing a magnet flat over the empty boxes, tunic already on"},{"who":"Sam","text":"\u201cTotally. Oven, bins, all of it. Sorry, sorry. You're a saint for putting up with me.\u201d","cue":"holding the milk like a shield"}],"ask":"Which corner does each inner line belong in, and where does Maya end up by the end of Saturday?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line is what someone says to themselves. Find the corner that matches the verdict it carries. Three boards, four lines each.","items":[{"type":"sort","prompt":"Sam, 7:30am, the kitchen, bin bags by the door. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cThree weeks of blank boxes and she's counting? It's a bit of paper. She wants a flatmate she can audit.\u201d","answer":2,"why":"The verdict lands on Maya. She is the one being petty, and Sam is simply fine. He rarely sits here, which is why it stands out. That is I'm OK, you're not OK."},{"text":"\u201cThe oven is a forty-minute job and the bins take five. She's right to ask, and I can do it if I stop apologising and start.\u201d","answer":0,"why":"He owns the gap without a verdict on himself, and he leaves Maya's request standing as fair. Both halves are fine, which is I'm OK, you're OK."},{"text":"\u201cShe's so organised and I can't keep one bin day in my head. She'd be better off with someone normal.\u201d","answer":1,"why":"He puts himself down and lifts her up. This is Sam's usual corner, the one that sounds like modesty. It is I'm not OK, you're OK."},{"text":"\u201cI'll never be on top of this flat and she'll never let it go. We are stuck with each other.\u201d","answer":3,"why":"Both halves are down: he can't, and she won't. Nothing in the sentence leaves a move. That is I'm not OK, you're not OK."}]},{"type":"sort","prompt":"Maya, 8:10am, the bus to work, her tunic under her coat. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cI'm the one who can't let a thing go. Nobody wants to live with a woman and her notebook.\u201d","answer":1,"why":"She puts herself down and gives the others the easy side. The notebook is her flaw, and everyone else is fine. That is I'm not OK, you're OK."},{"text":"\u201cI'm tired of being the flat's mother, and he will never change. So why do I keep the sheet at all?\u201d","answer":3,"why":"She is worn out, which puts her down, and Sam is a lost cause, which puts him down. Even the sheet loses its point. That is I'm not OK, you're not OK."},{"text":"\u201cTonight I'll ask him to pick a day for the oven and write his own name in the box. I can ask, and he can say yes.\u201d","answer":0,"why":"She asks for a specific thing and leaves Sam room to answer. Both halves are fine. That is I'm OK, you're OK."},{"text":"\u201cHe's had three weeks. A grown man can read a rota, and if I don't chase it, nobody will.\u201d","answer":2,"why":"The sure part is 'if I don't, nobody will'. She is the reliable one and he is the one who has to be chased. That is I'm OK, you're not OK, the ledger corner."}]},{"type":"sort","prompt":"Sam, 4:20pm, the balcony, oven shelves in the bath, a knotted bin bag by his foot. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cI did the oven, so why isn't that enough? She'll find something else to add. She always does.\u201d","answer":2,"why":"The sting is 'she always does'. He is the one trying and she is the one who keeps moving the line. That is I'm OK, you're not OK."},{"text":"\u201cThe shelves are done and it took forty minutes. She may still be cross about the three weeks, and she's allowed to be.\u201d","answer":0,"why":"He counts his own work as real and lets her anger stand. Neither of them is a problem here. That is I'm OK, you're OK."},{"text":"\u201cWhat's the point? Whatever I do, it won't count, and Maya has decided that already.\u201d","answer":3,"why":"His effort is worthless and her mind is closed. Both halves are down, and that is where doing the next job feels pointless. It is I'm not OK, you're not OK."},{"text":"\u201cLook at my hands. Typical. I can do the oven, but I'll forget something else and she'll be right about me.\u201d","answer":1,"why":"Even a finished job turns into proof against himself, and Maya stays the one who is right. This is the slide back to his usual corner, I'm not OK, you're OK."}]}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Maya, one Saturday.<\/b><br>7:05am, the kitchen. She presses a magnet over the empty boxes. \u201cFull by Monday, Sam.\u201d<br>7:45pm, apartment 3B. She is back from a twelve-hour shift and the oven is clean.<br>11:20pm, the balcony. Sam hands her the sheet with every box initialled, and says sorry again.","items":[{"type":"pick","who":"Maya, apartment 3B, 7:45pm","text":"\u201cOven's done. Fine. The bins are still blank, though, so I'll take them down myself. I always do.\u201d","cue":"coat still on, the sheet in one hand, the fridge door open","options":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"answer":2,"why":"'I always do' and 'I'll take them down myself' make her the reliable one, and the blank boxes make Sam the one who needs covering for. The oven earns no credit, because the verdict was set before she came in. That is I'm OK, you're not OK, the ledger corner.","traps":{"0":"It would sound like \u201cOven's done, thank you. Bins next, and I'd like them tonight. Seven or nine?\u201d That names the gap and gives Sam a real choice. He would answer in words and not in sorries.","1":"It would sound like \u201cTypical of me to go on at him. Nobody wants a flatmate with a notebook.\u201d She would carry the blame home, and the blank boxes would stay blank.","3":"It would sound like \u201cWhy do I bother? Nothing in this flat ever changes.\u201d She would drop the sheet in the recycling, and Monday would arrive with nothing on the fridge."},"example":"A choir rota, Thursday. The treasurer finds two members have not signed for the hall.<br>She writes in the chat, \u201cI'll do the whole list again myself. I always do.\u201d<br>By Saturday the two members have decided she doesn't need them."},{"type":"pick","who":"Maya","text":"\u201cYou did every box. I'm sorry I kept on at you. You must be sick of living with someone like me.\u201d","cue":"11:20pm, the balcony, the pen still in her hand","options":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"answer":1,"why":"She hands the whole fault to herself and treats Sam as the patient one. The day has flipped: at 7:45 he was the one who couldn't, and at 11:20 she is. 'Someone like me' puts her down and him up. That is I'm not OK, you're OK, the swing that comes when the ledger has nothing left to prove.","traps":{"0":"It would sound like \u201cYou did every box. Thank you. Next month, tell me on the Wednesday if a week will slip.\u201d Both of them stay fine, and Sam gets a request he can meet.","2":"It would sound like \u201cEvery box, and only because I stood over you.\u201d Sam would hear a sentence with a bill on the end, and he'd go quiet.","3":"It would sound like \u201cIt won't last. I'll be the one filling it in again by March.\u201d Sam would shut his door, and the sheet would be blank by spring."},"example":"A swimming club changing room. The coach thanks a parent for handing the forms in on time.<br>She says, \u201cSorry I was on at you. I'm a nightmare, I know.\u201d<br>He says he never thought so. She goes home sure he did."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Sam","text":"\u201cAt quarter to eight she was sure I was the problem. By half eleven she was sure it was her. Which Maya is the real one?\u201d","cue":"passing you a mug of tea gone cold on the balcony rail","options":["Her usual corner is I'm OK, you're not OK. The night shows where she goes when the sheet stops working.","The night was the real Maya. The evening was only tiredness, and tired people say what they have been holding back.","Neither of them. People sit in one corner all their lives, so a single Saturday cannot show you anything about her."],"answer":0,"why":"The books call this life positions: the verdict a person settles early and tends to come back to. Maya's evening sat in I'm OK, you're not OK. The night shows what happens when Sam does his half and the ledger has nothing left to prove: the verdict swings onto her. That swing is the one to watch.","traps":{"1":"Sam would believe the night, apologise again, and the Maya who wants her bins done would go unheard.","2":"True that she is more than a corner, but the line closes the Saturday down. Nobody learns where the pressure takes her."},"example":"A football club WhatsApp. Thursday, the kit manager: \u201cThird week nobody brought the bibs. Brilliant.\u201d<br>Sunday, after the bibs turn up: \u201cSorry for being a nag, ignore me.\u201d<br>The first line is her usual corner. The second shows where she goes when she has no case left."}]}]},{"setting":"School & College","blurb":"Linda has a feedback sheet that says 'see me', and the group project is due on Friday.","opener":{"setting":"Tuesday, 8:50pm. The college, the library annexe, the long table by the radiator. Ms Pryce is handing back feedback sheets for the group project.","lines":[{"who":"Ms Pryce","text":"\u201cTwo lines each. Read yours before you decide what it means.\u201d","cue":"dealing the sheets out like cards"},{"who":"Hamid","text":"\u201cOurs says strong data, thin conclusion. Thin! I wrote that part in a taxi.\u201d","cue":"reading it aloud, louder than he needs to"},{"who":"Linda","text":"\u201cMine says see me. Nobody writes see me for good news.\u201d","cue":"turning it face down with one finger, laughing"}],"ask":"Which corner does each inner line belong in, and where does Linda end up by Thursday night?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line is what someone says to themselves. Find the corner that matches the verdict it carries. Three boards, four lines each.","items":[{"type":"sort","prompt":"Linda, Tuesday, 9:10pm, the bus home, the sheet face down on her knee. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cSee me could mean anything. I'll book ten minutes and ask what she'd change.\u201d","answer":0,"why":"She doesn't read the verdict in two words, and she treats Ms Pryce as someone she can ask. Both halves are fine. That is I'm OK, you're OK."},{"text":"\u201cMs Pryce doesn't read half of what she marks. I bet she writes see me on everything she can't be bothered with.\u201d","answer":2,"why":"The verdict lands on the tutor. Linda's work is fine and the marking is sloppy. That is I'm OK, you're not OK."},{"text":"\u201cEveryone in that room writes as if they were born to it. I'm forty-six and still putting commas where I breathe.\u201d","answer":1,"why":"She puts herself down and the whole room up. The commas are her fault and the others are naturals. This is her usual corner, I'm not OK, you're OK."},{"text":"\u201cIt's a bad course and I'm a bad student. Why did I pay the fee?\u201d","answer":3,"why":"The course is down and so is she. Both halves go, and the fee turns into proof. That is I'm not OK, you're not OK."}]},{"type":"sort","prompt":"Hamid, Wednesday, 12:30pm, the library, laptop open, sandwich untouched. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cThe group is a mess and so am I. Thin conclusion, thin everything, and nothing we do will fix it.\u201d","answer":3,"why":"He writes off the group and himself in one breath. With both halves down, even Thursday's meeting looks pointless. That is I'm not OK, you're not OK."},{"text":"\u201cThe data was mine and it was strong, the sheet says so. The conclusion was Sam's half, and Sam's half is always late.\u201d","answer":2,"why":"The sure part is 'the sheet says so', and the blame goes to Sam. He is the good half of the project. That is I'm OK, you're not OK."},{"text":"\u201cI should have written it at a desk and not in a taxi. Linda and Sam read this stuff better than I do.\u201d","answer":1,"why":"He owns the miss and then goes further, handing the others the skill. The step down is in 'better than I do'. That is I'm not OK, you're OK."},{"text":"\u201cThe data was good and the ending was rushed. Both are true, and I can ask the other two to help with the end.\u201d","answer":0,"why":"He keeps the praise and the criticism side by side and asks for help without apology. That is I'm OK, you're OK."}]},{"type":"sort","prompt":"Sam, Wednesday, 6:50pm, the corridor outside the annexe, a fee reminder in his hand. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cThe reminder came before the feedback did. This college wants my fee and gives me two lines. Poor deal for me.\u201d","answer":2,"why":"He is the customer and the college is the one falling short. The mood is cross, and the verdict is that he is fine and they are not. That is I'm OK, you're not OK."},{"text":"\u201cThree evenings missed and a fee reminder. I can still catch up if I tell Linda which part I'm taking and do it by Friday.\u201d","answer":0,"why":"He names the gap, picks a task, and trusts Linda to hear it. Both halves are fine. That is I'm OK, you're OK."},{"text":"\u201cI'm the one holding the group back, and they're too kind to say it.\u201d","answer":1,"why":"He puts himself down and them up, which is Sam's usual corner. The kindness is a compliment that keeps him small. It is I'm not OK, you're OK."},{"text":"\u201cI'll drop out and nobody will notice. None of them care whether I turn up.\u201d","answer":3,"why":"He writes off his own place and theirs. With both halves down, leaving feels like the only move. That is I'm not OK, you're not OK."}]}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Linda, one Thursday.<\/b><br>8:15am, the bus. She reads 'see me' for the ninth time.<br>1:00pm, the library annexe. The group has to decide who writes the conclusion.<br>9:30pm, her kitchen. Sam has emailed an opening paragraph and a question.","items":[{"type":"pick","who":"Linda, the library annexe, 1:00pm","text":"\u201cI can't do conclusions, and nobody in this group can organise a thing. It'll be bad whoever writes it, so leave me out.\u201d","cue":"pushing the laptop across the table, then pulling her hand back","options":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"answer":3,"why":"She is down on herself ('I can't') and down on the group ('nobody can organise'). The only move left is to step out, which is where taking part feels pointless. That is I'm not OK, you're not OK.","traps":{"0":"It would sound like \u201cI can't write all of it, but I'll do the first paragraph, and could one of you read it? We can fix the rest together.\u201d She would take a share and ask for help.","1":"It would sound like \u201cYou two write better than I do. Take it, and I'll proofread.\u201d She would hand over her share, and the table would let her.","2":"It would sound like \u201cNobody here planned this. If I'd been in charge we'd have finished last week.\u201d She would point across the table, and Hamid would shut his laptop."},"example":"A pub quiz team, Friday. The captain asks who'll take the music round.<br>One member says, \u201cI'm rubbish at music and none of you will listen anyway. Put me down for nothing.\u201d<br>They finish third, with an empty chair on the music round."},{"type":"pick","who":"Linda, her kitchen, 9:30pm","text":"\u201cSam's sent me his opening and a question. I'll read it tonight and he can read my page on the bus. If we're stuck, we both ask Ms Pryce on Friday.\u201d","cue":"the laptop on the ironing board, a mug beside it","options":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"answer":0,"why":"She gives herself a job, gives Sam one, and has the tutor as a place to go. Nobody is the problem and nobody is the rescuer. Both halves are fine: I'm OK, you're OK, the corner you can work from.","traps":{"1":"It would sound like \u201cSam's opening is better than anything I could write. Tell him to send the rest to Hamid.\u201d She would step away from her own half, and Sam would be left with an extra job.","2":"It would sound like \u201cSam's late again, as usual. I'll write the whole thing tonight and tell Ms Pryce.\u201d Sam would find his half done for him, and he'd go quiet on Friday.","3":"It would sound like \u201cSam's giving up and I might as well too. The whole group will fail.\u201d She would close the laptop, and Friday would arrive with nothing to hand in."},"example":"A parish newsletter team, Sunday. Two people split the notices between them.<br>One says, \u201cI'll do pages one and two, you do three and four, and we'll read each other's on Tuesday.\u201d<br>The newsletter goes out on time."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Ms Pryce","text":"\u201cLinda was low at nine in the morning and steady by half past nine at night. Was the first Linda an act?\u201d","cue":"stacking sheets for the next class","options":["No. She has one corner for life, so the evening was only a better mood, and nothing really moved.","Yes. Someone who can be steady by night was never really unsure, and so the morning was all for show.","No. Her usual corner is I'm not OK, you're OK. The evening shows she can leave it when work is shared."],"answer":2,"why":"The books call this life positions: the verdict a person settles early and tends to come back to. Linda's bus home sat in I'm not OK, you're OK, her usual corner. By the evening she was in I'm OK, you're OK, because the work had a size and she had a share. What moved her is the thing to watch.","traps":{"0":"It would close the day down. If she has one corner for life and the evening was a mood, nobody asks what shared work did for her.","1":"Ms Pryce would stop believing the first Linda, and the next 'see me' would be read as a bluff. The corner Linda comes back to would go unnoticed."},"example":"A book club group chat. Tuesday: \u201cI'm too slow to read these, ignore me.\u201d<br>Saturday, after two friends offer to read together: \u201cChapter nine is the best so far, shall we meet Sunday?\u201d<br>The Tuesday line is her usual corner. Saturday shows what moves her out of it."}]}]},{"setting":"Work","blurb":"Wrong totals reach a client overnight, and Daniel wants a name before the two o'clock call.","opener":{"setting":"Wednesday, 8:35am. Halden, the team room. The invoice export sent wrong totals to a client overnight, and the call is at two.","lines":[{"who":"Daniel","text":"\u201cWho signed off the export? I want a name before the kettle's boiled.\u201d","cue":"standing at the red-screened laptop, jacket still on"},{"who":"Omar","text":"\u201cI flagged the date field on Monday. It's in the standup notes.\u201d","cue":"not looking up from his screen"},{"who":"Clara","text":"\u201cI'll rebuild all the totals before two. Nothing will be wrong by then.\u201d","cue":"already typing, half a banana beside the keyboard"}],"ask":"Which corner does each inner line belong in, and where does Daniel end up by the evening?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line is what someone says to themselves. Find the corner that matches the verdict it carries. Three boards, four lines each.","items":[{"type":"sort","prompt":"Clara, 8:50am, her desk, the totals open in three windows. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cIt's my export and my date field. If it's wrong, I got it wrong, and everyone else is waiting on me to fix it.\u201d","answer":1,"why":"She takes all the fault and counts the others as fine and patient. Be Perfect lives in 'I got it wrong'. That is I'm not OK, you're OK."},{"text":"\u201cWrong totals can be fixed by two. I'll ask Omar to look at the date field with me, and Daniel can have the list of affected clients.\u201d","answer":0,"why":"She names the problem, asks for a partner, and passes Daniel what he needs. Both halves are fine. That is I'm OK, you're OK."},{"text":"\u201cIf they'd read the spec I wouldn't be rebuilding anything. I'm the only one on this team who checks.\u201d","answer":2,"why":"Sharp for Clara, which is why it stands out. She is the one who checks and they are the ones who don't. That is I'm OK, you're not OK."},{"text":"\u201cWhatever I rebuild will have another error, and nobody here will check it. It's hopeless, all of it.\u201d","answer":3,"why":"She writes off her own work and the team's checking in one go. Both halves are down. That is I'm not OK, you're not OK."}]},{"type":"sort","prompt":"Omar, 11:00am, the canteen queue, tray in hand. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cIt's in the standup notes. Anyone could have read them. I did my part.\u201d","answer":2,"why":"The verdict sits on 'anyone could have read them'. He did his bit and the others didn't. That is I'm OK, you're not OK."},{"text":"\u201cThe notes get ignored and so do I. It's the same on Monday as on Wednesday, so why write another flag?\u201d","answer":3,"why":"His flags are worthless and the readers are deaf. Both halves are down, and the reason to try goes with them. That is I'm not OK, you're not OK."},{"text":"\u201cI flagged it, and it wasn't picked up. That's a gap in the process. After the call I'll ask Daniel for ten minutes on how flags get read.\u201d","answer":0,"why":"He sees a gap and not a culprit. He doesn't excuse himself or rush to blame anyone. That is I'm OK, you're OK."},{"text":"\u201cI could have flagged it louder. Clara has the harder end of this, and I left her with it.\u201d","answer":1,"why":"He is the one who fell short, and Clara is the one carrying it. He puts himself down and lifts her up. That is I'm not OK, you're OK, a corner Omar rarely visits."}]},{"type":"sort","prompt":"Daniel, 1:45pm, the corridor outside the call room, his phone face down. Put each line in its corner.","bins":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"items":[{"text":"\u201cI've shouted at this team for a year, and now I don't know what to say to the client. They'd do better without me on the line.\u201d","answer":1,"why":"He puts himself down and the team up. It is a rare corner for him, and it shows in 'without me'. That is I'm not OK, you're OK."},{"text":"\u201cWrong figures to a client, a team that won't speak up and a boss who shouts. This place has no way back.\u201d","answer":3,"why":"Everyone in the sentence is down, himself included. Without a way back there is nothing to try. That is I'm not OK, you're not OK."},{"text":"\u201cFifteen minutes to the call, and I'm the only one who knows how to talk to this client. They can listen.\u201d","answer":2,"why":"He alone can speak to the client and the team can listen. That is I'm OK, you're not OK, the corner he returns to when the figures slip."},{"text":"\u201cThe totals were wrong, the fix is in, and I don't have all of it. Clara can take the numbers and I'll take the apology.\u201d","answer":0,"why":"He owns the gap in what he knows, splits the work, and takes the hard part for himself. Both halves are fine. That is I'm OK, you're OK."}]}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Daniel, one Wednesday.<\/b><br>9:05am, the team room. He wants a name.<br>2:10pm, the call room. Clara talks the client through the corrected totals.<br>6:40pm, the canteen, nearly empty. He is on his second tea, and Clara's chair is still warm.","items":[{"type":"pick","who":"Daniel, the team room, 9:05am","text":"\u201cSomebody signed this off without opening it. I'll go through every line myself, since nobody here reads past the first screen.\u201d","cue":"tapping the red-screened laptop, still in his jacket","options":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"answer":2,"why":"'Nobody here reads past the first screen' puts the team down, and 'I'll go through every line myself' makes him the one who can. That is I'm OK, you're not OK, the corner he returns to when numbers slip.","traps":{"0":"It would sound like \u201cHow a date field got through matters more than who signed it. Omar, Clara, walk me through where it slipped.\u201d The room would have a question it could answer.","1":"It would sound like \u201cThis is on me. I rushed the release plan on Monday and I should have asked.\u201d The team would stop talking, and Clara would work through lunch.","3":"It would sound like \u201cWrong totals and a team that can't be told anything. We may as well all go home.\u201d Nobody would rebuild a thing, and the two o'clock call would go ahead on bad figures."},"example":"A cricket club bar rota, Saturday. A barrel runs dry at tea.<br>The steward says, \u201cNobody on this committee can count a delivery. I'll order it all myself from now on.\u201d<br>The committee stops offering, and nobody tells him when he miscounts."},{"type":"pick","who":"Daniel, the canteen, 6:40pm","text":"\u201cShe turned that call round in ten minutes and I'd written her off for the appendix. I'm the one who makes this room hard to speak in.\u201d","cue":"turning his teacup a quarter turn, not drinking","options":["I'm OK, you're OK","I'm not OK, you're OK","I'm OK, you're not OK","I'm not OK, you're not OK"],"answer":1,"why":"He puts himself down and lifts Clara up. The morning was 'nobody here', and the evening is 'I'm the one'. Same man, different corner, and the swing came after Clara showed the doubt was wrong. That is I'm not OK, you're OK.","traps":{"0":"It would sound like \u201cShe turned that call round, and I was too quick to blame this morning. Tomorrow I'll say so in the room and ask what would help.\u201d Clara would get a stroke she could carry.","2":"It would sound like \u201cShe did well because I briefed her. The team does fine when I'm on top of things.\u201d Clara would hear that her ten minutes were his.","3":"It would sound like \u201cThat was luck. The next release will break too and nobody here can be trusted.\u201d Clara would walk into the next standup expecting the worst."},"example":"A choir rehearsal, Wednesday. The conductor snaps at the altos, then hears them nail the passage.<br>In the car park he says, \u201cI'm the reason half of them dread Wednesdays.\u201d<br>Nobody else has said it."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Omar","text":"\u201cAt nine Daniel blamed the room. By evening he was blaming himself. Which one is Daniel?\u201d","cue":"stirring his tea, looking at Daniel's empty chair","options":["His usual corner is I'm OK, you're not OK. The evening shows the verdict can swing when someone proves him wrong.","The evening is the real Daniel, and the morning is a front he puts on for the team because it is expected.","He changed corners twice in a day, so there is no corner he tends to come back to at all, and no pattern to watch."],"answer":0,"why":"The books call these life positions. Daniel's morning sat in I'm OK, you're not OK, the corner he returns to when numbers slip. When Clara proved the doubt wrong, the verdict swung onto himself. Neither is the whole man, and the swing shows how his pressure works.","traps":{"1":"Omar would start treating the shouting as an act and ignore the habit it leaves. Clara would meet it again at Monday's standup.","2":"A single day can show a swing and still point at a usual place. Omar would stop looking, and next week's red screen would find the same corner."},"example":"A football club WhatsApp. Monday, the coach: \u201cNobody turns up on time. It's always me.\u201d<br>Friday, after a win: \u201cI was too hard on you all this week, sorry.\u201d<br>The first line is his usual corner. The second shows how far the swing goes."}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://vaibhav-labs.github.io/TA/arena/","next":{"slot":"6.2","title":"Hear the Hidden Must","url":"https://vaibhav-labs.github.io/TA/arena/6-2.html"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  // If the hub's setting filter sent us here with ?setting=X and this game has that
  // setting, go straight into it instead of asking again on a "choose a setting" screen.
  var PRESET_STORY = -1;
  try {
    var wantSetting = new URLSearchParams(window.location.search).get("setting");
    if (wantSetting) {
      for (var si = 0; si < STORIES.length; si++) {
        if (STORIES[si].setting === wantSetting) { PRESET_STORY = si; break; }
      }
    }
  } catch (e) { /* URLSearchParams unsupported: fall through to the picker */ }
  if (PRESET_STORY >= 0) useStory(PRESET_STORY);
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: (MULTI && PRESET_STORY < 0) ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
