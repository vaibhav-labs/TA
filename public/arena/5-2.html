<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collecting Grudges · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"5.2","setting":"Home & Flatmates","title":"Collecting Grudges","world":5,"worldName":"Under the Surface","week":5,"weekName":"Under the Surface","mechanic":"Collect","concept":"After this one you can watch a grudge being collected one coupon at a time, and you can decline the cash-in.","plainWord":"grudge coupons","bookTerm":"Trading stamps","bookIdea":"Trading stamps are racket feelings, such as held resentments, saved up instead of said at the time, and a game's payoff is the moment they are traded in for a free blow-up.","bookSource":"Scripts People Live, ch. 1; TA Today, ch. 1 and 21","opener":{"setting":"Monday to Sunday, 9:00pm. Your room in apartment 3B, Hawthorn Court, by the bus stop. Mum is 600 km away, on the phone.","lines":[{"who":"Mum","text":"\u201cFour days and not one call. Saying nothing, I know. Just counting.\u201d","cue":"pen tapping a notebook by the phone"},{"who":"Dad","text":"\u201cYour mother's counting again. Let her count.\u201d","cue":"in the background, the telly on mute"}],"ask":"When someone keeps a tally of what you owe them, what do you do with the tally?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Some lines are plain complaints, said once. Others are grudge coupons, kept back in a private book for later. Pick the one that is being kept back.","items":[{"type":"pick","who":"Sam","text":"\u201cThe bathroom tap's dripping. Can someone look at it this weekend, please?\u201d","cue":"looking at the tap, not at anyone","options":["A grudge coupon: kept back, to be cashed in later","A plain complaint: said once, then let go"],"answer":1,"why":"It names one thing, the tap, and asks for one thing, a look this weekend. Once someone agrees, the complaint is finished, and nothing is kept back for later.","traps":{"0":"Reading it as a coupon would treat a simple request as a bill. Sam would feel counted, the tap would keep dripping, and the next request would arrive carrying this one along with it."},"example":"A housing society notice board, Friday.<br>Resident: \u201cThe lift is out again. Can the office send someone before Monday, please?\u201d<br>Office: \u201cWe'll send a man on Saturday.\u201d"},{"type":"pick","who":"Daniel","text":"\u201cNoted. That's the second deck this month that landed late. I'll keep it in mind.\u201d","cue":"not looking up from his screen, pen capped","options":["A grudge coupon: kept back, to be cashed in later","A plain complaint: said once, then let go"],"answer":0,"why":"'I'll keep it in mind' is a coupon. It says nothing about the deck in front of him, and it files the late deck for a later day. The line is kept back, and the cash-in is still to come.","traps":{"1":"Taking it as a plain complaint would answer the deck and drop the count. You would promise to send the next one early, Daniel would say fine, and the second late deck would simply become the third in his book."},"example":"A school bake sale, Saturday.<br>Mum: \u201cNoted. That's the second time your cake's been late. I'll remember.\u201d<br>Son: \u201cRight. Fine.\u201d Nothing else is said, and the cakes are still late in May."},{"type":"pick","who":"Maya","text":"\u201cIt's fine. I'll do the dishes. I always do the dishes.\u201d","cue":"already at the sink, the tap running, the cloth put down hard","options":["A plain complaint: said once, then let go","A grudge coupon: kept back, to be cashed in later"],"answer":1,"why":"'I always do the dishes' is said as a fact, but it is a count. Every pile she washes and every silence she keeps adds one more line to the book, so the coupon goes in and stays there.","traps":{"0":"Taking it as a plain complaint would answer the dishes and leave the count alone. Sam would dry a plate and say sorry, and the next pile would bring the same line back with all the old ones behind it."},"example":"A shared office kitchen, Wednesday.<br>Colleague: \u201cI'll clean the kettle. I always clean it, nobody else does.\u201d<br>She rinses the kettle hard and does not look round."},{"type":"pick","who":"Gran","text":"\u201cMy son didn't ring on my birthday. I won't say a word about it. I'm just noticing, that's all.\u201d","cue":"not looking up from the newspaper","options":["A grudge coupon: kept back, to be cashed in later","A plain complaint: said once, then let go"],"answer":0,"why":"'I won't say a word about it' and 'I'm just noticing' are the tells. Nothing is asked for today, and the son is not asked anything at all. The line goes into the book, for a day when it can be cashed in on him, or on her.","traps":{"1":"Taking it as a complaint about the birthday would make the call the topic. You would ask whether he is coming for the holiday weekend, and the coupon would stay in the book, because nothing you said could ever pay it off."},"example":"A WhatsApp family group, Sunday.<br>Cousin: \u201cNobody mentioned my exam result. Not that I'm bothered. I'm just saying.\u201d<br>Nobody replies to that one, and the exam comes up again over the holiday weekend."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Each line is a chance to keep a coupon or to put it down, and a coupon you never spend is one the other person cannot cash in.","items":[{"type":"scene","title":"Monday to Sunday, 9:00pm, the phone","setting":"Mum is 600 km away, on speaker by the kitchen sink. The call comes in at nine every evening, and she writes in a notebook while she talks.","meters":{"you":60,"them":50},"beats":[{"who":"Mum","text":"\u201cYou didn't call on Sunday. Your cousin rang me on hers, you know. I said you were busy. Busy.\u201d","cue":"Coupon one. Pen tapping the notebook.","lines":[{"text":"\u201cI missed Sunday, Mum, and that's on me. Are you cross, or are you worried?\u201d","tag":"best","you":3,"them":3,"outcome":"She stops writing. \u201cWorried. Both. Mostly worried,\u201d she says.","why":"You own the miss in one line and ask which feeling is under it. A plain question gives the feeling somewhere to go, so no coupon is added to the book."},{"text":"\u201cI was busy, Mum. Work's been mad this month.\u201d","tag":"ok","you":0,"them":-1,"outcome":"\u201cBusy,\u201d she repeats, and writes the word down.","why":"This is true, but it answers the count and not the feeling. The word goes in the notebook and waits for the next call."},{"text":"\u201cYou've got a cousin who rings every Sunday. Maybe ask her why she has time.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Mum closes the notebook and says the rice is burning.","why":"This pays a coupon back in kind, and it turns the count into a fight about who is the better child."}]},{"who":"Mum","text":"\u201cDad said we're fine on the phone, but his voice was grey. You'd know if you rang him, you know.\u201d","cue":"Coupon two. Turning back a page to find the last one.","lines":[{"text":"\u201cYou're right. I'll ring Dad on Friday, and I'll ring you on Saturday. Did he say what's wrong?\u201d","tag":"best","you":3,"them":2,"outcome":"She pauses. \u201cOnly that he's tired. He won't say more.\u201d","why":"You take the part that is yours, name the days, and ask for what he said. A dated plan closes one coupon instead of opening a second."},{"text":"\u201cDad's always fine, Mum. You know how he is.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"\u201cThat's just it,\u201d Mum says. \u201cNobody asks him.\u201d","why":"This brushes the feeling off, so Mum hears that nobody is going to ask. The coupon goes in the book under a new heading."},{"text":"\u201cI'm not the one who made him grey. Ask him yourself.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Mum says, \u201cRight. So it's me, then,\u201d and the line goes quiet.","why":"This hands the blame to someone who is not on the call. It gives Mum a reason to keep the notebook open for good."}]},{"who":"Mum","text":"\u201cYour aunt asked if you're getting married. I said you're too busy for that, too. She laughed. It wasn't funny.\u201d","cue":"Coupon three. Writing fast, the pen pressing hard.","lines":[{"text":"\u201cI'd rather you didn't speak for me, Mum. Tell me what it was like to be asked about me.\u201d","tag":"best","you":3,"them":2,"outcome":"Mum goes quiet. \u201cEmbarrassed,\u201d she says at last. \u201cI wanted to have something good to say.\u201d","why":"You refuse to be spoken for, and you ask for the feeling under the joke. That keeps you the one who speaks, and it gives her a real thing to say in place of a coupon."},{"text":"\u201cIt's fine, Mum. Auntie means well.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cShe does,\u201d Mum agrees, and writes something down.","why":"It is kind, but it closes the topic on her side. The coupon stays in the book for later."},{"text":"\u201cStop keeping score for everybody. It's exhausting.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Mum's pen stops too, and she says nothing for a long time before goodnight.","why":"Naming her as the problem is a sting. It gives her a chance to say she was only worried, and the trap keeps running."}]},{"who":"Mum","text":"\u201cIs something wrong at the job? You sound flat. Or is it me? I'm just the one who keeps asking.\u201d","cue":"Coupon four. Pen down, then up again.","lines":[{"text":"\u201cIt's a bit of both, I think. I'm tired, and I'm sorry I've been short with you. Can we talk properly on Sunday?\u201d","tag":"best","you":4,"them":4,"outcome":"\u201cSunday, properly,\u201d she says. \u201cYes. I'd like that.\u201d","why":"You name your part and your tiredness, then set a time for the real talk. A named time is what closes a coupon."},{"text":"\u201cIt's not you, Mum. Work's just work.\u201d","tag":"ok","you":0,"them":-1,"outcome":"\u201cIf you say so,\u201d she says, not sure she believes it.","why":"Kind, but flat. It denies the question and does not answer it, so she keeps the coupon and waits."},{"text":"\u201cYou always make it about you, Mum. Every single call.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. She says she is going to bed, and the line goes dead before you can answer.","why":"This cashes a coupon in on her, and it lets her be the one who was hurt. From here on, both of you are playing."}]},{"who":"Mum","text":"\u201cSo. Four coupons this week. I'm not angry. When you're ready, you'll know what you owe me.\u201d","cue":"Cash-in. The notebook open at a clean page.","lines":[{"text":"\u201cMum, you're doing the notebook again. Tell me what you want from me, plainly, and I'll try to give it.\u201d","tag":"best","you":4,"them":5,"outcome":"The notebook goes face down. \u201cI want you to ring on Sunday,\u201d she says. \u201cEvery Sunday. That's all.\u201d","why":"You stop the count and ask for the want, not the debt. A plain want can be met, and a coupon can only be paid off."},{"text":"\u201cFine. I'll ring every Sunday. I promise.\u201d","tag":"ok","you":-1,"them":1,"outcome":"\u201cGood,\u201d she says, and writes Sunday in the book with a line under it.","why":"A promise pays the coupons this time, and the book stays open for next week. Nothing was asked for, so nothing was really given."},{"text":"\u201cI owe you four calls and a trip home, and I'll never be enough for you.\u201d","tag":"game","you":-4,"them":-4,"outcome":"The scene stops there. Mum says, \u201cDon't say that, love,\u201d and the line goes quiet.","why":"This cashes the whole book in on yourself. Mum gets to comfort you, and the count goes on without anyone looking at it."}]}],"payoff":"Sunday, 9:40pm. Mum cashes the whole book in at once: every coupon since Monday, read out in order. The call ends before anyone can answer the last one.","fallout":{"them":"Mum does not ring on Monday, and the notebook is still open on the kitchen table."}},{"type":"scene","title":"Thursday to Friday, 7:30am, the kitchen","setting":"Hawthorn Court, apartment 3B. The rent is due on Friday, the milk has gone off again, and Maya keeps her count on the back of a takeaway menu.","meters":{"you":55,"them":50},"beats":[{"who":"Maya","text":"\u201cIt's fine. The milk's off, I'll pour it away. I'll do it. I always do it.\u201d","cue":"Coupon one. Pouring the milk down the sink without looking up.","lines":[{"text":"\u201cLeave the milk, Maya. Sit down for five minutes. What's been the worst bit of your week?\u201d","tag":"best","you":3,"them":3,"outcome":"She stops with the carton in her hand. \u201cThe shifts,\u201d she says, and sits, surprised she's allowed to.","why":"You stop the chore and ask about her week, not her thanks. That gives her a seat, and the count loses a coupon."},{"text":"\u201cThanks. Do you want tea?\u201d","tag":"ok","you":0,"them":0,"outcome":"She nods, puts the kettle on, and keeps the count to herself.","why":"Kind, and it helps, but it thanks her for the chore and leaves the count where it was."},{"text":"\u201cYou always do it, Maya. Sam doesn't even notice.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. She says it's easier to do it herself, and she shuts the fridge door hard.","why":"This spends a coupon on Sam, and it hands her the job of defending him. The count now has a target."}]},{"who":"Sam","text":"\u201cSorry, sorry. Milk tomorrow, rent on Friday, promise. You're the best, you know.\u201d","cue":"Coupon two. Maya writes on the menu without looking at him.","lines":[{"text":"\u201cYou've said Friday before. What's the one thing you can do tonight?\u201d","tag":"best","you":3,"them":2,"outcome":"Sam looks at his phone and says he'll send half now. \u201cHalf now,\u201d he says, to himself.","why":"You ask for one real action tonight, not a promise for Friday. A promise is a coupon, and a transfer closes it."},{"text":"\u201cIt's fine, Sam. Just do it on Friday.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cFriday, yes,\u201d he says, already halfway to his room.","why":"It sounds generous, but it takes the count on yourself and accepts a promise you have heard before."},{"text":"\u201cFriday, Friday, every month. You never change.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Sam says nothing at all, and his door shuts.","why":"This sting gives him the chair he always sits in, and the trap has a fresh round before the flat wakes up."}]},{"who":"Maya","text":"\u201cThe rent's due today. It's been due all week. I've been doing the sums on the back of this menu.\u201d","cue":"Coupon three. Holding up the menu, the columns in pen.","lines":[{"text":"\u201cI'd rather pay you on time than hear the sums again. What's the number? I'll send it by six.\u201d","tag":"best","you":4,"them":3,"outcome":"She reads out the number. It is more than you thought, and she says six is fine.","why":"You turn the sums into a number and a time, and you take the piece that is yours. A named time closes the coupon."},{"text":"\u201cOkay. Sorry about the sums.\u201d","tag":"ok","you":-1,"them":0,"outcome":"She nods, folds the menu, and the sums go back in her pocket.","why":"A sorry closes the moment and keeps the amount hidden. The count goes on, out of sight, for next month."},{"text":"\u201cA list on a menu? Good to know where I stand, then.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Maya puts the menu in the bin, then takes it out again.","why":"This sneers at the count, so she has to defend it. It is a sting, and it gives her one more reason to keep the menu."}]},{"who":"Maya","text":"\u201cIt's fine. I'll cover it this month and move my things out of the shared fridge. I'm used to it.\u201d","cue":"Cash-in. Zipping her bag, the menu folded inside.","lines":[{"text":"\u201cDon't cover it, Maya. Tell him what you need, then let him answer.\u201d","tag":"best","you":4,"them":2,"outcome":"She stops with the bag half zipped and says the milk is someone else's job, out loud, for the first time.","why":"You stop the cash-in on herself and ask for the need. Once the need is said, Sam has something to answer, and the count loses its hold."},{"text":"\u201cFine. Cover it. You're good at that.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"She says thanks, a bit flat, and goes to bed early.","why":"Warm words, but they hand her the chore again, so the coupon goes back in the bag."},{"text":"\u201cRight, I'll do everything, as always. Don't mind me.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. She shuts her bedroom door, and the flat goes silent.","why":"This is the cash-in on herself. The coupon is spent on her own back, and the trap gets a fresh round tomorrow."}]}],"payoff":"Friday, 6:40pm. Maya cashes the whole menu at once, on Sam and then on herself. The milk turns again in the fridge, and the rent arrives a day late.","fallout":{"them":"Sam takes his keys and leaves the flat without speaking to her."}}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cMum's notebook and Maya's menu are doing the same job. What are they, and what would a plain ask have looked like?\u201d","cue":"tapping the table once, twice, then leaving her hand flat on it","options":["They are trading stamps: grudges kept back in a private book and waiting for a cash-in. A plain ask would have named the feeling and the want as they happened.","They are plain complaints about the day. The right reply would have answered each complaint and let it go.","They are honest feelings, so the right move was to agree with each one and move on."],"answer":0,"why":"Plain words first: these are grudge coupons. The books call them trading stamps, and a stamp is a feeling saved up instead of said, to be traded in later for a blow-up, on someone else or on yourself. A plain ask names the feeling and the want when they happen, so there is nothing left to keep.","traps":{"1":"Answering each complaint sounds fair, but it treats every line as a single day. Mum and Maya would each hear that the day was dealt with. The book would stay open, and the cash-in would still arrive later in the week.","2":"Agreeing and moving on keeps the count hidden. The stamp stays in the book, and the feeling is agreed away instead of asked for."},"example":"A cousins' group chat, Thursday.<br>Kate: \u201cFine. I'll sort the snacks, like always.\u201d<br>Ruth: \u201cAre you cross, or are you tired?\u201d<br>Kate: \u201cTired. Ask me on Sunday.\u201d"}]}],"debrief":{"nadia":"Almost nobody in those scenes raised their voice, and the book still filled up every day. Each line that was kept back waited for its day, and that day is when the payoff came. The way to stop the count is to ask for the want while it is still small.","bookTerm":"Trading stamps","bookNote":"The books call these trading stamps: feelings saved up instead of said at the time, then traded in for a payoff on someone else, or on yourself."},"reflection":{"prompt":"Which grudge did you keep back this week, and who were you planning to cash it in on?"},"next":"5.3","baseStory":{"setting":"Home & Flatmates","blurb":"Mum keeps a notebook of missed calls and Maya keeps sums on a menu, all week."},"moreStories":[{"setting":"Work","blurb":"Daniel keeps a list of late work, Clara keeps her own, and Friday's release is two days away.","opener":{"setting":"Wednesday, 9:15am. Halden, the team room. The release goes out on Friday at five.","lines":[{"who":"Daniel","text":"\u201cNoted. That's the third time this sprint the notes have come in after standup. I'm keeping a list.\u201d","cue":"capping his pen, eyes on the board"},{"who":"Clara","text":"\u201cOf course. It won't happen again.\u201d","cue":"already typing, her tea cold since seven"},{"who":"Omar","text":"\u201cShe rebuilt the deploy script on Sunday. Nobody asked her to.\u201d","cue":"low, to you, not looking up from a red test"}],"ask":"When someone starts a list of what you owe, what do you do with the list?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Some lines are plain complaints, said once. Others are grudge coupons, kept back in a private book for later. Pick the one that is being kept back.","items":[{"type":"pick","who":"Omar","text":"\u201cThe invoice test is red again. Can you look before lunch? It's holding up the release branch.\u201d","cue":"turning his monitor so you can see","options":["A grudge coupon: kept back, to be cashed in later","A plain complaint: said once, then let go"],"answer":1,"why":"It names one thing, a red test, and asks for one thing, a look before lunch. Once you say yes, it is finished, and nothing is saved for later.","traps":{"0":"Reading it as a coupon would treat a red test as a bill. You would apologise for the test and bring a list of your own, and the test would still be red at lunch."},"example":"A bus depot, Tuesday.<br>Driver: \u201cBay three's lamp is out. Can maintenance fix it before the night shift?\u201d<br>Supervisor: \u201cI'll log it now.\u201d"},{"type":"pick","who":"Daniel","text":"\u201cGo ahead, skip the review. I won't say anything. It's all been noted, don't worry.\u201d","cue":"waving the draft away without opening it","options":["A grudge coupon: kept back, to be cashed in later","A plain complaint: said once, then let go"],"answer":0,"why":"'I won't say anything' and 'it's all been noted' announce a silence. Nothing is asked about the draft, and the skipped review goes onto the list for a later day.","traps":{"1":"Taking it as a plain permission, you would skip the review and feel lighter. The list would keep a line for it, and you would meet that line on Friday afternoon."},"example":"A flat committee meeting, Thursday.<br>Treasurer: \u201cSpend what you like on the paint. I won't say a word. It's all in the minutes.\u201d<br>Chair: \u201cThanks!\u201d The paint bill comes back at the AGM, three people deep."},{"type":"pick","who":"Clara","text":"\u201cI redid the deploy script on Sunday. It's fine. Nobody asked me to. I'm only saying in case it comes up.\u201d","cue":"straightening a pile of printouts that is already straight","options":["A plain complaint: said once, then let go","A grudge coupon: kept back, to be cashed in later"],"answer":1,"why":"She tells you what it cost and asks for nothing. 'In case it comes up' means the Sunday is being saved, to be spent when someone else slips.","traps":{"0":"Calling it a plain complaint, you would say thanks and move on. She would hear that the Sunday was noted and not wanted, and the line would stay in her book."},"example":"A running club chat, Monday.<br>Organiser: \u201cMarked the whole route myself again. Nobody asked me to. Just in case anyone wonders why I'm tired.\u201d<br>Nobody replies, and next week she marks it again."},{"type":"pick","who":"Hugh","text":"\u201cI'm not happy about retesting on Thursday. The data changed under me twice. Can we freeze the test data from tonight?\u201d","cue":"arms folded, but looking straight at you","options":["A plain complaint: said once, then let go","A grudge coupon: kept back, to be cashed in later"],"answer":0,"why":"He sounds cross, and he is allowed to. He names the thing, the data, and asks for one change, a freeze tonight. Annoyed and kept back are different things.","traps":{"1":"Hearing a coupon, you would go careful and ask what else he has been counting. Hugh would be puzzled, and the data would go on changing."},"example":"A garage, Saturday.<br>Customer: \u201cI'm not happy the car wasn't ready. Can you ring me before noon next time?\u201d<br>Mechanic: \u201cFair. I'll ring by eleven.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Each line is a chance to keep a coupon or to put it down, and a coupon you never spend is one the other person cannot cash in.","items":[{"type":"scene","title":"Wednesday, 4:45pm, the team room","setting":"The room is half empty. Daniel's whiteboard has a column headed LATE that nobody has dared to rub out.","meters":{"you":60,"them":50},"beats":[{"who":"Daniel","text":"\u201cYou were four minutes late to standup. Four. I'm not saying anything. I just notice, that's all.\u201d","cue":"Coupon one. Looking at the clock, not at you.","lines":[{"text":"\u201cFour minutes, and that's mine. Is the time the problem, or is something on the release worrying you?\u201d","tag":"best","you":3,"them":3,"outcome":"He puts the pen down. \u201cThe release,\u201d he says. \u201cThe client call is Friday at four.\u201d","why":"You own the four minutes in one line and ask what is under the count. A plain question gives the worry somewhere to go, so no coupon is added."},{"text":"\u201cSorry. Traffic. It won't happen again.\u201d","tag":"ok","you":0,"them":-1,"outcome":"\u201cHm,\u201d he says, and looks at the board.","why":"True and polite, but it answers the minutes and not the worry. The line stays on the board."},{"text":"\u201cYou're counting minutes now? Count how many times your feedback has come late.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Daniel says feedback is a separate meeting and turns his chair away.","why":"This pays a coupon back in kind, and it turns the count into a contest about who is later."}]},{"who":"Daniel","text":"\u201cClara's appendix. I've said nothing to her. I'm not sure she's ready for the client, that's all.\u201d","cue":"Coupon two. Dropping his voice, glancing at her empty desk.","lines":[{"text":"\u201cShe's quicker than she looks. It'll be fine.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cWe'll see,\u201d he says, and writes nothing down.","why":"Reassuring, but his doubt stays in his pocket and she stays in the dark."},{"text":"\u201cSay it to her, Daniel. Today, with the appendix open. She would rather hear it from you than guess.\u201d","tag":"best","you":3,"them":2,"outcome":"He rubs his jaw. \u201cShe'd take it badly.\u201d \u201cShe'd take it,\u201d you say. He nods slowly.","why":"You send the doubt back to the person it is about. A coupon only dies when it is said to the face it belongs to."},{"text":"\u201cSo you say nothing to her and everything to me. Great system.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Daniel says the system has worked for twelve years and goes to find a coffee.","why":"Sneering at his habit makes him defend it, and it gives him a fresh line for the list."}]},{"who":"Daniel","text":"\u201cAnd the retro. Skipped twice. I'm not angry. It's just on the list.\u201d","cue":"Coupon three. Tapping the LATE column with the cap of his pen.","lines":[{"text":"\u201cThat list is the least useful thing in this building.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Daniel caps the pen and says nobody asked for advice from the person with two late decks.","why":"An attack on the list lands as an attack on him, so he cashes a coupon on the spot."},{"text":"\u201cI'll try to make the next one.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cTry,\u201d he says, and the word goes under LATE.","why":"'Try' is the kind of promise that gets written down, not struck off."},{"text":"\u201cThen book it now. Thursday at ten, fifteen minutes, and I'll bring the three things that went wrong.\u201d","tag":"best","you":4,"them":3,"outcome":"He writes it in the diary. \u201cThursday at ten,\u201d he says. \u201cFifteen.\u201d","why":"You name a day, a length and your own part. A time in the diary closes a coupon, where a promise to do better only adds to it."}]},{"who":"Daniel","text":"\u201cRight. Three coupons, then. If the release slips, I want it on record who was late and who skipped. For the record.\u201d","cue":"Cash-in. Standing, the board marker in his hand.","lines":[{"text":"\u201cUnderstood. I'll make sure it's all on time.\u201d","tag":"ok","you":-1,"them":1,"outcome":"\u201cGood,\u201d he says, and adds a tick to the column.","why":"Promising everything pays this week's coupons and leaves the book open for next week."},{"text":"\u201cDaniel, drop the record. Tell me what you want from the next two days, plainly, and I'll say what I can do.\u201d","tag":"best","you":4,"them":5,"outcome":"He puts the marker down. \u201cNotes before standup. And tell me when something is red, before I find it.\u201d","why":"You stop the count and ask for the want. A want can be met, and a record can only be used later."},{"text":"\u201cFor the record, I told you at nine the deck was late, and you said fine.\u201d","tag":"game","you":-4,"them":-4,"outcome":"The scene stops there. Daniel says the record shows otherwise, and the board gets a fresh column.","why":"You answer his method with the same method. Now there are two books in the room."}]}],"payoff":"Friday, 4:50pm. Ten minutes before the client call, Daniel reads the whole column out in front of the team, in order. Clara leaves the room with her laptop still open.","fallout":{"them":"Daniel does not stand with the team for the release, and the column is still on the board all weekend."}},{"type":"scene","title":"Thursday, 7:40pm, Clara's desk","setting":"The team room is empty except for Clara and Omar's jacket on his chair. The vending machine hums. The deploy script is open on both her screens.","meters":{"you":55,"them":50},"beats":[{"who":"Clara","text":"\u201cYou can go home. I'll finish the appendix. I always finish it. It's fine, really.\u201d","cue":"Coupon one. Not turning from the screen.","lines":[{"text":"\u201cPause the appendix. Which bit would you hand over if you could?\u201d","tag":"best","you":3,"them":3,"outcome":"She stops typing. \u201cThe tables,\u201d she says, too fast. \u201cActually yes. The tables.\u201d","why":"Instead of thanking her for finishing, you ask for the one thing she could give away. That gives her somewhere to put it other than the book."},{"text":"\u201cThanks. I owe you one.\u201d","tag":"ok","you":0,"them":0,"outcome":"\u201cNo, you don't,\u201d she says, and files it somewhere behind her eyes.","why":"Warm, but 'I owe you one' adds to a count she is already keeping."},{"text":"\u201cYou always finish it, and Daniel still doubts you. Say something to him.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Clara says it is late and she needs the screen.","why":"This spends her coupon on Daniel and hands her the job of defending him, in front of you."}]},{"who":"Clara","text":"\u201cDaniel told Omar I wasn't ready for the client. In the corridor. I wasn't meant to hear. I'm not upset.\u201d","cue":"Coupon two. Smoothing a printout with the side of her hand.","lines":[{"text":"\u201cThen tell Daniel to stop talking about you. Or I will.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Clara says please don't, and shuts the laptop.","why":"Rescuing her takes over her fight. She ends up managing your temper instead of her own feeling."},{"text":"\u201cDaniel says things. Don't take it to heart.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"\u201cRight,\u201d Clara says, and prints another copy of something already printed.","why":"Waving it off tells her the hurt is not allowed, so it goes back in the book."},{"text":"\u201cThat would be hard to overhear. Would it help to ask him what he meant, with me in the room?\u201d","tag":"best","you":3,"them":3,"outcome":"She looks at the printout. \u201cWith you there, yes. Nine o'clock.\u201d","why":"You name how it landed and offer a plan she can accept, without taking the fight from her. A time and some company shrink a coupon."}]},{"who":"Clara","text":"\u201cI've been here since five. Nobody said anything. I'm not saying I wanted them to.\u201d","cue":"Coupon three. A small laugh that stops before her eyes.","lines":[{"text":"\u201cI noticed. I'm saying it late. Eat something, then tell me what you need from me tomorrow.\u201d","tag":"best","you":4,"them":4,"outcome":"Clara blinks. \u201cToast, maybe,\u201d she says. \u201cAnd the tables.\u201d","why":"You say the thing she was waiting to be asked for, and you ask for the want straight away. Saying it ends the coupon for both of you."},{"text":"\u201cThat's a lot of hours. Don't burn out.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cI won't,\u201d she says, with the screen already bright.","why":"Concern with no question in it. She has nothing to answer, so the five o'clock start stays hers alone."},{"text":"\u201cNobody asked you to be here at five, Clara. That's your choice.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. The room is only keyboards for a long time.","why":"True, and cruel. It cashes a coupon on her, and it gives her a good reason to keep the book."}]},{"who":"Clara","text":"\u201cFine. I'll finish everything myself and I won't ask Daniel for anything again. I'm used to it.\u201d","cue":"Cash-in. Zipping the laptop sleeve with the appendix folded inside.","lines":[{"text":"\u201cOkay. Get some sleep, then.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"She nods, polite, and takes the laptop home to work on.","why":"Sensible words that accept the cash-in. Nothing is asked of Daniel, so nothing changes."},{"text":"\u201cDon't zip it. Say one thing you need from Daniel tomorrow, and I'll stand next to you while you say it.\u201d","tag":"best","you":4,"them":3,"outcome":"She sits back down with the bag on her knees. \u201cI need him to read the appendix before he decides,\u201d she says. \u201cOut loud, to me.\u201d","why":"You stop the cash-in on herself and ask for the need. Once it is said, Daniel has something to answer."},{"text":"\u201cRight, so I'll do your tables and the client call. Don't mind me.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Clara says that isn't what she said.","why":"You copy her cash-in back at her. She now has to look after your feelings about it."}]}],"payoff":"Friday, 8:55am. Clara cashes the whole week at once, on Daniel and then on herself, in the lift. The appendix goes in unread, and the release goes out at six, not five.","fallout":{"them":"Clara leaves at lunchtime without a word, and Omar finds her laptop still open."}}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Omar","text":"\u201cDaniel's list and Clara's long nights are doing the same job. What are they, and what would a plain ask have looked like?\u201d","cue":"setting down a cold coffee, one finger on the table","options":["They are plain complaints about the week: late notes and long hours, each one fair. The right reply would have answered each in turn, and let it go.","They are trading stamps: feelings saved up instead of said, waiting to be traded in. A plain ask names the feeling and the want as it happens.","They are honest feelings that deserve respect, so the right move was to agree with each one and move on without making a fuss over it."],"answer":1,"why":"Plain words first: these are grudge coupons, one kept on a whiteboard and one kept in a silence. The books call them trading stamps, a feeling saved up instead of said, to be traded in later on someone else or on yourself. Daniel could have said he was worried about Friday. Clara could have asked for the tables to be shared. Either would have left nothing in the book.","traps":{"0":"Answering each complaint sounds fair, but it treats every line as a single day. Daniel and Clara would each hear that the day was dealt with. The book would stay open, and the cash-in would still arrive on Friday.","2":"Agreeing and moving on keeps the count hidden. The stamp stays in the book, and the feeling is agreed with instead of asked about."},"example":"A choir chat, Thursday.<br>Alto: \u201cI'll bring the flask again. No problem. Someone has to.\u201d<br>Tenor: \u201cDo you want me to take it this week?\u201d<br>Alto: \u201cYes, please. I was getting tired of it.\u201d"}]}]},{"setting":"School & College","blurb":"Lorna keeps a folder on her group's missed jobs, and Sam's charts are still unfinished before Tuesday.","opener":{"setting":"Tuesday, 7:10pm. The college, room 12. The group project is due next Tuesday, and the tutor has just stepped out.","lines":[{"who":"Lorna","text":"\u201cNobody needs to apologise to me. I did the survey forms. I did all forty-one. It's fine.\u201d","cue":"squaring a stack of forms against the desk edge"},{"who":"Sam","text":"\u201cSorry, sorry, I'll do the charts. Tonight. Probably tonight. I think.\u201d","cue":"looking at his phone, then at the door"},{"who":"Theo","text":"\u201cI'm going to get a tea. Does anyone want a tea?\u201d","cue":"already standing, already halfway out"}],"ask":"When someone in a group is counting what the others owe, what do you do with the count?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Some lines are plain complaints, said once. Others are grudge coupons, kept back in a private book for later. Pick the one that is being kept back.","items":[{"type":"pick","who":"Ms Pearce","text":"\u201cThird week without the method section. I'll make a note of that. I'm sure it will all come out in the marks.\u201d","cue":"ticking the feedback sheet without looking up","options":["A grudge coupon: kept back, to be cashed in later","A plain complaint: said once, then let go"],"answer":0,"why":"'I'll make a note' and 'it will all come out in the marks' are the tells. The missing section is not asked for. It is saved, for a later day when it can be used.","traps":{"1":"Hearing a plain complaint, you would promise the section for next week and feel clear. The note would still be in her book, and the marks would carry it."},"example":"A cricket club, Sunday.<br>Captain: \u201cThird match without the scorebook. I'll remember that. It'll all come out at selection.\u201d<br>Player: \u201cSorry, sorry.\u201d The scorebook is still missing at selection."},{"type":"pick","who":"Theo","text":"\u201cThe projector in room 12 cuts out after ten minutes. Can we swap to the library for Thursday's run-through?\u201d","cue":"holding up his phone with the room booking on it","options":["A grudge coupon: kept back, to be cashed in later","A plain complaint: said once, then let go"],"answer":1,"why":"It names one fault, a projector, and asks for one move, the library on Thursday. Someone says yes or no, and it is finished.","traps":{"0":"Reading it as a coupon would hunt for what lies behind a projector. Theo would be baffled, and the room would still cut out at ten minutes."},"example":"A tenants' meeting, Wednesday.<br>Resident: \u201cThe hall heater trips after an hour. Can we use the upstairs room on Friday?\u201d<br>Chair: \u201cYes, I'll book it.\u201d"},{"type":"pick","who":"Sam","text":"\u201cI haven't done the charts yet. I'll do them tonight. Can someone send me the survey totals so I can start?\u201d","cue":"phone out, thumb ready over the group chat","options":["A plain complaint: said once, then let go","A grudge coupon: kept back, to be cashed in later"],"answer":0,"why":"He says what is undone and asks for one thing that would let him start. It sounds like an excuse, but a request with a task attached is not a coupon.","traps":{"1":"Hearing a coupon, you would take the chart line as a debt and answer with a count of your own. Sam would not get the totals, and the charts would not get done."},"example":"A walking group chat, Friday.<br>Member: \u201cI haven't printed the route yet. Can someone send me the map link?\u201d<br>Leader: \u201cSending it now.\u201d"},{"type":"pick","who":"Lorna","text":"\u201cNo, leave the posters. I carried them last week and the week before. I'm only saying what I've done.\u201d","cue":"gripping the cardboard tube, shoulder already dipped","options":["A plain complaint: said once, then let go","A grudge coupon: kept back, to be cashed in later"],"answer":1,"why":"She counts two weeks of carrying and asks for nothing. 'I'm only saying what I've done' puts the weeks into the book, to be read out when someone slips.","traps":{"0":"Calling it a plain complaint, you would offer to carry them this once and think it settled. Lorna would thank you, and the two earlier weeks would stay in her tally."},"example":"A village hall, Saturday.<br>Volunteer: \u201cLeave the chairs. I stacked them last month and the month before. I'm just saying.\u201d<br>Nobody offers. The chairs are stacked by her again."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Each line is a chance to keep a coupon or to put it down, and a coupon you never spend is one the other person cannot cash in.","items":[{"type":"scene","title":"Wednesday, 5:15pm, the library","setting":"Second floor, the table by the radiator. The poster is due Tuesday. Lorna has a folder with coloured tabs, and a page headed SAM that she has not shown anyone.","meters":{"you":60,"them":50},"beats":[{"who":"Lorna","text":"\u201cIt's fine that the charts aren't done. I did the survey forms myself. Forty-one, on the 35-minute bus. Anyway.\u201d","cue":"Coupon one. Sliding the folder closer, tabs facing out.","lines":[{"text":"\u201cForty-one is a lot, and I let you carry it. Are you annoyed, or just worn out?\u201d","tag":"best","you":3,"them":3,"outcome":"\u201cWorn out,\u201d she says. \u201cAnd annoyed. Mostly worn out.\u201d","why":"You own your part and ask which feeling sits under the count. A plain question gives the feeling somewhere to go, so no coupon is added."},{"text":"\u201cWell done on the forms. Great effort.\u201d","tag":"ok","you":0,"them":-1,"outcome":"\u201cThanks,\u201d she says, and turns a tab in the folder.","why":"Praise for the job, and no word for the cost. The tab turns, and the page behind it waits."},{"text":"\u201cIf you'd asked for help, you'd be less tired.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Lorna says she should not have to ask, and goes to find a toilet.","why":"This pays the coupon back as blame, and it turns the evening into a contest about who should have asked."}]},{"who":"Sam","text":"\u201cSorry, sorry, I'll do the charts tonight. Probably tonight. The file's on my laptop, it's just that work was a lot.\u201d","cue":"Coupon two. Lorna writes something in the folder without looking up.","lines":[{"text":"\u201cWork was a lot for all of us, Sam. You say it every week.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Sam says nothing and puts his coat on.","why":"A sting, and a true one. It gives Sam a reason to leave and Lorna a new page for the folder."},{"text":"\u201cIt's fine, Sam. Do it when you can.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cWhen I can, yes,\u201d Sam says.","why":"It sounds kind, but you have accepted a promise Lorna has already heard."},{"text":"\u201cProbably tonight won't work for Lorna. Send me the file now and I'll sit with you on the first chart.\u201d","tag":"best","you":3,"them":2,"outcome":"Sam goes pink. \u201cNow? Okay. Yes. It's on the desktop.\u201d","why":"You ask for one real action in the room. A promise for tonight is a coupon, and a file sent is a closed one."}]},{"who":"Lorna","text":"\u201cMs Pearce asked who was doing the method section. I said it was a team thing. It's all in here, if anyone wants to know who did what.\u201d","cue":"Coupon three. Patting the folder, not opening it.","lines":[{"text":"\u201cI'm sure Ms Pearce knows it was a team effort.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cShe might,\u201d Lorna says, and the folder stays shut.","why":"It smooths the moment and leaves the folder closed. Nothing on the page has changed."},{"text":"\u201cI'd rather see the page than hear it hinted at, Lorna. Open it, and let's give the method section an owner tonight.\u201d","tag":"best","you":4,"them":3,"outcome":"She opens it. The page has dates and initials, and the method section has nobody's. \u201cMine,\u201d says Theo, from the end of the table.","why":"Asking to see the count turns a threat into a list that can be shared out. Naming the unowned job and an evening closes it."},{"text":"\u201cA folder? You've been keeping a file on us?\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Lorna says it is a project file and closes it with a snap.","why":"This drags the book into the open as an accusation, and she has to defend it."}]},{"who":"Lorna","text":"\u201cFine. I'll do the charts and the method section. I'll put my name on the lot. I'm used to it.\u201d","cue":"Cash-in. Standing, the folder held against her chest.","lines":[{"text":"\u201cSit down, Lorna. Tell us what you need from each of us, and we'll say yes or no out loud.\u201d","tag":"best","you":4,"them":5,"outcome":"She sits. \u201cCharts tonight, from Sam. Method from Theo,\u201d she says. \u201cAnd someone to tell me when I'm doing too much.\u201d","why":"You stop the cash-in and ask for the need. Once each person has a plain request to answer, the book has nothing left to hold."},{"text":"\u201cIf you're sure. You're good at this.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cI know,\u201d she says, a little flat, and leaves with the folder.","why":"Praise that accepts the cash-in. She gets complimented for carrying everything, so she will carry everything."},{"text":"\u201cFine. Do it all. See if we care.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Theo puts his tea down and does not pick it up.","why":"This answers a cash-in with a cash-in. Now the whole group has a coupon in it."}]}],"payoff":"Tuesday, 7:05pm. Lorna presents alone, with a poster that has one name on it. Ms Pearce asks where everyone else is, and Lorna reads out the page headed SAM.","fallout":{"them":"Lorna takes the folder home and does not answer the group chat."}},{"type":"scene","title":"Thursday, 12:30pm, the corridor outside room 12","setting":"The feedback sheets are on a clipboard by the vending machine. Sam has read his three times, and the paper has gone soft at the folds.","meters":{"you":55,"them":50},"beats":[{"who":"Sam","text":"\u201cShe wrote 'again' next to the method section. Again. Funny, isn't it. I'm not bothered, I'm just reading it.\u201d","cue":"Coupon one. Folding the sheet smaller each time.","lines":[{"text":"\u201cThat one word stung, I can tell. Do you want to ask Ms Pearce what she meant, or read the rest first?\u201d","tag":"best","you":3,"them":3,"outcome":"He unfolds it. \u201cRead the rest,\u201d he says. \u201cThere's more underneath.\u201d","why":"You name that it stung and offer two ways forward. He chooses, and the word stops being a secret."},{"text":"\u201cIt's one word, Sam. Don't read too much into it.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"\u201cRight,\u201d he says, and reads it again.","why":"Making it small tells him the sting is not allowed, so he keeps it and reads harder."},{"text":"\u201cIf you'd done the method section, there'd be no 'again'.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Sam says he knows, he knows, and walks to the machine.","why":"This is true and it is a sting. It adds a line to Sam's book and gives him a reason to stay silent."}]},{"who":"Sam","text":"\u201cLorna hasn't spoken to me since yesterday. She's right. I'm hopeless, sorry, you don't need to say anything.\u201d","cue":"Coupon two. Eyes on the vending machine light.","lines":[{"text":"\u201cShe'll come round. Give it a day.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cYes. Probably,\u201d Sam says.","why":"It waits, and Sam hears that nothing is needed from him."},{"text":"\u201cShe was tired of forty-one forms, and she has a point. Message her tonight with what you'll do and by when. One line.\u201d","tag":"best","you":3,"them":3,"outcome":"He takes out his phone. \u201cCharts. By ten,\u201d he types, and reads it out loud.","why":"You turn 'hopeless' into a task with a time on it. One line sent is worth more than a long sorry."},{"text":"\u201cYou say 'hopeless' so nobody can say it first. It's a trick, Sam.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Sam says that is unfair and he is late for his bus.","why":"Naming his pattern as an attack makes him defend it, and it hands him a hurt of his own."}]},{"who":"Sam","text":"\u201cI only enrolled because Mum said I'd never finish anything. So that's one for her, if I don't.\u201d","cue":"Coupon three. A short laugh aimed at the carpet.","lines":[{"text":"\u201cThen prove her wrong. Or don't, and she wins.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Sam says he does not want to talk about her.","why":"This makes Mum the opponent in a contest. Sam can only win it or lose it, and neither gets the page written."},{"text":"\u201cYou'll finish. I know you will.\u201d","tag":"ok","you":0,"them":0,"outcome":"\u201cThanks,\u201d Sam says, and means it a little.","why":"Warm, and it asks for nothing. A hope from you does not move the method section."},{"text":"\u201cThen it's yours, not hers. What would finishing this one look like, in a single thing you could do this week?\u201d","tag":"best","you":4,"them":3,"outcome":"Sam thinks. \u201cThe method section,\u201d he says. \u201cI could write the method. It's only a page.\u201d","why":"You hand the story back to him and shrink it to one task. A coupon aimed at Mum becomes a page he can write."}]},{"who":"Sam","text":"\u201cRight. I'll drop it. Save everyone the trouble. Tell Ms Pearce thanks for the feedback, I suppose.\u201d","cue":"Cash-in. Putting the sheet in his bag without reading the last line.","lines":[{"text":"\u201cDon't drop it today. Read the last line of the sheet, and tell me what you need from the group to hand in on Tuesday.\u201d","tag":"best","you":4,"them":3,"outcome":"He takes the sheet out again. The last line says: Good use of the bus data. \u201cTheo to check my charts,\u201d he says.","why":"You stop the cash-in on himself and ask for the need. He finds an unread line and a plain request, which is more than the drop gave him."},{"text":"\u201cOkay. You know best.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cYes,\u201d Sam says. \u201cI suppose I do.\u201d","why":"It sounds respectful, but it lets the cash-in stand."},{"text":"\u201cGo on, then. We'll finish it without you, like Lorna did the forms.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Sam says that's fair and leaves.","why":"This turns Lorna's count into a weapon against Sam. His exit is now somebody else's fault."}]}],"payoff":"Tuesday, 7:30pm. Sam does not come. Lorna reads her folder out to Ms Pearce, page by page, and his chair stays empty for the whole talk.","fallout":{"them":"Sam's phone goes to voicemail, and the poster has three names on it."}}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Ms Pearce","text":"\u201cLorna's folder and Sam's 'sorry, hopeless' are doing the same job. What are they, and what would a plain ask have looked like?\u201d","cue":"setting the marker on the whiteboard ledge","options":["They are plain complaints about the project, the forms and the charts. A fair reply answers each one in turn, and the matter ends there for everyone.","They are honest feelings, so the group should accept each one with a nod and carry on making the poster just as planned, with no fuss.","They are trading stamps: feelings saved up instead of said, waiting to be traded in. A plain ask names the feeling and the want as it happens."],"answer":2,"why":"Plain words first: these are grudge coupons. Lorna keeps hers in a folder and Sam keeps his in an apology. The books call them trading stamps, a feeling saved up instead of said, to be traded in later on someone else or on yourself. Lorna could have asked for the charts by a time. Sam could have asked for the totals. Either would have left nothing to read out on Tuesday.","traps":{"0":"Answering each complaint sounds fair, but Lorna and Sam would each hear that the week was dealt with. The folder and the apology would stay, and the cash-in would still come on Tuesday.","1":"Accepting each feeling and carrying on hides the count. The stamps stay in the book, and nobody is asked for anything."},"example":"A parish newsletter team, Friday.<br>Editor: \u201cFine, I'll type up the notices. Someone has to.\u201d<br>Helper: \u201cAre you cross, or just tired?\u201d<br>Editor: \u201cTired. Can you take the notices?\u201d"}]}]},{"setting":"Family","blurb":"Gran says she does not mind Wednesdays, and Grace is late to Sunday lunch for the third week.","opener":{"setting":"Sunday, 12:20pm. Gran's kitchen downstairs at Hawthorn Court. The lamb is resting and the table is laid for five.","lines":[{"who":"Gran","text":"\u201cThe lamb is ready and the table is ready. Everyone is ready except Grace, and I'm not saying a word.\u201d","cue":"looking at the clock above the cooker"},{"who":"Leo","text":"\u201cGran, Mum says lunch is always at one, and it's twenty past.\u201d","cue":"under the table with the tablet, not looking up"}],"ask":"When Gran says she is not counting, and then counts, what do you do with her count?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Some lines are plain complaints, said once. Others are grudge coupons, kept back in a private book for later. Pick the one that is being kept back.","items":[{"type":"pick","who":"Leo","text":"\u201cGran, can I have the red cup? The blue one tastes of soap.\u201d","cue":"holding the blue cup at arm's length","options":["A grudge coupon: kept back, to be cashed in later","A plain complaint: said once, then let go"],"answer":1,"why":"It names one thing, the blue cup, and asks for one thing, the red one. Gran can say yes, and it is over.","traps":{"0":"Reading it as a coupon would treat a child's cup as a charge against Gran. Leo would get a long look, and the red cup would stay in the cupboard."},"example":"A birthday tea, Saturday.<br>Child: \u201cCan I have the green plate? This one's got the crack.\u201d<br>Aunt: \u201cHere you go.\u201d"},{"type":"pick","who":"Mrs Kale","text":"\u201cDon't get up for me, I'll stand. I stood at the last two lunches as well. I'm only saying.\u201d","cue":"one hand on the back of the chair with the cushion","options":["A grudge coupon: kept back, to be cashed in later","A plain complaint: said once, then let go"],"answer":0,"why":"She counts two lunches and asks for nothing. 'I'm only saying' means the standing is being filed, to be brought out the next time someone sits.","traps":{"1":"Taking it as a plain complaint, you would fetch her a chair and feel the matter was closed. The two earlier lunches would stay in her tally, and the chair would not pay them."},"example":"A church tea, Sunday.<br>Helper: \u201cDon't worry, I'll wash the cups. I washed them last week too. I'm only saying.\u201d<br>Nobody takes a cloth, and the cups are hers again."},{"type":"pick","who":"Grace","text":"\u201cGran, please can you ask me before you move Leo's bed? I had a fright last week when I couldn't find it.\u201d","cue":"keeping her voice level, coat still on","options":["A plain complaint: said once, then let go","A grudge coupon: kept back, to be cashed in later"],"answer":0,"why":"She names one event, the moved bed, and asks for one rule, asking first. She is shaken, but nothing is being saved.","traps":{"1":"Hearing a coupon, you would take the bed as the tip of a longer list and wait for the rest. Grace would be left explaining a thing she had already said clearly."},"example":"A shared hallway, Monday.<br>Neighbour: \u201cPlease knock before you borrow the ladder. I couldn't find it on Sunday.\u201d<br>Other: \u201cSorry. I'll knock.\u201d"},{"type":"pick","who":"Gran","text":"\u201cWednesdays are lovely. Lovely. I don't mind at all. I'm just keeping them in my head.\u201d","cue":"folding napkins into sharp triangles","options":["A plain complaint: said once, then let go","A grudge coupon: kept back, to be cashed in later"],"answer":1,"why":"'I don't mind at all' sits next to 'I'm keeping them in my head'. That pair is a coupon: the feeling is denied out loud and stored where only she can see it.","traps":{"0":"Taking the word 'lovely' at face value, you would thank her and ask about pudding. The Wednesdays would stay in her head, and they would come out on Sunday."},"example":"A grandparents' WhatsApp group, Tuesday.<br>Gran: \u201cPicking up the twins is a pleasure. I don't mind the cold. I'm just keeping count of the days.\u201d<br>Nobody replies, and the count goes on."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes. Each line is a chance to keep a coupon or to put it down, and a coupon you never spend is one the other person cannot cash in.","items":[{"type":"scene","title":"Sunday, 12:50pm, Gran's kitchen","setting":"The lamb has gone from resting to cold. Gran has put a plate in the oven for Grace, and a pile of letters sits under the fruit bowl.","meters":{"you":60,"them":50},"beats":[{"who":"Gran","text":"\u201cGrace is late again. Third Sunday. I'm not saying a word. I've put her plate in the oven, that's all.\u201d","cue":"Coupon one. Lifting the oven door, looking at the plate, not at you.","lines":[{"text":"\u201cIt's gone one and you've cooked for five. Are you cross about the lunch going cold, or about Grace?\u201d","tag":"best","you":3,"them":3,"outcome":"Gran shuts the oven door. \u201cThe lunch,\u201d she says. \u201cAnd Grace. A bit of both. Mostly the lunch.\u201d","why":"You name the cold lunch and ask which feeling sits under it. A plain question gives her somewhere to put it, so no coupon is added."},{"text":"\u201cShe'll be here in a minute. Sit down, Gran.\u201d","tag":"ok","you":0,"them":-1,"outcome":"\u201cI'm fine standing,\u201d Gran says, and checks the potatoes again.","why":"Kind, and no answer. It tells her to rest and ignores what she said."}
