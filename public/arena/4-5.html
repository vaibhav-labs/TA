<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traps in the Room · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"4.5","setting":"Home & Flatmates","title":"Traps in the Room","world":4,"worldName":"Conversation Traps","week":4,"weekName":"Conversation Traps","mechanic":"Choice-story","concept":"After this one you can tell which room a trap is played in, and spot the good kind that does good for the people in it.","plainWord":"a room trap","bookTerm":"Good games","bookIdea":"A good game is one whose social contribution outweighs the complexity of its motives, particularly when the player has come to terms with them. It contributes both to the well-being of the other players and to the unfolding of the one who is \u201cit\u201d. Since games rest on ulterior transactions, every game has some element of exploitation.","bookSource":"Games People Play, ch. 12","opener":{"setting":"Friday, 9:05pm. Sam's birthday, apartment 3B. The speaker is on the shoe rack, a paper crown is on the fridge, and the cake has a dent in one corner already.","lines":[{"who":"Clara","text":"\u201cCareful with the cake, he's already spilt mango juice on my shoe. Twice.\u201d","cue":"one foot up on the arm of the sofa, shoe in her hand"},{"who":"Maya","text":"\u201cEat something. Don't say you're full, you haven't touched the rice.\u201d","cue":"a bowl in each hand, not sitting down"}],"ask":"Work out which room each trap belongs to, and what makes the good kind different from the rest."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four rooms: the party, the clinic, the back room and the good kind. Tap the room the line belongs to.","items":[{"type":"pick","who":"Sam","text":"\u201cOops, sorry, sorry! Have one on me, it's the least I can do.\u201d","cue":"a plastic cup in one hand, a napkin in the other","options":["the party","the clinic","the back room"],"answer":0,"why":"A spill with a sorry, and a drink offered as the cure. The room is full of people, and the apology is loud enough to win the forgiveness before anyone asks what the spill cost. That is the party.","traps":{"1":"This would be the clinic if the talk were about a symptom and a plan for treatment. Here nobody is being treated. They are only being offered a drink.","2":"This would be the back room if the talk were about a plan to leave or to hide something. Nobody here is planning anything except another round."},"example":"A colleague's farewell lunch, Friday. The one who knocks over the cake says \u201cOops, sorry, have a slice,\u201d and the table laughs before anyone asks who pays for the tablecloth."},{"type":"pick","who":"Omar","text":"\u201cI can't do the stretch. The back's been bad for years, and you know what I'm like with it.\u201d","cue":"sitting on the edge of the bed, not lying down","options":["the party","the clinic","the good kind"],"answer":1,"why":"A bad back is given as the reason before anything has been tried, and the bed is in a room where a stretch is the work. The excuse is accepted before the stretch even starts. That is the clinic.","traps":{"0":"This would be the party if the back came up as a joke over a drink, and everyone laughed it off. Here it is a reason in a room with a bed and a physio waiting for an answer.","2":"This would be the good kind if the bad back were being turned into something useful for the people around him. Here it is only a reason to skip the work, and nobody is helped by it."},"example":"A driving instructor, Saturday. \u201cMy shoulder won't turn the wheel, so let's just sit here.\u201d He writes \u201cno lesson today\u201d and the car stays in the car park."},{"type":"pick","who":"Clara","text":"\u201cOmar's had his leaving papers in a drawer for two years. Every time they're ready, he finds a bug.\u201d","cue":"laughing, leaning over the cake plate","options":["the back room","the party","the good kind"],"answer":0,"why":"The papers are ready and the door is open, and the frightened Kid in him takes over and finds a bug just before the handover. The room is about getting out, and staying is what actually gets done.","traps":{"1":"This would be the party if the talk were a joke about being late for a drink. The leaving papers are real, and the stopping is what matters.","2":"This would be the good kind if the bug were a gift to the team and the team grew because of it. Here nobody grows, and the papers stay in the drawer."},"example":"A cousin who has had a new-city job offer for a year. Each time the flat is ready to leave, the car needs a service first."},{"type":"pick","who":"Clara","text":"\u201cSit here, and I'll show you the formula. I like it when you can do it yourself. It makes me look good too, I'll admit that.\u201d","cue":"turning the laptop round so you can see the screen","options":["the party","the clinic","the good kind"],"answer":2,"why":"Her reasons are mixed, and she says so. She likes looking clever, and she wants you to be able to do the work yourself. The help is real, and you come away able to do the formula alone, so the good outweighs the motive.","traps":{"0":"This would be the party if the help were a joke about who is best at spreadsheets. Here she is teaching you a real formula, and the lesson is the point.","1":"This would be the clinic if she were treating you as someone who cannot cope. Nobody is being treated. She is handing over the formula."},"example":"A neighbour who shows you the water bill on her phone: \u201cWatch me do it. I like knowing how, and I want you to know it too.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Three rooms. The same shape repeats in each one, so watch who is paying and who is getting the sorry.","items":[{"type":"scene","title":"Friday, 9:05pm, the birthday","setting":"Apartment 3B, the living room, the cake on the coffee table. Sam is holding a glass of mango juice and a napkin. <i>The Heckler, in your head: \u201cLaugh it off, or you're the one who spoils the party.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cOh no, sorry, sorry! My hand just... it's your new shirt. I'll pay for it, I swear.\u201d","cue":"napkin in both hands, mango juice dripping off your sleeve","lines":[{"text":"\u201cIt's the new shirt, Sam. Pay for the dry cleaning on Monday, and say sorry to me, not to the room.\u201d","tag":"best","you":4,"them":3,"outcome":"He goes red, says, \u201cMonday, promise,\u201d and looks at you properly for the first time all evening.","why":"A spill with a sorry is the spill and sorry: the apology is there to win your forgiveness before anyone names the cost. Naming the cost and asking for a date refuses to hand the forgiveness over for free, and it turns the sorry into a promise you can check."},{"text":"\u201cIt's fine, don't worry, it's only a shirt.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"He cheers, and the room claps for the easy-going guest. Nobody mentions the shirt again.","why":"Kind, and it feels good for a second. The spill has been rewarded, and the next one is already on its way."},{"text":"\u201cSam, you ruin everything you touch.\u201d","tag":"game","you":2,"them":-4,"outcome":"He laughs too loudly, the room laughs with him, and you are the one who looks like the spoilsport.","why":"Attacking the spiller makes you the one who spoils the party. The spill and sorry gets the pity, and the blame lands on you."}]},{"who":"Clara","text":"\u201cOh, he's always like this. Last week he knocked coffee over the printer. He's a menace.\u201d","cue":"already cutting the cake, not looking up","lines":[{"text":"\u201cThen he can pay for the printer as well. Sam, what are you paying for?\u201d","tag":"best","you":3,"them":4,"outcome":"Sam's grin slips. \u201cThe printer,\u201d he admits, \u201cand the shirt. I'm on it.\u201d","why":"You keep the cost in the room and ask the spiller to name it. Calling him a menace would be fun, but it would not make him pay."},{"text":"\u201cHe's a clown, what can you do?\u201d","tag":"ok","you":-2,"them":-1,"outcome":"Clara laughs and passes you the first slice, and the shirt stays wet.","why":"You agreed the spill is just who he is. That shrug is what the spill and sorry runs on."},{"text":"\u201cOh, he's only after attention. That's all he ever does.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Sam hears it from the kitchen, and the grin goes. He comes out with the jug and says nothing.","why":"You turned his spill into a bid for attention, and the room now feels sorry for him instead of asking what he owes."}]},{"who":"Sam","text":"\u201cHave one, go on. The cake's mango and the drinks are on me. Have one to say you're not angry.\u201d","cue":"holding out a fresh glass, the paper crown tilted on his head","lines":[{"text":"\u201cI'll take the cake, not the drink. And Monday is still Monday for the shirt.\u201d","tag":"best","you":3,"them":3,"outcome":"\u201cCake it is,\u201d he says, and cuts you the biggest slice. \u201cMonday. Written down.\u201d","why":"You separate the apology from the drink. The drink would settle the account without the shirt being paid, and you refuse that trade."},{"text":"\u201cOkay, one, then.\u201d","tag":"ok","you":-2,"them":2,"outcome":"He cheers, and the room cheers with him. The shirt is forgotten by the second song.","why":"The drink is the apology, and it comes as a treat. It closes the account without the dry cleaning."}]},{"who":"Maya","text":"\u201cPlease, it's his birthday. Let the shirt wait, and let's eat the cake.\u201d","cue":"the rice bowl in her arms, one eye on the spill","lines":[{"text":"\u201cI'm fine with the birthday, Maya. The shirt is on Monday, and he knows which day.\u201d","tag":"best","you":3,"them":4,"outcome":"Maya laughs and says, \u201cFine, but he gets the cake first.\u201d Sam says, \u201cCake first, Monday after.\u201d","why":"You keep the cost where it belongs and let the party go on. Holding a date is not the same as holding a grudge, and the date is the part that gets paid."},{"text":"\u201cFine, Maya, it's your flat.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Maya says, \u201cThank you,\u201d and takes the rice to the kitchen. Nobody mentions the shirt.","why":"You gave the decision to the host. It keeps the peace for tonight and leaves the cost with you."},{"text":"\u201cYou always protect him, don't you? Every single time.\u201d","tag":"game","you":1,"them":-5,"outcome":"Maya goes still. \u201cThat's not fair,\u201d she says, and the room goes back to its phones.","why":"You pointed the spotlight at the protector. The protector's chair is where you put her, and the cost is still unpaid."}]}],"payoff":"Maya and Sam spend the rest of the party on the balcony, and you are left with the cake and the shirt. The dry cleaning is still unpaid, and nobody has said sorry to you properly.","example":"A wedding caterer, Sunday. The waiter who drops the tray says \u201cSorry, sorry, have a sweet,\u201d and the guests applaud before anyone mops the floor."},{"type":"scene","title":"Wednesday, 6:15pm, the physio's room","setting":"A clinic on the second floor near the bus stop. A bed with a paper sheet, a cracked poster of the spine, and a stool by the window. You came to keep Omar company. <i>The Heckler, in your head: \u201cNobody can expect a man with a back like that to try.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Physio","text":"\u201cLie back, Omar, and lift the left leg. Just the one, five times.\u201d","cue":"one hand on the bed, the other on a clipboard","lines":[{"text":"\u201cOmar, your back is bad. What's one thing you can do today, inside the pain?\u201d","tag":"best","you":4,"them":3,"outcome":"Omar looks at the ceiling for a long time, then lifts the left foot a finger's width. \u201cThat much,\u201d he says. \u201cCount it.\u201d","why":"The bad back is a real limit, and it is also the reason he gives for skipping everything. Asking what he can do inside the limit is a way of asking what he expects of himself. It keeps the back real without letting it become a pass."},{"text":"\u201cOkay, the back's bad, let's skip the leg today.\u201d","tag":"ok","you":-2,"them":1,"outcome":"The physio shrugs and writes \u201cdeclined\u201d on the form. Omar looks relieved, and the bed stays empty.","why":"You accepted the excuse as the whole story. The room goes quiet, and the back stays exactly where it was."},{"text":"\u201cYour back's always bad when it suits you, Omar.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Omar gets off the bed, takes his jacket, and says the physio can't help him. The physio says nothing and writes it down.","why":"Calling the excuse a dodge invites a fight, and the fight becomes the reason to leave. A bad back can be challenged, but an insult in this room only gives him a way out."}]},{"who":"Omar","text":"\u201cFine, one lift. But the bus home is going to be murder, so you can carry my bag.\u201d","cue":"sitting up, rubbing the lower back","lines":[{"text":"\u201cThen we write the one lift down, and you tell me how it feels tomorrow.\u201d","tag":"best","you":3,"them":4,"outcome":"Omar nods. \u201cTomorrow, then. Properly.\u201d The physio writes the date on the form.","why":"You count the small step and ask for a real report of the next day, not an argument about the bus. The back gets a plan with a date on it."},{"text":"\u201cSure, I'll carry your bag. Anything for a man with a back like that.\u201d","tag":"ok","you":-2,"them":2,"outcome":"Omar laughs. The physio makes a note: friend to carry the bag.","why":"You accepted the excuse again, with a joke, and you have taken the bag. The back now has a helper, and the helper is you."},{"text":"\u201cYou've said that for three years, Omar. Nobody is stopping you.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Omar stares at you. \u201cWell, I'll see you next week,\u201d the physio says, and the session ends.","why":"You turned the excuse into a case against him. Now the session is about whether you are on his side, and the back drops out of the conversation."}]},{"who":"Physio","text":"\u201cRight, same time next week. What are you going to do between now and then, Omar?\u201d","cue":"writing the next date on the card","lines":[{"text":"\u201cOmar, you name the one thing, and I'll check on it with you next week.\u201d","tag":"best","you":3,"them":4,"outcome":"Omar grins, a little sheepish. \u201cWalk to the shop without the bag. Fine.\u201d","why":"You hand the step back to Omar and offer a check-in, which is support, not a rescue. He sets the step himself, so the back becomes part of his plan."},{"text":"\u201cRest, I suppose, and I'll carry the bag again.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cRest,\u201d Omar says, and the physio's pen stops above the next date.","why":"Rest is a fair answer, but you offered the bag again. The week will be spent on the excuse, not on a step."},{"text":"\u201cYou'll never do it, Omar, so why bother booking?\u201d","tag":"game","you":-4,"them":-6,"outcome":"The physio closes the card without writing the date, and Omar says, \u201cThanks for coming.\u201d","why":"A trap move: you forecast his failure out loud. A prediction is a kind of verdict, and it gives him a reason to skip the next session."}]}],"payoff":"Omar leaves with his jacket on and the form marked declined. The lift never happens, and the back is in exactly the state it was in before you came.","example":"A gym trainer, Tuesday. \u201cMy knee won't bend past this, so let's just stand here.\u201d The trainer nods and books the next session for the same excuse."},{"type":"scene","title":"Thursday, 6:30pm, the glass room","setting":"Halden, by the station, the fourth floor. The payments handover papers are on the table, and Daniel is tapping a pen. <i>The Heckler, in your head: \u201cStay put. The papers can wait, and so can you.\u201d<\/i>","meters":{"you":50,"them":50},"beats":[{"who":"Daniel","text":"\u201cPayments can take you in January, if the migration is clean. The papers are on the table when you're ready.\u201d","cue":"pen tapping once per word","lines":[{"text":"\u201cGood. I'll finish the migration by Wednesday and sign the papers the same day.\u201d","tag":"best","you":4,"them":3,"outcome":"He nods once. \u201cWednesday. Good.\u201d He slides the papers across.","why":"You name the date and the step, and you act on the offer you wanted. Getting out takes a decision on paper, not another month of good intentions."},{"text":"\u201cMaybe. I'll see how the migration goes.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cSee how it goes,\u201d Daniel repeats, and the papers go back in the folder.","why":"A maybe leaves the door half open, and he closes it for you. Nothing is refused, and nothing is decided."},{"text":"\u201cThere's a bug in the import, so January is too soon. Maybe next year.\u201d","tag":"game","you":-2,"them":-5,"outcome":"Daniel says, \u201cThen we'll look at it together, and the papers stay here.\u201d They stay in the drawer, and the bug stays unseen.","why":"You reached for a reason just as the door opened. The release is the thing you asked for, and the bug is the thing that keeps you in the room."}]},{"who":"Clara","text":"\u201cYou've been so good all month. Ready to leave us? Payments will be lucky to get you.\u201d","cue":"grinning, a spare pen in her hand","lines":[{"text":"\u201cYes, I'm ready. I'll hand you the notes on Monday, so you're not stuck with me.\u201d","tag":"best","you":3,"them":4,"outcome":"Clara laughs. \u201cNotes on Monday. You'd better mean it.\u201d","why":"You say yes and name the handover, so the leaving has a date and a shape. The release is in your hands, not in the bug's."},{"text":"\u201cAlmost. Ask me again next week.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"\u201cNext week,\u201d Clara says, and writes nothing on her pad.","why":"A delay with no date. The door stays ajar, and the week goes by in the same chair."},{"text":"\u201cNo. Nobody here will ever let me leave, will they?\u201d","tag":"game","you":-4,"them":-6,"outcome":"Clara looks at you, then at Daniel, and says nothing. The papers stay in the folder.","why":"You turned the offer into a jail and made the others the guards. The scene ends with the papers still in the folder."}]},{"who":"Daniel","text":"\u201cShow me the bug, then. If it's real, we'll fix it before the handover.\u201d","cue":"turning the laptop round","lines":[{"text":"\u201cThere's one small bug, and it's logged. I'll fix it by Wednesday, and do the handover in January, not before.\u201d","tag":"best","you":4,"them":4,"outcome":"Daniel turns the laptop back. \u201cWednesday, then. Put it in writing.\u201d","why":"You name a real bug and a real date, and put the handover after both. The fix and the release are separate jobs, and you have named both."},{"text":"\u201cI'll find it. Maybe it's in the old code.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cFind it by Wednesday,\u201d he says. The bug is now a search with no end.","why":"Vague work keeps the release on hold. Nobody can say when the papers will move, including you."},{"text":"\u201cYou want me to find it for you, don't you? Like always.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Daniel closes the laptop. \u201cThen January's on hold,\u201d he says, and the papers go back in the folder.","why":"You handed him the job and ended the scene with a jab. The cost falls on the release, and the sting lands on the one who wanted to leave."}]}],"payoff":"The papers go back in the folder, and the January move waits for another year. The bug is still in the import, and so are you.","example":"A cousin planning a move to a new city, Sunday. She has the flat sorted and the bus ticket booked, then tells the family about a leaking tap that must be fixed first. The move waits another six months."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions. Pick the explanation that fits what happened in the room.","items":[{"type":"pick","who":"Clara","text":"Clara spends an hour on the formula and says she likes it when you can do it yourself, because it makes her look good too. Her reasons are mixed. What makes this the good kind?","cue":"the laptop open between you","options":["Clara has no reasons of her own, so the help is pure.","The help is real and you can now do the formula yourself, even though her reasons are mixed.","Nobody can see her reasons, so the help counts as good."],"answer":1,"why":"Every trap has some hidden motive underneath. One earns the name good when what it gives the other people outweighs the tangle of motives, especially when the player has owned up to them, as Clara has. She helps you, and you leave able to do the work yourself.","traps":{"0":"The book says every trap has some motive of its own, so pure help is not the test. Clara has reasons, and she names them out loud.","2":"This gets it the wrong way round. Clara's reasons are out in the open, and that is part of why the help counts as good. It leaves you able to do the work, and the motive has been owned."},"example":"A cousin at the tax desk, Sunday. \u201cSit here, I'll do the first page. I like being the clever one, but you'll finish the rest yourself.\u201d"},{"type":"pick","who":"Clara","text":"Omar has had his leaving papers ready for two years, and he finds a bug before every handover. Why does the bug keep him in the room?","cue":"the papers still in the drawer","options":["Because the bug is always real, so he has no choice but to stay.","Because the Kid in him dreads the outside, so it finds a reason to stay right before the door.","Because the others on the team will not let him leave."],"answer":1,"why":"The room is about getting out, and the frightened part of him can sabotage the release just before it happens. The bug is the excuse, and the dread is the reason. Fixing bugs will never end it, because the pattern needs the dread itself to be noticed.","traps":{"0":"A real bug can be fixed in a week, yet the papers stay in the drawer for two years. The bug is the excuse, and the reason is somewhere else.","2":"The team would be glad to see him go, and would help with the handover. Nobody is holding him back, so the bug is coming from inside."},"example":"A friend who keeps promising to start the course in June. Each time the form is ready, the laptop needs a software update first."}]}],"debrief":{"nadia":"Four rooms, and the same shape in each. Someone gets the sorry, the sigh, the bug or the favour, and the room lets them keep it. Ask who is paying in each room, and who gets the good of it.","bookTerm":"Good games","bookNote":"The books call these good games: a good game is one whose social contribution outweighs the complexity of its motives, particularly when the player has come to terms with them, so it helps the other players and the one who is \u201cit\u201d. The other rooms are party games (chapter 8), underworld games (chapter 10) and consulting-room games (chapter 11)."},"reflection":{"prompt":"Which room did you spend the most time in this week, and what would the good kind of trap look like in that room?"},"next":"4.6","baseStory":{"setting":"Home & Flatmates","blurb":"Sam's birthday, Omar's bad back and a job move that never quite happens."},"moreStories":[{"setting":"Friends & Community","blurb":"Ruby's birthday at the Corner Table, Joseph's knee and a turn to lead Nadia's group.","opener":{"setting":"Saturday, 7:40pm. The Corner Table, the back booth. A birthday banner is taped over the napkin dispenser, and the five-a-side kitty tin sits open between the sugar and the menus.","lines":[{"who":"Ruby","text":"\u201cNobody look in the tin! I've lost Thursday's pitch booking, so you didn't see that.\u201d","cue":"sliding a fan of receipts under the menu"},{"who":"Joseph","text":"\u201cCount me out of Thursday anyway. The knee, you know what it's like.\u201d","cue":"knee up on the spare chair"},{"who":"Nadia","text":"\u201cYour name goes up next to the third Sunday. If the sheet is ready.\u201d","cue":"pencil behind her ear, rota in hand"}],"ask":"Work out which room each trap belongs to, and what makes the good kind different from the rest."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four rooms: the party, the clinic, the back room and the good kind. Tap the room the line belongs to.","items":[{"type":"pick","who":"Ruby","text":"\u201cOh no, sorry, sorry! The pitch booking lapsed, I'm useless. Drinks are on me, everyone, it's the least I can do.\u201d","cue":"purse in one hand, the kitty tin in the other","options":["the clinic","the party","the back room"],"answer":1,"why":"A lapse and a loud sorry, with a round of drinks as the cure. The apology fills the booth and wins the forgiveness before anyone asks who pays the pitch fee. That is the party.","traps":{"0":"This would be the clinic if the talk were about a symptom and a plan to treat it. Nobody here is being treated. They are being bought a drink.","2":"This would be the back room if the talk were about a plan to leave or to hide something. Ruby is doing the opposite, and doing it out loud."},"example":"A neighbour at the street party, Saturday. She backs the van into the bunting and says, \u201cSorry, sorry, sausage rolls on me,\u201d and the whole road cheers before anyone looks at the van."},{"type":"pick","who":"Joseph","text":"\u201cI can't do the sprint drills. It's the knee, it's been going for years, and you know what I'm like with it.\u201d","cue":"knee up on the spare chair, not looking at the pitch map","options":["the clinic","the good kind","the party"],"answer":0,"why":"A bad knee is offered as the reason before anything has been tried. The talk is about a limit and what to do about it, and the excuse is accepted before the drill even starts. That is the clinic.","traps":{"1":"This would be the good kind if the knee were being turned into something useful for the people around him. Here it is only a reason to skip the work.","2":"This would be the party if the knee came up as a joke over a drink and everyone laughed. Here it is a reason, and a coach is waiting for an answer."},"example":"A choir member, Wednesday. \u201cMy throat won't do the high part, so I'll just mouth it.\u201d The conductor writes her name down for the low row, and the high part stays unsung."},{"type":"pick","who":"Nadia","text":"\u201cHannah's had the lead sheet written since August. Every Sunday before her turn, the urn needs descaling.\u201d","cue":"laughing, pinning the rota to the wall","options":["the party","the clinic","the back room"],"answer":2,"why":"The sheet is ready and the turn is hers, and a frightened part of her finds a job just before the handover. The room is about getting out in front, and the urn is the way back to the chairs. That is the back room.","traps":{"0":"This would be the party if the urn were a joke about a late start. The sheet is real and the stopping is what matters.","1":"This would be the clinic if she were giving an ache as the reason she cannot. There is no ache here, only a chore found at the right moment."},"example":"A cousin who has had the driving test booked for a year. Each time the date nears, the car needs a service first."},{"type":"pick","who":"Ruby","text":"\u201cSit here and I'll show you the booking sheet. I like being the one who knows how it works, I'll own that. But I want you to book the pitch yourself next time.\u201d","cue":"turning the folder round so you can read it","options":["the party","the good kind","the clinic"],"answer":1,"why":"Her reasons are mixed, and she says so. She likes being the one who knows, and she wants you able to do it alone. The help is real and you leave able to book the pitch, so the good outweighs the motive.","traps":{"0":"This would be the party if the help were a joke about who is best at paperwork. Ruby is teaching you a real sheet, and the lesson is the point.","2":"This would be the clinic if she were treating you as someone who cannot cope. Nobody is being treated. She is handing over the sheet."},"example":"A neighbour with the water bill on her phone: \u201cWatch me do it. I like knowing how, and I want you to know too.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Three rooms. The same shape repeats in each one, so watch who is paying and who is getting the sorry.","items":[{"type":"scene","title":"Saturday, 8:10pm, the back booth","setting":"The Corner Table, the kitty tin open, a round already ordered, and the pitch fee two weeks overdue. <i>The Heckler, in your head: \u201cLet it go. It's her birthday, and nobody likes the one who counts.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Ruby","text":"\u201cSorry, sorry, sorry! The booking lapsed, I forgot the fee, I'm a disaster. Drinks are on me, all of you.\u201d","cue":"arm in the air for the waitress, the tin snapped shut","lines":[{"text":"\u201cThe fee was two weeks overdue, Ruby. Put it in the tin by Wednesday, and tell me when it's done.\u201d","tag":"best","you":4,"them":3,"outcome":"She stops mid-wave. \u201cWednesday,\u201d she says. \u201cI'll text you the minute it's paid.\u201d","why":"A lapse with a loud sorry is there to win the forgiveness before the cost is named. Naming the cost and asking for a date refuses to hand the forgiveness over for free, and gives you something you can check."},{"text":"\u201cDon't worry, we all forget things.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"The booth cheers and Ruby sits down relieved. Nobody mentions the fee again.","why":"Kind, and it feels good for a second. The lapse has been rewarded and the next one is already on its way."},{"text":"\u201cYou always do this. Sorry, then a round, then nothing changes.\u201d","tag":"game","you":2,"them":-4,"outcome":"She laughs too loudly and the booth laughs with her. You are the one who looks like the spoilsport.","why":"Attacking the one who lapsed makes you the person spoiling the party. The sorry gets the pity and the blame lands on you."}]},{"who":"Joseph","text":"\u201cShe's always like this. Remember the goal nets? Gone for a month. A menace.\u201d","cue":"stirring a coffee he hasn't sugared","lines":[{"text":"\u201cThen she can sort the nets as well. Ruby, what do you owe the team right now?\u201d","tag":"best","you":3,"them":4,"outcome":"Ruby's grin slips. \u201cThe fee,\u201d she admits, \u201cand the nets. I'm on it.\u201d","why":"You keep the cost in the booth and ask the person who lapsed to name it. Calling her a menace would be fun, and it would not get anything paid."},{"text":"\u201cShe's a clown, what can you do?\u201d","tag":"ok","you":-2,"them":-1,"outcome":"Joseph laughs and passes you the sugar. The fee stays where it was.","why":"You agreed that the lapse is just who she is. That shrug is what the sorry runs on."},{"text":"\u201cShe only does it for the attention, Joseph.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Ruby hears it from the counter and the grin goes. She sits down and says nothing.","why":"You turned her lapse into a bid for attention, and the booth now feels sorry for her instead of asking what she owes."}]},{"who":"Ruby","text":"\u201cHave one, go on, anything off the board. Say you're not cross with me.\u201d","cue":"holding out the menu, the paper crown slipping","lines":[{"text":"\u201cI'll take the cake, not the round. And Wednesday is still Wednesday for the fee.\u201d","tag":"best","you":3,"them":3,"outcome":"\u201cCake it is,\u201d she says, and writes WEDNESDAY on her hand in biro.","why":"You separate the apology from the treat. The treat would close the account without the fee being paid, and you refuse the trade."},{"text":"\u201cOkay, one hot chocolate, then.\u201d","tag":"ok","you":-2,"them":2,"outcome":"She cheers and the booth cheers with her. The fee is forgotten by the second song.","why":"The treat is the apology, and it comes as a gift. It closes the account without the money."}]},{"who":"Peter","text":"\u201cRule of the room: no talking money at a birthday. We can do it on Thursday.\u201d","cue":"tapping the table, one finger per word","lines":[{"text":"\u201cBirthday first, Peter. Wednesday is still the fee, and Ruby knows the day.\u201d","tag":"best","you":3,"them":4,"outcome":"Peter shrugs. \u201cFine, but it goes in the notes.\u201d Ruby says, \u201cCake first, Wednesday after.\u201d","why":"You keep the cost where it belongs and let the party go on. Holding a date is not holding a grudge, and the date is the part that gets paid."},{"text":"\u201cFine, Peter, rules are rules.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Peter nods, satisfied, and the tin goes back in the bag.","why":"You gave the decision to the rule-maker. It keeps the peace tonight and leaves the cost with the team."},{"text":"\u201cYou never put a penny in the tin yourself, do you?\u201d","tag":"game","you":1,"them":-5,"outcome":"Peter goes stiff. \u201cThat is not the point,\u201d he says, and the booth goes back to its phones.","why":"You pointed the spotlight at the rule-maker. He is the one in the chair now, and the fee is still unpaid."}]}],"payoff":"Ruby pays for the round out of the kitty tin and the pitch stays lapsed. Thursday's match is off, and everyone has had a drink on her.","example":"A caterer at a wedding, Sunday. The waiter who drops the tray says \u201cSorry, sorry, have a sweet,\u201d and the guests applaud before anyone mops the floor."},{"type":"scene","title":"Thursday, 6:30pm, the touchline","setting":"A damp artificial pitch off the high street, cones in a line, a whistle on a lanyard. Ruby paid the fee after all. You came to keep Joseph company. <i>The Heckler, in your head: \u201cNobody can expect a man with a knee like that to try.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Theo","text":"\u201cJoseph, jog to the far cone and back. Once, slowly. That's the whole warm-up.\u201d","cue":"one hand on the cone, the other on a clipboard","lines":[{"text":"\u201cJoseph, the knee is bad. What's one thing you can do today, inside it?\u201d","tag":"best","you":4,"them":3,"outcome":"Joseph looks at the cone for a long time, then takes three steps. \u201cThat much,\u201d he says. \u201cCount it.\u201d","why":"The knee is a real limit, and it is also the reason he gives for skipping everything. Asking what he can do inside it is a way of asking what he expects of himself."},{"text":"\u201cOkay, the knee's bad, skip the jog today.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Theo shrugs and writes \u201csat out\u201d on the sheet. Joseph looks relieved and the cone stays where it is.","why":"You accepted the excuse as the whole story. The knee stays exactly where it was."},{"text":"\u201cYour knee's always bad when there's a drill, Joseph.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Joseph sits down on the bench and says Theo cannot help him. Theo writes it down.","why":"Calling the excuse a dodge invites a fight, and the fight becomes the reason to leave. An insult here only hands him a way out."}]},{"who":"Joseph","text":"\u201cFine, to the cone. But the walk to the bus is going to be murder, so you can carry my boots.\u201d","cue":"sitting up, rubbing above the kneecap","lines":[{"text":"\u201cWe'll count the cone. You tell me on Friday how the knee felt.\u201d","tag":"best","you":3,"them":4,"outcome":"Joseph nods. \u201cFriday, then. Properly.\u201d Theo writes the date on the sheet.","why":"You count the small step and ask for a real report the next day. The knee gets a plan with a date on it."},{"text":"\u201cSure, I'll carry your boots. Anything for that knee.\u201d","tag":"ok","you":-2,"them":2,"outcome":"Joseph laughs. Theo makes a note: friend to carry the boots.","why":"You accepted the excuse again with a joke and picked up the boots. The knee now has a helper, and the helper is you."},{"text":"\u201cYou've said that for three seasons. Nobody is stopping you.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Joseph stares at you. \u201cRight,\u201d Theo says, and the session ends.","why":"You turned the excuse into a case against him. Now the talk is about whether you are on his side, and the knee drops out."}]},{"who":"Theo","text":"\u201cSame time next Thursday. What are you going to do before then, Joseph?\u201d","cue":"writing the date on the back of his hand","lines":[{"text":"\u201cJoseph, you name the one thing, and I'll ask about it on Friday.\u201d","tag":"best","you":3,"them":4,"outcome":"Joseph grins, a little sheepish. \u201cWalk to the shop without the boots. Fine.\u201d","why":"You hand the step back to Joseph and offer a check-in. That is support, not a rescue, and he sets the step himself."},{"text":"\u201cRest, I suppose, and I'll carry the boots again.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cRest,\u201d Joseph says, and Theo's pen stops above the date.","why":"Rest is a fair answer, but you offered the boots again. The week will go on the excuse, not on a step."},{"text":"\u201cYou'll never do it, so why put your name on the sheet?\u201d","tag":"game","you":-4,"them":-6,"outcome":"Theo closes the clipboard without writing the date. Joseph says, \u201cThanks for coming.\u201d","why":"You forecast his failure out loud. A prediction is a verdict, and it gives him a reason to skip next week."}]}],"payoff":"Joseph leaves with his jacket on and the sheet marked sat out. The far cone is never reached, and the knee is exactly where it was before you came.","example":"A gym trainer, Tuesday. \u201cMy shoulder won't go above here, so let's just stand.\u201d The trainer nods and books the same session for next week."},{"type":"scene","title":"Sunday, 4:45pm, the back of the cafe","setting":"Chairs in a ring, the urn hissing, the lead sheet on the wall. Nadia has your name pencilled next to the third Sunday. <i>The Heckler, in your head: \u201cWait until everything is ready. Nobody wants a half-prepared leader.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Nadia","text":"\u201cYou can lead the third Sunday, if the sheet is ready. Your name goes on the wall when you are.\u201d","cue":"pencil in one hand, rubber in the other","lines":[{"text":"\u201cGood. I'll finish the sheet by Wednesday and put my name up the same day.\u201d","tag":"best","you":4,"them":3,"outcome":"She nods once. \u201cWednesday. Good.\u201d She hands you the pencil.","why":"You name the date and the step, and you act on the offer you wanted. Taking the turn needs a decision on paper, not another month of good intentions."},{"text":"\u201cMaybe. I'll see how the sheet goes.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cSee how it goes,\u201d Nadia says, and rubs out the pencil.","why":"A maybe leaves the door half open and she closes it for you. Nothing is refused and nothing is decided."},{"text":"\u201cThe urn leaks, so the third is too soon. Perhaps the month after.\u201d","tag":"game","you":-2,"them":-5,"outcome":"Nadia says, \u201cThen we'll look at the urn together,\u201d and the sheet goes back in the folder.","why":"You reached for a reason just as the door opened. The turn is the thing you wanted, and the urn is the thing that keeps you in the chair."}]},{"who":"Hannah","text":"\u201cYou've been so good with the cards all month. Ready to lead? We'd all be lucky to have you.\u201d","cue":"grinning, a spare chair in her hands","lines":[{"text":"\u201cYes, I'm ready. I'll give you the card pack on Monday, so you can see it first.\u201d","tag":"best","you":3,"them":4,"outcome":"Hannah laughs. \u201cMonday. You'd better mean it.\u201d","why":"You say yes and name the handover, so the turn has a date and a shape. It is in your hands, and not the urn's."},{"text":"\u201cAlmost. Ask me again next week.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"\u201cNext week,\u201d Hannah says, and writes nothing down.","why":"A delay with no date. The door stays ajar and the week goes by in the same chair."},{"text":"\u201cNo. You all want me up there so you can watch me wobble.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Hannah looks at Nadia, then at the floor. The sheet stays in the folder.","why":"You turned the invitation into a trap and made the group the audience. The scene ends with the sheet still in the folder."}]},{"who":"Nadia","text":"\u201cShow me the leak, then. If it's real, we'll fix it before the third.\u201d","cue":"tipping the urn to look underneath","lines":[{"text":"\u201cOne small drip, and it's on the list. I'll fix it by Wednesday and lead on the third, not before.\u201d","tag":"best","you":4,"them":4,"outcome":"Nadia puts the urn down. \u201cWednesday, then. Write it on the sheet.\u201d","why":"You name a real drip and a real date, and put the turn after both. The fix and the turn are separate jobs, and you have named both."},{"text":"\u201cI'll find it. Maybe it's the tap.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cFind it by Wednesday,\u201d she says. The drip is now a search with no end.","why":"Vague work keeps the turn on hold. Nobody can say when the sheet will move, including you."},{"text":"\u201cYou want me to fix it for you, don't you? Like always.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Nadia sets the urn down. \u201cThen the third is on hold,\u201d she says, and the sheet goes back in the folder.","why":"You handed her the job and ended with a jab. The cost falls on the turn, and the sting lands on you."}]}],"payoff":"The sheet goes back in the folder and the third Sunday goes to Peter. The urn still drips and your name is not on the wall.","example":"A cousin planning a move to a new city, Sunday. She has the flat sorted and the bus ticket booked, then reports a leaking tap that must be fixed first. The move waits another six months."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions. Pick the explanation that fits what happened in the room.","items":[{"type":"pick","who":"Ruby","text":"Ruby sits you down with the booking sheet and says she likes being the one who knows how it works. Her reasons are mixed. What makes this the good kind?","cue":"the folder open between you","options":["Ruby keeps her reasons to herself, so nobody can hold them against her.","Ruby has no reasons of her own, so the help is pure.","You can now book the pitch alone, and Ruby owned up to what she gets from it."],"answer":2,"why":"Every trap has some hidden motive underneath. One earns the name good when what it gives the other people outweighs the tangle of motives, especially when the player has owned up to them, as Ruby has. You leave able to do the work yourself.","traps":{"0":"Hidden reasons are not the test. Ruby said hers out loud, and that is part of why the help counts as good.","1":"Every trap has some motive of its own, so pure help is not the test. Ruby has reasons and she names them."},"example":"A cousin at the tax desk, Sunday. \u201cSit here, I'll do the first page. I like being the clever one, but you'll finish the rest yourself.\u201d"},{"type":"pick","who":"Nadia","text":"You have had the lead sheet ready for weeks, and there is a fault to find every time the third Sunday comes round. Why does the fault keep you out of the chair?","cue":"the sheet still on the wall","options":["Because the frightened part of you finds a reason to stay put just as the door opens.","Because the fault is always real, so you have no choice but to wait.","Because the group would rather someone else led."],"answer":0,"why":"The room is about stepping up, and the frightened part can undo the turn just before it happens. The urn is the excuse, and the dread is the reason. Fixing urns will never end it, because the dread itself has to be noticed.","traps":{"1":"A real drip can be fixed in a week, yet the sheet stays on the wall for months. The drip is the excuse, and the reason is somewhere else.","2":"The group would be glad to have you lead, and Nadia has put your name up. Nobody is keeping you in the chair, so the stall comes from inside."},"example":"A friend who keeps promising to start the evening course in June. Each time the form is ready, the laptop needs an update first."}]}]},{"setting":"Relationships","blurb":"Omar and Clara's second date, a text left unanswered, and a friend who says too much.","opener":{"setting":"Friday, 8:20pm. The bowling alley behind the station, lane six. The shoe spray smells of pear drops and the scoreboard still says CLARA over OMAR.","lines":[{"who":"Clara","text":"\u201cI booked the lane, I brought the pens, and I've done the scores twice. Nobody has to do a thing.\u201d","cue":"holding the score sheet like a tray"},{"who":"Omar","text":"\u201cLane six is ours until ten. Nobody's rushing anything.\u201d","cue":"tying his second shoe, steady"},{"who":"Ella","text":"\u201cClara, you've deleted that reply to him four times since Wednesday. I watched you.\u201d","cue":"mouth full of nachos, loud enough for the next lane"}],"ask":"Work out which room each trap belongs to, and what makes the good kind different from the rest."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four rooms: the party, the clinic, the back room and the good kind. Tap the room the line belongs to.","items":[{"type":"pick","who":"Ella","text":"\u201cOh no, sorry, sorry! Your coat! I'll get you another drink, and the next round's on me, it's the least I can do.\u201d","cue":"pitcher tilted, a puddle spreading under the coat bench","options":["the party","the clinic","the good kind"],"answer":0,"why":"A spill with a loud sorry and a free round offered as the cure. The apology is big enough to win the forgiveness before anyone asks what the coat will cost. That is the party.","traps":{"1":"This would be the clinic if the talk were about a symptom and a plan to treat it. Nobody is being treated. They are being offered a free round.","2":"This would be the good kind if the spill were turned into something useful for the people around. Here it is only a sorry that buys a pass."},"example":"A guest at a dinner, Saturday. She tips the wine over a book and says, \u201cSorry, sorry, pudding's on me,\u201d and the table laughs before the book is checked."},{"type":"pick","who":"Clara","text":"\u201cI can't just text back. I'm hopeless with messages, you know what I'm like with them.\u201d","cue":"thumbs over the phone, not typing","options":["the party","the good kind","the clinic"],"answer":2,"why":"A limit is given as the reason before anything has been tried. The talk is about what she cannot do, and a friend is waiting for an answer. The excuse is accepted before a single word is typed. That is the clinic.","traps":{"0":"This would be the party if the messages were a joke over a drink and everyone laughed it off. Here it is a reason in a quiet corner with an unanswered text waiting.","1":"This would be the good kind if her trouble with messages were being turned into something that helped the people around her. Here it only keeps the phone face-down."},"example":"A lodger, Monday. \u201cI can't ring the landlord about the tap, I'm awful on the phone.\u201d The tap drips for another month."},{"type":"pick","who":"Ella","text":"\u201cShe's had the reply written since Wednesday. Every time it's ready to go, she finds a typo.\u201d","cue":"leaning round the scoreboard, loud enough for the next lane","options":["the party","the back room","the good kind"],"answer":1,"why":"The reply is ready and the person waiting is real, and a frightened part of her finds a flaw just before the send. The room is about stepping out, and the typo is the way back to the drafts. That is the back room.","traps":{"0":"This would be the party if the typo were a joke about a late reply. The reply is real and the stopping is what matters.","2":"This would be the good kind if the typo were a gift to the person waiting. Here nobody gains, and the reply stays unsent."},"example":"A brother who has had the new-job email drafted since spring. Every time he opens it, the signature needs a tweak."},{"type":"pick","who":"Omar","text":"\u201cAsk me straight, Clara. I like knowing where I stand, I'll own that, and it saves us both a week of guessing.\u201d","cue":"setting the ball down, steady","options":["the good kind","the clinic","the party"],"answer":0,"why":"His reasons are mixed, and he says so. He likes knowing where he stands, and asking plainly saves two people a week. The help is real and she can use it, so the good outweighs the motive.","traps":{"1":"This would be the clinic if he were treating her as someone who cannot cope. Nobody is being treated. He is asking for a plain question.","2":"This would be the party if the line were a joke over a drink. Here he means it, and it is a request."},"example":"A flatmate, Sunday. \u201cJust tell me if the rota doesn't suit. I like knowing, I'll admit that, and it saves us both a sulk.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Three rooms. The same shape repeats in each one, so watch who is paying and who is getting the sorry.","items":[{"type":"scene","title":"Friday, 8:40pm, lane six","setting":"Ella's pitcher has gone over your coat on the bench. Clara is still holding the score sheet and Omar is reading the menu. <i>The Heckler, in your head: \u201cLaugh it off. Nobody likes the one who counts coats.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Ella","text":"\u201cSorry, sorry, sorry! Your coat! I'll pay for the cleaning, I swear, and the next round's on me.\u201d","cue":"wringing the sleeve out over the lane","lines":[{"text":"\u201cIt's the lining, Ella. Pay for the cleaning on Monday, and say sorry to me, not to the lane.\u201d","tag":"best","you":4,"them":3,"outcome":"She goes pink. \u201cMonday, I promise,\u201d she says, and looks at you properly for the first time all night.","why":"A spill with a loud sorry is there to win the forgiveness before the cost is named. Naming it and asking for a day refuses to hand over forgiveness for free, and turns the sorry into a promise you can check."},{"text":"\u201cIt's fine, it's only a coat.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"She cheers, and the lane claps for the easy-going guest. The coat stays damp.","why":"Kind, and it feels good for a second. The spill has been rewarded and the next one is on its way."},{"text":"\u201cElla, you wreck every night out you come to.\u201d","tag":"game","you":2,"them":-4,"outcome":"She laughs too loudly and the lane laughs with her. You are the one who looks like the spoilsport.","why":"Attacking the spiller makes you the one who spoils the night. The sorry gets the pity and the blame lands on you."}]},{"who":"Clara","text":"\u201cShe's always like this. Last month she dropped a plate at my mum's. A menace.\u201d","cue":"wiping the bench with a score sheet","lines":[{"text":"\u201cThen she can pay for the plate too. Ella, what do you owe?\u201d","tag":"best","you":3,"them":4,"outcome":"Ella's grin slips. \u201cThe plate,\u201d she admits, \u201cand the coat. I'm on it.\u201d","why":"You keep the cost in the room and ask the person who spilled to name it. Calling her a menace would be fun, and it would not get anything paid."},{"text":"\u201cShe's a clown, what can you do?\u201d","tag":"ok","you":-2,"them":-1,"outcome":"Clara laughs and hands you a napkin. The coat stays wet.","why":"You agreed that the spill is just who she is. That shrug is what the sorry runs on."},{"text":"\u201cShe's only after attention, Clara. She always is.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Ella hears it from the shoe counter and the grin goes. She comes back with nachos and says nothing.","why":"You turned her spill into a bid for attention, and the lane now feels sorry for her instead of asking what she owes."}]},{"who":"Ella","text":"\u201cHave a nacho, go on, and the next frame's on me. Say you're not angry.\u201d","cue":"holding out the tray, cheese cooling","lines":[{"text":"\u201cI'll sages.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Clara breathes out. The phone stays face-down and the latte stays cold.","why":"You accepted the excuse as the whole story. The text stays exactly where it was."},{"text":"\u201cYou answer client emails in a minute flat, Clara. This is a dodge.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Clara gets up, takes her bag, and says she should go. The napkin stays where it is.","why":"Calling the excuse a dodge invites a fight, and the fight becomes the reason to leave. A fair point said as an accusation only gives her a way out."}]},{"who":"Clara","text":"\u201cFine, one line. But I'll feel sick until he answers, so you hold my phone.\u201d","cue":"passing the phone across, screen up","lines":[{"text":"\u201cWe write the line now, and you tell me tomorrow what he said.\u201d","tag":"best","you":3,"them":4,"outcome":"Clara nods. \u201cTomorrow, then. Properly.\u201d She types the first word.","why":"You count the small step and ask for a real report the next day. The text gets a plan with a time on it."},{"text":"\u201cSure, I'll hold the phone. Anything for someone this bad at messages.\u201d","tag":"ok","you":-2,"them":2,"outcome":"Clara laughs. The phone goes into your pocket with the line unsent.","why":"You accepted the excuse again with a joke and took the phone. The text now has a helper, and the helper is you."},{"text":"\u201cYou've said that since March. Nobody is stopping you.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Clara stares at you. \u201cRight,\u201d she says, and takes the phone back.","why":"You turned the excuse into a case against her. Now the talk is about whether you are on her side, and the text drops out."}]},{"who":"Ella","text":"\u201cSame time tomorrow? What are you going to do before then, Clara?\u201d","cue":"calling from the counter, a tray balanced on one hand","lines":[{"text":"\u201cClara, you name the one thing, and I'll ask you tomorrow how it went.\u201d","tag":"best",
