<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Replay the Call · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"3.4","setting":"Home & Flatmates","title":"Replay the Call","world":3,"worldName":"Back and Forth","week":3,"weekName":"Back and Forth","mechanic":"Replay","concept":"After this one you can replay a call that went wrong and say which line pinned a name tag on each side.","plainWord":"a name tag","bookTerm":"Crossed transaction, Types I and II","bookIdea":"A plain Adult line can be crossed in two classic ways. In Type I the answer comes from the Child and treats the speaker as a parent figure, the classical transference reaction. In Type II the answer comes from the Parent and treats the speaker as a child, the counter-transference pattern.","bookSource":"Games People Play, ch. 2; Transactional Analysis in Psychotherapy, ch. 9","opener":{"setting":"Sunday, 21:30, apartment 3B, the balcony. The bus stop is loud below, and the phone is on your knee.","lines":[{"who":"Mum","text":"\u201cLove, you never call. I sit by the phone every Sunday like a fool.\u201d","cue":"her voice thin, the ledger open on her lap"},{"who":"Mum","text":"\u201cAfter everything I did for you, this is how you treat your Mum?\u201d","cue":"already sure of the answer"}],"ask":"Replay this call. Can you find the name tag Mum pinned on you, and the line that put it there?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> you replay a call that went wrong. Some lines are a person answering you as if you were someone from the past, and that is a name tag. Tap the name tag that fits the line.","items":[{"type":"pick","who":"Mum","text":"\u201cSon, you're always too busy for your Mum. Just like when you were small and forgot your lunch box.\u201d","cue":"bright, a little hurt, talking about the lunch box as if it were last week","options":["Mum talks to you as the grown-up you are now","Mum talks to you as the boy she packed lunches for","Mum talks to you as Dad, who always had a reason"],"answer":1,"why":"She has put a lunch box in the call, so she is answering a boy who has not grown up yet. The sentence is aimed at you, but the name tag is an old one.","traps":{"0":"A grown-up would hear your week and ask about it. Mum is asking about a lunch box, so she is not talking to the person on the balcony.","2":"Dad would say \u201cwe're fine\u201d and hang up. Nothing in this line is about money, reasons or silence, so it is not his voice."},"example":"A cousin at a wedding, an aunt who says: \u201cYou still can't carry a tray without dropping it, can you, Julia?\u201d You are thirty and the tray is full of pastries.<br>She is talking to a child who dropped a tray once, and the tray is not the point."},{"type":"pick","who":"Mum","text":"\u201cAfter everything I did for you, this is how you treat your Mum?\u201d","cue":"the ledger voice, every item already counted","options":["A plain question about your week","A bill that you are meant to pay back","A joke about your cooking"],"answer":1,"why":"The line is a list of what she gave, with the price still attached. It keeps score, and it expects you to be the one who owes. That is the Boss talking through her, and the Kid in you is what it is aimed at.","traps":{"0":"A plain question would ask what happened this week and wait for the answer. This line is totalling instead.","2":"A joke would lighten the call, but Mum is not joking, and she would hear it as a brush-off."},"example":"A school parents' group chat, a mother who writes: \u201cAfter all the lifts I've given you, you can't even reply to my message?\u201d<br>The lifts are being counted, and the reply is what she wants paid."},{"type":"pick","who":"You, to Mum","text":"\u201cYes, Mum, I'm a terrible son. You're right, I'll call more.\u201d","cue":"you say it fast, to end the call before it gets worse","options":["A Pilot line, true and checkable","A Kid line that folds to keep the peace","A Boss line that tells her off"],"answer":1,"why":"You agreed to a verdict before you had looked at it. The Kid folded, and the quick yes is how a name tag gets pinned on you too, because you have taken the lunch box back.","traps":{"0":"A Pilot line would check the claim: \u201cI called on Thursday and on Sunday. Tell me what you need from the week.\u201d That is true and can be answered.","2":"A Boss line would say \u201cStop it, Mum, I'm not nine.\u201d It is sharp and it is not a fact, and it pins the same kind of name tag on her from the other side."},"example":"A bus stop, a son who says to his father: \u201cYes, I'm useless with money, I know.\u201d He has not been asked about money at all.<br>The fast yes ends the talk and leaves him as the boy in the story."}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now you replay it.<\/b> Each line is a volley. Some lines pin a name tag on the other person, and some pin one on you. Choose the line that fits the moment.","items":[{"type":"scene","title":"Sunday, 21:34, apartment 3B, the balcony","setting":"Mum has just called you her lunch-box boy. The phone is hot against your ear and the street is loud below.","meters":{"you":70,"them":50},"beats":[{"who":"Mum","text":"\u201cYou never call. I sit by the phone like a fool.\u201d","cue":"her voice goes small on the word fool","lines":[{"text":"\u201cMum, I did call on Thursday. Tell me what the week was like for you.\u201d","tag":"best","you":4,"them":6,"outcome":"Mum pauses. \u201cThursday? Oh. Well, the knee was bad.\u201d The call turns to her knee, and it is her week now.","why":"You answered the grown-up in her with a fact and a question. Nothing was pinned on either side, and she had room to tell you something real."},{"text":"\u201cI'm sorry Mum, I'll call every day, I promise.\u201d","tag":"ok","you":-3,"them":3,"outcome":"Mum sighs with relief. \u201cEvery day, love. Good.\u201d She is happier, and you are back in the lunch-box story.","why":"You took the blame at face value and promised a daily call you cannot keep. The name tag stuck, and the Kid in you is the one who signed for it."},{"text":"\u201cMum, you always say that. It's not fair.\u201d","tag":"ok","you":-2,"them":-4,"outcome":"Mum's voice goes flat. \u201cNot fair? I see. So it's my fault now.\u201d The call cools, and neither of you is talking to the other.","why":"You protested like a Kid, which keeps the old pairing going: she is hurt, you are in the dock, and neither of you is talking to the other. It does not show her who she is talking to."}]},{"who":"Mum","text":"\u201cAfter all I did for you, this is how you treat your Mum?\u201d","cue":"the ledger voice, a pencil tapping a page","lines":[{"text":"\u201cYou're right, Mum. I owe you. I'll make it up to you.\u201d","tag":"game","you":-6,"them":4,"outcome":"Mum softens and reads out the bill: the school fees and the winter coat. You are still listening when the call ends with her ledger open.","why":"You accepted the bill as a debt, so the call turned into a payment. That is a trap move, and it ends the scene here."},{"text":"\u201cMum, I'm not a bill. Tell me what you want from me this week.\u201d","tag":"best","you":3,"them":5,"outcome":"Mum is quiet for a second. \u201cI want you to call. Your Dad never does.\u201d It is the first honest thing she has said all evening.","why":"You named the ledger without arguing with the figures, and asked for the real want behind it. The name tag comes off when someone asks for the want instead of the debt."},{"text":"\u201cMum, you're doing it again. You always make me feel guilty.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Mum takes a breath. \u201cI'm the problem, now.\u201d The line is true, but it leaves her nowhere to stand.","why":"The true thing is fair, and it still hands her a verdict on herself. She cannot answer a verdict, so the call drops back into the same loop."}]},{"who":"Mum","text":"\u201cJust like when you were small and forgot your lunch box.\u201d","cue":"she is laughing a little, the old story is still funny to her","lines":[{"text":"\u201cI'm twenty-seven and I've got a job, Mum. Tell me what you want. Forget the lunch box.\u201d","tag":"best","you":3,"them":4,"outcome":"Mum laughs, then stops. \u201cTwenty-seven. Hm. Yes. You do have a job.\u201d She sounds like she is seeing you for the first time in years.","why":"You named two facts you could check, your age and your job, and then asked for the present. You took the name tag off without shaming her for pinning it on."},{"text":"\u201cMum, the lunch box was twenty years ago.\u201d","tag":"ok","you":0,"them":-2,"outcome":"Mum says, \u201cEverything was twenty years ago, son, that's the trouble with you.\u201d She has the lunch box back in her hand.","why":"The fact is true, and it comes from your Pilot. She answers it from her Boss, talking down to a boy, so your line is cut and the lunch box is back in her hand. You can see the name tag and you have not taken it off yet."}]}],"payoff":"Mum reads the bill again and calls you her boy until the call ends. The lunch box stays pinned to you for another week.","fallout":{"them":"Mum hangs up without a goodbye. The name tag stays on, and you can hear her ledger closing.","you":"You say yes to everything. The call ends, and you sit on the balcony counting what you owe."}},{"type":"scene","title":"Sunday, 21:52, apartment 3B, the balcony","setting":"Mum is quiet, then starts again. This time the name tag she pins is Dad's, and you feel it land on you.","meters":{"you":60,"them":50},"beats":[{"who":"Mum","text":"\u201cYour Dad says we are fine. So we are fine. Why do you need to call every week?\u201d","cue":"flat, practised, a chair creaking somewhere behind her","lines":[{"text":"\u201cDad says we're fine, Mum. Can we be fine and still talk for ten minutes?\u201d","tag":"best","you":3,"them":5,"outcome":"Mum says, \u201cTen minutes. All right.\u201d The line gives Dad one mention and then moves on, and she sounds like herself again.","why":"You let Dad's words stand without arguing with them and without folding into them, and you asked for something ordinary. Dad gets one mention and no more."},{"text":"\u201cYes, Mum, you're right. We're fine. I'll stop calling.\u201d","tag":"game","you":-7,"them":3,"outcome":"Mum says, \u201cGood, good.\u201d The call is over almost before it started, and the name tag is now yours.","why":"You took Dad's \u201cwe're fine\u201d as the rule and folded to it. That is you accepting the name tag on your own side, and it ends the scene here."},{"text":"\u201cMum, Dad never says anything. I don't know if we're fine.\u201d","tag":"ok","you":-2,"them":-5,"outcome":"Mum sits up in her chair. \u201cDon't say that about your Dad.\u201d The call now has a second person in it, and he is not on the line.","why":"You put Dad in the room as the thing to be defended. That pins a name tag on him, and she has to step in for him, so the call goes off course."}]},{"who":"Mum","text":"\u201cYou never listen to me, the way your Dad never listens to me.\u201d","cue":"her voice shaking a little, the old hurt coming up","lines":[{"text":"\u201cI'm listening, Mum. What did he do that you still feel?\u201d","tag":"best","you":3,"them":6,"outcome":"Mum is silent, then says, \u201cHe went to the club on my birthday, every year.\u201d It is the first real story of the call.","why":"You listened to her and asked about the real event, not the name tag. The conversation moved from Dad's ghost to what actually happened."},{"text":"\u201cMum, I'm sure he didn't mean it. Don't worry about it.\u201d","tag":"ok","you":-3,"them":-2,"outcome":"Mum says, \u201cYou always say that.\u201d She has been waved off, and she waves back.","why":"You rushed to make her hurt smaller in your words, so it stayed the same size in hers. The call stays pleasant for a minute, and the hurt stays where it was."}]},{"who":"Mum","text":"\u201cSo you think I'm making a fuss. Like always.\u201d","cue":"quiet, final, the call about to end","lines":[{"text":"\u201cI don't think it's a fuss, Mum. I think it hurt. I'll call on Thursday.\u201d","tag":"best","you":2,"them":4,"outcome":"Mum says, \u201cThursday, then.\u201d It is not a fight, and she has a day to look forward to.","why":"You named the hurt as real, and you made a checkable promise. Both sides keep their own voice in the call, which is the whole point of the replay."},{"text":"\u201cFine, Mum. You're right, I'm the problem.\u201d","tag":"ok","you":-4,"them":1,"outcome":"Mum says, \u201cYes, well.\u201d The call ends, and the name tag is on you for the week.","why":"You accepted the verdict on yourself. It is harmless, and it leaves the Kid holding the name tag for the rest of the week."}]}],"payoff":"Dad's voice stays in the call for the next week. You count the minutes until Thursday and feel the name tag on your collar.","fallout":{"you":"You hang up without saying goodbye, because the Kid has taken over and is not willing to answer. Mum sits by the phone."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"<b>Read the replay back.<\/b> Pick the explanation that fits what happened on the call.","items":[{"type":"pick","who":"Nadia, after the replay","text":"\u201cLook at the lunch box. Mum answered you as a boy, and you answered her as a Kid who owes. Is the pinning on her side, on yours, or on both?\u201d","cue":"pen down, looking at you, not at the screen","options":["Mum pinned the lunch-box name tag on you, and you pinned a debt-collector's name tag on her","Both of you are simply tired, so there is no pinning at all","You are the only one who can change the call, so the pinning is all yours"],"answer":0,"why":"Mum's line put you back in the lunch-box story, and your quick yes took the boy's part and left her holding the bill. That is two name tags, one on each side, and an old Boss-and-Kid pair like this runs on until one of you changes voice.","traps":{"1":"Tiredness can make a call harder, but it does not explain the lunch box. The name tags were in the words, not in how late it was.","2":"Your side matters, but you cannot pin a tag on her alone. The replay shows her line doing the first pinning, so the blame is not all yours."},"example":"A family group call with an uncle who says: \u201cYou were always the careless one.\u201d Your cousin answers, \u201cYes, I'm the careless one,\u201d and the call goes quiet for an hour.<br>The uncle pinned the first tag, and the cousin's quick yes pinned the second."},{"type":"pick","who":"Nadia, with a pen in the air","text":"\u201cSame plain question, two different replies. You ask Sam: \u2018Have you seen my cuff links anywhere? The wedding is on Saturday.\u2019 Reply A: \u2018Why do you always blame me? You sound exactly like my dad.\u2019 Reply B: \u2018Why can't you keep track of your own things? You're not a child any more.\u2019\u201d","cue":"she writes A and B on the back of the menu, one above the other","prompt":"Your question came from your Pilot, aimed at his Pilot. Which pairing describes the two replies?","options":["A comes from Sam's Kid, treating you as a nagging dad. B comes from his Boss, treating you as a child.","A comes from Sam's Boss, treating you as a child. B comes from his Kid, treating you as a nagging dad.","Both come from Sam's Pilot, so both are matched replies."],"answer":0,"why":"In A, Sam's Kid answers as if you were a harsh parent, so the voice is a Kid's and the name tag is Dad's. In B, his Boss talks down to you as if you were a child. Both cut your plain question, and the cuff links go unanswered until someone moves back to the Pilot.","traps":{"1":"The pairing is the wrong way round. \u2018You always blame me\u2019 is a Kid defending himself against a parent figure, and \u2018you're not a child any more\u2019 is a Boss correcting a child.","2":"A Pilot reply would say where the cuff links are, or that he has not seen them. Neither reply does that, so both are cuts."},"example":"A kitchen at six, a sister asks her brother: \u201cWhere did you put the torch?\u201d<br>\u201cWhy do you always blame me? You're just like Dad.\u201d The answer comes from the Kid and treats her as a parent, so the torch is never found."}]}],"debrief":{"nadia":"Mum answered you as the boy with the lunch box, and you answered her as someone who owes, so neither of you was talking to the person on the line. The lines that worked asked for what was wanted instead of arguing with the story. A plain line can be crossed two classic ways: a Kid answering as if you were a harsh parent, which is the name tag Dad wore in Mum's second call, or a Boss talking down to you as if you were a boy, which is the lunch box. Watch which voice you use the next time an old name tag shows up.","bookTerm":"Crossed transaction, Types I and II","bookNote":"The books call this a crossed transaction. In Type I a plain Adult line gets a Child answer aimed at a parent figure, typified by the classical transference reaction. In Type II it gets a Parent answer talking to a child, typified by counter-transference. Mutual Parent and Child exchanges run on until one person changes ego state."},"reflection":{"prompt":"Think of one call or message this week where someone answered you as if you were a child, or as if you owed them. Which line of yours pinned the name tag on, and what would a plain question have done instead?"},"next":"3.5","baseStory":{"setting":"Home & Flatmates","blurb":"A Sunday phone call with Mum, where an old story about a lunch box and a ledger keeps coming back."},"moreStories":[{"setting":"School & College","blurb":"Marked ledgers come back at Sam's evening class, and two people answer you as someone else.","opener":{"setting":"Tuesday, 19:40. The adult education centre, room four, week five of the bookkeeping course. The feedback sheets are coming back face down, and the radiator ticks.","lines":[{"who":"Ms Hallett","text":"\u201cGroup two. Your ledger balanced, and then it didn't. We'll talk about that on Friday.\u201d","cue":"reading glasses pushed up into her hair, a stack of sheets squared against her chest"},{"who":"Sam","text":"\u201cIt's mine, I think. Most of it's probably mine.\u201d","cue":"already folding his sheet into four, then into eight"}],"ask":"Replay the week. Can you find the name tag each person pins on you, and the line that put it there?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> you replay a few days of the course. Some lines are a person answering you as if you were someone from their past, and that is a name tag. Tap the name tag that fits the line.","items":[{"type":"pick","who":"Ms Hallett","text":"\u201cWhich section lost the marks? It's on the sheet. It is always on the sheet. Did you read the handout, or only look at the pictures?\u201d","cue":"tapping the sheet with a green pen, not looking up","options":["A straight answer to your question","She treats you as a lazy pupil","She treats you as an anxious parent"],"answer":1,"why":"You asked where the marks went. She answered a pupil who skipped the reading, and nobody in the room has said anything about reading. The question was aimed at a grown-up, and the answer landed on a schoolchild.","traps":{"0":"A straight answer would name the section: \u201cSection three, the closing balance.\u201d Hers is a question about your homework habits instead.","2":"An anxious parent would be asking what the marks mean for someone else. Nothing in her line is about worry, and the pen is tapping like a register."},"example":"A driving test centre, an examiner who says: \u201cDid you even look at the mirror, or do you just enjoy the scenery?\u201d<br>The learner asked what the fault was. The examiner is answering a daydreaming schoolboy."},{"type":"pick","who":"Colin","text":"\u201cOh, here we go. You're marking me down just like Mr Pratt did in Year Nine. Always sure I got it wrong before I'd finished.\u201d","cue":"arms folded over his laptop, coffee gone cold at his elbow","options":["He asks about the figures","He jokes with a mate","He sees Mr Pratt again"],"answer":2,"why":"You asked which pages were his. Colin heard a strict old teacher and answered him. The line is a Kid's, and the name tag it pins on you is a stranger's from twenty years ago.","traps":{"0":"Asking about the figures would sound like \u201cPages four to six, the VAT bit.\u201d Colin has said nothing about a single page.","1":"A joke between mates would have a grin in it and no Mr Pratt. This line has an old grudge, and he is not smiling."},"example":"A flat-pack shelf, a husband who says to his wife: \u201cFine, take over, you always know better, just like my brother.\u201d<br>She only asked where the screws were. He answered his brother."},{"type":"pick","who":"You, to Ms Hallett","text":"\u201cSorry, you're right, I'm hopeless at this. I'll redo the whole ledger tonight.\u201d","cue":"you say it fast, to stop her looking at the sheet","options":["A Kid line that gives in","A Pilot line, true and checkable","A Boss line that tells her off"],"answer":0,"why":"You agreed to a verdict you had not read. The Kid folded, and the quick yes is how the pupil's name tag gets fixed on you from your own side as well.","traps":{"1":"A Pilot line would check the claim: \u201cI got section one and two right. Show me what happened in section three.\u201d That is true and she can answer it.","2":"A Boss line would say \u201cThat's not a fair way to talk to a student.\u201d It is sharp, and it pins a name tag on her."},"example":"A pharmacy counter, a customer who says to the assistant: \u201cYes, I'm a nuisance, I know, I'm sorry.\u201d She had only asked for a prescription number.<br>The quick sorry ends the talk and leaves him as the nuisance."}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now you replay it.<\/b> Each line is a volley. Some lines pin a name tag on the other person, and some pin one on you. Choose the line that fits the moment.","items":[{"type":"scene","title":"Thursday, 18:10, the college library, a table by the radiator","setting":"Group two has until Friday morning to hand in the corrected ledger. You asked Colin one plain thing: which pages are his. A vending-machine coffee sits cold at his elbow.","meters":{"you":65,"them":50},"beats":[{"who":"Colin","text":"\u201cDon't start. I know what's coming. You'll tell me I did it wrong, same as every teacher I ever had.\u201d","cue":"he turns his laptop a little further from you","lines":[{"text":"\u201cI'm not marking anything, Colin. I need to know which pages are yours, so I can split the rest.\u201d","tag":"best","you":4,"them":6,"outcome":"Colin looks up. \u201cFour to six. The VAT bit.\u201d He pulls the laptop back to the middle of the table.","why":"You gave the plain request again and added a reason. With no teacher in the sentence, there is no one left for him to push against."},{"text":"\u201cRelax, Colin. I'm not your teacher.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Colin bristles. \u201cThen stop sounding like one.\u201d The pages stay on his side of the table.","why":"It is true, and it argues about the name tag. He now has to defend himself against a second charge, and he still has not told you the pages."},{"text":"\u201cSorry. I'll do the whole thing myself.\u201d","tag":"ok","you":-3,"them":2,"outcome":"Colin shrugs. \u201cIf you like.\u201d He is relieved, and the ledger is yours alone.","why":"You folded before anyone asked you to. It ends the friction and also takes his part away from him."}]},{"who":"Colin","text":"\u201cYou lot always decide who's clever before you've seen a number. Go on, grade me.\u201d","cue":"he slides a printout across the table, face down","lines":[{"text":"\u201cFine. Page four has three mistakes and page five has two. You need to be more careful.\u201d","tag":"game","you":-6,"them":-4,"outcome":"Colin says, \u201cThere it is.\u201d He takes the printout back, stands, and heads for the machine downstairs.","why":"You accepted the invitation to be his marker. A Boss voice answering a Kid voice is the old pair running again, and this scene stops here."},{"text":"\u201cI'm not grading. Page four, line twelve, the 140 and the 410 swapped places. Want to fix it together?\u201d","tag":"best","you":3,"them":5,"outcome":"Colin turns the printout over. \u201cLine twelve. Hm.\u201d He pulls the chair in a little.","why":"You stayed with a fact he could check and offered to share the work. The marker's name tag has nothing left to hang on."},{"text":"\u201cEveryone gets things wrong, Colin. Even me. Don't take it personally.\u201d","tag":"ok","you":0,"them":-1,"outcome":"Colin nods slowly. \u201cRight.\u201d He sounds handled, and the printout stays face down.","why":"Kind, and it pats him on the head. It speaks from a Boss who soothes, so the old pair is still there, only gentler."}]},{"who":"Colin","text":"\u201cNobody ever said that to me before. They just circled it in red.\u201d","cue":"it is the first time he has looked at you for more than a second","lines":[{"text":"\u201cRed circles don't help at ten at night. Let's fix line twelve and then check the total.\u201d","tag":"best","you":2,"them":4,"outcome":"Colin laughs, once. \u201cTen at night is right.\u201d The two of you bend over the page.","why":"You agreed with what he said, kept it short, and went back to the work. Nobody has to explain the past to get on with the ledger."},{"text":"\u201cSounds like a rough school. Anyway, line twelve.\u201d","tag":"ok","you":0,"them":0,"outcome":"Colin says, \u201cIt was fine.\u201d The warmth drops, and you are both looking at the numbers.","why":"A fair thing to say, and it steps over his remark. He offered a glimpse and got a change of subject."}]}],"payoff":"Colin leaves the pages face down on the table and goes home. The corrected ledger has a gap the size of his name.","fallout":{"them":"Colin packs up without a word. His pages stay face down, and the radiator ticks on.","you":"You hand in the whole ledger alone at eleven, with his section guessed at and your own checked twice."}},{"type":"scene","title":"Friday, 08:50, the corridor outside room four","setting":"The ledger is due at nine. Sam has gone grey, and the last page is still in the printer queue. Ms Hallett steps out with her keys and a roll of green tape.","meters":{"you":60,"them":50},"beats":[{"who":"Ms Hallett","text":"\u201cYou're late with this, and I did say Friday. Shall I write it on your hand?\u201d","cue":"keys swinging from one finger","lines":[{"text":"\u201cYes, Ms Hallett. I'm sorry. It won't happen again, I'll never be late again.\u201d","tag":"game","you":-7,"them":3,"outcome":"Ms Hallett tears off a strip of tape. \u201cSee that it doesn't.\u201d She walks into room four, and you are holding a promise you cannot keep.","why":"You took the pupil's name tag and signed a promise for it. A Kid answering a Boss ends the scene here."},{"text":"\u201cIt's ready except one page. Ten o'clock, in your tray. Sam is printing it now.\u201d","tag":"best","you":3,"them":5,"outcome":"Ms Hallett checks her watch. \u201cTen, then.\u201d She opens the door and leaves it ajar for you.","why":"You gave a time and a place she can check. It talks to the tutor and leaves the pupil out of it."},{"text":"\u201cYou never gave us a time on Friday. It isn't our fault.\u201d","tag":"ok","you":-2,"them":-4,"outcome":"Ms Hallett's mouth tightens. \u201cI said Friday. Friday is a day, not a time.\u201d She does not move from the door.","why":"You defended yourself against a charge she hadn't finished making. It sounds like the Kid, and she answers it from the Boss."}]},{"who":"Ms Hallett","text":"\u201cSam always has a reason. You evening students want the certificate without the hours.\u201d","cue":"she is looking at Sam, not at you","lines":[{"text":"\u201cSam did eleven hours on this. It's all in the group log. Can I show you the page?\u201d","tag":"best","you":3,"them":4,"outcome":"Ms Hallett frowns, then holds out a hand. \u201cShow me.\u201d Sam lets out a breath he had been saving.","why":"You answered the claim with a number she can look up. The word hours was hers, so you used it back."},{"text":"\u201cThat's unfair, Ms Hallett. We work all day too.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"She says, \u201cI did not say you didn't.\u201d The tape roll goes back in her pocket.","why":"True, and it comes out as a protest. A protest to a parent figure keeps the pair going: she scolds, you plead."},{"text":"\u201cSam, tell her about your hours.\u201d","tag":"ok","you":-3,"them":-1,"outcome":"Sam goes pink. \u201cEleven, I think. Maybe ten. Sorry.\u201d The tutor looks at the floor.","why":"You handed the talking to the person with the weakest voice in the corridor. He folded before you did."}]},{"who":"Ms Hallett","text":"\u201cTen o'clock, then. And I want the group log with it.\u201d","cue":"the keys are back in her pocket","lines":[{"text":"\u201cThe log will be with the ledger. Thanks for the ten o'clock.\u201d","tag":"best","you":2,"them":4,"outcome":"Ms Hallett nods. \u201cGood.\u201d She stands aside to let you into the room.","why":"A short answer between two adults. It accepts the deal and adds nothing."},{"text":"\u201cYes, Ms Hallett. Thank you, Ms Hallett, sorry again.\u201d","tag":"ok","you":-3,"them":1,"outcome":"She says, \u201cAll right, all right.\u201d You feel nine years old.","why":"Polite, and the extra thanks and sorry put the pupil back in the corridor."}]}],"payoff":"Ms Hallett writes late on the sheet. The tape goes back in her pocket, and the promise stays on your record.","fallout":{"you":"You say yes to everything in the corridor. At ten past nine you are still counting what you promised."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"<b>Read the replay back.<\/b> Pick the explanation that fits what happened in the library and the corridor.","items":[{"type":"pick","who":"Nadia, after the replay","text":"\u201cLook at the two people. Colin answered you as a teacher he's pushing against. Ms Hallett answered you as a pupil who is late. Where did each tag come from?\u201d","cue":"she lays the feedback sheet flat and puts her pen on it","options":["Colin's Kid saw an old teacher in you, and Ms Hallett's Boss saw a late pupil in you","Both were simply tired after a long Tuesday and Thursday, so there were no tags at all","Both tags came from your own manner, so the fault is all yours and nobody else's"],"answer":0,"why":"Colin's line put a strict teacher on your chair, and Ms Hallett's put a schoolchild there. Two name tags, one in each direction, and each person was answering a figure that was not in the room.","traps":{"1":"Tiredness explains the short tempers, and it does not explain Mr Pratt or the register. The tags were in the words, not in the hour.","2":"Your folding in the corridor did add a tag, and the first ones were not yours. Their lines came before your answers."},"example":"A choir rehearsal, a conductor who says: \u201cYou were flat again, weren't you?\u201d A singer answers: \u201cDon't talk to me like my mother.\u201d<br>Both lines are aimed at people who are not there."},{"type":"pick","who":"Nadia, with a pen in the air","text":"\u201cSame plain question, two replies. You ask Sam: \u2018Have you got the printout for page nine? Ms Hallett wants it at ten.\u2019 Reply A: \u2018Stop checking up on me. You sound exactly like my sister.\u2019 Reply B: \u2018Why do you ask me things you should know? Do I have to hold your hand through this course?\u2019\u201d","cue":"she writes A and B on the back of the feedback sheet, one above the other","prompt":"Your question came from your Pilot, aimed at his Pilot. Which pairing describes the two replies?","options":["A comes from Sam's Boss, treating you as a child. B comes from his Kid, answering a bossy sister.","Both come from Sam's Pilot, so the printout has been answered twice.","A comes from Sam's Kid, answering a bossy sister. B comes from his Boss, treating you as a child."],"answer":2,"why":"In A, Sam's Kid hears a bossy sister and hits back. In B, his Boss talks down to you as someone who needs holding by the hand. Both cut the plain question, and page nine stays missing until someone goes back to a Pilot line.","traps":{"0":"The pairing is the wrong way round. \u2018You sound like my sister\u2019 is a Kid pushing back at a parent figure, and \u2018hold your hand\u2019 is a Boss talking down.","1":"A Pilot reply would say where the printout is, or that he has not made it yet. Neither reply does that."},"example":"A school office, a teacher who asks the caretaker: \u201cIs the hall unlocked yet?\u201d<br>\u201cDon't you start on me. You sound just like the head.\u201d The reply comes from the Kid and treats her as a boss, so nobody finds the key."}]}]},{"setting":"Work","blurb":"Release day at Halden, and a plain question about which build ships keeps landing on the wrong person.","opener":{"setting":"Thursday, 16:40. Halden, the team room. The release goes out at six, and the red-screened laptop is open on Daniel's desk.","lines":[{"who":"Daniel","text":"\u201cBuild 215. It's in the channel. Does everything need saying twice with you?\u201d","cue":"not looking up from the red screen"},{"who":"Clara","text":"\u201cI'll fix it. Sorry, I'll fix all of it. I should have caught it hours ago.\u201d","cue":"a list of seventeen items on a sticky note stuck to her monitor"}],"ask":"Replay the afternoon. Can you find the name tag each person pins on you, and the line that put it there?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> you replay a release afternoon. Some lines are a person answering you as if you were someone from their past, and that is a name tag. Tap the name tag that fits the line.","items":[{"type":"pick","who":"Daniel","text":"\u201cI put it in the channel an hour ago. Do I have to read it to you as well? Some of us did the reading.\u201d","cue":"the lid of the red laptop half closed, one hand already on it","options":["He answers colleague to colleague","He treats you as his own manager","He treats you as a slow trainee"],"answer":2,"why":"You asked which build goes to the client, and a question about a number got a remark about reading. He is answering a trainee who falls behind.","traps":{"0":"Colleague to colleague would be \u201c215, it's in the channel if you want to check.\u201d He has added a charge about your reading.","1":"Nobody talks to a manager like this. Nothing in the line asks for his sign-off or hints that you outrank him."},"example":"A warehouse, a supervisor asked which bay the pallet is for who says: \u201cIt's on the board. Can you read a board?\u201d<br>The question was about a bay, and the answer is about the person."},{"type":"pick","who":"Clara","text":"\u201cYou're checking my work again. I knew it. Daniel doubts me and now you do too.\u201d","cue":"her hand covers the sticky note before you can read it","options":["She sees a doubting manager","She answers the test question plainly","She makes a joke of the test run"],"answer":0,"why":"You asked if the test run was finished. Clara heard a judge, and she is answering the judge. The line is a Kid's, and the tag is a doubting manager.","traps":{"1":"A plain answer would be \u201cTwelve of seventeen done.\u201d Her line is about being doubted, not about the tests.","2":"A joke would lighten the room. Her hand over the sticky note says she isn't joking."},"example":"A tax office, a junior who is asked: \u201cIs the file ready for review?\u201d and who says: \u201cYou never trust my work.\u201d<br>The senior asked about a file and got an answer to a doubt."},{"type":"pick","who":"You, to Daniel","text":"\u201cYou're right, I should have read the channel. I'm slow, I know. I'll catch up.\u201d","cue":"you say it with your eyes on the floor, to stop him looking at you","options":["A Boss line that tells him off","A Kid line that takes the tag","A Pilot line, true and checkable"],"answer":1,"why":"You took the trainee's name tag and wore it. A quick agreement is how a tag gets fixed on your side as well, and he did not even have to push.","traps":{"0":"A Boss line would say \u201cYou could have told me directly, Daniel.\u201d It might be fair, and it pins a name tag on him.","2":"A Pilot line would check: \u201cI read the channel at two. 215 went up at three. Can you confirm it's still 215?\u201d That one has a fact in it."},"example":"A caf\u00e9 kitchen, a cook who is asked: \u201cWhere's the order for table six?\u201d and who says: \u201cI'm useless tonight, I know.\u201d<br>He gave up the order and kept the label."}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now you replay it.<\/b> Each line is a volley. Some lines pin a name tag on the other person, and some pin one on you. Choose the line that fits the moment.","items":[{"type":"scene","title":"Thursday, 17:05, the team room, Daniel's desk","setting":"You asked one plain thing: which build do you tell the client, 214 or 215? Daniel is hunched over the red screen, and a cold canteen sandwich sits half-eaten beside it.","meters":{"you":65,"them":50},"beats":[{"who":"Daniel","text":"\u201cI put it in the channel an hour ago. Do I have to read it to you as well?\u201d","cue":"his pen goes through the lid of the sandwich box","lines":[{"text":"\u201cI missed it. Is it 215 for sure, and can I tell the client in ten minutes?\u201d","tag":"best","you":4,"them":5,"outcome":"Daniel stops. \u201c215. Yes. Ten minutes is fine.\u201d He closes the sandwich box.","why":"You owned the miss in four words and went back to the question. The trainee's name tag has nothing to stick to."},{"text":"\u201cSorry, Daniel. I'll read the channel from now on.\u201d","tag":"ok","you":-3,"them":2,"outcome":"Daniel grunts. \u201cGood.\u201d He has his answer, and you have the label.","why":"The Kid took the tag and paid for it with a promise. He is pleased, and the build number is still missing."},{"text":"\u201cYou never said it was in the channel.\u201d","tag":"ok","you":-2,"them":-4,"outcome":"Daniel looks up. \u201cIt's always in the channel.\u201d The lid of the laptop comes down an inch.","why":"You pushed back like a Kid, and he answered from the Boss. The argument is about the channel now, not the build."}]},{"who":"Daniel","text":"\u201cEveryone's asking me questions today. Just do it right for once and spare me the details.\u201d","cue":"he taps the closed lid twice, hard","lines":[{"text":"\u201cUnderstood. I'll do it exactly right, and I'll check with you before every step.\u201d","tag":"game","you":-6,"them":4,"outcome":"Daniel says, \u201cGood.\u201d By half past five he has sent you three messages, and you reply to each one inside a minute.","why":"You took the trainee's seat and promised perfection. The Boss and Kid pair is running again, and this scene stops here."},{"text":"\u201cI'll do it. If the client asks about 214, I need five minutes of your attention.\u201d","tag":"best","you":3,"them":5,"outcome":"Daniel exhales. \u201cFive. If it comes to that.\u201d He reaches for the sandwich at last.","why":"You agreed to the job and named the one thing you need. He gets a plan, and you keep your own voice."},{"text":"\u201cDaniel, you're stressed. Take a breath.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Daniel says, \u201cI am not stressed.\u201d The pen goes through the sandwich box again.","why":"A kind thought that tells him what he feels. It talks down from a Boss seat and gets pushed back from his."}]},{"who":"Daniel","text":"\u201cFine. Five minutes. Not more.\u201d","cue":"he rubs his eyes with the heel of one hand","lines":[{"text":"\u201cFive is enough. Tell me the one thing the client must not hear.\u201d","tag":"best","you":3,"them":4,"outcome":"Daniel almost smiles. \u201cThat we nearly shipped 214.\u201d He starts to talk, fast but clear.","why":"A short question that makes him the expert, and a fact he can give. It keeps both of you at desk height."},{"text":"\u201cThanks, Daniel, you're the best. I'll be quick, sorry.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Daniel waves you away. \u201cGo.\u201d You walk off feeling like a boy sent back to his seat.","why":"Warm, and the extra sorry and the praise put you below him again."}]}],"payoff":"Daniel's messages come every few minutes until the release. You answer each one and the red laptop stays open on his desk.","fallout":{"them":"Daniel puts his headphones on. The build number stays in the channel where he left it.","you":"You say yes to everything and write the client's email four times. It goes out at ten to six."}},{"type":"scene","title":"Thursday, 17:40, the team room, Clara's desk","setting":"Clara has been testing since five that morning. You ask a plain question: is the invoice screen test finished? A seventeen-item list is stuck to her monitor, and a cold canteen coffee sits beside it.","meters":{"you":60,"them":50},"beats":[{"who":"Clara","text":"\u201cYou're checking up on me. Daniel doubts me and now you do too.\u201d","cue":"her hand flat over the sticky note","lines":[{"text":"\u201cI'm planning, Clara, not checking. How many of the seventeen are done?\u201d","tag":"best","you":3,"them":4,"outcome":"Clara hesitates, then lifts her hand. \u201cTwelve. Five left.\u201d She turns the monitor a little towards you.","why":"You said what you were doing and asked for a number. A number is easier to give than a defence."},{"text":"\u201cI'm not Daniel, Clara. Don't put me with him.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Clara says, \u201cI didn't.\u201d Her shoulders go up and her list goes back under her hand.","why":"True, and it takes the argument to Daniel. She wanted to be asked about the tests."},{"text":"\u201cNobody doubts you. I only wanted to know.\u201d","tag":"ok","you":0,"them":-1,"outcome":"Clara says, \u201cRight.\u201d She does not look as if she believes you.","why":"A kind line that repeats the words \u2018nobody doubts\u2019. It answers her fear and skips the five missing tests."}]},{"who":"Clara","text":"\u201cIt's nearly done. I'll stay until it's perfect. You go home.\u201d","cue":"she hasn't looked up from the keyboard","lines":[{"text":"\u201cThanks, Clara, you're a star. I'll leave it with you.\u201d","tag":"game","you":-6,"them":3,"outcome":"Clara beams, briefly. \u201cI won't let you down.\u201d At seven she is still there, retesting item three.","why":"You took the seat of the manager she was afraid of and gave her praise for staying. The Boss-and-Kid pair rolls on, and this scene stops here."},{"text":"\u201cNobody needs perfect by six. Which three items does the client look at?\u201d","tag":"best","you":3,"them":5,"outcome":"Clara blinks. \u201cThe totals, the date, and the PDF.\u201d She pulls the sticky note off and writes a ring around three lines.","why":"You asked a question she could answer as a colleague, and it changed the job from perfect to enough."},{"text":"\u201cClara, you work too hard. Go home.\u201d","tag":"ok","you":0,"them":-2,"outcome":"Clara says, \u201cI'm fine.\u201d She types faster than before.","why":"Caring, and it tells her what to do. She heard another person deciding what she can bear."}]},{"who":"Clara","text":"\u201cOmar keeps looking over. He thinks I can't finish.\u201d","cue":"Omar is across the room holding two mugs, looking at nothing","lines":[{"text":"\u201cHe's holding you a tea. Ask him which four items he'd take.\u201d","tag":"best","you":3,"them":4,"outcome":"Clara laughs, short and surprised. \u201cFour?\u201d She waves Omar over, and the mug lands beside the list.","why":"You described what you could both see, and gave her a way to ask for help in her own words."},{"text":"\u201cHe isn't thinking anything like that, Clara.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"Clara says, \u201cYou don't know that.\u201d Omar sits down again, mugs and all.","why":"You answered her guess about Omar with your own guess. Neither of you can check it, and the mug stays across the room."}]}],"payoff":"Clara stays until seven retesting item three. The release goes out at six without her sign-off, and the sticky note stays on the monitor.","fallout":{"them":"Clara turns her chair away. The list comes off the monitor and goes into her bag.","you":"You say yes to her plan and to Daniel's. At six you watch the release without touching a thing."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"<b>Read the replay back.<\/b> Pick the explanation that fits what happened at Daniel's desk and at Clara's.","items":[{"type":"pick","who":"Nadia, after the replay","text":"\u201cDaniel talked to you as a slow trainee. Clara talked to you as a manager who doubts her. Same question from you each time. What was going on?\u201d","cue":"she lays two sticky notes side by side on the table","options":["Both came from the Kid, because both were stressed and short of time at the end of a long Thursday","Daniel's Boss pinned a trainee tag on you, and Clara's Kid put a doubting manager's tag on you","Both came from your own manner, so neither of them chose it and the fault is all yours"],"answer":1,"why":"Daniel's line put a slow trainee in your chair, and Clara's put a doubting manager there. Two different voices, two tags, and a plain question that was meant for neither.","traps":{"0":"Stress is real, and both were under it. Daniel's lines talk down and Clara's push back, which are different voices.","2":"Your first plain questions were fair. The tags were in their answers, not in how you asked."},"example":"A call centre floor, a team lead who says: \u201cDid you even read the script?\u201d An agent says: \u201cYou've never trusted me.\u201d<br>One tag came from above, the other from below."},{"type":"pick","who":"Nadia, with a pen in the air","text":"\u201cSame plain question, two replies. You ask Sam: \u2018Did you push the fix for the invoice screen? Daniel wants it by six.\u2019 Reply A: \u2018Stop standing over me. You're worse than my last manager.\u2019 Reply B: \u2018Did you even look at the board? Come on, you know better than to ask me that.\u2019\u201d","cue":"she writes A and B on a sticky note and presses it to the table","prompt":"Your question came from your Pilot, aimed at his Pilot. Which pairing describes the two replies?","options":["A comes from Sam's Boss, treating you as a child. B comes from his Kid, answering his last manager.","Both come from Sam's Pilot, so both are matched replies and the fix has been answered twice.","A is Sam's Kid, hearing his last manager. B is his Boss, treating you as a child who should know better."],"answer":2,"why":"In A, Sam's Kid hears a hovering manager and bristles. In B, his Boss talks down to you as someone who ought to know. Both cut your plain question, and nobody has said whether the fix is pushed.","traps":{"0":"The pairing is the wrong way round. \u2018You're worse than my last manager\u2019 is a Kid pushing back, and \u2018you know better\u2019 is a Boss correcting a child.","1":"A Pilot reply would say whether the fix is pushed. Neither reply does."},"example":"A bakery, a manager who asks: \u201cAre the rolls out yet?\u201d<br>\u201cStop breathing down my neck, you're like my last boss.\u201d The reply comes from the Kid and treats her as a parent figure, so nobody checks the oven."}]}]},{"setting":"Family","blurb":"Sunday lunch at Gran's, with a council letter hidden under the biscuit tin.","opener":{"setting":"Sunday, 13:15. Gran's flat downstairs, the kitchen. The chicken rests under foil, and Leo is under the table with his tablet.","lines":[{"who":"Gran","text":"\u201cBoiler man? Leave that to me, sweetheart. You'll only get yourself in a state.\u201d","cue":"one hand flat on the biscuit tin"},{"who":"Grace","text":"\u201cLeave him, Gran. He's not my brother to boss me about either.\u201d","cue":"leaning in the doorway, a tea towel over one shoulder"}],"ask":"Replay the afternoon. Can you find the name tag each person pins on you, and the line that put it there?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> you replay a Sunday at Gran's. Some lines are a person answering you as if you were someone from their past, and that is a name tag. Tap the name tag that fits the line.","items":[{"type":"pick","who":"Gran","text":"\u201cBoiler man? Leave that to me, sweetheart. You'll only get yourself in a state, same as when you were seven and cried at the dentist.\u201d","cue":"she moves the biscuit tin an inch towards herself","options":["She treats you as a small boy","She answers about the boiler","She treats you as the landlord"],"answer":0,"why":"You asked what the council letter said about Tuesday. She answered a boy of seven and a dentist. Her voice is warm and the name tag is the oldest one in the building.","traps":{"1":"An answer about the boiler would give a day and a time. There is nothing in her line about Tuesday.","2":"Nobody speaks to a landlord with a sweetheart on the end. The line is soft and the picture in it is small."},"example":"A grandfather at a bus stop, asked by his grown daughter what time the next bus is: \u201cDon't you fret, pet. Granddad knows the buses.\u201d<br>She asked a time. He answered a worried child."},{"type":"pick","who":"Grace","text":"\u201cDon't start. You sound exactly like my mother, counting what I've put on my plate.\u201d","cue":"she puts the tea towel down on the counter, folded in four","options":["She answers about the dinner plate","She hears her mother in you","She joins you in the joke"],"answer":1,"why":"You asked if she could swap Tuesday's stair-cleaning slot. Grace heard a mother with a ledger and answered her. It is a Kid's line aimed at a parent, and you have been given a tag from another person's kitchen.","traps":{"0":"Her answer would then be \u201cTwo potatoes, thanks.\u201d She isn't talking about food, she is talking about being watched.","2":"A joke would have a smile in it. She has folded the tea towel into four, and she isn't smiling."},"example":"A dentist's waiting room, a husband who says: \u201cStop fussing. You sound just like my mother.\u201d His wife asked if he'd brought his card.<br>She asked about the card. He answered his mother."},{"type":"pick","who":"You, to Gran","text":"\u201cYou're right, Gran, I'm useless with letters. I'll leave it all to you.\u201d","cue":"you say it quickly, with your eyes on the chicken","options":["A Boss line that tells her off","A Pilot line, true and checkable","A Kid line that gives in"],"answer":2,"why":"You agreed to a verdict you never heard. The Kid gave in, and the quick yes is how the small boy's name tag gets fixed on you from your own side.","traps":{"0":"A Boss line would say \u201cGran, you can't keep hiding letters from me.\u201d It might be true, and it pins a tag on her.","1":"A Pilot line would check: \u201cI can read letters, Gran. Shall we look at it together for two minutes?\u201d That one is true, and she can answer it."},"example":"A garage forecourt, a young man asked by his uncle if he'd checked the oil: \u201cI'm hopeless with cars, you do it.\u201d He had checked it that morning.<br>The quick yes put the boy back in the driver's seat of nothing."}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now you replay it.<\/b> Each line is a volley. Some lines pin a name tag on the other person, and some pin one on you. Choose the line that fits the moment.","items":[{"type":"scene","title":"Sunday, 13:30, Gran's kitchen","setting":"Gran has put the council letter under the biscuit tin. You asked one plain thing: what does it say about Tuesday? Leo's tablet beeps from under the table.","meters":{"you":65,"them":50},"beats":[{"who":"Gran","text":"\u201cTuesday, Tuesday. You worry too much. Eat your chicken, sweetheart.\u201d","cue":"she spoons carrots onto your plate before you have said yes","lines":[{"text":"\u201cIt's lovely chicken, Gran. Can I read the letter out loud to you? Two minutes.\u201d","tag":"best","you":4,"them":5,"outcome":"Gran considers the biscuit tin. \u201cTwo minutes,\u201d she says, and lifts it half an inch.","why":"You thanked her, kept the request small, and gave it a time. The small boy's tag has nothing to grip."},{"text":"\u201cGran, I'm not seven any more.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Gran says, \u201cNo. I know.\u201d Her hand goes back flat on the tin.","why":"It is true, and you named the tag out loud. She hears a telling-off and defends the tin."},{"text":"\u201cOkay, Gran, you decide.\u201d","tag":"ok","you":-3,"them":2,"outcome":"Gran pats your arm. \u201cThat's my boy.\u201d The letter stays under the tin.","why":"A pleasant sentence that agrees to the tag and gets a pat for it."}]},{"who":"Gran","text":"\u201cNobody reads these letters for me. You're the only one who understands them. Don't leave me with it.\u201d","cue":"her thumb rubs the lid of the tin","lines":[{"text":"\u201cI'll do whatever you need, Gran. I'll deal with every letter from now on.\u201d","tag":"game","you":-6,"them":4,"outcome":"Gran beams. \u201cI knew I could count on you.\u201d By pudding she has found three more envelopes in the sideboard.","why":"You took on the whole pile for the sake of one thank you. The warm Boss and the willing Kid pair rolls on, and this scene stops here."},{"text":"\u201cI'll read this one with you now. Then you tell me which others you'd like a hand with.\u201d","tag":"best","you":3,"them":5,"outcome":"Gran nods slowly. \u201cThis one, then. The others, I'll see.\u201d She slides the tin to the edge of the table.","why":"You offered help with a limit and left the choice with her. She is treated as a person who decides, not a person who is rescued."},{"text":"\u201cGran, that's not fair. You make me feel guilty.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Gran says, \u201cGuilty? Over a letter?\u201d She turns to the chicken and carves with great attention.","why":"The feeling is real, and the line hands her a verdict. She cannot answer a verdict, so she steps away from the table."}]},{"who":"Gran","text":"\u201cRead it, then. Slowly. Leo, ears back in your tablet.\u201d","cue":"Leo's tablet gives a small chime of surrender","lines":[{"text":"\u201cTuesday, between eight and one. Someone has to be in. Shall I be here?\u201d","tag":"best","you":2,"them":4,"outcome":"Gran sits down for the first time. \u201cI will be. You come for the first ten minutes.\u201d","why":"A short fact, then a question about who does what. Both of you speak as adults."},{"text":"\u201cIt's only a boiler, Gran. There's nothing to read slowly.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"Gran says, \u201cThen you read it fast.\u201d She pulls her glasses off.","why":"A small brush-off, and a boy's name tag is back in the room."}]}],"payoff":"Gran finds the other envelopes and a second pile appears by the toaster. The letters are yours now, and the biscuit tin is empty.","fallout":{"them":"Gran carves the chicken in silence. The letter stays under the tin, and Leo goes very still under the table.","you":"You say yes to everything at the table. After lunch you carry a carrier bag of envelopes up the stairs."}},{"type":"scene","title":"Sunday, 14:10, the stairwell outside Gran's door","setting":"Grace is behind on the stairwell cleaning rota, and Mrs Kale's cat is asleep on the doormat. You ask one plain thing: could she swap Tuesday's slot, because of the boiler visit?","meters":{"you":60,"them":50},"beats":[{"who":"Grace","text":"\u201cHere we go. Nobody checks the rota with Mrs Kale, but I get the lecture.\u201d","cue":"she steps over the cat, a bin bag in her hand","lines":[{"text":"\u201cSorry, Grace. Forget it. I'll do the stairs myself.\u201d","tag":"game","you":-6,"them":2,"outcome":"Grace shrugs. \u201cIf you like.\u201d She goes back inside and you are left with a mop and a cat.","why":"You took the mother's tag and gave in before you were asked to. A Kid answering a Kid keeps the old pair going, and this scene stops here."},{"text":"\u201cNo lecture. Tuesday is the boiler visit, and I need someone to swap. Can you do Wednesday?\u201d","tag":"best","you":4,"them":5,"outcome":"Grace stops with the bin bag. \u201cWednesday? Hm.\u201d She puts it down on the step.","why":"You said what you weren't doing and then what you needed. The mother's tag drops because the request is plain."},{"text":"\u201cMrs Kale is just as bad, you know.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"Grace says, \u201cThat's not the point.\u201d The cat wakes and leaves.","why":"Comparing her with a third person still leaves her inside the old picture. The cat gets the message first."}]},{"who":"Grace","text":"\u201cMy mother kept a chart. Gold stars for the days I did the stairs. I never got one.\u201d","cue":"she looks at the cleaned step, not at you","lines":[{"text":"\u201cThat's a long time to wait for a star. What day would suit you, then?\u201d","tag":"best","you":3,"them":5,"outcome":"Grace laughs, not quite steadily. \u201cWednesday. Thursday, even.\u201d She picks the bin bag back up.","why":"You noticed the hurt and asked an ordinary question straight after. She moves from the old chart to a day of the week."},{"text":"\u201cI'm not your mother, Grace.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Grace says, \u201cI know that.\u201d She picks up the mop and does not use it.","why":"True, and it uses the name tag as an argument. She was telling you something, and you answered the story."}]},{"who":"Grace","text":"\u201cWednesday. Only if the stairs aren't wet again.\u201d","cue":"she shifts the mop to her other hand","lines":[{"text":"\u201cWednesday, dry stairs. I'll put it on the rota now.\u201d","tag":"best","you":2,"them":4,"outcome":"Grace nods. \u201cGood.\u201d You write it in pen on the she
