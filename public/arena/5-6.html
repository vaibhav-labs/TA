<style>
  :root {

  .choices { display: flex; flex-direction: column; gap: 10px; }

    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);

  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }

  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"5.6","setting":"Friends & Community","title":"Kind but Stuck","world":5,"worldName":"Under the Surface","week":5,"weekName":"Under the Surface","mechanic":"Ladder","concept":"After this one you can name the level a shrink lands on, and spot the kind-looking line that lets the shrink stand.","plainWord":"shrinking","bookTerm":"Discount Matrix","bookIdea":"The Discount Matrix is a diagram that lays discounting out by area, type and level, and its four levels are whether the problem exists, whether it matters, whether it can change, and whether you can do anything about it.","bookSource":"TA Today, ch. 18","opener":{"setting":"Sunday, 5:20pm. The Corner Table, the back table by the window. Omar came because Clara asked him to, and the tea has gone cold.","lines":[{"who":"Nadia","text":"\u201cOmar's here, and the sync job is the thing to talk about. I'll sit at the counter and watch.\u201d","cue":"notebook open, pen capped"},{"who":"Omar","text":"\u201cIt's fine. It wobbled, that's all. I've seen worse.\u201d","cue":"turning the tea glass, not meeting your eye"}],"ask":"Can you keep the sync job on the table for six turns, and name each shrink Omar makes before you answer it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four lines, four levels. Each line shrinks the problem at one of four plain levels: it isn't there, it doesn't matter, it can't change, or I can't do anything about it. Tap the level the line lands on.","items":[{"type":"pick","who":"Clara","text":"<i>Clara laughs before anyone else can. \u201cIt was only the Thursday demo, and the client never saw the crash. Nobody died, did they?\u201d<\/i>","cue":"laughing into her sleeve, the team looking up","options":["It isn't there","It doesn't matter","I can't do anything about it"],"answer":1,"why":"The crash happened, and Clara admits it. What she shrinks is how much it counts, because the client never saw it. That is the level called it doesn't matter: the problem is there, and it is made to look unimportant.","traps":{"0":"It isn't there would mean the crash never happened. Clara describes it in full, so she is not denying it, only making it small.","2":"I can't do anything about it would be a line about what she is able to do. She is not saying that, she is saying the crash was minor."},"example":"A school sports day, Saturday.<br>Mum: \u201cIt was only the relay. He dropped the baton once, and nobody got hurt.\u201d<br>Friend: \u201cRight, so it's nothing, then.\u201d"},{"type":"pick","who":"Maya","text":"<i>Maya sits on the kitchen counter in her scrubs with a glass of water. \u201cI'm not even tired. I've had worse shifts than this.\u201d The glass shakes a little when she lifts it.<\/i>","cue":"Tuesday, 6:50am, apartment 3B, the kitchen","options":["It isn't there","It can't change","It doesn't matter"],"answer":0,"why":"\u201cI'm not even tired\u201d says the tiredness is not there at all. The shaking glass is the evidence she leaves out, so this is it isn't there: the thing is denied, and the body says otherwise.","traps":{"1":"It can't change would be about a thing that cannot be moved, like the ward rota. Maya is talking about her own tiredness, and she says that is not there at all.","2":"It doesn't matter would mean the tiredness is there but small. Maya says there is none, so this is the wrong level."},"example":"A bus ride, Tuesday, 7pm.<br>Commuter: \u201cI'm not even hungry, I had a big lunch.\u201d Then she eats the whole packet of biscuits before the bus reaches the station."},{"type":"pick","who":"Omar","text":"<i>Omar says the process has been the same for three years, and the checklist did nothing. He looks at the table, not at you. \u201cThe process is what it is.\u201d<\/i>","cue":"Sunday, 5:31pm, the back table, flat voice","options":["It doesn't matter","It can't change","I can't do anything about it"],"answer":1,"why":"He does not call the problem small, and he does not say he is stuck. He says the process will not move. That is the level it can't change, where the problem is real and the change is said to be impossible.","traps":{"0":"It doesn't matter would be a line about how small the problem is. Omar is not calling it small, he is saying it will not move.","2":"I can't do anything about it would be about Omar himself. He is speaking about the process, the thing outside him, not about his own hands."},"example":"A pothole on the road to the station, Monday.<br>Rider: \u201cIt's been like that for years. The council won't touch it. That's just how it is.\u201d"},{"type":"pick","who":"Omar","text":"<i>He rubs the small of his back. \u201cI'm not the lead, so I'm not the one who can change it. I'm just the senior with the bad back, that's all.\u201d<\/i>","cue":"Sunday, 5:44pm, one hand on his lower back","options":["It can't change","I can't do anything about it","It isn't there"],"answer":1,"why":"Omar moves the change out of his reach and sets himself aside. He does not say the release is fine, and he does not say the process is fixed. He says he cannot act, which is the level I can't do anything about it.","traps":{"0":"It can't change would be about the process again. Here Omar is talking about who can act, and that is himself.","2":"It isn't there would deny that the release needs changing. He admits it does, and says only that the change is not his to make."},"example":"A village committee, Sunday.<br>Member: \u201cI only take the minutes. I can't decide anything about the hall.\u201d<br>Chair: \u201cThen write down who can, and we'll ask them.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"The Sunday boss. Six turns with Omar, with Nadia watching. At each turn ask what he is making smaller, and what your line does with it.","items":[{"type":"scene","title":"Sunday, 17:20, the back table","setting":"The Corner Table. The Friday release broke, the client call is on Tuesday, and Nadia is at the counter with the notebook open.","meters":{"you":50,"them":50},"beats":[{"who":"Omar","text":"\u201cThe release didn't fall over, it just wobbled. Nobody's going to notice.\u201d","cue":"turning the tea glass, not looking up","lines":[{"text":"\u201cIt wobbled on Friday, and the client noticed on Monday. Which part broke, Omar?\u201d","tag":"best","you":4,"them":2,"outcome":"He rubs his neck. \u201cThe sync job. Fine. The sync job.\u201d","why":"You name the event and ask for the part, so the problem stays where it is. You refuse the shrink without calling him a liar, which is the hard bit."},{"text":"\u201cOkay, it wobbled. Let's see what happens.\u201d","tag":"ok","you":-1,"them":1,"outcome":"He nods, glad the wobble can stay small.","why":"It is true that it wobbled, but let's see accepts that waiting is the plan. The problem gets made small and left alone."},{"text":"\u201cNobody's going to notice? The client already has. You should have checked.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Omar says \u201cRight, so it's my fault,\u201d and pushes the tea away.","why":"You turn his shrink into a charge against him. Now he can say you are blaming him, and the release drops out of the talk."}]},{"who":"Omar","text":"\u201cDaniel's going to shout about it anyway. He always shouts, so there's no point.\u201d","cue":"one shoulder up, a half-shrug","lines":[{"text":"\u201cDaniel shouting is a separate problem. Right now I need the sync job checked before Tuesday.\u201d","tag":"best","you":4,"them":2,"outcome":"He sighs. \u201cOkay. The sync job. It's the timestamps.\u201d","why":"You name the side step for what it is, a different question, and bring him back with a deadline. The tangent gets a label instead of a seat."},{"text":"\u201cDaniel can be a lot. Want to talk about how he is?\u201d","tag":"ok","you":-2,"them":3,"outcome":"Omar brightens. \u201cOh, he's the worst. He was on the phone at nine, and...\u201d","why":"This sounds like listening, and it is kind. But it follows him off the release and into Daniel, so the side step becomes the whole talk."},{"text":"\u201cShouting is what he does, so stop making excuses for the release.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Omar snaps, \u201cGreat, thanks,\u201d and turns his chair to the window.","why":"This pins the failure on Daniel and makes Omar defend him. The blame moves onto someone who is not at the table."}]},{"who":"Omar","text":"\u201cWe tried a checklist last year. The process is what it is. It's been like this for three years.\u201d","cue":"looking at the table, voice flat","lines":[{"text":"\u201cA checklist didn't work, so what would? Name one change you'd try, even a small one.\u201d","tag":"best","you":4,"them":2,"outcome":"He thinks for a second. \u201cThe pre-merge test. Maybe, if someone reviews it.\u201d","why":"You take the failed checklist as information and ask for one change. The process gets a test it can fail, and it can't change stops being the last word."},{"text":"\u201cThree years is a long time. That's tough, Omar.\u201d","tag":"ok","you":-1,"them":4,"outcome":"He nods and looks tired. \u201cIt is tough. Nobody listens.\u201d","why":"The sympathy is real, and it still agrees the process is fixed. The talk stays on how long it has lasted, not on what could move."},{"text":"\u201cThen it's hopeless, and you can stop trying. I'll tell the client that.\u201d","tag":"game","you":-6,"them":-5,"outcome":"The scene stops there. Omar looks up sharply, then away. \u201cDon't. It isn't hopeless.\u201d","why":"You hand him the whole level for free and add a threat on top. He gets his victory, and the client is pulled into the shrink."}]},{"who":"Omar","text":"\u201cI'm not the lead, so I'm not the one who can change it. I'm just the senior with the bad back.\u201d","cue":"rubbing the small of his back, not sitting straight","lines":[{"text":"\u201cYou're the senior on the sync job, so you can change how it's checked. Start with the timestamps.\u201d","tag":"best","you":4,"them":3,"outcome":"He straightens a little. \u201cYeah. Fine. The timestamps are mine to check.\u201d","why":"You answer the I can't with the part he does control. You name what he can do, and leave his title out of it."},{"text":"\u201cYou're not the one who has to fix everything. Go easy on your back.\u201d","tag":"ok","you":-1,"them":4,"outcome":"He says \u201cThanks, I will,\u201d and leans back, the release still broken.","why":"A caring line that takes the I can't at face value. It keeps his back in the talk and keeps his ability out of it."},{"text":"\u201cThen you've given up, and you're the one who'll be asked on Tuesday.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Omar's face closes. \u201cThanks for that,\u201d he says, and means the opposite.","why":"This is a charge with a deadline. It makes him defend the I can't, instead of looking at it."}]},{"who":"Omar","text":"\u201cAnyway, did you see the match last night? And this tea is actually decent here.\u201d","cue":"brightening, the way people do when a subject is closed","lines":[{"text":"\u201cI didn't see it. Back to the sync job, though. What do you need to check it?\u201d","tag":"best","you":4,"them":1,"outcome":"He laughs once and says, \u201cFine. A test box and a clear morning.\u201d","why":"You say you did not follow the match, which stops the tangent, and then you return to the question. The side step gets a short answer, and the question stays open."},{"text":"\u201cI didn't see it. Good tea, though. You're right about that.\u201d","tag":"ok","you":-1,"them":3,"outcome":"He grins, and the talk drifts. \u201cRight? Best cardamom I've had all week.\u201d","why":"This is friendly, and it agrees the tea is good. But the tangent has now taken the place of the question, and nobody comes back to the sync job."},{"text":"\u201cYou always change the subject when a problem gets real. Don't you think?\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Omar says nothing, and the room waits.","why":"This is a charge about his habit, and it makes the talk about the two of you. He can now defend the subject change, and the release drops out of the scene."}]},{"who":"Omar","text":"\u201cLook, let's leave it till Monday. We'll see how it goes. I just need a day off my back.\u201d","cue":"standing up, bag already on one shoulder","lines":[{"text":"\u201cMonday is fine, if you tell me today what you'll check first. Then I'll take the client email.\u201d","tag":"best","you":4,"them":3,"outcome":"He stops with the bag half on. \u201cThe timestamps first, and you take the email. Okay, yes.\u201d","why":"You accept Monday as a date and not as a shut door. You ask for one commitment now, so the leaving has to turn into a plan before he goes."},{"text":"\u201cOkay, Monday. Go and rest that back, Omar. You've carried enough this week.\u201d","tag":"ok","you":-2,"them":4,"outcome":"He smiles, relieved. \u201cThanks. You're a good one to work with.\u201d","why":"This is the kind-looking line, and it keeps the trap running. It cares for his back and makes you both feel good, but it accepts the shut door and leaves the sync job for Monday with no one on it."},{"text":"\u201cFine, leave it. It's only the release, after all. Nobody will notice.\u201d","tag":"game","you":-6,"them":-6,"outcome":"The scene stops there. Omar shrugs and walks out, and Nadia writes one word in her notebook.","why":"You say the shrink back in his own words and close the door with a shrug. The whole week's trap is in those last few words."}]}],"payoff":"Sunday, 6:10pm. The tea is cold, the sync job is still broken, and Nadia closes the notebook. \u201cOnce more,\u201d she says, \u201cand this time count the shrinking.\u201d","fallout":{"them":"Omar leaves before the tea is finished, and Nadia says the group starts at seven next week."}},{"type":"pick","who":"Nadia","text":"\u201cLet's stop there. What just happened? Say it in plain words.\u201d","cue":"pen in hand, the notebook open at last","options":["He kept making the problem smaller, then shut the topic down until Monday.","His back hurts, so he was tired and the talk just got short.","He asked us for help with the sync job, and nobody gave it."],"answer":0,"why":"He moved from it doesn't matter to it can't change, then to I can't do anything, and then changed the subject and shut the door until Monday. Each step made the release smaller, until nobody had to act.","traps":{"1":"It would blame his back and let the talk off the hook. His back is real, but the talk shows him shrinking the release step by step, and that is what happened.","2":"It would take his line at face value and turn the shrink into a request for help. He never named a task anyone could take, so it was a shrink dressed as a request."},"example":"A family WhatsApp group, Thursday.<br>Cousin: \u201cThe rent is too high, nothing to be done, it's always been like this.\u201d<br>Brother: \u201cYeah, whatever. Let's talk about the cricket instead.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. Use the book words: the level.","items":[{"type":"pick","who":"Nadia","text":"\u201cAt the third turn, Omar said the process is what it is. Which level of the Discount Matrix is that?\u201d","cue":"pen tapping once on the notebook","options":["Change possibilities: he calls the process fixed, so nothing gets tried.","Significance: he calls the problem small, so nobody looks at it.","Existence: he says the problem does not exist at all."],"answer":0,"why":"The process is what it is lands on change possibilities, the third of the four levels: the problem stays, and the change is said to be impossible. The Discount Matrix is the diagram that lays these levels out.","traps":{"1":"Significance would be a line about how small the problem is. At the third turn Omar does not call it small, he calls the process fixed, so the level is the other one.","2":"Existence would deny the problem. Omar has already admitted the release wobbled, so the problem is there, and what he shuts is the chance of changing it."},"example":"A water pipe in the building, Wednesday.<br>Neighbour: \u201cThe leak's been there since spring, and the office never fixes anything. That's just how it is.\u201d<br>You: \u201cThen let's write to them with the photos this week.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cOkay, Monday. Go and rest that back. That sounded kind, so why was it a trap?\u201d","cue":"looking at you over the notebook","options":["It accepted the shut door and wrapped it in care, so the sync job went into Monday with nobody on it, and the discount kept working.","It was rude, because it ended the talk before Omar had finished speaking.","It made a clear plan for Monday, so it cannot be part of a trap."],"answer":0,"why":"Kindness is not the test here. The line agreed to the shut door, and the problem stayed exactly as small as Omar had made it. Omar felt looked after, which lifted the meters, but nothing moved on the sync job. The books call the shrinking discounting, and a kind line that accepts it leaves the discount in place.","traps":{"1":"Ending the talk can be a cut, but here Omar had already closed it himself. The line agreed with him rather than stopping him, so rude is the wrong reason.","2":"A plan can still be a trap when it puts the decision with nobody. This plan had no task on it, so it was a shut door with a date on it."},"example":"A flat-share, Saturday.<br>Flatmate: \u201cThe boiler's been broken for ages. Nothing to be done, it'll be fine.\u201d<br>You: \u201cOkay, we'll talk about it when you're rested.\u201d The boiler is still broken the next Saturday."}]}],"debrief":{"nadia":"Omar never lied to you. He made the release smaller one step at a time: it doesn't matter, it can't change, I can't do anything, and then the match. The kindest line in the scene was the one that let him stop, so the thing to watch is the kind line that lets the shrink stand.","bookTerm":"Discount Matrix","bookNote":"The books call this discounting, ignoring part of a problem without realising it. The Discount Matrix is the diagram that lays discounts out by area, type and level, and the four levels here are existence, significance, change possibilities and personal abilities."},"reflection":{"prompt":"Which level did you shrink a problem onto this week, and what would a real choice on that level have looked like?"},"next":"6.1","baseStory":{"setting":"Friends & Community","blurb":"Omar waves away a broken release at the Corner Table, and Nadia watches how you answer."},"moreStories":[{"setting":"Home & Flatmates","blurb":"Sam shrugs off the red gas letter in the flat, Maya keeps score, and you stand between.","opener":{"setting":"Tuesday, 10:40pm. Hawthorn Court, apartment 3B, the kitchen. The red envelope has been on the fridge since Saturday, and the agent from the lettings office visits on Friday.","lines":[{"who":"Maya","text":"\u201cThree days that letter's been up there. I'm not saying anything. I'm only saying it's red.\u201d","cue":"wiping a counter that is already clean"},{"who":"Sam","text":"\u201cReally, it's nothing. They send those to everyone.\u201d","cue":"stirring noodles, back to the room"}],"ask":"Can you keep the gas letter on the table through six turns, and name each shrink Sam makes before you answer it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four lines, four levels. Each line shrinks the problem at one of four plain levels: it isn't there, it doesn't matter, it can't change, or I can't do anything about it. Tap the level the line lands on.","items":[{"type":"pick","who":"Maya","text":"<i>Maya folds the red envelope in half, then in half again. \u201cIt's only a late fee. I've paid worse and never said a word.\u201d<\/i>","cue":"Saturday, 8:15am, apartment 3B, by the fridge","options":["It doesn't matter","It isn't there","It can't change"],"answer":0,"why":"Maya admits the payment failed and calls it a late fee. What she shrinks is how much it counts, since she has paid worse. That is the level it doesn't matter: the problem is there, and it is made to look small.","traps":{"1":"It isn't there would mean Maya denied the late fee. She names it, so she is making it small, not wiping it out.","2":"It can't change would be a line about something that cannot move. Maya says nothing about change, only that the fee is trivial."},"example":"A bus stop, Monday.<br>Rider: \u201cIt's only a parking ticket. I've had worse.\u201d<br>Friend: \u201cSo you're not going to pay it?\u201d"},{"type":"pick","who":"Sam","text":"<i>Sam pats his pockets, the corner of an envelope showing from his jacket. \u201cWhat letter? I haven't seen any letter.\u201d<\/i>","cue":"Sunday, 11:05am, the hallway, one shoe on","options":["It can't change","It doesn't matter","It isn't there"],"answer":2,"why":"Sam says there is no letter while its corner pokes out of his jacket. That is it isn't there: the problem is denied, and the evidence is in his pocket.","traps":{"0":"It can't change would say the letter exists and nothing can alter it. Sam says there is no letter at all.","1":"It doesn't matter would admit the letter and call it small. Sam admits nothing."},"example":"A doctor's waiting room, Thursday.<br>Patient: \u201cWhat cough? I don't have a cough.\u201d Then she coughs into her scarf for a full minute."},{"type":"pick","who":"Maya","text":"<i>Maya turns her phone face down on the sofa arm. \u201cMr Pryce hasn't answered a message since spring. That's how this flat works.\u201d<\/i>","cue":"Monday, 7:30pm, the sofa","options":["It doesn't matter","It can't change","I can't do anything about it"],"answer":1,"why":"Maya says the agent ignores every message and that is how the flat works. The problem is real, and the change is called impossible. That is it can't change.","traps":{"0":"It doesn't matter would call the problem small. Maya is not calling it small, she says it will not move.","2":"I can't do anything about it would be about Maya's own hands. She speaks about the agent and the flat, the things outside her."},"example":"A lift in an office block, Wednesday.<br>Colleague: \u201cIt's been broken for a year. Facilities never answer. That's just how it is.\u201d"},{"type":"pick","who":"Sam","text":"<i>Sam turns the bin bag over in his hands. \u201cI'm hopeless with bills. If I ring them I'll only make it worse.\u201d<\/i>","cue":"Monday, 9:02pm, by the bins","options":["I can't do anything about it","It isn't there","It can't change"],"answer":0,"why":"Sam does not say the bills are fine, and he does not say the account is stuck. He says he is hopeless and would make it worse. That is I can't do anything about it: the problem is real and he sets himself aside.","traps":{"1":"It isn't there would deny the bills. Sam admits there is something to ring about, so it is not that.","2":"It can't change would put the stuck part in the system. Sam puts it in himself."},"example":"A choir rehearsal, Tuesday.<br>Singer: \u201cI'm tone deaf, I'd only spoil the harmony.\u201d<br>Leader: \u201cThen stand next to me and we'll try one line.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"The Sunday boss, moved into the flat. Six turns with Sam, and a closed door down the hall. At each turn ask what he is making smaller, and what your line does with it.","items":[{"type":"scene","title":"Tuesday, 22:40, the kitchen","setting":"Apartment 3B. The gas payment bounced twice, Mr Pryce from the lettings office visits on Friday at ten, and Maya has gone to her room with the door open a crack.","meters":{"you":50,"them":50},"beats":[{"who":"Sam","text":"\u201cIt's only two missed payments. Nobody cuts the gas off over two.\u201d","cue":"stirring noodles, back to the room","lines":[{"text":"\u201cIt's two bounced payments and a red letter, and the agent visits on Friday. Which account did they come out of?\u201d","tag":"best","you":4,"them":2,"outcome":"He taps the spoon on the pan. \u201cThe bills one. The joint one. It's, yeah, it's empty.\u201d","why":"You say what happened in plain facts and ask for the one he is dodging. The problem keeps its full size and he is not accused."},{"text":"\u201cProbably. Let's see if a third one comes.\u201d","tag":"ok","you":-1,"them":1,"outcome":"He nods, glad the post can decide.","why":"It is true that nobody has cut anything off, but waiting to see makes the bounce small and leaves it alone."},{"text":"\u201cNobody cuts it off? You forgot to top it up, again.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Sam says \u201cRight, so I'm the one who ruins things,\u201d and turns the hob off.","why":"You turn his shrink into a charge. Now he can say you are blaming him, and the account drops out of the talk."}]},{"who":"Sam","text":"\u201cMaya will go on about it in that notebook anyway. She writes everything down, so what's the point?\u201d","cue":"a glance at Maya's door","lines":[{"text":"\u201cHer notebook is a different talk. Tonight I need the gas account looked at before Friday.\u201d","tag":"ok","you":1,"them":1,"outcome":"He sighs. \u201cOkay. I'll look.\u201d He does not move.","why":"This names the side step and returns to the deadline, but it gives him nothing to do, so the looking stays a wish."},{"text":"\u201cShe does keep a lot of score. Want to talk about that?\u201d","tag":"ok","you":-2,"them":3,"outcome":"Sam brightens. \u201cEleven pages. I counted once, and...\u201d","why":"This sounds like listening, and it is kind. But it follows him off the gas and into Maya's notebook, so the side step becomes the whole talk."},{"text":"\u201cHer notebook is a separate question. Open the bank app and tell me what's in the bills account right now.\u201d","tag":"best","you":4,"them":2,"outcome":"He fishes out his phone. \u201cFour pounds. Okay. Four pounds.\u201d","why":"You label the tangent and bring him back with one small task. The notebook gets no seat, and the number comes out."}]},{"who":"Sam","text":"\u201cThe gas people never fix a payment. It's been like this since we moved in. It is what it is.\u201d","cue":"lifting the pan lid, putting it back","lines":[{"text":"\u201cTwo winters of the same letters. That wears you down, Sam.\u201d","tag":"ok","you":-1,"them":4,"outcome":"He nods and slumps. \u201cIt does. Nobody tells you it goes on.\u201d","why":"The sympathy is real, and it still agrees the thing is fixed. The talk stays on how long it has lasted, not on what could move."},{"text":"\u201cThen give up. I'll tell Mr Pryce that you did.\u201d","tag":"game","you":-6,"them":-5,"outcome":"The scene stops there. Sam looks up sharply. \u201cDon't. It isn't hopeless.\u201d","why":"You hand him the whole level for free and add a threat. He wins the point, and the agent is dragged into the shrink."},{"text":"\u201cThey haven't fixed it so far. What would get it fixed? Name one thing we could try, even a small one.\u201d","tag":"best","you":4,"them":2,"outcome":"He thinks. \u201cA new payment date. After pay day, maybe.\u201d","why":"You take the failed attempts as information and ask for one change. The situation gets a test it can fail, and it can't change stops being the last word."}]},{"who":"Sam","text":"\u201cI'm hopeless with bills. Maya does the numbers. I'd only make it worse.\u201d","cue":"rubbing one eye with the heel of his hand","lines":[{"text":"\u201cYou're not hopeless, you're tired. Leave it, I'll look at it for you.\u201d","tag":"ok","you":-1,"them":4,"outcome":"He says \u201cThanks, you're a star,\u201d and sits down. The app stays shut.","why":"A caring line that takes the I can't at face value. It keeps his tiredness in the talk and his ability out of it."},{"text":"\u201cYou set up the direct debit, so you can move the date. Open the app and we'll do it now.\u201d","tag":"best","you":4,"them":3,
