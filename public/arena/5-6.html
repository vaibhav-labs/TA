one, it'll be fine.\u201d<br>You: \u201cOkay, we'll talk about it when you're rested.\u201d The boiler is still broken the next Saturday."}]}]},{"setting":"Family","blurb":"Gran says she only stumbled on the back step, Dad has driven down, and Leo saw the fall.","opener":{"setting":"Sunday, 1:10pm. Hawthorn Court, Gran's kitchen downstairs. Soup on the hob, Leo under the table with the tablet, and Dad has just come in with his keys still in his hand.","lines":[{"who":"Dad","text":"\u201cLeo says you fell on the back step on Thursday.\u201d","cue":"standing at the door, keys in his fist"},{"who":"Gran","text":"\u201cIt was a stumble, that's all. Eat your soup before it gets a skin.\u201d","cue":"pulling her sleeve over her wrist"}],"ask":"Can you keep Gran's fall on the table through six turns, and name each shrink she makes before you answer it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four lines, four levels. Each line shrinks the problem at one of four plain levels: it isn't there, it doesn't matter, it can't change, or I can't do anything about it. Tap the level the line lands on.","items":[{"type":"pick","who":"Gran","text":"<i>Gran pulls her sleeve down over the mark on her forearm. \u201cIt's only a bruise. I've had worse off the oven door.\u201d<\/i>","cue":"Sunday, 1:12pm, Gran's kitchen, the soup on","options":["It isn't there","It doesn't matter","It can't change"],"answer":1,"why":"Gran admits the bruise and says the oven door has done worse. What she shrinks is how much it counts. That is the level it doesn't matter: the problem is there, and it is made to look small.","traps":{"0":"It isn't there would mean Gran denied the bruise. She names it, so she is making it small, not wiping it out.","2":"It can't change would be a line about something that cannot move. Gran says nothing about change, only that the bruise is minor."},"example":"A school sports day, Saturday.<br>Mum: \u201cIt was only the relay. He dropped the baton once, and nobody got hurt.\u201d<br>Friend: \u201cRight, so it's nothing, then.\u201d"},{"type":"pick","who":"Mum","text":"<i>Mum's voice comes small over the speaker. \u201cGran's fine, she told me herself. There's nothing wrong with her at all.\u201d<\/i>","cue":"Saturday, 7pm, on speaker, 600 km away","options":["It isn't there","I can't do anything about it","It doesn't matter"],"answer":0,"why":"Mum says nothing is wrong, on the strength of Gran's own word, while the fall happened two days before. That is it isn't there: the problem is denied, and nobody has looked.","traps":{"1":"I can't do anything about it would be Mum saying she is too far away to help. She says there is nothing to help with.","2":"It doesn't matter would admit something happened and call it small. Mum admits nothing."},"example":"A bus ride, Tuesday, 7pm.<br>Commuter: \u201cI'm not even hungry, I had a big lunch.\u201d Then she eats the whole packet of biscuits before the bus reaches the station."},{"type":"pick","who":"Dad","text":"<i>Dad jingles the car keys. \u201cThat step has been loose since before you were born. It's how the building is.\u201d<\/i>","cue":"Sunday, 1:25pm, in the kitchen doorway","options":["It doesn't matter","I can't do anything about it","It can't change"],"answer":2,"why":"Dad does not call the step harmless, and he does not say he is helpless. He says the step has always been like this and always will be. That is the level it can't change, where the problem is real and the change is called impossible.","traps":{"0":"It doesn't matter would call the step trivial. Dad is not calling it trivial, he says it will not move.","1":"I can't do anything about it would be about Dad's own hands. He speaks about the building, the thing outside him."},"example":"A pothole on the road to the station, Monday.<br>Rider: \u201cIt's been like that for years. The council won't touch it. That's just how it is.\u201d"},{"type":"pick","who":"Gran","text":"<i>Gran stirs the soup without looking up. \u201cI'm only the old woman downstairs. Who would listen to me?\u201d<\/i>","cue":"Sunday, 1:40pm, her back to the room","options":["It isn't there","It can't change","I can't do anything about it"],"answer":2,"why":"Gran does not say the step is fine, and she does not say the building is fixed. She says she is only the old woman downstairs. That is I can't do anything about it: the problem is real and she sets herself aside.","traps":{"0":"It isn't there would deny the step. Gran admits it is a problem and says she is the wrong person to raise it.","1":"It can't change would put the stuck part in the building. Gran puts it in herself."},"example":"A village committee, Sunday.<br>Member: \u201cI only take the minutes. I can't decide anything about the hall.\u201d<br>Chair: \u201cThen write down who can, and we'll ask them.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"The Sunday boss, moved into Gran's kitchen. Six turns with Gran, with Dad in the doorway and Leo under the table. At each turn ask what she is making smaller, and what your line does with it.","items":[{"type":"scene","title":"Sunday, 13:10, Gran's kitchen","setting":"Hawthorn Court, the flat downstairs. Soup on the hob, Leo under the table with the tablet, and Dad due back on the road at four. Gran says she will manage alone all week.","meters":{"you":50,"them":50},"beats":[{"who":"Gran","text":"\u201cIt was a little stumble. Nobody's hurt. Eat your soup before it gets a skin.\u201d","cue":"pulling the sleeve over her wrist","lines":[{"text":"\u201cYou stumbled on Thursday and Leo saw you land. Which hand did you put out, Gran?\u201d","tag":"best","you":4,"them":2,"outcome":"She turns the left hand over slowly. \u201cThe left. It's tender. That's all it is.\u201d","why":"You name the event and ask for the part, so the problem stays where it is. You refuse the shrink without calling her a fibber, which is the hard bit."},{"text":"\u201cOkay, a stumble. Let's see how the arm is tomorrow.\u201d","tag":"ok","you":-1,"them":1,"outcome":"She nods, glad the stumble can stay small.","why":"It is true that she stumbled, but let's see accepts that waiting is the plan. The fall gets made small and left alone."},{"text":"\u201cNobody's hurt? Leo says you cried out. You should have called someone.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Gran says \u201cSo I'm a nuisance now,\u201d and puts the ladle down.","why":"You turn her shrink into a charge. Now she can say you are scolding her, and the fall drops out of the talk."}]},{"who":"Gran","text":"\u201cYour father will fuss for an hour and then drive home. He always does, so there's no point.\u201d","cue":"a look at Dad in the doorway","lines":[{"text":"\u201cDad fussing is a separate talk. Right now I need to see that wrist before he leaves.\u201d","tag":"best","you":4,"them":2,"outcome":"She sighs. \u201cOh, all right. It's the left one. Hold it gently.\u201d","why":"You name the side step for what it is, a different question, and bring her back with a deadline. The tangent gets a label instead of a seat."},{"text":"\u201cDad can be a lot. Do you want to talk about how he is?\u201d","tag":"ok","you":-2,"them":3,"outcome":"Gran brightens. \u201cHe never sits down in this kitchen. Forty minutes, and he's checking the car.\u201d","why":"This sounds like listening, and it is kind. But it follows her off the fall and into Dad, so the side step becomes the whole talk."},{"text":"\u201cDad fusses because you hide things, so stop blaming him.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Dad says \u201cThanks very much,\u201d and walks out to the car.","why":"This pins the failure on Dad and makes Gran defend him. The blame moves onto someone who is not at the table."}]},{"who":"Gran","text":"\u201cThat step has been loose since your grandfather's day. The building office never comes. It is what it is.\u201d","cue":"stirring, not turning round","lines":[{"text":"\u201cThen it's hopeless, and you can stop asking. I'll tell Mrs Kale you said so.\u201d","tag":"game","you":-6,"them":-5,"outcome":"The scene stops there. Gran turns sharply. \u201cDon't. It isn't hopeless.\u201d","why":"You hand her the whole level for free and add a threat. She gets her victory, and Mrs Kale is pulled into the shrink."},{"text":"\u201cForty years of that step. It must wear you down, Gran.\u201d","tag":"ok","you":-1,"them":4,"outcome":"She nods and looks tired. \u201cIt does. Nobody sees how long.\u201d","why":"The sympathy is real, and it still agrees the step is fixed. The talk stays on how long it has lasted, not on what could move."},{"text":"\u201cThey haven't come so far. What might make them come? Name one thing to try, even a small one.\u201d","tag":"best","you":4,"them":2,"outcome":"She thinks. \u201cMrs Kale has photos from the winter. A letter with photos, maybe.\u201d","why":"You take the office's silence as information and ask for one change. The step gets a test it can fail, and it can't change stops being the last word."}]},{"who":"Gran","text":"\u201cI'm only the old woman downstairs. Nobody listens to me, so what could I do?\u201d","cue":"one hand flat on the counter","lines":[{"text":"\u201cYou shouldn't have to chase anyone at your age. Sit down, I'll do all of it.\u201d","tag":"ok","you":-1,"them":4,"outcome":"She says \u201cBless you,\u201d and sits, rubbing her wrist. The letter stays unwritten.","why":"A caring line that takes the I can't at face value. It keeps her age in the talk and her ability out of it."},{"text":"\u201cThen you've given up, and you're the one who'll be on that step in the dark.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Gran's face closes. \u201cThank you for that,\u201d she says, and means the opposite.","why":"This is a charge with a deadline. It makes her defend the I can't, instead of looking at it."},{"text":"\u201cYou can sign a letter, and you know the whole building. Mrs Kale will sign under you. Start with the photos.\u201d","tag":"best","you":4,"them":3,"outcome":"She straightens a little. \u201cYes. Fine. They're in the biscuit tin. Fetch it.\u201d","why":"You answer the I can't with the part she does control. You name what she can do and leave her age out of it."}]},{"who":"Gran","text":"\u201cAnyway, have you seen Leo's new tablet game? And this soup has come out lovely.\u201d","cue":"brightening, the way people do when a subject is closed","lines":[{"text":"\u201cI haven't. And the soup is lovely, you've outdone yourself.\u201d","tag":"ok","you":-1,"them":3,"outcome":"She smiles and the talk drifts. \u201cLeeks. A little pepper, that's all.\u201d","why":"This is friendly and agrees the soup is good. But the tangent has now taken the place of the question, and nobody comes back to the step."},{"text":"\u201cI haven't seen it. Back to the step, though. Which day is the office open?\u201d","tag":"best","you":4,"them":1,"outcome":"She laughs once. \u201cTuesdays, till noon. Fine. Tuesdays.\u201d","why":"You say you have not seen the game, which stops the tangent, and then you return to the question. The side step gets a short answer, and the question stays open."},{"text":"\u201cYou always change the subject when it gets real. Don't you think?\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Gran says nothing, and Leo looks up from under the table.","why":"This is a charge about her habit, and it makes the talk about the two of you. She can now defend the subject change, and the step drops out of the scene."}]},{"who":"Gran","text":"\u201cLet's leave it till Tuesday, shall we? Eat. I'll see how the arm is.\u201d","cue":"ladle in hand, back already turned","lines":[{"text":"\u201cTuesday is fine, if you tell me now what you'll do first. Then I'll photograph the step before I go.\u201d","tag":"best","you":4,"them":3,"outcome":"She stops with the ladle in the air. \u201cThe letter first. You take the photographs. Yes.\u201d","why":"You accept Tuesday as a day and not as a shut door. You ask for one commitment now, so the leaving has to turn into a plan before Dad goes."},{"text":"\u201cFine, leave it. It's only a step, after all. Nobody gets hurt.\u201d","tag":"game","you":-6,"them":-6,"outcome":"The scene stops there. Gran shrugs and sets out the bowls, and Dad's keys go back in his pocket.","why":"You say the shrink back in her own words and close the door with a shrug. The whole lunch's trap is in those last few words."},{"text":"\u201cTuesday, then. Rest that arm, Gran, you've done enough for all of us.\u201d","tag":"ok","you":-2,"them":4,"outcome":"She smiles, relieved. \u201cThank you, love. You're a good one.\u201d","why":"This is the kind-looking line, and it keeps the trap running. It cares for her and makes you both feel warm, but it accepts the shut door and leaves the step and the wrist for Tuesday with nobody on them."}]}],"payoff":"Sunday, 13:45. The soup goes cold, the step stays loose, and Leo looks up from the tablet for the first time. Dad's keys are still in his hand.","fallout":{"them":"Gran draws her sleeve down over the bruise and says nothing more until the dishes."}},{"type":"pick","who":"Nadia","text":"\u201cLet's stop there. What happened in that kitchen? Say it in plain words.\u201d","cue":"Sunday evening, the back table, after you have told her all of it","options":["She kept making the fall smaller, then shut it until Tuesday.","She was proud and stubborn, so the talk got short and ended before lunch.","She asked the family for help with the step, and nobody gave her any."],"answer":0,"why":"She moved from it doesn't matter to it can't change, then to I can't do anything, then changed the subject and shut the door until Tuesday. Each step made the fall smaller until nobody had to act.","traps":{"1":"It would blame her pride and let the talk off the hook. She may be proud, but the turns show her shrinking the fall step by step.","2":"It would take her words at face value as a request. She never named a task anyone could take, so it was a shrink dressed as a request."},"example":"A family WhatsApp group, Thursday.<br>Cousin: \u201cThe rent is too high, nothing to be done, it's always been like this.\u201d<br>Brother: \u201cYeah, whatever. Let's talk about the cricket instead.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. Use the book words: the level.","items":[{"type":"pick","who":"Nadia","text":"\u201cAt the third turn, Gran said it is what it is. Which level of the Discount Matrix is that?\u201d","cue":"pen tapping once on the notebook","options":["Existence: she says the fall did not happen, so nothing needs doing.","Change possibilities: she calls the step fixed, so nothing gets tried.","Significance: she calls the stumble small, so nobody looks at it."],"answer":1,"why":"It is what it is lands on change possibilities, the third of the four levels: the problem stays, and the change is called impossible. The Discount Matrix is the diagram that lays these levels out.","traps":{"0":"Existence would deny the fall. Gran had already admitted she stumbled, so the problem is there, and what she shuts is the chance of changing it.","2":"Significance would call the problem small. At the third turn Gran calls the step fixed, so the level is the other one."},"example":"A water pipe in the building, Wednesday.<br>Neighbour: \u201cThe leak's been there since spring, and the office never fixes anything. That's just how it is.\u201d<br>You: \u201cThen let's write to them with photos this week.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cTuesday, then. Rest that arm, Gran. That sounded kind, so why was it a trap?\u201d","cue":"looking at you over the notebook","options":["It was rude, because it stopped Gran before she had finished what she meant to say.","It made a plan for Tuesday, so it cannot be part of a trap, however warm it was.","It accepted the shut door and wrapped it in care, so the step stayed loose."],"answer":2,"why":"Kindness is not the test here. The line agreed to the shut door, so the problem stayed exactly as small as Gran had made it. Gran felt looked after, which lifted the meters, but nothing moved on the step or the wrist. The books call the shrinking discounting, and a kind line that accepts it leaves the discount in place.","traps":{"0":"Stopping someone can be a cut, but Gran had already closed the talk herself. The line agreed with her instead of stopping her, so rude is the wrong reason.","1":"A plan can still be a trap when nobody owns it. This plan had no task on it, so it was a shut door with a day written on it."},"example":"A team chat, Friday.<br>Colleague: \u201cThe build's been flaky for weeks. It'll sort itself out.\u201d<br>You: \u201cFair enough. Take the weekend.\u201d The build is still flaky on Monday."}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://vaibhav-labs.github.io/TA/arena/","next":{"slot":"6.1","title":"Four Corners of OK","url":"https://vaibhav-labs.github.io/TA/arena/6-1.html"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  // If the hub's setting filter sent us here with ?setting=X and this game has that
  // setting, go straight into it instead of asking again on a "choose a setting" screen.
  var PRESET_STORY = -1;
  try {
    var wantSetting = new URLSearchParams(window.location.search).get("setting");
    if (wantSetting) {
      for (var si = 0; si < STORIES.length; si++) {
        if (STORIES[si].setting === wantSetting) { PRESET_STORY = si; break; }
      }
    }
  } catch (e) { /* URLSearchParams unsupported: fall through to the picker */ }
  if (PRESET_STORY >= 0) useStory(PRESET_STORY);
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: (MULTI && PRESET_STORY < 0) ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
