<script>window.TA_GAME = {"slot":"6.4","setting":"Friends & Community","title":"Three Everyday Plans","world":6,"worldName":"The Story You Wrote","week":6,"weekName":"The Story You Wrote","mechanic":"Choice-story","concept":"After this one you can name the three everyday banal scripts, play one whole day in each, and say which one is built on talking a child out of what she sees and thinks.","plainWord":"the Plan","bookTerm":"Banal scripts","bookIdea":"Banal scripts are the ordinary, unnoticed scripts, and the books name three: Lovelessness, built on rules that ration strokes; Mindlessness, built on discounting and messages against thinking; and Joylessness, built on cutting a child off from the body.","bookSource":"Scripts People Live, ch. 6 to 10","opener":{"setting":"Sunday, 9:15am. The Corner Table, the window table. Nadia lays three paper cards in a row, each with a day written on it.","lines":[{"who":"Nadia","text":"\u201cThree kinds of day. You have lived all three this week, most of them before breakfast.\u201d","cue":"turning each card face up"},{"who":"Omar","text":"\u201cI've had all three this month, and one of them was a Tuesday.\u201d","cue":"tired, arms folded, not smiling"}],"ask":"Spot the day from a single moment, then play one whole day in each. Watch what the day does to the people in it, and to you."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Three short moments. Each one belongs to one of the three days. The cold day holds back the nods. The blur day talks away what you notice and leaves no room to think. The flat day switches off pleasure and the body's signals.","items":[{"type":"pick","who":"Daniel","text":"\u201cGood morning? No need. Start with the numbers.\u201d","cue":"rain on the glass, nobody else says a word","options":["the cold day","the blur day","the flat day"],"answer":0,"why":"Nobody is greeted and nothing is offered. The room has no warm nods at all, and the work is the only thing on the table. That is the cold day.","traps":{"1":"This would be the blur day if someone had noticed something and been talked out of it. Nobody here is arguing a point, only refusing to say hello.","2":"This would be the flat day if the colour had gone out of things and nobody minded. Daniel is not dull. He is handing out work and withholding everything else."},"example":"A county office, Monday. The clerk never looks up from the counter and says \u201cNext\u201d before you have finished the form."},{"type":"pick","who":"Maya","text":"\u201cEat, eat. No, don't sit, I'll put it in a bowl. And nothing's wrong with the rota, you're imagining it.\u201d","cue":"you asked about the new rota a moment ago, the bus already at the stop, her phone buzzing on the counter","options":["the cold day","the blur day","the flat day"],"answer":1,"why":"You noticed something about the rota, and the answer talks it away before there is time to look. The food and the hurry cover the gap. What you saw is argued out of existence, which is the blur day: the day where noticing and thinking never get a turn.","traps":{"0":"This would be the cold day if the room had gone silent and nobody had offered anything. Here food is being pushed across the counter, which is a kind of warmth. What goes missing is the room to think about what you saw.","2":"This would be the flat day if the pleasure had gone out of the morning. Maya is moving fast and the morning is full, and the problem is that what you noticed gets waved off."},"example":"A garage, Saturday. A woman says the car pulls to the left. The mechanic says \u201cIt's fine, you're imagining it,\u201d and she drives away not sure."},{"type":"pick","who":"Dad","text":"\u201cWe're fine. Nothing to report. Back's a bit sore, so I've had a tablet and a strong coffee.\u201d","cue":"the television on mute, a building society letter unopened on the table","options":["the cold day","the blur day","the flat day"],"answer":2,"why":"Nothing is wrong enough to fix, and nothing is good enough to enjoy. The sore back gets a tablet instead of a look, the coffee is for getting through, and the letter stays shut. That is the flat day, where the body's signals, pleasant or not, are switched off.","traps":{"0":"This would be the cold day if the call were hostile or pointed. Dad is not pushing anyone away. He is just not offering anything to look at.","1":"This would be the blur day if Dad were talking you out of something you had noticed. Nobody is arguing here, only a quiet that goes on for a while."},"example":"A grandmother on a Sunday call: \u201cThe tea is fine. The knees are fine. Nothing to say.\u201d The cricket is on mute, and it is the same afternoon as last week."}]},{"level":"Play","label":"Play, the week in motion","intro":"Play each day through, in order. The Heckler talks in italics, in your head. You can hear it, and you don't have to do what it says.","items":[{"type":"scene","title":"Monday, the cold day","setting":"Monday, 9:10am. Halden, by the station, the glass room on the fourth floor, rain on the window. <i>The Heckler, in your head: 'Nobody in here does warm. Get on with the job.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Daniel","text":"\u201cYou've got the client numbers? Put them up. I don't need to know how your weekend was.\u201d","cue":"not looking up from his laptop","lines":[{"text":"\u201cHere they are. The third column is a week out, so I've marked it. Can we fix it before eleven?\u201d","tag":"best","you":4,"them":2,"outcome":"He scrolls back, finds the column, and says 'Fine, fix it.' There is a job on the table now, and the room is a little less cold.","why":"It gives him a fact and a deadline. The cold day gives no warm nods, so you ask for a fix he can say yes to. That is a clean adult move, and it doesn't need him to be warm."},{"text":"\u201cSorry, sorry, it's probably my mistake. I'll redo the whole thing.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"He nods without looking up. You now own a day of work he never asked for.","why":"This is Sam's apology in a suit. It takes the weight off his face and puts it on yours. Nothing gets fixed, and the cold day gets to stay cold."}]},{"who":"Daniel","text":"\u201cThe fix is in. But the client also wants the old figure. Why isn't it there?\u201d","cue":"tapping the screen with a pen, once per word","lines":[{"text":"\u201cThat's fair. The old figure is in the appendix, page nine. I can move it to the front if you want.\u201d","tag":"best","you":4,"them":3,"outcome":"He turns to page nine. 'Move it up,' he says, and for a second the corner of his mouth moves.","why":"You answer the question he asked, then offer a choice. Daniel treats someone who can decide as worth talking to, and a choice is the nearest thing to a warm nod this room allows."},{"text":"\u201cIt isn't there because I didn't think they'd want it.\u201d","tag":"ok","you":0,"them":-2,"outcome":"'Didn't think,' he repeats. The pen taps twice.","why":"True, and it puts you in the wrong. The cold day loves that. No nod comes back, and the next question will be harder."},{"text":"\u201cRight, I'm the problem again. Everyone else is always right, aren't they?\u201d","tag":"game","you":2,"them":-4,"outcome":"The spike feels good for a second, then the room goes colder.","why":"A trap move: you make yourself the one who gets hurt, so both of you get a small hit of drama and nobody gets any work done. It ends the meeting early."}]},{"who":"Omar","text":"\u201cDid you see the release notes? Don't bother, I'll do them.\u201d He doesn't wait for an answer.","cue":"already walking past your desk with a mug","lines":[{"text":"\u201cI'd like to read them, Omar. Can you send me the database section? I'll go through it tonight.\u201d","tag":"best","you":3,"them":2,"outcome":"He stops, half turns, and says 'Sure.' It is small, and he takes it.","why":"You ask for one specific thing. Omar has seen this before and is tired, so a small, real request lands better than sympathy would."},{"text":"\u201cOkay.\u201d (you go back to your screen)","tag":"ok","you":-1,"them":-1,"outcome":"Omar shrugs and walks on. Nothing bad happens, and nothing warm does either.","why":"No harm and no nod. The cold day is kept going by silence."}]},{"who":"Daniel","text":"\u201cNine tomorrow. Have the fixed sheet in my inbox by eight.\u201d The lift doors shut on his last word.","cue":"5:30pm, the lift, his phone already at his ear","lines":[{"text":"\u201cNine it is. The sheet will be there by eight.\u201d","tag":"best","you":3,"them":1,"outcome":"The doors close on his nod. You have a time and a thing, which is what this room runs on.","why":"A time and a thing. The cold day runs on logistics, so give the logistics back, clearly and once."},{"text":"\u201cRight. Nine.\u201d (you watch the floor numbers go down)","tag":"ok","you":-2,"them":0,"outcome":"The time is agreed, and you spend the evening wondering whether he meant eight or nine.","why":"A time is agreed and the thing is left vague. Vague work is anxious work, and the cold day keeps you guessing."}]},{"who":"Mum","text":"\u201cDid you eat? Don't say yes just to stop me. Tell me what you ate.\u201d","cue":"10:40pm, the phone on the bed in apartment 3B, a text with three dots","lines":[{"text":"\u201cChicken and rice, at the desk, and it was cold. Tell me about your knees, Mum. I want the proper version.\u201d","tag":"best","you":4,"them":4,"outcome":"She sends a voice note about the knees and the neighbour's son. It is ten minutes of warmth.","why":"A true answer and a question that gives her the floor. Mum keeps a ledger of what she gives you, so a real answer and a real question put something back on her side."},{"text":"\u201cYes, Mum. Everything's fine.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She sends a thumbs up and a sad face. The ledger gets one more line.","why":"Short, and not harmful. It keeps the cold day cold, and Mum keeps counting."}]}],"payoff":"Daniel gives the appendix to Clara before lunch, and the meeting ends. You were right about the room, and the room stayed cold.","fallout":{"them":"Daniel's meter hits zero. He shuts the laptop, says 'We're done', and leaves you with the rain."},"example":"A county office with a clerk who never looks up. The citizen who puts every question in writing learns that writing is the only warmth on offer."},{"type":"scene","title":"Tuesday, the blur day","setting":"Tuesday, 6:50am to 6:40pm. Apartment 3B, the bus to the station, the desk at Halden. <i>The Heckler, in your head: 'Keep moving. If you stop, you'll have to think about it.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Maya","text":"\u201cTea's on. Eat, eat. No, don't sit, I'll put it in a bowl.\u201d She is already at the sink with her back to you.","cue":"6:50am, the kitchen, the night-shift uniform still on","lines":[{"text":"\u201cSit with me for two minutes, Maya. How was the night?\u201d","tag":"best","you":4,"them":5,"outcome":"She sits, which is rare, and tells you about a patient who asked for her name. Then she laughs once.","why":"A question about her, and two minutes that aren't about the bowl. The blur day leaves no room to think, so two minutes is a real gift, and the question lands."},{"text":"\u201cThanks, I'll grab it on the bus.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She nods and runs the bowl to the sink. The bus is already at the stop.","why":"Polite and fast, and the blur keeps its hold. Nobody has been given anything, and nobody has been asked anything."}]},{"who":"Sam","text":"\u201cSorry, sorry, I owe you for the milk again. Also I'm late. Is that your bag on the seat?\u201d","cue":"8:10am, the bus, his phone at his ear, bag on the seat beside you","lines":[{"text":"\u201cBag off the seat, please. And the milk is Friday, Sam, not someday.\u201d","tag":"best","you":5,"them":2,"outcome":"He moves the bag and says 'Friday, Friday, promise,' as the bus lurches.","why":"You say what you need and set a day. The blur runs on 'sorry' and 'later'. A date is the one thing that breaks the loop."},{"text":"\u201cIt's fine, forget it.\u201d (you turn to the window)","tag":"ok","you":-2,"them":1,"outcome":"He says 'You're the best', and the milk debt grows by another week.","why":"Easy and kind, and it lets the blur keep going. The debt stays open, and the next apology is already on its way."}]},{"who":"Clara","text":"\u201cDid you see the cell? I've done it four times. Never mind. Lunch?\u201d She is already eating over her keyboard.","cue":"1:05pm, the Halden desks, a spreadsheet open","lines":[{"text":"\u201cGo on, eat with me. Show me the cell that's giving you trouble.\u201d","tag":"best","you":4,"them":4,"outcome":"She puts her fork down, turns the screen, and shows you. It takes ten minutes, and nobody checks a phone.","why":"Taking a break from the screen and asking about the problem both cut through the blur. You are looking with her, so the fixing stays hers."},{"text":"\u201cSorry, I've got the deck due. Maybe later.\u201d","tag":"ok","you":0,"them":-2,"outcome":"She nods and goes back to the cell. The deck is real, and the later never comes.","why":"Honest, and it keeps the blur going. Real work and a closed door can sit side by side, and the day runs on the door."},{"text":"\u201cFour times? Look at me, on since seven. Nobody has a day like mine.\u201d","tag":"game","you":3,"them":-3,"outcome":"She laughs and says 'Sure, you win', and you both go back to the screens.","why":"A trap move: you turn the busy into a contest, and the hour goes on who is most tired. It ends the scene early."}]},{"who":"Mum","text":"\u201cYou're busy, I know. Just tell me when, and I'll wait.\u201d","cue":"6:40pm, the bus home, the phone buzzing three times in your hand","lines":[{"text":"\u201cI'm on the bus, Mum. I'll ring you at nine, properly, not in pieces.\u201d","tag":"best","you":4,"them":2,"outcome":"She says 'Nine, then,' and you both know she will count the hours until then.","why":"A time for a real call. The blur lets calls slide, and a time is how you stop the slide."},{"text":"(you let it ring out and put the phone face down)","tag":"ok","you":-2,"them":-4,"outcome":"A four-minute voicemail about the knees arrives and sits in your inbox all evening.","why":"The easiest move, and the blur wins the evening. Nothing is said, and the ledger grows."}]}],"payoff":"Clara laughs and goes back to her screen, and the hour is spent on who is busiest. Neither of you is any less tired by six.","example":"A school office, Thursday. A parent says the bus times look wrong. The clerk says \u201cIt's always been like that, you're imagining it,\u201d and the parent drops the question."},{"type":"scene","title":"Sunday, the flat day","setting":"Sunday, 2:15pm, apartment 3B, the sofa, the fan turning at one speed. <i>The Heckler, in your head: 'Fun is for people with time. You have bills.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cLet's go out. There's a new place by the lake with cold coffee, supposed to be brilliant. My treat.\u201d He already has his shoes on.","cue":"holding up his car keys like a prize","lines":[{"text":"\u201cThat sounds good. Give me twenty minutes to find a shirt and I'm in.\u201d","tag":"best","you":4,"them":4,"outcome":"He cheers, and the flat has a sound in it for the first time today.","why":"A yes with a time attached. The flat day shuts doors without a bang, and a plain yes opens one."},{"text":"\u201cMaybe. I've still got the bills to sort.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"He sighs, 'The bills are always there,' and goes alone.","why":"The bills are real, and the answer is still a closed door. It hands the flat day a point it hasn't earned."},{"text":"\u201cCold coffee? Nice for some. Yes, but I'm the one with the rent and Gran's knees.\u201d","tag":"game","you":1,"them":-4,"outcome":"Sam says 'Okay, okay' and goes to the lake alone.","why":"A trap move: a yes that is really a no, followed by a list of reasons. The reasons do the refusing, and the scene ends early."}]},{"who":"Dad","text":"\u201cWe're fine. Nothing to report. Don't come home for it.\u201d","cue":"3:40pm, a phone call, the kitchen behind him, the television on mute","lines":[{"text":"\u201cOkay, Dad. I'm glad you're fine. If there's one thing you're not fine about, I'd like to hear it.\u201d","tag":"best","you":4,"them":2,"outcome":"A long pause. 'The gutter's blocked. Your mother is annoyed.' It is more than he has said all month.","why":"You accept his 'fine' without taking it back, and you leave a small door open. Dad's wall is built to be leaned on gently. A small question gives him a door to walk through."},{"text":"\u201cGood. Tell Mum I'll ring.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"'Yes,' he says, and the call is over in a minute.","why":"Polite and quick, and it shuts the call. The flat day gets its ordinary Sunday back."}]},{"who":"Gran","text":"\u201cThe building society sent a letter again. My knees are no better, and Leo's school wants money for his shoes. Nobody tells me the price.\u201d She stands in the doorway with a plate of pudding.","cue":"5:10pm, the doorway, the plate held out in both hands","lines":[{"text":"\u201cThat's a lot of letters, Gran. Sit a minute, and I'll read the letter with you.\u201d","tag":"best","you":4,"them":5,"outcome":"She sits, hands over the envelope, and for once stops talking about her knees.","why":"You name the load and offer a specific job, then invite her to sit. What the flat day lacks is company in a small task."},{"text":"\u201cOh, the building society again. I'm sure it'll sort itself out.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"'Yes, yes,' she says, and the plate stays in the doorway.","why":"True-sounding and useless. The flat day likes this kind of kindness, because it changes nothing."}]},{"who":"Mum","text":"\u201cDid you eat? Did the rent go? When will you come home, then?\u201d She is counting, and you can hear a pot on her stove.","cue":"9:00pm, the sofa, the fan at one speed","lines":[{"text":"\u201cThe rent's paid, Mum. I'd like to hear about your knees properly, not just count them.\u201d","tag":"best","you":3,"them":4,"outcome":"She goes quiet, then tells you about the knees in full, and about the neighbour's son.","why":"A true answer, then a turn toward her. Mum's ledger is about what you owe. Your best line gives her something to receive, and it comes from you."},{"text":"\u201cYes, Mum. Rent's paid. Everything's fine.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"'Good,' she says, 'then you won't mind if I worry.'","why":"Harmless, and it closes the ledger without opening anything. The flat day wins the last line of the day."}]}],"payoff":"Sam says 'Okay, okay' and goes to the lake alone. You spend the afternoon listing the things you can't do, and nobody offers to help with any of them.","example":"A retired teacher on a park bench, Sunday. The same pigeons, the same \u201cNothing to report\u201d for the grandchildren, and the same bench the following week."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cMaya told you that you were imagining the rota. Which banal script is built on talking a child out of what she sees and thinks?\u201d","cue":"stirring her tea, watching the room","options":["Lovelessness: built on the stroke economy, so the person cannot get or give the strokes they need and feels unloved.","Mindlessness: built on messages against thinking, with discounting as its cornerstone, so the person feels unable to cope and learns to doubt what they notice.","Joylessness: built on cutting the child off from the body, so pleasure and pain both go dull and are handled with a tablet or a coffee."],"answer":1,"why":"The books call these banal scripts. Mindlessness is the one built on messages against thinking, with discounting as its cornerstone. A child who is talked out of what she sees learns to doubt her own eyes. The other two rest on other things: the stroke economy for Lovelessness, and a body cut off from its signals for Joylessness.","traps":{"0":"Lovelessness would send the talk to the cold, and someone would ask about warmth. Maya's line is warm enough and rushed, and the problem in it is that what you noticed has been waved off.","2":"Joylessness would send the talk to the body and to fun, and someone would ask whether you were having any. Maya's line is about the rota, and what it does is argue you out of what you saw."},"example":"A kitchen, Tuesday. A girl says the milk smells off. Her father says \u201cNothing's wrong with it, you're imagining things,\u201d and drinks it himself. She learns to stop saying what she notices."}]}],"debrief":{"nadia":"Three days, and none of them needed a villain. Everyone has a bit of all three, and one usually shows most. Look at the day that felt most ordinary, because banal scripts go unnoticed.","bookTerm":"Banal scripts","bookNote":"The books call these banal scripts: Lovelessness, Mindlessness and Joylessness, the three everyday scripts that touch everyone to some degree, with one usually showing most."},"reflection":{"prompt":"Which of the three days did you live most this week, and what did you do at the moment it could have turned?"},"next":"6.5","baseStory":{"setting":"Friends & Community","blurb":"At a cafe table Nadia lays out three kinds of day, and the group plays one of each."},"moreStories":[{"setting":"Family","blurb":"Gran's birthday lunch is on Sunday, and her rules, her stairs and her silence all get a say.","opener":{"setting":"Friday, 6:40pm. Gran's kitchen in the flat downstairs, the cake tin on the table, the lid still on.","lines":[{"who":"Gran","text":"\u201cSeventy-nine is not an age that needs candles. Put the lid back on that.\u201d","cue":"without turning from the stove"},{"who":"Leo","text":"\u201cIs it a secret cake? I'm good at secrets. I'm bad at waiting.\u201d","cue":"under the table, tablet face down"}],"ask":"Spot the day from a single moment, then play one whole day in each. Watch what the day does to the people in it, and to you."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Three short moments from one week. Each one belongs to one of the three days. The cold day holds back the nods. The blur day talks away what you notice and leaves no room to think. The flat day switches off pleasure and the body's signals.","items":[{"type":"pick","who":"Gran","text":"\u201cSeventy-nine, and no speeches. Hugs are for after the soup. Eat while it's hot.\u201d","cue":"Thursday, ladling soup in the flat downstairs, Leo's arms already open beside her chair","options":["the flat day","the blur day","the cold day"],"answer":2,"why":"Nothing is argued and nothing is dull. The warmth is simply held back by a rule: hugs wait, speeches are out, and the soup comes first. A house that rations its nods is living the cold day.","traps":{"0":"This would be the flat day if Gran seemed numb to the soup and the birthday alike. She is brisk and busy, and she has a rule about when warmth is allowed.","1":"This would be the blur day if Leo had said something he noticed and Gran had talked him out of it. Nobody is being argued with. A hug is being put off."},"example":"A waiting room, Tuesday. The receptionist says \u201cSit. Don't chat. Your name will be called.\u201d Nobody looks up for forty minutes."},{"type":"pick","who":"Mrs Kale","text":"\u201cThe lift shudders? It only does that when it's full. You're imagining it, dear. Take a biscuit.\u201d","cue":"Wednesday, the lobby at Hawthorn Court, you had just said Gran swayed when the lift jolted","options":["the blur day","the cold day","the flat day"],"answer":0,"why":"You noticed something real, and the answer talks it away before anyone looks. The biscuit fills the gap where a second look should go. What you saw is argued out of existence, which is the blur day.","traps":{"1":"This would be the cold day if the lobby had gone silent and nobody offered anything. A biscuit is on offer. What is missing is the room to think about what you saw.","2":"This would be the flat day if the pleasure had drained out of the afternoon. Mrs Kale is lively and chatty, and what goes missing is your own noticing."},"example":"A garage, Saturday. A woman says the car pulls to the left. The mechanic says \u201cIt's fine, you're imagining it,\u201d and she drives off not sure."},{"type":"pick","who":"Dad","text":"\u201cSunday? Whatever you like. Cake, no cake, same to me. Knee's wrapped. Nothing else to say.\u201d","cue":"Thursday night, the phone, the television on mute, half a sandwich going dry on the arm of the chair","options":["the cold day","the flat day","the blur day"],"answer":1,"why":"Cake or no cake is all the same to him, and the knee gets a bandage instead of a look. Nothing hurts enough to fix and nothing pleases enough to want. That is the flat day, where the body's signals are switched down.","traps":{"0":"This would be the cold day if the call were sharp or closed on purpose. Dad is not pushing you off. He has no wish to offer, that is all.","2":"This would be the blur day if he were talking you out of something you had said. Nobody is arguing here, only a quiet that goes on."},"example":"A neighbour on the stairs: \u201cHip? Never mind it. Two tablets and carry on. The weather is the weather.\u201d Same stairs, same line, the following week."}]},{"level":"Play","label":"Play, the week in motion","intro":"Play each day through, in order. The Heckler talks in italics, in your head. You can hear it, and you don't have to do what it says.","items":[{"type":"scene","title":"Friday, the cold day","setting":"Friday, 6:40pm. Gran's kitchen in the flat downstairs, the cake tin on the table with its lid still on. <i>The Heckler, in your head: 'Don't make a fuss. A fuss costs.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Gran","text":"\u201cSeventy-nine is not an age for candles. Sit. Eat. We don't do speeches in this house.\u201d","cue":"the soup ladle in her fist, the kitchen timer ticking","lines":[{"text":"\u201cNo speeches, then. One favour: let Leo give you his drawing before the soup. Two minutes.\u201d","tag":"best","you":4,"them":2,"outcome":"She looks at the clock, then at Leo, and says 'Two minutes, then.' The drawing comes out from under the table.","why":"You keep her rule and ask for one small, specific thing inside it. The cold day gives no warm nods, so you find the one door the rule leaves open."},{"text":"\u201cOkay, Gran. No fuss.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"She nods and ladles. The tin stays shut.","why":"Polite and harmless. It also obeys the rule without testing it, and the cold day goes on as before."},{"text":"\u201cYou never let anyone do anything for you. That's why nobody visits.\u201d","tag":"game","you":2,"them":-4,"outcome":"Gran puts the ladle down and says 'Then eat in the hall.'","why":"A trap move: a hit dressed up as a diagnosis. You both get a small jolt of drama and nobody gets a drawing delivered. It ends the evening early."}]},{"who":"Leo","text":"\u201cGran says I can hug her when I'm taller. Am I taller yet?\u201d","cue":"standing against the door frame, a pencil mark at his chin","lines":[{"text":"\u201cNot yet by the pencil. Hold the drawing up so she can see it, and tell her what's in it. Words count.\u201d","tag":"best","you":4,"them":3,"outcome":"Leo holds it up: a cake with seventeen candles because he ran out of ideas. Gran says 'That's too many,' and her mouth twitches.","why":"A nod can travel by words when hugs are on hold. You show him a route the rule allows, and he takes it."},{"text":"\u201cNot today, Leo. Eat your soup.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"He slides back onto his chair and watches the pencil mark.","why":"No harm, and no nod. An eight-year-old learns exactly what the rule is for."}]},{"who":"Mum","text":"\u201cGran said no fuss, so I've sent nothing. Don't tell her I asked what she'd like.\u201d","cue":"the phone on speaker, Mum whispering from her hall","lines":[{"text":"\u201cRing her yourself Sunday at one, Mum. Just say happy birthday. She'll pretend it's nothing and she'll listen to every word.\u201d","tag":"best","you":4,"them":3,"outcome":"A pause, then 'One o'clock. I'll have the phone in my hand.' You can hear her writing it down.","why":"You give Mum a time and a job that fits the rule. The cold day runs on logistics, so you hand the logistics back clearly."},{"text":"\u201cRight, I'll tell her you said hello.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"'Do,' says Mum, and the line goes quiet.","why":"You carry the message, and the nod stays second-hand. Mum keeps counting what she was too shy to give."}]},{"who":"Mrs Kale","text":"\u201cYour Gran told me to bring nothing, so I brought nothing. That's polite, isn't it?\u201d","cue":"at the door in her cardigan, empty-handed on purpose","lines":[{"text":"\u201cIt's the right thing to do, Mrs Kale, and it'll be Gran's whole birthday if everyone does it. Bring yourself Sunday at one.\u201d","tag":"best","you":3,"them":3,"outcome":"She says 'Myself, then,' and brightens like a lamp being switched on.","why":"You thank the rule and bend it by one inch. Mrs Kale needs permission to turn up, and you give it."},{"text":"\u201cVery polite. Gran will be pleased.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"She nods and goes upstairs. No cake, no card, a whole building of polite.","why":"A kind line that changes nothing. The cold day likes nothing better than a building full of people being correct."}]},{"who":"Dad","text":"\u201cTwelve forty-five Sunday. I'll bring chairs. That's all.\u201d","cue":"10:40pm, the phone, the television on mute behind him","lines":[{"text":"\u201cChairs, thanks. And Dad, say happy birthday to her when you walk in. Three words will do.\u201d","tag":"best","you":3,"them":3,"outcome":"'Three words,' he says. 'I can do three.' A long breath comes down the line.","why":"You ask for something small enough to be possible. Dad can keep a rule and break it by three words."},{"text":"\u201cRight, see you then.\u201d","tag":"ok","you":-1,"them":0,"outcome":"'Right,' he says. The call ends before the kettle boils.","why":"Plain and fine, and it adds nothing. The cold day prefers a short call."}]}],"payoff":"Gran sets the soup in front of you and says nothing more. Leo's drawing stays under the table, and the cold day holds all evening.","fallout":{"them":"Gran's meter hits zero. She turns the soup down, says 'That's enough of that,' and the kitchen goes still."},"example":"A county office with a clerk who never looks up. The citizen who puts every question in writing learns that writing is the only warmth on offer."},{"type":"scene","title":"Saturday, the blur day","setting":"Saturday, 8:05am to 6:00pm. Mum's phone call, the stairs at Hawthorn Court, Gran's door. <i>The Heckler, in your head: 'Everyone says she's fine. Who are you to say otherwise?'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Mum","text":"\u201cGran, breathless? She's seventy-nine, she's allowed. You worry too much, you always did. Did you eat?\u201d","cue":"8:05am, the kettle on, Mum eating toast on her end","lines":[{"text":"\u201cYou may be right, Mum. I'd still like her to see the doctor after the lunch. Will you ask her? She listens to you.\u201d","tag":"best","you":4,"them":3,"outcome":"A silence, then 'I'll ask her on the phone Sunday.' She has the pen in her hand.","why":"You keep what you saw and give Mum a job she can say yes to. The blur day talks you out of your eyes, so you hold onto them and ask for help."},{"text":"\u201cYou're probably right.\u201d","tag":"ok","you":-2,"them":1,"outcome":"'Course I am,' says Mum, and she is pleased for ten seconds.","why":"Easy and warm, and the noticing dies. The blur day gets what it came for."},{"text":"\u201cYou said that about Dad's back too, and look what happened.\u201d","tag":"game","you":2,"them":-4,"outcome":"'Well, if you know best,' says Mum, and hangs up.","why":"A trap move: you drag in an old failure to win. Both of you get a hit of drama, and Gran's breathing is forgotten. It ends the call early."}]},{"who":"Gran","text":"\u201cI'm perfectly well. Leo, mind the icing. Don't look at me like that, you're imagining things.\u201d","cue":"11:00am, the stairs, one hand on the rail, seven steps to go","lines":[{"text":"\u201cThen I'll carry the box and you carry the rail, Gran. Seven steps, and I'll count them with you.\u201d","tag":"best","you":4,"them":4,"outcome":"She laughs, takes the rail, and counts out loud. On five she stops for a breath and says nothing about it.","why":"You do not argue with her answer. You offer a way to climb that lets both of you see what is true."},{"text":"\u201cIf you say so, Gran.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"She goes up first, her breathing loud on the landing. Nobody mentions it.","why":"Polite and quiet. The blur day is kept up by good manners."}]},{"who":"Mrs Kale","text":"\u201cEveryone gets breathless on those stairs. I did for years. Leave the poor woman alone. Is that a Victoria sponge?\u201d","cue":"2:00pm, at her door, sniffing the cake box","lines":[{"text":"\u201cIt is. I'd like your help, Mrs Kale: next time you're with her, will you notice if she stops on the landing?\u201d","tag":"best","you":4,"them":3,"outcome":"'Stops on the landing,' she repeats, and files it away. 'I can do that.'","why":"You ask a witness to look, which is the opposite of telling her she's imagining it. Mrs Kale likes a job."},{"text":"\u201cIt is. I made it at six this morning.\u201d","tag":"ok","you":0,"them":1,"outcome":"She asks about the oven and the afternoon fills up with sponge.","why":"Friendly and off the point. The blur day thrives on a nice change of subject."}]},{"who":"Leo","text":"\u201cGran sat down on the stairs when you were out. She said it was a game. Was it a game?\u201d","cue":"6:00pm, the doorstep, his drawing rolled up like a telescope","lines":[{"text":"\u201cIt might have been a rest, Leo. You did right to tell me. What did you see?\u201d","tag":"best","you":5,"them":4,"outcome":"He tells you: two minutes, a hand on her chest, the sound of her breath. He looks relieved that somebody asked.","why":"A child's noticing gets taken seriously, and that undoes the blur day at the root. You do not need to be sure of the answer."},{"text":"\u201cDon't worry, Leo. Gran's fine.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"He nods and goes quiet. He will not bring up the next thing he sees.","why":"Kind, and it teaches the lesson the blur day wants taught: what you notice does not count."}]}],"payoff":"Mum hangs up, and Gran's breathing on the stairs is never mentioned again that day. The lunch is tomorrow, and everyone is sure she is fine.","example":"A school office, Thursday. A parent says the bus times look wrong. The clerk says \u201cIt's always been like that, you're imagining it,\u201d and the parent drops it."},{"type":"scene","title":"Sunday, the flat day","setting":"Sunday, 12:30pm. Gran's kitchen, the table pulled out, Dad's chairs in a row, the candle still in the tin. <i>The Heckler, in your head: 'Fun is for people with time. Eat and go.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Grace","text":"\u201cCake looks lovely. I'll skip a slice. Sweet things don't do much for me. Don't mind me, I'll have tea.\u201d","cue":"her hand flat on the cup, eyes on the window","lines":[{"text":"\u201cTake one forkful and tell me what it tastes like. If the answer is nothing, I'll eat the rest.\u201d","tag":"best","you":4,"them":4,"outcome":"She tries it. 'Lemon,' she says. 'Real lemon.' Mrs Kale asks for the recipe and Grace gives it.","why":"A small, specific bite, with no pressure to enjoy it. The flat day shuts doors without a bang, and a forkful opens one."},{"text":"\u201cSuit yourself. More for us.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She nods and sips her tea. The slice stays on the plate.","why":"Easy and fair, and it hands the flat day a point. Nobody finds out whether the cake would have been worth it."},{"text":"\u201cYou say that about everything. Talking to you is like talking to a wall.\u201d","tag":"game","you":2,"them":-4,"outcome":"Grace puts the cup down. 'I'll go and check my stove,' she says.","why":"A trap move: a jab that tells her what is wrong with her. It ends the lunch for her early."}]},{"who":"Dad","text":"\u201cBack's fine. Had a tablet. Don't fuss over me.\u201d","cue":"1:15pm, standing by the window while everyone else sits, shifting his weight","lines":[{"text":"\u201cSit in the chair I saved you, Dad. Ten minutes off your feet won't hurt the lunch.\u201d","tag":"best","you":4,"them":3,"outcome":"He sits, slowly, and lets out a breath he had been holding since breakfast.","why":"You use the chair as the offer and the lunch as the reason. A body that is switched down still needs a seat."},{"text":"\u201cFine, I'll leave you to it.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"He stays at the window. Gran passes him a plate, which he eats standing.","why":"Respectful and useless. The flat day gets its ordinary Sunday back."}]},{"who":"Gran","text":"\u201cI felt nothing at seventy and I feel nothing now. Cut it before it dries.\u201d","cue":"2:00pm, the candle smoking, Leo's drawing unseen at her elbow","lines":[{"text":"\u201cOne bite of the icing first, Gran. Leo, tell her what's in the drawing.\u201d","tag":"best","you":4,"them":5,"outcome":"She tastes it and her eyes close for a second. Leo holds the drawing up and she reads out the seventeen candles.","why":"You put the pleasure in her mouth and give the drawing a moment. Gran's rule says nothing is felt, and a bite can disagree."},{"text":"\u201cRight, I'll cut it.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"The cake is cut into neat slices. Everyone eats in five minutes.","why":"Quick and kind, and it keeps the flat day flat."}]},{"who":"Mum","text":"\u201cDid you eat? Did she like it? Dad said it was nice. Was it nice? He said it was nice.\u201d","cue":"5:00pm, the phone, a pot on her stove","lines":[{"text":"\u201cGran laughed at Leo's drawing and Dad sat for an hour. Grace said lemon. That's what happened, Mum.\u201d","tag":"best","you":4,"them":4,"outcome":"A long silence. Then 'Dad sat down?' and she tells you about the chair he refused at Christmas.","why":"'Nice' is a flat word. Real detail gives Mum something to feel, and it goes further than reassurance."},{"text":"\u201cYes, nice. Everyone ate.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"'Good,' she says, and the pot lid rattles.","why":"Accurate and flat. The ledger closes without opening anything."}]}],"payoff":"Grace goes to check her stove, and the lunch goes on without her. Gran cuts the cake into neat slices and nobody tastes it.","example":"A retired teacher on a park bench, Sunday. The same pigeons, the same \u201cNothing to report\u201d for the grandchildren, and the same bench the following week."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cMrs Kale told you the lift only shudders when it's full, and that you were imagining it. Which banal script is built on talking a child out of what she sees and thinks?\u201d","cue":"stirring her tea, watching the room","options":["Joylessness: built on cutting the child off from the body, so pleasure and pain both go dull and get a tablet.","Lovelessness: built on rules that ration strokes, so the person goes without the warmth they need and feels unloved.","Mindlessness: built on messages against thinking, with discounting at its core, so the person learns to doubt their own eyes."],"answer":2,"why":"The books call these banal scripts. Mindlessness is the one built on messages against thinking, with discounting as its cornerstone. A child who is talked out of what she sees learns to doubt her own eyes. Lovelessness rests on the stroke economy, and Joylessness on a body cut off from its signals.","traps":{"0":"Joylessness would send the talk to the body and to pleasure, and Gran's soup and Dad's knee belong there. Mrs Kale's line is about the lift, and what it does is argue you out of what you saw.","1":"Lovelessness would send the talk to the stroke economy, and Gran's hug rule belongs there. Mrs Kale hands out a biscuit freely. The harm is that what you noticed is waved off."},"example":"A kitchen, Tuesday. A girl says the milk smells off. Her father says \u201cNothing's wrong with it, you're imagining things,\u201d and drinks it himself. She learns to stop saying what she notices."}]}]},{"setting":"Home & Flatmates","blurb":"The landlord's agent comes Saturday at ten, and there is a black patch above the window in 3B.","opener":{"setting":"Tuesday, 7:05am. Apartment 3B, the kitchen. Maya's wet shoes by the door, a black patch above the window.","lines":[{"who":"Sam","text":"\u201cIt's condensation. Everyone has condensation. Is there any milk?\u201d","cue":"head in the fridge, not looking up"},{"who":"Maya","text":"\u201cMr Pike is Saturday at ten. I've written it on the sheet.\u201d","cue":"pen tapping the ledger"}],"ask":"Spot the day from a single moment, then play one whole day in each. Watch what the day does to the people in it, and to you."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Three short moments from one week. Each one belongs to one of the three days. The cold day holds back the nods. The blur day talks away what you notice and leaves no room to think. The flat day switches off pleasure and the body's signals.","items":[{"type":"pick","who":"Maya","text":"\u201cBINS: SAM. GAS: OWED. NO NEED TO TALK, JUST TICK.\u201d (the note on the fridge, in capitals)","cue":"Tuesday, 7:05am, 3B, the kitchen, Maya's shoes still wet by the door","options":["the flat day","the cold day","the blur day"],"answer":1,"why":"Nobody is said hello to. The flat runs on a sheet, and the sheet rations every nod down to a tick. A home that has turned warmth into paperwork is living the cold day.","traps":{"0":"This would be the flat day if the colour had gone out of things and nobody minded. Maya is attentive, exact and busy. She is holding back everything except the sums.","2":"This would be the blur day if the note talked you out of something you had noticed. It says what is owed, plainly, and says nothing else."},"example":"A shared office kitchen. A laminated sign: \u201cWash your own mug. No notes, no chat.\u201d The sink is spotless and nobody has spoken in it for a year."},{"type":"pick","who":"Sam","text":"\u201cThe inspector? Relax, they never check. You're getting worked up over nothing. Eat your toast.\u201d","cue":"Wednesday, 7:40am, the kitchen, you had pointed at the black patch above the window a moment ago, the kettle already boiling","options":["the cold day","the flat day","the blur day"],"answer":2,"why":"You noticed a damp patch. The answer calls it nothing and pushes toast across the table. What you saw is argued out of the room before anyone has looked at it. That is the blur day.","traps":{"0":"This would be the cold day if the kitchen had gone silent and nothing was offered. Toast is on offer. What goes missing is a second look at the patch.","1":"This would be the flat day if the morning were dull and nobody cared about the patch. Sam is cheerful and quick, and he is talking you out of your own eyes."},"example":"A hairdresser, Saturday. A client says her scalp stings. The stylist says \u201cThat's the shampoo working, you're imagining it,\u201d and rinses her out."},{"type":"pick","who":"Maya","text":"\u201cFeet? Fine. Two tablets and I'll stand through dinner. Cooking's just fuel anyway.\u201d","cue":"Thursday, 9:20pm, back from a double shift, eating cereal over the sink, shoes still on","options":["the flat day","the blur day","the cold day"],"answer":0,"why":"The feet get tablets instead of a look, and dinner is fuel instead of a pleasure. Nothing hurts enough to stop her and nothing pleases enough to sit for. That is the flat day, where the body's signals, good or bad, are switched down.","traps":{"1":"This would be the blur day if someone were arguing her out of what she felt. Nobody is. She is switching it down herself.","2":"This would be the cold day if she were holding back warmth from you. She is answering kindly. She just has nothing left for her own feet."},"example":"A bus driver at the depot: \u201cTea? Don't bother. Back? Tablet. Lunch? A bun at the wheel.\u201d Every day is the same bun."}]},{"level":"Play","label":"Play, the week in motion","intro":"Play each day through, in order. The Heckler talks in italics, in your head. You can hear it, and you don't have to do what it says.","items":[{"type":"scene","title":"Thursday, the cold day","setting":"Thursday, 7:30pm. Apartment 3B, the kitchen table, Maya's ledger open. The landlord's agent is coming Saturday at ten. <i>The Heckler, in your head: 'The sheet says it all. Don't add anything.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cIs the sheet saying I owe for the gas? It's saying I owe for the gas. Sorry, sorry. What's the number?\u201d","cue":"7:30pm, reading the fridge sheet with his coat still on","lines":[{"text":"\u201cThirty-one. Half Friday, half the Friday after, and you tick it yourself.\u201d","tag":"best","you":4,"them":3,"outcome":"He writes both Fridays on his hand. 'Thirty-one,' he says, and means it.","why":"A number and two dates. The cold day runs on the sheet, so you give the sheet something he can act on."},{"text":"\u201cDon't worry, I'll cover it this time.\u201d","tag":"ok","you":-3,"them":2,"outcome":"'You're the best,' says Sam, and the number stays on the sheet.","why":"Kind, and Sam's apology gets to do its usual job. The debt stays open and the sheet gets longer."}]},{"who":"Maya","text":"\u201cMr Pike is Saturday at ten. Don't talk to me about it. Put your jobs on the sheet.\u201d","cue":"not looking up from the ledger, one finger on a column","lines":[{"text":"\u201cSheet it is. I'll write the damp patch on it now, with a time, and I'll make you a tea if you want one.\u201d","tag":"best","you":4,"them":3,"outcome":"She looks at the kettle, then at you. 'Black,' she says, and her finger leaves the column.","why":"You use her own channel and slip a nod through it. The cold day can be warmed by one small offer made in its language."},{"text":"\u201cOkay.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"She turns a page. The patch is not written anywhere.","why":"Fine as far as it goes, and the sheet decides what counts as said."},{"text":"\u201cYou'd rather write a note than say hello. Who lives like that?\u201d","tag":"game","you":2,"them":-4,"outcome":"Maya shuts the ledger. 'Then don't read it,' she says, and goes to her room.","why":"A trap move: a jab dressed up as a question. You each get a small hit of drama and the damp patch gets nowhere. It ends the evening early."}]},{"who":"Mr Pike","text":"\u201cSaturday at ten. I shan't need tea. Key on the hook, please.\u201d","cue":"the agent, on the phone, already in his car","lines":[{"text":"\u201cTen sharp, Mr Pike. Key on the hook, and there's damp in the back bedroom. Photographs are on the sheet.\u201d","tag":"best","you":4,"them":2,"outcome":"'Photographs,' he says. 'Good.' You hear him write it down.","why":"A time and a thing. The cold day runs on logistics, so give them back clearly and once."},{"text":"\u201cRight, ten.\u201d","tag":"ok","you":-2,"them":0,"outcome":"The call ends. You spend the evening wondering whether you told him about the patch.","why":"A time is agreed and the thing is left vague. Vague work is anxious work."}]},{"who":"Maya","text":"\u201cThe photos were fine. Don't make a thing of it.\u201d","cue":"11:00pm, eating toast over the sink with her back to you","lines":[{"text":"\u201cThey were good because you showed me where to stand. The toast's burnt on one side, by the way. Want the other half?\u201d","tag":"best","you":4,"them":5,"outcome":"She laughs once, a short one, and takes the half. 'The burnt side's mine,' she says.","why":"A nod for what she did, plus a bit of nonsense she can answer. The cold day thaws when the stroke is small and has a handle."},{"text":"\u201cOkay, goodnight.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"The light in the kitchen goes out. The fridge hums.","why":"Respectful and cold. Nothing gets said that the sheet would not have said."}]},{"who":"Mum","text":"\u201cIs the flat warm enough? Don't say yes just to stop me. Tell me the temperature.\u201d","cue":"10:40pm, the phone on the bed, a text with three dots","lines":[{"text":"\u201cSeventeen in the hall, Mum, and there's damp in the back bedroom. Saturday someone is coming to look. Ask me Sunday how it went?\u201d","tag":"best","you":4,"them":4,"outcome":"She sends a voice note about her old landlord and the winter of the broken pipe. It is ten minutes of warmth.","why":"A true answer, then a date she can hold you to. Mum keeps a ledger of what she gives, and you put something on her side."},{"text":"\u201cIt's warm enough, Mum.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She sends a thumbs up and a sad face.","why":"Short and not harmful. The cold day stays cold and Mum keeps counting."}]}],"payoff":"Maya shuts the ledger and goes to her room. The sheet stays on the fridge and nothing about the patch is written down.","fallout":{"them":"Maya's meter hits zero. She closes the ledger, says 'We're done,' and the kitchen light goes out."},"example":"A county office with a clerk who never looks up. The citizen who puts every question in writing learns that writing is the only warmth on offer."},{"type":"scene","title":"Friday, the blur day","setting":"Friday, 6:50am to 9:00pm. The kitchen in 3B, the bus, Maya's bedroom. <i>The Heckler, in your head: 'It's only a patch. If you keep looking, you'll have to do something.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cThat patch has always been there. You're imagining it's bigger. Toast?\u201d","cue":"6:50am, a tin of white paint held behind the door","lines":[{"text":"\u201cPut the paint down a minute, Sam. Stand here and look with me. Is it the size it was in March?\u201d","tag":"best","you":4,"them":3,"outcome":"He puts the tin on the counter and looks. 'Bigger,' he says, 'a bit,' and rubs his neck.","why":"You ask him to look instead of arguing. The blur day cannot survive two people looking at the same wall."},{"text":"\u201cFine, whatever. Toast then.\u201d","tag":"ok","you":-3,"them":1,"outcome":"He cheers up. The paint goes back behind the door and you eat in a very cheerful silence.","why":"Easy, and it hands him the win. You are now eating toast beside a patch you believe is bigger."},{"text":"\u201cYou always paint over things. That's your answer to everything!\u201d","tag":"game","you":2,"them":-4,"outcome":"Sam says 'Okay, okay, wow,' and leaves for the bus with the paint still on the counter.","why":"A trap move: a charge about his whole character. Both of you get a hit of drama and nobody looks at the wall. It ends the morning early."}]},{"who":"Maya","text":"\u201cMr Pike says the patch is nothing. Sam told him so. I'm sure Sam is right.\u201d","cue":"8:10am, a text on the bus, a photo of Maya's feet on a night ward chair","lines":[{"text":"\u201cIs Sam right, or did you look? Send me one photo and we'll look together at lunch.\u201d","tag":"best","you":4,"them":4,"outcome":"Three dots. Then a photo of the back bedroom wall, taken in her torch light.","why":"You hand her noticing back to her and ask for the evidence. She is tired and borrowing Sam's certainty, so a photo is a gentle test."},{"text":"\u201cIf Sam says so, fine.\u201d","tag":"ok","you":-3,"them":0,"outcome":"'Good,' she writes. The photo stays on her phone.","why":"It sounds calm and it wastes what she saw. The blur day likes a calm yes."}]},{"who":"Sam","text":"\u201cMr Pike called. He'll skip the back bedroom, so that's done. Why are you looking like that? It's good news, isn't it? Say it's good news.\u201d","cue":"6:40pm, grinning in the doorway, keys swinging","lines":[{"text":"\u201cIt solves Saturday, Sam. The patch is still there tonight. Let's look at it with Maya after tea.\u201d","tag":"best","you":4,"them":3,"outcome":"His grin slips a little. 'After tea,' he says. 'Yes. Fine.'","why":"You take the good news and keep the wall in view. He needs to hear that the two are separate."},{"text":"\u201cGreat news. Well done.\u201d","tag":"ok","you":-2,"them":2,"outcome":"'See?' he says. The patch is still damp.","why":"Warm, and it lets him call the problem solved."}]},{"who":"Maya","text":"\u201cI looked. It's bigger. I knew it. Why did I let him say it was nothing?\u201d","cue":"9:00pm, in her room, phone torch on the wall","lines":[{"text":"\u201cBecause he said it kindly and fast. You saw it first, Maya. Take the photos and I'll send them to Mr Pike tonight.\u201d","tag":"best","you":5,"them":5,"outcome":"She takes six photos and reads the dates aloud. Her shoulders come down by an inch.","why":"You tell her why she doubted herself and give her something to do. A doubted eye needs a job."},{"text":"\u201cDon't worry, we'll sort it Monday.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"'Monday,' she says, and the torch goes off.","why":"A kind postponement. The patch is bigger by Monday."}]}],"payoff":"Sam leaves with the paint on the counter. The patch looks the same, and nobody photographs it.","example":"A school office, Thursday. A parent says the bus times look wrong. The clerk says \u201cIt's always been like that, you're imagining it,\u201d and the parent drops it."},{"type":"scene","title":"Sunday, the flat day","setting":"Sunday, 2:15pm. Apartment 3B, the sofa, the fan turning at one speed. The inspector passed them. <i>The Heckler, in your head: 'Rest is for people who have finished.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cInspector passed us. Pizza to celebrate? Or toast. Doesn't matter. Whatever's easy.\u201d","cue":"in the doorway, keys still in his hand","lines":[{"text":"\u201cPizza, the one with olives. I'll order now so it comes at three.\u201d","tag":"best","you":4,"them":4,"outcome":"He cheers. The flat has a sound in it for the first time today.","why":"A yes with a time and a topping. The flat day shuts doors without a bang, and a plain yes opens one."},{"text":"\u201cToast is fine.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"He puts the bread in. Nobody remembers what was celebrated.","why":"Easy and flat. The day wins a small point."},{"text":"\u201cCelebrate? We still have the patch and the rent. What is there to be happy about?\u201d","tag":"game","you":1,"them":-4,"outcome":"'Okay, okay,' says Sam, and puts his keys back in his pocket.","why":"A trap move: a no that shows up as a list of reasons. The reasons do the refusing, and the scene ends early."}]},{"who":"Maya","text":"\u201cFeet? Fine. Two tablets and I'll stand through the pizza. I don't taste anything when I'm like this.\u201d","cue":"on the sofa, shoes still on, one foot rubbing the other","lines":[{"text":"\u201cShoes off, feet on my knees. Tell me which bit hurts most, and then we eat.\u201d","tag":"best","you":4,"them":5,"outcome":"She says 'Left heel,' as if surprised to find out. She lets you take the shoe off.","why":"A question about the body with a seat attached. A switched-down body needs a small invitation to speak."},{"text":"\u201cTake the tablets, then.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She swallows them dry. The foot goes on rubbing.","why":"True and no use. The tablet stands in for the look."}]},{"who":"Sam","text":"\u201cMaya's gone to bed with her shoes on. We won. Why do I feel nothing?\u201d","cue":"7:00pm, the balcony door open, the pizza box empty on the floor","lines":[{"text":"\u201cBecause we've been braced since Monday. Sit with me on the balcony, ten minutes, no phone, and let it land.\u201d","tag":"best","you":4,"them":4,"outcome":"He sits. A bus goes by below and he laughs at nothing. 'Ten minutes,' he says.","why":"You tell him what is going on in his body and give the win somewhere to land."},{"text":"\u201cProbably tired. Early night.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"He nods and yawns. The balcony door stays open all night.","why":"Sensible and flat. A day that never lands gets stored."}]},{"who":"Mum","text":"\u201cTell me one nice thing about the flat. Just one.\u201d","cue":"9:00pm, the sofa, the fan at one speed","lines":[{"text":"\u201cThe pizza with olives, Mum. Maya laughed at the inspector's shoes. It was a good half hour.\u201d","tag":"best","you":4,"them":5,"outcome":"She asks what was wrong with the shoes. You tell her, and she laughs for longer than you did.","why":"A real detail with a body in it. Mum's flat days live on summaries, and a laugh breaks the summary."},{"text":"\u201cIt's fine, Mum. Everything's fine.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"'Good,' she says. 'Then you won't mind if I worry.'","why":"Harmless, and it closes the call without opening anything."}]}],"payoff":"Sam puts his keys back in his pocket. You spend the afternoon on the sofa listing what you cannot do, and nobody offers to help with any of it.","example":"A retired teacher on a park bench, Sunday. The same pigeons, the same \u201cNothing to report\u201d for the grandchildren, and the same bench the following week."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cSam told you the damp patch was nothing and that you were imagining it. Which banal script is built on talking a child out of what she sees and thinks?\u201d","cue":"stirring her tea, watching the room","options":["Mindlessness: built on messages against thinking, with discounting at its core, so the person learns to doubt their own eyes.","Joylessness: built on cutting the child off from the body, so pleasure and pain both go dull and get a tablet.","Lovelessness: built on rules that ration strokes, so the person goes without the warmth they need and feels unloved."],"answer":0,"why":"The books call these banal scripts. Mindlessness is the one built on messages against thinking, with discounting as its cornerstone. A child who is talked out of what she sees learns to doubt her own eyes. Lovelessness rests on the stroke economy, and Joylessness on a body cut off from its signals.","traps":{"1":"Joylessness would send the talk to the body and to fun, and Maya's feet belong there. Sam's line is about the wall, and what it does is argue you out of what you saw.","2":"Lovelessness would send the talk to the stroke economy, and the fridge sheet belongs there. Sam is warm and quick. The harm is that what you noticed has been waved off."},"example":"A kitchen, Tuesday. A girl says the milk smells off. Her father says \u201cNothing's wrong with it, you're imagining things,\u201d and drinks it himself. She learns to stop saying what she notices."}]}]},{"setting":"Work","blurb":"Demo on Wednesday at Halden. A penny keeps moving in the totals, and nobody wants to say so.","opener":{"setting":"Tuesday, 9:00am. Halden, the team room, rain on the glass. The client demo is tomorrow at ten.","lines":[{"who":"Daniel","text":"\u201cStandup. Ten words each. No greetings, they eat the clock.\u201d","cue":"arms folded, laptop open"},{"who":"Clara","text":"\u201cI've been in since five. The numbers are fine. Mostly fine.\u201d","cue":"not looking up from the spreadsheet"}],"ask":"Spot the day from a single moment, then play one whole day in each. Watch what the day does to the people in it, and to you."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Three short moments from one week. Each one belongs to one of the three days. The cold day holds back the nods. The blur day talks away what you notice and leaves no room to think. The flat day switches off pleasure and the body's signals.","items":[{"type":"pick","who":"Daniel","text":"\u201cStandup. Ten words each. No greetings, they eat the clock.\u201d","cue":"Tuesday, 9:00am, Halden, the team room, rain on the glass, nobody else says a word","options":["the cold day","the blur day","the flat day"],"answer":0,"why":"Nobody is greeted and nothing is offered beyond the status. The room allows ten words and no nods, and the work is the only thing on the table. That is the cold day.","traps":{"1":"This would be the blur day if someone had noticed something and been talked out of it. Nobody is arguing a point here, only refusing to say hello.","2":"This would be the flat day if the colour had gone out of things and nobody minded. Daniel is not dull. He is handing out work and withholding everything else."},"example":"A call centre, Monday. The supervisor reads the targets aloud and the team nods once. Nobody asks about the weekend."},{"type":"pick","who":"Daniel","text":"\u201cThe refunds look doubled in the report? That's the chart. You're reading it wrong. Coffee?\u201d","cue":"Wednesday, 9:30am, you had shown him the screen a moment ago, his hand already on the door","options":["the cold day","the blur day","the flat day"],"answer":1,"why":"You noticed a number that looked wrong and the answer calls it a chart fault and offers coffee. What you saw is talked away before anyone looks. That is the blur day.","traps":{"0":"This would be the cold day if the door had shut with no offer at all. Coffee is on the table. What is missing is a second look at the number.","2":"This would be the flat day if the number and the morning both meant nothing. Daniel is brisk and engaged, and he is talking you out of what you saw."},"example":"A bank counter, Friday. A customer says the balance looks short. The clerk says \u201cIt's the screen, you're reading it wrong,\u201d and counts out the cash."},{"type":"pick","who":"Clara","text":"\u201cHead? It's nothing, I had a tablet. Lunch? I'll eat at five. The release matters, not me.\u201d","cue":"Friday, 6:00pm, her desk, an untouched sandwich beside the keyboard","options":["the blur day","the cold day","the flat day"],"answer":2,"why":"The head gets a tablet instead of a look, lunch is pushed to five, and the sandwich stays where it is. Nothing hurts enough to stop her and nothing pleases enough to want. That is the flat day, where the body's signals are switched down.","traps":{"0":"This would be the blur day if someone were arguing her out of what she felt. Nobody is. She is switching it down herself.","1":"This would be the cold day if she were holding back a greeting from you. She answers warmly. She has nothing left for her own body."},"example":"A delivery driver at the depot: \u201cHeadache? Tablet. Lunch? A bar at the wheel.\u201d The same bar, the same afternoon, every day."}]},{"level":"Play","label":"Play, the week in motion","intro":"Play each day through, in order. The Heckler talks in italics, in your head. You can hear it, and you don't have to do what it says.","items":[{"type":"scene","title":"Tuesday, the cold day","setting":"Tuesday, 9:10am. Halden, the team room, rain on the glass. The client demo is Wednesday at ten. <i>The Heckler, in your head: 'Nobody in here does warm. Talk shop or don't.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Daniel","text":"\u201cYou've got the demo script? Put it up. I don't need your weekend.\u201d","cue":"not looking up from his laptop","lines":[{"text":"\u201cHere it is. Slide four is a day out of date, so I've flagged it. Can we fix it before eleven?\u201d","tag":"best","you":4,"them":2,"outcome":"He scrolls to slide four and says 'Fine, fix it.' There is a job on the table, and the room is a little less cold.","why":"A fact and a deadline. The cold day gives no warm nods, so you ask for a fix he can say yes to."},{"text":"\u201cIt's probably wrong everywhere. I'll redo the lot.\u201d","tag":"ok","you":-3,"them":-1,"outcome":"He nods without looking up. You now own a day of work he never asked for.","why":"An apology in a suit. It takes the weight off his face and puts it on yours, and the cold day stays cold."},{"text":"\u201cFine. Next time tell me what you want, since nothing I do pleases you.\u201d","tag":"game","you":2,"them":-4,"outcome":"'Noted,' he says, and shuts the laptop on the conversation.","why":"A trap move: you make yourself the one who gets hurt, so both of you get a hit of drama and nobody gets any work done. It ends the meeting early."}]},{"who":"Daniel","text":"\u201cSlide six. Why is there a graph? Who asked for a graph?\u201d","cue":"tapping the screen with a pen, once per word","lines":[{"text":"\u201cThe client's finance lead asked for it on the call. I can move it to the appendix if you'd rather.\u201d","tag":"best","you":4,"them":3,"outcome":"He turns to the appendix. 'Leave it,' he says, and for a second the corner of his mouth moves.","why":"You answer the question he asked, then hand him a choice. A choice is the nearest thing to a warm nod this room allows."},{"text":"\u201cI thought it would help.\u201d","tag":"ok","you":0,"them":-2,"outcome":"'Thought,' he repeats. The pen taps twice.","why":"True, and it puts you in the wrong. No nod comes back, and the next question will be harder."}]},{"who":"Clara","text":"\u201cI've checked the numbers four times. You needn't look. Please don't say anything nice, I'll only cry.\u201d","cue":"11:20am, her desk, eating over the keyboard","lines":[{"text":"\u201cI'll look, because my name is on the deck too. Two minutes, and you drive.\u201d","tag":"best","you":4,"them":4,"outcome":"She turns the screen and walks you through the sheet. Halfway through she stops apologising.","why":"You ask to see the work instead of offering a compliment she would refuse. Clara can take a stroke when it comes dressed as a job."},{"text":"\u201cGreat, if you're sure.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She nods and turns the screen back. The fifth check starts.","why":"Polite and quick. The cold day is kept going by silence."}]},{"who":"Daniel","text":"\u201cClient's in at ten tomorrow. Be in the glass room by nine.\u201d","cue":"5:30pm, the lift, his phone already at his ear","lines":[{"text":"\u201cNine in the glass room. I'll bring the printed script and Clara's chart.\u201d","tag":"best","you":3,"them":2,"outcome":"The doors close on his nod. You have a time and a thing, which is what this room runs on.","why":"A time and a thing. The cold day runs on logistics, so you give them back clearly and once."},{"text":"\u201cRight, nine.\u201d (you watch the floor numbers go down)","tag":"ok","you":-2,"them":0,"outcome":"The time is agreed and the thing is left vague. You spend the evening wondering what he wanted.","why":"Vague work is anxious work, and the cold day keeps you guessing."}]},{"who":"Omar","text":"\u201cYou alright? You haven't spoken to anyone since lunch.\u201d","cue":"6:40pm, the car park, rain, his keys already out","lines":[{"text":"\u201cNot really, it was a cold sort of day. Walk to the station with me? Ten minutes.\u201d","tag":"best","you":4,"them":4,"outcome":"He pockets his keys. 'Ten minutes,' he says. He walks on the outside of the pavement without being asked.","why":"Omar offers the thing the room did not. You say yes in words, with a time on it."},{"text":"\u201cFine, thanks.\u201d (you unlock your bike)","tag":"ok","you":-2,"them":-1,"outcome":"He nods and drives away. The rain goes on.","why":"A reflex answer. The cold day wins its last point of the evening."}]}],"payoff":"Daniel shuts the laptop on the conversation, and Clara gets the appendix before lunch. You were right about the room, and the room stayed cold.","fallout":{"them":"Daniel's meter hits zero. He closes the laptop, says 'We're done,' and leaves you with the rain."},"example":"A county office with a clerk who never looks up. The citizen who puts every question in writing learns that writing is the only warmth on offer."},{"type":"scene","title":"Wednesday, the blur day","setting":"Wednesday, 9:30am to 5:50pm. Halden, the team room, Clara's desk, the glass room. <i>The Heckler, in your head: 'Everyone says it's rounding. Who are you to say it moves?'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Daniel","text":"\u201cTotals off by a penny? Rounding. Everyone knows that. Don't make a thing of it, the client loves us.\u201d","cue":"9:30am, one hand on the door of the glass room","lines":[{"text":"\u201cRounding gives the same penny every time. This one moves. Give me ten minutes with the log and I'll show you.\u201d","tag":"best","you":4,"them":2,"outcome":"He looks at his watch and then at you. 'Ten,' he says, 'and I'm timing it.'","why":"You keep what you saw and ask for a small slice of his time. The blur day fades when someone offers evidence."},{"text":"\u201cOkay, you know best.\u201d","tag":"ok","you":-3,"them":1,"outcome":"He nods, pleased. The penny stays where it is.","why":"Easy and polite, and the noticing dies. The blur day gets what it came for."},{"text":"\u201cYou always say that, and then it blows up. Remember the March release?\u201d","tag":"game","you":2,"them":-4,"outcome":"'March again,' says Daniel, and goes into the glass room alone.","why":"A trap move: you drag in an old failure to win. Both of you get a hit of drama, and the penny is forgotten. It ends the meeting early."}]},{"who":"Sam","text":"\u201cSorry, sorry, I meant to say. Daniel said not to bother you with the penny thing. It's probably nothing. You're a worrier.\u201d","cue":"11:00am, hovering by your desk with a mug of tea","lines":[{"text":"\u201cTell me what you saw, Sam. Start with the number and where.\u201d","tag":"best","you":4,"them":3,"outcome":"He pulls up a chair. 'Forty-two,' he says. 'Then forty-three. Then forty-two again.'","why":"You ask for his noticing instead of agreeing it away. Sam had seen it too, and was handed an apology instead of a question."},{"text":"\u201cProbably, yes.\u201d","tag":"ok","you":-2,"them":1,"outcome":"He grins with relief. Neither of you says the number aloud.","why":"Easy for both of you. The blur day is kept up by agreeing it is probably nothing."}]},{"who":"Clara","text":"\u201cI've checked it four times and it still moves. Never mind. I'm sure Daniel is right. Lunch?\u201d","cue":"1:05pm, eating over her keyboard","lines":[{"text":"\u201cShow me the cell. We'll look together, and you eat while I read.\u201d","tag":"best","you":4,"them":4,"outcome":"She puts the fork down and turns the screen. Ten minutes later you have both found it.","why":"Looking with her cuts through the blur, and the fix stays hers."},{"text":"\u201cSorry, I've got the deck due. Maybe later.\u201d","tag":"ok","you":0,"them":-2,"outcome":"She nods and goes back to the cell. The later never comes.","why":"Honest, and it keeps the blur going. Real work and a closed door can sit side by side."},{"text":"\u201cDaniel will never listen to you, Clara. Why bother?\u201d","tag":"game","you":2,"them":-3,"outcome":"She laughs, a short one. 'Fair,' she says, and turns the screen off.","why":"A trap move: a gloomy shrug that makes you both right and gets the problem nowhere. It ends the scene early."}]},{"who":"Daniel","text":"\u201cYou've been waving that penny at me all day. Thirty seconds, then I'm gone.\u201d","cue":"5:50pm, coat on, bag in hand","lines":[{"text":"\u201cThirty is plenty. Here's the line, here's the penny that moves, and the log with Clara's name on the find.\u201d","tag":"best","you":5,"them":4,"outcome":"He puts the bag down. He reads it twice. 'Thank her,' he says, 'and tell her I said it first.'","why":"You bring the evidence and give Clara the credit. Daniel believes what is on the screen faster than what is in the air."},{"text":"\u201cIt's probably nothing. Sorry.\u201d","tag":"ok","you":-3,"them":0,"outcome":"'Good,' he says, and the lift doors close on the word.","why":"You hand the blur day its victory just as it was about to lose."}]}],"payoff":"Daniel goes into the glass room alone. The penny keeps moving, and nobody mentions it again before the demo.","example":"A bank counter, Friday. A customer says the balance looks short. The clerk says \u201cIt's the screen, you're reading it wrong,\u201d and counts out the cash."},{"type":"scene","title":"Saturday, the flat day","setting":"Saturday, 2:15pm. Halden, the release weekend, the team room half empty and humming. <i>The Heckler, in your head: 'Fun is for people who have shipped.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Omar","text":"\u201cHalf an hour in the park behind the station? Sun's out. Your call.\u201d","cue":"holding a pizza menu, hoodie on, no hurry","lines":[{"text":"\u201cYes, twenty minutes. I'll save the build and meet you by the lifts.\u201d","tag":"best","you":4,"them":4,"outcome":"He grins. The room has a sound in it for the first time today.","why":"A yes with a time attached. The flat day shuts doors without a bang, and a plain yes opens one."},{"text":"\u201cMaybe. I've still got the checks to run.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"He shrugs. 'The checks are always there,' and goes alone.","why":"The checks are real, and the answer is still a closed door. It hands the flat day a point it has not earned."},{"text":"\u201cThe sun? Nice for some. Some of us are releasing, not on holiday.\u201d","tag":"game","you":1,"them":-4,"outcome":"Omar says 'Okay' and leaves without turning round.","why":"A trap move: a refusal wrapped in a complaint. The complaint does the refusing, and the scene ends early."}]},{"who":"Clara","text":"\u201cHead? I had a tablet, it's nothing. Not tasting lunch is fine. The release matters, not me.\u201d","cue":"3:30pm, her desk, an untouched bowl of soup","lines":[{"text":"\u201cThe release will still be there in ten minutes, Clara. Eat the soup with me and tell me what it tastes like.\u201d","tag":"best","you":4,"them":5,"outcome":"She tastes it. 'Salty,' she says, and laughs. It is the first thing she has said that was about herself.","why":"A small invitation tied to taste. A body that has been switched down needs a specific thing to answer."},{"text":"\u201cFine. Water at least.\u201d","tag":"ok","you":0,"them":-1,"outcome":"She drinks half the glass and puts it down. The soup goes cold.","why":"Reasonable, and it leaves the flat day alone."}]},{"who":"Daniel","text":"\u201cGreen. Fine. Go home.\u201d (a text, at 5:00pm)","cue":"on the screen of your phone, no reply from him since","lines":[{"text":"\u201cThanks for the push, Daniel. I'm going home. Monday, would you tell Clara she did well? In person, in the same room.\u201d","tag":"best","you":4,"them":3,"outcome":"Three dots, then 'I'll try.' It is more than he has promised anyone this month.","why":"You thank him and ask for the one thing he does in private. Daniel and Clara want the same thing said in the same room."},{"text":"\u201cWill do.\u201d","tag":"ok","you":-1,"them":0,"outcome":"The thread goes quiet. The release goes out and nobody says well done.","why":"Fine, and flat. The day ends the way it began."}]},{"who":"Mum","text":"\u201cDid the release go? Dad asked, so I'm asking. He won't ask himself.\u201d","cue":"9:00pm, the phone, a pot on her stove","lines":[{"text":"\u201cIt went out at seven, Mum. Tell Dad Clara tested it five times and I ate soup. Ask him to ring me himself.\u201d","tag":"best","you":4,"them":4,"outcome":"A silence, then 'He's in the next room. I'll tell him.' You hear a chair scrape.","why":"Real detail gives Mum something to carry. The ask is small and sends the warmth toward Dad."},{"text":"\u201cIt went fine, tell Dad thanks.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"'I will,' she says, and does not.","why":"Accurate and flat. The message goes into the ledger and nothing comes back."}]}],"payoff":"Omar leaves without turning round. You spend the afternoon on checks that were already green, and nobody offers to help with any of them.","example":"A retired teacher on a park bench, Sunday. The same pigeons, the same \u201cNothing to report\u201d for the grandchildren, and the same bench the following week."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cDaniel put Clara's penny down to rounding and told her not to make a thing of it. Which banal script is built on talking a child out of what she sees and thinks?\u201d","cue":"stirring her tea, watching the room","options":["Lovelessness: built on rules that ration strokes, so the person goes without the warmth they need and feels unloved.","Mindlessness: built on messages against thinking, with discounting at its core, so the person learns to doubt their own eyes.","Joylessness: built on cutting the child off from the body, so pleasure and pain both go dull and get a tablet."],"answer":1,"why":"The books call these banal scripts. Mindlessness is the one built on messages against thinking, with discounting as its cornerstone. A child who is talked out of what she sees learns to doubt her own eyes. Lovelessness rests on the stroke economy, and Joylessness on a body cut off from its signals.","traps":{"0":"Lovelessness would send the talk to the stroke economy, and Tuesday's no-greeting standup belongs there. Daniel's line is about the penny, and what it does is argue Clara out of what she saw.","2":"Joylessness would send the talk to the body and to pleasure, and Clara's untouched soup belongs there. Daniel's line is about the sum, and it talks her out of what she checked four times."},"example":"A kitchen, Tuesday. A girl says the milk smells off. Her father says \u201cNothing's wrong with it, you're imagining things,\u201d and drinks it himself. She learns to stop saying what she notices."}]}]}]};</script>
