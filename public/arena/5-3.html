<script>window.TA_GAME = {"slot":"5.3","setting":"Family","title":"Shrinking the Problem","world":5,"worldName":"Under the Surface","week":5,"weekName":"Under the Surface","mechanic":"Ladder","concept":"After this one you can name which part of a problem a line is making smaller, and say what a real step would look like.","plainWord":"shrinking","bookTerm":"Discounting","bookIdea":"Discounting is ignoring part of a situation without realising it, and it can shrink a problem at one of four levels: that it exists, that it matters, that it can change, or that you personally can do anything about it.","bookSource":"TA Today, ch. 1, 17 and 18; Scripts People Live, ch. 9","opener":{"setting":"Thursday, 6:15pm. Hawthorn Court, the stairwell between Gran's flat and yours. The lift has a paper sign on its door.","lines":[{"who":"Gran","text":"\u201cThe lift's been broken since March. It's always broken. What can anyone do about a lift?\u201d","cue":"one hand on the banister, the other on her knee"},{"who":"Sam","text":"\u201cIt's not a big deal, Gran. I'll take the stairs. I always take the stairs.\u201d","cue":"already two steps up, not turning round"}],"ask":"Each line makes part of a problem look smaller. Which part is it: whether it is there, whether it matters, whether it can change, or whether you can do anything about it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line makes one part of a problem smaller. Three parts are offered for each line. Pick the one the line is shrinking.","items":[{"type":"pick","who":"Daniel","text":"\u201cThere's no problem with the deck. The client never complained, so let's not go looking for one.\u201d","cue":"already closing the file","options":["The problem isn't there at all","The problem can't be changed","I can't do anything about it"],"answer":0,"why":"He says the problem is not there. No complaint means, in his view, no problem to find, so the deck is closed. That is the first level of shrinking: the problem is made so small it does not exist.","traps":{"1":"'The problem can't be changed' would sound like a shrug over a deck that has already gone out. It treats the mistake as fixed in place, so nobody checks the numbers, and the next client gets the same slip.","2":"'I can't do anything about it' would hand the deck to you alone. The talk would move to what you are unable to do, and the question of whether anything is wrong would never get asked."},"example":"A school office, Monday.<br>Clerk: \u201cNobody has complained about the bus fees, so there's no problem to look at.\u201d<br>Mum: \u201cI've had three emails about it this week.\u201d"},{"type":"pick","who":"Clara","text":"\u201cIt's one slip in a footnote. Nobody reads footnotes anyway, so it doesn't matter at all.\u201d","cue":"shrugging, already back at her screen","options":["The problem isn't there at all","The problem doesn't matter much","The problem can't be changed"],"answer":1,"why":"The slip is there, and she can see it. She makes it small by saying it does not matter, which is the second level. Once something is said not to matter, nobody is asked to fix it.","traps":{"0":"'The problem isn't there at all' would deny the slip exists. The team would be told there is nothing to check, the slip would stay in print, and nobody would know it was ever there to fix.","2":"'The problem can't be changed' would turn a footnote into a fact of life. The talk would go to whether footnotes can be edited, and the slip would stay where it is, with nobody asked to look."},"example":"A cricket scorecard, Sunday.<br>Scorer: \u201cIt's one run wrong in the total. Nobody reads the total, so it doesn't matter at all.\u201d<br>Captain: \u201cThe total is the whole point of the card.\u201d"},{"type":"pick","who":"Gran","text":"\u201cThe society sent another letter. They'll never fix the lift, not in my lifetime. Nothing in this building ever changes.\u201d","cue":"folding the letter in four, not looking up","options":["The problem doesn't matter much","The problem can't be changed","I can't do anything about it"],"answer":1,"why":"The problem is real, and she grants that. She makes it small by saying it can never change, which is the third level. A problem that cannot change is one nobody has to bring to the next meeting.","traps":{"0":"'It doesn't matter much' would sound like a shrug at a lift the whole building uses. The talk would stay on how bad the stairs are, and the letter would go in the drawer with no reply.","2":"'I can't do anything about it' would make the lift her own burden. The talk would turn to what she cannot do, and the society would be let off without anyone asking them for a date."},"example":"A bank queue, Tuesday.<br>Customer: \u201cThe machine's broken again. It's always broken. Nothing here ever gets fixed.\u201d<br>Clerk: \u201cThe counter is on the left. The form is on the desk.\u201d"},{"type":"pick","who":"Omar","text":"\u201cI'd raise it at the review, but they'd only look at me. I couldn't sort out the rota, not from where I sit.\u201d","cue":"staring at the rota on the wall","options":["The problem isn't there at all","The problem can't be changed","I can't do anything about it"],"answer":2,"why":"The rota is a real problem, and he says he has no way to move it. He makes his own part small: he cannot act from where he sits. That is the fourth level, and it is the most personal one. It keeps him out of the room where the rota gets decided.","traps":{"0":"'The problem isn't there at all' would say the rota has no problem in it. That closes the review before it starts, and Omar is spared the work of raising it.","1":"'The problem can't be changed' would blame the rota itself. The talk would go to whether a rota can be fixed, and Omar's own part would never come up, so the rota would stay as it is."},"example":"A school gate, Friday.<br>Mum: \u201cThe sports day clash is ridiculous, but I'm not on the committee, so I couldn't change it.\u201d<br>Friend: \u201cEmail the committee. It takes two minutes.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Harder now. All four parts of the problem are on the table, and each line can seem to fit more than one. Pick the part the line is working hardest to shrink.","items":[{"type":"pick","who":"Maya","text":"\u201cI'm not complaining. The night shifts have always been like this, and the hospital won't change the rota for a few nurses. It's just how the ward runs.\u201d","cue":"smiling, folding the same towel for the third time","options":["The problem isn't there at all","The problem doesn't matter much","The problem can't be changed","I can't do anything about it"],"answer":2,"why":"'Won't change the rota' is the third level: the problem is treated as fixed in place. The smile and the 'not complaining' keep it that way, and once a problem is fixed, nobody has to ask the hospital for anything.","traps":{"0":"'It isn't there at all' would deny the tired nights, and the towel-folding would look like fine work. Nobody would ask for relief, and the shifts would run on without a word.","1":"'It doesn't matter much' would make the night shifts a small thing. The talk would move to whether nurses should mind at all, and nobody would ask why the rota has not changed.","3":"'I can't do anything about it' would sound fair from one nurse, and it would close the matter for her. The talk would turn to what she cannot do, and the hospital would never be asked."},"example":"A factory line, Tuesday.<br>Worker: \u201cThe night shifts have always been like this. The company won't change the rota, so I'm not complaining.\u201d<br>Supervisor: \u201cThen put the rota problem in writing to HR by Friday.\u201d"},{"type":"pick","who":"Gran","text":"\u201cNobody's ever had a problem with the stairs. My knees are my own business, so don't fuss about them.\u201d","cue":"hauling the shopping up one step, then stopping to get her breath","options":["The problem isn't there at all","The problem doesn't matter much","The problem can't be changed","I can't do anything about it"],"answer":0,"why":"'Nobody's ever had a problem' says the problem is not there at all, which is the first level. Her hand on the rail and the stop for breath say otherwise. Once a problem is said not to exist, nobody has to look at the steps.","traps":{"1":"'It doesn't matter much' would make her breathing a small thing. The talk would move to the shopping, and the stairs would stay steep for the next visit.","2":"'It can't be changed' would turn the stairs into a permanent fact. Gran would be left with the bag, and nobody would ask about a rail.","3":"'I can't do anything about it' would make the stairs her own burden alone. You would offer to carry the bag, and the question of a rail would never reach the society."},"example":"A bus stop, Saturday.<br>Old man: \u201cNobody's ever had a problem with these steps. Don't fuss about the rail.\u201d<br>He stops halfway up and holds the rail with both hands."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"Sam, to Gran: \u201cIt's only a few days late, Gran. Hardly a big deal, and nobody's going to care about a few days.\u201d Which level of discounting is that, and what would a real step look like?","cue":"turning her cup, eyes on the stairwell","options":["Existence. He says the rent is not late at all. A real step would be to check the date on the bank statement.","Significance. He says a few days late is hardly a big deal. A real step would be to name a day when the rent will land, and say what the delay costs Gran.","Change possibilities. He says the rent cannot be paid any faster. A real step would be to ask Gran for a payment plan with a date on it.","Personal abilities. He says he has no power over the bank. A real step would be to set up a standing transfer for the first of the month."],"answer":1,"why":"Plain words first: he is making a late rent look small. The books call this discounting, and this is the significance level, the one that says the problem does not matter much. A real step names a day for the money and says what the delay costs Gran, so the problem is treated as one that matters.","traps":{"0":"Existence would say the rent is not late at all. Gran would hear that she has the date wrong, and the argument would be about the calendar, not about what the delay costs her.","2":"Change possibilities would say the rent cannot be paid any faster. Sam would be let off, the talk would turn to the bank, and no date would be set for the money.","3":"Personal abilities would say he has no power over the bank. A standing transfer would never be set up, because the step is treated as impossible before anyone has tried it."},"example":"A parent group chat, Monday.<br>Mum: \u201cIt's only the bake sale money, a few days late. Nobody will mind.\u201d<br>Treasurer: \u201cIt's fine, but I'd like it by Friday, please. The bank wants the date.\u201d"}]}],"debrief":{"nadia":"Every line in that week made some part of a problem smaller, and most of them picked the same few places to do it. Once you can say which part is being shrunk, you can ask the question that sits under it. That question is almost always the same one: what would a real step look like?","bookTerm":"Discounting","bookNote":"The books call this discounting: ignoring part of a problem without realising it, at one of four levels, which are that it exists, that it matters, that it can change, or that you can do anything about it."},"reflection":{"prompt":"Which part of a problem did you make smaller this week: whether it was there, whether it mattered, whether it could change, or whether you could change it?"},"next":"5.4","baseStory":{"setting":"Family","blurb":"Gran, a broken lift and Sam's late rent, all made to sound smaller than they are."},"moreStories":[{"setting":"Home & Flatmates","blurb":"A drip in the bathroom ceiling, a noon repair deadline, and flatmates who would rather not ask.","opener":{"setting":"Thursday, 7:10pm. Hawthorn Court, apartment 3B, the bathroom. A mixing bowl sits under the ceiling.","lines":[{"who":"Sam","text":"\u201cIt's condensation. It's from my showers. Look, it's even stopped dripping.\u201d","cue":"wringing a mop over the bath; a drop lands in the bowl as he says it"},{"who":"Maya","text":"\u201cThe agent's list closes at noon tomorrow. I'm on shift till seven, so.\u201d","cue":"coat still on, sleeve pulled down over her hand"}],"ask":"Each line makes part of a problem look smaller. Which part is it: whether it is there, whether it matters, whether it can change, or whether you can do anything about it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line makes one part of a problem smaller. Three parts are offered for each line. Pick the one the line is shrinking.","items":[{"type":"pick","who":"Sam","text":"\u201cThere's no leak. That's condensation off my showers. It always looks like that.\u201d","cue":"tipping the bowl into the sink, a fresh drop already ticking into it","options":["The problem doesn't matter much","The problem isn't there at all","The problem can't be changed"],"answer":1,"why":"He says there is no leak at all. The bowl on the floor and the tick of the drop say there is one. That is the first level of shrinking: the problem is made so small it is not there, so nobody has to ring anyone.","traps":{"0":"'It doesn't matter much' would let him admit the drip and shrug at it. He has gone further and said there is no drip. The talk would turn to how small a drip is, and whether it exists would never come up.","2":"'It can't be changed' would treat the drip as a fixed fact of the flat. Nobody would ask whether it is a leak, and the bowl would stay on the bathroom floor."},"example":"A kitchen, Sunday.<br>Dad: \u201cThat's not smoke, that's steam off the toast.\u201d<br>Mum, pointing up: \u201cThe alarm is going off.\u201d"},{"type":"pick","who":"Maya","text":"\u201cIt's a brown patch about the size of a saucer. Nobody gets worked up over a saucer.\u201d","cue":"ticking boxes in her notebook, not looking up","options":["The problem doesn't matter much","The problem isn't there at all","I can't do anything about it"],"answer":0,"why":"She can see the patch and she says so. She makes it small by calling it a saucer's worth, which is the second level: it does not matter much. If it is small, nobody has to report it.","traps":{"1":"'It isn't there at all' would deny the patch. She has just given its size and colour, so she grants it exists. The talk would go to whether the patch is real, and her point about size would slip by.","2":"'I can't do anything about it' would put the patch on her shoulders. She has not said that. The talk would move to what she is unable to do, and whether a saucer of damp deserves a report would go unasked."},"example":"A car park, Saturday.<br>Driver: \u201cIt's a scratch the size of a thumb. Nobody looks at a thumb.\u201d<br>Passenger: \u201cIf it rusts, the whole door goes.\u201d"},{"type":"pick","who":"Sam","text":"\u201cLandlords never fix anything. That's renting. You get a bowl and a bit of luck.\u201d","cue":"nudging the bowl straight with his foot","options":["The problem isn't there at all","The problem doesn't matter much","The problem can't be changed"],"answer":2,"why":"The drip is real and he says so. He makes it small by saying landlords never fix things, so nothing can change. That is the third level. If nothing ever changes, there is no reason to send the email.","traps":{"0":"'It isn't there at all' would say the damp is imaginary. He has just mentioned the bowl, so he grants it. The talk would circle round whether it exists, and 'never' would pass unchallenged.","1":"'It doesn't matter much' would sound like a shrug over a ceiling. He has not said it is small. He says nothing gets fixed, and the talk would miss the word 'never'."},"example":"A train platform, Monday.<br>Commuter: \u201cThe 7:40 is always late. Nothing ever changes on this line.\u201d<br>Guard: \u201cFill in the form on the board. Someone did last week and they added a carriage.\u201d"},{"type":"pick","who":"Maya","text":"\u201cThe tenancy's in Sam's name. An email from me would go straight in a folder. There's nothing I can do.\u201d","cue":"nodding at the bathroom door as she says it","options":["The problem isn't there at all","The problem can't be changed","I can't do anything about it"],"answer":2,"why":"The damp is real and an agent could repair it. She makes her own part small: from where she stands she can do nothing. That is the fourth level, the most personal one, and it keeps her out of the email.","traps":{"0":"'It isn't there at all' would deny the patch. She has not done that. The talk would turn to whether there is damp, and her own part would go unquestioned.","1":"'It can't be changed' would blame the building. She has said something about her place in the tenancy. The talk would go to whether a ceiling can be mended, and she would not be asked to write."},"example":"A gym, Friday.<br>Member: \u201cThe showers are freezing, but the booking is in my brother's name, so I couldn't complain.\u201d<br>Receptionist: \u201cFill in the form. Anyone who uses the pool can.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Harder now. All four parts of the problem are on the table, and each line can seem to fit more than one. Pick the part the line is working hardest to shrink.","items":[{"type":"pick","who":"Sam","text":"\u201cIt's a bowl and a mop. Three minutes a day, I've timed it. Hardly worth ringing the agent over.\u201d","cue":"holding his phone, thumb not moving","options":["I can't do anything about it","The problem isn't there at all","The problem can't be changed","The problem doesn't matter much"],"answer":3,"why":"'Hardly worth ringing' makes the damp small. The three minutes give it the look of something managed, and the phone in his hand shows he knows the call exists. It is the second level: it does not matter much, so no call is needed.","traps":{"0":"'I can't do anything about it' would fit the phone he does not use. He says the opposite: he can cope, and the call is the small thing. The talk would turn to what he cannot do, and 'hardly worth' would go through.","1":"'It isn't there at all' would deny the damp. He has just timed the mopping, so he grants it. The talk would circle whether the ceiling is wet, and 'hardly worth' would stand.","2":"'It can't be changed' would turn his three minutes into a life sentence. He has not said it will always drip. He says it is too small to bother with, and the talk would miss that."},"example":"A cafe, Wednesday.<br>Waiter: \u201cThe tap drips, but it's one cup a day. Hardly worth calling a plumber.\u201d<br>Owner: \u201cOne cup a day is a bucket a month, and the bill is on my desk.\u201d"},{"type":"pick","who":"Maya","text":"\u201cI've put 'bathroom, ongoing' on the sheet. These old blocks drag on for years. Nothing speeds a repair along.\u201d","cue":"pressing the pen so hard into the fridge sheet that it dents the paper","options":["The problem can't be changed","The problem doesn't matter much","The problem isn't there at all","I can't do anything about it"],"answer":0,"why":"'Nothing speeds a repair along' says the damp is stuck. That is the third level: it cannot change. Writing 'ongoing' makes it look tracked, and a tracked problem seems looked after, so nobody sends the email.","traps":{"1":"'It doesn't matter much' would fit her calm tone. She has not said it is small. She says repairs never speed up, and the talk would drift to whether damp is worth worrying about.","2":"'It isn't there at all' would deny it, yet she has written it on the sheet. The talk would miss that she grants the problem and then closes the door on a fix.","3":"'I can't do anything about it' would make the delay her own burden. She puts the delay on old blocks and slow repairs, so the talk would turn to her power, and the idea that repairs cannot be hurried would stay untested."},"example":"A garage, Thursday.<br>Customer: \u201cThey put 'parts on order' on the board. Parts always take weeks. Nothing speeds it up.\u201d<br>Mechanic: \u201cI can ring the supplier now and ask for a date.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"Sam, forty minutes before the agent's noon deadline, the draft email open on his laptop: \u201cI'm useless with agents. They talk over me and I fold. Best if I don't send anything.\u201d Which level of discounting is that, and what would a real step look like?","cue":"turning her cup, eyes on the laptop screen","options":["Existence. He says the damp is not worth an email, so it is not really there. A real step would be to photograph the patch with today's date on the screen and attach it to the report.","Significance. He says one email will change nothing important. A real step would be to put a weekly cost on the damp and ask the agent to weigh it against the price of a visit.","Personal abilities. He says he has no pull with agents. A real step would be three lines and a photo sent before noon, asking for a repair date, with Maya reading it first.","Change possibilities. He says agents talk over tenants and always will. A real step would be to ask the agent for the name of whoever books repairs, and for a day for the visit."],"answer":2,"why":"Plain words first: he is making his own part small. The books call this discounting, and this is the personal abilities level, the one that says nobody could expect anything of him. A real step is short and dated: three lines and a photo before noon, a repair date asked for, and Maya's eyes on it first.","traps":{"0":"Existence would say the damp is not there. Sam has just said what he would send if he could, so he grants the damp. A photo helps, but it leaves untouched the part he has made small: himself.","1":"Significance would say the email does not matter. Sam has said it matters enough to dread. The talk would turn to costs and visits, and he would still be sitting with an unsent draft.","3":"Change possibilities would say agents never act. Sam says something about himself, that he folds. A booking name is useful, but the step would skip the fear that keeps the draft unsent."},"example":"A parents' evening, Tuesday.<br>Dad: \u201cI'm no good with teachers. They talk over me, so I'd better not ask about the grade.\u201d<br>Mum: \u201cWrite your question on a card and read it out. I'll sit next to you.\u201d"}]}]},{"setting":"Relationships","blurb":"Omar's text to Clara has sat unanswered for four days, and everyone nearby has a theory.","opener":{"setting":"Thursday, 8:20pm. The Corner Table, the back table by the radiator. Two teas going cold.","lines":[{"who":"Gareth","text":"\u201cFour days, Omar. She read it on Sunday. The tick's gone blue and nothing since.\u201d","cue":"dragging a chip through the ketchup"},{"who":"Omar","text":"\u201cShe's got the release on Friday. It's nothing. I'll see her at standup.\u201d","cue":"turning his phone face down, then face up again"}],"ask":"Each line makes part of a problem look smaller. Which part is it: whether it is there, whether it matters, whether it can change, or whether you can do anything about it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line makes one part of a problem smaller. Three parts are offered for each line. Pick the one the line is shrinking.","items":[{"type":"pick","who":"Clara","text":"\u201cThere's nothing to answer. Nothing has happened. I don't know what anyone thinks they've seen.\u201d","cue":"phone face down under her saucer, thumb flat on top","options":["The problem isn't there at all","The problem doesn't matter much","I can't do anything about it"],"answer":0,"why":"She says nothing has happened. The phone under the saucer says a message is waiting. That is the first level: the problem is made so small it is not there, so nothing needs answering.","traps":{"1":"'It doesn't matter much' would let her admit the text and shrug at it. She goes further and says there is nothing at all. The talk would turn to how small the text is, and the phone under the saucer would stay hidden.","2":"'I can't do anything about it' would sound like a woman stuck with a phone. She says no message and no event. The talk would turn to what she cannot do, and her claim that nothing exists would go by."},"example":"A staff kitchen, Monday.<br>Colleague: \u201cThere was no row with Theo. Nothing happened.\u201d<br>Friend, looking at the two empty chairs: \u201cHe moved his desk to the other floor.\u201d"},{"type":"pick","who":"Gareth","text":"\u201cFour days is nothing. People leave texts for a week. It doesn't mean a thing, mate.\u201d","cue":"dragging a chip through the ketchup","options":["The problem isn't there at all","The problem doesn't matter much","The problem can't be changed"],"answer":1,"why":"He agrees the text has sat there and then shrinks it: four days is nothing. That is the second level, it does not matter much. If it is nothing, Omar has no reason to do anything.","traps":{"0":"'It isn't there at all' would deny the four days. Gareth counted them himself a minute ago, so he grants it. The talk would circle whether the text exists, and 'it doesn't mean a thing' would slide through.","2":"'It can't be changed' would make the silence permanent. He says the opposite: a week is normal, which is a different shrug. The talk would miss that he is calling it small."},"example":"A garden fence, Saturday.<br>Neighbour: \u201cThe parcel has sat in the hall for a fortnight. It's nothing.\u201d<br>Other neighbour: \u201cIt's addressed to the woman who moved out in March.\u201d"},{"type":"pick","who":"Clara","text":"\u201cIt's been too long now. Once a text has sat four days, there's no answering it. Any reply looks wrong.\u201d","cue":"tearing a sugar sachet into strips","options":["The problem doesn't matter much","The problem can't be changed","I can't do anything about it"],"answer":1,"why":"The text is there and she knows how long it has sat. She makes it small by saying no reply can fix it. That is the third level: it cannot change. A problem nobody can mend is one nobody has to try to mend.","traps":{"0":"'It doesn't matter much' would sound like a woman who has stopped caring. She is plainly caring, because she has torn a sachet to strips. She says no reply can work, and the talk would miss that.","2":"'I can't do anything about it' would make the silence her weakness. She puts the blame on time, not on herself. The talk would turn to her, and the idea that four days is a wall would stay in place."},"example":"A group chat, Wednesday.<br>Friend: \u201cIt's been a month since the birthday, so I can't say sorry now. It would be weird.\u201d<br>Sister: \u201cIt's weirder to say nothing for another month.\u201d"},{"type":"pick","who":"Omar","text":"\u201cI asked. That was my go. I can't make anyone answer, so it's out of my hands.\u201d","cue":"flattening a paper napkin with the side of his hand","options":["I can't do anything about it","The problem can't be changed","The problem isn't there at all"],"answer":0,"why":"What he did is fair: he asked, plainly. He makes his own part small by saying there is nothing more he can do. That is the fourth level, the most personal one. It keeps him from the next step, which is to ask her in person.","traps":{"1":"'It can't be changed' would make the silence a law of nature. He talks about his own reach, not about time or the world. The talk would go to whether silences can end, and his own next move would go unasked.","2":"'It isn't there at all' would deny the text. He has just said he sent it, so he grants it. The talk would circle whether there is a problem and miss what he says he cannot do."},"example":"A phone call, Sunday.<br>Brother: \u201cI left a voicemail. I can't make Dad ring back, so it's out of my hands.\u201d<br>Sister: \u201cPop round on Saturday. He's in all afternoon.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Harder now. All four parts of the problem are on the table, and each line can seem to fit more than one. Pick the part the line is working hardest to shrink.","items":[{"type":"pick","who":"Clara","text":"\u201cI was going to answer. I'm hopeless at texting, always have been. Whatever I wrote would come out wrong.\u201d","cue":"laughing, pulling her cuff down over her hand","options":["The problem doesn't matter much","I can't do anything about it","The problem isn't there at all","The problem can't be changed"],"answer":1,"why":"'Hopeless at texting' puts the trouble in her own hands: she says she cannot. That is the fourth level. The laugh and the cuff make it sound small and charming, which is how it stays unfixed. She could say it aloud now.","traps":{"0":"'It doesn't matter much' would fit the laugh. She treats the texting as a quirk, but what she says is that she cannot do it. The talk would drift to whether quirks matter, and 'hopeless' would stand.","2":"'It isn't there at all' would deny the text, yet she says she meant to answer it. The talk would circle whether there is a gap and miss the claim about her own skill.","3":"'It can't be changed' would make her one fixed sort of person. She says 'whatever I wrote' about this one text, so the line is about her power in this moment. The talk would go to her character."},"example":"A school office, Tuesday.<br>Dad: \u201cI'm hopeless at forms, always have been. Whatever I put would be wrong.\u201d<br>Secretary: \u201cWrite it in pencil. I'll look it over with you.\u201d"},{"type":"pick","who":"Gareth","text":"\u201cAsk her outright, over a text? You'd look daft. It's hardly worth a conversation.\u201d","cue":"peeling the label off a bottle","options":["The problem isn't there at all","The problem can't be changed","The problem doesn't matter much","I can't do anything about it"],"answer":2,"why":"'Hardly worth a conversation' makes the question small. The 'you'd look daft' tugs at Omar's pride, which makes the shrink easier to swallow. It is the second level: it does not matter much, so no one has to ask.","traps":{"0":"'It isn't there at all' would deny any gap between them. Gareth has just counted the days, so he grants it. The talk would circle whether there is a silence, and 'hardly worth' would stand.","1":"'It can't be changed' would fit 'you'd look daft', as if asking will always fail. His words are about the size of the matter. The talk would turn to whether asking works, and the small-making would go by.","3":"'I can't do anything about it' would make Omar powerless. Gareth says Omar could ask but should not bother. The talk would move to what Omar cannot do, which is not what was said."},"example":"A work chat, Thursday.<br>Colleague: \u201cAsk the manager about the rota in person? It's hardly worth a conversation.\u201d<br>Friend: \u201cIt's her who decides who works Christmas.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"Clara, at the counter after closing: \u201cPeople on the same team can't go out together. It always turns awkward. There's no way to make that work.\u201d Which level of discounting is that, and what would a real step look like?","cue":"wiping a clean counter, not looking up","options":["Existence. She says there is nothing going on between them. A real step would be to reread Omar's message and answer the one question it asks, with a yes or a no.","Significance. She says an awkward week is small beside a good job. A real step would be to write down the two sides plainly and look at which one weighs more for her.","Personal abilities. She says she cannot cope with the awkwardness. A real step would be to practise the reply with a friend and send it before the end of the weekend.","Change possibilities. She says no arrangement can work. A real step would be to ask Omar what he wants and agree what each does at the office if it goes badly."],"answer":3,"why":"Plain words first: she is saying the situation cannot change. The books call this discounting, and this is the change possibilities level. Real teams have found ways to do this, and a real step starts with a plain question to Omar and one agreed rule for the office.","traps":{"0":"Existence would say nothing is going on. Clara has just described what might go on, so she grants it. A yes or no helps, but it would skip the belief that no arrangement could hold.","1":"Significance would say the awkwardness does not matter. Clara thinks it matters a great deal, which is why she is wiping a clean counter. A list of sides would sit beside the claim that nothing can work.","2":"Personal abilities would say she cannot cope. She says no arrangement can work for anyone. Practising a reply is a fair idea, and it would leave 'always turns awkward' untouched."},"example":"A break room, Friday.<br>Manager: \u201cTwo people from sales can't share a lift to the client. It never works out.\u201d<br>Colleague: \u201cThey did it for three years at my old firm. They took separate cars on bad days.\u201d"}]}]},{"setting":"Work","blurb":"A test that fails one run in five, a release at four tomorrow, and nobody looking.","opener":{"setting":"Thursday, 3:40pm. Halden, the team room. The red-screened laptop is back on the end desk.","lines":[{"who":"Daniel","text":"\u201cRelease is tomorrow at four. The pipeline's green, so we're fine. Nobody touch anything.\u201d","cue":"halfway into his coat"},{"who":"Clara","text":"\u201cIt went red twice this morning. The third run came up green.\u201d","cue":"both hands flat on the desk, voice low"},{"who":"Omar","text":"\u201cWhich test?\u201d","cue":"swivelling his chair round"},{"who":"Daniel","text":"\u201cGreen is green, Omar.\u201d","cue":"already at the door"}],"ask":"Each line makes part of a problem look smaller. Which part is it: whether it is there, whether it matters, whether it can change, or whether you can do anything about it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line makes one part of a problem smaller. Three parts are offered for each line. Pick the one the line is shrinking.","items":[{"type":"pick","who":"Clara","text":"\u201cI'm eight months in. A word from me to Daniel about the pipeline would go nowhere. There's nothing I can do.\u201d","cue":"pulling her chair closer to the desk, voice low","options":["The problem doesn't matter much","I can't do anything about it","The problem can't be changed"],"answer":1,"why":"The test is a real problem and she has seen it fail. She makes her own part small: from her seat she can do nothing. That is the fourth level, the most personal one, and it keeps her out of Daniel's office.","traps":{"0":"'It doesn't matter much' would turn a red run into trivia. She has not said it is small. She says her voice carries no weight, and the talk would miss that.","2":"'It can't be changed' would blame the pipeline. She talks about herself and Daniel. The talk would go to whether pipelines get fixed, and she would not be asked to speak up."},"example":"A shop floor, Wednesday.<br>New hire: \u201cI'm only on probation. A word from me about the till would go nowhere.\u201d<br>Colleague: \u201cPut it on the sheet by the door. The manager reads it on Fridays.\u201d"},{"type":"pick","who":"Daniel","text":"\u201cThere's no flaky test. The pipeline's green. Show me red on the dashboard and I'll listen.\u201d","cue":"not looking up from his phone","options":["The problem isn't there at all","The problem can't be changed","I can't do anything about it"],"answer":0,"why":"He says there is no flaky test at all. Clara has just told him it went red twice, so the evidence is in the room. That is the first level: the problem is made so small it is not there. He closes the door on it before anyone opens it.","traps":{"1":"'It can't be changed' would make the flakiness a given. He has not granted it exists. The talk would turn to whether flaky tests can be fixed, and his 'there is no flaky test' would go by.","2":"'I can't do anything about it' would put the test out of his reach. He says it does not exist, which is a different shrug. The talk would move to what he cannot do, and the evidence would stay unexamined."},"example":"A bakery, Monday.<br>Owner: \u201cThere's no mouse. I've never seen one. Show me a dropping and I'll listen.\u201d<br>Cleaner, holding a bag: \u201cHere.\u201d"},{"type":"pick","who":"Sam","text":"\u201cOne red in five. You hit rerun and it clears. A ticket for that would be daft, it's a rounding error.\u201d","cue":"headphones on, one ear out","options":["The problem doesn't matter much","The problem isn't there at all","The problem can't be changed"],"answer":0,"why":"He grants the failures and shrinks them: one in five is a rounding error. That is the second level, it does not matter much. If it is only rounding, a ticket looks silly and the test stays as it is.","traps":{"1":"'It isn't there at all' would deny the failures. Sam gives the number himself, so he grants them. The talk would circle whether the test fails, and 'rounding error' would go by.","2":"'It can't be changed' would turn one in five into a permanent figure. He says it is too small for a ticket, not that it is stuck. The talk would miss the shrug at the size."},"example":"A kitchen, Tuesday.<br>Housemate: \u201cThe oven runs one in five a bit hot. A repair would be daft, it's a rounding error.\u201d<br>Other housemate: \u201cThe cake you burnt on Sunday was that one in five.\u201d"},{"type":"pick","who":"Daniel","text":"\u201cEvery team has flaky tests. They've always been flaky, they always will be. You live with it.\u201d","cue":"tapping the red-screened laptop with a pen","options":["The problem isn't there at all","The problem doesn't matter much","The problem can't be changed"],"answer":2,"why":"He grants the test is flaky and says it will always be so. That is the third level: it cannot change. A problem that is always there asks nothing of anybody. It also gets handed to the next team.","traps":{"0":"'It isn't there at all' would deny the flakiness. He has just called it flaky, so he grants it. The talk would circle whether there is a problem and miss 'always will be'.","1":"'It doesn't matter much' would fit 'you live with it'. The talk would turn to how little it costs, and the word 'always' would pass."},"example":"A workshop, Thursday.<br>Foreman: \u201cThe saw has always wandered. All saws wander. You live with it.\u201d<br>Apprentice: \u201cThe new one in the catalogue says it holds a line.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Harder now. All four parts of the problem are on the table, and each line can seem to fit more than one. Pick the part the line is working hardest to shrink.","items":[{"type":"pick","who":"Clara","text":"\u201cIt passed on the fourth go, so I've pasted the log into the release notes. The suite's just built like that. It can't be steadier before four.\u201d","cue":"nodding along, already typing 'green' into the form","options":["The problem can't be changed","The problem doesn't matter much","The problem isn't there at all","I can't do anything about it"],"answer":0,"why":"'It can't be steadier before four' says the flakiness cannot change. The pasted log makes it look handled, which is the trick: a recorded problem seems dealt with. It is the third level, and the nod keeps the matter shut.","traps":{"1":"'It doesn't matter much' would fit the calm typing. She has put the log in the notes, which shows it matters to her. The talk would drift to how small it is, and 'can't be steadier' would stand.","2":"'It isn't there at all' would deny it, yet she pasted the log. The talk would miss that she grants the problem and says it is fixed in place.","3":"'I can't do anything about it' would put the matter on her alone. She says the suite is built that way, which is about the suite. The talk would turn to her, and nobody would ask for the time to fix it."},"example":"A kitchen, Thursday.<br>Cook: \u201cI've written 'sauce splits' on the board. The sauce just splits. It can't be steadier on a busy night.\u201d<br>Chef: \u201cAdd the butter off the heat and it holds.\u201d"},{"type":"pick","who":"Sam","text":"\u201cRed screen? Nobody's flagged a red screen to me. If it were real, someone would have said by now.\u201d","cue":"one ear of the headphones off, eyes on his own monitor","options":["The problem doesn't matter much","The problem can't be changed","The problem isn't there at all","I can't do anything about it"],"answer":2,"why":"'Nobody's flagged' says the red screen is not there. The laptop on the end desk shows it plainly. That is the first level: the problem is made so small it does not exist, and 'someone would have said' leaves Clara, who has said, unheard.","traps":{"0":"'It doesn't matter much' would fit his easy tone. He does not say the red screen is small. He says it has not been reported, and the talk would miss the claim that it does not exist.","1":"'It can't be changed' would turn the red screen into a given. He has not granted it exists. The talk would go to whether red screens can be cleared, and nobody would look at the end desk.","3":"'I can't do anything about it' would sound like a man who cannot act. Sam says there is nothing to act on. The talk would move to what he is unable to do, and he would not be asked to look."},"example":"A library, Wednesday.<br>Assistant: \u201cNobody's told me the roof leaks. If it were real someone would have said.\u201d<br>Reader, holding a wet book: \u201cI'm saying it now.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"Daniel, to the room at ten past four: \u201cOne failed run on a Thursday is nothing. Hardly worth stopping the team for.\u201d Which level of discounting is that, and what would a real step look like?","cue":"turning her cup, eyes on the red-screened laptop","options":["Existence. He says the failed run did not happen. A real step would be to put the red result from the dashboard on the shared screen where the team can read it.","Significance. He says one failed run hardly matters. A real step would be to name the test that fails and say what a red run at four tomorrow would cost the client demo.","Change possibilities. He says flaky tests cannot be mended. A real step would be to ask Omar for two hours tonight to look for the cause, and to report by Friday morning.","Personal abilities. He says the build is out of the team's hands. A real step would be to ask the owner of the build for the log and a date when they could look at it."],"answer":1,"why":"Plain words first: he is making a failed run look small. The books call this discounting, and this is the significance level, the one that says the problem does not matter much. A real step names the test and puts a cost on a red run at four tomorrow, so the problem is treated as one that matters.","traps":{"0":"Existence would say the run did not fail. Daniel has just said it did, so he grants it. The talk would turn to the dashboard, and the shrug about its size would go by.","2":"Change possibilities would say tests cannot be mended. Daniel says the run is nothing, not that it is stuck. Two hours with Omar is a good move, and it would not touch the claim that the failure is small.","3":"Personal abilities would say the team has no hand in the build. Daniel gives no sign of that. Asking the owner for the log would help, and it would leave 'nothing' unchallenged."},"example":"A bus depot, Monday.<br>Supervisor: \u201cOne bus off the road is nothing. Hardly worth a meeting.\u201d<br>Planner: \u201cIt was the one on the school run. Three schools start late tomorrow.\u201d"}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://vaibhav-labs.github.io/TA/arena/","next":{"slot":"5.4","title":"Four Ways to Do Nothing","url":"https://vaibhav-labs.github.io/TA/arena/5-4.html"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  // If the hub's setting filter sent us here with ?setting=X and this game has that
  // setting, go straight into it instead of asking again on a "choose a setting" screen.
  var PRESET_STORY = -1;
  try {
    var wantSetting = new URLSearchParams(window.location.search).get("setting");
    if (wantSetting) {
      for (var si = 0; si < STORIES.length; si++) {
        if (STORIES[si].setting === wantSetting) { PRESET_STORY = si; break; }
      }
    }
  } catch (e) { /* URLSearchParams unsupported: fall through to the picker */ }
  if (PRESET_STORY >= 0) useStory(PRESET_STORY);
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: (MULTI && PRESET_STORY < 0) ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
