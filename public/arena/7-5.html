<script>window.TA_GAME = {"slot":"7.5","title":"Awareness, Spontaneity, Intimacy","world":7,"worldName":"Autonomy","week":7,"weekName":"Your Own Person","mechanic":"Choice-story","concept":"After this one you can pick the move that is yours in three short moments, not the one you were trained to make.","plainWord":"being your own person","bookTerm":"Awareness, spontaneity, intimacy","bookIdea":"Berne says autonomy shows up as three recovered capacities: awareness, which is seeing and hearing for yourself in the here and now instead of as you were taught; spontaneity, which is the freedom to choose and show your feelings from the whole range of Parent, Adult and Child instead of only the taught ones; and intimacy, which is game-free candour, and he adds that you start life with all three, lose them to early adaptation, and have to keep winning them back.","bookSource":"Games People Play, ch. 16 and 17","opener":{"setting":"Saturday, 10:15am, the balcony, Hawthorn Court, apartment 3B. The sun is already hot on the railings.","lines":[{"who":"Gran","text":"\u201cMorning, love. Sit down, I've got something for you.\u201d","cue":"coming up the step slowly, one hand on the railing, knees creaking"}],"ask":"In each of the next three moments, which move is yours, and which one is the script?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Being your own person has three parts. Noticing is seeing and hearing for yourself, here and now, in your own way and without the labels you were handed. Choosing fresh is picking the feeling and the reply you want from all your voices, including the ones you were never taught to use. Being real is plain candour with no game in it.","items":[{"type":"pick","who":"You","text":"\u201cHang on, Gran. Smell that. It's sharp and cold, and the peel is thick on one side.\u201d","cue":"peeling the orange, eyes on your thumbs","options":["Noticing","Choosing fresh","Being real"],"answer":0,"why":"You take the orange in with your own senses, here and now, and describe it in your own words instead of saying the polite thing you were taught. That is noticing.","traps":{"1":"Choosing fresh. It sounds like a new reply, but the line only describes the orange. Nothing was picked against a habit.","2":"Being real. It is honest, but the line tells her nothing about how you feel. It stays with the orange, which is noticing."},"example":"Mango stall, by the bus stop, Saturday, 8:00am.<br>Customer: \u201cThese look tired. Is the one at the front fresher?\u201d<br>Vendor: \u201cYes. Smell it, you'll see.\u201d"},{"type":"pick","who":"You","text":"\u201cFine is what I always say. Tonight it's starving, and a bit cross, and I want a biscuit before the rice.\u201d","cue":"to Maya, at the stove, who expected 'fine'","options":["Noticing","Choosing fresh","Being real"],"answer":1,"why":"You catch the usual 'fine' coming and pick a different feeling to show, a hungry, cross, playful one. Choosing which feeling to show, instead of only the taught one, is choosing fresh.","traps":{"0":"Noticing. You do catch the habit, but the work of the line is picking a different feeling to show. Noticing alone would stop at 'I'm about to say fine'.","2":"Being real. It is honest, but the heart of the line is the switch from the taught reply to a chosen one. The candour in it comes second."},"example":"Office lift, Monday, 8:55am.<br>Colleague: \u201cGood weekend?\u201d<br>You (who always say \u201cYes, fine\u201d): \u201cLoud. A wedding, and I'm shattered, and I loved it.\u201d"},{"type":"pick","who":"You","text":"\u201cNo, Mum, I skip lunch when the deadlines close in. I'm scared the money won't stretch, and I didn't want you to worry.\u201d","cue":"on the balcony, phone pressed to your ear","options":["Noticing","Choosing fresh","Being real"],"answer":2,"why":"You say the plain thing with no joke, no hint and no hook, and no game in it. That is being real.","traps":{"0":"Noticing. You do notice the deadlines, and that is in the line. But noticing alone stays on the facts, and this line goes on to say how you feel.","1":"Choosing fresh. It is a new answer to 'are you eating', but what makes it new is the honesty, so the better name is being real."},"example":"Sister's WhatsApp, Sunday night.<br>Sister: \u201cAre you sleeping? Tell me the truth.\u201d<br>You: \u201cNot well. The baby's cough keeps me up, and I didn't want to say it.\u201d<br>Sister: \u201cOh. Now we can talk.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Three short scenes. In each one, pick the move that is yours, not the one you were taught.","items":[{"type":"scene","title":"Saturday, 10:15am, the balcony","setting":"Gran has come up the step with a single orange from the morning stall, still cold from the bag.","meters":{"you":60,"them":50},"beats":[{"who":"Gran","text":"\u201cEat this orange while it's cold. I walked to the stall for it this morning.\u201d","cue":"pressing it into your hand","lines":[{"text":"\u201cThank you, Gran. You shouldn't have gone out.\u201d","tag":"ok","you":0,"them":2,"outcome":"She waves it off. \u201cWalking is good for me,\u201d she says, and sits down on the step.","why":"This is the polite script. It is kind, and it skips the orange, which is the thing she actually gave you."},{"text":"\u201cIt smells sharp. Did you pick it yourself, or is that the stall's?\u201d","tag":"best","you":3,"them":4,"outcome":"Gran's face opens. \u201cI picked it. Look, you can see my thumb mark on the skin.\u201d","why":"You notice what is actually here, the smell and the thumb mark on the peel. Noticing gives her something real back."},{"text":"\u201cYou always do this. Now I owe you, and you'll keep telling me so.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Gran puts the orange on the step and says nothing about it.","why":"This turns a gift into a debt. The orange becomes a ledger entry, and she will keep reminding you of the price."}]},{"who":"Gran","text":"\u201cGo on, peel it. Tell me something from the week. I never hear anything.\u201d","cue":"watching your hands on the peel","lines":[{"text":"\u201cI'm peeling it badly. The demo went well, and I'm a bit proud of it.\u201d","tag":"best","you":3,"them":4,"outcome":"Gran claps once. \u201cBadly is still an orange,\u201d she says, and leans in for the details.","why":"You say how you are, with a small true detail about yourself. It is a fresh line, not the one you would have said at the start of the year."},{"text":"\u201cNothing much happened this week, Gran.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She nods and goes back to her knee, which she describes in full.","why":"It is the scripted small talk. That closes the door on the one thing she asked for."}]},{"who":"Gran","text":"\u201cIs it sweet? Tell me it's sweet, or I'll think the stall cheated me.\u201d","cue":"laughing at her own joke, one hand on the railing","lines":[{"text":"\u201cIt's sweet at the back and sharp at the front. A bit like you, Gran.\u201d","tag":"best","you":3,"them":4,"outcome":"She pats your arm. \u201cFlatterer. Eat the rest, and don't waste the peel.\u201d","why":"You notice the taste exactly, and you say one true thing about her. It has warmth in it because it is specific."},{"text":"\u201cIt's lovely, Gran. Thank you.\u201d","tag":"ok","you":0,"them":1,"outcome":"She nods, pleased. Then she asks about the knee again.","why":"A polite yes that ends the moment. There is nothing wrong with it, and nothing new in it either."}]}],"payoff":"Saturday, 10:40am. The orange goes soft on the step, and Gran brings up the debt at lunch and again at dinner.","example":"Sweet shop, by the bus stop, Friday.<br>Shopkeeper: \u201cTry the fudge, it's on the house. You can owe me a visit.\u201d<br>You: \u201cThanks. Which one's the fresh one?\u201d"},{"type":"scene","title":"Tuesday, 8:20pm, the kitchen","setting":"Apartment 3B. Maya is at the stove, still in her scrubs. The rice has been on for an hour.","meters":{"you":55,"them":45},"beats":[{"who":"Maya","text":"\u201cDid you eat? Don't say fine.\u201d","cue":"not turning round","lines":[{"text":"\u201cI'm fine, Maya. I'll eat later.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"Maya says \u201cFine\u201d back and turns the gas down. The kitchen goes quiet.","why":"This is the trained reply. It answers the question and closes the door, so the two of you carry on apart."},{"text":"\u201cNo, I haven't. Sit with me for ten minutes while I eat, if you can.\u201d","tag":"best","you":4,"them":4,"outcome":"Maya turns round, surprised. She pulls out a chair. \u201cTen minutes. Then I'm back on the rice.\u201d","why":"You answer from a fresh place, with the true thing and a request for company. It breaks the old loop, and she gets to be asked for something instead of only doing the cooking."},{"text":"\u201cSure, Maya. Like you ever sit down for anyone.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Maya stops stirring and says \u201cRight,\u201d then eats standing at the sink, alone.","why":"This is a sting dressed up as a reply. It gives her the accusation she has already filed, and nobody sits down."}]},{"who":"Maya","text":"\u201cOkay. Then what's the matter? You look like you're carrying the whole building.\u201d","cue":"pulling out the chair, not sitting yet","lines":[{"text":"\u201cNothing serious. Just work.\u201d","tag":"ok","you":-1,"them":0,"outcome":"She nods and turns back to the rice.","why":"Work is the safe answer, and it keeps the two of you at arm's length."},{"text":"\u201cThe bank called about the deposit, and I've been telling everyone it's fine all day.\u201d","tag":"best","you":3,"them":4,"outcome":"Maya sits down, for the first time all day. \u201cThen it isn't fine. Tell me the number.\u201d","why":"You name the word you have been using as a shield, and the real thing under it. Choosing fresh is a line that didn't come from the reflex."}]},{"who":"Maya","text":"\u201cRight. Ten minutes. Tell me the number, and don't make it smaller.\u201d","cue":"a plate in each hand now, setting one down for you","lines":[{"text":"\u201cIt's a big fee, and I told the landlord Friday. I'm not calm about it at all.\u201d","tag":"best","you":3,"them":4,"outcome":"Maya puts the plate down. \u201cOkay. Friday's a real day. Let's do the sums.\u201d","why":"You give the true number with the deadline, and you don't shrink it. Being real means saying the thing at its actual size."},{"text":"\u201cIt's fine, we'll sort it.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She picks her plate up again. \u201cGood, then,\u201d and eats standing at the stove.","why":"Fine again. It shuts the door she just opened, and it leaves her eating alone in the same kitchen."}]}],"payoff":"Tuesday, 8:40pm. Maya stops stirring and eats standing at the sink, alone. The rice goes cold on the back burner.","example":"Chemist shop, by the station, 7:30pm.<br>Pharmacist: \u201cAre you feeling okay? Tell me the truth.\u201d<br>You: \u201cNot really. I've got a cough that keeps me up.\u201d"},{"type":"scene","title":"Sunday, 9:30pm, the balcony","setting":"Mum calls from 600 km away, the way she does on the ten-minute mark of your evening. A tap is running in the background at her end.","meters":{"you":50,"them":50},"beats":[{"who":"Mum","text":"\u201cAre you eating properly? Tell me the truth, not the thing you say.\u201d","cue":"her voice at the edge of worry, the tap still running","lines":[{"text":"\u201cYes, Mum, I eat every day. Don't worry.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Mum says \u201cGood, good,\u201d and then asks about the rent again, which means she heard the gap in your voice.","why":"This is the script: the reassurance that closes the call on the worry. It sounds loving, and it leaves her with a number she can't check."},{"text":"\u201cNot always. When the deadlines close in, I skip lunch, and I'm scared the money won't stretch. I didn't want you to worry.\u201d","tag":"best","you":4,"them":5,"outcome":"There is a long pause. Then Mum says she'd rather know the days you skip, so she can call you at lunch.","why":"This is being real: plain candour with no game in it. You don't have to sound strong for the call, and she can hear where you actually are."},{"text":"\u201cYou always do this. Dad was the same, and now you want me to worry about you too.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Mum says \u201cFine,\u201d and ends the call before you can answer.","why":"This turns her worry into a charge against Dad and against you. The real question disappears under the old story."}]},{"who":"Mum","text":"\u201cThen what do you want from me? Tell me what you need.\u201d","cue":"the tap goes off at her end","lines":[{"text":"\u201cI want you to ask how I am, and then wait for the real answer.\u201d","tag":"best","you":3,"them":4,"outcome":"Mum goes quiet, then asks, \u201cHow are you, then?\u201d and waits.","why":"You say what you want, plainly, without asking her to fix your life. That is a real request for company, not a rescue."},{"text":"\u201cDon't worry about it, Mum. It'll sort itself out.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"She sighs and says Dad would have said the same. The call drifts off to the building society.","why":"This is the scripted close. It takes the need off the table and tells her the real thing isn't wanted."}]},{"who":"Mum","text":"\u201cTell me about your week, then. I never get to hear it.\u201d","cue":"the kettle starting at her end","lines":[{"text":"\u201cThe orange was sour, Mum. Gran made me laugh about the stall. Next time I'll call you from the balcony when it's quiet.\u201d","tag":"best","you":4,"them":6,"outcome":"Mum laughs, properly, for the first time in the call. \u201cBalcony, then. Ring me on Sunday.\u201d","why":"You offer a small, true detail from your week, which is a real gift to her. It doesn't need to be a confession to count as intimacy."},{"text":"\u201cWork's fine. Nothing to tell.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She says \u201cOkay,\u201d in the voice that means it isn't okay, and the call ends on the building society.","why":"This is the scripted close. It leaves her with the sense of a door shut, which is exactly what she was afraid of."}]}],"payoff":"Sunday, 9:45pm. Mum says \u201cFine\u201d and ends the call. In the morning she sends a photo of the kitchen calendar, with the holiday weekend circled and nothing else written on it.","example":"Gym, by the bus stop, Saturday.<br>Trainer: \u201cAre you doing the reps, or just standing there?\u201d<br>You: \u201cStanding. My shoulder's sore, and I didn't want to say so.\u201d<br>Trainer: \u201cGood. Then we do the easy set.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Name the part that was missing from that reply. Then sort three more moments.","items":[{"type":"pick","who":"Maya","text":"\u201cDid you eat? Don't say fine.\u201d You said fine anyway, though you knew you hadn't eaten, and the kitchen went quiet.","cue":"the spoon still in her hand","options":["Intimacy. You said too much to Maya, and the line handed her a weight she didn't need.","Spontaneity. 'Fine' was the reply you were taught for that question. The books call the freedom to choose and show a feeling from all your voices spontaneity, and you didn't use it.","Awareness. You didn't hear her question, so the reply came out of nowhere."],"answer":1,"why":"You knew you hadn't eaten, so awareness was working. The word 'fine' arrived without a choice, straight from what you were taught. Choosing a feeling from all your voices, instead of only the taught one, is spontaneity.","traps":{"0":"Intimacy. You didn't say too much, since the line gave her almost nothing. Candour does come into it, but a candid reply starts with picking a feeling to show, and 'fine' was never picked.","2":"Awareness. You heard the question and you knew the answer. The gap was in the reply you gave after that."},"example":"Dance class, Wednesday, 6:00pm.<br>Teacher: \u201cHow's your week? Don't say fine.\u201d<br>Student: \u201cFine.\u201d<br>Teacher: \u201cRight, see you Friday, then.\u201d"},{"type":"sort","prompt":"Three more moments, each with one capacity missing. Put each in the bin for the one that was missing.","bins":["Awareness","Spontaneity","Intimacy"],"items":[{"text":"\u201cI walked home rehearsing what to say to Daniel on Monday. The rain had stopped, and I never saw it.\u201d","answer":0,"why":"Body on the pavement, mind in Monday's meeting. Berne's test for awareness is where your mind is while your body is here."},{"text":"\u201cGran handed me the orange and I said \u2018You shouldn't have\u2019, same as always, though I was pleased and curious.\u201d","answer":1,"why":"Only the taught reply was on offer. Spontaneity is having the whole range of feelings to choose from, and here one rehearsed line covered all of them."},{"text":"\u201cI told Mum I was fine, then dropped hints about the bank, hoping she would offer to pay.\u201d","answer":2,"why":"The hints are a hook. Intimacy is candour with no game in it, and a hint is the opposite of asking plainly."}],"example":"Station platform, 8:05am.<br>Colleague: \u201cEverything all right?\u201d<br>You, eyes on your phone: \u201cFine.\u201d<br>You are three stops past the one where you meant to get off."}]}],"debrief":{"nadia":"The three work together, and you won't have all of them every time. The pull back to the old reply never goes away for good, so the work is to keep noticing it. Each time you catch it, you get a choice again.","bookTerm":"Awareness, spontaneity, intimacy","bookNote":"The books call these awareness, spontaneity and intimacy, the three capacities of autonomy. Berne adds that overthrowing the old ways is never final, so you keep winning them back."},"reflection":{"prompt":"Where did you give the scripted reply this week when a fresh one was there? What would the fresh one have been?"},"next":"7.6"};</script>
<script>window.TA_NAV = {"hub":"https://vaibhav-labs.github.io/TA/arena/","next":{"slot":"7.6","title":"After Games, What?","url":"https://vaibhav-labs.github.io/TA/arena/7-6.html"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  var ITEMS = [];
  ((GAME && GAME.rounds) || []).forEach(function (round) {
    (round.items || []).forEach(function (item, i) {
      ITEMS.push({ round: round, item: item, first: i === 0 });
    });
  });
  var TOTAL = ITEMS.length;

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else state.screen = "debrief";
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = GAME.opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (GAME.rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">TA Arena · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no">' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →");
    bindNext(advance);
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">✓ Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">✗ Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">✓ Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">✗ Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "✓ Right call" : "✗ Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function renderEnd() {
    var hub = safeUrl(NAV.hub);
    var nxt = NAV.next || null;
    var links = hub ? '<a class="next" href="' + esc(hub) + '">All games</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      '<div class="nextbar end-nav">' + links + '</div>';
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "TA Arena";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = 'TA Arena <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var hub = safeUrl(NAV.hub);
    if (hub) {
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'/TA/arena/'}).catch(function(){});});}</script>
