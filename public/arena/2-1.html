<script>window.TA_GAME = {"slot":"2.1","setting":"Home & Flatmates","title":"Which Voice Is That?","world":2,"worldName":"Who's Talking","week":2,"weekName":"Who's Talking","mechanic":"Diagnose","concept":"After this one you can name which of your three voices is talking, from the words, the tone and the posture.","plainWord":"the voice","bookTerm":"Ego state","bookIdea":"Each person carries three ego states, Parent, Adult and Child, which are real, observable ways of feeling, thinking and acting rather than roles people play.","bookSource":"Games People Play, ch. 1; Transactional Analysis in Psychotherapy, ch. 2; TA Today, ch. 2","opener":{"setting":"Monday, 20:00, 3B kitchen, Hawthorn Court. A glass has just hit the tiles and burst.","lines":[{"who":"Maya","text":"\u201cDon't move, you'll cut your feet. Stay there, I've got the broom.\u201d","cue":"in the doorway, tea towel over one shoulder, watching you"}],"ask":"Which of your three voices is talking here, and what in the words or the tone tells you?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> you hear a line and name the voice behind it. Tap the one that fits. The cue, in the words or the tone, is what gives it away.","items":[{"type":"pick","who":"You, a second after the glass","text":"\u201cOh for god's sake, can't you do anything right.\u201d","cue":"flat and hard, the words of a telling-off","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"This is a rule passed down as a verdict on the person. It tells you what you are, and says nothing about what happened. That is the Boss, the voice you copied from the grown-ups who raised you.","traps":{"1":"The Pilot would say \u201cIs anyone near it? Mind your feet.\u201d That talks about the floor and calms the room. This line talks about you, so it cannot be the Pilot.","2":"The Kid would sound like \u201cSorry, sorry, I'm so stupid.\u201d That makes you the one who needs comforting, and the room turns to soothe you instead of clearing the glass."},"example":"A school gate, a mother to her son who forgot his lunchbox: \u201cCan't you remember one thing? One thing.\u201d<br>The words end the conversation. The boy is now the one who can't do anything right."},{"type":"pick","who":"You, a second after the glass","text":"\u201cOh no, is anyone near it? Mind your feet.\u201d","cue":"quick and practical, eyes on the floor","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"It deals with what is in front of you: who is near and what to do next. That is the Pilot, the voice that handles the actual situation.","traps":{"0":"The Boss would turn it into blame: \u201cLook what you've done now.\u201d The room would become about who was careless, and the glass would be forgotten.","2":"The Kid would add \u201csorry\u201d and \u201cI'm useless\u201d to the same warning. Then the floor stops being the subject, and you become the one needing help."},"example":"A family WhatsApp group, a sister to her brother who posted the wrong link: \u201cDelete it, then post the right one. Done.\u201d<br>The message fixes the problem, and nobody has to be the villain."},{"type":"pick","who":"You, a second after the glass","text":"\u201cI'm so stupid, I'm so stupid, sorry, sorry.\u201d","cue":"small and fast, apologising before anyone has spoken","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"The Kid says sorry before anyone is upset, and it calls itself names. It is the part of you that was there first, and it feels small when something goes wrong.","traps":{"0":"The Boss would scold the mess in a grown-up voice, something like \u201cyou should know better\u201d. That is a telling-off, with no flood of apology, so the room would hear a rule instead of a plea.","1":"The Pilot would name the fact, \u201cthe glass is broken, I'll sort it\u201d, and get on with it. Nothing in this line is about the glass, so the Pilot would have dropped the self-blame and kept the broom."},"example":"A train platform, a young man who missed the train by seconds: \u201cSorry, sorry, I'm hopeless, I'm always late.\u201d<br>Nobody on the platform asked for that apology. It is a plea for reassurance."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"pick","who":"Maya, later, pulling the bin bag out","text":"\u201cFine, I'll sort the bins. You never think about the bins, do you.\u201d","cue":"tight voice, yanking the bag, not looking at you","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"The words start like a plan, but \u201cyou never think\u201d is a verdict on you. A tight voice and a sharp pull on the bag give it away. That is the Boss. It uses a practical sentence to deliver a judgement.","traps":{"1":"The Pilot would say only the plan: \u201cI'll sort the bins, it's on my list.\u201d The \u201cyou never think\u201d part is not about the bins, so the Pilot would have dropped it and kept the room calm.","2":"The Kid would sound like \u201cFine, sorry, I'll do it\u201d, small and sulky. Maya's line is not small. It is a verdict with \u201cnever\u201d in it."},"example":"A bus stop, a son to his father who is slow getting on: \u201cFine, I'll wait. You never hurry, do you.\u201d<br>The plan is in the first half. The judgement is in the second, and it is the bit that stings."},{"type":"pick","who":"You, at Gran's door downstairs, holding an empty bowl","text":"\u201cIs it okay if I have the last of the flattened rice? Only if it's okay. Sorry.\u201d","cue":"asks, then asks again, a small voice at the end","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"The question is a plan, but \u201conly if it's okay\u201d and the sorry make it small. Asking twice and apologising for asking are the Kid. It wants permission before anyone has refused.","traps":{"0":"The Boss would sound like a house rule: \u201cThe last one goes to whoever cooked it.\u201d That is a ruling, and it would shut the conversation down.","1":"The Pilot would ask once, hear the answer, and take it or leave it. Without the \u201conly if\u201d and the sorry, it is a simple question that Gran can answer in one breath."},"example":"A shop counter, a customer who asks twice whether the sale ends today: \u201cOnly if it's still on, sorry, I know you said it already.\u201d<br>The customer is asking for a pat on the head, not for the price."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You, a second after the glass","text":"\u201cOh for god's sake, can't you do anything right.\u201d This voice did not start with you. It was learned from someone who said it first.","cue":"the words are a recording, played back at full volume","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"This is the Boss: a recording of a grown-up's verdict, played back as if it were a plain fact about you. It was installed by someone else, which is why it feels so certain.","traps":{"1":"The Pilot would look at the situation as it is now: the glass on the floor and who is near. This line does none of that. It hands out a verdict on who you are, which is a recording from the past.","2":"The Kid would be the feeling itself: \u201cI'm so stupid\u201d, a small voice wanting to be forgiven. This line does not beg. It criticises, so the copied voice is the one talking."},"example":"A shop counter, a shopkeeper to a customer who asked twice about the price: \u201cCan't you read the board? It's written right there.\u201d<br>The shopkeeper learned that line from someone, and it comes out in the same flat tone every time."}]}],"debrief":{"nadia":"The Boss is a borrowed voice, and here and now belongs to the Pilot. The Kid was there first, and it is nothing to be ashamed of. The Boss and the Kid are both old recordings, and the Pilot is the one reading the room as it is. You need all three. Notice which one talked first when the glass broke.","bookTerm":"Ego state","bookNote":"The books call these ego states, Parent, Adult and Child, and treat them as real, observable states rather than roles. The Parent is copied from the people who raised you, the Child is left over from your own early years, and the Adult reads what is in front of you."},"reflection":{"prompt":"Think of a sentence you said this week that came out sounding like a telling-off. Which of your three voices was it, and who did you first hear say it?"},"next":"2.2","baseStory":{"setting":"Home & Flatmates","blurb":"A glass bursts in the flat, and the words that follow show which voice is talking."},"moreStories":[{"setting":"Friends & Community","blurb":"Ruby has until noon to collect Joseph's surprise cake, and the deposit is missing.","opener":{"setting":"Saturday, 11:40, The Corner Table. Joseph turns forty tonight and does not know it. The cake place by the station shuts at twelve.","lines":[{"who":"Ruby","text":"\u201cTwenty minutes. The deposit slip is in the envelope, the envelope is eleven fares short, and somebody told me they'd sort the candles.\u201d","cue":"tapping the envelope against the sugar bowl, eyes on the door"},{"who":"Ruby","text":"\u201cI'm not cross. I'm only asking who has what.\u201d","cue":"jaw tight, still not looking at you"}],"ask":"Which of your three voices is talking in each line you hear, and what in the words or the tone gives it away?"},"rounds":[{"level":"Spot","label":"Spot, round 1","items":[{"type":"pick","who":"You, at the counter, phone in hand","text":"\u201cThe deposit. I forgot the deposit. I'm so sorry, I always do this, you should have given the job to someone else.\u201d","cue":"voice dropping with every word, eyes on your shoes","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"The apology comes first and the fact comes last. \u201cI always do this\u201d turns one missed payment into a flaw in you, and the small voice asks Ruby to do the comforting. That is the Kid.","traps":{"0":"The Boss would turn the counter into a trial: \u201cTypical. Can't be trusted with one slip.\u201d You would be the accused, and Ruby would have to argue with you or agree. Your line pleads instead of judging.","1":"The Pilot would say \u201cI forgot the deposit. Can I pay by card now and bring the rest later?\u201d That uses the clock. Nobody has to say it's fine."},"example":"A bus queue, a man to a driver who has pulled away without him: \u201cSorry, sorry, I always miss it, you'd be better off without me on this route.\u201d<br>The driver now has to reassure him instead of opening the door."},{"type":"pick","who":"Ruby","text":"\u201cThat's the trouble with this lot. Nobody ever finishes anything.\u201d","cue":"arms folded, the envelope flat against her chest","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"\u201cThis lot\u201d and \u201cnobody ever\u201d are a verdict on a whole crowd, with no job and no time in it. It tells people what they are. That is the Boss, a voice copied from someone who talked that way.","traps":{"1":"The Pilot would count the gap: \u201cWe're eleven fares short and the candles aren't bought.\u201d That names what is missing and leaves people out of it.","2":"The Kid would say \u201cI can't do all this on my own, I'm sorry I'm such a nag.\u201d That is a small voice asking for rescue. Ruby's words point a finger."},"example":"A five-a-side changing room, the captain at half time: \u201cYou lot never turn up on time. Never have.\u201d<br>The players spend the break defending themselves, and nobody mentions the second half."},{"type":"pick","who":"Ruby, a breath later","text":"\u201cRight. It's twenty to. You pay the deposit by card, I'll carry the box, and one of us texts Tom to keep Joseph at the five-a-side until six.\u201d","cue":"already zipping her bag, eyes on the clock","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"It deals with the clock, the jobs and who does which. Nothing in it says what anyone is like. That is the Pilot, the voice that handles the actual situation.","traps":{"0":"The Boss would say \u201cI knew somebody would mess it up. Now we all pay for it.\u201d That hands out blame before anything is fixed, and the clock keeps running.","2":"The Kid would say \u201cCan we just cancel? It's all gone wrong, Joseph will hate it.\u201d That gives the job away and asks someone to rescue the morning."},"example":"A cafe kitchen, the manager: \u201cThe delivery is late. Ring the supplier, chalk the soup on the board, and we open at eleven anyway.\u201d<br>Everyone knows what to do next."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"pick","who":"Ruby, outside the baker's, a while later","text":"\u201cRight. Rule one: nobody touches the box but me. People who leave a deposit to the last minute don't get to carry cakes.\u201d","cue":"lifting the box out of your hands before you have taken hold of it","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"The start sounds like a plan, but \u201cpeople who leave a deposit\u201d is a rule with a punishment attached. It decides what you are allowed to do because of what you did. That is the Boss.","traps":{"1":"The Pilot would say \u201cI'll carry the box, you take the door.\u201d That splits the jobs by where each person stands. No rule, and no one is ruled out.","2":"The Kid would say \u201cI'll carry it then, shall I? Don't mind me, I'm only the organiser.\u201d That is a hurt, sulky voice waiting to be asked to stay. Ruby's line has a rule in it, not a sulk."},"example":"A school fair, a stallholder to a volunteer who arrived late: \u201cRule one: you don't touch the till. People who turn up at ten don't get the till.\u201d<br>The volunteer is now spending the day being punished."},{"type":"pick","who":"Joseph, who has turned up ten minutes early","text":"\u201cAm I in the way? I can sit somewhere else. Sorry, I only wanted a coffee, I'll go.\u201d","cue":"half out of the chair, cap in both hands","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"Nobody asked him to move. He asks permission to take up a seat and apologises for wanting a coffee. That small, asking tone is the Kid.","traps":{"0":"The Boss would claim the seat: \u201cThis is my table, I was here first.\u201d That is a ruling. Joseph is giving ground before anyone has pushed.","1":"The Pilot would say \u201cIs this table free? I'll take the one by the window.\u201d That asks once and settles it. He would be sitting down by now."},"example":"A launderette, a woman to the stranger folding next to her: \u201cAm I in your way? I can use the other machine, sorry, I'm so slow.\u201d<br>The stranger was not even looking at her."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Ruby","text":"\u201cEleven fares short and the candles aren't bought. Tom, ring round for candles, and I'll take the envelope to the table by the window.\u201d Ruby's mother said \u201cyou lot never finish anything\u201d about every group she ran, and Ruby used to hear it. Today Ruby did not say it.","cue":"brisk, a pen already behind her ear","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"This is the Pilot. It talks about the cash, the candles and the next ten minutes, and it could be said to anyone on any Saturday. The Boss line Ruby grew up with was available to her, and she left it where it was.","traps":{"0":"The Boss would add a verdict on whoever came up short, something like \u201cand don't forget it again\u201d. This line has no such clause, and it is the clause that gives the Boss away.","2":"The Kid would plead: \u201cPlease can we just get it done, it will all go wrong otherwise.\u201d Ruby is not asking anyone to rescue her. She is handing out jobs."},"example":"A shop floor, a supervisor: \u201cLock the till, put the float in the safe, I'll turn the sign.\u201d<br>The words are about the shop at five o'clock and nothing else."}]}]},{"setting":"Relationships","blurb":"Clara's text to Omar has sat unanswered since Tuesday, and Friday's date hangs on the reply.","opener":{"setting":"Thursday, 12:50, the Halden canteen. Clara's phone lies face down beside a bowl of soup that has gone cold. Omar has not answered her Tuesday text.","lines":[{"who":"Clara","text":"\u201cHe's read it. Blue ticks, Tuesday, ten past nine. It's fine, I'm sure it's fine.\u201d","cue":"turning the spoon over and over in the soup"},{"who":"Clara","text":"\u201cI'm not checking. I just happened to look.\u201d","cue":"phone already back in her hand"}],"ask":"Which of your three voices is talking in each line you hear, and what in the words or the tone gives it away?"},"rounds":[{"level":"Spot","label":"Spot, round 1","items":[{"type":"pick","who":"Clara","text":"\u201cTypical. People like that never answer, and I never learn.\u201d","cue":"flat, pushing the bowl away","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"\u201cPeople like that\u201d and \u201cnever\u201d are a verdict on Omar and on her, handed down like a house rule. Nothing in it says what happened or what to do. That is the Boss.","traps":{"1":"The Pilot would say \u201cNo reply since Tuesday. I'll ring him tonight and ask.\u201d That states the facts and picks a step.","2":"The Kid would say \u201cDid I say something wrong? Should I say sorry? I'll send another with a smiley.\u201d That hunts for the fault in herself. Her actual line blames and closes the door."},"example":"A school gate, one mum about another who never answered a party invite: \u201cTypical. Some people never reply, and I never learn to stop asking.\u201d<br>The sentence settles what the other mum is like, and nobody rings her."},{"type":"pick","who":"Clara","text":"\u201cShould I send another one? A small one? Or is that too much? Tell me what to do, I can't tell.\u201d","cue":"phone held out to you, thumb over the keys","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"She hands the decision to you and asks to be told. A string of questions with no plan is the Kid, looking for someone bigger to decide.","traps":{"0":"The Boss would settle it by rule: \u201cDon't text again. If he can't answer, he's not worth it.\u201d Clara is asking, not ruling.","1":"The Pilot would say \u201cI'll give it until six, then I'll ring.\u201d It would have a time in it and no questions."},"example":"A garden fence: \u201cShould I knock? Or wait? Is that rude? You decide, I can't.\u201d<br>The neighbour on the other side ends up choosing."},{"type":"pick","who":"Omar, putting a tray down","text":"\u201cI owe you a text. I saw yours on the platform on Tuesday and then the phone died, and the charger was at my brother's till last night. Friday still works for me. Seven?\u201d","cue":"sleeves pushed up, one hand already on the back of a chair","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"He says what happened, owns the gap, and offers a time. Nothing in it judges either of them. That is the Pilot.","traps":{"0":"The Boss would say \u201cI don't do well when people chase me. Seven, if you've calmed down.\u201d That is a verdict on her, and it turns his late reply into her fault.","2":"The Kid would say \u201cI'm so sorry, I'm terrible at this, you must think I'm awful.\u201d Then Clara has to comfort him, and Friday is forgotten."},"example":"A man to his sister after missing her call: \u201cMy phone was in the car. Ring me at eight, I'll be in.\u201d<br>Short, true and with a time attached."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"pick","who":"Clara","text":"\u201cSeven's fine. I'll book it and I'll check the film times. And the bill, I'll do the bill, you've had a week.\u201d","cue":"ticking jobs off on her fingers, not looking at him","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"Each job sounds like a plan, but the speed and \u201cyou've had a week\u201d show someone paying for her seat before anyone has asked. That is the Kid, trying to earn a place by being useful.","traps":{"0":"The Boss would say \u201cSomebody has to be responsible, and it's clearly not going to be you.\u201d That is a verdict on Omar. Clara's line is all giving.","1":"The Pilot would say \u201cSeven's fine. I'll book and you pick the film. Half each on the bill?\u201d That shares the jobs out. Clara's version keeps all of them."},"example":"A flatmate to a friend who has just moved in: \u201cI'll do the shop and the rota. And the bins, I'll do the bins, you've had a week.\u201d<br>The friend feels the gift, and also the debt."},{"type":"pick","who":"Clara, after Omar says \u201cI like it better when you ask me what I want\u201d","text":"\u201cDon't. Don't say nice things. I haven't done anything to deserve it.\u201d","cue":"eyes on the table, voice low and flat","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"A rule is being quoted: kindness has to be earned first. That is the Boss, an old recording about what she is worth. It shuts the compliment out and leaves Omar with nothing to say.","traps":{"1":"The Pilot would say \u201cThanks. I'll take that. Can we pick the film together?\u201d It takes the line and moves on.","2":"The Kid would say \u201cOh, I'm sorry, I didn't mean to, thank you, I don't know what to say.\u201d That is flustered and apologising for being praised. Clara's voice is flat and firm."},"example":"A man at a retirement do, thanked for his speech: \u201cDon't. I got the start wrong. Nobody gets praised for scraping through.\u201d<br>The person who thanked him is left holding it."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Clara","text":"\u201cForty hours felt long. Next time send me one word, even 'later'. Then I won't build a whole story out of it.\u201d On Tuesday night she would have said \u201cpeople like that never answer\u201d. Today she told Omar something he can do.","cue":"looking up from the soup at last","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"This is the Pilot. She names her own reaction and asks for one small thing he can do. The Boss sentence was close by, and she chose a request instead.","traps":{"0":"The Boss would say \u201cYou always leave me hanging.\u201d That is a verdict with \u201calways\u201d in it, and Omar can only defend himself.","2":"The Kid would say \u201cIt's fine, it's totally fine, forget I said anything.\u201d That swallows what she needs, and Omar never learns what a single word would have done."},"example":"A manager to a colleague: \u201cWhen you're running late, text me 'late'. I don't need the reason, only the word.\u201d<br>One clear request, and nothing about what the colleague is like."}]}]},{"setting":"School & College","blurb":"Sam's group poster is due Thursday, and one name on the feedback sheet has no job.","opener":{"setting":"Tuesday, 19:10, room four of the adult education centre. Sam's statistics class. The group poster is due Thursday at seven.","lines":[{"who":"Mr Hollis","text":"\u201cGroup four. A chart with no axes, a summary with no author, and a feedback sheet with three names and two jobs.\u201d","cue":"holding the sheet up by one corner, as if it might drip"},{"who":"Sam","text":"\u201cThe third name is me. I'm the one with no job.\u201d","cue":"tilting his chair back, eyes on the clock"}],"ask":"Which of your three voices is talking in each line you hear, and what in the words or the tone gives it away?"},"rounds":[{"level":"Spot","label":"Spot, round 1","items":[{"type":"pick","who":"Mr Hollis","text":"\u201cFix it tonight. Decide who does the axes and who writes the summary, and I'll look at a draft at quarter to seven on Thursday.\u201d","cue":"tapping the sheet, already moving to the next table","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"It names two jobs, a night and a time. Nothing in it says what the group is like. That is the Pilot, working on the poster in front of him.","traps":{"0":"The Boss would say \u201cThis is the sloppiness you get from people who treat evening classes as a hobby.\u201d That is a verdict on a type of student, and the group would argue with it instead of working.","2":"The Kid would say \u201cSorry, we thought somebody else was doing the axes, please don't be cross.\u201d That is the group talking, not Mr Hollis."},"example":"A cafe kitchen, the manager: \u201cCheck the fridge log by five, then give the rota to Dina before close.\u201d<br>Two jobs and a time, and no opinions."},{"type":"pick","who":"Brenda","text":"\u201cSome people sign up for these courses and treat them like a day out. If you can't be bothered, say so, and we'll carry you again.\u201d","cue":"not looking at Sam, squaring the edges of her printout","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"\u201cSome people\u201d and \u201ctreat them like a day out\u201d judge what kind of person Sam is, and \u201ccarry you again\u201d is a punishment waiting to happen. That is the Boss, speaking in a rule instead of a request.","traps":{"1":"The Pilot would say \u201cSam, can you have the axes by Wednesday? If not, say now and we'll split them.\u201d That asks for a job and a day.","2":"The Kid would say \u201cI've done all my bits again and nobody said thank you. Sorry, I know I shouldn't mind.\u201d That is a small hurt voice hoping to be noticed. Brenda's words are not small."},"example":"A choir rehearsal, an alto to the new tenor: \u201cSome people turn up for the biscuits and leave the singing to everyone else.\u201d<br>The tenor goes quiet and does not come back."},{"type":"pick","who":"Sam","text":"\u201cIt's a stupid poster anyway. Who even looks at axes? I'm not doing it.\u201d","cue":"arms crossed, chair tipped back, eyes on the ceiling","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"Nothing in it deals with the poster. It is a sulk that dares someone to tell him off. Pleading is one Kid voice, and sulking and refusing is the other.","traps":{"0":"The Boss would say \u201cAxes matter. Anyone who skips them shouldn't pass.\u201d That is a rule about worth. Sam is refusing, not ruling.","1":"The Pilot would say \u201cCan we ask Mr Hollis what he expects on the axes?\u201d That goes at the task. Sam's line goes round it."},"example":"A teenager at the table, told to lay the places: \u201cIt's a stupid rule anyway. Who even cares where the forks go? I'm not doing it.\u201d<br>The row is now about the forks, and dinner gets later."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"pick","who":"Imran, later, in the library","text":"\u201cSure, I'll do the summary. And the chart, if you like. I've got Thursday free anyway. Don't worry about it.\u201d","cue":"smiling, already pulling Sam's chart across the table","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"It sounds like a plan, but it takes both jobs to avoid a row, and the smile and \u201cdon't worry about it\u201d hide the cost. That is the Kid, keeping the peace by making himself the extra pair of hands.","traps":{"0":"The Boss would say \u201cFine, I'll do it, since nobody else in this group can be relied on.\u201d That is a verdict dressed up as a favour. Imran's line is generous, not sharp.","1":"The Pilot would say \u201cI'll take the summary. Sam, you keep the chart and I'll check the numbers on Wednesday night.\u201d That shares the work. Imran's offer keeps all of it."},"example":"A flatmate, after a messy party: \u201cGo to bed, I'll do the bins and the kitchen and the floor. Don't worry about it.\u201d<br>He is smiling, and tomorrow he will remember who went to bed."},{"type":"pick","who":"Sam","text":"\u201cNo. I'm not taking the summary as well. I'll do the axes by Wednesday at noon. If I'm late, I'll tell Mr Hollis myself on Thursday.\u201d","cue":"chair legs down, voice level, looking at Imran","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"The \u201cno\u201d sounds hard, but the rest is a job, a time and what he will do if he misses it. Nothing in it is about Imran or Brenda. That is the Pilot.","traps":{"0":"The Boss would say \u201cNo. And if you lot can't manage a poster, don't blame me when it fails.\u201d That ends with a verdict on everyone, and the poster goes backwards.","2":"The Kid would say \u201cFine, no, whatever, I'll do it, I don't mind, forget I said anything.\u201d That folds before the sentence is out. Sam's line has a day in it and keeps its ground."},"example":"A neighbour asked to mind a dog: \u201cNo, not Saturdays. Sundays I can do from ten.\u201d<br>The refusal and the offer arrive in the same breath."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Brenda","text":"\u201cSome people sign up for these courses and treat them like a day out.\u201d Brenda said the same sentence last term about her brother and a man at the bus stop. It fits anyone.","cue":"same flat voice as before","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"This is the Boss: a recording played back as if it were fresh. A line that fits her brother, a stranger and Sam is not about Sam, and it was installed long before this class.","traps":{"1":"The Pilot would talk about Thursday: who has the axes and who writes the summary. Brenda's sentence mentions no job and no date.","2":"The Kid would sound hurt or sulky, wanting someone to say sorry. Brenda sounds sure, and that certainty is the sign of an old recording."},"example":"A shopkeeper to the third customer in a row: \u201cPeople just come in to look these days.\u201d<br>He said it to the last customer, and he will say it to the next."}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://vaibhav-labs.github.io/TA/arena/","next":{"slot":"2.2","title":"Five Faces of a Voice","url":"https://vaibhav-labs.github.io/TA/arena/2-2.html"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  // If the hub's setting filter sent us here with ?setting=X and this game has that
  // setting, go straight into it instead of asking again on a "choose a setting" screen.
  var PRESET_STORY = -1;
  try {
    var wantSetting = new URLSearchParams(window.location.search).get("setting");
    if (wantSetting) {
      for (var si = 0; si < STORIES.length; si++) {
        if (STORIES[si].setting === wantSetting) { PRESET_STORY = si; break; }
      }
    }
  } catch (e) { /* URLSearchParams unsupported: fall through to the picker */ }
  if (PRESET_STORY >= 0) useStory(PRESET_STORY);
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: (MULTI && PRESET_STORY < 0) ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
