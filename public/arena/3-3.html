<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step Out of the Whine · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"3.3","setting":"Home & Flatmates","title":"Step Out of the Whine","world":3,"worldName":"Back and Forth","week":3,"weekName":"Back and Forth","mechanic":"Choice-story","concept":"After this one you can cut a whine on purpose, answering from a seat the other person did not call on, so the talk turns into a real conversation instead of a row.","plainWord":"a cut","bookTerm":"Crossed transaction","bookIdea":"When the reply comes from a different ego state than the one addressed, the lines cross and communication breaks off until the vectors realign. The person who was crossed tends to shift into the ego state the other one invited.","bookSource":"Games People Play, ch. 2; TA Today, ch. 7","opener":{"setting":"Sunday, 21:15, your room in apartment 3B, Hawthorn Court. The Corner Table finished four hours ago, and Mum's name is on the phone for the third time this week.","lines":[{"who":"Mum","text":"\u201cNobody rings me. I sit here with the TV on and I don't know what I did wrong. Tell me I didn't do anything wrong.\u201d","cue":"small voice, the TV loud behind her"}],"ask":"Can you answer Mum's plea from a seat she did not call on, so the call becomes a real talk instead of a row?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> Mum's line is a plea, and every reply after it is a volley. A volley either runs on or gets cut. Tap the label that fits each line.","items":[{"type":"pick","who":"Mum, on the phone","text":"\u201cDad won't pick up, and nobody else rings. Am I that much trouble, love?\u201d","cue":"small and fast, the TV loud behind her","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"This is a plea. It asks you to soothe a hurt, and it has no plan and no verdict in it. That is the Kid, the voice that wants comfort, and it is aimed at the caring side of your Boss, the part that can soothe.","traps":{"0":"The Boss would say \u201cYou never ring, and you know it's your own fault.\u201d That is a verdict, so the call turns into a telling-off and the hurt never gets heard.","1":"The Pilot would say \u201cRing me on Sunday at eight and we'll talk about the week.\u201d That is a plan, and it deals with the calls, but this line is about the hurt, so the plan misses it."},"example":"A grandfather on a video call from his flat: \u201cNobody comes to see an old man. Never mind, I'll manage.\u201d<br>He is asking for comfort, not for a visit timetable."},{"type":"pick","who":"You, after a long pause","text":"\u201cOh, Mum, you did nothing wrong. Don't worry about it.\u201d","cue":"warm and quick, reaching for the reassurance","prompt":"What kind of reply is your line?","options":["A matched volley","A cut","Double-talk"],"answer":0,"why":"Your reply comes from the Caring Boss, the seat she called on, and it answers her plea with comfort. That is a matched volley, so it can run on, and she will be back with the same whine on Wednesday.","traps":{"1":"A cut would answer from a seat she did not call on, like \u201cWhat would you like from me this week?\u201d This line does not do that. It answers her plea with comfort from the seat she called on.","2":"Double-talk would be a polite line with a second message under it, like \u201cOh, Mum, you did nothing wrong. Not that you'd believe me.\u201d The words soothe and the tail carries a dig. Your line has no dig in it."},"example":"A cricket WhatsApp group, a player who keeps calling himself the worst bowler: \u201cYou're not the worst, mate, don't worry.\u201d<br>He gets the reassurance he was fishing for, and he will fish again on Sunday."},{"type":"pick","who":"You, a second later","text":"\u201cWhat would you like from me this week, Mum?\u201d","cue":"calm and level, eyes on the screen, not on the TV","prompt":"What kind of reply is your line?","options":["A matched volley","A cut","Double-talk"],"answer":1,"why":"This comes from the Pilot, a seat she did not call on. She called on the Caring Boss, and you asked a question instead, which is changing seat. The reply is a cut, so the whine has no seat to land in.","traps":{"0":"A matched volley would be \u201cOh, Mum, you did nothing wrong.\u201d She gets the comfort she asked for, and the whine comes back next Sunday.","2":"Double-talk would be the same words said through your teeth, \u201cOf course, Mum, what would you like from me this week?\u201d with a sigh behind it. The words are fine and the tone carries a second message, and she would hear the tone first."},"example":"A neighbours' building group chat, the secretary upset about the lift repair: \u201cFine, you're upset. What do you want us to decide tonight?\u201d<br>The question turns the sulk into a choice."},{"type":"pick","who":"Mum, a minute later","text":"\u201cOf course you're busy, love. Busy people don't ring. I know.\u201d","cue":"sweet voice, a sigh at the end","prompt":"Look at what the line says and what sits under it. Which label fits Mum's line?","options":["A matched volley","A cut","Double-talk"],"answer":2,"why":"The first message is sweet: she knows you are busy. The second sits underneath and says you never ring. Two messages in one line is double-talk, and the sigh tells you which one is loud.","traps":{"0":"A matched volley is a plain line that gets a plain reply from the seat it was aimed at, like \u201cYes, Mum, I'm busy, I'll ring Sunday.\u201d Her line says one thing and carries a second underneath, so it is not plain.","1":"A cut is a reply that answers from a different seat. Mum is not switching seats here. She is carrying two messages in the same line."},"example":"A school parents' group, a mother left out of the trip plan: \u201cNo, no, you all go ahead. I know my place.\u201d<br>The first message is polite. The second is the bill, and everyone reads that one."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"scene","title":"Sunday, 21:20, your room in apartment 3B","setting":"The Corner Table is four hours behind you. The call has run four minutes. Mum has said \u201cnobody\u201d twice, and the TV is still on in her kitchen, 600 km away.","meters":{"you":70,"them":50},"beats":[{"who":"Mum","text":"\u201cNobody rings me. Dad doesn't even look at the phone. Tell me I didn't do anything wrong.\u201d","cue":"voice thin, a spoon clinking in a cup","lines":[{"text":"\u201cTell me one thing you want from this week, Mum. Just one.\u201d","tag":"best","you":4,"them":5,"outcome":"Mum stops mid-sigh. \u201cRing on Sundays. Properly, not for one minute.\u201d The plea has a request in it now.","why":"You answered from your Pilot, a seat she did not call on, and asked for a real request. The cut stops the plea without starting a row."},{"text":"\u201cOh, Mum, you did nothing wrong. Don't worry about it.\u201d","tag":"ok","you":-2,"them":3,"outcome":"She sighs, relieved. \u201cThank you, love. You always understand.\u201d The plea will be back on Wednesday.","why":"You answered from the Caring Boss, the seat she called on. It is a matched volley, so it runs on and feels kind, and nothing is asked of her."},{"text":"\u201cI'll ring every night, Mum, I promise. I'll fix everything this month.\u201d","tag":"game","you":-6,"them":4,"outcome":"Her voice warms. \u201cEvery night? You'll be tired, I know. You still owe me three weeks of calls.\u201d","why":"You took on a rescue, and she has noticed the promise and started the count. That is a trap move, so the scene ends here."}]},{"who":"Mum","text":"\u201cAfter everything I gave up for you, you don't even ask how I manage.\u201d","cue":"sharper now, a laugh with no fun in it","lines":[{"text":"\u201cWhich part of the week was hardest, Mum? Give me the day and the thing.\u201d","tag":"best","you":3,"them":6,"outcome":"Mum pauses. \u201cThe Tuesday, with the electricity bill. Nobody told me it was due.\u201d","why":"Her line came from the Boss and landed on your Kid. A question from your Pilot is a cut, so she has to answer with facts, and the guilt has nothing to push against."},{"text":"\u201cI know, Mum. I'm a terrible son. I'm sorry.\u201d","tag":"ok","you":-4,"them":2,"outcome":"\u201cYes, well, you should be,\u201d she says, and the call goes soft for a minute.","why":"You answered her Boss with your Kid. The sorry matches her verdict, so the groove runs on, and you give up ground you could have held."}]},{"who":"Mum","text":"\u201cDad says we're fine, like always. I'm the only one who worries.\u201d","cue":"tired, looking at something across the room","lines":[{"text":"\u201cWhat would you like Dad to do differently, Mum? Name one thing.\u201d","tag":"best","you":3,"them":4,"outcome":"She laughs, short and sour. \u201cAsk him to ring me, for once. He won't.\u201d","why":"You turned her feeling into a request. A request is a cut she can answer, and it gives her a real choice instead of a rescue."},{"text":"\u201cI'm sure Dad worries too, Mum. Don't upset yourself.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"\u201cDon't upset myself,\u201d she repeats. \u201cThat's what everyone says.\u201d","why":"This is the Caring Boss again, a matched volley that calms her and changes nothing. She hears no new message, so the whine comes back at the next line."}]},{"who":"Mum","text":"\u201cThen tell me it's not my fault. Just say it. Is it my fault?\u201d","cue":"voice going thin, waiting for the yes","lines":[{"text":"\u201cNobody has to be at fault, Mum. What do you need from this call before we hang up?\u201d","tag":"best","you":4,"them":5,"outcome":"A long breath. \u201cJust to hear your voice on Sunday, I think.\u201d She has said the real thing.","why":"Saying nobody is at fault is a cut, and it refuses to put anyone in the dock. The question after it gets her Pilot to answer, so a row has nothing to start from."},{"text":"\u201cNo, Mum, of course it isn't. It's not your fault.\u201d","tag":"ok","you":-1,"them":2,"outcome":"\u201cGood,\u201d she says, and the call ends on a soft note. Nothing about Sunday has been decided.","why":"A matched volley that closes the question. It is kind, but it leaves the plea without a plan, so the same call comes back next week."},{"text":"\u201cFine, Mum, it's always about you, isn't it? Every single call.\u201d","tag":"game","you":-8,"them":-7,"outcome":"Her voice goes up. \u201cDon't you talk to me like that. Your father talks to me like that.\u201d The phone goes quiet with a click.","why":"This is a verdict wrapped in a question. It invites her Boss to answer, and a person who is crossed tends to move into the seat the other one invited, so a row starts and the scene ends here."}]}],"payoff":"The call ends early with the whine still on the line. Mum keeps the score, and next Sunday she starts from the last thing you said."},{"type":"scene","title":"Wednesday, 22:40, the kitchen in apartment 3B","setting":"The rent envelope is on the fridge, under a magnet shaped like a tea cup. Sam is still wearing his fintech lanyard, and he has not sat down.","meters":{"you":65,"them":55},"beats":[{"who":"Sam","text":"\u201cI'm such an idiot. I forgot the rent again. Sorry, sorry, don't say it.\u201d","cue":"envelope in hand, already apologising","lines":[{"text":"\u201cOkay. When can you pay it, and how much can you do by Friday?\u201d","tag":"best","you":4,"them":5,"outcome":"Sam stops with the envelope in the air. \u201cFriday. Thursday, if I skip the tea.\u201d","why":"You asked for a day and an amount, which is a cut from your Pilot that he can answer. The whine has nowhere to sit."},{"text":"\u201cIt's fine, Sam, don't worry about it.\u201d","tag":"ok","you":-2,"them":3,"outcome":"He grins, relieved. \u201cYou're the best, seriously.\u201d The envelope goes back on the fridge, with no date on it.","why":"You answered his Kid from the Caring Boss, which is a matched volley. He feels better at once, but the rent still has no day on it, and that is the price of the comfort."}]},{"who":"Sam","text":"\u201cYou always know what to do. I'm hopeless with money, I'm the one who needs bailing out.\u201d","cue":"a tight laugh, looking at the fridge and not at you","lines":[{"text":"\u201cYou're not hopeless, you're short this month. Give me the number and the day.\u201d","tag":"best","you":3,"them":4,"outcome":"He pulls out his phone and shows you a figure. \u201cNine thousand now, the rest on the fourth.\u201d","why":"You gave him a fact to answer, not a rescue. A grown-up can answer a number, and he did, so the talk stays open."},{"text":"\u201cGive me the envelope. I'll sort it out, and you can pay me back later.\u201d","tag":"game","you":-6,"them":5,"outcome":"His shoulders drop. \u201cYou're a lifesaver. I owe you.\u201d He hands over the envelope and forgets the date.","why":"You took the job off him. He is now the Kid being looked after, and you are carrying the rent, so the scene ends here."},{"text":"\u201cOkay, but you're doing better than you think.\u201d","tag":"ok","you":-1,"them":3,"outcome":"He laughs. \u201cYou say that every month.\u201d The number is still unsaid.","why":"A kind word from the Caring Boss answers the feeling and never asks for the number. The number goes unsaid, so the rent stays where it was."}]},{"who":"Sam","text":"\u201cFine, fine. Don't tell Gran, she'll make a whole speech out of it.\u201d","cue":"half a smile, one hand up, testing whether you will keep his secret","lines":[{"text":"\u201cI won't tell her. You tell her yourself on Sunday, before the watchman does.\u201d","tag":"best","you":4,"them":2,"outcome":"He groans. \u201cFine. Sunday. I'll take the speech.\u201d","why":"You kept the secret out of it and handed the choice back to him. Telling her himself keeps him an adult in the talk, and the rent does not become a family joke."},{"text":"\u201cDeal. Our secret, and you owe me a tea.\u201d","tag":"ok","you":-1,"them":4,"outcome":"He clinks his cup against yours. \u201cTea on me Friday, promise.\u201d","why":"A secret makes the whine a shared joke, so the rent slides to next month with both of you laughing. It is pleasant, and the date stays unset."}]},{"who":"Sam","text":"\u201cThanks. Sorry. Really, sorry, I'll sort it, promise.\u201d","cue":"already halfway out of the kitchen, envelope under his arm","lines":[{"text":"\u201cDon't say sorry. Say the day, and I'll write it on the fridge.\u201d","tag":"best","you":4,"them":5,"outcome":"He laughs, takes the marker from the drawer, and writes \u201cFri\u201d on the calendar with a smiley.","why":"You turned the sorry into a day that can be checked. He answers with something he can do, so the talk closes on an agreed day and the plea does not return on Thursday."},{"text":"\u201cNo problem, Sam. Sorted.\u201d","tag":"ok","you":0,"them":2,"outcome":"\u201cSorted,\u201d he says, and he leaves. The envelope stays on the fridge with no date on it.","why":"A matched volley that closes the talk kindly, but no day has been set. Next week's sorry will sound the same."}]}],"payoff":"Sam leaves the envelope with you, with a sticky note on it that says \u201cOwe you\u201d. The next sorry comes a week earlier."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You, after the call, working out why it held","text":"\u201cOkay. Ring me on Sunday, and tell me the one thing you want to talk about. I'll listen.\u201d","cue":"quieter now, the TV switched off","options":["Her Pilot answered your Pilot, so the talk stayed open","Her Boss handed you a rule, so the whine returns","Her Kid gave up, so the call is over"],"answer":0,"why":"Your request asked for a plan, so she answered with one. You changed seat, and the plea was cut before it could run on. A person who is crossed tends to move into the seat the other one invited, and your question invited her Pilot. A cut works when it asks for something real, like a day or one thing, and this one did.","traps":{"1":"If her Boss had answered, it would sound like \u201cFine, ring on Sunday, and don't start again.\u201d That is a rule handed back to you, and the whine would return next week with the rule attached.","2":"If her Kid had given up, it would sound like \u201cNever mind, I'm being silly, forget I said it.\u201d The call would end on the sulk, and the week would stay where it was."},"example":"A sports coach at the nets: \u201cOkay. Tell me one thing you want to fix before Saturday.\u201d<br>The question has an end point, so the player has a real answer to give."}]}],"debrief":{"nadia":"A plea calls on one seat, and if you answer from that same seat, the loop can run on and on. Changing seat to your Pilot cuts it, but the cut has to ask for something real, like a day or one thing she wants from you. Ask it as if you want the answer, because the same words said like a verdict will start a row.","bookTerm":"Crossed transaction","bookNote":"The books call this a crossed transaction: the reply comes from a different ego state than the one addressed, or does not go back to the one that spoke, so communication breaks off until the vectors realign. The person who was crossed tends to shift into the ego state the other one invited."},"reflection":{"prompt":"Think of a message this week that asked you to make a feeling go away. Which seat did you answer from, and what would one plain question from your Pilot have opened instead?"},"next":"3.4","baseStory":{"setting":"Home & Flatmates","blurb":"Mum keeps ringing with the same plea, and Sam keeps apologising for the rent."},"moreStories":[{"setting":"Work","blurb":"Clara, Daniel and a release at five: two people want comfort and the clock keeps running.","opener":{"setting":"Thursday, 16:10, the team room at Halden. The release goes out at five, and Clara has been at her desk since five this morning.","lines":[{"who":"Clara","text":"\u201cDaniel said the appendix looks thin. He didn't say wrong, just thin. Tell me it's fine. Tell me I haven't made it worse.\u201d","cue":"cursor blinking in the same cell"}],"ask":"Can you answer Clara's plea from a seat she did not call on, so the last hour goes on the appendix instead of on her mood?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> Clara's line is a plea, and every reply after it is a volley. A volley either runs on or gets cut. Tap the label that fits each line.","items":[{"type":"pick","who":"Clara, at her desk","text":"\u201cDaniel read the appendix twice and said nothing. Nothing! That means it's bad. Say it isn't bad.\u201d","cue":"fast and small, eyes on the screen","options":["The Boss","The Kid","The Pilot"],"answer":1,"why":"This is a plea. It asks you to soothe a worry, and it carries no plan and no verdict. That is the Kid, the voice that wants comfort, and it is aimed at the caring side of your Boss.","traps":{"0":"The Boss would say \u201cYou do this every time he goes quiet. Stop fishing.\u201d That is a verdict, so the talk turns into a telling-off and the worry never gets heard.","2":"The Pilot would say \u201cSend him the diff and ask which part he'd cut.\u201d That is a sensible plan, but this line is about the worry, so the plan skips it."},"example":"A baker's apprentice after the owner turned a loaf over in silence: \u201cIt's burnt, isn't it? Say it's not burnt.\u201d<br>He wants a hand on the shoulder before he wants a baking lesson."},{"type":"pick","who":"You, after a pause","text":"\u201cClara, it's great. Daniel just likes to growl. Don't worry about it.\u201d","cue":"warm and quick, reaching for the reassurance","prompt":"What kind of reply is your line?","options":["Double-talk","A cut","A matched volley"],"answer":2,"why":"Your reply comes from the Caring Boss, the seat she called on, and it answers her plea with comfort. That is a matched volley, so it can run on, and she will be back with the same worry before the next release.","traps":{"0":"Double-talk would be a kind line with a second message under it, like \u201cIt's great, Clara. Not that you'd believe me.\u201d The words soothe and the tail stings. Your line has no sting in it.","1":"A cut would answer from a seat she did not call on, like \u201cWhich page did he look at longest?\u201d Your line does not change seat. It comforts her from the seat she called on."},"example":"A choir WhatsApp group, a singer worried about her solo: \u201cIt was lovely, don't worry, nobody noticed.\u201d<br>She gets the reassurance she was fishing for, and she will fish again after the next rehearsal."},{"type":"pick","who":"You, a second later","text":"\u201cWhich page did he look at longest? Show me that one.\u201d","cue":"calm and level, pulling a chair over","prompt":"What kind of reply is your line?","options":["A cut","A matched volley","Double-talk"],"answer":0,"why":"This comes from the Pilot, a seat she did not call on. She called on the Caring Boss, and you asked a question about the work, which is changing seat. The reply is a cut, so the worry has no seat to land in.","traps":{"1":"A matched volley would be \u201cIt's great, Clara, don't worry.\u201d She gets the comfort she asked for, and the same worry comes back at the next release.","2":"Double-talk would be the same words said with a sigh, \u201cFine, show me the page, then,\u201d with an eye on the clock. The words are fine and the tone carries a second message, and she would hear the tone first."},"example":"A bike workshop, a trainee sure he has fitted the brake wrong: \u201cRight. Which bolt are you unsure about? Point at it.\u201d<br>The question gives him a bolt to look at instead of a mood to sit in."},{"type":"pick","who":"Clara, a minute later","text":"\u201cOh, it's lovely that you're so relaxed. Some people can ship an appendix with a straight face. I'll just rewrite the whole thing at five to five.\u201d","cue":"bright voice, tight jaw, still typing","prompt":"Look at what the line says and what sits under it. Which label fits Clara's line?","options":["A cut","Double-talk","A matched volley"],"answer":1,"why":"The first message is polite: it is lovely that you are relaxed. The second sits underneath and says you care less than she does. Two messages in one line is double-talk, and the tight jaw tells you which one is loud.","traps":{"0":"A cut is a reply that answers from a different seat. Clara is not switching seats here. She is carrying two messages in the same line.","2":"A matched volley is a plain line that gets a plain reply from the seat it was aimed at, like \u201cThanks, I'm worried, I'll rewrite it.\u201d Her line says one thing and carries a second underneath, so it is not plain."},"example":"A flat-share WhatsApp group, a tenant after the bins were left again: \u201cNo, don't worry, some of us enjoy the smell.\u201d<br>The first message is a joke. The second is the bill, and everyone reads that one."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"scene","title":"Thursday, 16:20, the team room at Halden","setting":"The release goes out at five and the client call is at half past. Clara has been at her desk since five this morning, and her coat is still on the back of the chair.","meters":{"you":70,"them":50},"beats":[{"who":"Clara","text":"\u201cI've been here since five and Daniel still thinks I'm too new for this client. Tell me I didn't get it wrong.\u201d","cue":"hands flat on the desk, not typing","lines":[{"text":"\u201cShow me the line he marked, Clara. Just the one.\u201d","tag":"best","you":4,"them":5,"outcome":"She scrolls to page nine. \u201cThe pricing table. He said the totals look soft.\u201d There is a page number in the air now.","why":"You answered from your Pilot, a seat she did not call on, and asked for one real thing. The cut stops the plea without starting a row."},{"text":"\u201cYou didn't get anything wrong. You're the best one on this team.\u201d","tag":"ok","you":-2,"them":3,"outcome":"She smiles with her mouth only. \u201cYou have to say that.\u201d The table is still open on her screen.","why":"You answered from the Caring Boss, the seat she called on. It is a matched volley, so it feels kind, but she cannot take praise she has not earned, so it slides off."},{"text":"\u201cGive me the laptop. I'll redo the table and you go and get some air.\u201d","tag":"game","you":-6,"them":4,"outcome":"She hands it over too fast. \u201cThank you, I owe you one.\u201d By five she has counted what she owes.","why":"You took the job off her. She is now the Kid being looked after and you are carrying the table, so the scene ends here."}]},{"who":"Clara","text":"\u201cOmar's totals were fine last time. I've just made them worse, haven't I?\u201d","cue":"pulling her sleeve over her wrist","lines":[{"text":"\u201cWhat did his totals do that yours don't? Name the difference.\u201d","tag":"best","you":3,"them":5,"outcome":"She checks. \u201cHis round at the end. Mine round at every line.\u201d She is already fixing it.","why":"A question about the work is a cut from your Pilot. She has to answer with facts, so the comparison has nothing to feed on."},{"text":"\u201cDon't compare yourself to Omar. You're both good.\u201d","tag":"ok","you":-1,"them":2,"outcome":"\u201cMm,\u201d she says, and clicks around the sheet without reading it.","why":"This is the Caring Boss again, a matched volley that calms her and changes nothing. She hears no new message, so she goes on clicking."}]},{"who":"Clara","text":"\u201cIf this goes wrong at five, it's my name on the commit. Everybody will know it was me.\u201d","cue":"voice flat, eyes on the clock in the corner of the screen","lines":[{"text":"\u201cIf it goes wrong, who rings whom first? Say the names.\u201d","tag":"best","you":3,"them":4,"outcome":"\u201cDaniel. Then Omar for the rollback.\u201d She says it like a list now, and the clock stops looking like a verdict.","why":"The dread was a feeling with no handle. Your question gave it one, and a plan she can say out loud is something her Pilot can answer."},{"text":"\u201cIt won't go wrong, I promise. Nothing bad will happen to you.\u201d","tag":"ok","you":-2,"them":3,"outcome":"\u201cYou can't promise that,\u201d she says, but she lets out a breath.","why":"A matched volley that comforts her with a promise nobody can keep. She feels better for a minute and the plan is still missing."}]},{"who":"Clara","text":"\u201cI should stay till midnight. If I stay, it'll be fine. Say I should stay.\u201d","cue":"already pulling her coat off the chair, then putting it back","lines":[{"text":"\u201cTell me what has to be done by five. After that it's the release's turn.\u201d","tag":"best","you":4,"them":5,"outcome":"She counts on her fingers. \u201cTotals and the changelog.\u201d Two things. She looks almost relieved.","why":"You gave the evening an edge. A cut that asks for the list turns an endless night into a short job."},{"text":"\u201cStay if you want. I'll bring you a sandwich later.\u201d","tag":"ok","you":-1,"them":3,"outcome":"\u201cYou're a star,\u201d she says, and the coat goes back on the chair for good.","why":"Kind, and a matched volley. It agrees with her plan to disappear into the room, and it asks nothing of her."},{"text":"\u201cFine, stay till midnight then. You always do, so why ask me?\u201d","tag":"game","you":-8,"them":-7,"outcome":"Her chin goes up. \u201cThat's not fair.\u201d The keys turn hard and loud, and she stops answering you.","why":"This is a verdict wrapped in a question. It invites her own Boss to answer, and a person who is crossed tends to move into the seat the other one invited, so the row starts and the scene ends."}]}],"payoff":"Clara stops talking and the room goes quiet except for the keys. At ten to five the table is still soft."},{"type":"scene","title":"Thursday, 17:40, beside the vending machine","setting":"The release went out nine minutes late. Daniel stands by the machine with a bag of crisps he has not opened, and Omar is two tables away pretending to read.","meters":{"you":65,"them":55},"beats":[{"who":"Daniel","text":"\u201cNine minutes late and I hear it from the client. Nobody warns me about anything. Not one of you.\u201d","cue":"crisp packet crackling in his fist","lines":[{"text":"\u201cWhat do you need to hear, and by when? Give me one example.\u201d","tag":"best","you":4,"them":5,"outcome":"He stops. \u201cIf a release will slip, a message by four. One line.\u201d Daniel has just written the rule himself.","why":"His line looks like a Boss telling-off but it is a Kid whining at your Caring Boss. Your question comes from the Pilot, so he answers with a real request."},{"text":"\u201cSorry, Daniel. You're right, we should have told you.\u201d","tag":"ok","you":-3,"them":2,"outcome":"\u201cYes. Well.\u201d He crunches a crisp. Nobody has said by when.","why":"You answered from your Kid, and the sorry matches his complaint. It runs on and gives ground you could have held."},{"text":"\u201cI'll send you a status every ten minutes. Every release, every time.\u201d","tag":"game","you":-6,"them":4,"outcome":"\u201cGood. Do that.\u201d By Monday it is a rota nobody enjoys, and you are running it.","why":"You took on a rescue he did not ask for in so many words. The promise is yours now, so the scene ends here."}]},{"who":"Daniel","text":"\u201cI'm the one they shout at. Do you know what that is like? Nobody asks how I am.\u201d","cue":"looking at a ceiling tile, not at you","lines":[{"text":"\u201cWhat would help most before the next release? Give me one thing.\u201d","tag":"best","you":3,"them":5,"outcome":"\u201cA named person on the changelog. Not a group chat.\u201d He says it to the crisps, but it is a real answer.","why":"A question about what would help is a cut from your Pilot. It does not argue with how he feels, and it hands him a choice he can make."},{"text":"\u201cThat must be hard, Daniel. Everybody respects you.\u201d","tag":"ok","you":-1,"them":3,"outcome":"\u201cMm,\u201d he says, and eats a crisp. Nobody has asked him for anything.","why":"A matched volley from the Caring Boss. It is warm and it is true enough, and the next release will start with the same complaint."}]},{"who":"Daniel","text":"\u201cI said she was too new for that client. I was right, wasn't I? Say I was right.\u201d","cue":"voice dropped so Omar cannot hear","lines":[{"text":"\u201cThe table was soft and the appendix held. Which one do you tell her about tomorrow?\u201d","tag":"best","you":3,"them":4,"outcome":"He turns the packet over. \u201cThe appendix. First.\u201d He has chosen without being told what to say.","why":"You neither agreed nor argued. You asked him to choose something he can do, and a cut like that gives the plea a job."},{"text":"\u201cMaybe a bit, Daniel. She is new, that's all.\u201d","tag":"ok","you":-3,"them":2,"outcome":"He nods, relieved, and says nothing to her on Friday.","why":"A matched volley that agrees with his verdict. It soothes him and leaves Clara waiting."}]},{"who":"Daniel","text":"\u201cFine. I'll say something to her. Tell me I won't make it worse.\u201d","cue":"tearing the packet open at last","lines":[{"text":"\u201cWhat are the first two sentences? Say them out loud to me.\u201d","tag":"best","you":4,"them":5,"outcome":"He clears his throat. \u201cYour appendix held up. The table needs another pass on Monday.\u201d It sounds like him on a good day.","why":"You turned a worry into a rehearsal. A cut that asks for the words leaves him holding a plan instead of a fear."},{"text":"\u201cYou won't make it worse. You're good with people.\u201d","tag":"ok","you":-1,"them":3,"outcome":"\u201cAm I?\u201d he says, and laughs once. He goes back to his desk with nothing written.","why":"The Caring Boss comforts him, and nothing in the plan is decided."},{"text":"\u201cDo you want me to tell her instead? I'll say it came from you.\u201d","tag":"game","you":-6,"them":5,"outcome":"\u201cWould you? Thanks.\u201d By Friday Clara thanks you for the kind words, and Daniel's door is still shut.","why":"You took the hard part off him. He is the Kid being looked after, and you are carrying a message that was his to give, so the scene ends here."}]}],"payoff":"Daniel hands the job to you and leaves for his desk. On Friday Clara thanks you for the kind words, and Daniel's door stays shut."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You, once Daniel has gone","text":"\u201cTell Clara those two sentences before ten tomorrow. If you like, I'll be at the next desk.\u201d","cue":"level, the vending machine humming behind you","options":["His Boss handed you an order, so the whine comes back next week","His Kid gave up and went quiet, so the talk is over","His Pilot answered, so the talk stayed open"],"answer":2,"why":"Your request asked him for a plan with a time on it, so he answered with one. You changed seat, and the whine was cut before it could run on. A person who is crossed tends to move into the seat the other one invited, and your question invited his Pilot. A cut works when it asks for something real, like a time or two sentences, and this one did.","traps":{"0":"If his Boss had answered, it would sound like \u201cFine, I'll do it, and nobody tells me how to talk to my own people.\u201d That is an order handed back to you, and the whine would return after the next release.","1":"If his Kid had given up, it would sound like \u201cForget it, she'll be fine, I shouldn't have said anything.\u201d The talk would end on the sulk, and Clara would hear nothing on Friday."},"example":"A warehouse supervisor to a driver who keeps complaining about the rota: \u201cOkay. Which two shifts would you swap? Write them on the board.\u201d<br>The question has an end point, so the driver has a real answer to give."}]}]},{"setting":"Friends & Community","blurb":"Ruby's birthday plan for Joseph is wobbling, and both of them want to be told it's fine.","opener":{"setting":"Friday, 18:30, the five-a-side pitch behind the station. Joseph's fortieth is tomorrow at the Corner Table.","lines":[{"who":"Ruby","text":"\u201cEleven said yes and four have gone quiet. Nobody comes to anything I organise. Tell me it's me.\u201d","cue":"tin under one arm, the list shaking slightly"}],"ask":"Can you answer Ruby's plea from a seat she did not call on, so tomorrow gets planned instead of mourned?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> Ruby's line is a plea, and every reply after it is a volley. A volley either runs on or gets cut. Tap the label that fits each line.","items":[{"type":"pick","who":"Ruby, on the pitch side","text":"\u201cFour people have gone quiet on the group chat. Is it me? Am I the reason nobody comes?\u201d","cue":"tin under one arm, list shaking slightly","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"This is a plea. It asks you to soothe a hurt, and it has no plan and no verdict in it. That is the Kid, the voice that wants comfort, and it is aimed at the caring side of your Boss.","traps":{"0":"The Boss would say \u201cYou send too many reminders, Ruby. People switch off.\u201d That is a verdict, so the talk becomes a telling-off and the hurt goes unheard.","1":"The Pilot would say \u201cMessage the four tonight and ask for a yes or a no by nine.\u201d It is a good plan, but this line is about the hurt, so the plan misses it."},"example":"A choir leader after a thin rehearsal: \u201cThey hardly clapped, did they? It's me.\u201d<br>She is asking for comfort, not for a recruitment drive."},{"type":"pick","who":"You, a moment later","text":"\u201cRuby, it's nothing to do with you. People are just busy.\u201d","cue":"warm and quick, wanting to make it better","prompt":"What kind of reply is your line?","options":["A matched volley","A cut","Double-talk"],"answer":0,"why":"Your reply comes from the Caring Boss, the seat she called on, and it answers her plea with comfort. That is a matched volley, so it can run on, and she will be back with the same question before the next party.","traps":{"1":"A cut would answer from a seat she did not call on, like \u201cWhich four went quiet? Read me the names.\u201d Your line does not change seat. It comforts her from the seat she called on.","2":"Double-talk would be a kind line with a second message under it, like \u201cIt's nothing to do with you, Ruby. Well, mostly.\u201d The words soothe and the tail stings. Your line has no sting in it."},"example":"A parents' group chat, a mother whose child's party had three guests: \u201cThey were all ill, don't take it personally.\u201d<br>She feels better, and she will ask again at the next invitation."},{"type":"pick","who":"You, a second later","text":"\u201cWhich four went quiet? Read me the names.\u201d","cue":"calm and level, hand out for the list","prompt":"What kind of reply is your line?","options":["A matched volley","A cut","Double-talk"],"answer":1,"why":"This comes from the Pilot, a seat she did not call on. She called on the Caring Boss, and you asked for names, which is changing seat. The reply is a cut, so the hurt has no seat to land in.","traps":{"0":"A matched volley would be \u201cIt's nothing to do with you, Ruby.\u201d She gets the comfort she asked for, and the same question returns next time.","2":"Double-talk would be the same words said with a sigh and a glance at the clock. The words are fine and the tone carries a second message, and she would hear the tone first."},"example":"A tenants' association meeting, the secretary upset about the empty seats: \u201cFine, you're upset. Who do you want us to ring tonight?\u201d<br>The question turns the sulk into a short list."},{"type":"pick","who":"Ruby, a minute later","text":"\u201cOh, it's lovely that you're all so busy. I'll carry the tin and the banner myself, I'm used to carrying things.\u201d","cue":"sweet voice, a sigh at the end","prompt":"Look at what the line says and what sits under it. Which label fits Ruby's line?","options":["Double-talk","A cut","A matched volley"],"answer":0,"why":"The first message is sweet: it is lovely that you are busy. The second sits underneath and says you leave her to carry everything. Two messages in one line is double-talk, and the sigh tells you which one is loud.","traps":{"1":"A cut is a reply that answers from a different seat. Ruby is not switching seats here. She is carrying two messages in the same line.","2":"A matched volley is a plain line that gets a plain reply from the seat it was aimed at, like \u201cThanks, I could do with a hand with the banner.\u201d Her line says one thing and carries a second underneath, so it is not plain."},"example":"A book club WhatsApp group, a member left off the rota: \u201cNo, no, you all go ahead. I know my place.\u201d<br>The first message is polite. The second is the bill, and everyone reads that one."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"scene","title":"Friday, 18:30, the five-a-side pitch behind the station","setting":"Joseph's fortieth is tomorrow at the Corner Table. Ruby has the guest list in one hand and a cake in a tin under the other arm, and she has not yet put either down.","meters":{"you":70,"them":50},"beats":[{"who":"Ruby","text":"\u201cJoseph says he doesn't mind who comes. That's a lie, nobody wants a quiet fortieth. Tell me I haven't ruined it.\u201d","cue":"tapping the lid of the cake tin","lines":[{"text":"\u201cWho do you most want in that room tomorrow? Give me one name.\u201d","tag":"best","you":4,"them":5,"outcome":"\u201cHannah. She said she'd try, and that is different from yes.\u201d Ruby looks down at the list as if it might answer back.","why":"You answered from your Pilot, a seat she did not call on, and asked for one real name. The cut stops the plea without starting a row."},{"text":"\u201cYou haven't ruined anything. It'll be lovely.\u201d","tag":"ok","you":-2,"them":3,"outcome":"\u201cYou always say that,\u201d she says, and checks her phone again.","why":"You answered from the Caring Boss, the seat she called on. It is a matched volley, so it feels kind, and nothing is asked of her."},{"text":"\u201cGive me the list. I'll ring round tonight and sort the numbers myself.\u201d","tag":"game","you":-6,"them":4,"outcome":"She hands it over a bit too fast. \u201cYou're a saint. I'll owe you.\u201d By Saturday she has counted what she owes you, and Hannah still has not been asked.","why":"You took the job off her. She is now the Kid being looked after and you are carrying her party, so the scene ends here."}]},{"who":"Ruby","text":"\u201cPeter's do last year had twelve. Twelve! I'm obviously just bad at this.\u201d","cue":"looking past you at the goalposts","lines":[{"text":"\u201cWhat did you do for Peter's that you could do again? Name one thing.\u201d","tag":"best","you":3,"them":5,"outcome":"\u201cI rang people. I didn't just message.\u201d She takes her phone out of her coat pocket.","why":"A question about what worked is a cut from your Pilot. She has to answer with facts, so the verdict on herself has nothing to hold."},{"text":"\u201cYou're not bad at this. You're brilliant at organising.\u201d","tag":"ok","you":-1,"them":2,"outcome":"\u201cHm,\u201d she says, and puts the list on the tin lid without looking at it.","why":"This is the Caring Boss again, a matched volley that calms her and changes nothing. She hears no new message."}]},{"who":"Ruby","text":"\u201cEveryone says they'll come and then Saturday arrives and it's me and the cake. Every time.\u201d","cue":"voice flat, arm tightening round the tin","lines":[{"text":"\u201cWhat time do you want the first person through the door? Say the time.\u201d","tag":"best","you":3,"them":4,"outcome":"\u201cSeven. Half past would do.\u201d She says it like a person who has an evening to plan.","why":"The dread had no handle. A time gives it one, and a plan she can say aloud is something her Pilot can answer."},{"text":"\u201cNot this time. This time they'll all turn up, you'll see.\u201d","tag":"ok","you":-2,"them":3,"outcome":"\u201cYou can't know that,\u201d she says, but she smiles.","why":"A matched volley that comforts her with a promise nobody can keep. She feels better for a minute and the evening is no clearer."}]},{"who":"Ruby","text":"\u201cIf it's only six people, I'll cancel it. I'd rather cancel than watch Joseph sit there.\u201d","cue":"tin under her arm, already turning towards the gate","lines":[{"text":"\u201cWhat's the smallest number that still makes it a good night? Say it, and we plan for that.\u201d","tag":"best","you":4,"them":5,"outcome":"\u201cSeven. Joseph, me and five. I think I can find five.\u201d She turns back from the gate.","why":"You gave the party an edge. A cut that asks for a number turns a verdict into a job."},{"text":"\u201cDon't cancel, Ruby. Joseph would be crushed.\u201d","tag":"ok","you":-3,"them":-1,"outcome":"She stops. \u201cNow I've got that on me as well,\u201d she says, and walks on with the tin.","why":"This is the Caring Boss with a hint of blame in it. It keeps the party alive and puts a weight on her shoulders."},{"text":"\u201cCancel it, then, if you're going to sulk. Nobody can please you.\u201d","tag":"game","you":-8,"them":-7,"outcome":"Her voice goes up. \u201cDon't you talk to me like that.\u201d She leaves through the gate and the tin goes with her.","why":"This is a verdict, and it invites her own Boss to answer. A person who is crossed tends to move into the seat the other one invited, so a row starts and the scene ends here."}]}],"payoff":"Ruby walks off with the tin and the list, and the party is on hold. Joseph finds out on Saturday from someone else."},{"type":"scene","title":"Saturday, 19:10, the back table at the Corner Table","setting":"Six chairs, a banner that says 40, and Joseph in the doorway still wearing his coat. Ruby is at the counter arguing with the kettle.","meters":{"you":65,"them":55},"beats":[{"who":"Joseph","text":"\u201cIt's six chairs, isn't it. I'm forty and I've got six chairs. Don't tell me it's lovely.\u201d","cue":"coat still on, hand on the door frame","lines":[{"text":"\u201cWho's coming that you'd be glad to see? Say the first name.\u201d","tag":"best","you":4,"them":5,"outcome":"\u201cRuby, obviously. And Hannah, if she makes it.\u201d He lets go of the door frame.","why":"You answered from your Pilot and asked for a name. The cut gives the whine a job to do."},{"text":"\u201cSix is a lovely number, Joseph. Come in, come in.\u201d","tag":"ok","you":-2,"them":3,"outcome":"He comes in and keeps the coat on.","why":"A matched volley from the Caring Boss. It is warm and it is kind, and his coat stays on."},{"text":"\u201cTypical, isn't it? People never turn up for anything round here.\u201d","tag":"game","you":-6,"them":4,"outcome":"He groans. \u201cExactly. Nobody does.\u201d You both look at the door until twenty to eight.","why":"You joined the whine, so now you are both Kids in the same sulk. Nobody is asking for anything, so the scene ends here."}]},{"who":"Joseph","text":"\u201cMy knee gave out in the first half last Tuesday and nobody checked on me. That's how it goes. I'm furniture.\u201d","cue":"rubbing the knee under the table","lines":[{"text":"\u201cWhat would you have wanted someone to do on Tuesday? Give me one thing.\u201d","tag":"best","you":3,"them":5,"outcome":"\u201cSit with me for five minutes. That's all.\u201d He looks surprised to have said it.","why":"A question about what he wanted is a cut from your Pilot. He has to answer with a small, real request."},{"text":"\u201cI'm sorry, Joseph. That's awful. None of us noticed.\u201d","tag":"ok","you":-1,"them":3,"outcome":"He nods, soothed. \u201cIt's all right.\u201d The knee gets rubbed again, and Tuesday goes unmentioned.","why":"A matched volley from the Caring Boss. The sorry soothes him, and nothing is asked of anyone next Tuesday."},{"text":"\u201cRight, I'll set up a rota for the five-a-side. Someone will sit with you every week.\u201d","tag":"game","you":-6,"them":5,"outcome":"\u201cA rota!\u201d he says, delighted. By Tuesday the rota has your name on every line.","why":"You took on a rescue he never asked for. He is the Kid being looked after, so the scene ends here."}]},{"who":"Joseph","text":"\u201cRuby did all this and I know it cost her. Tell her I said it was nice, so I don't have to.\u201d","cue":"eyes on the counter, voice dropped","lines":[{"text":"\u201cSay it to her yourself when she sits down. What's the one sentence?\u201d","tag":"best","you":4,"them":4,"outcome":"He thinks. \u201cYou did this for me and I noticed.\u201d He says it twice, to get it right.","why":"You handed the message back to him. A cut that asks for the sentence keeps him an adult in the talk."},{"text":"\u201cOf course I'll tell her. She'll be thrilled.\u201d","tag":"ok","you":-1,"them":3,"outcome":"Joseph relaxes. The sentence stays with you.","why":"A matched volley that takes the job off him. It is friendly, and he never says it himself."}]},{"who":"Joseph","text":"\u201cWhat if nobody else turns up? Then it's a funeral with a cake.\u201d","cue":"eyes on the door, the bell above it still","lines":[{"text":"\u201cIf it's only the three of us, what do you want to eat first? Pick.\u201d","tag":"best","you":4,"them":5,"outcome":"\u201cThe cake. Before it goes warm in that tin.\u201d He laughs for the first time tonight.","why":"You turned a dread into a small choice. A cut like that works because it asks for something he can answer."},{"text":"\u201cThey'll come. Stop worrying, Joseph.\u201d","tag":"ok","you":-1,"them":2,"outcome":"He looks at the door again. \u201cYou don't know that.\u201d","why":"A matched volley that tells him to stop. He is still watching the door, and the cake has not moved."}]}],"payoff":"You and Joseph spend ten minutes ranking who has let you down. When Ruby walks in at twenty past with the tin, you both look as flat as the banner."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You, after Ruby sits down","text":"\u201cJoseph, tell Ruby the one thing you noticed. Ruby, you listen first.\u201d","cue":"pulling a chair out for her","options":["His Boss handed her a rule, so the whine comes back","His Pilot answered, so the talk stayed open","His Kid gave up and went quiet, so the evening is over"],"answer":1,"why":"Your request asked him for one real thing, so he answered with one. You changed seat, and the whine was cut before it could run on. A person who is crossed tends to move into the seat the other one invited, and your request invited his Pilot. A cut works when it asks for something real, like a sentence or a name, and this one did.","traps":{"0":"If his Boss had answered, it would sound like \u201cRuby, next time give people two weeks' notice and don't be so touchy.\u201d That is a rule handed to her, and the whine would return at the next party.","2":"If his Kid had given up, it would sound like \u201cNever mind, it's fine, I'm not worth the fuss.\u201d The evening would end on the sulk, and Ruby would have heard nothing."},"example":"A choir leader to a nervous soloist: \u201cTell me the one bar you want to practise before Friday.\u201d<br>The request has an end point, so the singer has something real to say."}]}]},{"setting":"Relationships","blurb":"After a second date, Clara and Omar each ask you to read the other's mind.","opener":{"setting":"Saturday, 23:10, your sofa. Clara has rung from the night bus, and Omar's message from five past ten is still unanswered on her screen.","lines":[{"who":"Clara","text":"\u201cHe sent it an hour ago and I haven't answered. If I answer fast I look desperate and if I wait I look cold. Tell me I haven't spoiled it.\u201d","cue":"low and quick, the bus engine rumbling behind her"}],"ask":"Can you answer Clara's plea from a seat she did not call on, so a line gets sent instead of a worry?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> Clar
