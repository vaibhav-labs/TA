ot dish, two people and a clear job. The talk is there to get it onto the table."},{"text":"Under the table, Leo and his cousin Ned:<br>\u201cSay you broke the vase and I'll let you have my tablet.\u201d<br>\u201cBut I didn't\u2026\u201d<br>\u201cJust say it. Then it's yours.\u201d","answer":4,"why":"The tablet is bait. The offer sounds like a gift, and the cost lands on Ned when the grown-ups ask who broke it."},{"text":"The armchair by the telly, Uncle Tony:<br>Plate on his knee, match on mute.<br>Nobody has spoken to him since the soup.","answer":0,"why":"Plate untouched, eyes on a muted screen. He is spending the hour alone in a full room."}],"example":"A train carriage on a long ride.<br>Most people have earphones in. Two friends chat, and one person stares at the window.<br>Each is spending the same hour in a different way."},{"type":"scene","title":"Sunday, 13:10, Gran's flat downstairs","setting":"Sunday lunch. Everybody is in the hall at once, and you are holding a coat that isn't yours.","meters":{"you":60,"them":50},"beats":[{"who":"You","text":"\u201c...\u201d","cue":"where do you go?","lines":[{"text":"Go out to the back step and join Gran and Grace.","tag":"ok","you":0,"them":-8,"outcome":"They stop talking. Grace studies her tea, and Gran says \u201cLovely day, isn't it.\u201d The moment has gone.","why":"Real talk is private, so you can't join it by stepping in. Only an invitation gets you in."},{"text":"Go over to Uncle Tony and say \u201cHi.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cHi.\u201d \u201cHi.\u201d His eyes go back to the mute match.","why":"One hello is polite, and it leaves Tony with his screen. The hour stays his."},{"text":"Sit sofa-side with Mum and Auntie Jean and ask about the bypass.","tag":"ok","you":2,"them":5,"outcome":"Twenty minutes of roadworks and detours. Pleasant, and nothing happens. Auntie Jean, at some point: \u201cWe should actually talk sometime.\u201d","why":"Small talk is safe because little can happen in it. You get a warm nod with almost no risk, and that is the trade.","flags":["jean_wants_real"]},{"text":"Perch on the arm of the other chair by Uncle Tony and watch the muted match with him.","tag":"best","you":2,"them":6,"outcome":"After a while, Tony: \u201cNobody asks about the new hip. They ask about the weather.\u201d","why":"Silence can be company. He spoke because nothing was asked of him, and what he said was true.","flags":["tony_opened"]}]},{"who":"You","text":"\u201c...\u201d","cue":"ten minutes on, plates being passed. Where now?","lines":[{"text":"Walk over to Dad in the hall.","tag":"ok","you":-3,"them":1,"outcome":"\u201cSmells good,\u201d he says, before you have said anything. Then he turns back to Uncle Barry.","why":"Routine. \u201cSmells good\u201d is the line Dad gives every Sunday, so it fills the hour and asks nothing back."},{"text":"Go into the kitchen and turn Leo down. \u201cKeep the pudding, I'll help you wipe it up.\u201d","tag":"best","you":5,"them":-4,"outcome":"\u201cBoring!\u201d says Leo, and hands you the cloth anyway.","why":"A clear no, said lightly, with no lecture in it. It costs a little of Leo's warmth, and it keeps Mum's look off you."},{"text":"Go into the kitchen, where Leo has the gravy jug. \u201cTell Mum you spilled it and I'll give you my pudding.\u201d","tag":"ok","you":-5,"them":2,"outcome":"\u201cGood,\u201d Leo says, and slides off the stool. Mum's face, when she sees the tablecloth, is going to be for you.","why":"A pudding handed across a counter feels like being included, and the cost is Mum's face. The hook is in the offer.","flags":["took_blame"]}]},{"who":"Mum","text":"\u201cYou're easier than your father, you know. He said you'd sulk about Sunday lunch.\u201d","cue":"the sink at 15:40, sleeves pushed up, frazzled","lines":[{"text":"\u201cThanks, Mum. I'm glad it's gone well.\u201d","tag":"best","you":3,"them":5,"outcome":"\u201cYeah? Good. Good.\u201d She flicks suds at you, nearly.","why":"She gave a warm nod wrapped around a cold one, the sulking bit. Taking the warm part and leaving the jab alone keeps it clean."},{"text":"\u201cDad says a lot.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"\u201cHe does.\u201d She turns the tap on harder.","why":"It turns her nod into a dig at Dad. She offered something warm, and you handed it back as a jab."},{"text":"\u201cThanks. Dad said you'd burn the roast.\u201d","tag":"ok","you":2,"them":3,"outcome":"She laughs and flicks the tea towel at you. \u201cFair.\u201d","why":"A joke back is a warm nod too, and it lands on the fun part of what she said."}]},{"who":"Gran","text":"\u201cStay a minute? Just you. I want to say it before your mum gets it wrong.\u201d","cue":"her front door, 16:30, coats on, Gran's hand on your sleeve","lines":[{"text":"\u201cTell Mum first, Gran. She'd want to know.\u201d","tag":"ok","you":-3,"them":-6,"outcome":"\u201cI can't tell her first.\u201d She lets go of your sleeve and the minute is over.","why":"It sends her to the hard conversation before she has said a word of it. She asked to be heard, and you handed her a task."},{"text":"\u201cYes. Take your time.\u201d Close the door and sit with her.","tag":"best","you":4,"them":8,"outcome":"She breathes out. \u201cIt's the March appointment. I'm frightened of what they'll say.\u201d The clock on her mantel ticks twice.","why":"She asked, so you can be in it. Staying and not fixing anything is what lets real talk happen."},{"text":"\u201cTell me Wednesday, I'll bring cake.\u201d","tag":"ok","you":0,"them":1,"outcome":"\u201cWednesday, then,\u201d she says, and the moment shrinks back into her cardigan.","why":"A promise for later keeps the door open, though it is a blurred answer. She wanted the minute now, and by Wednesday she may not."}]}],"example":"A cousin's engagement party.<br>Three people talk about the venue. One person sits alone by the cake, and one couple whispers in the garden.<br>Nobody is wrong to be where they are."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"The back step looked like two women with a cup of tea. It was real. Why couldn't you just go out and sit with them?","options":["Real talk is private, so you can only be invited into it","You came out with no topic ready, so they had nothing to answer","Being family decides who is allowed onto the step"],"answer":0,"why":"Real talk is private, and it is rare because something can happen in it. You don't join it by stepping in. Someone has to ask you in.","traps":{"1":"A topic is what gets you into small talk, because small talk runs on one subject at a time. The step was not small talk, so a better opener would still have broken in on something private.","2":"Being related does not, by itself, get you into a private moment. You can share a Sunday table for years and still not be asked out."},"example":"A funeral tea.<br>Two aunts whisper by the urn.<br>You walk over, and they stop. That talk was theirs, and you wait to be asked."}]}]},{"setting":"Friends & Community","blurb":"Ruby's thirtieth at the Corner Table, a lemon cake, and Joseph, who is joking a little too hard.","opener":{"setting":"Saturday, 15:00. The Corner Table, near the station. Ruby's thirtieth, with the back room booked for twenty and fourteen here.","lines":[{"who":"Ruby","text":"\u201cDon't make a speech. Please. Just eat the cake.\u201d","cue":"holding a knife over a lemon sponge"},{"who":"You","text":"\u201c...\u201d","cue":"the back room, the counter, the window seat, the pavement, and nobody has waved"}],"ask":"Which corner of this party has real talk in it, and which one only sounds like it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Three lines from the party. Tap what the people in them were doing with that hour.","items":[{"type":"pick","who":"Two guests","text":"\u201cDid you get through the roadworks by the station?\u201d \u201cDon't. Forty minutes I sat there.\u201d","cue":"the queue for the toilets","options":["Work","Small talk","Real"],"answer":1,"why":"Small talk. One shared topic, a couple of easy lines each, and little at stake. That safety is the point of it.","traps":{"0":"Work would be about getting something done. Nobody is planning a route or fixing a road, only complaining about one.","2":"Real would need something true to be said. Grumbling about traffic is safe, which is why people reach for it."},"example":"A school bus stop.<br>\u201cThey've put the fares up again.\u201d \u201cDon't I know it.\u201d<br>Two lines on one topic, and both are glad of them."},{"type":"pick","who":"Joseph","text":"\u201cI haven't been at work since March. Ruby thinks I'm on nights.\u201d","cue":"no joke this time, staring at the tray of sausage rolls","options":["Work","Trap","Real"],"answer":2,"why":"Real. Something true was said, and he didn't wrap it in a joke. Real talk is rare because something can happen in it.","traps":{"0":"Work would be about a job to get done. Joseph's own work is the subject, but he isn't asking you to do anything about it.","1":"Trap would need a hook and a sting. Nobody is being drawn in. He told you plainly."},"example":"A car park after a football match.<br>\u201cI haven't told my brother I lost the flat.\u201d<br>The other person puts the keys back in their pocket and stays."},{"type":"pick","who":"Nadia","text":"\u201cCan you carry the second cake out before the candles drip?\u201d","cue":"already holding the kitchen door open with her hip","options":["Work","Routine","Trap"],"answer":0,"why":"Work. A cake, a door and a deadline: the talk ends when the cake is on the table.","traps":{"1":"Routine would be the same words every time, like \u201cHappy birthday\u201d to each guest. This is a one-off request about one cake.","2":"Trap would dress a favour up with a price. This is just a request, with candle wax as the clock."},"example":"A village hall quiz night.<br>\u201cCan you bring the answer sheets round before the break?\u201d<br>A task and a time, so it is work."}]},{"level":"Play","label":"Play, the week in motion","intro":"Six corners of the party. Put each one in its bin, then choose where you go.","items":[{"type":"sort","prompt":"Six corners of the party. For each one, what are people doing with that hour?","bins":["Alone","Routine","Small talk","Work","Trap","Real"],"items":[{"text":"The counter, Nadia and Dennis, who runs the caf\u00e9:<br>\u201cForty slices, so eight to a cake.\u201d<br>\u201cAnd the candles?\u201d<br>\u201cDrawer by the till. Tell the kitchen to hold the second cake.\u201d","answer":3,"why":"Slices, candles and a kitchen to tell. This talk ends with jobs done."},{"text":"The window table, two people from the five-a-side match:<br>\u201cIs it me, or is the heating on?\u201d<br>\u201cIt's the oven next door.\u201d<br>\u201cAlways is.\u201d","answer":2,"why":"A warm room and an oven. Safe, shared and easy to drop. Small talk keeps the party friendly."},{"text":"The door, Nadia and each new arrival:<br>\u201cHappy birthday!\u201d<br>\u201cThanks for coming!\u201d<br>\u201cWouldn't miss it!\u201d","answer":1,"why":"The same words for every guest, and nobody needs to think. Routine fills the hour and asks nothing back."},{"text":"A stool at the counter, Abdul from Ruby's street:<br>Phone face-up, plate untouched.<br>Nobody has spoken to him in twenty minutes.","answer":0,"why":"Phone up, plate untouched. He is spending the hour alone, even in a crowded room."},{"text":"The pavement outside, Ruby and her brother:<br>\u201cI didn't think thirty would feel like this.\u201d<br>\u201cThen say what it feels like.\u201d<br>\u201cI'm saying it to you.\u201d<br>The door swings shut.","answer":5,"why":"Something true was said, and someone asked for more. Real talk is rare because something can happen in it."},{"text":"The corner, Gavin and a friend of Ruby's:<br>\u201cPut your name down for the trip. You can't be the only one out.\u201d<br>\u201cI'm not sure I can drive.\u201d<br>\u201cI'll cover your share if you do. Go on.\u201d","answer":4,"why":"\u201cI'll cover your share if you do\u201d is a hook. It sounds generous, and the cost arrives later, when he needs a driver."}],"example":"A train carriage on a long ride.<br>Most people have earphones in. Two friends chat, and one person stares at the window.<br>Each is spending the same hour in a different way."},{"type":"scene","title":"Saturday, 15:00, the Corner Table","setting":"Ruby's thirtieth. You have a gift bag in one hand and no idea where to put it.","meters":{"you":60,"them":50},"beats":[{"who":"You","text":"\u201c...\u201d","cue":"where do you go?","lines":[{"text":"Go out to the pavement and join Ruby and her brother.","tag":"ok","you":0,"them":-8,"outcome":"They stop. Ruby looks at her shoes, and her brother says \u201cCold out, isn't it.\u201d The moment is gone.","why":"Real talk is private, so you can't join it by stepping in. Only an invitation gets you in."},{"text":"Go over to Abdul and say \u201cHey.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cHey.\u201d \u201cHey.\u201d He turns back to his phone.","why":"One hello is polite, and it leaves Abdul on his phone. The hour stays his."},{"text":"Take the next stool at the counter and say nothing for ten seconds.","tag":"best","you":2,"them":6,"outcome":"After a while, Abdul: \u201cRuby fed my cat in August. I know nobody here, and I'm holding a present for a woman I've met twice.\u201d","why":"Silence can be company. He spoke because nothing was asked of him, and what he said was true.","flags":["abdul_opened"]},{"text":"Sit at the window table and ask about the heating.","tag":"ok","you":2,"them":5,"outcome":"Twenty minutes of ovens and radiators. Pleasant, and nothing happens. One of them, at some point: \u201cWe should actually talk sometime.\u201d","why":"Small talk is safe because little can happen in it. You get a warm nod with almost no risk, and that is the trade.","flags":["window_wants_real"]}]},{"who":"You","text":"\u201c...\u201d","cue":"ten minutes on, the sponge being cut. Where now?","lines":[{"text":"Go over to Gavin in the corner, who is holding out a deal. \u201cName down for the trip, I'll cover your share if you drive.\u201d","tag":"ok","you":-5,"them":2,"outcome":"\u201cGood man,\u201d Gavin says, and writes your name on the back of a napkin. You are the driver now.","why":"A deal pushed across a table feels like being included, and it costs you the driving. The hook is in the offer.","flags":["agreed_trip"]},{"text":"Go over to Gavin and turn the deal down. \u201cNot for me. I'll get the cake plates.\u201d","tag":"best","you":5,"them":-4,"outcome":"\u201cTight!\u201d Gavin shouts, and laughs anyway. You get the plates.","why":"A clear no, said lightly, with no lecture in it. It costs a little of Gavin's warmth, and it keeps your weekend free."},{"text":"Walk over to Nadia at the door.","tag":"ok","you":-3,"them":1,"outcome":"\u201cHappy birthday!\u201d she says to you as if you had just arrived, then turns to the next coat.","why":"Routine. \u201cHappy birthday!\u201d is the line Nadia gives every guest, so it fills the hour and asks nothing back."}]},{"who":"Ruby","text":"\u201cYou're alright, you know. Joseph said you'd go home after the first hour.\u201d","cue":"the cake table at 16:20, icing on her thumb, a bit emotional","lines":[{"text":"\u201cThanks. Joseph said you'd cry into the sponge.\u201d","tag":"ok","you":2,"them":3,"outcome":"She laughs and licks her thumb. \u201cFair.\u201d","why":"A joke back is a warm nod too, and it lands on the fun part of what she said."},{"text":"\u201cJoseph says a lot.\u201d","tag":"ok","you":-2,"them":-3,"outcome":"\u201cHe does.\u201d She looks across at Joseph, who is laughing too loudly at nothing.","why":"It turns her nod into a dig at Joseph. She offered something warm, and you handed it back as a jab."},{"text":"\u201cThanks, Ruby. I'm glad you're having a good day.\u201d","tag":"best","you":3,"them":5,"outcome":"\u201cYeah? Okay. Okay.\u201d She slides a slice of cake toward you.","why":"She gave a warm nod wrapped around a cold one, the going-home bit. Taking the warm part and leaving the jab alone keeps it clean."}]},{"who":"Joseph","text":"\u201cGot a minute? Not for the group chat. Just you. I haven't said it out loud yet.\u201d","cue":"by the bike rack at 17:30, jacket zipped to the chin, not joking","lines":[{"text":"\u201cJust tell everyone. It'll be a weight off.\u201d","tag":"ok","you":-3,"them":-6,"outcome":"\u201cRight. Yeah. Maybe.\u201d He fiddles with the lock and the minute is over.","why":"It pushes him to the hard part before he has said a word of it. He asked to be heard, and you handed him a task."},{"text":"\u201cCome to Thursday's match and we'll talk after.\u201d","tag":"ok","you":0,"them":1,"outcome":"\u201cThursday, then,\u201d he says, and unlocks his bike.","why":"A promise for later keeps the door open, though it is a blurred answer. He wanted the minute now, and by Thursday he may have his joke back."},{"text":"\u201cYes. Take your time.\u201d Lean on the rack beside him.","tag":"best","you":4,"them":8,"outcome":"He breathes out. \u201cIt's been eight months.\u201d A bus goes past, and neither of you looks up.","why":"He asked, so you can be in it. Staying and not fixing anything is what lets real talk happen."}]}],"example":"A cousin's engagement party.<br>Three people talk about the venue. One person sits alone by the cake, and one couple whispers in the garden.<br>Nobody is wrong to be where they are."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"The pavement looked like a smoke break, and it was real. Why couldn't you just go out and join Ruby and her brother?","options":["How long you have known Ruby decides who gets asked out","You had no topic ready, so they had nothing to answer","Real talk is private, so you can only be invited into it"],"answer":2,"why":"Real talk is private, and it is rare because something can happen in it. You don't join it by stepping in. Someone has to ask you in.","traps":{"0":"Years of friendship do not, by themselves, get you into a private moment. You could know Ruby well and still not be asked out.","1":"A topic is what gets you into small talk, because small talk runs on one subject at a time. The pavement was not small talk, so a better opener would still have broken in on something private."},"example":"A wedding reception.<br>Two cousins whisper by the window.<br>You walk over, and they stop. That talk was theirs, and you wait to be asked."}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://vaibhav-labs.github.io/TA/arena/","next":{"slot":"1.5","title":"Match the Table","url":"https://vaibhav-labs.github.io/TA/arena/1-5.html"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: MULTI ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
