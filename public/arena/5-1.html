<script>window.TA_GAME = {"slot":"5.1","setting":"Work","title":"Real Feeling or Stand-In?","world":5,"worldName":"Under the Surface","week":5,"weekName":"Under the Surface","mechanic":"Diagnose","concept":"After this one you can tell a real feeling, which finishes something, from a stand-in feeling, which never fixes anything.","plainWord":"a stand-in feeling","bookTerm":"Racket feeling","bookIdea":"A racket feeling is a substitute feeling, learned in childhood, that you show in place of the real one, and it never resolves the situation it turns up in.","bookSource":"TA Today, ch. 1 and 21; Scripts People Live, ch. 1","opener":{"setting":"Monday, 8:40am. Halden, by the station, the team room. Clara's laptop is open on a red screen.","lines":[{"who":"Clara","text":"\u201cHa. I broke the build again. I'm the worst. Ha.\u201d","cue":"laughing, eyes bright, already opening the fix"},{"who":"Omar","text":"\u201cSame as last release. Fire drill, again.\u201d","cue":"shoulders up, not looking at either of you"}],"ask":"Which feelings in this room finish something, and which ones only go round?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each feeling is shown in one line. Decide whether it finishes something, or whether it is a stand-in that fixes nothing.","items":[{"type":"pick","who":"Clara","text":"\u201cHa, it's my fault, obviously. I'm useless at this. Ha.\u201d","cue":"laughing before anyone else can speak, already opening the fix","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":1,"why":"The laugh comes first, before anyone else can say it, and it covers a scared feeling about being found out. Real scared finishes something: it asks for a check or for help. This one stays put after the joke, so it is a stand-in.","traps":{"0":"Taking the laugh at face value would send the talk straight to the fix. Nobody would ask what the joke is covering, so the scared feeling would never get a hearing and the stand-in would stay in charge."},"example":"A school sports day, Saturday.<br>Girl: \u201cHa, I'm rubbish at this. Ha.\u201d<br>She runs to the back of the line and does not look up for the rest of the race."},{"type":"pick","who":"Maya","text":"\u201cI'm angry, Sam. The milk on the floor again. I want the rent by Friday, in my account, not in your pocket.\u201d","cue":"standing in the doorway, arms folded, voice level","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":0,"why":"The anger names one thing, the milk and the rent, and asks for one change by a date. Once Sam answers, the feeling has done its work. That is what a real feeling does: it fits the event and it finishes.","traps":{"1":"Calling it a stand-in would file her anger as noise. Sam would hear that nothing needs to change, and the milk would be back on the floor by next week, with the rent still late."},"example":"A school gate, Thursday.<br>Mum: \u201cI'm angry that the bus was late three times. I want a call from the office by Monday.\u201d<br>Office: \u201cWe'll ring you on Monday, I promise.\u201d"},{"type":"pick","who":"Omar","text":"\u201cI'm sick of it. Every release, the same fire drill, and nobody ever changes anything. I've said it before.\u201d","cue":"slamming the laptop lid, eyes on the screen","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":1,"why":"The anger goes round the same loop: every release, the same fire drill, said before. It asks for no change, so nothing finishes. Under it sits a sad feeling about being unheard, and that is the feeling nobody asks about.","traps":{"0":"Taking the anger as real would give Omar a hearing for the fire drill, and the talk would turn to whose fault the drill is. The loop would run on, and Omar would leave sure that nobody listens, which is what he has already said."},"example":"A family WhatsApp group, Sunday night.<br>Uncle: \u201cI'm sick of this group. Same photos, same jokes, every Sunday. Nothing changes.\u201d<br>Nobody replies, and the next Sunday the same message comes in."},{"type":"pick","who":"Mum","text":"\u201cAfter you rang off, love, I cried. I didn't want you to hear. Missing you is hard, and now I've said it. Tell me about your week.\u201d","cue":"voice thick, the kitchen light off at her end of the line","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":0,"why":"The sadness fits the thing it is about, which is the call ending and a child who is far away. She names it in one line and then turns to your week. Once said, the feeling has done its work, so it is a real feeling.","traps":{"1":"Calling this a stand-in would treat her tears as a bid for a call. You would start managing her tears instead of answering the missing, the talk would turn to whether she means it, and she would stop saying the true thing."},"example":"A hospital canteen, Friday.<br>Nurse: \u201cI was scared on that ward tonight. I don't want to talk about it now. Tell me about your daughter's school play.\u201d<br>Her friend: \u201cSure. Go on, all of it.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Harder now. The two feelings in each line look alike, so ask whether anything finishes once the line is said.","items":[{"type":"pick","who":"Daniel","text":"\u201cI'm furious. Furious. Who signed off those sums? Let's stay calm about it. I'm completely calm.\u201d","cue":"voice rising on every word, one hand flat on the printout, the other in a fist","options":["A real feeling: anger about the sums, and it finishes once they are checked","A stand-in feeling: anger that covers a fear of looking bad, and it goes round without the sums being checked"],"answer":1,"why":"The sums can be checked, and a real anger would stop there. This anger keeps going after the check, and the word calm comes out through a clenched fist. The fear of looking bad in front of the client is what it covers, so it is a stand-in.","traps":{"0":"The sums really were wrong, so the anger can look real. Checking them would feel like the end of it. Next week the same fury would come back over the next sheet, and the fear of looking bad would stay hidden under the table."},"example":"A cricket club committee, Sunday.<br>Treasurer: \u201cI'm livid about the bill. Livid. But I'm perfectly calm, obviously.\u201d<br>Nobody checks the bill, and the same row starts again at the next meeting."},{"type":"pick","who":"Gran","text":"\u201cMy knees, my knees. That's the third time I've told you this week. Nobody comes down to see me, but I'm not complaining. I'll tell you again tomorrow.\u201d","cue":"turning the tap off, then on again, not looking round","options":["A real feeling: scared of the stairs, and it finishes once someone helps her up them","A stand-in feeling: the same sorry tune, repeated, so no visit ever gets arranged"],"answer":1,"why":"The knees are real, but the line has been said three times and it asks for nothing. Real fear would ask for a hand on the stairs, and then it would be finished. This tune goes round, and nobody gets to the visit it is pointing at.","traps":{"0":"A fear of the stairs fits the knees, so the line can sound true. If you took it that way, you would offer to carry the shopping up. The tune would stop for one afternoon and start again on Tuesday, with you as the one who came up the stairs."},"example":"A WhatsApp group for the building, Tuesday.<br>Neighbour: \u201cThe lift is broken again. Third time this month. Nobody tells us anything.\u201d<br>Next week, the same message, with the same photo of the sign."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cOmar says he's sick of it every release, and nothing changes. Which reading fits, and what would a real version of that anger do?\u201d","cue":"turning her cup, not looking up from it","options":["A racket feeling: anger shown in place of a real one, which never finishes anything. Real anger here would name one change and ask for it by a date.","An authentic feeling: anger is a real feeling, so it counts as real as long as it is strong enough to be heard.","A racket feeling, because Omar is a difficult colleague. The feeling itself has nothing to do with it."],"answer":0,"why":"Plain words first: this is a stand-in that fixes nothing. The books call it a racket feeling, and the test is whether the anger finishes the situation. Omar's anger repeats every release and asks for nothing, so it never finishes.","traps":{"1":"Strength is the wrong test. Real anger can be loud and still finish, and this anger can be loud and still go round. Calling it authentic would take the volume for the answer, and the fire drill would stay as it is.","2":"Blaming Omar's character sends the talk to a person, not to the feeling. Omar would hear that he is the problem, and the anger would stay in charge with nothing asked of anyone."},"example":"A school staffroom, Monday.<br>Teacher: \u201cI'm sick of the photocopier. Every term, the same jam, and nobody fixes it.\u201d<br>Another teacher: \u201cPut the request in by Friday, then. The form is in the office drawer.\u201d"}]}],"debrief":{"nadia":"Real feelings fit the event, and they ease once it has been dealt with. A stand-in comes back every release in the same coat, and the release never gets any better. The quick test is simple: did anything finish?","bookTerm":"Racket feeling","bookNote":"The books call this a racket feeling: a feeling you learned to show in place of the real one, which never resolves the situation it appears in."},"reflection":{"prompt":"Which feeling did you show this week that finished nothing, and what was the real one under it?"},"next":"5.2","baseStory":{"setting":"Work","blurb":"Clara jokes about breaking the build while Omar mutters about another fire drill, and the team room fills with feelings."},"moreStories":[{"setting":"Home & Flatmates","blurb":"Sam owes Maya for the gas, and every sorry he offers leaves the bill exactly where it was.","opener":{"setting":"Monday, 7:15pm. Hawthorn Court, apartment 3B, the kitchen. The gas bill lies open on the table and Maya's notebook is open beside it.","lines":[{"who":"Maya","text":"\u201cForty-one of that is yours, Sam. I wrote it down in March.\u201d","cue":"tapping the page with a pen, not raising her voice"},{"who":"Sam","text":"\u201cSorry, sorry, I know. I'm the worst flatmate in the building.\u201d","cue":"already reaching for the kettle, smiling too fast"}],"ask":"Which feelings in this kitchen finish something, and which ones only go round?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each feeling is shown in one line. Decide whether it finishes something, or whether it is a stand-in that fixes nothing.","items":[{"type":"pick","who":"Sam","text":"\u201cI'm so sorry, I'm a terrible person, I'll sort it, I'll sort everything. I'm awful.\u201d","cue":"hand flat on his chest, eyes on the floor tiles","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":1,"why":"The sorry is big and the ask is missing. No amount, no day, nothing Maya could hold him to. Under it sits a scared feeling about her being cross, and that one is never said. So the sorry goes round and fixes nothing.","traps":{"0":"Taking the sorry as real would send Maya to comfort him. She would say it's fine, he would say sorry again, and the forty-one would stay in her notebook with no date beside it."},"example":"A bus stop, Wednesday.<br>Man to his sister, who is waiting for a lift he forgot: \u201cI'm useless, I'm a rubbish brother, I'll make it up to you, I swear.\u201d<br>She says \u201cStop it, it's fine,\u201d and he is still talking when the bus comes."},{"type":"pick","who":"Maya","text":"\u201cI'm cross about the gas. I want twenty by Friday, in my account, and the rest by the end of the month.\u201d","cue":"pen laid down, voice level, looking straight at him","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":0,"why":"The feeling fits one thing, the gas, and it asks for one change with two dates. Once Sam answers, the anger has done its work. A real feeling fits the event and then finishes.","traps":{"1":"Calling it a stand-in would file her anger as noise. Sam would hear that nothing needs to change, and the bill would sit on the table until the next one arrived beside it."},"example":"A garage forecourt, Saturday.<br>Customer: \u201cI'm annoyed the car came back with the same rattle. I want it looked at again by Tuesday, free.\u201d<br>Mechanic: \u201cBring it in Tuesday at nine.\u201d"},{"type":"pick","who":"Sam","text":"\u201cI hid the envelope on Friday because I was scared you'd go off at me. I've got twenty now. Can I hand it over tonight?\u201d","cue":"standing in the doorway with a crumpled envelope held out","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":0,"why":"The fear is named, it fits what he did, and it comes with a plain ask for tonight. Once Maya answers, there is nothing left to carry. That is a real feeling, even though it is a small and uncomfortable one.","traps":{"1":"Reading the fear as a stand-in would treat the envelope as one more apology. Maya would wave it off or snap, and Sam would learn that saying the true thing gets him nowhere."},"example":"A canteen queue, Monday.<br>Intern: \u201cI was scared to tell you the file was corrupted, so I waited. It's fixed now. Can I show you?\u201d<br>Lead: \u201cShow me. Thanks for saying.\u201d"},{"type":"pick","who":"Maya","text":"\u201cNo, no, I'm fine. I'm not bothered about the bins. I'll do them. I always do them, it's fine.\u201d","cue":"bag already knotted, back to the room, one sock-footed step toward the door","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":1,"why":"The words say fine and the knot in the bag says otherwise. She asks for nothing, and the line about always doing them hands Sam a charge with no way to answer it. Under it sits a tired, hurt feeling that she keeps out of sight. So it is a stand-in.","traps":{"0":"Taking the fine at face value would let Sam say thanks and go back to his phone. The bins would be hers again on Monday, and the hurt would be written in the notebook instead of said."},"example":"A parents' evening, Tuesday.<br>Mother, to a teacher who forgot to send the form: \u201cNo, really, I'm fine. I'll fill it in myself. I always do.\u201d<br>The teacher says thanks, and next term the form is late again."}]},{"level":"Play","label":"Play, the week in motion","intro":"Harder now. The two feelings in each line look alike, so ask whether anything finishes once the line is said.","items":[{"type":"pick","who":"Sam","text":"\u201cI feel awful, I feel so awful about the milk and the bins and the gas. I'll do better. I'll do better, I promise. Sorry.\u201d","cue":"wiping the same patch of counter, not looking up","options":["A real feeling: guilt about the milk and bins, and it finishes once he has said which day he will do them","A stand-in feeling: a sorry that goes round and asks Maya to cheer him up, so no day gets named"],"answer":1,"why":"He has said it three ways in one breath and named no day for the bins. A real sorry would pick one thing and do it, and then it would be over. This one asks Maya to cheer him up, so it goes round.","traps":{"0":"Guilt about the milk and bins does fit, so the line can sound true. If you took it that way, you would tell him it's fine. The sorry would stop for an hour and start again on Saturday, with the bins still full."},"example":"A flat share noticeboard, Friday.<br>Note: \u201cSo sorry about the noise, again, I'm so inconsiderate, I'll be quieter, sorry, sorry.\u201d<br>The next night the noise is the same, and so is the note."},{"type":"pick","who":"Maya","text":"\u201cI am SHOUTING because I'm furious! The boiler's been off since Wednesday and you said you'd ring the landlord Monday! Ring him now, I'll watch you do it!\u201d","cue":"phone held out at arm's length, voice cracking on the last word","options":["A real feeling: anger about the call he promised, and it finishes once Sam rings the landlord","A stand-in feeling: loud anger that covers a fear of being the only grown-up, and it carries on after the call is made"],"answer":0,"why":"The volume is high but the line is tight: one broken boiler, one promised call, one request for now. When Sam rings, the anger has nothing left to do. Loud and finished is still a real feeling.","traps":{"1":"The shouting makes it look like a stand-in, and it would be easy to say she has anger to burn. If you took it that way, you would tell Maya to calm down. Sam would hide behind the tone, the call would not get made and the boiler would stay cold."},"example":"A market stall, Sunday.<br>Customer, loudly: \u201cI'm livid! You said the wheel would be fixed by noon! Fix it now, I'll wait right here!\u201d<br>Stallholder: \u201cRight, give me ten minutes.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cSam says sorry about the milk and the gas, and the bins stay full. Which reading fits, and what would the real version of that sorry do?\u201d","cue":"a voice note, a kettle clicking off behind her","options":["An authentic feeling: sorry this loud and this often must be real, so Maya should comfort him until it passes","A racket feeling, because Sam is a hopeless flatmate. The feeling itself has nothing to do with it.","A racket feeling: sorry shown in place of the real one. A real version would name the debt and a day."],"answer":2,"why":"Plain words first: a stand-in feeling that fixes nothing. The books call it a racket feeling, and the test is whether it finishes the situation. Sam's sorry repeats and asks for nothing, so it never finishes. The real version names the debt and a day to pay it.","traps":{"0":"A big sorry is not the same as a finished one. Calling it authentic because it is loud would send Maya to comfort him until it passes, and the bins and the forty-one would stay exactly where they are.","1":"Blaming Sam's character sends the talk to the person, not the feeling. Sam would hear that he is the problem, the sorry would grow, and nothing would be asked of anyone."},"example":"A school staffroom, Monday.<br>Teacher: \u201cI'm so sorry about the late reports, again, I'm hopeless.\u201d<br>Head: \u201cGive me a date for them, and I'll hold the others till then.\u201d"}]}]},{"setting":"Friends & Community","blurb":"Ruby runs the five-a-side, half the team has drifted off, and Joseph keeps making jokes from the touchline.","opener":{"setting":"Thursday, 6:50pm. The Corner Table, before the five-a-side. The pitch is booked for half past seven and the squad is two short.","lines":[{"who":"Ruby","text":"\u201cTwenty-four for the hour, paid up front, and my phone is full of thumbs-ups from people who aren't here.\u201d","cue":"smoothing the booking sheet flat against the table edge"},{"who":"Joseph","text":"\u201cHa. I'll hold the bibs. I'm bench material anyway.\u201d","cue":"grinning at the sugar bowl, boot bag between his feet"}],"ask":"Which feelings at this table finish something, and which ones only go round?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each feeling is shown in one line. Decide whether it finishes something, or whether it is a stand-in that fixes nothing.","items":[{"type":"pick","who":"Ruby","text":"\u201cI'm cross. I paid twenty-four for the pitch and nobody has paid me back. I want it by Sunday, cash or transfer.\u201d","cue":"booking sheet folded in her fist, voice even","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":0,"why":"The anger fits one thing, the pitch fee, and it asks for one change by a day. Once the money comes, it is over. That is how a real feeling works: it fits and it finishes.","traps":{"1":"Calling it a stand-in would treat her as moaning about money. The lads would shrug, the twenty-four would stay unpaid, and Ruby would start to dread booking the pitch at all."},"example":"A book club, Thursday.<br>Member: \u201cI'm annoyed that the deposit for the room is still with me. I want my share by the next meeting.\u201d<br>Treasurer: \u201cSorry, I'll send it tonight.\u201d"},{"type":"pick","who":"Joseph","text":"\u201cHa. Bench material anyway. Ha. Don't mind me, I'll hold the bibs.\u201d","cue":"laughing first, already picking up the bag of bibs","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":1,"why":"The laugh comes before anyone else can speak, and he asks for nothing. It covers a hurt feeling about being left out, and that one stays out of sight. The joke ends and nothing has finished, so it is a stand-in.","traps":{"0":"Taking the laugh as real would let Ruby laugh back and hand him the bibs. Joseph would stand on the touchline for an hour, and the hurt about being benched would go home with him."},"example":"A pub quiz, Tuesday.<br>Man, after his team skips his answer: \u201cHa, what do I know. Ha. I'll keep score.\u201d<br>He keeps score all night and nobody asks him anything."},{"type":"pick","who":"Ruby","text":"\u201cNo, I'm thrilled. Thrilled. It's fine that half of them rang off. Completely fine.\u201d","cue":"bright voice, phone face down on the table","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":1,"why":"The word thrilled is too big for the news. She is let down and cross, and she asks for no one to come on Thursday. So the brightness goes round and no one hears what she needs, which makes it a stand-in.","traps":{"0":"Believing the brightness would earn her a thumbs-up in the chat. Five lads would stay away on Thursday, and Ruby would keep arranging the games alone and smiling."},"example":"A leaving do, Friday.<br>Colleague, as three people text to cancel: \u201cOh, I'm delighted. Delighted. The more cake for us.\u201d<br>Nobody offers to come, and the cake goes home uneaten."},{"type":"pick","who":"Joseph","text":"\u201cI was hurt when you said bench material. I'd like to start the first half next Thursday. Can I?\u201d","cue":"bag on his knee, looking straight at Ruby","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":0,"why":"The hurt is named, it fits the comment, and it asks for one thing next Thursday. Once Ruby answers, nothing is left to carry. A real feeling, said in a plain line, finishes.","traps":{"1":"Reading it as a stand-in would treat his hurt as one more grumble. Ruby would tease him, Joseph would learn that saying the true thing gets a joke, and the bibs would be his again."},"example":"A football pitch, Saturday.<br>Boy to his coach: \u201cI was hurt when you left me out last week. Can I start on Saturday?\u201d<br>Coach: \u201cFair. You start.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Harder now. The two feelings in each line look alike, so ask whether anything finishes once the line is said.","items":[{"type":"pick","who":"Ruby","text":"\u201cJust saying, it's a shame. A real shame. Not saying anything. A shame, that's all.\u201d Then, eleven minutes later: \u201cA shame.\u201d","cue":"three dots appearing and vanishing in the group chat","options":["A real feeling: disappointment about the empty pitch, and it finishes once people say if they are coming","A stand-in feeling: a hint that asks for nothing, so nobody knows what Ruby wants"],"answer":1,"why":"Two messages in eleven minutes and no ask in either. A real feeling would say the thing: I'm let down, come on Thursday. This one hints and waits for someone else to guess, so it goes round and nobody turns up.","traps":{"0":"Disappointment about the empty pitch does fit, so the line can read as real. If you took it that way, you would send her a sad face. The hint would grow, Thursday would stay short, and Ruby would still not have said what she wants."},"example":"A WhatsApp group for a street party, Wednesday.<br>Neighbour: \u201cJust saying, it's a shame no one helped last year. A shame. Not complaining.\u201d<br>No one answers and the next message is the same."},{"type":"pick","who":"Joseph","text":"\u201cSorry, I'm being daft, I'm crying over a Thursday kickabout. My dad used to watch me play. He can't get out now. I miss him on match nights.\u201d Then he rubbed his face and said \u201cRight. Pass the bibs.\u201d","cue":"eyes wet, hand pressed over his mouth, a short laugh at the end","options":["A real feeling: sadness about his dad, and it eases once he has said it out loud to someone","A stand-in feeling: tears that cover shame, and they carry on after the thing is said, with nothing asked"],"answer":0,"why":"The sadness fits the thing it is about, a dad who can no longer come. He names it in a few lines and then turns back to the game. Tears that finish are a real feeling, even when the first line is an apology.","traps":{"1":"The apology and the laugh can look like a cover. If you took it that way, you would tell him he is fine. Joseph would stop talking about his dad, and the match nights would stay sore with no one to tell."},"example":"A hospital waiting room, Friday.<br>Woman: \u201cSorry, I'm being silly. He always did the crossword with me. I miss that.\u201d She wipes her eyes. \u201cRight. Is there tea?\u201d<br>Her friend: \u201cI'll get it.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cRuby says she is thrilled that half the lads rang off. Which reading fits, and what would a real version of that feeling do?\u201d","cue":"stirring her tea, eyes on Ruby's phone","options":["An authentic feeling: she is smiling and calm, so the feeling must be real and needs nothing more","A racket feeling, because Ruby is a fake friend. The feeling itself has nothing to do with it.","A racket feeling: brightness shown in place of the let-down. A real version would say so and ask for people."],"answer":2,"why":"Plain words first: a stand-in that fixes nothing. The books call it a racket feeling, and the test is whether it finishes the situation. Ruby's brightness covers a let-down and asks for no one. The real version would say I'm let down, then ask who is coming.","traps":{"0":"Cheerfulness is a feeling that people trust easily. Calling it authentic because she smiles would send everyone off to enjoy the cake, and Thursday would stay short.","1":"Blaming Ruby for being fake sends the talk to the person, not the feeling. She would feel found out and brighter than ever, and the let-down would stay under the table."},"example":"A hockey club, Sunday.<br>Captain: \u201cI'm delighted so few came. Delighted. More pitch for us.\u201d<br>Coach: \u201cIf you wanted six more, say so, and I'll ring round tonight.\u201d"}]}]},{"setting":"School & College","blurb":"Sam's evening class has a group project due Thursday noon, and nobody in the group will say what they actually need.","opener":{"setting":"Tuesday, 7:05pm. The evening class, room 14. The tutor has handed back feedback sheets and the group project is due Thursday at noon.","lines":[{"who":"Ella","text":"\u201cHa. Mine's all red pen. Don't look.\u201d","cue":"holding the sheet face down against her chest, laughing too early"},{"who":"Gareth","text":"\u201cEvery group. Every single time. Same people, same Thursday.\u201d","cue":"not looking at Sam, who is busy with his zip"}],"ask":"Which feelings in this classroom finish something, and which ones only go round?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each feeling is shown in one line. Decide whether it finishes something, or whether it is a stand-in that fixes nothing.","items":[{"type":"pick","who":"Ella","text":"\u201cHa, mine's all red pen. I'm useless at layouts, obviously. Ha. I'll redo the whole thing.\u201d","cue":"giggling at the feedback sheet, already tearing a fresh page","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":1,"why":"The giggle comes first and the 'obviously' shuts the door on any reply. She asks for no help with the layout. Under it sits a scared feeling about not being good enough, and that never gets a hearing. So it goes round.","traps":{"0":"Taking the giggle as real would send everyone to the redo. Ella would stay up rewriting the whole thing, and nobody would ask what the red pen actually said."},"example":"A cooking class, Wednesday.<br>Woman, after her loaf comes out flat: \u201cHa, I'm hopeless, obviously. Ha. I'll start again from scratch.\u201d<br>She bins the loaf and does not ask the teacher what went wrong."},{"type":"pick","who":"Ms Hargreaves","text":"\u201cI'm disappointed that two outlines are missing. I need them in the folder by Thursday noon, or I can't mark the group.\u201d","cue":"tapping the register against the desk, even voice","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":0,"why":"The disappointment fits one fact, two missing outlines, and it asks for one thing by a deadline. When they arrive, it is finished. A real feeling can sound dry and still do its work.","traps":{"1":"Calling it a stand-in would hear a cool tone and miss the ask. Gareth and Sam would shrug it off as tutor talk, the outlines would stay missing, and the group would go unmarked."},"example":"A choir rehearsal, Tuesday.<br>Conductor: \u201cI'm frustrated that nobody has learned bar twelve. I want it by Saturday, or we cut the piece.\u201d<br>Sopranos: \u201cWe'll have it.\u201d"},{"type":"pick","who":"Gareth","text":"\u201cThis is a joke. Every group, the same. I carry everybody. I always do.\u201d","cue":"slamming a textbook shut, eyes on the ceiling","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":1,"why":"The anger goes round the same loop: every group, always. It asks for no one to do anything, so nothing finishes. Under it sits a lonely, unfairly-treated feeling that nobody asks about.","traps":{"0":"Taking the anger as real would give Gareth a hearing for the carrying. The talk would turn to who is lazy, and the loop would run on, with Gareth sure that nobody listens."},"example":"A neighbourhood meeting, Monday.<br>Man: \u201cEvery year, the same. I do all the stalls and nobody thanks me. Every year.\u201d<br>Chair moves on to the next item."},{"type":"pick","who":"Sam","text":"\u201cI'm scared I can't finish my section by Thursday. I'd rather say so now. Could someone take the tables, and I'll do the summary?\u201d","cue":"hand half raised, notebook shut on the desk","options":["A real feeling: it finishes something","A stand-in feeling: it fixes nothing"],"answer":0,"why":"The fear is named, it fits his situation, and it comes with a plain swap. Once the group answers, it has done its work. A small scared feeling said early is a real one.","traps":{"1":"Reading it as a stand-in would treat his fear as another excuse. The group would groan, Sam would go silent, and the tables would still be undone on Thursday."},"example":"A stockroom, Friday.<br>Assistant: \u201cI'm worried I won't finish the count by five. Could you take the tins while I do the shelves?\u201d<br>Supervisor: \u201cFine, give me the sheet.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Harder now. The two feelings in each line look alike, so ask whether anything finishes once the line is said.","items":[{"type":"pick","who":"Gareth","text":"\u201cI am FURIOUS, Sam! You said Tuesday for the tables! It's Thursday! Send them by six, or I'll do them myself and put my name on them!\u201d","cue":"stabbing the desk with a pen, voice rising on every word","options":["A real feeling: anger about the missed Tuesday, and it finishes once Sam sends the tables","A stand-in feeling: loud anger that covers a fear of being the only reliable one, and it goes on after the tables arrive"],"answer":0,"why":"The shouting is loud, but the line is tight: one missed Tuesday, one deadline, one demand. When Sam sends the tables, the anger has done its work. Loud and finished is a real feeling.","traps":{"1":"The volume makes it look like another round of Gareth's old tune. If you took it that way, you would tell him to calm down. Sam would hide behind the tone and the tables would still not arrive."},"example":"A ferry queue, Saturday.<br>Passenger, loudly: \u201cI'm livid! You told us ten o'clock! Tell me by noon what the plan is!\u201d<br>Crewman: \u201cWait here. I'll find out.\u201d"},{"type":"pick","who":"Ella","text":"\u201cPlease don't worry about me. I love rewriting at two in the morning. Love it. I'm fine, fine, fine.\u201d That was the fourth message since midnight.","cue":"a thread of lit-up messages arriving on the library table, thumbs on screen","options":["A real feeling: pleasure in the work, and it finishes once the rewrite is done","A stand-in feeling: cheerfulness covering a tired, scared feeling, so no one is asked to share the job"],"answer":1,"why":"Four messages, each one fine, and none of them asks anyone to share the work. A real tired feeling would say I can't do all of this, and then ask. This cheerful one keeps going and leaves the whole job with Ella.","traps":{"0":"Love for the project may be partly true, so it can look like a real feeling. If you took it that way, you would reply with a clap emoji. Ella would be up again tomorrow, and Thursday would find her worn out."},"example":"A volunteer rota, Sunday.<br>Helper: \u201cI love doing the late shift. Love it. I'm fine, don't worry.\u201d She posts it for the third week.<br>Nobody swaps with her, and in March she quits."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cGareth says 'every group, the same, I carry everybody.' Which reading fits, and what would a real version of that anger do?\u201d","cue":"tapping a pen on the library table, looking at Gareth's empty chair","options":["An authentic feeling: anger this strong is real, as long as it is loud enough to be heard","A racket feeling: anger shown in place of a real one. A real version would name one fix and a day.","A racket feeling, because Gareth is a difficult classmate. The feeling itself has nothing to do with it."],"answer":1,"why":"Plain words first: a stand-in that fixes nothing. The books call it a racket feeling, and the test is whether the anger finishes the situation. Gareth's anger repeats every group and asks for nothing. The real version would name one fix and ask for it by a day.","traps":{"0":"Calling it authentic because it is strong takes the volume for the answer. Real anger can be loud and finish, and this can be loud and go round. The carrying would stay exactly as it is.","2":"Blaming Gareth's attitude sends the talk to the person, not the feeling. He would hear that he is the problem, and the anger would stay in charge with nothing asked of anyone."},"example":"A staffroom, Monday.<br>Teacher: \u201cEvery term, the same, I run the trip alone.\u201d<br>Head: \u201cPut your two names for helpers on the sheet by Friday, then.\u201d"}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://vaibhav-labs.github.io/TA/arena/","next":{"slot":"5.2","title":"Collecting Grudges","url":"https://vaibhav-labs.github.io/TA/arena/5-2.html"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: MULTI ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
