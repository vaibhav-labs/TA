<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Friendly Sales Line · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"3.6","setting":"Friends & Community","title":"The Friendly Sales Line","world":3,"worldName":"Back and Forth","week":3,"weekName":"Back and Forth","mechanic":"Two-track","concept":"After this one you can find the sting in a sales line and answer both of its targets from the Pilot.","plainWord":"a sideways sting","bookTerm":"Angular transaction","bookIdea":"An angular transaction involves three ego states. The top message goes Adult to Adult, while the hidden message goes from the salesman's Adult to the buyer's Child, and the Child's reply decides the sale.","bookSource":"Games People Play, ch. 2","opener":{"setting":"Sunday, 14:50, The Corner Table, the back room. Two tables pushed together, with a phone in its box on the cloth and the tea gone cold.","lines":[{"who":"Nadia","text":"\u201cRight. For the exercise, I'm the salesman. This one is better, but you can't afford it.\u201d","cue":"tapping the box, deadpan, the grin not reaching her eyes"}],"ask":"Can you answer from the Pilot at both levels, three times in a row, when the salesman praises the phone and the sting is aimed at you?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> most sales lines here have two targets. The top message goes to your Pilot, and the sting goes to another voice. Tap the voice the sting goes to, or say there is none.","items":[{"type":"pick","who":"Salesman, at the shop counter","text":"\u201cThis one is better, sir. You can't afford it, but it is better.\u201d","cue":"pleasant, polishing the box with his sleeve","options":["The Pilot, the part that checks the facts","The Kid, the part that wants and worries","The Boss, the part that makes the rules"],"answer":1,"why":"The top line is a comparison, and it goes to your Pilot. The sting, you can't afford it, goes past the Pilot to the Kid, who hears it as a dare.","traps":{"0":"The Pilot is where the top line lands, the camera and the screen. The sting is aimed somewhere else, so the Pilot is only half the target.","2":"The Boss would turn it into a rule, such as always save first. The line gives no rule, so the Boss is not where the sting goes."},"example":"A school fundraiser, a parent who says: \u201cThis stall is the better one, but I doubt you can manage a stall like that.\u201d<br>The stall is the top line, and the doubt is aimed at whoever has to pay."},{"type":"pick","who":"Salesman, by the phone in its box","text":"\u201cThis one has the better camera. It costs more each month, and here are both prices.\u201d","cue":"laying two price cards side by side on the counter","options":["Nowhere. It is all facts for the Pilot","The Kid, the part that wants to prove itself","The Boss, the part that makes the rules"],"answer":0,"why":"Both messages are plain facts, and they go to the same voice, your Pilot. With nothing aimed at the Kid there is no second target, so there is no sting. This is an ordinary matched volley waiting for your reply.","traps":{"1":"The Kid would be the target if the line dared you or flattered you. This one only gives facts to compare, so there is nothing for the Kid to hear.","2":"The Boss would be the target if the line gave a rule or a verdict. It gives prices, so there is no rule in it."},"example":"A cinema box office, a clerk who says: \u201cThe front rows are cheaper, the back rows have the better view. Here are both prices.\u201d<br>Facts for the Pilot, and nothing aimed anywhere else."},{"type":"pick","who":"Salesman, at the till","text":"\u201cMost people who ask about the price end up taking the cheap one. You don't seem like most people.\u201d","cue":"leaning on the counter, already smiling","options":["The Boss, the part that makes the rules","The Pilot, the part that is weighing the costs","The Kid, the part that wants to prove itself"],"answer":2,"why":"The first sentence is a remark about what most people do, which looks like a fact for the Pilot. The sting is the second sentence, you are not like most people, and it goes past the Pilot to the Kid, who wants to show it is better than that.","traps":{"0":"The Boss would take a rule or a verdict about what you ought to do. The line gives no rule, only a flattering comparison.","1":"The Pilot is where the first sentence lands. The sting is the second sentence, which asks you to prove you are different, and that goes to the Kid."},"example":"A tailor's shop, an assistant who says: \u201cMost people settle for the ready-made suit. You don't look like most people.\u201d<br>The remark about most people is the top line, and the pride is what the line is reaching for."}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now you answer, and the salesman is pushing hard.<\/b> Each reply has to answer the top line and the sting. Choose the reply that does both from the Pilot.","items":[{"type":"pick","who":"Nadia, the salesman","text":"\u201cThe bigger one is for people who already know what they want. You look like you do.\u201d","cue":"tapping the screen with one finger, pleasant","options":["I know what I want, and I want the price before the screen.","Sure, the bigger one, since I look like I know what I want.","I'm not sure I know what I want, so you choose."],"answer":0,"why":"Your reply owns the want, which answers the top line from the Pilot. Then it asks for the price before the screen, which answers the sting. A compliment cannot sell you a phone once you have asked for the number.","traps":{"1":"That takes the bait. The sting is a compliment about knowing what you want, and this reply proves it by buying the bigger phone, so the Kid is the one who decides.","2":"Handing the choice over is a Kid move, and it makes the salesman the one who knows. The top line stays unanswered and the sting keeps running."},"example":"A cricket club, a coach who says: \u201cThe senior team is for players who already know what they want. You look like you do.\u201d<br>A plain reply is: \u201cI know what I want, and I want the fixtures first.\u201d It answers the compliment with a request."},{"type":"scene","title":"Sunday, 15:05, The Corner Table, the back room","setting":"Nadia is sitting behind a phone in its box, with a price card face down. She has said she is the salesman for the exercise, and she will not take the job seriously unless you do.","meters":{"you":60,"them":50},"beats":[{"who":"Nadia","text":"\u201cThis one is better, you'll see the camera at once. But you can't afford it, not with your rent.\u201d","cue":"turning the box so you see the price, not the phone","lines":[{"text":"\u201cThe camera is better, I can see that. The price is my call, so tell me what the cheaper one costs.\u201d","tag":"best","you":6,"them":4,"outcome":"Nadia turns the box round. \u201cFair. Here's the cheaper one.\u201d The rent comment has nothing left to grip.","why":"You took the camera as a fact you could check and the rent as a comment you could answer, so each target got its own reply from the Pilot."},{"text":"\u201cFine. Show me the cheaper one, then.\u201d","tag":"ok","you":0,"them":0,"outcome":"A second box is slid across. \u201cHere,\u201d she says, not warmly.","why":"You moved on without naming the sting, so the rent comment stays in the room unanswered. Nothing harmful happened, but the Kid still heard it."},{"text":"\u201cYou're right, I can't afford it, so I'll take the big one to prove you wrong.\u201d","tag":"game","you":-8,"them":6,"outcome":"She has the card reader out before you finish. The form is already on the cloth.","why":"You answered the sting from the Kid and bought the phone to win an argument with it. That is a trap, and it ends the scene here."}]},{"who":"Nadia","text":"\u201cMost people in your spot take the bigger one. It's the sensible choice, and the monthly bit is small.\u201d","cue":"sliding a form across the cloth, smiling","lines":[{"text":"\u201cSensible for whom? Write me the monthly amount and the total, and I'll tell you what my month can take.\u201d","tag":"best","you":6,"them":3,"outcome":"She writes both figures on the form and turns it round. \u201cOkay. That's honest.\u201d She does not smile this time.","why":"You asked whose sense it was, and you checked the top line against the numbers. Both targets got an answer from the Pilot."},{"text":"\u201cLet me think about the bigger one.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"The form stays on the cloth, and the pressure sits there and waits.","why":"Thinking is a Pilot move, but you did not say what you were thinking about, so the sting stays on the table with the form."},{"text":"\u201cYou're right, it's hard to say no to nice things. Let's just pick the one you like.\u201d","tag":"game","you":-5,"them":4,"outcome":"She smiles warmly and starts the bigger phone's paperwork. You feel looked after, and the bill is already on its way.","why":"It sounds kind, but you handed the decision to the salesman, so the sting keeps running. The kind tone is the trap, and it ends the scene here."}]},{"who":"Nadia","text":"\u201cYou don't have to decide now. But the offer ends at six, and the one before this one is already sold.\u201d","cue":"glancing at the clock above the tea counter","lines":[{"text":"\u201cThen I'll decide by six, in my own time, with my own figures. You can hold the box till then.\u201d","tag":"best","you":5,"them":1,"outcome":"A sigh first, then \u201cFine, but I'm only holding it.\u201d The deadline is hers, and the choice is still yours.","why":"You set your own deadline and kept the decision with the Pilot. A deadline from the other side only binds you once you accept it."},{"text":"\u201cOkay, I'll think about it.\u201d","tag":"ok","you":-2,"them":0,"outcome":"A card with the offer printed on it is slid across, the ink already fading at the edge.","why":"It is harmless, but it leaves the six o'clock deadline unanswered, so the pressure keeps its shape."},{"text":"\u201cQuick, then. Put the big one on the card before it's gone.\u201d","tag":"game","you":-8,"them":5,"outcome":"The card reader is already out. You are committed before the tea has cooled.","why":"You let the offer's clock make the choice, which is the Kid rushing for the exit. It ends the scene here."}]},{"who":"Nadia","text":"\u201cYou'd look good with it. Everyone at Halden has one already, you'd fit right in.\u201d","cue":"an easy smile, the voice of a friend","lines":[{"text":"\u201cEveryone at Halden might have one, but I'm asking about me. What does it cost me over a year?\u201d","tag":"best","you":7,"them":2,"outcome":"Nadia laughs and does the sum on the back of the form. The total makes her put the pen down. \u201cRight. That's a real year.\u201d","why":"You treated the comparison as other people's business and asked about your own year. The phone stopped being a club you wanted to join."},{"text":"\u201cOkay, maybe I'd fit in.\u201d","tag":"ok","you":-3,"them":3,"outcome":"Pleased with the point, Nadia nods. \u201cExactly. So the bigger one.\u201d","why":"You accepted being fitted into the crowd. It is harmless, but it gives her the point she came for."}]},{"who":"Nadia","text":"\u201cI'm only trying to help you here. People get stuck on the small things, that's all.\u201d","cue":"a hand on the box, eyes soft","lines":[{"text":"\u201cI know you're trying to help, and I still want the total before I decide. Can you write it down?\u201d","tag":"best","you":6,"them":4,"outcome":"She writes it in neat figures and turns the form round. \u201cThere. Happy?\u201d The soft voice has nothing left to pull at.","why":"You thanked the help and kept your own request. A kind tone does not change the numbers, so you asked for the numbers."},{"text":"\u201cThanks. I'll think on it.\u201d","tag":"ok","you":-2,"them":1,"outcome":"The form is tucked under the box with a nod. The pressure is folded up and waiting.","why":"Polite and harmless, but the total is still missing, so the help is still doing the choosing in the back of your head."},{"text":"\u201cThen help me. Just put the bigger one on the card.\u201d","tag":"game","you":-9,"them":5,"outcome":"The card goes through with a beep. The scene is over before the tea is finished.","why":"You handed over the decision in the same breath as asking for help. That is a trap move, and it ends the scene here."}]},{"who":"Nadia","text":"\u201cSo. Do you want the better one, or the one you can afford?\u201d","cue":"pen over the form, a little tired now","lines":[{"text":"\u201cNeither, yet. I'll take the cheaper one with the review I read, and I'll tell you on Monday.\u201d","tag":"best","you":8,"them":3,"outcome":"A sigh, then a smile. \u201cFair enough. Ring me on Monday.\u201d The cheaper box goes into a bag.","why":"You turned down both of the choices she offered and kept your own, which is answering from the Pilot. You named the phone, the review and the day, so the sting had nothing to hold."},{"text":"\u201cThe cheaper one, please.\u201d","tag":"ok","you":4,"them":-1,"outcome":"The cheaper one is rung up without a word. You leave with the box under your arm and a small sting left on the cloth.","why":"Choosing the cheaper one is sound, but you did not say why, so the sting got the last word."}]}],"payoff":"The card reader beeps. You go home with a phone you cannot afford, and the first bill is already on its way.","fallout":{"them":"Nadia pushes the box aside. \u201cLet's stop there. Come back when you want to talk about the camera.\u201d","you":"You go quiet and let her fill in the form. The exercise ends with the paperwork half done."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"<b>Read the sale back.<\/b> Two questions about the salesman's line and your reply.","items":[{"type":"pick","who":"Nadia, after the role-play","text":"\u201cThis one is better, but you can't afford it. Which kind of line is that?\u201d","cue":"setting the box down, pen capped","options":["Double-talk aimed at two different voices in you","A cut, where the reply comes from another voice","A matched volley, where both messages go to the same voice"],"answer":0,"why":"The top line is about the phone and goes to your Pilot. The sting, you can't afford it, goes past the Pilot to the Kid. Two targets in one sentence means the Kid is the one that gets hit, and that is the one that decides what you buy.","traps":{"1":"A cut would need the reply to come from a different voice than the one spoken to. The line itself has two targets, so a cut is what you might do afterwards, not what the salesman did.","2":"A matched volley would send both messages to one voice. This line splits between the Pilot and the Kid, so the matched volley does not fit."},"example":"A housing society meeting, a member who says: \u201cThe new gym is the better one, but I doubt you can manage the fees.\u201d<br>The gym is the top line, and the fees are the sting for whoever is in the room."},{"type":"pick","who":"Nadia, with the price card face down","text":"\u201cCount the voices in the salesman's line. Then think back to the barn chat, where both people had a second chat going. How many voices are in play here?\u201d","cue":"holding up three fingers, then four","options":["Four: both Pilots on top and both Kids underneath","Three: his Pilot and your Pilot on top, and your Kid underneath","Two: his Pilot and your Pilot, since the sting is never said out loud"],"answer":1,"why":"The salesman speaks only as the Pilot, so he supplies one voice. On top his Pilot talks to your Pilot, and underneath the same line is aimed at your Kid. That is three voices, and the sale is made by the third one, whose answer is taken at face value as a sensible purchase. In the barn both people had a Kid chat going, which made four.","traps":{"0":"Four voices means both sides have a hidden chat, as in the barn. The salesman is only working your Kid, so there is no Kid chat on his side, and the count is three.","2":"Not being said out loud does not remove the sting. It still reaches your Kid, which is why the third voice answers and the sale goes through."},"example":"A market stall, a trader who says: \u201cThis rug is better, but I wouldn't suggest it to everyone.\u201d<br>His Pilot and yours handle the rug. The flattery goes to your Kid. Three voices, with the sale decided by the third."}]}],"debrief":{"nadia":"I was the salesman today, and I said so, which is the difference between a role and a trap. The top lines gave you facts and compliments, and the stings went to the part of you that wants to show it is as good as anyone. The replies that worked named the phone and asked for the number, and they kept the decision with you.","bookTerm":"Angular transaction","bookNote":"The books call this an angular transaction: three ego states are at work. In Berne's sales example the salesman's Adult speaks to the buyer's Adult on the surface and aims the real message at her Child. The reply is taken at face value as an Adult purchase, so the transaction is complementary at both levels."},"reflection":{"prompt":"Think of a deal, a price or an offer this week that came with a sting. Which part of you did the sting go to, and what did you say that answered both parts?"},"next":"4.1","baseStory":{"setting":"Friends & Community","blurb":"At a Sunday group, Nadia plays a salesman who praises a phone while hinting you cannot afford it."},"moreStories":[{"setting":"Relationships","blurb":"A second date at a pottery class, a seller with a clipboard, and Clara waiting to see what you say.","opener":{"setting":"Friday, 19:10, the Clay Room, a unit behind the station. Wheels in rows, one lamp on, and grey slip drying on Clara's sleeve.","lines":[{"who":"Clara","text":"\u201cOmar says Thursdays here changed his life. He also said that about a toaster.\u201d","cue":"wiping her hands on her jeans, checking your face to see if the joke landed"},{"who":"Dennis","text":"\u201cLovely to see a pair in on a Friday. Most people only come when it's raining.\u201d","cue":"sliding a clipboard across, pen already uncapped"}],"ask":"Can you answer from the Pilot at both levels, three times in a row, when Dennis praises the course and the sting is aimed at the two of you?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> most sales lines here have two targets. The top message goes to your Pilot, and the sting goes to another voice. Tap the voice the sting goes to, or say there is none.","items":[{"type":"pick","who":"Dennis, at the clipboard","text":"\u201cThe twelve-week course is the better one. A lot of couples don't have the staying power, mind.\u201d","cue":"tapping the clipboard, pleasant, not looking at either of you","options":["The Boss, the part that makes the rules","The Pilot, the part that checks the facts","The Kid, the part that wants and worries"],"answer":2,"why":"The top line compares two courses, and it goes to your Pilot. The sting is the staying power remark, which goes past the Pilot to the Kid, who hears a dare to prove this pair is not like those couples.","traps":{"0":"The Boss would turn it into a rule, such as always finish what you start. Dennis gives no rule, only a hint about other couples.","1":"The Pilot is where the comparison lands. The staying power remark is aimed elsewhere, so the Pilot is only half the target."},"example":"A badminton club, a coach who says: \u201cThe league is the better option. Some players don't have the legs for it, mind.\u201d<br>The league is the top line, and the legs are the dig for whoever is listening."},{"type":"pick","who":"Dennis, with the timetable","text":"\u201cThe twelve weeks run Thursdays, 19:00 to 21:00. The deposit is forty, and the refund rule is on this sheet.\u201d","cue":"sliding a printed sheet across the slip-spattered table","options":["Nowhere. It is all facts for the Pilot","The Kid, the part that wants and worries","The Boss, the part that makes the rules"],"answer":0,"why":"Every part of it is checkable: a day, two times, a deposit and a rule in writing. It all goes to one voice, your Pilot, and nothing is aimed past it. With no second target there is no sting.","traps":{"1":"The Kid would be the target if the line dared you or flattered you. This one hands over a timetable, so there is nothing for the Kid to hear.","2":"The Boss would be the target if the line gave a rule about what you ought to do. The only rule here is the refund rule, and that is a fact on a sheet."},"example":"A swimming pool desk, a clerk who says: \u201cLessons are Saturdays, 09:00 to 10:00. The fee is twenty-two, and the cancellation terms are on the card.\u201d<br>Facts for the Pilot, and nothing aimed anywhere else."},{"type":"pick","who":"Dennis, leaning on the shelf of bowls","text":"\u201cPairs who are serious book the twelve weeks. The casual ones just do the taster. Which are you?\u201d","cue":"a smile that has done this a hundred Fridays","options":["The Boss, the part that makes the rules","The Kid, the part that wants and worries","The Pilot, the part that checks the facts"],"answer":1,"why":"The first sentence looks like a remark about pairs in general, which the Pilot could check. The sting is the question at the end, which goes past the Pilot to the Kid, who wants to show it is the serious sort and not the casual one.","traps":{"0":"The Boss would take a rule or a verdict on how couples ought to behave. Dennis gives a label to live up to, which is a different push.","2":"The Pilot is where the first sentence lands, if anywhere. The question is the sting, and it asks the Kid to prove something."},"example":"A garden centre, a salesman who says: \u201cKeen gardeners take the big greenhouse. The hobby ones stay with the small. Which are you?\u201d<br>The greenhouses are the top line, and the pride is what he is reaching for."}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now you answer, and the seller is pushing hard.<\/b> Each reply has to answer the top line and the sting. Choose the reply that does both from the Pilot.","items":[{"type":"pick","who":"Dennis","text":"\u201cThe couples' bench is for people who already know where this is going. You two look like you do.\u201d","cue":"patting the double stool between the wheels, easy","options":["Yes, we do. Put us down for the pair of places and I'll sort the deposit tonight.","We know where we'd like to sit tonight. Where this is going is ours to say, so what is the refund rule?","We'd better not say. Clara, what do you think? You decide, I'll go with it."],"answer":1,"why":"Your reply owns the evening and keeps the bigger question for the two of you, which answers the top line from the Pilot. Then it asks for the refund rule, which answers the sting. A guess about your future cannot sell you a bench once you have asked for the terms.","traps":{"0":"That takes the bait. The sting is a flattering guess at where this is heading, and this reply proves him right by paying the deposit, so the Kid decides.","2":"Handing the answer to Clara looks polite and leaves the guess standing. The top line stays unanswered, and Clara is left to carry a choice she did not ask for."},"example":"A tennis club, a coach who says: \u201cThe doubles ladder is for pairs who already know they're in it for the long run. You two look like it.\u201d<br>A plain reply is: \u201cWe know we like Tuesdays. What does the ladder cost?\u201d It answers the guess with a question."},{"type":"scene","title":"Friday, 19:25, the Clay Room","setting":"Dennis has pulled up a stool and put the form between the two wheels. Clara has gone quiet and wet-handed beside you, and she will not look at the clipboard unless you do.","meters":{"you":60,"them":50},"beats":[{"who":"Dennis","text":"\u201cThis one is the better course, you'll feel it by week three. But the practice pieces are hard going if you've never thrown a pot, and I'd hate you to be put off.\u201d","cue":"turning the clipboard so the price is facing you","lines":[{"text":"\u201cThe pieces sound useful, and whether I'm put off is mine to say. Show me what week three asks for and what the deposit is.\u201d","tag":"best","you":6,"them":4,"outcome":"Dennis finds the week-by-week page and flattens it with his palm. \u201cFair. Here you go.\u201d The hard-going remark has nothing left to push on.","why":"You took the course as a fact you could check and the doubt as a comment you could answer, so each target got its own reply from the Pilot."},{"text":"\u201cFine. What's the deposit, then?\u201d","tag":"ok","you":0,"them":0,"outcome":"A number comes back: forty. Dennis nods, a little cooler than before.","why":"You moved on without naming the dig, so the put-off remark stays in the room unanswered. Nothing harmful happened, but the Kid still heard it."},{"text":"\u201cYou're right, I'd be rubbish. So I'll put the deposit down and prove I'm not.\u201d","tag":"game","you":-8,"them":6,"outcome":"The form is already under your hand and the pen is in it. Clara's eyebrows go up, and Dennis does not stop smiling.","why":"You answered the sting from the Kid and bought the course to win an argument with a stranger. That is a trap, and it ends the scene here."}]},{"who":"Dennis","text":"\u201cMost couples who come in on a Friday book on the night. It's the sensible thing, and forty is hardly anything between two.\u201d","cue":"sliding the form across, pen on top","lines":[{"text":"\u201cSensible for whom? Write the whole twelve weeks down, deposit and balance, and we'll say what our month can take.\u201d","tag":"best","you":6,"them":3,"outcome":"He writes the total in neat digits and turns it round. \u201cThat's honest, I'll say that.\u201d He does not smile this time.","why":"You asked whose sense it was and checked the top line against the total. Both targets got an answer from the Pilot."},{"text":"\u201cLet us think about it for a minute.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"The form stays between the wheels, and the pressure sits there and waits.","why":"Thinking is a Pilot move, but you did not say what you would be thinking about, so the sting stays on the table with the form."},{"text":"\u201cYou're right, it's hard to say no on a night like this. Whatever you think is best.\u201d","tag":"game","you":-5,"them":4,"outcome":"He is warm at once and has the receipt book out. You feel looked after, and the deposit is already half-written.","why":"It sounds kind, but you handed the decision to the seller, so the sting keeps running. The kind tone is the trap, and it ends the scene here."}]},{"who":"Dennis","text":"\u201cI can hold today's price till nine. After that the Thursday group fills, and the couple before you took the last two places on the early shift.\u201d","cue":"glancing at the clock over the kiln","lines":[{"text":"\u201cThen we'll decide by nine on our own figures. Keep the form here, and if we haven't come back, give the places away.\u201d","tag":"best","you":5,"them":1,"outcome":"A sigh first, then \u201cFine, but I'm only holding the form.\u201d The deadline is his, and the choice is still yours.","why":"You set your own deadline and kept the decision with the Pilot. A deadline from the other side only binds you once you accept it."},{"text":"\u201cOkay, we'll think about it.\u201d","tag":"ok","you":-2,"them":0,"outcome":"A leaflet with the offer printed on it is pushed across, the ink already smudged at one corner.","why":"It is harmless, but it leaves the nine o'clock deadline unanswered, so the pressure keeps its shape."},{"text":"\u201cQuick, then. Put the pair of places down before they go.\u201d","tag":"game","you":-8,"them":5,"outcome":"The pen is in your hand and the receipt book is open. You are committed before Clara has finished drying her fingers.","why":"You let the deadline make the choice, which is the Kid rushing for the exit. It ends the scene here."}]},{"who":"Dennis","text":"\u201cLook at that bowl she's made. A natural. You two would d","cue":"hands in her sleeves, slip still grey at the cuffs","options":["A cut, where the reply comes from another voice","A matched volley, where both messages go to the same voice","Double-talk aimed at two different voices in you"],"answer":2,"why":"The top line is about the course and goes to your Pilot. The sting, a lot of couples don't have the staying power, goes past the Pilot to the Kid. Two targets in one sentence means the Kid is the one that gets hit, and the Kid is the one that decides what you book.","traps":{"0":"A cut would need the reply to come from a different voice than the one spoken to. The line itself has two targets, so a cut is what you might do afterwards, not what Dennis did.","1":"A matched volley would send both messages to one voice. This line splits between the Pilot and the Kid, so a matched volley does not fit."},"example":"A book club, a member who says: \u201cThe long novel is the better pick, but a lot of us never get to the end.\u201d<br>The novel is the top line, and the dig is for whoever wants to prove they can finish."},{"type":"pick","who":"Clara, at the platform edge","text":"\u201cCount the voices in Dennis's line. If both people had a second chat running underneath, that would be four. How many are in play here?\u201d","cue":"holding up three fingers, then four","options":["Three: his Pilot and your Pilot on top, and your Kid underneath","Four: both Pilots on top and both Kids underneath","Two: his Pilot and your Pilot, since the dig is never said out loud"],"answer":0,"why":"Dennis speaks only as the Pilot, so he supplies one voice. On top his Pilot talks to your Pilot, and underneath the same line is aimed at your Kid. That is three voices, and the sale is made by the third one, whose answer is taken at face value as a sensible booking.","traps":{"1":"Four voices would mean both sides have a hidden chat. Dennis is only working your Kid, so there is no Kid chat on his side, and the count is three.","2":"Not being said o
