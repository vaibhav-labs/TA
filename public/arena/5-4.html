<script>window.TA_GAME = {"slot":"5.4","title":"Doing Nothing","world":5,"worldName":"Underneath","week":5,"weekName":"Underneath","mechanic":"Diagnose","concept":"After this one you can name which of the four ways of not solving a problem someone is using, even when their words say yes.","plainWord":"the four ways of not solving a problem","bookTerm":"Passivity","bookIdea":"Passivity is acting in ways that do not solve the problem in front of you, and it comes in four forms: doing nothing, overadaptation, agitation, and incapacitation or violence.","bookSource":"TA Today, ch. 17; Scripts People Live, ch. 9","opener":{"setting":"Tuesday, 11:20am. Halden, by the station, the third-floor room with the glass wall. The release call has been running for twenty minutes.","lines":[{"who":"Daniel","text":"\u201cSo who takes the Friday release? Somebody has to own it.\u201d","cue":"arms folded, looking round the table"},{"who":"Omar","text":"\u201cHm.\u201d","cue":"eyes on his laptop, one hand on the mouse"},{"who":"Clara","text":"\u201cI can, I think. Yes. Whatever you need.\u201d","cue":"already writing her name on the board"}],"ask":"Which of the four ways of not solving a problem is each person in the room using, and which one looks like help?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each person in this room is dodging the problem in one way or another. Tap the way that fits what they do with their body and their hands, not only their words.","items":[{"type":"pick","who":"Omar","text":"<i>Daniel asks him why the build broke. Omar looks at the screen, the cursor blinks, and he keeps his hands flat on the desk. Nothing comes out for eight seconds.<\/i>","cue":"Tuesday, 11:24am, the glass room","options":["Do nothing","Fidget","Break down or lash out"],"answer":0,"why":"He stops. No words, no moving the hands, nothing on the screen changes. The pause is complete, and that is doing nothing, the plainest of the four ways of not solving a problem.","traps":{"1":"A fidget would show small restless moves, like tapping or shuffling papers. Omar's hands are flat and still, so the picture is stillness, not restlessness.","2":"Breaking down or lashing out would show distress or a flash of temper, a shaking voice or a hard word. Nothing in the clip is upset, only silent."},"example":"A school assembly, Monday. The head teacher asks which pupil broke the hall window. The class stares at the stage, nobody speaks, and the silence lasts until the bell."},{"type":"pick","who":"Clara","text":"<i>Daniel says the Friday release needs one more person on the rota. Clara says \u201cYes, of course, whatever you need,\u201d and adds her name to the board. Her own task list on the other screen has eleven open items. She does not look at it.<\/i>","cue":"Tuesday, 11:31am, the whiteboard","options":["Over-comply","Do nothing","Fidget"],"answer":0,"why":"She says yes before she has checked her own load, and the yes is for Daniel's need, not hers. She has handed the choice to whoever is asking, which is over-complying. It looks like a team player, and it still means nobody chose.","traps":{"1":"Doing nothing would be silence. Clara speaks at once and writes her name, so she is not stuck. The problem is what she says yes to.","2":"A fidget would be busy moves that go nowhere. She makes one clear move, the name on the board, and that move is the yes."},"example":"A family group chat, Sunday. Your aunt asks who will have everyone over for the holiday weekend this year. You reply \u201cI can, whatever's easiest for everyone,\u201d and you spend the next week cooking for forty people.<br>Your flat is still full of boxes, and nobody asked you about that part."},{"type":"pick","who":"Omar","text":"<i>He picks up his tea and puts it down. He opens a second tab, then a third, and closes the first. He says \u201cLet me just check a few things,\u201d and checks nothing for twelve minutes. The call goes on around him.<\/i>","cue":"Tuesday, 11:42am, the desk by the window","options":["Fidget","Over-comply","Do nothing"],"answer":0,"why":"Every move is small and busy, and none of them decides anything. Tabs open and close, the tea moves, and the checking never starts. That restless motion without a result is a fidget, the way of looking busy instead of solving anything.","traps":{"1":"Over-complying would show a yes to someone else's request. Omar is not agreeing to anything. He is shuffling around the decision he is avoiding.","2":"Doing nothing would be stillness. Omar's hands and eyes never stop moving, so the stillness is not there."},"example":"A bus stop, Thursday, 8:15am. A man checks his phone, reads the same notice twice, takes his keys out and puts them back, and the bus leaves without him."}]},{"level":"Play","label":"Play, the week in motion","intro":"These are harder. Each person's words and body point in different directions. Look at what the person does next, not at the first thing they say.","items":[{"type":"pick","who":"Clara","text":"<i>After the call, Daniel asks if she can also cover the client email. She says \u201cSure, I'll look at it,\u201d and nods. Her shoulders drop, and she turns to the screen, but the email stays unopened for the rest of the morning.<\/i>","cue":"Tuesday, 12:05pm, the desk, a slow nod","options":["Over-comply","Do nothing","Fidget","Break down or lash out"],"answer":1,"why":"The words sound like a yes, but nothing follows the yes. The email never opens, and her whole body has stopped. The words are a reflex that ends the question, and the stopping is what the clip shows. That is doing nothing, with a yes laid over the top.","traps":{"0":"Over-complying is the trap here, because the nod and the words look like a helpful team member. But she has not taken the email on. The email is still unopened, so she has agreed in words only.","2":"A fidget needs busy motion. Her screen is open, but she is not moving anything on it, so there is no restless movement to point to.","3":"Breaking down or lashing out would be distress or a flare of temper. She is calm and composed. The problem is that she has stopped, not that she has broken."},"example":"A school open evening, Thursday. The teacher asks if you can come back on Monday for a longer talk. You say \u201cSure, Monday's fine,\u201d and then you sit in the car for twenty minutes, not starting the engine."},{"type":"pick","who":"Daniel","text":"<i>Clara tries to explain the failing release for the third time. Daniel says \u201cRight. Let's be clear, we need a plan,\u201d and taps the table twice. He looks at her, then at the window, then at his phone. He has asked nothing and decided nothing.<\/i>","cue":"Wednesday, 3:18pm, the glass room, a sigh","options":["Fidget","Break down or lash out","Over-comply","Do nothing"],"answer":0,"why":"Daniel is never still. He taps, looks, shifts and checks his phone, and he never picks a next step. The restless moves look like management, but they are a fidget, a busy way of not deciding. The clue is that the room ends with nothing done.","traps":{"1":"Breaking down or lashing out would need distress or a flash of temper. Daniel is level and tidy, so nothing breaks and nothing blows up.","2":"Over-complying would be agreeing to whatever Clara needs. Daniel is not agreeing to anything, he is pressing on the table.","3":"Doing nothing would be stillness. Daniel moves the whole time, and that movement is the thing the clip shows."},"example":"A school bake sale, Friday. The organiser keeps checking the cash tin, rearranging the cake table, and asking if anyone has seen the float. No one is asked to do anything, and the money is still on the table at the end."},{"type":"pick","who":"Clara","text":"<i>Daniel's tapping goes on while she starts the explanation a fourth time. Her voice goes thin. She says \u201cI can't do this,\u201d shuts the laptop hard, says \u201cFine, you all sort it, then,\u201d and walks out with the door left open behind her.<\/i>","cue":"Wednesday, 3:40pm, the glass room, the laptop lid slammed","options":["Fidget","Break down or lash out","Do nothing","Over-comply"],"answer":1,"why":"Her words say she is unable, and the slam and the exit hand the mess to everyone else. The failing release has not moved an inch. Breaking down and lashing out are both ways of leaving the problem unsolved, and both are loud.","traps":{"0":"A fidget is small busy moves that fill the time. Clara makes one big move that stops the meeting, so there is nothing small and restless to point to.","2":"Doing nothing would be stillness and silence. Clara is fast and loud, and the sound of the lid is what the room remembers.","3":"Over-complying would be a yes to Daniel. Clara says the opposite and leaves, so there is nobody she is agreeing with."},"example":"A school staff meeting, Thursday. The head raises the timetable for the third time. A teacher says \u201cI can't do this,\u201d drops her folder on the table, and says \u201cFine, you sort it, then.\u201d The timetable is still wrong at the next meeting."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. You can use the book words now.","items":[{"type":"pick","who":"Nadia","text":"\u201cClara said yes, whatever you need, and nothing else changed. Why is that passivity, and not a real yes?\u201d","cue":"turning her cup, not looking up","options":["She handed the choice to the person asking, so no decision was made. That is overadaptation, a passive behaviour that looks like cooperation.","She agreed quickly, so she is being efficient. Speed is never passive.","She said yes because she is tired and needs a holiday. Tiredness is the whole problem, so passivity doesn't apply."],"answer":0,"why":"A real yes names what you will do and what you won't. Clara's yes names nothing, so Daniel's need decided the answer and her own load never got a say. Overadaptation is one of the four passive behaviours, and it passes for help while the problem stays unsolved.","traps":{"1":"Speed would look efficient, and that is why it fools people. But a fast yes that checks nothing is still a yes handed away, so the speed is not the measure.","2":"Tiredness would be a fair reason to decline. But the clip is about the yes itself, and tiredness does not explain why the yes was given to someone else."},"example":"A flat-share meeting, Sunday. Sam says \u201cSure, I'll sort the bins, whatever suits everyone.\u201d Nobody writes it down, the bins stay full all week, and the other two flatmates decide it must be fine.<br>A real yes would be \u201cI'll do the bins on Tuesday, and Maya takes Thursday.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cOf the passive behaviours in this room, which one is easiest for an office to mistake for being helpful?\u201d","cue":"pen in hand, waiting","options":["Overadaptation, because it looks like team spirit while the person has stopped choosing.","Doing nothing, because a silent person looks calm and in control.","Agitation, because a busy person looks like they are making progress."],"answer":0,"why":"Overadaptation looks like the most generous of the four, since it says yes to everyone and nobody argues. But the person has given their choice away, and the other person's need now runs the day. That is passivity dressed as a team player.","traps":{"1":"Doing nothing is easy to spot as stuck, because the silence is visible and awkward. People see it and step in, so it rarely passes for help.","2":"Agitation can look productive, and that is a real trap. But a busy person with no result is easier to notice than a person who has agreed to everything."},"example":"An office retro, Friday, 4:30pm. Everyone agrees to every action item, and the list reads well. Two weeks later, nothing on it is done, and the people who said yes are the ones who are most tired."}]}],"debrief":{"nadia":"Four ways of not solving a problem turned up in one room, and Clara's yes was the one that looked best. Watch for the yes that gives the decision away, because it is the hardest of the four to see.","bookTerm":"Passivity","bookNote":"The books call this passivity: behaviour that does not solve the problem in front of you. It has four forms, doing nothing, overadaptation, agitation, and incapacitation or violence."},"reflection":{"prompt":"Where did you say yes this week without choosing it, or go quiet instead of deciding, and what would the first real choice have been?"},"next":"5.5"};</script>
<script>window.TA_NAV = {"hub":"https://vaibhav-labs.github.io/TA/arena/","next":{"slot":"5.5","title":"Two Halves","url":"https://vaibhav-labs.github.io/TA/arena/5-5.html"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  var ITEMS = [];
  ((GAME && GAME.rounds) || []).forEach(function (round) {
    (round.items || []).forEach(function (item, i) {
      ITEMS.push({ round: round, item: item, first: i === 0 });
    });
  });
  var TOTAL = ITEMS.length;

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else state.screen = "debrief";
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = GAME.opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (GAME.rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">TA Arena · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no">' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →");
    bindNext(advance);
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">✓ Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">✗ Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">✓ Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">✗ Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "✓ Right call" : "✗ Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function renderEnd() {
    var hub = safeUrl(NAV.hub);
    var nxt = NAV.next || null;
    var links = hub ? '<a class="next" href="' + esc(hub) + '">All games</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      '<div class="nextbar end-nav">' + links + '</div>';
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "TA Arena";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = 'TA Arena <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var hub = safeUrl(NAV.hub);
    if (hub) {
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'/TA/arena/'}).catch(function(){});});}</script>
</body>
</html>
