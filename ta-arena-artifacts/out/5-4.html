<script>window.TA_GAME = {"slot":"5.4","setting":"Work","title":"Four Ways to Do Nothing","world":5,"worldName":"Under the Surface","week":5,"weekName":"Under the Surface","mechanic":"Diagnose","concept":"After this one you can name which of the four ways of not solving a problem someone is using, even when their words say yes.","plainWord":"the four ways of not solving a problem","bookTerm":"Passivity","bookIdea":"Passivity is acting in ways that do not solve the problem in front of you, and it comes in four forms: doing nothing, overadaptation, agitation, and incapacitation or violence.","bookSource":"TA Today, ch. 17; Scripts People Live, ch. 9","opener":{"setting":"Tuesday, 11:20am. Halden, by the station, the third-floor room with the glass wall. The release call has been running for twenty minutes.","lines":[{"who":"Daniel","text":"\u201cSo who takes the Friday release? Somebody has to own it.\u201d","cue":"arms folded, looking round the table"},{"who":"Omar","text":"\u201cHm.\u201d","cue":"eyes on his laptop, one hand on the mouse"},{"who":"Clara","text":"\u201cI can, I think. Yes. Whatever you need.\u201d","cue":"already writing her name on the board"}],"ask":"Which of the four ways of not solving a problem is each person in the room using, and which one looks like help?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each person in this room is dodging the problem in one way or another. Tap the way that fits what they do with their body and their hands, not only their words.","items":[{"type":"pick","who":"Omar","text":"<i>Daniel asks him why the build broke. Omar looks at the screen, the cursor blinks, and he keeps his hands flat on the desk. Nothing comes out for eight seconds.<\/i>","cue":"Tuesday, 11:24am, the glass room","options":["Do nothing","Fidget","Break down or lash out"],"answer":0,"why":"He stops. No words, no moving the hands, nothing on the screen changes. The pause is complete, and that is doing nothing, the plainest of the four ways of not solving a problem.","traps":{"1":"A fidget would show small restless moves, like tapping or shuffling papers. Omar's hands are flat and still, so the picture is stillness, not restlessness.","2":"Breaking down or lashing out would show distress or a flash of temper, a shaking voice or a hard word. Nothing in the clip is upset, only silent."},"example":"A school assembly, Monday. The head teacher asks which pupil broke the hall window. The class stares at the stage, nobody speaks, and the silence lasts until the bell."},{"type":"pick","who":"Clara","text":"<i>Daniel says the Friday release needs one more person on the rota. Clara says \u201cYes, of course, whatever you need,\u201d and adds her name to the board. Her own task list on the other screen has eleven open items. She does not look at it.<\/i>","cue":"Tuesday, 11:31am, the whiteboard","options":["Over-comply","Do nothing","Fidget"],"answer":0,"why":"She says yes before she has checked her own load, and the yes is for Daniel's need, not hers. She has handed the choice to whoever is asking, which is over-complying. It looks like a team player, and it still means nobody chose.","traps":{"1":"Doing nothing would be silence. Clara speaks at once and writes her name, so she is not stuck. The problem is what she says yes to.","2":"A fidget would be busy moves that go nowhere. She makes one clear move, the name on the board, and that move is the yes."},"example":"A family group chat, Sunday. Your aunt asks who will have everyone over for the holiday weekend this year. You reply \u201cI can, whatever's easiest for everyone,\u201d and you spend the next week cooking for forty people.<br>Your flat is still full of boxes, and nobody asked you about that part."},{"type":"pick","who":"Omar","text":"<i>He picks up his tea and puts it down. He opens a second tab, then a third, and closes the first. He says \u201cLet me just check a few things,\u201d and checks nothing for twelve minutes. The call goes on around him.<\/i>","cue":"Tuesday, 11:42am, the desk by the window","options":["Fidget","Over-comply","Do nothing"],"answer":0,"why":"Every move is small and busy, and none of them decides anything. Tabs open and close, the tea moves, and the checking never starts. That restless motion without a result is a fidget, the way of looking busy instead of solving anything.","traps":{"1":"Over-complying would show a yes to someone else's request. Omar is not agreeing to anything. He is shuffling around the decision he is avoiding.","2":"Doing nothing would be stillness. Omar's hands and eyes never stop moving, so the stillness is not there."},"example":"A bus stop, Thursday, 8:15am. A man checks his phone, reads the same notice twice, takes his keys out and puts them back, and the bus leaves without him."}]},{"level":"Play","label":"Play, the week in motion","intro":"These are harder. Each person's words and body point in different directions. Look at what the person does next, not at the first thing they say.","items":[{"type":"pick","who":"Clara","text":"<i>After the call, Daniel asks if she can also cover the client email. She says \u201cSure, I'll look at it,\u201d and nods. Her shoulders drop, and she turns to the screen, but the email stays unopened for the rest of the morning.<\/i>","cue":"Tuesday, 12:05pm, the desk, a slow nod","options":["Over-comply","Do nothing","Fidget","Break down or lash out"],"answer":1,"why":"The words sound like a yes, but nothing follows the yes. The email never opens, and her whole body has stopped. The words are a reflex that ends the question, and the stopping is what the clip shows. That is doing nothing, with a yes laid over the top.","traps":{"0":"Over-complying is the trap here, because the nod and the words look like a helpful team member. But she has not taken the email on. The email is still unopened, so she has agreed in words only.","2":"A fidget needs busy motion. Her screen is open, but she is not moving anything on it, so there is no restless movement to point to.","3":"Breaking down or lashing out would be distress or a flare of temper. She is calm and composed. The problem is that she has stopped, not that she has broken."},"example":"A school open evening, Thursday. The teacher asks if you can come back on Monday for a longer talk. You say \u201cSure, Monday's fine,\u201d and then you sit in the car for twenty minutes, not starting the engine."},{"type":"pick","who":"Daniel","text":"<i>Clara tries to explain the failing release for the third time. Daniel says \u201cRight. Let's be clear, we need a plan,\u201d and taps the table twice. He looks at her, then at the window, then at his phone. He has asked nothing and decided nothing.<\/i>","cue":"Wednesday, 3:18pm, the glass room, a sigh","options":["Fidget","Break down or lash out","Over-comply","Do nothing"],"answer":0,"why":"Daniel is never still. He taps, looks, shifts and checks his phone, and he never picks a next step. The restless moves look like management, but they are a fidget, a busy way of not deciding. The clue is that the room ends with nothing done.","traps":{"1":"Breaking down or lashing out would need distress or a flash of temper. Daniel is level and tidy, so nothing breaks and nothing blows up.","2":"Over-complying would be agreeing to whatever Clara needs. Daniel is not agreeing to anything, he is pressing on the table.","3":"Doing nothing would be stillness. Daniel moves the whole time, and that movement is the thing the clip shows."},"example":"A school bake sale, Friday. The organiser keeps checking the cash tin, rearranging the cake table, and asking if anyone has seen the float. No one is asked to do anything, and the money is still on the table at the end."},{"type":"pick","who":"Clara","text":"<i>Daniel's tapping goes on while she starts the explanation a fourth time. Her voice goes thin. She says \u201cI can't do this,\u201d shuts the laptop hard, says \u201cFine, you all sort it, then,\u201d and walks out with the door left open behind her.<\/i>","cue":"Wednesday, 3:40pm, the glass room, the laptop lid slammed","options":["Fidget","Break down or lash out","Do nothing","Over-comply"],"answer":1,"why":"Her words say she is unable, and the slam and the exit hand the mess to everyone else. The failing release has not moved an inch. Breaking down and lashing out are both ways of leaving the problem unsolved, and both are loud.","traps":{"0":"A fidget is small busy moves that fill the time. Clara makes one big move that stops the meeting, so there is nothing small and restless to point to.","2":"Doing nothing would be stillness and silence. Clara is fast and loud, and the sound of the lid is what the room remembers.","3":"Over-complying would be a yes to Daniel. Clara says the opposite and leaves, so there is nobody she is agreeing with."},"example":"A school staff meeting, Thursday. The head raises the timetable for the third time. A teacher says \u201cI can't do this,\u201d drops her folder on the table, and says \u201cFine, you sort it, then.\u201d The timetable is still wrong at the next meeting."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. You can use the book words now.","items":[{"type":"pick","who":"Nadia","text":"\u201cClara said yes, whatever you need, and nothing else changed. Why is that passivity, and not a real yes?\u201d","cue":"turning her cup, not looking up","options":["She handed the choice to the person asking, so no decision was made. That is overadaptation, a passive behaviour that looks like cooperation.","She agreed quickly, so she is being efficient. Speed is never passive.","She said yes because she is tired and needs a holiday. Tiredness is the whole problem, so passivity doesn't apply."],"answer":0,"why":"A real yes names what you will do and what you won't. Clara's yes names nothing, so Daniel's need decided the answer and her own load never got a say. Overadaptation is one of the four passive behaviours, and it passes for help while the problem stays unsolved.","traps":{"1":"Speed would look efficient, and that is why it fools people. But a fast yes that checks nothing is still a yes handed away, so the speed is not the measure.","2":"Tiredness would be a fair reason to decline. But the clip is about the yes itself, and tiredness does not explain why the yes was given to someone else."},"example":"A flat-share meeting, Sunday. Sam says \u201cSure, I'll sort the bins, whatever suits everyone.\u201d Nobody writes it down, the bins stay full all week, and the other two flatmates decide it must be fine.<br>A real yes would be \u201cI'll do the bins on Tuesday, and Maya takes Thursday.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cOf the passive behaviours in this room, which one is easiest for an office to mistake for being helpful?\u201d","cue":"pen in hand, waiting","options":["Overadaptation, because it looks like team spirit while the person has stopped choosing.","Doing nothing, because a silent person looks calm and in control.","Agitation, because a busy person looks like they are making progress."],"answer":0,"why":"Overadaptation looks like the most generous of the four, since it says yes to everyone and nobody argues. But the person has given their choice away, and the other person's need now runs the day. That is passivity dressed as a team player.","traps":{"1":"Doing nothing is easy to spot as stuck, because the silence is visible and awkward. People see it and step in, so it rarely passes for help.","2":"Agitation can look productive, and that is a real trap. But a busy person with no result is easier to notice than a person who has agreed to everything."},"example":"An office retro, Friday, 4:30pm. Everyone agrees to every action item, and the list reads well. Two weeks later, nothing on it is done, and the people who said yes are the ones who are most tired."}]}],"debrief":{"nadia":"Four ways of not solving a problem turned up in one room, and Clara's yes was the one that looked best. Watch for the yes that gives the decision away, because it is the hardest of the four to see.","bookTerm":"Passivity","bookNote":"The books call this passivity: behaviour that does not solve the problem in front of you. It has four forms, doing nothing, overadaptation, agitation, and incapacitation or violence."},"reflection":{"prompt":"Where did you say yes this week without choosing it, or go quiet instead of deciding, and what would the first real choice have been?"},"next":"5.5","baseStory":{"setting":"Work","blurb":"At Halden, a Friday release needs an owner, and each person in the glass room dodges it differently."},"moreStories":[{"setting":"Home & Flatmates","blurb":"A smoke alarm chirps all week, the letting agent visits Saturday, and nobody in the flat fixes it.","opener":{"setting":"Thursday, 9:40pm. Hawthorn Court, apartment 3B, the kitchen. The smoke alarm has chirped every forty seconds since Tuesday.","lines":[{"who":"Maya","text":"\u201cSomebody has to deal with that before the agent comes on Saturday.\u201d","cue":"mug in both hands, staring at the ceiling"},{"who":"Sam","text":"\u201cOn it. I'll do it, I'll do all of it, whatever suits you.\u201d","cue":"coat still on, a shopping bag in each hand"},{"who":"Maya","text":"\u201cRight.\u201d","cue":"she does not look at him"}],"ask":"Which of the four ways of not solving a problem is each person in the flat using, and which one looks like help?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each person in this flat is dodging the alarm in one way or another. Tap the way that fits what they do with their body and their hands, not only their words.","items":[{"type":"pick","who":"Maya","text":"<i>Sam asks if the spare battery is in the drawer or the cupboard. Maya looks at the alarm, then at the drawer. Her hands stay round the mug. A minute goes by, then another, and she walks to her room without a word.<\/i>","cue":"Thursday, 9:46pm, under the alarm","options":["Fidget","Break down or lash out","Do nothing"],"answer":2,"why":"She stops completely. No words, no jobs, no step towards the drawer. The pause runs until she leaves, and that is doing nothing, the plainest of the four ways of not solving a problem.","traps":{"0":"A fidget would show small restless moves, like wiping or shuffling. Maya's hands stay round the mug, so what the clip shows is stillness.","1":"Breaking down or lashing out would show a hard word or a shake in the voice. Maya is calm, only absent."},"example":"A taxi rank, midnight. The driver is asked twice whether the meter is on. He stares through the windscreen and says nothing, and the passenger gets out at the next corner."},{"type":"pick","who":"Sam","text":"<i>Sam sets down the shopping and says \u201cYes, I'll do the battery, and the bathroom too, anything you need.\u201d His own shift for Friday is on the fridge, twelve hours, circled twice. He does not look at it.<\/i>","cue":"Thursday, 9:52pm, by the fridge","options":["Do nothing","Over-comply","Fidget"],"answer":1,"why":"He says yes to everything before he has checked his own day. The yes answers Maya's need, so nobody chose it. It sounds like a flatmate pulling his weight, and still no real decision was made.","traps":{"0":"Doing nothing would be silence. Sam speaks at once and promises plenty, so he is not stuck. The trouble is what the yes is made of.","2":"A fidget would be busy moves that go nowhere. Sam makes one clear move, the promise, and that promise is where the trouble sits."},"example":"A work chat, Monday. A manager asks who can cover the late phone line this week. A new starter writes \u201cI can, anything you need,\u201d and takes it on top of a full load of her own. Nobody asked what she had on."},{"type":"pick","who":"Maya","text":"<i>Maya wipes the same strip of worktop again. She takes the rota off the fridge, redraws it in three colours, puts it back, and takes it off again. She says \u201cJust getting this straight first.\u201d The alarm chirps.<\/i>","cue":"Friday, 7:05am, the fridge door","options":["Fidget","Over-comply","Do nothing"],"answer":0,"why":"Every move is small and busy, and none of them decides who does the battery. A rota redrawn in three colours is a fidget, a way of looking busy while the job stays undone.","traps":{"1":"Over-complying would be a yes to someone's request. Maya agrees to nothing here. She is circling the job.","2":"Doing nothing would be stillness. Maya's hands never stop, and that busy movement is the whole clip."},"example":"A hallway, Sunday. A man about to leave for the airport re-zips his case, checks his passport pocket twice and wipes the shelf, while the taxi waits outside."}]},{"level":"Play","label":"Play, the week in motion","intro":"These are harder. Each person's words and body point in different directions. Look at what the person does next, not at the first thing they say.","items":[{"type":"pick","who":"Sam","text":"<i>Maya says \u201cSam, the battery. Tonight?\u201d He says \u201cTonight, yes, definitely, I'll do it now,\u201d and nods hard. Then he sits on the sofa with the battery packet on his knee and the telly on. By eleven it is still sealed.<\/i>","cue":"Friday, 8:30pm, the sofa, a hard nod","options":["Over-comply","Break down or lash out","Fidget","Do nothing"],"answer":3,"why":"The words are a firm yes, and nothing follows them. The packet stays shut and the chair does not move. The yes ends the question without starting the job, which is doing nothing with a yes laid over the top.","traps":{"0":"Over-complying is the trap here, because the nod and the promise sound like a flatmate stepping up. But he takes nothing on. The packet is still sealed at eleven.","1":"Breaking down or lashing out would be distress or a hard word. Sam is cheerful and calm. He has stopped, not broken.","2":"A fidget needs busy motion. Sam sits almost still, so there is no restless movement to point to."},"example":"A gym front desk, Wednesday. A man says \u201cYes, I'll cancel my membership today,\u201d and then sits in the car with the form on the dashboard until the office shuts."},{"type":"pick","who":"Mr Pryce","text":"<i>Mr Pryce from the letting agency stands under the alarm with his clipboard. He clicks his pen, checks his watch, turns a page and turns it back. He says \u201cRight, we need a plan for that,\u201d and writes the word alarm on the form. He asks nobody anything and decides nothing.<\/i>","cue":"Saturday, 10:15am, the kitchen, a click of the pen","options":["Break down or lash out","Fidget","Over-comply","Do nothing"],"answer":1,"why":"Pryce never stops moving: pen, watch, pages, form. The restless moves look like taking charge, but they end with one word on a form and no next step. That is a fidget, a busy way of not deciding.","traps":{"0":"Breaking down or lashing out would need distress or a flash of temper. Pryce is polite and tidy, so nothing breaks.","2":"Over-complying would be agreeing to whatever Maya needs. Pryce agrees to nothing, he only writes on the form.","3":"Doing nothing would be stillness. Pryce moves the whole time, and that movement is the thing the clip shows."},"example":"A school sports day, Friday. The organiser re-reads the race list, counts the cones twice and asks if anyone has seen the whistle. No one is asked to do anything, and the first race starts late."},{"type":"pick","who":"Sam","text":"<i>Maya tells Pryce the alarm has been going since Tuesday. Sam's face crumples. \u201cI'm hopeless, I can't even change a battery, I'm the worst flatmate in this building,\u201d he says, and sits on the kitchen floor with his hands over his eyes. The alarm chirps over him.<\/i>","cue":"Saturday, 10:22am, the kitchen floor","options":["Fidget","Do nothing","Break down or lash out","Over-comply"],"answer":2,"why":"His words say he is unable, and the collapse hands the mess to everyone else. Maya now has to comfort him, and the battery is still in its packet. Breaking down is loud, and it leaves the problem exactly where it was.","traps":{"0":"A fidget is small busy moves that fill the time. Sam makes one big move that stops the room, so there is nothing small and restless to point to.","1":"Doing nothing would be stillness and silence. Sam is loud, and the sound is what the room remembers.","3":"Over-complying would be a yes to Maya. Sam says he can do nothing at all, so there is nobody he is agreeing with."},"example":"A kitchen, Sunday. A teenager asked to take out the recycling for the fourth time puts his face in his hands, says \u201cI'm useless at everything,\u201d and slides down the cupboard. His mother takes the bags out herself."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. You can use the book words now.","items":[{"type":"pick","who":"Nadia","text":"\u201cSam said yes, anything you need, and the battery stayed in its packet. Why is that passivity, and not a real yes?\u201d","cue":"stirring her tea, watching the steam","options":["He agreed at once, which is the opposite of passive. A fast yes is efficient, and the battery was simply forgotten later on.","No job, no time, no look at his own shift. Maya's need made the choice, which is overadaptation.","He was nervous about the inspection, and nerves explain a lot. Worry about Saturday is the whole reason nothing happened, so passivity does not come into it."],"answer":1,"why":"A real yes names what you will do and when. Sam's names neither, so Maya's need decided the answer and his own Friday never got a say. Overadaptation is one of the four passive behaviours, and it passes for help while the problem stays unsolved.","traps":{"0":"Speed looks efficient, which is why it fools people. A quick yes that checks nothing is still a choice handed away, so the speed is not the measure.","2":"Nerves would be a fair reason to feel stuck. But the clip is about the yes itself, and nerves do not explain why it was given away."},"example":"A club committee, Wednesday. The treasurer says \u201cSure, I'll chase the unpaid fees, whatever the club needs.\u201d No date is named and no names are listed. By the next meeting not one letter has gone out.<br>A real yes would be \u201cI'll send the letters by Friday, and Ann checks the list.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cOf the passive behaviours in that flat, which one is easiest to mistake for being helpful?\u201d","cue":"pen in hand, waiting","options":["Doing nothing, because a flatmate who stays silent looks calm and in control of things.","Agitation, because a flatmate who is always tidying and rewriting the rota looks like someone on top of the job.","Overadaptation, because the yes sounds like a flatmate pulling his weight while the choice is gone."],"answer":2,"why":"Overadaptation looks like the most generous of the four, since it says yes to everyone and nobody argues. But the person has stopped choosing, and whoever asked last runs the week. That is passivity in a team-player coat.","traps":{"0":"Silence is visible and awkward, so people step in. It is rarely mistaken for help.","1":"Agitation can look productive, and that is a real trap. But a busy person with nothing finished is easier to spot than one who agreed to everything."},"example":"A tenants' meeting, Monday. Everyone says yes to every job on the list, and the minutes look healthy. By the end of the month the stairwell light is still out, and the people who said yes are the most worn down."}]}]},{"setting":"Friends & Community","blurb":"Ruby's fortieth is Saturday, nobody has booked the back table, and everyone has a reason not to ring.","opener":{"setting":"Thursday, 6:10pm. The Corner Table, the back table, after Nadia's group. Ruby's fortieth is on Saturday and the cafe has no booking.","lines":[{"who":"Nadia","text":"\u201cSomeone needs to ring the cafe tonight, or Ruby gets her party on the pavement.\u201d","cue":"capping her pen, looking round the table"},{"who":"Joseph","text":"\u201cMm.\u201d","cue":"eyes on a text, thumb on the screen"},{"who":"Hannah","text":"\u201cI'll do it! I'll do the cake too. Whatever you need.\u201d","cue":"already writing on the back of her hand"}],"ask":"Which of the four ways of not solving a problem is each person at the table using, and which one looks like help?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each person at this table is dodging the booking in one way or another. Tap the way that fits what they do with their body and their hands, not only their words.","items":[{"type":"pick","who":"Joseph","text":"<i>Peter asks Joseph if he has the guest list from Ruby's sister. Joseph looks at the sugar bowl. His hands stay flat on the table. Ten seconds go by, then twelve, with nothing said.<\/i>","cue":"Thursday, 6:15pm, the back table","options":["Fidget","Do nothing","Break down or lash out"],"answer":1,"why":"He stops. No words, no reaching for the phone, nothing on the table moves. The pause is complete, and that is doing nothing, the plainest of the four ways of not solving a problem.","traps":{"0":"A fidget would show small restless moves, like turning a spoon or tapping a foot. Joseph's hands are flat and still, so the picture is stillness.","2":"Breaking down or lashing out would show distress or a hard word. Nothing in the clip is upset, only silent."},"example":"A car park, Saturday. A man is asked whether he has seen the dent in the van. He stares at the wing mirror and says nothing, and the person asking gives up and drives off."},{"type":"pick","who":"Hannah","text":"<i>Peter says the cake and the banner still need an owner. Hannah says \u201cI'll do both, and I'll ring the cafe, anything you like,\u201d and writes it on her hand. She has a double shift on Friday and an early one on Saturday. She does not mention either.<\/i>","cue":"Thursday, 6:28pm, a biro on her knuckles","options":["Do nothing","Fidget","Over-comply"],"answer":2,"why":"She says yes before she has checked her own week, and the yes is for the table's need, not hers. She has handed the choice to whoever is asking. It looks like a good friend, and it still means nobody chose.","traps":{"0":"Doing nothing would be silence. Hannah speaks at once and writes it down, so she is not stuck. The problem is what she says yes to.","1":"A fidget would be busy moves that go nowhere. She makes one clear move, the promise, and the promise is the trouble."},"example":"A parents' chat, Sunday. A mother is asked who will run the raffle. She replies \u201cI can, whatever helps,\u201d and runs it on top of the cake stall she already has. Nobody asked about the cake stall."},{"type":"pick","who":"Peter","text":"<i>Peter pulls a napkin over and writes the guest list as a column, counts it, crosses it out and counts it again. He sorts the sugar sachets into rows. He says \u201cI just need the numbers right before anyone rings.\u201d Nobody rings.<\/i>","cue":"Thursday, 6:40pm, the napkin","options":["Over-comply","Break down or lash out","Fidget"],"answer":2,"why":"Every move is small and tidy, and none of them leads to a phone call. Counting a list twice and sorting sachets is a fidget, a way of looking busy while the call stays unmade.","traps":{"0":"Over-complying would be a yes to someone's request. Peter agrees to nothing, he circles the job with his pen.","1":"Breaking down or lashing out would show distress or a flash of temper. Peter is level and precise, so nothing breaks."},"example":"A train platform, Monday. A woman about to ask a stranger to swap seats folds and unfolds her ticket, checks the board, and rereads the carriage number as the doors close."}]},{"level":"Play","label":"Play, the week in motion","intro":"These are harder. Each person's words and body point in different directions. Look at what the person does next, not at the first thing they say.","items":[{"type":"pick","who":"Hannah","text":"<i>Ruby's sister texts: \u201cDid you manage to ring the cafe?\u201d Hannah types \u201cYes, ringing right now!\u201d and sends a thumbs up. Then she rides the bus with her phone face down in her bag. The cafe's number stays unopened in her contacts until it closes at six.<\/i>","cue":"Friday, 4:50pm, the number nine bus","options":["Do nothing","Over-comply","Break down or lash out","Fidget"],"answer":0,"why":"The words are a bright yes, and nothing follows them. The number is never opened and the call is never made. The yes ends the question without starting the job, which is doing nothing with a yes laid over the top.","traps":{"1":"Over-complying is the trap here, because Hannah sounds like the one doing everything. But in this clip she takes nothing on. The cafe is never rung.","2":"Breaking down or lashing out would be distress or a hard word. Hannah is cheerful and calm, so nothing has broken yet.","3":"A fidget needs busy motion. Her phone is face down in a bag, so there is no restless movement to point to."},"example":"A dentist's waiting room, Tuesday. A man is asked to rebook his missed check-up. He says \u201cYes, first thing next week,\u201d takes the card, and puts it in a coat pocket he does not open again."},{"type":"pick","who":"Joseph","text":"<i>In the group chat Joseph, who said he would organise everyone, writes \u201cok so what are we doing??\u201d then \u201csomeone has to decide\u201d. He adds a poll, deletes it, and adds a poll with different options. Nothing is decided and the cafe is still not rung.<\/i>","cue":"Friday, 7:20pm, the group chat, three dots appearing","options":["Fidget","Over-comply","Do nothing","Break down or lash out"],"answer":0,"why":"Joseph never stops typing, posting, deleting and posting again. The busy moves look like organising, but the evening ends with no next step. That is a fidget, a restless way of not deciding.","traps":{"1":"Over-complying would be agreeing to whatever the group asks. Joseph agrees to nothing, he just asks the question again.","2":"Doing nothing would be silence and stillness. Joseph is active the whole time, and that activity is what the clip shows.","3":"Breaking down or lashing out would need a flash of temper or distress. Joseph's messages are light and cheerful."},"example":"A neighbours' street party, Saturday. One man keeps asking on the doorstep chat what everyone thinks, posts a map, deletes it, and posts another. On the day, no one has put out a single table."},{"type":"pick","who":"Hannah","text":"<i>The cafe has no table, and Ruby arrives at one. Hannah says in a thin voice \u201cI can't do all of this,\u201d though she had not said so on Thursday. She pulls the banner off the wall, says \u201cFine, you all sort it, then,\u201d and leaves with the door still swinging.<\/i>","cue":"Saturday, 11:30am, the banner torn from its tape","options":["Over-comply","Fidget","Do nothing","Break down or lash out"],"answer":3,"why":"Her words say she is unable, and the banner and the exit hand the mess to everyone else. The booking has not moved an inch. Breaking down and lashing out are both ways of leaving the problem unsolved, and both are loud.","traps":{"0":"Over-complying would be a yes to the table. Hannah says the opposite and leaves, so there is nobody she is agreeing with.","1":"A fidget is small busy moves that fill the time. Hannah makes one big move that stops the room.","2":"Doing nothing would be stillness and silence. Hannah is fast and loud, and the swinging door is what everyone remembers."},"example":"A church hall, Sunday. A volunteer who agreed to every rota slot drops her tray at the tea urn, says \u201cI can't, I can't, you do it,\u201d and goes out to the car park. Nothing is poured for the next hour."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. You can use the book words now.","items":[{"type":"pick","who":"Nadia","text":"\u201cHannah said yes to everything on Thursday, and by Saturday nothing was booked. Why is that passivity, and not a real yes?\u201d","cue":"turning her cup, not looking up","options":["Her yes named no time and ignored her double shift, so the group's need decided it. That is overadaptation.","She wanted to help, and wanting to help is the opposite of passive. A kind motive means the behaviour cannot be passive, whatever happens next.","She was worn out from her shifts, and tiredness explains everything here, so passivity is the wrong word for what happened on Thursday."],"answer":0,"why":"A real yes names what you will do and when, and checks it against your own week. Hannah's names neither, so the table's need decided the answer. Overadaptation is one of the four passive behaviours, and it passes for generosity while the problem stays unsolved.","traps":{"1":"A kind motive is real, and that is why this one fools people. But passivity is judged by what the behaviour does to the problem, and the cafe stayed unbooked.","2":"Tiredness would be a fair reason to say no. But the clip is about the yes, and tiredness does not explain why it was given away."},"example":"A choir rehearsal, Tuesday. A singer says \u201cOf course I'll print the music, anything for the choir,\u201d with no day named. The folders are empty on Saturday.<br>A real yes would be \u201cI'll print it Thursday, and Mo brings the stapler.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cEveryone at that table found a way not to ring. Which way is hardest for a group of friends to spot?\u201d","cue":"pen in hand, waiting","options":["Doing nothing, because the quiet one at the end of a table always looks content to follow along.","Overadaptation, because the yes gets thanked and nobody checks whether she can do it.","Agitation, because a person sorting napkins and polling the chat looks like the one doing all the work."],"answer":1,"why":"Overadaptation earns thanks. Hannah got the warmth she rarely gets on Thursday, so the group rewarded the exact move that left the table unbooked. Passivity that is paid in warmth is the hardest kind to stop.","traps":{"0":"Silence is visible and a little awkward, so someone usually asks what is wrong. Friends rarely mistake it for help.","2":"Agitation can look like effort, and that is a real trap. But a busy person with nothing finished is easier to notice than a person who agreed to everything."},"example":"A street party committee, Sunday. The member who says yes to every job is thanked in the minutes each month. By June she has quit, and no one can say what she was meant to be doing."}]}]},{"setting":"Relationships","blurb":"Omar's text has sat unanswered for two days, and Clara's friend thinks she should say what she wants.","opener":{"setting":"Thursday, 6:40pm. Halden, the canteen, after everyone else has gone. Omar's text has sat unanswered on Clara's phone for two days.","lines":[{"who":"Kirsty","text":"\u201cYou've opened it eleven times. Just tell him where you want to eat.\u201d","cue":"pointing a fork at the phone"},{"who":"Clara","text":"\u201cIt's fine. Wherever he likes is fine. I don't mind.\u201d","cue":"thumb over the screen, not typing"},{"who":"Kirsty","text":"\u201cYou mind. You told me you can't stand loud places.\u201d","cue":"not softening it"}],"ask":"Which of the four ways of not solving a problem is each person using, and which one looks like kindness?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each person here is dodging a plain answer in one way or another. Tap the way that fits what they do with their body and their hands, not only their words.","items":[{"type":"pick","who":"Clara","text":"<i>Clara finally types \u201cAnywhere is great! You choose, I'm easy, whatever you like!!\u201d and sends it before she can read it back. Two minutes earlier she told Kirsty she can't eat in loud places. She puts the phone face down.<\/i>","cue":"Thursday, 6:52pm, the send button","options":["Do nothing","Fidget","Over-comply"],"answer":2,"why":"She says yes to whatever he picks before she has said what she wants. The reply serves his choice and hides hers. It sounds easy-going, and still nobody has chosen.","traps":{"0":"Doing nothing would be silence. Clara has just sent a message, so she is not stuck. The trouble is what the message gives away.","1":"A fidget would be busy moves that go nowhere. Clara makes one clear move, and that move is a yes."},"example":"A lift home, Friday. A driver asks his passenger which road she prefers. She says \u201cAny, you pick, I'm easy,\u201d though the main road makes her carsick, and she arrives pale and silent."},{"type":"pick","who":"Omar","text":"<i>Omar reads Clara's \u201cAnywhere is great\u201d on the train. He sets his phone face down on his knee with both hands flat on top of it and looks out of the window. He does not answer that night or the next morning. A reply would take ten seconds.<\/i>","cue":"Thursday, 7:30pm, the train, a face-down phone","options":["Do nothing","Fidget","Break down or lash out"],"answer":0,"why":"He stops. No reply, no question, no move on the screen. The pause runs for a night and a morning, and that is doing nothing. Clara will read the silence as an answer.","traps":{"1":"A fidget would show restless moves, like retyping or checking again. Omar's hands are flat, so the picture is stillness.","2":"Breaking down or lashing out would show a flare of temper or distress. Omar is calm, and so is the phone."},"example":"A shop doorway, Saturday. A man is handed a friend's wedding invitation. He reads it, pockets it and never replies. The friend decides he is not coming."},{"type":"pick","who":"Clara","text":"<i>Clara clears forty unread emails, renames a folder, and drafts a follow-up to Omar. She deletes it, drafts another, and says \u201cJust tidying up before I say anything.\u201d The message to Omar is never sent.<\/i>","cue":"Friday, 9:10am, her desk","options":["Break down or lash out","Over-comply","Fidget"],"answer":2,"why":"Every move is small and busy, and none of them sends a message. Clearing a mailbox while drafting and deleting is a fidget, a way of looking occupied while the real question waits.","traps":{"0":"Breaking down or lashing out would show distress or a hard word. Clara is calm and tidy, so nothing has cracked.","1":"Over-complying would be a yes to Omar. She is not saying yes to anything now, she is circling the next message."},"example":"A kitchen table, Sunday. A man who owes his brother a phone call washes the cups, wipes the table, and straightens the chairs. The phone sits where it was."}]},{"level":"Play","label":"Play, the week in motion","intro":"These are harder. Each person's words and body point in different directions. Look at what the person does next, not at the first thing they say.","items":[{"type":"pick","who":"Clara","text":"<i>Omar sits down with his tray. \u201cNoodle place by the station, tomorrow, seven? Or tell me what you'd rather.\u201d Clara says \u201cPerfect, I'll book it, sounds great,\u201d and smiles. He goes back to his desk. She stares at her tray, and the booking page stays unopened until the lunch hour ends.<\/i>","cue":"Friday, 1:05pm, the canteen, a bright smile","options":["Fidget","Do nothing","Over-comply","Break down or lash out"],"answer":1,"why":"The words sound like a yes, and nothing follows the yes. The page never opens and her whole body has stopped. The yes ends the question and starts nothing, which is doing nothing with a yes laid over the top.","traps":{"0":"A fidget needs busy motion. Clara is nearly still over her tray, so there is no restless movement to point to.","2":"Over-complying is the trap here, because the smile and the words look like an easy, generous yes. But she takes the booking on in words only. The page is still shut.","3":"Breaking down or lashing out would be distress or a flash of temper. Clara is calm and smiling, so she has stopped, not broken."},"example":"A school open evening, Thursday. The teacher asks if you can come back on Monday for a longer talk. You say \u201cSure, Monday's fine,\u201d and then sit in the car for twenty minutes without starting the engine."},{"type":"pick","who":"Omar","text":"<i>The noodle place has no table in Clara's name. Omar checks his watch, rereads the menu in the window, and walks to the corner and back. He says \u201cWe could go somewhere else, or wait, or I could ask, whatever you think.\u201d He asks nothing and decides nothing.<\/i>","cue":"Saturday, 6:55pm, the pavement outside","options":["Do nothing","Break down or lash out","Fidget","Over-comply"],"answer":2,"why":"Omar, the steady one, is moving the whole time: watch, menu, corner, corner. The restless moves look like patience, but they end without a next step. That is a fidget, a busy way of not deciding.","traps":{"0":"Doing nothing would be stillness. Omar walks to the corner and back and checks his watch, so he is never still.","1":"Breaking down or lashing out would need distress or a flash of temper. Omar is level and polite.","3":"His whatever you think sounds like a yes, but Clara has asked for nothing. The pacing and the watch are what the clip shows."},"example":"A cinema foyer, Friday. A man whose date is late reads the poster three times, buys a drink, puts it down, and checks the clock. He will not text her and he will not leave."},{"type":"pick","who":"Clara","text":"<i>Clara arrives, sees him on the pavement, and her voice goes thin. \u201cI always get this wrong. I can't even book a table,\u201d she says. Then \u201cYou pick, you're the one who knows how to do this,\u201d and she turns and walks back towards the station with her bag held tight.<\/i>","cue":"Saturday, 7:10pm, the pavement, her bag held tight","options":["Break down or lash out","Over-comply","Fidget","Do nothing"],"answer":0,"why":"Her words say she is unable, and the exit hands the whole evening to Omar. The table has not moved an inch. Breaking down is loud, and it is another way of leaving the problem unsolved.","traps":{"1":"Over-complying would be a yes to Omar. Clara gives up and leaves, so there is nobody she is agreeing with, even though her last line hands him the choice.","2":"A fidget is small busy moves that fill the time. Clara makes one big move that ends the evening.","3":"Doing nothing would be stillness and silence. Clara speaks and walks away, and the walk is what Omar remembers."},"example":"A doorway after a party, Saturday. A man who forgot the taxi says \u201cI always ruin everything,\u201d and leaves his coat on the stairs. His date is left holding it, and the taxi is still not booked."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. You can use the book words now.","items":[{"type":"pick","who":"Nadia","text":"\u201cClara said anywhere is great, and the table was never booked. Why is that passivity, and not an easy-going answer?\u201d","cue":"turning her cup, looking at the window","options":["She was being flexible, and flexibility is what a second date needs. Easy-going people cannot be passive, whatever they leave undone.","She was nervous about the date, and nerves explain the whole evening. That makes it an ordinary mood, so the word passivity does not fit.","Her answer named no wish, so Omar's choice would decide it. That is overadaptation, which passes for charm."],"answer":2,"why":"A real answer says what you want, even a small thing. Clara's names nothing, so Omar's choice has to decide, and her own wish never gets a say. Overadaptation is one of the four passive behaviours, and it passes for easy company while the problem stays unsolved.","traps":{"0":"Flexibility is a real strength, and that is why this fools people. But flexible people still say what they would pick, and an answer with no wish in it is a handed-over choice.","1":"Nerves are normal on a second date. But the clip is about the answer itself, and nerves do not explain why her wish was left out."},"example":"A pub quiz night, Tuesday. A captain asks which round to skip. Everyone says \u201cAny, I don't mind,\u201d and the host skips the one the quietest player had revised.<br>A real answer would be \u201cSkip sport, I'd rather keep music.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cOmar said or you pick, and Clara said anywhere. Which of the four is easiest to mistake for being kind?\u201d","cue":"pen in hand, waiting","options":["Overadaptation, because anywhere is fine looks like kindness while the wish goes unsaid.","Doing nothing, because a calm person who does not answer looks relaxed and sure of what they want, so nobody asks again.","Agitation, because a person who keeps checking and rewriting looks careful about getting the evening exactly right."],"answer":0,"why":"Overadaptation looks like the kindest of the four, since it hands the other person exactly what they asked for. But Clara earns her place by being useful, so she keeps giving her wish away. Omar asks plainly and has no way of knowing it is gone.","traps":{"1":"Silence tends to read as a message, usually a worrying one. People ask about it, so it rarely passes for kindness.","2":"Agitation can look like care, and that is a real trap. But a person who is busy with no result is easier to notice than one who agreed to everything."},"example":"A family birthday dinner, Saturday. Asked where she would like to eat, a guest of honour says \u201cAnywhere is lovely.\u201d They go to the place everyone else wanted, and she eats half a plate."}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://claude.ai/artifact/FzdEytVBojsBteGVMXXV4K","next":{"slot":"5.5","title":"Two Halves of a Pair","url":"https://claude.ai/artifact/MZ84ez7MSZVgrUGML58jVF"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: MULTI ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
