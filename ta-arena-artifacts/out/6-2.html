<html lang="en-GB">
<head>

<title>Hear the Hidden Must · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

ne\"/><circle cx=\"9\" cy=\"27\" r=\"4\" fill=\"url(#w6g)\" stroke=\"#fff\" stroke-width=\"1.2\"/><circle cx=\"27\" cy=\"27\" r=\"4\" fill=\"url(#w6g)\" stroke=\"#fff\" stroke-width=\"1.2\"/><line x1=\"12.5\" y1=\"24\" x2=\"23.5\" y2=\"24\" stroke=\"#FFFC00\" stroke-width=\"1.5\" stroke-dasharray=\"2 2\"/></svg>", "7": "<svg class=\"emb\" viewBox=\"0 0 36 36\" aria-hidden=\"true\" focusable=\"false\"><radialGradient id=\"w7g\" cx=\"50%\" cy=\"100%\" r=\"80%\"><stop offset=\"0%\" stop-color=\"#FFFC00\"/><stop offset=\"60%\" stop-color=\"#F59E0B\"/><stop offset=\"100%\" stop-color=\"#D97706\"/></radialGradient><path d=\"M7 23 A11 11 0 0 1 29 23 Z\" fill=\"url(#w7g)\" stroke=\"#FFFC00\" stroke-width=\"1.5\"/><line x1=\"3\" y1=\"23\" x2=\"33\" y2=\"23\" stroke=\"#FDE68A\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><g stroke=\"#FFFC00\" stroke-width=\"2.5\" stroke-linecap=\"round\"><line x1=\"18\" y1=\"5\" x2=\"18\" y2=\"9\"/><line x1=\"8\" y1=\"9\" x2=\"11\" y2=\"12\"/><line x1=\"28\" y1=\"9\" x2=\"25\" y2=\"12\"/><line x1=\"31\" y1=\"17\" x2=\"27\" y2=\"18\"/><line x1=\"5\" y1=\"17\" x2=\"9\" y2=\"18\"/></g></svg>"};</script>
<script>window.TA_GAME = {"slot":"6.2","setting":"Home & Flatmates","title":"Hear the Hidden Must","world":6,"worldName":"The Story You Wrote","week":6,"weekName":"The Story You Wrote","mechanic":"Diagnose","concept":"After this one you can hear which Must is running in a short clip by reading the words and the hands together, even when they disagree.","plainWord":"the Musts","bookTerm":"Drivers","bookIdea":"Drivers are five Musts (be perfect, please others, try hard, be strong, hurry up), each a condition for feeling OK, and each shows in a person's words, tone and body.","bookSource":"TA Today, ch. 16","opener":{"setting":"Wednesday, 7:05am. Hawthorn Court, apartment 3B, the kitchen. The cab is due at 7:15.","lines":[{"who":"Sam","text":"\u201cQuick, quick, the cab's here. Grab the bag, I'll explain on the way.\u201d","cue":"one shoe on, the other in his hand"},{"who":"Maya","text":"\u201cIt's fine. Go. Don't worry about the bins, I'll do them.\u201d","cue":"already at the sink, back to the room"}],"ask":"Name the Must behind each short clip. Sometimes the words and the hands disagree, so check both."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each clip lasts a few seconds: what someone says, and what their hands and face do. Name the Must it runs on. The five Musts are be perfect, please others, try hard, be strong and hurry up.","items":[{"type":"pick","who":"Daniel","text":"\u201cTwo commas. Fix them before it goes out.\u201d","cue":"reading the email a second time, pen clicking on each comma","options":["Be perfect","Please others","Hurry up"],"answer":0,"why":"The words are about small errors, and the pen goes over each comma again. The Must is be perfect: nothing is allowed to slip, and a clean page is the only way to feel OK.","traps":{"1":"It would sound like \u201cWhatever you think is best, go ahead.\u201d Nothing in the clip is about being liked. The team would hear a boss who has stopped checking and is handing the email over.","2":"It would sound like \u201cQuick, send it, we're late.\u201d The pen stops on every comma, though. The speed would tell the team the checks don't matter, and the one check he needs would be skipped."},"example":"A cricket club scorer, Saturday. He recounts the same over three times while the batsmen wait: \u201cOne more look. The total has to be exact.\u201d"},{"type":"pick","who":"Maya","text":"\u201cIt's fine, sit, sit. I'll do the dishes. You take the chair, I've eaten.\u201d","cue":"already at the sink, back to the room, not turning round","options":["Try hard","Please others","Be strong"],"answer":1,"why":"Every line is about being no bother: it's fine, you sit, I've eaten. The Must is please others, and the dishes are the price of being easy to be around.","traps":{"0":"It would sound like \u201cI'll get it right this time, just give me a minute.\u201d The clip shows no effort. She is not trying to get something right, she is trying not to be any trouble.","2":"It would sound like \u201cI don't need a chair, I'm fine standing.\u201d That refuses help, and this clip is the opposite. She is giving the chair away to make him comfortable."},"example":"A bank queue, Tuesday. A man lets a woman with a baby go first, then waves off her thanks: \u201cNo, no, it's nothing. After you.\u201d He has waited forty minutes, and his own form is still wrong."},{"type":"pick","who":"Sam","text":"\u201cOkay, okay, I'm ready. Where are my keys? Quick, quick, the cab's already here.\u201d","cue":"keys in his teeth, jacket half on, checking the microwave clock","options":["Hurry up","Try hard","Be perfect"],"answer":0,"why":"The clock is in his eyes, and the word 'quick' comes twice in one line. The Must is hurry up: the day is a race he is already losing, so he rushes the next step before he knows what it is.","traps":{"1":"It would sound like \u201cI'll get there, I'm trying, give me a minute.\u201d Nothing in the clip shows effort, only speed. The cabbie would hear someone who is trying, when what he needs is a plan.","2":"It would sound like \u201cWait, let me check the bag. Did I lock the door?\u201d That is a careful clip, and Sam is skipping checks. Nothing is being perfected here, only hurried through."},"example":"A train platform, 6:58am. A mother runs for a carriage with a child on her hip. She keeps saying \u201cCome on, come on\u201d to a child who is still tying a shoelace."}]},{"level":"Play","label":"Play, the week in motion","intro":"These clips are harder. The words and the hands point in different directions, and the options look alike. Listen to both, then ask which one the person is holding on to.","items":[{"type":"pick","who":"Clara","text":"\u201cI'm fine, really. It's just the same cell. I'm trying, I'll have it in a minute.\u201d","cue":"the spreadsheet opened for the fourth time, brow tight, nose almost on the screen","options":["Be strong","Try hard","Be perfect","Please others"],"answer":1,"why":"The words say fine, and the body says effort. The same cell, opened again and again, is what try hard looks like: the trying is the point, and it never reaches the finish. The 'I'm fine' is the cover.","traps":{"0":"It would sound like \u201cI'm fine, I'll sort it myself.\u201d Her teammates would believe the words, so nobody would offer to look at the cell with her, and the fourth opening would go on alone.","2":"It would sound like \u201cJust one more check, the cell has to be exact.\u201d That is a real Must, but this clip isn't about exactness. Nothing is being checked for errors. It is pushed for a result that doesn't come.","3":"It would sound like \u201cTake your time, I don't mind waiting.\u201d Her eyes are on the cell and nowhere near anyone else's comfort."},"example":"A family WhatsApp group for a wedding: \u201cI'm fine, really, I'll sort the venue tomorrow.\u201d At midnight she posts the fourth draft of the same menu card."},{"type":"pick","who":"Omar","text":"\u201cWhatever's easiest for everyone. I'm fine doing it, really.\u201d","cue":"carrying the crate alone, arms locked, waving off the trolley someone holds out","options":["Please others","Be strong","Try hard"],"answer":1,"why":"The words sound like a gift to everyone: whatever's easiest. The hands say the opposite. He will not let anyone share the load, and that is be strong, the Must that says needing help is a weakness.","traps":{"0":"It would sound like \u201cLet me think, what would suit everyone?\u201d That is please others, and the clip doesn't ask the room what suits it. The crate would stay on his back and nobody would know he was struggling.","2":"It would sound like \u201cGive me a minute, I'll get the hang of this crate.\u201d It has the look of effort, but Omar is not trying to master the crate. He is refusing the trolley and the hand."},"example":"A grandfather at a family wedding carries every bag from the car and turns down his nephew: \u201cI've carried worse. Go and sit down.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cMaya says 'it's fine' and 'sit, sit' before breakfast, then takes the dishes. Which explanation fits best?\u201d","cue":"sliding her cup across the table to the empty seat","options":["She runs be strong: she handles everything alone so no one has to be bothered.","She runs please others: the 'it's fine' is the Must, and the dishes keep her from being any trouble.","She runs hurry up: the dishes get done fast so the morning moves."],"answer":1,"why":"The books call these drivers, and this one is please others. Every line is about not being a bother: it's fine, sit, I've eaten. Be strong would have refused the chair outright, and hurry up would have talked about the clock.","traps":{"0":"Sam would take her at her word and say \u201cGreat, see you.\u201d Nobody would ask whether she had eaten, and the cover would be read as strength.","2":"The talk would turn to time, and the lines about the chair would be put down to nerves. Maya's real pull is being no trouble, and it would stay hidden under a joke about the clock."},"example":"A school gate, Monday. A mother says \u201cIt's fine, I'll wait,\u201d and holds three other parents' bags while her own son is called in late."}]}],"debrief":{"nadia":"Five Musts, and each one can pass for a good habit at first. Listen for the word that gets said too often, then check whether the hands agree. The clip that fooled you was probably the one where the words were kind.","bookTerm":"Drivers","bookNote":"The books call these drivers: five Musts, each a condition for feeling OK, that show in a person's words, tone and body."},"reflection":{"prompt":"Which Must did you hear yourself running this week, and what were your hands doing just before?"},"next":"6.3","baseStory":{"setting":"Home & Flatmates","blurb":"Sam hurries out to a cab while Maya takes over the dishes and waves everything off."},"moreStories":[{"setting":"Relationships","blurb":"Omar and Clara on a second date, after her reply to his text took three days.","opener":{"setting":"Thursday, 7:55pm. The Corner Table, the window seat. Second date, and Clara's answer to his text took three days.","lines":[{"who":"Omar","text":"\u201cYou came. I wasn't sure, after the wait.\u201d","cue":"standing, one hand on the back of her chair, phone already face down"},{"who":"Clara","text":"\u201cSorry. Sorry. I can explain the wait, I've got it written down somewhere.\u201d","cue":"patting her coat pockets, a folded sheet half out of the left one"}],"ask":"Name the Must behind each short clip. Sometimes the words and the hands disagree, so check both."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each clip lasts a few seconds: what someone says, and what their hands and face do. Name the Must it runs on. The five Musts are be perfect, please others, try hard, be strong and hurry up.","items":[{"type":"pick","who":"Clara","text":"\u201cI wrote it four times. The first three sounded like a leaflet. This one is only fine, but I sent it.\u201d","cue":"scrolling back through her drafts to show him, thumb on the last deleted word","options":["Please others","Hurry up","Be perfect"],"answer":2,"why":"The drafts are the clip. Four versions of one text, and the first three binned for sounding wrong. The Must is be perfect: a message is only safe to send when nothing in it can be marked down. 'Only fine' is how she scores the one that went.","traps":{"0":"It would sound like \u201cI wanted to word it the way you'd like.\u201d The drafts were not aimed at his taste. She was auditing her own sentences, and he would be flattered by an effort that was really about her.","1":"It would sound like \u201cSorry, got it, yes, done, next.\u201d Three days is the opposite of fast. Hurrying her would only make the next text come late for the same reason."},"example":"A cousin sending a thank-you card, Sunday. She rewrites the first line six times, then posts it a fortnight late because 'it still isn't right'."},{"type":"pick","who":"Clara","text":"\u201cNo, you choose the place, I don't mind. I'll have what you're having. And this one is mine, I insist.\u201d","cue":"folding her napkin into a neat square, eyes on his plate and not the menu","options":["Please others","Try hard","Be strong"],"answer":0,"why":"Every line hands the decision to him: you choose, I'll have what you have, this one is mine. The Must is please others. She earns her seat by being useful and easy, and the neat napkin is the same effort in her fingers.","traps":{"1":"It would sound like \u201cGive me a minute, I'll get this right.\u201d There is no struggle in the clip, only giving way. Nobody here is working at a task. She is working at being no trouble.","2":"It would sound like \u201cI'll manage on my own, I don't need a menu.\u201d That refuses help. Clara is doing the opposite and offering everything, so be strong would have her pushing him away."},"example":"A work lunch, Wednesday. A new starter says \u201cAnywhere is fine for me,\u201d orders the same salad as her boss, and offers to carry the plates."},{"type":"pick","who":"Tess","text":"\u201cPick up, pick up, I've got ten minutes before my train. Did he kiss you? Tell me everything, quick, quick.\u201d","cue":"a voice note leaking from Clara's bag, a platform announcement behind it","options":["Be strong","Hurry up","Be perfect"],"answer":1,"why":"The words pile on top of each other, and a train clock is in the background. The Must is hurry up: Tess wants the whole story and the answer inside ten minutes, so she cannot wait for Clara to finish a sentence.","traps":{"0":"It would sound like \u201cI'm fine, don't ask me anything, keep it to yourself.\u201d Tess is the opposite. She is asking for everything at once, loudly, and holds nothing back.","2":"It would sound like \u201cSend it again, word for word, I want the details exact.\u201d Tess is not checking anything. She has a train to catch and no patience for a careful answer."},"example":"A brother on a lunch break, Friday. He rings his sister for gossip and says \u201cQuick, quick, one minute left, who was at the wedding?\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"These clips are harder. The words and the hands point in different directions, and the options look alike. Listen to both, then ask which one the person is holding on to.","items":[{"type":"pick","who":"Clara","text":"\u201cWhatever's easiest for you. I'm fine walking, really, it's twenty minutes. Keep the umbrella.\u201d","cue":"coat dark at the shoulders, hand pushing the umbrella back at him","options":["Please others","Be strong","Try hard","Hurry up"],"answer":1,"why":"The words sound generous: whatever's easiest, keep the umbrella. The hands refuse the one thing he is offering. She will not take the lift or the cover, and that is be strong, the Must that makes a shared umbrella feel like a weakness.","traps":{"0":"It would sound like \u201cWhat would you like me to do? I'll come with you, wherever.\u201d That asks him what suits him. Clara is refusing his offer, so she is not bending to him at all, and he would keep guessing what she wants.","2":"It would sound like \u201cGive me another go at the road, I'll get the bus, I'll work it out.\u201d Nothing here is being practised. She is declining help, and calling that effort would leave the wet shoulders unexplained.","3":"It would sound like \u201cCome on, we'll miss it, let's go, run.\u201d Her pace is steady and slow. The rain is not the hurry. Her need to be rid of the umbrella is."},"example":"A son at a bus stop, Saturday. His mother holds out her scarf in the cold and he says, \u201cI'm fine, you keep it,\u201d teeth chattering."},{"type":"pick","who":"Clara","text":"\u201cGive me a minute, I nearly have it. The seats are showing as booked, but I think I'm pressing the wrong thing.\u201d","cue":"the cinema booking app on its eighth try, tongue between her teeth, Omar's phone held out with the tickets already open","options":["Be perfect","Try hard","Please others"],"answer":1,"why":"'I nearly have it' is the sentence. The same screen has been tried eight times, and the tickets in his hand are waved away. The Must is try hard: the effort is the point, and it never reaches the finish.","traps":{"0":"It would sound like \u201cLet me check the seat numbers once more, they have to match.\u201d She is not checking for errors. She is pushing the same button hoping it will give way.","2":"It would sound like \u201cWhatever film you want, I'll book it for you, no trouble.\u201d She is not serving his taste. She is stuck on the app and ignoring his offer, which does not help him at all."},"example":"A new driver at a car park, Sunday. She reverses into the same bay a fifth time and waves off her passenger: \u201cI've nearly got it, give me a second.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Omar","text":"\u201cThose slides on Tuesday were the best part of the release.\u201d Clara says: \u201cTwo typos in the footnote. It wasn't really good.\u201d Which explanation fits best?","cue":"she straightens the cups on the table and does not look at him","options":["She runs please others: she is tidying so he has something to enjoy, and the footnote is a joke.","She runs be strong: she shrugs the praise off so she never has to need anything from him.","She runs be perfect: praise only counts when nothing is wrong, so she finds the flaw first."],"answer":2,"why":"The drivers here are be perfect. A compliment on work with a typo in it cannot land, so she hands back the typo. The tidy cups are the same checking in her hands. Be strong would have turned the praise away without a reason, and please others would have asked what he liked.","traps":{"0":"Omar would laugh, say \u201cFair enough,\u201d and move on. The compliment would be treated as a joke, and the footnote she is really counting would stay between her and the table.","1":"Omar would read the shrug as modesty and drop it. Nobody would ask about the two typos, so her point that praise has to be earned would stay hidden under a polite smile."},"example":"A sister at a family dinner, Sunday. Told the cake is lovely, she says \u201cThe icing's uneven on the left,\u201d and cuts the first slice off the good side."}]}]},{"setting":"Friends & Community","blurb":"Ruby, Joseph and Nadia's group prepare a fortieth birthday at The Corner Table, six hours before the guests arrive.","opener":{"setting":"Saturday, 11:20am. The Corner Table, the back table. Joseph's fortieth starts at six and the banner is still on the floor.","lines":[{"who":"Ruby","text":"\u201cBanner's down. Cake's in the box. Joseph walks in at six and every bit of it has to be there.\u201d","cue":"counting chairs a second time, one finger lifting for each"},{"who":"Nadia","text":"\u201cSit a minute, Ruby. The tea is hot.\u201d","cue":"pouring a second cup before she answers"}],"ask":"Name the Must behind each short clip. Sometimes the words and the hands disagree, so check both."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each clip lasts a few seconds: what someone says, and what their hands and face do. Name the Must it runs on. The five Musts are be perfect, please others, try hard, be strong and hurry up.","items":[{"type":"pick","who":"Ruby","text":"\u201cThe napkins are green and the banner is blue-green. Nobody will say a word. I'll know, though. I'm swapping them.\u201d","cue":"holding a napkin up against the banner at arm's length, squinting","options":["Please others","Try hard","Be perfect"],"answer":2,"why":"The shade is wrong by a hair, and only she can see it. The Must is be perfect: a good party is one with nothing out of place, and she will fix a detail no guest would ever spot.","traps":{"0":"It would sound like \u201cDoes anyone mind the napkins? I can ask Joseph what he likes.\u201d She is not asking anybody. She would swap them in the end whatever anyone said.","1":"It would sound like \u201cI'll keep trying until they look right, give me a minute.\u201d The napkins are not a task she is failing at. She is looking at a flaw and refusing to let it stand."},"example":"A wedding planner, Friday. She turns every place card a quarter inch so the names line up, though the room is empty."},{"type":"pick","who":"Keith","text":"\u201cSure, I'll go in goal again. I'll go in goal all afternoon, whoever wants a rest. No bother.\u201d","cue":"gloves already on, smiling at nobody, the ball bag over his shoulder","options":["Be strong","Please others","Hurry up"],"answer":1,"why":"He volunteers before anyone asks, and says there is no bother twice. The Must is please others: he keeps his place on the team by taking the job nobody wants.","traps":{"0":"It would sound like \u201cI don't need a break, I'll play on, I'm fine.\u201d That refuses help. Keith is offering to take the worst job so that others can rest, which is giving, not holding off.","2":"It would sound like \u201cCome on, kick off, we haven't got all day.\u201d His voice is mild and slow. The rush is in no one's voice here, only the wish to be no trouble."},"example":"A parent at the school gate, Monday. She offers to run the cake stall again this term: \u201cNo bother, I don't mind, you've all got enough on.\u201d"},{"type":"pick","who":"Joseph","text":"\u201cQuick, quick, kick-off is in two minutes. Who's got the bibs? I'll find the pitch key, I'll find the ball, come on!\u201d","cue":"tapping his watch, boots still untied, jogging on the spot","options":["Hurry up","Be perfect","Try hard"],"answer":0,"why":"He says quick twice and gives himself three jobs in one breath. The tapping watch and the untied boots finish it. The Must is hurry up: the next minute is always the one he is about to lose.","traps":{"1":"It would sound like \u201cWait, let me count the bibs. The numbers have to match.\u201d Joseph checks nothing here and his boots are undone, so it is speed and not care.","2":"It would sound like \u201cI'll get the hang of this goal, I'll try again.\u201d No attempt is being repeated. The clock is the only thing he is working against."},"example":"A bus conductor at the end of a shift. He shouts \u201cMove along, move along\u201d at passengers still finding their change."}]},{"level":"Play","label":"Play, the week in motion","intro":"These clips are harder. The words and the hands point in different directions, and the options look alike. Listen to both, then ask which one the person is holding on to.","items":[{"type":"pick","who":"Ruby","text":"\u201cI'm fine, it's just this corner. It'll go up in a minute.\u201d","cue":"on a chair with a roll of tape, the banner falling off the same corner for the fourth time, Keith's offered hand waved away","options":["Try hard","Be strong","Please others","Be perfect"],"answer":0,"why":"The words say fine and the tape says otherwise. The same corner, four tries, and an offered hand turned down. The Must is try hard: the trying has become the job and the banner is never finished.","traps":{"1":"It would sound like \u201cI'll do it all myself, I need nobody.\u201d She is not rejecting help to prove strength. She is simply stuck on the corner and thinks one more go will do it.","2":"It would sound like \u201cKeith, you do it, I'll hold the chair, whatever you like.\u201d She keeps the tape, so she is not giving the job away to please anyone.","3":"It would sound like \u201cWait, the banner's edge is a hair lower than the other, I'll start again.\u201d She is not studying the line. She is pressing the tape and hoping."},"example":"A neighbour at a window, Saturday. She tries the same curtain hook for the fifth time: \u201cNearly there, don't help, I've almost got it.\u201d"},{"type":"pick","who":"Peter","text":"\u201cWhatever suits the group. I'm fine with it, go and sit down.\u201d","cue":"carrying the tea urn up the step alone, jaw tight, refusing the trolley Hannah holds out","options":["Please others","Be strong","Try hard"],"answer":1,"why":"The words sound like a gift: whatever suits the group. The hands say no to everyone. He will not share the weight, and that is be strong, the Must that says needing a hand is a weakness.","traps":{"0":"It would sound like \u201cLet me ask the group what they'd like, I'll do what suits.\u201d He asks nobody. The urn stays on his arms and nobody knows he is struggling.","2":"It would sound like \u201cGive me a minute, I'll learn this step.\u201d He is not getting better at the urn. He is turning the trolley away."},"example":"A father at a station, Thursday. He lifts the case up the stairs and says \u201cGo on, I've done it for years,\u201d while his daughter holds the lift door."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Joseph","text":"\u201cTake your time, everyone. No rush on my account.\u201d At ten to six, he says it again.","cue":"checking his watch under the table, one foot jiggling against the leg of the chair","options":["He runs be strong: he tells the room not to fuss over him, then sits still so nobody sees a worry.","He runs please others: he says no rush so nobody feels hurried, and the polite words are the aim.","He runs hurry up: the words are polite, but the clock is in his hands and it will rush the toast."],"answer":2,"why":"The books call these drivers, and this one is hurry up. The kind words are cover. The watch and the jiggling foot say the real thing, and the toast he rushes later shows it. Please others would have hovered over each guest, not checked the time.","traps":{"0":"The room would take 'take your time' at face value and linger. Joseph's foot would go on jiggling and nobody would ask why a man with six hours to spare keeps checking the watch.","1":"Hannah would hear a kind host and stop apologising for the late buses. The watch under the table would go unnoticed, and the clock would stay Joseph's private problem."},"example":"A bride's father at a reception, Saturday. He tells the band \u201cNo hurry\u201d and then taps the microphone twice, glancing at the door."}]}]},{"setting":"School & College","blurb":"Sam's evening class has a group project due Friday, and Sam has said yes to everything.","opener":{"setting":"Tuesday, 8:50pm. Room 4, the evening class. The group presentation is due Friday and the sheet on the table has Sam's name in four places.","lines":[{"who":"Dean","text":"\u201cSo you've got the slides, the references and the intro. Sam, yes?\u201d","cue":"pen over the sheet, already ticking"},{"who":"Sam","text":"\u201cYes. Sure. Totally. I'll sort it by Thursday.\u201d","cue":"nodding before Dean finishes, bag half zipped"}],"ask":"Name the Must behind each short clip. Sometimes the words and the hands disagree, so check both."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each clip lasts a few seconds: what someone says, and what their hands and face do. Name the Must it runs on. The five Musts are be perfect, please others, try hard, be strong and hurry up.","items":[{"type":"pick","who":"Sam","text":"\u201cYes, yes, of course. I'll do the slides and the references and the intro, whatever you need. No problem at all.\u201d","cue":"already writing the extra jobs on his hand, nodding at the next person","options":["Hurry up","Please others","Be perfect"],"answer":1,"why":"He agrees to every job before the question ends. The Must is please others: if he says yes to everything, nobody will be annoyed with him. The pen on his hand shows he has taken the job without once asking whether he can do it.","traps":{"0":"It would sound like \u201cQuick, quick, give me the sheet, I'll do it right now.\u201d The rush is not in the clip. He is slow to refuse and quick to agree, which is a different thing.","2":"It would sound like \u201cWait, let me check the references format first.\u201d Nobody is checking anything in this clip. He is nodding first and thinking later."},"example":"A volunteer at a food bank, Wednesday. She says yes to a fifth shift and writes it on her wrist, though her own week is full."},{"type":"pick","who":"Mrs Pell","text":"\u201cPage four has a comma splice. I'll mark it again. It has to be clean before it goes to the exam board.\u201d","cue":"red pen circling, tapping the pile of scripts level against the desk","options":["Be perfect","Be strong","Try hard"],"answer":0,"why":"A comma splice on page four, a second pass, and the pile tapped level. The Must is be perfect: the work is only safe when no mark could be found on it. The tapped pile is the same Must in her hands.","traps":{"1":"It would sound like \u201cI don't need a second marker, I'll manage all forty scripts alone.\u201d The clip is about errors and not about doing it solo.","2":"It would sound like \u201cI'll keep going until I get through them, one more hour.\u201d Nothing here is about stamina. She is hunting for the next mistake."},"example":"A woodwork teacher, Thursday. He sands a table leg until it shines, then starts again because the grain 'isn't straight'."},{"type":"pick","who":"Dean","text":"\u201cI don't need the study group. I don't need anyone's notes. I'll manage on my own.\u201d","cue":"hunched over a laptop on four per cent battery, pushing Tilly's charger back across the desk","options":["Try hard","Please others","Be strong"],"answer":2,"why":"He says 'I don't need' twice and slides the charger away. The Must is be strong: needing help is a weakness, so he will run his battery flat before he takes a loan.","traps":{"0":"It would sound like \u201cI'll keep trying until I have it, give me another go.\u201d He is not trying at anything. He is closing the door on help.","1":"It would sound like \u201cTake my notes, I'll lend you the charger, I don't mind.\u201d He gives away nothing. He guards what he has and shuts out Tilly."},"example":"A man at a garden fence, Sunday. His neighbour offers a ladder and he says \u201cI don't need it,\u201d then climbs on a bin."}]},{"level":"Play","label":"Play, the week in motion","intro":"These clips are harder. The words and the hands point in different directions, and the options look alike. Listen to both, then ask which one the person is holding on to.","items":[{"type":"pick","who":"Mrs Pell","text":"\u201cTake as long as you need. There's no rush at all.\u201d","cue":"glancing at the clock over the door, key tapping her palm, hovering by the light switch","options":["Please others","Hurry up","Be strong","Be perfect"],"answer":1,"why":"The words are patient and the hands are not. The glance at the clock and the key in her palm say it is nearly ten. The Must is hurry up: the evening is a race with the caretaker, and she is the one losing it.","traps":{"0":"It would sound like \u201cStay as long as you like, I'll wait with you, I'm not tired.\u201d That is giving, with no clock in it. Mrs Pell keeps looking at the clock and her own wish to leave shows.","2":"It would sound like \u201cI'm fine standing here all night, I don't need to sit.\u201d There is nothing hard about her stance. She is watching the time, not holding herself up.","3":"It would sound like \u201cBefore you go, check the footnotes once more.\u201d She is not checking the work. She is checking the clock."},"example":"A shopkeeper at closing time, Saturday. She tells the last customer \u201cTake your time, love,\u201d and starts stacking chairs around her."},{"type":"pick","who":"Sam","text":"\u201cI'm fine, I don't mind staying till eleven. It's only the references.\u201d","cue":"restarting the same reference list for the fourth time, headphones on, Tilly's offered template waved away","options":["Please others","Be perfect","Try hard"],"answer":2,"why":"The words sound relaxed, and the fourth restart shows the effort. He turns down a ready-made template to keep at it. The Must is try hard: effort is the proof he is a good student, and it never turns into a finished list.","traps":{"0":"It would sound like \u201cTilly, you take the references, I'll do your slides, it's no bother.\u201d He is not pleasing her. He is pushing her help away and working on.","1":"It would sound like \u201cThe order of the authors has to be exact, I'll check each full stop.\u201d He is not auditing details. He is starting the same list again."},"example":"A student on a train, Friday. He retypes the same opening paragraph a fourth time and shrugs off a friend's offer to read it."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Sam","text":"At 1am he texts Dean: \u201cSorry!! Nearly done!!\u201d Nothing is attached. Which explanation fits best?","cue":"a text with two exclamation marks and no file, sent from the library at closing","options":["He runs please others: saying yes to everything keeps people happy, and the apology is the same Must again.","He runs try hard: he sends the text to show how hard he is working, and the effort is the whole point.","He runs hurry up: he knows the deadline is close, so he sends the first thing he can."],"answer":0,"why":"The books call these drivers, and this one is please others. He said yes to the slides and the references and the intro so nobody would be cross, and now the sorry keeps them calm without a file. Try hard would have attached something half done, and hurry up would have attached the draft.","traps":{"1":"Dean would picture a tired Sam working through the night and wait for the files. The apology would pass for effort and the Friday deadline would stay on Dean's shoulders.","2":"The group would blame the clock and add an alarm. Nobody would ask why Sam took on four jobs at once, so the next yes would make the next sorry."},"example":"A flatmate on a Sunday evening. He texts \u201cSo sorry, nearly there!\u201d about the bins and the bins are still full."}]}]}]};</script>

    if (s === undefined || s === null) return "";

    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);

      if (name === "br") return closing ? "" : "<br>";

      if (closing) {

      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {

      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
