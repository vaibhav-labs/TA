<script>window.TA_GAME = {"slot":"7.1","setting":"Home & Flatmates","title":"Help or Rescue","world":7,"worldName":"Free to Choose","week":7,"weekName":"Free to Choose","mechanic":"Diagnose","concept":"After this one you can tell helping from saving, so you stop doing other people's part of the work.","plainWord":"saving","bookTerm":"Rescue","bookIdea":"Steiner says you are rescuing when you do something for someone that you don't really want to do or when you put in more than half of the effort, and his rules for avoiding a rescue add that you should not help without a request or a contract, so any one of the three is enough.","bookSource":"Scripts People Live, ch. 11, 16 and 19","opener":{"setting":"Monday, 7:20am, Hawthorn Court, apartment 3B, the kitchen. The milk is in the fridge door and the bread is nearly gone.","lines":[{"who":"Sam","text":"\u201cMorning! You're a legend, you know that? Could you grab my lunch box off the counter? I'm already late.\u201d","cue":"half into his shoes, phone wedged under his chin"},{"who":"Maya","text":"\u201cIt's fine. I'm going past the gate anyway.\u201d","cue":"not looking up from the bread"}],"ask":"Which of these acts are helping, and which are saving?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Helping leaves the other person their share, and saving takes it. Three checks tell them apart: someone asked, you want to do it, and you are doing no more than half. If any one check fails, it is saving.","items":[{"type":"pick","who":"Maya","text":"\u201cSam's share of the electricity is short again. I've covered the gap from my account. Don't tell him, he's had a bad month.\u201d","cue":"stirring the lentils, back to you","options":["Helping","Saving"],"answer":1,"why":"Nobody asked Maya to pay Sam's bill, and she hid it from him. She is also carrying all of his share. That is saving, and the gap will open again next month with Maya alone to fill it.","traps":{"0":"Helping. It sounds kind, and the bill is paid. But nobody asked her to pay, and Sam never learns there was a bill, so the gap comes back next month."},"example":"Family WhatsApp group, Sunday night.<br>Uncle Mark: \u201cI've booked the cab for Gran's check-up, don't argue.\u201d<br>Cousin: \u201cOh, I was going to sort that.\u201d<br>Uncle Mark: \u201cToo late now.\u201d"},{"type":"pick","who":"Clara","text":"\u201cCan you read the second slide? Just that one. I'll fix the rest myself.\u201d","cue":"laptop balanced on her knees on the stairs","options":["Helping","Saving"],"answer":0,"why":"She asked for one slide and said she would do the rest. Reading that slide and saying what is unclear is help she can use, and the rest stays hers.","traps":{"1":"Saving. It sounds like pitching in, but she asked for one slide. Taking the whole deck would be more than half the work, and she would walk into the demo knowing nothing about her own slides."},"example":"Central station, platform 1, 7:40am.<br>Man: \u201cIs this the train to the coast? Just tell me that.\u201d<br>You: \u201cYes, that's the one.\u201d<br>He thanks you and walks off to find the coach himself."},{"type":"pick","who":"You","text":"\u201cLeave the pipeline with me. I'll fix it, write the notes and tell the client.\u201d","cue":"Omar had only asked you to look at one failing test","options":["Helping","Saving"],"answer":1,"why":"Omar asked for one test. You took the whole pipeline, the notes and the client call, which is more than half the work. That is saving. Omar gets a fixed build and none of the skill.","traps":{"0":"Helping. His back gets a rest, and the build works. But you have taken more than half the work for one failing test, and next time Omar won't even ask."},"example":"Badminton club, Saturday, 7:00am.<br>Captain: \u201cCould you bring the net? Just the net.\u201d<br>You: \u201cI'll bring the net and set up the courts.\u201d<br>Captain: \u201cWow. Thanks.\u201d Next week the courts are yours by default."},{"type":"pick","who":"Leo","text":"\u201cHear my spellings? Don't tell me the answer, okay?\u201d","cue":"holding the card upside down so he can't peek","options":["Helping","Saving"],"answer":0,"why":"He asked for a listener and set the rules himself. You say the word and wait while he spells it. The spelling stays his, and so does the learning.","traps":{"1":"Saving. Spelling the words for him would be doing the whole task, more than half of it, and he would learn that the answers come from grown-ups, not from his own head."},"example":"Tuition class, Tuesday, 5:30pm.<br>Teacher: \u201cRead the passage to yourself first.\u201d<br>Girl: \u201cCan you read it to me? I'll tell you when I get stuck.\u201d<br>Teacher: \u201cGood. Start, and I'll wait.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Now the options look alike. Run the checks one at a time: did anyone ask, do you want to do it, and who is carrying more than half?","items":[{"type":"pick","who":"Daniel","text":"\u201cI need the pricing section for the client deck by Thursday. You know it best. Can you take it?\u201d","cue":"tapping his laptop lid, already turning back to his screen. Last month you told him you dread pricing.","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":2,"why":"He asked, and he asked for one section, so the 'nobody asked' check and the 'more than half' check both pass. You dread pricing and said yes anyway. The check that fails is the one about wanting to do it.","traps":{"0":"Helping. He asked, and you said yes, so it looks like a favour. But you dread the pricing slides, and that dread turns into a short reply to his next email.","1":"Saving: more than half. Only one section of the deck is yours, so this check passes. Calling it that would make Daniel feel he has handed you the whole job.","3":"Saving: nobody asked. He did ask, and he asked you by name. This answer would turn a plain request into an accusation in his own project."},"example":"Parents' WhatsApp group, Thursday night.<br>Ella: \u201cCan someone do the snacks for Saturday? Only one of you, please.\u201d<br>Mei: \u201cI'll do them. I hate baking, but fine.\u201d<br>Ella: \u201cLovely.\u201d Mei bakes until midnight and says nothing."},{"type":"pick","who":"Gran","text":"\u201cCould you help me with the cupboard? Just the top shelf. My knees are not what they were.\u201d","cue":"steel plate in her hand, watching you carry the boxes down","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":1,"why":"She asked for the top shelf. You emptied the whole cupboard and carried everything down, which is more than half the work. That check fails, and she watched from the chair.","traps":{"0":"Helping. She did ask, and she is grateful. But the top shelf turned into the whole cupboard, and she never learns to do it herself.","2":"Saving: you do what you don't want to. Nothing in the scene says you minded the boxes, so this check passes. Saying it would make her feel like a burden.","3":"Saving: nobody asked. She did ask, for the top shelf. This answer misses the real point, which is that you did far more than she asked for."},"example":"Market by the bus stop, Saturday, 8:30am.<br>Vendor: \u201cCan you hold the scale while I weigh the onions?\u201d<br>You: \u201cSure. I'll bag them and carry them to your van.\u201d<br>Vendor: \u201cGood. Thank you.\u201d His son stays on the crate with a sausage roll."},{"type":"pick","who":"Mei","text":"\u201cCould you read my cover letter tonight? I've written it and cut it twice. I just need a second pair of eyes.\u201d","cue":"holding out her phone at the bus stop, thumb already on the draft. You like tidying other people's sentences.","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":0,"why":"She asked, she wrote the letter herself, and you enjoy this kind of job. You flag two sentences that drag and send it back. All three checks pass, so this is plain helping.","traps":{"1":"Saving: more than half. It would be if you rewrote the letter. But she asked for a read, she did the writing, and your share is two comments.","2":"Saving: you do what you don't want to. Nothing in the scene says you mind. You like this job, so that check passes.","3":"Saving: nobody asked. She asked you directly, and she named the job. That check passes too."},"example":"Garden fence, Sunday, 10:00am.<br>Neighbour: \u201cCould you hold the ladder while I fix the gutter? I'll do the climbing.\u201d<br>You: \u201cHappy to.\u201d He climbs, you steady the ladder, and you both have tea afterwards."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Time for the book's word. Steiner calls saving a rescue. First explain one, then sort four more acts from the flat.","items":[{"type":"pick","who":"Maya","text":"\u201cSam's late again. I've covered his share, so the flat doesn't have to fight. It's easier for everyone.\u201d","cue":"already writing the cheque","options":["Helping: the flat stays calm, and that is what a good flatmate does.","A rescue. Nobody asked Maya to pay, and she is carrying all of Sam's share, so his lateness never becomes his problem. Helping would be to tell Sam the number and leave the payment with him.","Not a rescue. Maya can afford it and doesn't mind, and Steiner counts it as a rescue only when you do something you don't want to do."],"answer":1,"why":"Two checks fail at once: nobody asked, and Maya is doing more than half, since she carries the whole share. Any one failure is enough. The cheque also keeps Sam's lateness going, because he never feels what it costs.","traps":{"0":"Helping: the flat stays calm, and calm is good. But Maya pays for that calm, and Sam never feels what being late costs him.","2":"Not a rescue. Steiner names more than one way into a rescue, and failing any of them is enough. A willing payer still rescues if nobody asked and she carries the whole share."},"example":"Office canteen, 1:10pm.<br>Colleague: \u201cI'll get the tea today. You can get the next round.\u201d<br>You: \u201cThanks.\u201d<br>Nobody checks who got the last three rounds, and the colleague starts treating it as the arrangement."},{"type":"sort","prompt":"Four more acts from the flat. Put each one where Steiner's checks place it.","bins":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"items":[{"text":"Sam asks Maya to check one clause in the lease about the deposit. She reads it, tells him what it means, and he writes the email himself.","answer":0,"why":"He asked, she wanted to, and her part was small. The email stays his, so every check passes."},{"text":"Sam is out. Maya tidies his room and sorts his post into piles. He never asked, and she enjoys tidying.","answer":3,"why":"She likes the job, so the 'want to' check passes. But nobody asked, and help that starts without a request takes over a space that was his."},{"text":"Sam asks for help with the budget sheet. Maya builds every tab, sets up the formulas and sends it back finished.","answer":1,"why":"He asked, and she was glad to. But she did all of the work, so the sheet is hers and Sam learns nothing about his own money."},{"text":"Sam asks if she'll come to his cousin's cricket final. She finds cricket dull and he can see it, but she says she'd love to.","answer":2,"why":"He asked, and she gave a small share of her day. The failing check is that she went along with something she didn't want to do, afraid he'd be hurt if she said no."}],"example":"Book group, Friday, 7:30pm.<br>Host: \u201cCould someone bring the wine?\u201d<br>You: \u201cI'll bring wine, cook the starter and wash up.\u201d<br>Host: \u201cLovely.\u201d Next month it is the same, and nobody else offers."}]}],"debrief":{"nadia":"Most help feels kind on the day you give it. Saving shows up weeks later, as a bill nobody signed and a person who never got the chance to learn what it costs. Before your hands move, ask who asked and whether you actually want to. Then ask whose half you are quietly taking.","bookTerm":"Rescue","bookNote":"The books call this a rescue. Steiner's two signs of one are doing something for someone that you don't want to do and putting in more than half of the effort. He adds that you should not help without a request, and he counts holding back what you want from someone as a rescue too."},"reflection":{"prompt":"What did you do for someone this week that nobody asked for? What did it cost you, and what did they never get the chance to learn for themselves?"},"next":"7.2","baseStory":{"setting":"Home & Flatmates","blurb":"Sam asks for small favours while Maya quietly covers the bigger gaps behind his back."},"moreStories":[{"setting":"Relationships","blurb":"Clara fixes Omar's flat before his sister's dinner, and a two-day-old text sits between them.","opener":{"setting":"Saturday, 10:15am. Omar's flat, the hallway. A stepladder, a screwdriver and a foil tray of lasagne on the shoe rack.","lines":[{"who":"Clara","text":"\u201cYour light has flickered since Tuesday, you said so. I've redone the fitting, and the lasagne is a spare. I made two, it's no trouble.\u201d","cue":"on the top step, a hair grip between her teeth"},{"who":"Omar","text":"\u201cI said it flickered. You haven't answered my text since Thursday.\u201d","cue":"holding the ladder very level, looking at the bulb"}],"ask":"Which of these acts are helping, and which are saving?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Helping leaves the other person their share, and saving takes it. Three checks tell them apart: someone asked, you want to do it, and you are doing no more than half. If any one check fails, it is saving.","items":[{"type":"pick","who":"Clara","text":"\u201cI took Omar's CV home and rewrote every line. It's much better. He doesn't need to read it first.\u201d","cue":"sliding a printout under his fruit bowl, smiling","options":["Helping","Saving"],"answer":1,"why":"Omar never asked for a rewrite, and Clara did every line of it. Two checks fail. The CV stops being his own account of his work.","traps":{"0":"Helping. It looks generous, and the CV may well read better. But the job was never offered to her, and Omar will sit in the interview unable to explain his own sentences."},"example":"Fish and chip shop, Friday.<br>Dad: \u201cI've filled your form in for you, it was quicker.\u201d<br>Son: \u201cI wanted to do the date of birth myself.\u201d<br>Dad: \u201cIt's done now.\u201d"},{"type":"pick","who":"Clara","text":"\u201cOmar asked me to read his cover letter and tell him if the second paragraph drags. Ten minutes with a pen. I like doing it.\u201d","cue":"already uncapping a red pen","options":["Helping","Saving"],"answer":0,"why":"He asked, she wants to, and her part is a read and a comment. The letter stays his, so all three checks pass.","traps":{"1":"Saving. It can feel like a trap because Clara is eager. But eager is not the same as unwilling, and the letter is still Omar's to write."},"example":"Bus stop, 8am.<br>Neighbour: \u201cCould you tell me if this email sounds rude?\u201d<br>You: \u201cA bit sharp in the second line.\u201d<br>Neighbour: \u201cThanks, I'll change it.\u201d"},{"type":"pick","who":"Clara","text":"\u201cHe asked me to come to his sister's engagement dinner. Four hours with his aunts, and there's a speech. I said I'd love to.\u201d","cue":"wincing at her phone, already choosing a dress","options":["Helping","Saving"],"answer":1,"why":"He asked, and her part is small. The check that fails is the one about wanting it. She says yes to a long evening she dreads, in case a no costs her his good opinion.","traps":{"0":"Helping. She was asked and she showed up, and turning up is often a kindness. But she is paying for it with an evening she dreads, and Omar thinks she is looking forward to it."},"example":"Playground, 3:15pm.<br>Parent: \u201cWould you mind running the cake stall on Saturday?\u201d<br>You: \u201cOf course, no problem.\u201d<br>On the way home you realise you booked a haircut."},{"type":"pick","who":"Omar","text":"\u201cClara asked me to hold the ladder while she did the light. I'm not going near the wiring. I'm holding the ladder.\u201d","cue":"gripping the sides, one foot on the bottom rung","options":["Helping","Saving"],"answer":0,"why":"She asked, he is willing, and he is doing a small part while she does the main job. The wiring stays hers and the ladder stays his.","traps":{"1":"Saving. He is not doing her job for her. He is holding a ladder at her request, and that leaves her fully in charge of the wiring."},"example":"Garden fence, Sunday.<br>Neighbour: \u201cCould you hold this panel while I knock the post in?\u201d<br>You: \u201cGo on.\u201d<br>He does the hammering, you do the holding, and it takes five minutes."}]},{"level":"Play","label":"Play, the week in motion","intro":"Now the options look alike. Run the checks one at a time: did anyone ask, do you want to do it, and who is carrying more than half?","items":[{"type":"pick","who":"Clara","text":"\u201cOmar's recycling box has been missed twice. I rang the council this morning and got him a new date. It took ten minutes and I like a good phone call. He's already bought the new bags.\u201d","cue":"tipping a bin liner into the kitchen bin, pleased with herself","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":3,"why":"Nobody asked her to ring the council, so that check fails. She wanted to, and the call was small, so the other two pass. Omar had it in hand with the bags, which is why the call is a take-over and not a share.","traps":{"0":"Helping. Ten minutes, a willing caller and a missed collection sorted. But Omar never said she could, and the call was his to make.","1":"Saving: more than half. She did the call, but the call was small and Omar was doing the rest. The amount is not what goes wrong here.","2":"Saving: you do what you don't want to. The cue says she likes a phone call like this one. The want check passes, so it cannot be the one that fails."},"example":"Housing estate, Saturday.<br>Neighbour: \u201cI phoned the lift engineer for you.\u201d<br>You: \u201cI was going to ring on Monday.\u201d<br>Neighbour: \u201cNow you don't have to.\u201d"},{"type":"pick","who":"Omar","text":"\u201cStuck on the toast for Yasmin's dinner. Would you tell me straight if the second page drags? Fifteen minutes on the phone, whenever suits.\u201d","cue":"reading it aloud to his own hallway wall first. You like speeches, and you are free tonight","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":0,"why":"He asked, you want to, and your part is a listen and a comment. The speech stays his. All three checks pass.","traps":{"1":"Saving: more than half. You would only be doing more than half if you took the draft and rewrote it. Here you are listening and answering.","2":"Saving: you do what you don't want to. The cue says you like speeches and have the evening free. Nothing in it is against your wishes.","3":"Saving: nobody asked. He asked you by name, with a time and a length. This answer would turn a plain request into an accusation."},"example":"Train carriage, 6pm.<br>Colleague: \u201cCan you listen to my pitch once on the way home?\u201d<br>You: \u201cGo on, from the top.\u201d<br>You nod, ask one question, and he writes it down."},{"type":"pick","who":"Omar","text":"\u201cStuck on the speech for Yasmin. Could you just write it for me? I'll read it out on Saturday and say thanks after.\u201d","cue":"forwarded with a shrug; you enjoy writing, and you would be happy to","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":1,"why":"He asked, and you would enjoy it, so two checks pass. But you would write all of it, and he would read out words he has never heard. That is more than half, and the speech stops being his own.","traps":{"0":"Helping. He asked and you want to, so it feels like a gift. But the speech is for his sister and written by you, and he will carry it in his jacket without knowing what it says.","2":"Saving: you do what you don't want to. The cue says you would be glad to write it, so the want check passes.","3":"Saving: nobody asked. He did ask, in so many words. This answer would be unfair on him."},"example":"Wedding planning, a phone call.<br>Bride: \u201cCould you write the vows for me? I can't think.\u201d<br>You: \u201cSure.\u201d<br>On the day she reads them out and your phrases land oddly in her mouth."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Time for the book's word. Steiner calls saving a rescue. First explain one, then sort four more acts.","items":[{"type":"pick","who":"Clara","text":"\u201cOmar's text about Sunday is still waiting. But I've ironed his shirt for Yasmin's dinner, booked his taxi and printed a seating plan with a note for each aunt. Once he's sorted, I'll reply.\u201d","cue":"one thumb hovering over his unanswered message","options":["A rescue. Omar did not ask for any of it, and Clara is carrying all of the preparation, so his own dinner has become her job. It also stands in for the plain reply that he is still waiting for.","Helping: the shirt, the taxi and the plan make an evening easier for a man who is nervous, and that is what a good partner does for him.","Not a rescue. Clara is doing it out of kindness and plainly wants to, and Steiner counts a rescue only when you do something you don't want to do."],"answer":0,"why":"Two checks fail at once: nobody asked, and Clara carries the whole of the preparation. Any one failure is enough. The work also lets her put off the one thing Omar did ask, which was a text.","traps":{"1":"Helping: the shirt and the taxi are a kindness. But Omar never asked, and kindness is not the test. He is left waiting for a text while she presses his collar.","2":"Not a rescue. Steiner names more than one way into a rescue, and failing any of them is enough. Wanting to do it does not rescue her from the other two."},"example":"Office kitchen, 9am.<br>Colleague: \u201cI've drafted your reply to the client.\u201d<br>You: \u201cI haven't even read the email yet.\u201d<br>Colleague: \u201cI know, I didn't want you to worry.\u201d"},{"type":"sort","prompt":"Four more acts from Omar and Clara's week. Put each one where Steiner's checks place it.","bins":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"items":[{"text":"Omar asks Clara to explain the pension form from work. She talks him through each box once and he fills it in himself.","answer":0,"why":"He asked, she was glad to, and her part was an explanation. The form stays his, so every check passes."},{"text":"Omar asks if she'll look over his tax form. She takes it home, fills in every box and sends it back with a smile.","answer":1,"why":"He asked, and she was glad to. But she did all of the work, so the form is hers and Omar learns nothing about his own money."},{"text":"Omar asks if she'll spend Sunday at his uncle's model railway fair. She finds it dull and he can see it, but she says she'd love to.","answer":2,"why":"He asked, and she gave one day. The check that fails is that she went along with something she didn't want to do, afraid he'd be hurt if she said no."},{"text":"Clara sees that Omar's bike chain is rusty. While he is in the shower she oils it, adjusts the brakes and retapes the bars. She enjoys it.","answer":3,"why":"She likes the job, so the want check passes. But nobody asked, and help that starts without a request takes over a job that was his."}],"example":"Book group, Friday, 7:30pm.<br>Host: \u201cCould someone bring the wine?\u201d<br>You: \u201cI'll bring wine, cook the starter and wash up.\u201d<br>Host: \u201cLovely.\u201d Next month it is the same, and nobody else offers."}]}]},{"setting":"School & College","blurb":"Brenda finishes Sam's section of a group poster the night before it is due, and nobody asked her to.","opener":{"setting":"Thursday, 6:40pm. The library, second floor, the table by the radiator. The group poster is due at nine tomorrow and the radiator ticks.","lines":[{"who":"Brenda","text":"\u201cI've done your section. Same colours as mine, so nobody sees the join. Go home, Sam, you look wrecked.\u201d","cue":"peeling a label off a stapler, her laptop open on both columns"},{"who":"Sam","text":"\u201cAre you sure? I was going to do it. I was going to start at seven.\u201d","cue":"already zipping his bag"}],"ask":"Which of these acts are helping, and which are saving?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Helping leaves the other person their share, and saving takes it. Three checks tell them apart: someone asked, you want to do it, and you are doing no more than half. If any one check fails, it is saving.","items":[{"type":"pick","who":"Tuan","text":"\u201cSam asked if I'd check that his references are in the right order. Two minutes. Sure.\u201d","cue":"scrolling down Sam's bibliography, glad of the break","options":["Helping","Saving"],"answer":0,"why":"Sam asked, Tuan is willing, and the job is two minutes of checking. The references stay Sam's, so all three checks pass.","traps":{"1":"Saving. Tuan is not rewriting anything. He is checking an order at Sam's request, and the bibliography stays Sam's work."},"example":"Allotment, Saturday.<br>Neighbour: \u201cCan you look at my bean rows and say if they're straight?\u201d<br>You: \u201cThird one wanders.\u201d<br>Neighbour: \u201cHa, I'll move it.\u201d"},{"type":"pick","who":"Brenda","text":"\u201cI've reworded your whole conclusion so it flows with mine. You didn't ask, but it'll save you the stress.\u201d","cue":"already pasting it in, not looking up","options":["Helping","Saving"],"answer":1,"why":"Sam never asked for a rewrite, and Brenda wrote the whole conclusion. Two checks fail. The last paragraph of the poster is no longer his.","traps":{"0":"Helping. It sounds like a favour, and the conclusion may read smoothly. But Sam never learns how to write his own ending, and Brenda's name is on the next one too."},"example":"Family kitchen, Sunday.<br>Aunt: \u201cI've rewritten your CV, it reads much better.\u201d<br>Cousin: \u201cI only wanted a second pair of eyes.\u201d<br>Aunt: \u201cWell, it's done now.\u201d"},{"type":"pick","who":"Tuan","text":"\u201cMs Hollis asked who'd present the poster at the open evening. Everyone looked at the floor, so I said I would. I'd rather clean the lab.\u201d","cue":"tugging his sleeve down over his wrist","options":["Helping","Saving"],"answer":1,"why":"She asked, and presenting is one slot among several. The check that fails is wanting it. He took a job he'd rather skip, so the silence in the room ended with him.","traps":{"0":"Helping. He was asked and he said yes, and filling a gap feels generous. But he will be dreading Tuesday evening, and the group thinks he is happy to do it."},"example":"School gate, 8:50am.<br>Teacher: \u201cWho can help with the cake stall?\u201d<br>Parent: \u201cI can.\u201d<br>She had planned a quiet day and spends it in the hall."},{"type":"pick","who":"Ms Hollis","text":"\u201cSend me a draft by Tuesday and I'll write questions in the margins. The next version is yours.\u201d","cue":"pen behind her ear, handing back a feedback sheet","options":["Helping","Saving"],"answer":0,"why":"Sam has asked for feedback, she enjoys giving it, and the writing stays with him. The margins hold her questions and the pages stay his.","traps":{"1":"Saving. She is not writing his essay. She asks questions and leaves the answers to him."},"example":"Football club, Saturday.<br>Coach: \u201cSend me a clip of your serve and I'll tell you what I see.\u201d<br>Player: \u201cThanks.\u201d<br>He films it and sends it. The practising is still his."}]},{"level":"Play","label":"Play, the week in motion","intro":"Now the options look alike. Run the checks one at a time: did anyone ask, do you want to do it, and who is carrying more than half?","items":[{"type":"pick","who":"Brenda","text":"\u201cSam's section needs a second pair of eyes. Can you stay till ten tonight to check it against the marking sheet? Be honest, it's a long night.\u201d","cue":"tapping the sheet; you wanted to be on the nine o'clock bus, and your coat is already on","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":2,"why":"She asked, and checking one section is a small share. The check that fails is that you would rather go home. If you say yes to keep her happy, you pay for it with a night you wanted.","traps":{"0":"Helping. She asked, it is a small job, and Sam's section needs checking. But the cue says you would rather be on the bus, and a yes given to keep the peace is not a wanted one.","1":"Saving: more than half. You would check, not write, so your part is small. The amount is fine here.","3":"Saving: nobody asked. Brenda asked you by name, with a time. This answer would turn a plain request into an accusation."},"example":"Office corridor, 5:30pm.<br>Manager: \u201cCould you stay for the late call? Only an hour.\u201d<br>You: \u201cOf course.\u201d<br>You text your sister to cancel the cinema and resent the call."},{"type":"pick","who":"Tuan","text":"\u201cSam hasn't answered the group chat since Monday. I emailed Ms Hollis to say he's ill and asked her to move his deadline. He'll be relieved. It took one email and I like emailing.\u201d","cue":"scrolling the group chat with the screen turned to you","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":3,"why":"Nobody asked Tuan to email the tutor, and Sam didn't even say he was ill. Tuan wanted to and the email was small, so those two pass. The one that fails is the invitation.","traps":{"0":"Helping. One email, a willing sender and a deadline moved. But Sam may not be ill, and Tuan has spoken for him without being asked.","1":"Saving: more than half. One email is not more than half of a project. The size of the job is not what is wrong.","2":"Saving: you do what you don't want to. The cue says Tuan likes emailing, so the want check passes."},"example":"Flat shares, Tuesday.<br>Flatmate: \u201cI told the landlord you'd pay late. I knew you'd be short.\u201d<br>You: \u201cI wasn't short.\u201d<br>Flatmate: \u201cOh. Well, now it's said.\u201d"},{"type":"pick","who":"Sam","text":"\u201cI've done the intro and the method. I'm stuck on the stats table. Could you show me how to do the totals row, and I'll do the rest?\u201d","cue":"his screen turned to you, the table three rows from empty. You like spreadsheets, and the library stays open another hour","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":0,"why":"He asked, you want to, and you would show him one thing while he does the rest. The table stays his. All three checks pass.","traps":{"1":"Saving: more than half. You would only be doing more than half if you filled in the table. Here you are showing a method.","2":"Saving: you do what you don't want to. The cue says you like spreadsheets and have time. Nothing in it goes against you.","3":"Saving: nobody asked. Sam asked you directly. This answer would be unfair on him."},"example":"Kitchen table, evening.<br>Daughter: \u201cShow me how to do long division and I'll try the rest.\u201d<br>Parent: \u201cRight, watch this one.\u201d<br>She does the next three herself."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Time for the book's word. Steiner calls saving a rescue. First explain one, then sort four more acts.","items":[{"type":"pick","who":"Brenda","text":"\u201cSam's reflection essay is due Friday. He says he'll write it tonight. He won't. So I've written it in his voice, and he can sign it. Ms Hollis will never know.\u201d","cue":"closing her laptop with a decided click","options":["Not a rescue. Brenda is doing it out of kindness and plainly wants to help, and Steiner counts a rescue only when you do something you don't want to do, which is not the case here.","Helping: Sam is struggling, Brenda has the time, and the essay is done. A group member who steps in is just being a good friend.","A rescue. Sam did not ask, and Brenda is writing the whole essay, so his reflection on his own course is hers. Helping would be to offer him an hour of her company while he writes it."],"answer":2,"why":"Two checks fail at once: nobody asked, and Brenda is doing all of the work. Any one failure is enough. Sam will sign an essay about his own learning that he has never read.","traps":{"0":"Not a rescue. Steiner names more than one way into a rescue, and failing any of them is enough. Wanting to help does not rescue her from the other two.","1":"Helping: she has the time and he is struggling. But kindness is not the test. Sam never asked, and he ends up with a signature on words he did not write."},"example":"Group chat, Monday.<br>Friend: \u201cI've booked your driving test for you.\u201d<br>You: \u201cI haven't decided yet.\u201d<br>Friend: \u201cYou will, though. I've put you down for Friday.\u201d"},{"type":"sort","prompt":"Four more acts from the evening class. Put each one where Steiner's checks place it.","bins":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"items":[{"text":"Sam asks Tuan how to cite a website. Tuan shows him the format once and Sam types the reference himself.","answer":0,"why":"He asked, Tuan was glad to, and the part was small. The reference stays Sam's, so every check passes."},{"text":"Sam asks Brenda to look at his poster layout. She rebuilds it overnight from scratch and sends it back finished.","answer":1,"why":"He asked, and she was glad to. But she did all of the work, so the poster is hers and Sam learns nothing about layout."},{"text":"Ms Hollis asks who will run the sign-up sheet for the field trip. Tuan hates admin and says he'd be glad to.","answer":2,"why":"She asked, and the job is small. The check that fails is that he took something he didn't want, because the silence in the room felt worse."},{"text":"Brenda sees Sam's half-finished table in the shared document. Without a word she completes it, because she likes tables.","answer":3,"why":"She likes the job, so the want check passes. But nobody asked, and finishing someone's work unprompted takes away their chance to finish it."}],"example":"Neighbours' street, Saturday.<br>Neighbour: \u201cI've weeded your front bed.\u201d<br>You: \u201cI was going to do it tomorrow.\u201d<br>Neighbour: \u201cNow you have your Sunday free.\u201d"}]}]},{"setting":"Work","blurb":"The night before a release, Clara does Sam's job and Daniel does everyone else's.","opener":{"setting":"Wednesday, 4:50pm. Halden, the team room. The release is at ten tomorrow and one laptop has a red screen.","lines":[{"who":"Daniel","text":"\u201cWho owns the migration script? Anyone? I'll do it myself if I have to.\u201d","cue":"marker pointed at the whiteboard, not at a person"},{"who":"Clara","text":"\u201cIt's done. Don't worry about it. I finished Sam's tickets at lunch and his test notes.\u201d","cue":"not looking up, nine tabs open"}],"ask":"Which of these acts are helping, and which are saving?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Helping leaves the other person their share, and saving takes it. Three checks tell them apart: someone asked, you want to do it, and you are doing no more than half. If any one check fails, it is saving.","items":[{"type":"pick","who":"Clara","text":"\u201cSam's release notes were a mess, so I rewrote all of them last night. Nobody needs to know.\u201d","cue":"a sticky note over the file name","options":["Helping","Saving"],"answer":1,"why":"Nobody asked her to rewrite the notes, and she wrote every one. Two checks fail. Sam never finds out what his notes lacked.","traps":{"0":"Helping. The notes are better now, and Clara meant well. But Sam never asked, and he will go on writing them the old way."},"example":"Corridor, Friday.<br>Colleague: \u201cI tidied your slides last night.\u201d<br>You: \u201cThey were fine.\u201d<br>Colleague: \u201cNow they're better.\u201d"},{"type":"pick","who":"Omar","text":"\u201cYou asked me to look at one failing test. It's the date format on line forty. The fix is yours if you want it.\u201d","cue":"leaning back, mug in hand","options":["Helping","Saving"],"answer":0,"why":"You asked, he wanted to, and his part was spotting one line. The fix stays yours. All three checks pass.","traps":{"1":"Saving. Omar is not taking over the test. He pointed at one line and left the rest to you."},"example":"Garage, Saturday.<br>Neighbour: \u201cHave a look, it's the belt, I think.\u201d<br>Mechanic: \u201cYes, that one. You can swap it.\u201d<br>He hands over the spanner."},{"type":"pick","who":"Sam","text":"\u201cCould you show me how to roll back the build? If it breaks on Thursday, I'll do it myself.\u201d","cue":"notebook open, pen ready","options":["Helping","Saving"],"answer":0,"why":"He asked, you want to, and you would be showing one thing once. The rollback stays his. All three checks pass.","traps":{"1":"Saving. Showing someone a method they will run leaves the job in their hands."},"example":"Bike shop, Sunday.<br>Customer: \u201cCould you show me how to fix a flat?\u201d<br>Mechanic: \u201cWatch this once.\u201d<br>He does the next one himself."},{"type":"pick","who":"Daniel","text":"\u201cNobody's booked the client dial-in. I'll do it, it's quicker. I'll do the agenda as well, and chase their lawyer.\u201d","cue":"typing already, a sigh at the end of each line","options":["Helping","Saving"],"answer":1,"why":"Nobody asked him to take it, and he is taking the lot. He also sighs at every line, which says he'd rather not. Several checks fail at once.","traps":{"0":"Helping. Someone has to do it, and he is the one with the authority. But the sighing says he'd prefer not to, and the team learns that Daniel will pick up anything."},"example":"Parent chat, Sunday.<br>Parent: \u201cI'll organise the whole trip, forget the rota.\u201d<br>Others: \u201cGreat.\u201d<br>By Wednesday she is exhausted and nobody else knows the dates."}]},{"level":"Play","label":"Play, the week in motion","intro":"Now the options look alike. Run the checks one at a time: did anyone ask, do you want to do it, and who is carrying more than half?","items":[{"type":"pick","who":"Sam","text":"\u201cCould you take the whole export bug off me? I haven't started. I'll owe you a coffee.\u201d","cue":"hands pressed together; you like bugs, and Thursday is quiet for you","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":1,"why":"He asked, and you would enjoy it. But the ticket is his entire job, so you would carry more than half, and Sam would go through Thursday without learning the module.","traps":{"0":"Helping. He asked and you want to, so it reads as a favour between colleagues. But taking the whole ticket leaves Sam with nothing to learn.","2":"Saving: you do what you don't want to. The cue says you like bugs, so the want check passes.","3":"Saving: nobody asked. He asked you directly, with an offer of coffee. This answer would turn a plain request into an accusation."},"example":"Neighbour's door, Monday.<br>Neighbour: \u201cCould you do my whole tax return? I'll buy you lunch.\u201d<br>You: \u201cSure.\u201d<br>She never opens the form again."},{"type":"pick","who":"Daniel","text":"\u201cRelease night, I need someone on call from nine to midnight. Clara did last time and Omar the time before. You're the only one left. You don't mind, do you?\u201d","cue":"the question is an answer; you have a dentist at eight and hoped for an early night","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":2,"why":"He asked, and the slot is three hours, so a small share. The check that fails is that you would rather not, and his last question makes a no hard to say.","traps":{"0":"Helping. He asked and the slot is fair. But the cue says you would rather not, and a yes given under pressure is not a wanted one.","1":"Saving: more than half. One slot is not the majority of the release night. The size is fine.","3":"Saving: nobody asked. He asked you by name. This answer would turn a plain request into an accusation."},"example":"Staff room, 3pm.<br>Head: \u201cYou don't mind covering Friday, do you?\u201d<br>You: \u201cNo, of course.\u201d<br>You cancel your plans and say nothing."},{"type":"pick","who":"Daniel","text":"\u201cI merged Sam's branch myself, fixed the typo in the config and cleared the conflict. I like a clean history. Nobody had to ask.\u201d","cue":"wiping the whiteboard with a flourish","options":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"answer":3,"why":"Nobody asked him to touch Sam's branch. He wanted to, and the fix was small, so the other two checks pass. The one that fails is the request.","traps":{"0":"Helping. The typo is gone and the history is clean. But Sam's branch was Sam's to fix, and he never learns about the conflict.","1":"Saving: more than half. A typo and a conflict are small. Quantity is not where it fails.","2":"Saving: you do what you don't want to. The cue says he likes a clean history, so the want check passes."},"example":"Flat landing, Sunday.<br>Neighbour: \u201cI fixed your door so it stops sticking.\u201d<br>You: \u201cI like that door the way it is.\u201d<br>Neighbour: \u201cOh. Well, too late.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Time for the book's word. Steiner calls saving a rescue. First explain one, then sort four more acts.","items":[{"type":"pick","who":"Clara","text":"\u201cSam says he'll write his demo tonight. He won't. So I've written it, and I'll put his name on the slides. Daniel won't see a gap.\u201d","cue":"the cursor blinking in a slide that says Sam at the bottom","options":["Not a rescue. Clara is choosing to do it, she is plainly willing, and Steiner counts a rescue only when you do something you don't want to do, so her willingness settles the question.","A rescue. Nobody asked Clara, and she is writing all of Sam's demo, so Sam never has to say he can't and Daniel never sees the gap. Helping would be to offer Sam an hour of her time and let him write it.","Helping: Sam is behind, Clara is good at slides, and the demo is saved. A strong colleague is expected to step in."],"answer":1,"why":"Two checks fail at once: nobody asked, and Clara is doing all the work. Any one failure is enough. Sam never has to say he is behind, and Daniel believes he is on track.","traps":{"0":"Not a rescue. Steiner names more than one way into a rescue, and failing any of them is enough. Wanting to do it does not rescue Clara from the other two.","2":"Helping: Clara is good at slides and the demo is done. But no one asked, and Sam's problem is hidden. Next release he does the same."},"example":"Canteen, Thursday.<br>Colleague: \u201cI filled in your timesheet. You were slow.\u201d<br>You: \u201cI would have told them.\u201d<br>Colleague: \u201cNow you don't have to.\u201d"},{"type":"sort","prompt":"Four more acts from the release week. Put each one where Steiner's checks place it.","bins":["Helping","Saving: more than half","Saving: you do what you don't want to","Saving: nobody asked"],"items":[{"text":"Omar asks Clara to explain how the deployment checklist works. She walks him through it once and he runs it himself.","answer":0,"why":"He asked, she was glad to, and her part was an explanation. The run stays his, so every check passes."},{"text":"Sam asks Clara for help with the rollback plan. She writes every step and sends it back finished.","answer":1,"why":"He asked, and she was glad to. But she did all of the work, so the plan is hers and Sam reads it for the first time in the meeting."},{"text":"Daniel asks who will take the minutes on the client call. Nobody speaks. Sam, who hates it, says he will.","answer":2,"why":"Daniel asked, and the job is small. The check that fails is that Sam took something he didn't want to do, because the quiet felt worse."},{"text":"Clara notices Omar's folder of test scripts is untidy. Before anyone is in she renames the files, rewrites the comments and deletes duplicates. She enjoys it.","answer":3,"why":"She likes the job, so the want check passes. But nobody asked, and Omar's way of filing was his to keep or change."}],"example":"Allotment shed, Saturday.<br>Neighbour: \u201cI've sorted your seed tins into rows.\u201d<br>You: \u201cI knew where everything was.\u201d<br>Neighbour: \u201cIt looks tidier now.\u201d"}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://claude.ai/artifact/FzdEytVBojsBteGVMXXV4K","next":{"slot":"7.2","title":"A Deal That Holds","url":"https://claude.ai/artifact/A4qJnVuGrgm46BSSVW4rXE"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: MULTI ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
</body>
