<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Voice Bars · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }
  button.ghost { color: var(--text); border-color: rgba(255, 255, 255, 0.25); }
  .val { background: var(--surface-3); color: var(--text); }

<script>window.TA_GAME = {"slot":"2.3","setting":"Home & Flatmates","title":"Your Voice Bars","world":2,"worldName":"Who's Talking","week":2,"weekName":"Who's Talking","mechanic":"Build","concept":"After this one you can read your own five-bar voice-print, and say which bar is tallest this month and what filled it.","plainWord":"your voice-print","bookTerm":"Egogram","bookIdea":"An egogram is a bar chart devised by Jack Dusay: one bar for each of the five functional parts, its height showing roughly how much of the time a person uses that part. It is drawn by intuition, and it can change.","bookSource":"TA Today, ch. 3","opener":{"setting":"Wednesday, 21:30, 3B, your room. The phone is face up on the bed.","lines":[{"who":"The app","text":"\u201cThis is you, so far. Not forever. This month.\u201d","cue":"five bars on the screen, each filled to a different height"}],"ask":"Which of the five bars is tallest in you this month, and which of your own choices filled it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> each card is one line from your week. Drop it into the bar it came from. The five bars are the Strict Boss, the Caring Boss, the Pilot, the Wild Kid and the Good Kid.","items":[{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cDid you eat, love? Eat something, you're too thin.\u201d","answer":1,"why":"Worry dressed as a question about food. The soft voice and \u201ctoo thin\u201d are the Caring Boss, the Boss in its gentle face."},{"text":"\u201cThe build's green, I'm merging it now.\u201d","answer":2,"why":"A status and an action. Nothing in it is about whether anyone is good enough. That is the Pilot."},{"text":"\u201cShoes off at the door, every time. I don't want to hear why.\u201d","answer":0,"why":"A rule with no reason attached, and the questions shut out before they start. That is the Strict Boss, and the only way is its way."},{"text":"\u201cScrew the budget, I want the blue one now, and I'll sort the money later!\u201d","answer":3,"why":"Wanting it now and waving the cost away. That is the Wild Kid, which grabs the thing and leaves the bill for later."},{"text":"\u201cSorry, you've got the window seat. I'm fine in the middle, it's nothing.\u201d","answer":4,"why":"She gives up the better seat before anyone asks, and calls the sacrifice nothing. That is the Good Kid, which keeps the peace at her own expense."}]},{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cDo it properly the first time, the way I showed you.\u201d","answer":0,"why":"A standard handed down as the only right way, with no reason given. That is the Strict Boss, with no warmth at all."},{"text":"\u201cSorry, it's probably wrong, ignore me.\u201d","answer":4,"why":"She gives her own point away before anyone has heard it. That is the Good Kid, which gives up the view to keep the peace."},{"text":"\u201cYou're going out in that jacket? Take a jumper, love, you'll catch a chill, and I'll be the one nursing you.\u201d","answer":1,"why":"The worry is real, and the jumper is an order with the care wrapped round it. That is the Caring Boss, which is warm and still tells you what to wear."},{"text":"\u201cThe invoice is in the folder, two pages, and the total is this month's bill.\u201d","answer":2,"why":"A figure and a place to find it, with no verdict on anyone. That is the Pilot, which reports what is there."},{"text":"\u201cLet's drive to the coast tonight! Who needs leave, I'll sort it out by Monday.\u201d","answer":3,"why":"A plan made in the moment, with the leave and the cost left for later. That is the Wild Kid, the want that skips the checks."}]},{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cSkip the stand-up, let's go for tea. Come on, live a little!\u201d","answer":3,"why":"Wanting something now and waving the rules away. That is the Wild Kid, the part that wants and never checks the cost."},{"text":"\u201cThe bus leaves at 7:10, so we walk to the stop now.\u201d","answer":2,"why":"A time and a next step. Nothing in it judges anyone or asks for anything. That is the Pilot again, which deals with the bus."},{"text":"\u201cLate again. On time means on time, and I don't want to hear an excuse.\u201d","answer":0,"why":"A rule stated as the only right way, with the excuse shut out before it is spoken. That is the Strict Boss, the standard with no room for a reason."},{"text":"\u201cCome here, let me fix your collar before you go in. Wear the grey, it suits you.\u201d","answer":1,"why":"The collar is care, and the grey is an instruction. That is the Caring Boss. It is soft in tone and still decides what you wear."},{"text":"\u201cSorry, I'm early, I'll wait outside so you don't have to move.\u201d","answer":4,"why":"An apology for arriving early, and an offer to disappear. That is the Good Kid, small and quick, and it makes room before anyone has asked."}]}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now the phone.<\/b> Mum is on the line. She asks: \u201cDid you eat? Have you made friends? Your father\u2026\u201d Pick the voice behind each reply.","items":[{"type":"pick","who":"You, on the phone to Mum, Wednesday night","text":"\u201cI ate, I'm fine, everyone's fine.\u201d","cue":"bright and quick, closing the subject before she starts","options":["The Strict Boss","The Pilot","The Wild Kid","The Good Kid"],"answer":3,"why":"It agrees and closes the door on the subject. Nothing gets said, and the peace is kept. That is the Good Kid, which learned that agreeing keeps it safe.","traps":{"0":"The Strict Boss would be a ruling: \u201cMum, enough, I'm fine, end of.\u201d That is an order, and it ends the call harder than it needs to.","1":"The Pilot would be specific: \u201cI ate at eight, I'm tired, I'll ring you on Sunday.\u201d It gives her facts and leaves the call open.","2":"The Wild Kid would blurt out something playful: \u201cMum, I had cake for dinner and I'd do it again!\u201d That is the uncensored want, and it skips her question."},"example":"A family WhatsApp group, a cousin asks whether the flight landed: \u201cYes yes, all good, everything's fine!\u201d<br>Nobody learns whether the flight was late, and nobody asks again."},{"type":"pick","who":"You, on the phone to Mum, Wednesday night","text":"\u201cMum, I'm okay. Tell me how your knee scan went. You keep changing the subject off it.\u201d","cue":"calm, a real question about the scan","options":["The Strict Boss","The Pilot","The Wild Kid","The Good Kid"],"answer":1,"why":"It says the true thing, that you are okay, and then asks a real question about the scan. The call stays on facts and on her. That is the Pilot, the voice that deals with what is actually here.","traps":{"0":"The Strict Boss would give an order: \u201cMum, that's enough about my eating. Stop checking on me.\u201d It shuts her out and turns her worry into a telling-off.","2":"The Wild Kid would leap to something else: \u201cMum, guess what, there's a fox in the car park!\u201d The call gets lively, and the scan never comes back up.","3":"The Good Kid would apologise and move on: \u201cSorry, Mum, I'll tell you about it next time.\u201d The scan drops out of the call, and nobody has to say how it went."},"example":"A family WhatsApp group, a brother to his sister, who keeps asking whether he has eaten: \u201cI've eaten, I'm okay. How did Dad's check-up go? You keep changing the subject.\u201d<br>He answers once, then asks the question he actually wants answered."},{"type":"pick","who":"You, on the phone to Mum, Wednesday night","text":"\u201cCan you not interrogate me for one call?\u201d","cue":"level, both hands flat on the table","options":["The Strict Boss","The Caring Boss","The Wild Kid","The Good Kid"],"answer":0,"why":"A limit set in a firm voice, with no sigh and no apology. That is the Strict Boss on its healthy side: it states the boundary and does not punish her for asking.","traps":{"1":"The Caring Boss would wrap the limit in care: \u201cMum, I love your questions, just one at a time.\u201d That is kind, but the line you said has no softening in it.","2":"The Wild Kid would say it loud and fast, laugh, and hang up: \u201cNo more questions, I'm switching you off, bye!\u201d It says what it feels the second it feels it, and the call is over before she can answer.","3":"The Good Kid would apologise and fold: \u201cSorry, Mum, sorry, I'm just tired.\u201d The limit disappears and the call goes the way she wants."},"example":"A school gate, a teacher to a parent who keeps asking the same question: \u201cLet's take one question at a time, please.\u201d<br>A firm line with no insult in it, and nothing to apologise for."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"<b>Build Gran's voice-print.<\/b> Ten lines from the landlady, one bar each. Count each bar: the tallest is the voice used most in these lines, which is a rough guide and not a measurement.","items":[{"type":"sort","prompt":"Drop each of Gran's ten lines into its bar, then count.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cEat, eat, you'll be ill if you don't, and then who will I feed?\u201d","answer":1,"why":"Care that is also a little bossy. The Caring Boss feeds people and tells them what to do."},{"text":"\u201cIn my time you stood up when an elder came in. Nobody stands now.\u201d","answer":0,"why":"A standard judged against the past, with the verdict already given. That is the Strict Boss."},{"text":"\u201cDon't mind me, I'll sit here, I'm only the landlady.\u201d","answer":4,"why":"She makes herself small so nobody has to make room for her. That is the Good Kid."},{"text":"\u201cMy knees are finished, the building society has put the price up, and the doctor says stop the stairs.\u201d","answer":2,"why":"A list of facts about the situation, with nothing judged. That is the Pilot."},{"text":"\u201cHa! Did you see his face? I'll tell the whole building, let them talk!\u201d","answer":3,"why":"Delight and mischief, with no check on what follows. That is the Wild Kid."},{"text":"\u201cTake the good chair, love, I'll manage on the stool.\u201d","answer":4,"why":"Giving up her own comfort so the young one keeps the good chair. The Good Kid again, quiet and accommodating."},{"text":"\u201cThe tanker came at six. I checked the notice board, as usual.\u201d","answer":2,"why":"She checked a fact and reported it. That is the Pilot, which gathers information."},{"text":"\u201cOh, don't tell me it's cold, I know it's cold, you'll learn when you're my age.\u201d","answer":0,"why":"A verdict on the young person, with \u201cyou'll learn\u201d built in. That is the Strict Boss."},{"text":"\u201cOh, I'll cook the chicken tonight, sorry, I know you don't like it, sorry.\u201d","answer":4,"why":"An apology comes before anyone has complained. The Good Kid again: small and quick, sorry in advance."},{"text":"\u201cTemple on Sunday, everyone! Take the car and forget the schedule!\u201d","answer":3,"why":"A wish for now, with the plan thrown out. That is the Wild Kid."}]},{"type":"pick","who":"A friend, after you show your bars","text":"\u201cSo you're just a pushover, then. Your Good Kid bar is the tallest.\u201d","cue":"teasing, pleased to have caught you","options":["A fixed fact about your character","A tall Good Kid bar this month, which is information to use","Proof that your Pilot is missing"],"answer":1,"why":"Your voice-print is a rough picture of how much of your time each voice takes this month. A tall Good Kid bar is data: it tells you which voice is doing most of the talking, and the Good Kid is also where good manners live, so a tall bar is not automatically a problem.","traps":{"0":"Calling it fixed treats one month's bar as a life sentence. A voice-print is a rough picture that you can redraw, and it shifts when you practise a different voice, so it cannot be a fixed fact.","2":"A tall bar does not mean the Pilot is missing. The Pilot is one bar of five, and it can be loud too, which the friend has not checked."},"example":"A cricket group chat, a teammate after you drop an easy catch: \u201cYou always let the ball go, you're hopeless.\u201d<br>One dropped catch is one line this week, not the whole chart."}]}],"debrief":{"nadia":"Each of us has all five bars, and their heights change with the month. A tall bar is information to read. Gran's tallest bar is the Good Kid, and yours is worth comparing with hers.","bookTerm":"Egogram","bookNote":"The books call this an egogram, a bar chart devised by Jack Dusay. Each of the five functional parts gets a bar, drawn by intuition to show roughly how much of your time it takes, and you can redraw it as you change."},"reflection":{"prompt":"Think about the last time you felt tired at work or at home. Which bar was tallest in you then, and did it help you or hurt you?"},"next":"2.4","baseStory":{"setting":"Home & Flatmates","blurb":"At the flat, you answer Mum's phone call and chart the landlady's voice, Gran's, line by line."},"moreStories":[{"setting":"Work","blurb":"Daniel needs a name for Friday's release before anyone leaves, and Clara has already offered.","opener":{"setting":"Thursday, 17:40. Halden, the team room. Friday's release is at ten tomorrow.","lines":[{"who":"Daniel","text":"\u201cWhoever merges tomorrow owns the rollback. I'd like a name before anyone leaves.\u201d","cue":"tapping a marker against a cold mug"},{"who":"Clara","text":"\u201cI'll do it. I've already written the checklist. It's four pages.\u201d","cue":"pulling her chair toward your desk before you have looked up"},{"who":"The app","text":"\u201cThis is you, so far. Not forever. This month.\u201d","cue":"five bars on the phone under the edge of your desk, each filled to a different height"}],"ask":"Which of the five bars is tallest in you this month, and which of your own choices filled it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> each card is one line from this week. Drop it into the bar it came from. The five bars are the Strict Boss, the Caring Boss, the Pilot, the Wild Kid and the Good Kid.","items":[{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cYou've been on that ticket since nine. Eat something, I'll watch the deploy.\u201d","answer":1,"why":"Worry about whether you ate, and an instruction tucked inside it. That is the Caring Boss, warm and still deciding for you."},{"text":"\u201cStaging finished at 16:52. Two warnings, both old.\u201d","answer":2,"why":"A time and a count, with no verdict on anyone. That is the Pilot, which reports what is there."},{"text":"\u201cNobody merges on a Friday without a second reviewer. That's the rule and I'm not discussing it.\u201d","answer":0,"why":"A rule handed down with the questions shut out in advance. That is the Strict Boss."},{"text":"\u201cForget the checklist, ship it and see what breaks, it'll be hilarious!\u201d","answer":3,"why":"Wanting the fun now and leaving the bill for later. That is the Wild Kid."},{"text":"\u201cSorry, I took the good desk. I'll move, it's nothing, I like the draught.\u201d","answer":4,"why":"The better seat is given up before anyone asked, and the sacrifice is called nothing. That is the Good Kid keeping the peace at its own cost."}]},{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cHandover notes go in the template, as written. Not your version of it.\u201d","answer":0,"why":"A standard stated as the only way, with no reason given. That is the Strict Boss."},{"text":"\u201cSorry, it's probably me who broke it. Ignore the red.\u201d","answer":4,"why":"She gives away her own view before anyone has looked at it. That is the Good Kid, small and quick."},{"text":"\u201cTake my charger, love, and wear a jumper tomorrow, the server room is freezing.\u201d","answer":1,"why":"The charger is care and the jumper is an order. That is the Caring Boss, soft in tone and still telling you what to wear."},{"text":"\u201cThe ticket has three open comments and one failing test. It's the date one.\u201d","answer":2,"why":"Counts and a location, nothing judged. That is the Pilot."},{"text":"\u201cSkip stand-up and get chips! Daniel never checks, I'll cover it later.\u201d","answer":3,"why":"A plan made on the spot with the cost left for later. That is the Wild Kid, the want that skips the checks."}]},{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cLate with the notes again. A professional hands things in on time, full stop.\u201d","answer":0,"why":"A verdict on the whole person and the excuse blocked before it is spoken. That is the Strict Boss."},{"text":"\u201cCome here, you've got ink on your cuff before the client call. Let me.\u201d","answer":1,"why":"The cuff is care, and the hand is already reaching. That is the Caring Boss, which fixes you whether you asked or not."},{"text":"\u201cCall starts at 14:00, the link is in the invite and there are four items on the agenda.\u201d","answer":2,"why":"A time, a place to find the link, a count. That is the Pilot."},{"text":"\u201cFree cake in the canteen? I'm having three slices and I'll be sorry on Monday!\u201d","answer":3,"why":"Wanting it now and waving the cost away. That is the Wild Kid."},{"text":"\u201cOh, you take the big monitor, I'll squint at the small one, it's no trouble.\u201d","answer":4,"why":"A comfort handed over before anyone asked, with the cost called no trouble. That is the Good Kid."}]}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now the team room.<\/b> Daniel wants a name for Friday's merge. Clara has already put her hand up. Pick the voice behind each reply from you.","items":[{"type":"pick","who":"You, to Daniel, Thursday 17:50","text":"\u201cYes, fine, I'll do it. Whatever's easiest for everyone.\u201d","cue":"laptop already half out of the bag","options":["The Good Kid","The Strict Boss","The Pilot","The Wild Kid"],"answer":0,"why":"It agrees at once, puts the whole evening on the table and names no condition. That is the Good Kid, which learned that saying yes keeps the room calm.","traps":{"1":"The Strict Boss would rule: \u201cFine. Nobody else does it right, so it's mine, and nobody touches my branch.\u201d That shuts Daniel and Clara out in one go.","2":"The Pilot would set terms: \u201cI can merge at ten if the rollback steps are written and Omar reviews.\u201d It gives facts and leaves the question open.","3":"The Wild Kid would jump: \u201cRelease? Push it tonight and let's go to the pub, we'll fix it tomorrow!\u201d It grabs the fun and skips the cost."},"example":"A flat group chat, someone asks who can collect the parcel: \u201cYeah me, whatever, no worries!\u201d<br>She is working late all week, and nobody finds out she never wanted the job."},{"type":"pick","who":"You, to Daniel, Thursday 17:55","text":"\u201cI can take the merge. I need the rollback steps written down and Omar as second reviewer. Can we settle both tonight?\u201d","cue":"steady, looking at Daniel and not at Clara","options":["The Wild Kid","The Pilot","The Caring Boss"],"answer":1,"why":"It says what you will do and what you need, and puts no verdict on anyone. The question stays open for Daniel to answer. That is the Pilot, the voice that deals with what is actually here.","traps":{"0":"The Wild Kid would wave it through: \u201cGo on, give it to me, how hard can it be, we'll wing the rollback!\u201d The merge gets taken and the risk gets ignored.","2":"The Caring Boss would take over out of kindness: \u201cYou look worn out, Daniel. Go home, I'll look after all of it.\u201d That is warm, and it asks for no conditions at all."},"example":"A removals job, a friend asks for help: \u201cI can bring the van at nine, I need the lift booked and two people at the other end.\u201d<br>Everyone knows what is being asked."},{"type":"pick","who":"You, to Clara, Thursday 18:05","text":"\u201cClara, please stop editing my rollback notes after I've sent them. Put your comments in the review.\u201d","cue":"level, laptop closed on the four pages she has just handed back","options":["The Good Kid","The Caring Boss","The Wild Kid","The Strict Boss"],"answer":3,"why":"A limit set in a firm voice, with a place for her to go instead. There is no sigh and no apology in it. That is the Strict Boss on its healthy side: it names the line and does not punish her for crossing it.","traps":{"0":"The Good Kid would fold: \u201cOh, thanks, Clara, yours are better than mine anyway, sorry.\u201d The limit disappears, and the edits keep coming.","1":"The Caring Boss would wrap it in kindness: \u201cYou're so thorough, love, but rest your eyes, I'll look after the notes.\u201d It is gentle, and it never says stop.","2":"The Wild Kid would blurt it out: \u201cTouch it again and I'm deleting the lot!\u201d It says the feeling the second it has it, and Clara hears an attack."},"example":"A shared kitchen, one housemate to another: \u201cPlease don't reorganise my shelf. Ask me first.\u201d<br>A firm line with no insult in it, and nothing to apologise for."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"<b>Build Clara's voice-print.<\/b> Ten lines, one bar each. Count each bar: the tallest is the voice used most in these lines, which is a rough guide and not a measurement.","items":[{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cThat page has three typos. I'm not sending it until it has none.\u201d","answer":0,"why":"A standard that leaves no room for a draft. That is the Strict Boss, and here it is aimed at herself."},{"text":"\u201cIt should be right the first time. Why isn't it right the first time?\u201d","answer":0,"why":"A demand that closes every door but perfect. The Strict Boss again."},{"text":"\u201cDraft is in the folder. Reviews close Friday at noon. Three are still open.\u201d","answer":2,"why":"A place, a time and a count. That is the Pilot."},{"text":"\u201cOmar, you've got mayo on your sleeve. Here's a napkin. Sit down, I'll fetch your coffee.\u201d","answer":1,"why":"The napkin is care, and the fetching comes with an order to sit. That is the Caring Boss."},{"text":"\u201cDon't mind me, I'll do the weekend cover. I had nothing on anyway.\u201d","answer":4,"why":"She volunteers her weekend and shrinks her own plans to nothing. That is the Good Kid."},{"text":"\u201cSorry, sorry, I should have caught that earlier. That's on me.\u201d","answer":4,"why":"An apology before anyone has complained. The Good Kid again, sorry in advance."},{"text":"\u201cThe deploy log shows two warnings, and the rollback took four minutes.\u201d","answer":2,"why":"Facts from a log, no judgment attached. That is the Pilot."},{"text":"\u201cStandards are standards. If we ship it sloppy once, we ship it sloppy always.\u201d","answer":0,"why":"A rule that sweeps one slip into a whole future. That is the Strict Boss."},{"text":"\u201cLet's get the big cake from the baker's and eat it on the stairs! Just once!\u201d","answer":3,"why":"A sudden wish with the plan thrown out. That is the Wild Kid, the one voice she rarely lets speak."},{"text":"\u201cA real engineer would have found that in review. I should have found it.\u201d","answer":0,"why":"A verdict on herself against an impossible standard. That is the Strict Boss, turned inward."}]},{"type":"pick","who":"Daniel, after you show him your bars","text":"\u201cGood Kid on top. So that's your personality, then. Settled.\u201d","cue":"already typing it into the team wiki","options":["A fixed fact about your character, now that it is typed into the wiki","Proof that your Pilot is missing","A picture of this month, and it can change"],"answer":2,"why":"Your voice-print is a rough picture of how much of the month each voice took. A tall Good Kid bar tells you which voice did most of the talking this month, and you can redraw it as you practise another.","traps":{"0":"Calling it fixed treats one month as a life sentence. The bars shift when you use a different voice, so a wiki entry cannot make it permanent.","1":"A tall bar does not mean the Pilot is missing. It is one bar of five, and Daniel has not checked how tall it is."},"example":"A running club, a friend after a slow lap: \u201cYou always fade at the end, you're just slow.\u201d<br>One slow lap is one line of the week, not the whole chart."}]}]},{"setting":"Family","blurb":"Sunday lunch: someone must take Gran to Tuesday's clinic, and Dad only says he'll see.","opener":{"setting":"Sunday, 14:10. Mum and Dad's flat, the table laid for six. Gran's chair is empty. She is still coming up from her flat downstairs.","lines":[{"who":"Mum","text":"\u201cSomebody has to take Gran to the clinic on Tuesday, and I'm not asking twice.\u201d","cue":"carrying the gravy jug like evidence"},{"who":"Dad","text":"\u201cI'll see.\u201d","cue":"eyes on the football scores, thumb already moving"},{"who":"Leo","text":"\u201cCan I have the crispy bit?\u201d","cue":"standing on his chair"},{"who":"The app","text":"\u201cThis is you, so far. Not forever. This month.\u201d","cue":"five bars on the phone beside your plate, each filled to a different height"}],"ask":"Which of the five bars is tallest in you this month, and which of your own choices filled it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> each card is one line from this week. Drop it into the bar it came from. The five bars are the Strict Boss, the Caring Boss, the Pilot, the Wild Kid and the Good Kid.","items":[{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cLeo, coat on, scarf on, hat on. It's four degrees and you'll catch your death.\u201d","answer":1,"why":"Worry for his health, delivered as three orders. That is the Caring Boss, warm and in charge."},{"text":"\u201cGran's clinic is Tuesday at 09:40. The bus takes twenty-five minutes and the lift is round the back.\u201d","answer":2,"why":"A time, a length and a place. That is the Pilot, which hands over what is true."},{"text":"\u201cAt this table we finish what's on the plate. I'm not arguing about sprouts.\u201d","answer":0,"why":"A rule with the argument closed in advance. That is the Strict Boss."},{"text":"\u201cBiscuits first! Dinner can wait, Mum won't notice!\u201d","answer":3,"why":"Wanting it now and betting nobody checks. That is the Wild Kid."},{"text":"\u201cOh, you have the big slice, I'll take the burnt end. I like it really.\u201d","answer":4,"why":"She gives up the better piece and adds that she likes the worse one. That is the Good Kid, keeping the peace at her own cost."}]},{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cWhen your father was your age he walked to school in all weathers. You can manage a drizzle.\u201d","answer":0,"why":"A comparison used as a verdict, with no room to answer. That is the Strict Boss."},{"text":"\u201cSorry to ask, only if it's no bother, could someone pass the salt? Never mind, I'll reach.\u201d","answer":4,"why":"A request that apologises, then cancels itself. That is the Good Kid."},{"text":"\u201cTake a plate down to Mrs Kale, love, and ask if she needs the heating seen to.\u201d","answer":1,"why":"The care is real, and the errand arrives with its instructions. That is the Caring Boss."},{"text":"\u201cThe spelling test is Monday. Twelve words, and we've done seven.\u201d","answer":2,"why":"A day and two counts, nobody blamed. That is the Pilot."},{"text":"\u201cLet's all go to the seaside right now! Dad, get the car, we'll sort lunch on the way!\u201d","answer":3,"why":"A wish for now, with the lunch and the cost left behind. That is the Wild Kid."}]},{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cThe gas bill's in the drawer by the kettle, and the total is the same as last quarter.\u201d","answer":2,"why":"A place to find it and a figure to check. That is the Pilot."},{"text":"\u201cI've told you before, shoes in the rack. Do it again and there's no pudding, no discussion.\u201d","answer":0,"why":"A threat with the door shut behind it. That is the Strict Boss."},{"text":"\u201cSit, sit, you've been on your feet all morning. Let me tuck a cushion behind you.\u201d","answer":1,"why":"A gentle gesture that also settles where you will sit. That is the Caring Boss."},{"text":"\u201cI'm sorry, I'm in the way again. I'll eat in the kitchen so you've got room.\u201d","answer":4,"why":"An apology for taking up space, and an offer to vanish. That is the Good Kid."},{"text":"\u201cDad! Race me down the stairs! Last one's a rotten egg and nobody's looking!\u201d","answer":3,"why":"Pure want and a gamble that nobody checks. That is the Wild Kid."}]}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now the table.<\/b> Mum has just said it out loud, and Dad has said \u201cI'll see\u201d. Pick the voice behind each reply from you.","items":[{"type":"pick","who":"You, to Mum, at the table","text":"\u201cYes, yes, I'll take her. Don't worry about it, it's no trouble at all.\u201d","cue":"eyes on the gravy jug, answering before she has finished asking","options":["The Strict Boss","The Wild Kid","The Good Kid","The Pilot"],"answer":2,"why":"It agrees before the ask is finished and waves the cost away. Nothing about your own Tuesday gets said. That is the Good Kid, which learned that yes keeps the table calm.","traps":{"0":"The Strict Boss would rule: \u201cObviously I'll take her. Somebody has to do things properly in this family.\u201d It agrees, and it also hands out a verdict on everyone else.","1":"The Wild Kid would leap: \u201cClinic? Let's take Gran to the seaside instead, she'd love it!\u201d The want is real, and the appointment is gone.","3":"The Pilot would name the cost: \u201cThe clinic is 09:40 on Tuesday. I'd have to swap my shift first. I'll check tonight.\u201d It states facts and leaves the question open."},"example":"A rota chat at work: \u201cSure, I'll cover Saturday, it's nothing!\u201d<br>She has a wedding on Saturday, and nobody ever hears about it."},{"type":"pick","who":"You, to Dad, at the table","text":"\u201cThe clinic is at 09:40. I can do the bus there. Dad, can you bring her back at noon?\u201d","cue":"looking at Dad, and not at Mum","options":["The Strict Boss","The Caring Boss","The Wild Kid","The Pilot"],"answer":3,"why":"A time, a share of the job for you and a share for him, put as a clear request he can answer. That is the Pilot, which asks for what is needed and leaves him room to say yes or no.","traps":{"0":"The Strict Boss would pin him down: \u201cDad, you said you'd see. Seeing isn't doing. Decide now.\u201d It is firm, and it turns the question into a telling-off.","1":"The Caring Boss would take it over: \u201cYou look tired, Dad. Don't worry, I'll do both ways, you stay put.\u201d That is kind, and it removes his share without asking.","2":"The Wild Kid would skip the plan: \u201cLet's get a taxi and have chips after, Gran can pick, who cares about the time!\u201d The fun is real and the appointment is not covered."},"example":"A football club, a parent to the group: \u201cPractice is at six. I can drive there, can someone bring the oranges?\u201d<br>It is clear who does what, and anyone can answer."},{"type":"pick","who":"You, to Mum, at the table","text":"\u201cMum, I'm taking Gran. Please don't ring me twice on Tuesday morning to check.\u201d","cue":"level, passing the potatoes","options":["The Caring Boss","The Strict Boss","The Pilot","The Good Kid"],"answer":1,"why":"A limit stated calmly, with no sigh and no apology. It says what you will do and what you ask her to leave alone. That is the Strict Boss on its healthy side.","traps":{"0":"The Caring Boss would soften it away: \u201cRing me whenever you like, love, I know you worry.\u201d It is warm, and the limit has gone.","2":"The Pilot would report: \u201cI'll text you when we're through the door and when we leave.\u201d It gives her facts and sets no limit, so the phone may still ring twice.","3":"The Good Kid would give in: \u201cSorry, Mum, ring as often as you like, I'll pick up.\u201d The boundary is dropped before she has even heard it."},"example":"A shop, a seller to a regular who keeps asking for money off: \u201cI'll send the photo when it's done. Please don't call me at the shop again today.\u201d<br>A firm line, a plan, and no insult."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"<b>Build Mum's voice-print.<\/b> Ten lines, one bar each. Count each bar: the tallest is the voice used most in these lines, which is a rough guide and not a measurement.","items":[{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cHave you eaten? Take a box home. No, take two, you're too thin.\u201d","answer":1,"why":"Worry about food, and the second box is an order. The Caring Boss."},{"text":"\u201cWear your scarf, you'll catch something, and then who has to nurse you?\u201d","answer":1,"why":"Care that ends in a small guilt trip. The Caring Boss again."},{"text":"\u201cThe bin men come Thursday and the recycling goes out the night before.\u201d","answer":2,"why":"A day and a task, nothing judged. That is the Pilot."},{"text":"\u201cGran's tablets are the blue ones at breakfast and the white ones at bedtime. It's on the fridge.\u201d","answer":2,"why":"A fact and the place to find it. The Pilot."},{"text":"\u201cIn this house we say thank you. Say it now, Leo, don't make me ask again.\u201d","answer":0,"why":"A house rule enforced without discussion. That is the Strict Boss."},{"text":"\u201cIf you can't be bothered to ring on Sundays, don't ring at all.\u201d","answer":0,"why":"An ultimatum that closes the matter. The Strict Boss."},{"text":"\u201cDon't mind me, I'll have the cold bit, I'm not hungry.\u201d","answer":4,"why":"She picks the worst piece and shrinks her own appetite. That is the Good Kid."},{"text":"\u201cPudding before the main, why not! It's Sunday and I feel about nine years old!\u201d","answer":3,"why":"A sudden delight with the order of the meal thrown out. That is the Wild Kid."},{"text":"\u201cCome here, let me do your hair, it's all over the place. There. Now you look looked after.\u201d","answer":1,"why":"The fix is affection, and it is also done to you. That is the Caring Boss."},{"text":"\u201cSit down, sit down, I'll fetch it. You won't know where the good spoons are.\u201d","answer":1,"why":"Help with a small claim that you cannot manage. The Caring Boss."}]},{"type":"pick","who":"Dad, looking at the bars on your phone","text":"\u201cGood Kid is the tallest in you. So you're soft. Always have been.\u201d","cue":"chewing, not unkind","options":["This month's tallest bar, which can shift and is worth reading","A fixed fact about you, because he has known you since you were small","Proof that the Strict Boss in you is missing"],"answer":0,"why":"A voice-print is a rough picture of this month, not a ruling from someone who has known you for years. A tall Good Kid bar tells you which voice talked most lately, and it moves when you practise another one.","traps":{"1":"Dad's long memory feels like proof. But the bars are redrawn each month, and this month's picture says nothing about what you will be next month.","2":"A tall bar does not mean another bar is missing. The Strict Boss is still one of five, and nobody has checked how tall it is."},"example":"A fishing club, an old friend after you miss a catch: \u201cYou never could aim, you've always been hopeless.\u201d<br>One missed catch this Sunday is one line of the week."}]}]},{"setting":"Relationships","blurb":"Clara's text to Omar sits read and unanswered since Friday, and you are the friend beside her.","opener":{"setting":"Sunday, 21:30. Clara's sofa. Her phone is face down on the cushion, and then face up.","lines":[{"who":"Clara","text":"\u201cHe read it Friday at eight. It's Sunday. It's fine. It's completely fine. I wasn't going to say anything.\u201d","cue":"turning the phone over to check, and back"},{"who":"The app","text":"\u201cThis is you, so far. Not forever. This month.\u201d","cue":"five bars on your own phone, each filled to a different height"}],"ask":"Which of the five bars is tallest in you this month, and which of your own choices filled it?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> each card is one line from this week. Drop it into the bar it came from. The five bars are the Strict Boss, the Caring Boss, the Pilot, the Wild Kid and the Good Kid.","items":[{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cHave you eaten? There's soup in my bag. Take it, you're pale.\u201d","answer":1,"why":"Worry about whether she ate, and the soup is already handed over. That is the Caring Boss."},{"text":"\u201cThe film starts at 19:40, the cinema is two stops away, and I've booked two seats.\u201d","answer":2,"why":"A time, a distance and a booking. That is the Pilot."},{"text":"\u201cIf someone says they'll text, they text. That's manners, and I won't pretend it isn't.\u201d","answer":0,"why":"A rule about how everybody must behave, with no room for a reason. That is the Strict Boss."},{"text":"\u201cSkip the film and get chips on the bridge! I'll pay you back, probably!\u201d","answer":3,"why":"A plan made on the spot, with the bill left for later. That is the Wild Kid."},{"text":"\u201cOh, you pick the place, I'm easy, I'll eat whatever you eat.\u201d","answer":4,"why":"He gives away his choice before anyone asked. That is the Good Kid, keeping things smooth."}]},{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cWear the navy, it suits you, and take an umbrella, love, it's going to tip down.\u201d","answer":1,"why":"The compliment is warm and the umbrella is an order. The Caring Boss."},{"text":"\u201cI left at 22:15. I sent the message at 22:40. He hasn't replied.\u201d","answer":2,"why":"Three times and a fact, no verdict. That is the Pilot."},{"text":"\u201cSorry, I'm probably reading too much into it. Forget I said anything.\u201d","answer":4,"why":"She withdraws her own worry before anyone has answered it. That is the Good Kid."},{"text":"\u201cTwo days of no reply is rude and I'm saying it. Tell him so.\u201d","answer":0,"why":"A verdict with an order attached. That is the Strict Boss."},{"text":"\u201cLet's turn up at his flat with a cake at midnight! What's the worst that could happen?\u201d","answer":3,"why":"A thrilling plan with the checks skipped. That is the Wild Kid."}]},{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cA grown man answers a message. That's the rule, and he knows it.\u201d","answer":0,"why":"A standard stated as the only way, with no reason sought. That is the Strict Boss."},{"text":"\u201cPoor thing, she looked cold. I'll drop a scarf round to hers and tell her to put it on.\u201d","answer":1,"why":"Concern with the instruction already built in. The Caring Boss."},{"text":"\u201cThe bridge closes at eleven. If we leave at ten to, we make the last tram.\u201d","answer":2,"why":"A deadline and a plan to meet it. That is the Pilot."},{"text":"\u201cNo, no, you have the last dumpling, I've had plenty, I'm stuffed.\u201d","answer":4,"why":"He turns down the thing he wanted so the other person gets it. The Good Kid."},{"text":"\u201cDance with me on the platform! The tram can wait, the tram doesn't mind!\u201d","answer":3,"why":"Delight with the timetable thrown away. That is the Wild Kid."}]}]},{"level":"Play","label":"Play, the week in motion","intro":"<b>Now the sofa.<\/b> Clara has gone quiet, and the unanswered text is still on the screen. You are the friend who says things. Pick the voice behind each reply from you.","items":[{"type":"pick","who":"You, to Clara, Sunday 21:35","text":"\u201cHe's probably just busy. It's fine. Forget I said anything.\u201d","cue":"bright, already reaching to turn the telly up","options":["The Caring Boss","The Good Kid","The Pilot","The Wild Kid"],"answer":1,"why":"It soothes her and closes the subject in one go. Nothing true about Thursday gets said, and the peace is kept. That is the Good Kid, which learned that smoothing things over keeps people near.","traps":{"0":"The Caring Boss would take her in hand: \u201cCome here, you poor thing, have some tea, and put that phone in a drawer.\u201d It is warm, and it tells her what to do with her own phone.","2":"The Pilot would say what is known: \u201cHe read it Friday at eight. It's Sunday. That's the situation.\u201d It gives her the facts and leaves the subject open.","3":"The Wild Kid would dare her: \u201cRing him right now! What's the worst, he doesn't pick up?\u201d It is exciting and skips what she will feel afterwards."},"example":"A group chat about a missed invite: \u201cHe's probably just busy! Forget it!\u201d<br>Nobody says the thing that was bothering her, and it comes back on Tuesday."},{"type":"pick","who":"You, to Clara, Sunday 21:42","text":"\u201cHe read it Friday at eight and it's Sunday night. You could send one short line tonight or wait until Monday. Which do you want?\u201d","cue":"steady, phone between you on the cushion","options":["The Strict Boss","The Wild Kid","The Pilot"],"answer":2,"why":"It sets out the time, the two ways she can go, and asks which she wants. There is no verdict on Omar and no push. That is the Pilot, the voice that works with what is actually in front of you.","traps":{"0":"The Strict Boss would hand down a ruling: \u201cTwo days of silence is rude. Tell him that and don't soften it.\u201d That is a verdict on Omar, and it gives Clara no choice.","1":"The Wild Kid would dive in: \u201cRing him right now! Midnight call, who cares!\u201d It is exciting, and it takes the choice away from the person it belongs to."},"example":"A train platform, a friend to another waiting on a late reply: \u201cThe call was Tuesday and it's Friday. You can send one line today or wait for Monday. Which?\u201d<br>Two real options, and the choice stays with her."},{"type":"pick","who":"You, to Clara, Sunday 21:50","text":"\u201cClara, I'll listen all evening. I won't help you write a third apology text. Not tonight.\u201d","cue":"level, hand flat on the cushion between you","options":["The Strict Boss","The Caring Boss","The Good Kid","The Wild Kid"],"answer":0,"why":"A limit stated in a calm voice: what you will do and what you will not. There is no sigh and no punishment in it. That is the Strict Boss on its healthy side.","traps":{"1":"The Caring Boss would take over: \u201cGive me the phone, you poor thing, I'll write it for you.\u201d That is generous, and it keeps the text-writing loop running.","2":"The Good Kid would fold: \u201cSorry, sorry, of course I'll help, give it here.\u201d The limit is dropped the second she looks upset.","3":"The Wild Kid would turn it into a stunt: \u201cSend a GIF and a voice note at midnight, who cares!\u201d That is the want, with no thought about what Omar reads on Monday."},"example":"A bakery counter, a customer to a friend: \u201cI'll hold your coat all day. I won't help you pick a fifth outfit.\u201d<br>A kind no, with the help she can still count on."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"<b>Build Omar's voice-print.<\/b> Ten lines, one bar each. Count each bar: the tallest is the voice used most in these lines, which is a rough guide and not a measurement.","items":[{"type":"sort","prompt":"Drop each line into the bar it came from.","bins":["The Strict Boss","The Caring Boss","The Pilot","The Wild Kid","The Good Kid"],"items":[{"text":"\u201cRain's coming at four. I've got a spare umbrella in the office.\u201d","answer":2,"why":"A forecast and a fact. That is the Pilot."},{"text":"\u201cI'll walk you to the stop. Put your scarf on, it's bitter out.\u201d","answer":1,"why":"The walk is care and the scarf is an order. That is the Caring Boss."},{"text":"\u201cThe booking's for 19:30. They hold tables for fifteen minutes.\u201d","answer":2,"why":"A time and a limit, no judgment attached. The Pilot."},{"text":"\u201cSorry, I should have texted back sooner. That's on me, completely.\u201d","answer":4,"why":"An apology that takes all the blame, and offers it before anyone asks. That is the Good Kid."},{"text":"\u201cChips on the bridge, then the last tram, and we'll see who falls asleep first!\u201d","answer":3,"why":"A spur-of-the-moment plan with the tram left to chance. That is the Wild Kid."},{"text":"\u201cMeetings that run over without an agenda are wasted time. I won't sit through another.\u201d","answer":0,"why":"A rule with the door shut behind it. That is the Strict Boss."},{"text":"\u201cEat something, you skipped lunch, I saw. Half of this, go on.\u201d","answer":1,"why":"Noticing she skipped lunch is care, and the half is an order. The Caring Boss."},{"text":"\u201cNo, you go first, I'll wait, I'm in no hurry.\u201d","answer":4,"why":"He steps back so she can go ahead. The Good Kid, polite and small."},{"text":"\u201cI saw your message on Friday at eight. I didn't know what to say, so I said nothing.\u201d","answer":2,"why":"A time and a description of what he did. That is the Pilot, even about something awkward."},{"text":"\u201cYour train is 17:42, platform 4, and the stairs are on your left.\u201d","answer":2,"why":"A time, a number and a direction. The Pilot again."}]},{"type":"pick","who":"Clara, after you show her your bars","text":"\u201cYour Pilot is the tallest. So you're the reasonable one. You never feel anything, do you?\u201d","cue":"half joking, watching your face","options":["A fixed fact about you, the reasonable one, now that it is charted","A picture of this month, and the other four bars are still there","Proof that the Wild Kid is missing from you"],"answer":1,"why":"A voice-print shows roughly how much of this month each voice took. A tall Pilot bar says that voice talked the most. It does not say the other four have gone quiet for good, and you can redraw the bars as you use them.","traps":{"0":"Calling it fixed turns a month into an identity. The Pilot may be the tallest now, and it can still be redrawn when you practise a different voice.","2":"A tall bar does not make another bar vanish. The Wild Kid is one bar of five, and Clara has not looked at how tall it is."},"example":"A pub quiz team, after a bad round: \u201cYou always freeze under pressure, that's who you are.\u201d<br>One bad round is one line of the week, not the whole chart."}]}]}]};</script>
