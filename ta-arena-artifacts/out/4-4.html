<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traps at Home · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"4.4","setting":"Home & Flatmates","title":"Traps at Home","world":4,"worldName":"Conversation Traps","week":4,"weekName":"Conversation Traps","mechanic":"Choice-story","concept":"After this one you can name the home traps that run in a flat or on the phone to home, and step out of one without taking the blame or the judge's chair.","plainWord":"a home trap","bookTerm":"Marital games","bookIdea":"Marital games are the games that grow into their fullest form in marriage and family living. The book describes seven: Corner, Courtroom, Frigid Woman and Frigid Man, Harried, If It Weren't for You, Look How Hard I've Tried, and Sweetheart.","bookSource":"Games People Play, ch. 7","opener":{"setting":"Monday, 9:40pm. Hawthorn Court, apartment 3B, the kitchen. A pot of rice is soaking, and the milk carton has a note on it in Sam's handwriting: \u201cFriday, promise.\u201d","lines":[{"who":"Maya","text":"\u201cSit, eat. Don't say no, I can see it on your face.\u201d","cue":"already at the sink, drying her hands on her shirt"},{"who":"Sam","text":"\u201cSorry, sorry, the milk is on my tab again. I'm working on it. Look at this sheet.\u201d","cue":"holding his phone up with a spreadsheet on the screen"}],"ask":"Name the home trap that is running, and find the one reply that steps out of it without starting a fight."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each home trap has a plain name. Tap the one that is running in the line.","items":[{"type":"pick","who":"Maya","text":"\u201cDon't sit, I'll do it. The bins, the rice, the rent list. Nobody else is free, so it's me, as usual.\u201d","cue":"wiping her hands, already reaching for the bin bag","options":["the rush","the court","sweetheart"],"answer":0,"why":"She is too busy to stop, and the busyness is the bait. She takes on everything that comes and even asks for more, so the list of jobs only grows. In the book the day ends in a collapse where nothing gets done, and she blames herself for it. That is the rush.","traps":{"1":"This would be the court if she were building a case against someone who isn't in the room. Here nobody is accused. She is only tired and busy.","2":"This would be sweetheart if the line ended with a pet name and a jab hidden inside. There is no endearment here, just a list of jobs that nobody offered to share."},"example":"A school parents' group, Thursday. One mother replies to every message within a minute, collects the bake-sale money, and says \u201cI'll do the lot, nobody else is free\u201d before the meeting has started."},{"type":"pick","who":"Mum","text":"\u201cThe neighbour's boy sends his mother money from Canada every month. Some of us don't even ring home, do we, sweetheart?\u201d","cue":"phone on speaker, a pot clinking on her stove","options":["the corner","sweetheart","look how hard I've tried"],"answer":1,"why":"The jab sits in the middle of the story and the pet name sits at the end. Mum points at you through the neighbour's son, then softens the point with a loving word, so you cannot easily object without seeming sulky. The sting is hidden inside the endearment.","traps":{"0":"This would be the corner if every reply you could give were wrong. Mum has not set two doors. She has one story with one jab, and you can answer it directly.","2":"This would be look how hard I've tried if the speaker were pointing at their own effort. Mum is pointing at yours, and she is using the neighbour's son as her proof."},"example":"A family group chat, Sunday night. An uncle writes \u201cSuch a clever girl, sweetheart. Some of us finish our degrees and still need help with the rent.\u201d"},{"type":"pick","who":"Sam","text":"\u201cI've tried so hard this month. I made the sheet, I deleted the shopping app, I even skipped the cab. And you still look at me like that.\u201d","cue":"scrolling the sheet with his thumb, not looking up","options":["the court","look how hard I've tried","the rush"],"answer":1,"why":"He shows you the effort and says nothing about the rent. The effort is a shield: whatever happens next, he can say he tried, and it is hard to argue with trying. Meanwhile the milk money is still owed.","traps":{"0":"This would be the court if he were building a case against a third person. Sam accuses nobody. He is asking you to admire the trying.","2":"This would be the rush if he were too busy to stop. Sam has plenty of time to show you the spreadsheet, which is the point."},"example":"A cousin at a wedding, Saturday. \u201cI've tried so hard with the diet, I've even stopped the sweets, and you still say I'm not serious.\u201d The plate of sweets is on the table behind him."},{"type":"pick","who":"Gran","text":"\u201cIf it weren't for your uncle and his rules, I'd be at the market every morning. He says the road is too busy, so I stay in with the radio.\u201d","cue":"the letter open on her lap, her glasses on her forehead","options":["if it weren't for you","the corner","sweetheart"],"answer":0,"why":"She blames someone else's rule for what she is not doing, and the complaint is the point. In the book the rule she complains about also keeps her away from something that frightens her, so she complains about it and never tests it. As long as he is the cause, nothing has to change at her end.","traps":{"1":"This would be the corner if every answer you gave left you stuck. Gran offers no second door. She is putting the whole problem on someone who isn't in the room.","2":"This would be sweetheart if the sentence ended on a pet name with a sting in it. Gran's sting sits in the blame alone."},"example":"A neighbour at the lift, Tuesday. \u201cIf it weren't for my husband's shifts, I'd have joined the choir years ago.\u201d<br>The shifts get the blame, and the choir is never tried."}]},{"level":"Play","label":"Play, the week in motion","intro":"Three home scenes. Keep both meters above half at the end of each one, and watch for the moment someone hands you a chair you didn't ask for.","items":[{"type":"scene","title":"Wednesday, 9:50pm, the kitchen","setting":"Apartment 3B. The rice pot is soaking, and the milk carton is on the counter with its note. Maya has the stool by the fridge. Sam is on the sofa with his shoes still on. <i>The Heckler, in your head: \u201cPick a side and get it over with.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Maya","text":"\u201cLet me tell you what Sam did this week. The milk and the bins, all week. You're the fair one, so you tell him.\u201d","cue":"arms folded, looking at you, not at the sofa","lines":[{"text":"\u201cTell him, Maya, not me. He's right there and he can answer.\u201d","tag":"best","you":4,"them":3,"outcome":"She turns to the sofa. \u201cSam, the milk.\u201d He sits up, surprised to be asked straight, and the room gets a little quieter.","why":"A court runs on talk about someone, not to them. Speaking to the person directly stops the court before the first witness."},{"text":"\u201cAlright, I'm the judge. Go on, what did he do?\u201d","tag":"ok","you":-2,"them":2,"outcome":"She tells you the whole week, the milk and the bin bags that never went out.","why":"You took the stool without being asked. The court now has its judge, and the case gets longer while Sam listens from the sofa."},{"text":"\u201cSam, you really are the worst. Did you hear what she said?\u201d","tag":"game","you":2,"them":-4,"outcome":"Sam gets up without a word and goes to his room. Maya says, \u201cThank you,\u201d as though you had both agreed.","why":"A trap move: you joined the case against him, so the court has two sides against one defendant. The scene ends early, and the flat stays split."}]},{"who":"Sam","text":"\u201cSorry, sorry, I owe her. But the transfer was late, so the rent was late. I did the milk on Friday, I swear.\u201d","cue":"from the sofa, one hand over his eyes","lines":[{"text":"\u201cThen tell her the day, Sam. Say it to her, not to me.\u201d","tag":"best","you":4,"them":3,"outcome":"He sits up and looks at Maya. \u201cFriday for the milk, and the rent by the tenth. Promise.\u201d","why":"You send the answer back to the person who owes it. A date said to the right person is the only defence a court cannot argue with."},{"text":"\u201cFine, I'll rule it's Friday, and that's the end of it.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Sam nods. Maya says, \u201cI asked you to tell him, not to rule on it.\u201d","why":"A verdict can end the argument for a minute, but it keeps you in the chair. Maya has learned that the court still works, so she will come back to it."},{"text":"\u201cMaya's right, you are always late. It's your fault.\u201d","tag":"game","you":2,"them":-5,"outcome":"Sam says, \u201cOkay, okay,\u201d and the sorry turns into a sulk. The scene stops on the sofa.","why":"You picked the prosecution's side and gave the sentence. The sorry is gone, and Sam has his proof that everyone is against him."}]},{"who":"Maya","text":"\u201cSee? He does this every time. So you'll talk to him about the bins as well, won't you?\u201d","cue":"already moving the bin bag towards the door","lines":[{"text":"\u201cSay the bins to him, Maya. Look at him, and say the whole thing.\u201d","tag":"best","you":3,"them":4,"outcome":"She stops with the bag in her hand, looks at Sam, and says, \u201cThe bins, Sam. Every Thursday, and I'm sick of it.\u201d He says, \u201cOkay.\u201d","why":"The case moves back to the room. What was about him becomes what is between the two of them, and that is the only version that can get settled."},{"text":"\u201cSure, I'll sort out the bins with him.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Maya says, \u201cThanks,\u201d and you have just taken on a second case without a single witness.","why":"You agreed to carry a complaint for someone else. It sounds helpful, but the court is still running, and now you are its messenger."},{"text":"\u201cMaya, have you ever once asked him for the bins? Out loud?\u201d","tag":"game","you":1,"them":-3,"outcome":"She puts the bag down. \u201cWhose side are you on?\u201d The room goes flat, and nobody is on either side.","why":"A trap move: a question that hides a verdict, so the case flips and you become the defendant. It ends the scene early with nothing settled."}]},{"who":"Sam","text":"\u201cSo what's the verdict, then? You're the one who always has one.\u201d","cue":"grinning now, the spreadsheet still open on his phone","lines":[{"text":"\u201cNo verdict. You two settle the day now, in front of me.\u201d","tag":"best","you":4,"them":4,"outcome":"\u201cFriday,\u201d Sam says. Maya nods once. The milk is back on the counter, with the date written on the carton.","why":"You hand the decision back to the two people who have the debt and the relationship. The court closes because nobody is waiting for a judge any more."},{"text":"\u201cFriday for the milk, and I'll bring it up myself.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Sam says, \u201cHa, the judge brings the milk,\u201d and Maya laughs for the first time tonight.","why":"A fair ruling, and the mood lifts, but you are still the one with the verdict. Next week, somebody will ask you again."},{"text":"\u201cGuilty. You're covering the milk for a month, Sam.\u201d","tag":"game","you":2,"them":-6,"outcome":"\u201cThat's not fair,\u201d Sam says. Maya says, \u201cSee, he never listens,\u201d and both of them stop talking to you.","why":"You sentenced him from the stool, and the sentence closed the case with no agreement. Both of them are now speaking about you, which is the court's favourite place to be."}]}],"payoff":"The court ends with you as the judge, and both of them are sure you picked a side. The milk stays on the counter, and the bins go out on Thursday without anyone saying so.","fallout":{"them":"Maya takes the bin bag and goes to bed without a word. The milk is still unpaid, and the stool by the fridge stays empty for the rest of the week."},"example":"A committee meeting in a housing society, Thursday. Two members fight about a lift repair, and the chair keeps being asked to rule. The chair says, \u201cAsk the other member directly,\u201d and the repair gets booked."},{"type":"scene","title":"Friday, 7:15pm, the sofa","setting":"Apartment 3B. The film is paused on the TV, and Sam is already in his jacket with the keys in his hand. <i>The Heckler, in your head: \u201cSay no first, so you can't be the one who lets him down.\u201d<\/i>","meters":{"you":50,"them":50},"beats":[{"who":"Sam","text":"\u201cCome on, the chase scene is the best bit. Oh, forget it. You never come to anything with me.\u201d","cue":"keys swinging, looking at the door","lines":[{"text":"\u201cI'll come. Give me five minutes, and you can pick the snacks.\u201d","tag":"best","you":4,"them":4,"outcome":"He stops swinging the keys and grins. \u201cFive minutes. Don't bring the sad face.\u201d","why":"You drop the refusal and reach out with a yes that has a time and a job attached. In the book the way out is to change your mind and go along with a smile, so a warm yes with a time and a job attached takes away the wall."},{"text":"\u201cI'm not sure, I've had a long week.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"He nods too quickly. \u201cSure, stay in, then.\u201d The keys go back on the hook.","why":"A maybe leaves the door half shut. Nothing bad happens, but he gets to play the one who was let down."},{"text":"\u201cFine, I'll come, but only because you've made me feel like the bad guy again.\u201d","tag":"game","you":-4,"them":-5,"outcome":"He sighs, takes his jacket off, and sits two cushions away. The film starts without a word.","why":"A trap move: you said yes and then made it his fault. Both answers lose in a corner, and this one keeps you both on the same wall."}]},{"who":"Sam","text":"\u201cOh, you're coming now? Only because I said you wouldn't. Right, I'll go, then.\u201d","cue":"half out of the chair, turning back to the TV","lines":[{"text":"\u201cI want to come. Tell me the bit you're most excited about, and we can argue about it at the interval.\u201d","tag":"best","you":4,"them":4,"outcome":"He sits back down. \u201cThe chase. Obviously. Watch the bus, it's ridiculous.\u201d","why":"You answer the plan and leave the label alone. He gets to be excited about something, which is what the corner was hiding."},{"text":"\u201cOkay, you're right, I never come. I'll try next time.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cNext time, then,\u201d he says flatly, and the keys go on the table.","why":"You accepted the label, so the corner is now yours to live in. A promise for next time is a way of staying in it."},{"text":"\u201cYes, I never come, because every time I do you make it a fight.\u201d","tag":"game","you":-3,"them":-6,"outcome":"He takes his keys and goes out, and the door closes harder than it needs to.","why":"A trap move: you agreed to the label and then gave him the reason. Both of you have now said the corner out loud, and that is where it stays."}]},{"who":"Sam","text":"\u201cThe film's on, if you want it. I'm not going to beg.\u201d","cue":"standing by the sofa with his jacket still on","lines":[{"text":"\u201cThanks. I'll take the left side, and you can tell me when the bus jumps.\u201d","tag":"best","you":3,"them":4,"outcome":"He sits on the right, the film starts, and he says, \u201cWatch the bus. Watch it now.\u201d","why":"You join in warmly, with a small plan of your own. The corner offered a sulky yes or a no, and you gave neither."},{"text":"\u201cI'm sorry, I'm not in the mood.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"\u201cFair enough,\u201d he says, and turns the film on by himself.","why":"A calm no is better than a sulk, but it still closes the plan. You are now on opposite sides of the screen."},{"text":"\u201cBegging is your thing, Sam. I'm not watching you do it.\u201d","tag":"game","you":-4,"them":-6,"outcome":"He laughs once, not kindly, and goes to bed.","why":"A trap move: you turned his request into a verdict on him. The corner closes, and the film runs without either of you."}]}],"payoff":"The corner closes on both of you. Sam watches the chase alone and goes to bed, and the snacks go stale on the counter.","example":"A neighbour invites you to a wedding dinner, then says, \u201cYou never come to these, so I won't bother asking.\u201d You say, \u201cI'll come, and I'll save you a seat.\u201d"},{"type":"scene","title":"Sunday, 8:30pm, the bed","setting":"Apartment 3B. Mum is on speaker, and Dad is somewhere behind her with the television on mute. <i>The Heckler, in your head: \u201cIf she is upset, fixing it is your job.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Mum","text":"\u201cIf it weren't for your father's back, I'd be at my sister's for the festival already. He won't even drive me to the bus.\u201d","cue":"the pot clinking, her voice loud enough for the room behind her","lines":[{"text":"\u201cThat's a hard spot, Mum. If it were only you deciding, what would you do?\u201d","tag":"best","you":4,"them":3,"outcome":"A long pause. \u201cGo to my sister's, I suppose. But I'd have to ask him.\u201d It is the first plan of the call.","why":"The blame needs somewhere to go. You hand the choice back to the one who holds it, so the \u201cif it weren't for\u201d has to become a decision."},{"text":"\u201cI know, Mum. Dad's always been like that.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cAlways,\u201d she says, and the complaint grows a second paragraph about the car.","why":"You agreed that Dad is the cause. The blame stays on him, and your agreement gives Mum the second witness she wanted."},{"text":"\u201cIt's his fault, then. I'll tell him myself.\u201d","tag":"game","you":-4,"them":-5,"outcome":"\u201cWould you? Good,\u201d Mum says, and the phone goes quiet behind her, with a door shutting.","why":"A trap move: you took the Saviour's chair and promised to fix Dad for her. The blame now has a messenger, and the call ends early."}]},{"who":"Dad","text":"\u201cI heard that. I drove her to the bus last month.\u201d","cue":"from the background, the television clicking off","lines":[{"text":"\u201cThen tell her that yourself, Dad. You don't have to say it through me.\u201d","tag":"best","you":4,"them":3,"outcome":"A pause. \u201cYes,\u201d he says, and the television stays off.","why":"You send the message back to the person who can say it to Mum directly. Dad's \u201cwe're fine\u201d wall is easier to lean on when the words come from him."},{"text":"\u201cYou two sort it out. I'm just the phone.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"\u201cWe're fine,\u201d Dad says, and the line goes quiet for a while.","why":"Neutral and harmless, but it leaves Dad's \u201cfine\u201d in place and Mum's blame where it was."},{"text":"\u201cDad, you never listen. You just say we're fine.\u201d","tag":"game","you":-3,"them":-6,"outcome":"Mum says, \u201cSee? Even the boy agrees with me,\u201d and Dad's voice disappears from the room.","why":"You joined the case against him, so the phone turns into a court with you as the witness. The call ends early."}]},{"who":"Mum","text":"\u201cSee, he doesn't even talk to me. And if it weren't for you being so far away, he'd have someone to drive me. So you tell me, what would you do?\u201d","cue":"quieter now, pleased to have a witness","lines":[{"text":"\u201cI'm not the reason, Mum. Ask him for Thursday, straight out, and I'll ring you Wednesday to hear how it went.\u201d","tag":"best","you":4,"them":4,"outcome":"She is silent, then says, \u201cThursday. Straight out. Hmm.\u201d It is the second plan of the call.","why":"You refuse the blame you were handed, then give Mum a specific ask she can make herself. Asking straight is the way out of the \u201cif it weren't for\u201d line."},{"text":"\u201cMaybe ring your sister and ask her to come to you.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cMy sister has her own knees, love.\u201d The blame moves a little further along the line.","why":"A kind suggestion, but it is still you running the plan and Mum turning it down. You have become the one who has to fix it."},{"text":"\u201cI suppose it's me, then. I'm sorry I'm so much trouble.\u201d","tag":"game","you":-5,"them":-6,"outcome":"\u201cNo, no, love, you're a good boy,\u201d she says, and asks whether you have eaten.","why":"A trap move: you took the blame and asked to be forgiven for it. The question about the bus is never asked, and the blame moves into your pocket."}]}],"payoff":"Mum hangs up, sure that everyone is against Dad, and the bus for Thursday stays unbooked.","example":"A cousin on a video call, Sunday. \u201cIf it weren't for my husband's shifts, we'd have gone to the coast by now.\u201d You say, \u201cAnd if the shifts were his problem to solve, what would you do?\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions. Pick the reply that matches what happened, and why it worked.","items":[{"type":"pick","who":"Maya","text":"\u201cLet me tell you what he did.\u201d Which reply stops the case from running?","cue":"the case is open and you are the one on the stool","options":["Give Maya the verdict now, so she can stop talking.","Tell Maya to say it to Sam, since he is in the room.","Ask Sam to explain himself to you, the judge."],"answer":1,"why":"When someone talks about a person who is in the room, the talk is aimed at you as the judge, and the person it is about is left out. Turning the talk to that person directly removes the judge. The court has nowhere to sit.","traps":{"0":"A verdict ends the talk for a minute, but the case stays open. Maya will bring the next one to the same stool, because you have just shown her where the judge sits.","2":"This still puts you in the middle. Sam now speaks to the judge, and the case becomes a hearing with better manners. The room is the same, and only the seating has moved."},"example":"A friend on a train, Sunday. \u201cLet me tell you what my brother did about the flat.\u201d You say, \u201cTell him, he's on the phone. Put him on speaker.\u201d"},{"type":"pick","who":"Sam","text":"\u201cYou never come to anything, so forget it. I'll go alone, like always.\u201d Which reply steps out of the corner?","cue":"keys already in his hand, the film paused on the screen","options":["I'll come, and I'll be annoyed that you made it a fight.","I'll come, and let's pick the film together.","I'm not coming, because you always make it hard."],"answer":1,"why":"The corner has two doors, and both lead to the same wall. Coming means you came only because you were pushed, and staying means you never come. The way out is to drop the refusal and join in warmly on the plan.","traps":{"0":"This goes through the first door. You come, but you bring the sulk with you, so the label \u201cnever comes\u201d is still on the table and he gets to say he was right.","2":"This goes through the second door. The refusal confirms the label, and the corner closes behind you. He can now say, with a straight face, that you never come."},"example":"A group chat about a cricket match, Saturday. One friend writes, \u201cYou never turn up, so I've booked the nets without you.\u201d You reply, \u201cCount me in, and I'll bring the drinks.\u201d"}]}],"debrief":{"nadia":"Several home traps came up in one week, and each had a way out that sounded too simple. Say the thing to the person in the room, or hand the choice back. Try one of them this week.","bookTerm":"Marital games","bookNote":"The books call these marital games: games that grow into their fullest form in marriage and family living. Berne lists Corner, Courtroom, Frigid Woman and Frigid Man, Harried, If It Weren't for You, Look How Hard I've Tried, and Sweetheart, and notes that some of them also appear in children and in whole families."},"reflection":{"prompt":"Which home trap ran in your flat or on the phone this week, and what would stepping out of it have sounded like?"},"next":"4.5","baseStory":{"setting":"Home & Flatmates","blurb":"Maya, Sam and you share a flat, a milk carton with a promise on it, and unpaid rent."},"moreStories":[{"setting":"Relationships","blurb":"Omar and Clara are circling a second dinner, and you are the friend both of them talk to.","opener":{"setting":"Thursday, 6:10pm. The Corner Table, the window seat. Omar's tea has gone cold beside the sugar bowl, and Clara has just laid a printed schedule next to it.","lines":[{"who":"Clara","text":"\u201cSit, you can referee. It's only a draft. Three plans for Saturday, colour-coded, in case he hates the first two.\u201d","cue":"squaring the page to the edge of the table"},{"who":"Omar","text":"\u201cIt's a second dinner, Clara. I thought we'd see where the evening goes.\u201d","cue":"turning the cold cup a quarter turn"}],"ask":"Name the home trap that is running between them, and find the one reply that steps out of it without picking a side."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each home trap has a plain name. Tap the one that is running in the line.","items":[{"type":"pick","who":"Clara","text":"\u201cEleven times I checked my phone on Tuesday, darling. No rush, though. Take all the time you like.\u201d","cue":"smiling at the sugar bowl, not at Omar","options":["the corner","sweetheart","the rush"],"answer":1,"why":"The jab sits in the middle of the line and the pet name wraps round it. Clara points at the unanswered text through a loving word, so Omar cannot object without seeming petty. The sting hides inside the endearment.","traps":{"0":"This would be the corner if every reply he could give were wrong. Clara has not set two doors. She has one jab with a ribbon on it, and he can answer it directly.","2":"This would be the rush if she were too busy to stop. Clara has plenty of time. She spent it counting."},"example":"A neighbour at the lift, Monday. \u201cLovely of you to remember the bins this week, dear. Some of us noticed the last three.\u201d"},{"type":"pick","who":"Clara","text":"\u201cI ironed the green shirt, I learned the bus times, I booked the table twice in case the first fell through. And you still looked at your phone.\u201d","cue":"laying the schedule flat with both palms","options":["if it weren't for you","the court","look how hard I've tried"],"answer":2,"why":"She lists the effort and leaves out what she wants. The effort works as a shield, because it is hard to argue with trying. Meanwhile the thing she never says out loud, that she wanted his full attention, stays unasked.","traps":{"0":"This would be if it weren't for you if she were blaming a rule or a person for what she had not done. Clara blames nobody. She is asking to be admired for trying.","1":"This would be the court if she were building a case for a third person to judge. She is speaking to Omar and presenting her own exhibits."},"example":"A colleague at a leaving do, Friday. \u201cI wrote the speech, I bought the card, I even found a cake with her name on. And nobody said thank you.\u201d"},{"type":"pick","who":"Clara","text":"\u201cDon't get up, I'll do it. The bill, the coats, the walk to the bus stop, the text to say we got home. It's me or nobody.\u201d","cue":"already holding Omar's scarf out to him","options":["the rush","sweetheart","the court"],"answer":0,"why":"She is too busy to stop, and the busyness is the bait. She takes on every small job as it arrives and offers more, so the list only grows. In the book a day like this ends in a collapse where nothing is enjoyed, and she blames herself for it.","traps":{"1":"This would be sweetheart if the line ended on a pet name with a jab tucked inside. There is no endearment here, only a pile of jobs that nobody asked her to carry.","2":"This would be the court if she were building a case against someone absent. Nobody is accused. She is tired and busy and calling it love."},"example":"A neighbour at a street party, Saturday. \u201cSit down, all of you, I'll do the urn, the cups, the bunting, the washing up. Nobody else is free.\u201d"},{"type":"pick","who":"Clara","text":"\u201cIf it weren't for Daniel's release dates, I'd have asked him to the lake weeks ago. Every week is a freeze.\u201d","cue":"turning her phone face down on the schedule","options":["the rush","if it weren't for you","the corner"],"answer":1,"why":"She blames someone else's rule for what she is not doing, and the complaint is the point. The release dates also keep her from the risk of hearing a no, so she complains about them and never tests them. While Daniel is the cause, nothing has to change at her end.","traps":{"0":"This would be the rush if she were taking on more work. She is doing the opposite and holding back, with a tidy reason.","2":"This would be the corner if every reply you gave left you stuck. Clara offers no second door. She is parking the whole problem on someone who is not at the table."},"example":"A neighbour at the post box, Tuesday. \u201cIf it weren't for my sister's shifts I'd have joined the choir years ago.\u201d<br>The shifts take the blame, and the choir is never tried."}]},{"level":"Play","label":"Play, the week in motion","intro":"Three scenes with the same people. Keep both meters above half at the end of each one, and watch for the moment someone hands you a chair you didn't ask for.","items":[{"type":"scene","title":"Thursday, 6:25pm, the window seat","setting":"The Corner Table. Omar is at the counter ordering, back to you, one ear turned. Clara has pushed the schedule to your side of the table. <i>The Heckler, in your head: \u201cYou're the neutral one, so you decide.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Clara","text":"\u201cLet me tell you what Omar did. A text sat for a whole day. You're the sensible one, so you tell him.\u201d","cue":"voice low, eyes on the counter","lines":[{"text":"\u201cTell him yourself, Clara. He's thirty feet away, not on the moon.\u201d","tag":"best","you":4,"them":3,"outcome":"She half stands, sits again, then lifts a hand at the counter. Omar raises the milk jug in answer.","why":"A court runs on talk about someone, not to them. Speaking to the person directly stops it before the first witness."},{"text":"\u201cGo on, then. What did he do this time?\u201d","tag":"ok","you":-2,"them":2,"outcome":"She tells you all of it: Tuesday's text, Wednesday's reply, the single word at the end. Omar stirs nothing at the counter.","why":"You took the chair without being asked. The court now has its judge, and the case grows while Omar waits with his back turned."},{"text":"\u201cA whole day? That's rude. Someone should tell him off.\u201d","tag":"game","you":2,"them":-4,"outcome":"Clara nods hard. Omar comes back with the tray, reads both faces, and says, \u201cWho died?\u201d Nobody laughs.","why":"A trap move: you passed a sentence before hearing him. The court has two against one, and the table goes stiff."}]},{"who":"Omar","text":"\u201cMy phone was in a locker at the pool. I answered when I got out. I'd have said so, but nobody asked.\u201d","cue":"setting the tray down, voice level","lines":[{"text":"\u201cThen tell her the locker part, Omar. She's the one who waited.\u201d","tag":"best","you":4,"them":3,"outcome":"He turns his chair a few degrees towards Clara. \u201cLocker at the pool, and I should have typed one line first. Sorry.\u201d","why":"You send the answer to the person who is owed it. An explanation said to the right face is the only defence a court cannot argue with."},{"text":"\u201cFair enough. Locker. Case closed, Clara.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Clara says, \u201cI didn't ask you to close it.\u201d","why":"A verdict ends the argument for a minute and keeps you in the chair. Clara learns the court still works, so she will use it again."},{"text":"\u201cYou could carry your phone in a pocket like everyone else, Omar.\u201d","tag":"game","you":2,"them":-5,"outcome":"Omar's jaw sets. \u201cRight. Noted.\u201d He drinks the cold tea and says nothing else.","why":"You took the prosecution's side and gave advice as a sentence. The explanation is gone, and Omar has his proof that the table is against him."}]},{"who":"Clara","text":"\u201cSee? There's always a reason with him. So you'll sort out Saturday with him as well, won't you?\u201d","cue":"already sliding the schedule across to you","lines":[{"text":"\u201cSay Saturday to him, Clara. Look at him and ask for the thing itself.\u201d","tag":"best","you":3,"them":4,"outcome":"She breathes in. \u201cOmar. Saturday. Do you want to?\u201d \u201cYes,\u201d he says. \u201cSince Tuesday.\u201d","why":"The case moves back into the room. What was about him becomes what is between the two of them, and only that version can be settled."},{"text":"\u201cSure, I'll talk to him about Saturday.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Clara says, \u201cThanks,\u201d and you have taken on a second case without a single witness.","why":"You agreed to carry a request for someone else. It sounds helpful, but the court is still open and you are now its messenger."},{"text":"\u201cClara, has it crossed your mind to just ask him? Out loud?\u201d","tag":"game","you":1,"them":-3,"outcome":"She takes the schedule back. \u201cWhose side are you on?\u201d The window seat goes flat.","why":"A trap move: a question with a verdict hidden in it. The case flips and you become the defendant."}]},{"who":"Omar","text":"\u201cSo what's the verdict? Everyone at Halden says you always have one.\u201d","cue":"a half smile, both hands round the cup","lines":[{"text":"\u201cNo verdict. Settle Saturday between you two, and I'll eat the cake.\u201d","tag":"best","you":4,"them":4,"outcome":"\u201cSix,\u201d says Omar. \u201cThe lantern walk,\u201d says Clara. She writes a small 6 in pen on the corner of the page.","why":"You hand the decision to the two people with the relationship. The court closes because nobody is waiting for a judge."},{"text":"\u201cSaturday at six, and I'll book the table myself.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Omar says, \u201cThe judge books the table,\u201d and Clara laughs for the first time tonight.","why":"A fair ruling and the mood lifts, but you still hold the verdict. Next week somebody will ask you again."},{"text":"\u201cGuilty, both of you. Clara asks plainly and Omar answers within the hour, or I take the schedule.\u201d","tag":"game","you":2,"them":-6,"outcome":"\u201cThat's not fair,\u201d Clara says. Omar says, \u201cNoted,\u201d again, and they both stop talking to you.","why":"You sentenced them from the chair, and the sentence closed the case with no agreement. Now both are talking about you."}]}],"payoff":"The court closes with you in the judge's seat. Both of them are sure you picked a side, and the schedule stays in the folder, unread.","fallout":{"them":"Clara slips the schedule into her bag and says she has an early start. The cake sits half eaten between you."},"example":"A school governors' meeting, Tuesday. Two members argue over the minibus key and the chair is asked to rule. She says, \u201cAsk each other directly,\u201d and the key is passed along."},{"type":"scene","title":"Friday, 5:50pm, the lift lobby","setting":"Halden. Clara has two lantern-walk tickets fanned in one hand and her coat on. <i>The Heckler, in your head: \u201cSay no first, so you can't be the one who lets her down.\u201d<\/i>","meters":{"you":50,"them":50},"beats":[{"who":"Clara","text":"\u201cTwo tickets for the lantern walk. One's for Omar, if he says yes, and the other was for you. Never mind. You never come to anything.\u201d","cue":"watching the floor numbers instead of you","lines":[{"text":"\u201cI'll come. Tell me where to meet, and I'll bring the flask.\u201d","tag":"best","you":4,"them":4,"outcome":"She stops fanning the tickets. \u201cThe bridge. Seven. Bring the big flask, the small one leaks.\u201d","why":"You drop the refusal and say a yes with a job attached. The corner has no wall left once you walk through it warmly."},{"text":"\u201cMaybe. I've had a long week.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"She nods too quickly. \u201cOf course.\u201d The tickets go back in her bag.","why":"A maybe leaves the door half shut. Nothing breaks, and she gets to be the one who was left out."},{"text":"\u201cFine, I'll come, but only because you've made me feel like the bad friend.\u201d","tag":"game","you":-4,"them":-5,"outcome":"Clara folds the tickets in half. \u201cThen don't,\u201d she says, and the lift opens on an empty car.","why":"A trap move: you said yes and made it her fault. Both answers lose in a corner, and this one keeps you both on the same wall."}]},{"who":"Clara","text":"\u201cOh, now you're coming? Only because I sulked. Forget it, go home.\u201d","cue":"tucking the tickets deep into her bag","lines":[{"text":"\u201cI want to come. When do the lanterns go up? Tell me the bit you're looking forward to.\u201d","tag":"best","you":4,"them":4,"outcome":"She stops. \u201cThe bridge. They float them off the bridge. Omar says it's silly.\u201d \u201cOmar said yes?\u201d \u201cHe said yes.\u201d","why":"You answer the plan and leave the label alone. She gets to be excited about something, which is what the corner was hiding."},{"text":"\u201cYou're right, I never come. I'll try next time.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cNext time,\u201d she says flatly, and presses the lift button again.","why":"You accepted the label, so the corner is now yours to live in. A promise for next time is a way of staying there."},{"text":"\u201cYes, I never come, because every time I do it turns into a schedule.\u201d","tag":"game","you":-3,"them":-6,"outcome":"Clara walks into the lift. The doors close before you finish the sentence.","why":"A trap move: you agreed with the label and gave her the reason. Both of you have said the corner out loud, and that is where it stays."}]},{"who":"Clara","text":"\u201cThe tickets are in my bag if you want one. I'm not going to chase you.\u201d","cue":"one hand holding the lift door","lines":[{"text":"\u201cThanks. I'll take the spare, and you can tell me when to look up.\u201d","tag":"best","you":3,"them":4,"outcome":"She puts a ticket in your hand. \u201cSeven at the bridge. Don't be early, I won't be ready.\u201d","why":"You join warmly with a small plan of your own. The corner offered a sulky yes or a no, and you gave neither."},{"text":"\u201cSorry, I'm not in the mood.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"\u201cFair enough,\u201d she says, and lets the door close.","why":"A calm no beats a sulk, but it still closes the plan. You are now on opposite sides of the door."},{"text":"\u201cChasing isn't your thing, Clara. I'm not staying to watch you try.\u201d","tag":"game","you":-4,"them":-6,"outcome":"She laughs once, not kindly, and the lift takes her down.","why":"A trap move: you turned her request into a verdict on her. The corner closes and the walk goes ahead without you."}]}],"payoff":"The corner closes on both of you. Clara rides down alone with both tickets, and the lantern walk becomes a plan nobody mentions.","example":"A colleague leaves a book club chat: \u201cYou never come to these, so I won't bother asking.\u201d You write, \u201cI'll come, and I'll save you the sofa seat.\u201d"},{"type":"scene","title":"Sunday, 8:30pm, the speakerphone","setting":"Clara has you on speaker in Omar's hallway, coat still on. The kettle is running in the next room. <i>The Heckler, in your head: \u201cIf she is upset, fixing it is your job.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Clara","text":"\u201cIf it weren't for Daniel's release dates, I'd have asked him to the lake weeks ago. Every week is a freeze.\u201d","cue":"pitched to carry into the next room","lines":[{"text":"\u201cThat sounds boxed in. If it were only up to you, what would you do?\u201d","tag":"best","you":4,"them":3,"outcome":"A long pause. \u201cAsk him to the lake, I suppose. In May. But I'd have to ask him first.\u201d It is the first plan of the call.","why":"The blame needs somewhere to go. You hand the choice to the one who holds it, so the \u201cif it weren't for\u201d has to become a decision."},{"text":"\u201cI know. Daniel's always been like that.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cAlways,\u201d she says, and the complaint grows a second paragraph about the sprint calendar.","why":"You agreed that Daniel is the cause. The blame stays on him, and your agreement gives Clara a second witness."},{"text":"\u201cIt's Daniel's fault, then. I'll have a word with him on Monday.\u201d","tag":"game","you":-4,"them":-5,"outcome":"\u201cWould you? Good,\u201d says Clara, and the line goes quiet while the kettle clicks off.","why":"A trap move: you took the Saviour's chair and promised to fix Daniel for her. The blame has a messenger and the lake never comes up."}]},{"who":"Omar","text":"\u201cI heard that. I'm free the whole of May.\u201d","cue":"from the kitchen, one hand on the tap","lines":[{"text":"\u201cThen tell her yourself, Omar. Don't say it through me.\u201d","tag":"best","you":4,"them":3,"outcome":"The tap stops. His voice is closer. \u201cClara. The lake. May.\u201d","why":"You send the message back to the person who can say it to her face. Omar's steady \u201cI'm free\u201d becomes an invitation only when he addresses it to her."},{"text":"\u201cYou two sort it out. I'm only the phone.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"\u201cRight,\u201d says Omar, and the tap runs again.","why":"Neutral and harmless, but it leaves Omar's \u201cfree\u201d as a remark and Clara's blame where it was."},{"text":"\u201cOmar, you never say so. You just tell her you're free.\u201d","tag":"game","you":-3,"them":-6,"outcome":"Clara says, \u201cSee? Even you agree with me,\u201d and Omar's footsteps go the other way.","why":"You joined the case against him, so the phone turns into a court with you as the witness. The call ends early."}]},{"who":"Clara","text":"\u201cHe says he's free, which isn't asking. And if it weren't for you telling me to be patient, I'd have said it weeks ago. So what would you do?\u201d","cue":"quieter now, pleased to have a witness","lines":[{"text":"\u201cI'm not the reason, Clara. Ask him for the lake, straight out, and I'll text you Monday to hear how it went.\u201d","tag":"best","you":4,"them":4,"outcome":"She is silent, then says, \u201cThe lake. Straight out. Hmm.\u201d It is the second plan of the call.","why":"You refuse the blame you were handed, then give Clara a specific ask she can make herself. Asking straight is the way out of the \u201cif it weren't for\u201d line."},{"text":"\u201cMaybe leave him a note on the kettle.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cA note,\u201d says Clara. \u201cHe'd frame it.\u201d The blame moves a step along the hall.","why":"A kind idea, but you are running the plan and Clara is turning it down. You have become the one who has to fix it."},{"text":"\u201cI suppose it's me, then. Sorry I told you to wait.\u201d","tag":"game","you":-5,"them":-6,"outcome":"\u201cNo, no, you're a good friend,\u201d says Clara, and asks whether you have eaten.","why":"A trap move: you took the blame and asked to be forgiven for it. The question about the lake is never asked, and the blame moves into your pocket."}]}],"payoff":"Clara ends the call sure that everyone has been waiting for someone else, and the lake stays unmentioned.","example":"A friend on a walk, Sunday. \u201cIf it weren't for my sister's wedding dates, we'd have booked the trip already.\u201d You say, \u201cAnd if the dates weren't in the way, what would you book?\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions. Pick the reply that matches what happened, and why it worked.","items":[{"type":"pick","who":"Clara","text":"\u201cLet me tell you what he did.\u201d Which reply stops the case from running?","cue":"the case is open and you are the one in the judge's chair","options":["Give Clara a ruling on the text, so she can stop worrying about it.","Ask Omar to explain the Tuesday text to you, the neutral one.","Tell Clara to say it to Omar, who is right there."],"answer":2,"why":"When someone talks about a person who is in the room, the talk is aimed at you as the judge, and the person it is about is left out. Turning the talk towards that person removes the judge. The court has nowhere to sit.","traps":{"0":"A verdict ends the talk for a minute, but the case stays open. Clara will bring the next one to the same chair, because you have shown her where the judge sits.","1":"This still puts you in the middle. Omar now speaks to the judge, and the case becomes a hearing with better manners. The room is the same and only the seating has moved."},"example":"A friend on a bus, Sunday. \u201cLet me tell you what my brother said about the flat.\u201d You say, \u201cTell him, he's in the next seat. Say it to his face.\u201d"},{"type":"pick","who":"Clara","text":"\u201cYou never come to anything, so forget it. I'll go alone with the tickets.\u201d Which reply steps out of the corner?","cue":"one ticket already half out of her bag","options":["I'll come. Which scarf should I bring?","I'll come, and I'll mention that you made it a fight.","I'm not coming, because you always make it a test."],"answer":0,"why":"The corner has two doors and both lead to the same wall. Coming means you came only because you were pushed, and staying away means you never come. The way out is to drop the refusal and join in warmly on the plan.","traps":{"1":"This goes through the first door. You come, but you bring the sulk with you, so the label \u201cnever comes\u201d is still on the table and she can say she was right.","2":"This goes through the second door. The refusal confirms the label, and the corner closes behind you. She can now say with a straight face that you never come."},"example":"A group chat about a cricket match, Saturday. \u201cYou never turn up, so I've booked the nets without you.\u201d You reply, \u201cCount me in, and I'll bring the drinks.\u201d"}]}]},{"setting":"School & College","blurb":"Sam's evening class: a group poster with one blank panel, a tutor's remark, a Thursday presentation.","opener":{"setting":"Tuesday, 7:40pm. The community hall, Sam's evening class. Break time, workbooks open on the long table, and the poster for Thursday's group presentation still has one blank panel.","lines":[{"who":"Tilly","text":"\u201cSit, don't say no. I've printed the references, done the title and cut the card. Panel four is yours or Sam's, whoever turns up.\u201d","cue":"already feeding card into the guillotine"},{"who":"Sam","text":"\u201cSorry, sorry, panel four is on my list. Look, I've colour-coded the list.\u201d","cue":"holding up a notebook striped with six highlighters"}],"ask":"Name the home trap that is running at this table, and find the one reply that steps out of it without starting a fight."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each home trap has a plain name. Tap the one that is running in the line.","items":[{"type":"pick","who":"Tilly","text":"\u201cDon't sit, I'll do it. The references, the cutting, the printing, panel four as well. Nobody else has the time, so it's me.\u201d","cue":"the guillotine blade coming down on a strip of card","options":["the rush","sweetheart","the court"],"answer":0,"why":"She is too busy to stop, and the busyness is the bait. She takes on each job as it arrives and offers the next one, so the pile only grows. In the book the evening ends in a collapse where nothing gets finished, and she blames herself for it.","traps":{"1":"This would be sweetheart if the line ended on a pet name with a jab tucked inside. There is no endearment here, only a stack of jobs nobody asked her to carry.","2":"This would be the court if she were building a case against Sam. She names no one. She is simply doing everything and counting it."},"example":"A parents' group, Thursday. One mother answers every message within a minute, collects the raffle tins, and says \u201cI'll do the lot, nobody else is free\u201d before the meeting starts."},{"type":"pick","who":"Mrs Dunmore","text":"\u201cLovely effort for someone who joined in week five, dear. Most of you had a head start, of course.\u201d","cue":"tapping the feedback sheet with a capped pen","options":["the corner","sweetheart","look how hard I've tried"],"answer":1,"why":"The jab about starting late sits in the middle, and the pet name wraps round it. The tutor points at a weakness through a kind word, so you cannot object without seeming ungrateful. The sting hides inside the endearment.","traps":{"0":"This would be the corner if every answer you gave were wrong. She has not set two doors. She has one remark with a ribbon on it, and you can answer it directly.","2":"This would be look how hard I've tried if the speaker were showing their own effort. She is pointing at yours, and she is using the calendar as her proof."},"example":"A bank clerk, Friday. \u201cVery good for a first-time account holder, sir. Most people read the leaflet.\u201d"},{"type":"pick","who":"Sam","text":"\u201cI've tried so hard. Six colours of highlighter, two evenings in the library, I even bought the extra folder. And you still look at me like that.\u201d","cue":"fanning pages without looking up","options":["the court","the rush","look how hard I've tried"],"answer":2,"why":"He lays out the effort and says nothing about panel four. The effort is a shield: whatever happens next, he can say he tried, and trying is hard to argue with. Meanwhile the blank panel is still blank.","traps":{"0":"This would be the court if he were making a case against someone absent. Sam accuses nobody. He is asking you to admire the trying.","1":"This would be the rush if he were too busy to stop. Sam has plenty of time to show you his highlighters, which is the point."},"example":"A cousin at a wedding, Saturday. \u201cI've tried so hard with the diet, I've even stopped the sweets, and you still say I'm not serious.\u201d The plate of sweets is on the table behind him."},{"type":"pick","who":"Sam","text":"\u201cIf it weren't for the night bus stopping at nine, I'd be in the library every evening. They put the stop on the wrong side of the road.\u201d","cue":"hooking his rucksack onto one shoulder","options":["sweetheart","the corner","if it weren't for you"],"answer":2,"why":"He blames someone else's timetable for what he is not doing, and the complaint is the point. The bus also keeps him away from the risk of sitting down to a blank panel, so he complains about it and never tests it. While the bus is the cause, nothing has to change at his end.","traps":{"0":"This would be sweetheart if the sentence ended on a pet name with a sting in it. Sam's sting sits in the blame alone.","1":"This would be the corner if every answer you gave left you stuck. Sam offers no second door. He is parking the whole problem on a bus."},"example":"A neighbour at the lift, Tuesday. \u201cIf it weren't for my husband's shifts, I'd have joined the choir years ago.\u201d<br>The shifts get the blame, and the choir is never tried."}]},{"level":"Play","label":"Play, the week in motion","intro":"Three scenes with the same people. Keep both meters above half at the end of each one, and watch for the moment someone hands you a chair you didn't ask for.","items":[{"type":"scene","title":"Wednesday, 6:30pm, the library study room","setting":"The glass study room. Sam is two chairs away copying a diagram, and Tilly has pulled her chair next to yours. <i>The Heckler, in your head: \u201cYou're the fair one. Rule on it.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Tilly","text":"\u201cLet me tell you what Sam did to panel four. Nothing, again. You're the fair one, so you tell him.\u201d","cue":"whispering, glancing at his bent head","lines":[{"text":"\u201cTell him, Tilly. He's two chairs away and he has ears.\u201d","tag":"best","you":4,"them":3,"outcome":"She turns her chair. \u201cSam. Panel four.\u201d He sits up, surprised to be asked straight, and the room gets a little quieter.","why":"A court runs on talk about someone, not to them. Speaking to the person directly stops it before the first witness."},{"text":"\u201cGo on, what did he do this week?\u201d","tag":"ok","you":-2,"them":2,"outcome":"She gives you the whole week: the fonts, the missing arrow, the three messages he left on read. Sam keeps copying.","why":"You took the chair without being asked. The court has its judge, and the case grows while Sam listens from two chairs away."},{"text":"\u201cNothing at all? That's lazy of him.\u201d","tag":"game","you":2,"them":-4,"outcome":"Sam pulls his headphones up. Tilly says, \u201cThank you,\u201d as though you had both agreed.","why":"A trap move: you passed judgment on someone who could hear. The court has two against one, and the table splits."}]},{"who":"Sam","text":"\u201cSorry, sorry. The fonts took me an hour, and the library printer ate my credit. I'd have done panel four tonight, I swear.\u201d","cue":"not looking up, one hand over the diagram","lines":[{"text":"\u201cThen give Tilly a time, Sam. Say it to her, not to me.\u201d","tag":"best","you":4,"them":3,"outcome":"He turns to Tilly. \u201cTonight by nine. I'll send you a photo.\u201d","why":"You send the answer to the person who is owed it. A time said to the right face is the only defence a court cannot argue with."},{"text":"\u201cFine, I'll rule that tonight counts, and that's the end of it.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Sam nods. Tilly says, \u201cI asked you to tell him, not to rule on it.\u201d","why":"A verdict ends the argument for a minute and keeps you in the chair. Tilly learns the court still works, so she will come back."},{"text":"\u201cTilly's right, you're always behind. It's your fault.\u201d","tag":"game","you":2,"them":-5,"outcome":"Sam says, \u201cOkay, okay,\u201d and the sorry turns into a sulk behind his folder.","why":"You took the prosecution's side and read out the sentence. The apology is gone, and Sam has proof the table is against him."}]},{"who":"Tilly","text":"\u201cSee? He always has a printer. So you'll sort out the speaking order with him as well, won't you?\u201d","cue":"already writing names on a sticky note","lines":[{"text":"\u201cSay the speaking order to him, Tilly. Look at him and say all of it.\u201d","tag":"best","you":3,"them":4,"outcome":"She holds the note up to Sam. \u201cI'm first, you're third. Is that all right?\u201d \u201cFine,\u201d he says. \u201cI'd rather be third.\u201d","why":"The case moves back into the room. What was about him becomes what is between the two of them, and only that version can be settled."},{"text":"\u201cSure, I'll sort out the order with him.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Tilly says, \u201cThanks,\u201d and you have taken on a second case without a witness.","why":"You agreed to carry a request for someone else. It sounds helpful, but the court is still open and you are its messenger."},{"text":"\u201cTilly, have you ever asked him to go first? Out loud?\u201d","tag":"game","you":1,"them":-3,"outcome":"She puts the sticky note down. \u201cWhose side are you on?\u201d The room goes flat.","why":"A trap move: a question with a verdict hidden in it. The case flips and you become the defendant."}]},{"who":"Sam","text":"\u201cSo what's the verdict? You always have one.\u201d","cue":"grinning, tapping a highlighter on the desk","lines":[{"text":"\u201cNo verdict. You two settle who speaks first, now, with me here.\u201d","tag":"best","you":4,"them":4,"outcome":"\u201cTilly first,\u201d says Sam. She nods once and sticks the note to the poster's edge.","why":"You hand the decision to the two people who have to stand there. The court closes because nobody is waiting for a judge."},{"text":"\u201cTilly first, and I'll tell Sam myself.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Sam says, \u201cHa, the judge tells me,\u201d and Tilly laughs for the first time tonight.","why":"A fair ruling and the mood lifts, but you still hold the verdict. Next week somebody will ask you again."},{"text":"\u201cGuilty. Sam, you're doing panels four and five by Thursday.\u201d","tag":"game","you":2,"them":-6,"outcome":"\u201cThat's not fair,\u201d says Sam. Tilly says, \u201cSee, he never listens,\u201d and both stop talking to you.","why":"You sentenced him from the chair, and the sentence closed the case with no agreement. Now both are talking about you."}]}],"payoff":"The court closes with you in the judge's seat. Both of them are sure you picked a side, and panel four stays blank.","fallout":{"them":"Tilly gathers the card offcuts and leaves without a word. The blank panel sits on the table until the caretaker turns the lights off."},"example":"A parents' WhatsApp group, Saturday. Two mothers argue about the raffle money and the class rep keeps being asked to decide. She writes, \u201cAsk each other directly,\u201d and the tin is counted."},{"type":"scene","title":"Thursday, 4:20pm, the library steps","setting":"Sam has his rucksack on and a bus pass between two fingers. The presentation is at seven. <i>The Heckler, in your head: \u201cSay no first, so you can't be the one who lets him down.\u201d<\/i>","meters":{"you":50,"them":50},"beats":[{"who":"Sam","text":"\u201cCome and rehearse the talk with me at five. Oh, forget it. You never come to anything I set up.\u201d","cue":"looking at the bus stop instead of you","lines":[{"text":"\u201cI'll come. Give me five minutes, and you can bring the stopwatch.\u201d","tag":"best","you":4,"them":4,"outcome":"He stops turning the pass over and grins. \u201cFive minutes. Don't bring the sad face.\u201d","why":"You drop the refusal and say a yes with a time and a jo
