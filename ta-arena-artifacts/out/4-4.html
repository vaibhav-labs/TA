b attached. A warm yes takes the wall away."},{"text":"\u201cI'm not sure. I've got work stuff.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"He nods too fast. \u201cSure.\u201d The bus pass goes back in his pocket.","why":"A maybe leaves the door half shut. Nothing breaks, and he gets to be the one who was left out."},{"text":"\u201cFine, I'll come, but only because you've made me feel like the bad classmate.\u201d","tag":"game","you":-4,"them":-5,"outcome":"He sighs and starts down the steps two paces ahead. The rehearsal happens in silence.","why":"A trap move: you said yes and made it his fault. Both answers lose in a corner, and this one keeps you both on the same wall."}]},{"who":"Sam","text":"\u201cOh, now you're coming? Only because I said you wouldn't. Right, I'll just practise on the bus.\u201d","cue":"already half down the steps","lines":[{"text":"\u201cI want to come. Which slide scares you most? We'll start there.\u201d","tag":"best","you":4,"them":4,"outcome":"He stops. \u201cSlide four. The graph with the three lines. I always say lines when I mean bars.\u201d","why":"You answer the plan and leave the label alone. He gets to name something real, which is what the corner was hiding."},{"text":"\u201cYou're right, I never come. I'll try next time.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cNext time,\u201d he says flatly, and the bus pass comes out again.","why":"You accepted the label, so the corner is now yours to live in. A promise for next time is a way of staying there."},{"text":"\u201cYes, I never come, because every time I do you hide behind the colour-coding.\u201d","tag":"game","you":-3,"them":-6,"outcome":"He goes down the steps. The bus arrives and he is on it before you reach the kerb.","why":"A trap move: you agreed with the label and gave him the reason. Both of you have said the corner out loud, and that is where it stays."}]},{"who":"Sam","text":"\u201cThe stopwatch is in my bag, if you want it. I'm not going to beg.\u201d","cue":"bag held out an inch from his shoulder","lines":[{"text":"\u201cThanks. I'll hold it, and you tell me when slide four goes wrong.\u201d","tag":"best","you":3,"them":4,"outcome":"He sits on the step beside you. \u201cSlide four. Three lines. Watch me say lines.\u201d","why":"You join in warmly with a small plan of your own. The corner offered a sulky yes or a no, and you gave neither."},{"text":"\u201cSorry, I'm not in the mood.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"\u201cFair enough,\u201d he says, and walks to the stop with the stopwatch still in his bag.","why":"A calm no beats a sulk, but it still closes the plan. You are now on opposite sides of the road."},{"text":"\u201cBegging is your thing, Sam. I'm not sitting through it.\u201d","tag":"game","you":-4,"them":-6,"outcome":"He laughs once, not kindly, and gets on the bus.","why":"A trap move: you turned his request into a verdict on him. The corner closes and he rehearses alone."}]}],"payoff":"The corner closes on both of you. Sam rehearses alone on the top deck, and slide four goes untouched.","example":"A friend asks you to help at a charity stall: \u201cYou never turn up, so I've stopped asking.\u201d You write, \u201cPut me down for the cash tin. I'll be there at nine.\u201d"},{"type":"scene","title":"Thursday, 7:05pm, the hall corridor","setting":"Five minutes before the presentation. Tilly stands by the vending machine with her note cards, and Mrs Dunmore's door is ajar behind her. <i>The Heckler, in your head: \u201cIf she is upset, fixing it is your job.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Tilly","text":"\u201cIf it weren't for Mrs Dunmore's rubric, I'd be calm. A whole mark for eye contact? Nobody reads a poster with their eyes.\u201d","cue":"loud enough to carry through the open door","lines":[{"text":"\u201cThat sounds like a lot to carry. If it were only up to you, how would you open?\u201d","tag":"best","you":4,"them":3,"outcome":"A pause. \u201cSay the title and look at the clock, I suppose. But I'd have to look up first.\u201d It is the first plan of the night.","why":"The blame needs somewhere to go. You hand the choice to the one who holds it, so the \u201cif it weren't for\u201d has to become a decision."},{"text":"\u201cI know. Mrs Dunmore's always been like that.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cAlways,\u201d says Tilly, and the complaint grows a paragraph about the marking sheet.","why":"You agreed that the tutor is the cause. The blame stays on her, and your agreement gives Tilly a second witness."},{"text":"\u201cIt's her fault, then. I'll ask her to drop that mark.\u201d","tag":"game","you":-4,"them":-5,"outcome":"\u201cWould you? Good,\u201d says Tilly, and walks off to find the toilets.","why":"A trap move: you took the Saviour's chair and promised to fix the tutor for her. The blame has a messenger and the opening is never rehearsed."}]},{"who":"Mrs Dunmore","text":"\u201cI heard that. The rubric went on the board in week two.\u201d","cue":"the door opening, clipboard against her chest","lines":[{"text":"\u201cThen say that to Tilly, Mrs Dunmore. Don't send it through me.\u201d","tag":"best","you":4,"them":3,"outcome":"A pause. \u201cTilly, the eye contact mark is for looking up once a minute,\u201d she says. \u201cThat is all it is.\u201d","why":"You send the message back to the person who can say it to Tilly's face. The tutor's \u201cweek two\u201d becomes information only when she addresses it to her."},{"text":"\u201cYou two sort it out. I'm only standing here.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"\u201cWe're fine,\u201d says Mrs Dunmore, and the door stays ajar.","why":"Neutral and harmless, but it leaves the tutor's \u201cfine\u201d in place and Tilly's blame where it was."},{"text":"\u201cMrs Dunmore, you never explain the marks. You just say it was on the board.\u201d","tag":"game","you":-3,"them":-6,"outcome":"Tilly says, \u201cSee? Even they agree with me,\u201d and Mrs Dunmore closes the door.","why":"You joined the case against the tutor, so the corridor turns into a court with you as the witness. The conversation ends early."}]},{"who":"Tilly","text":"\u201cShe doesn't even talk to me. And if it weren't for you telling me to say it to Sam on Wednesday, I'd have swapped and be sitting down by now. So what would you do?\u201d","cue":"quieter now, pleased to have a witness","lines":[{"text":"\u201cI'm not the reason, Tilly. Ask Mrs Dunmore to let you go third, straight out, and I'll wait by the door to hear how it went.\u201d","tag":"best","you":4,"them":4,"outcome":"She is silent, then says, \u201cThird. Straight out. Hmm.\u201d It is the second plan of the night.","why":"You refuse the blame you were handed, then give Tilly a specific ask she can make herself. Asking straight is the way out of the \u201cif it weren't for\u201d line."},{"text":"\u201cMaybe go third and ask Sam to swap.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cSam would say yes and forget,\u201d says Tilly. The blame moves a little further down the corridor.","why":"A kind idea, but you are running the plan and Tilly is turning it down. You have become the one who has to fix it."},{"text":"\u201cI suppose it's me, then. Sorry I told you to speak up.\u201d","tag":"game","you":-5,"them":-6,"outcome":"\u201cNo, no, you're a good friend,\u201d says Tilly, and asks if you brought a pen.","why":"A trap move: you took the blame and asked to be forgiven for it. The question to the tutor is never asked, and the blame moves into your pocket."}]}],"payoff":"Tilly goes in sure that everyone is against her, and the order of speakers stays as it was on the sticky note.","example":"A cousin on a video call, Sunday. \u201cIf it weren't for my husband's shifts, we'd have gone to the coast by now.\u201d You say, \u201cAnd if the shifts weren't his to solve, what would you do?\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions. Pick the reply that matches what happened, and why it worked.","items":[{"type":"pick","who":"Tilly","text":"\u201cLet me tell you what he did to panel four.\u201d Which reply stops the case from running?","cue":"the case is open and you are the one in the judge's chair","options":["Give Tilly a ruling on panel four, so she can stop fretting about it.","Tell Tilly to say it to Sam, who is two chairs away.","Ask Sam to account for panel four to you, the fair one."],"answer":1,"why":"When someone talks about a person who is in the room, the talk is aimed at you as the judge, and the person it is about is left out. Turning the talk towards that person removes the judge. The court has nowhere to sit.","traps":{"0":"A verdict ends the talk for a minute, but the case stays open. Tilly will bring the next one to the same chair, because you have shown her where the judge sits.","2":"This still puts you in the middle. Sam now speaks to the judge, and the case becomes a hearing with better manners. The room is the same and only the seating has moved."},"example":"A friend on a train, Sunday. \u201cLet me tell you what my brother did about the flat.\u201d You say, \u201cTell him, he's on the phone. Put him on speaker.\u201d"},{"type":"pick","who":"Sam","text":"\u201cYou never come to anything I set up, so forget it. I'll practise on the bus.\u201d Which reply steps out of the corner?","cue":"bus pass already out, stopwatch still in his bag","options":["I'll come, and let's start with slide four.","I'll come, and I'll remind you that you made it a fight.","I'm not coming, because you always turn a rehearsal into a drama."],"answer":0,"why":"The corner has two doors and both lead to the same wall. Coming means you came only because you were pushed, and staying away means you never come. The way out is to drop the refusal and join in warmly on the plan.","traps":{"1":"This goes through the first door. You come, but you bring the sulk with you, so the label \u201cnever comes\u201d is still on the table and he can say he was right.","2":"This goes through the second door. The refusal confirms the label, and the corner closes behind you. He can now say with a straight face that you never come."},"example":"A group chat about a football match, Saturday. \u201cYou never turn up, so I've booked the pitch without you.\u201d You reply, \u201cCount me in, and I'll bring the bibs.\u201d"}]}]},{"setting":"Work","blurb":"Halden release day: three red tickets, a freeze at six, and a team looking for someone to blame.","opener":{"setting":"Thursday, 4:50pm. Halden, the team room. The release board shows three red tickets, and the freeze is at six.","lines":[{"who":"Daniel","text":"\u201cRight. Three red tickets, a freeze at six, and the client contact is away until Monday. Who has 214?\u201d","cue":"standing at the board with the marker uncapped"},{"who":"Sam","text":"\u201cMe, sorry, I'm on it. I'll sort it before six. Look, I've got a checklist.\u201d","cue":"holding up his phone, thumb scrolling a long list"}],"ask":"Name the home trap that is running in this room, and find the one reply that steps out of it without starting a fight."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each home trap has a plain name. Tap the one that is running in the line.","items":[{"type":"pick","who":"Daniel","text":"\u201cNice try on the demo, champ. Most people your age would have asked first.\u201d","cue":"patting the desk, already walking on","options":["the rush","the court","sweetheart"],"answer":2,"why":"The jab about asking first sits in the middle, and the pet name wraps round it. Daniel points at a weakness through a friendly word, so you cannot object without seeming touchy. The sting hides inside the endearment.","traps":{"0":"This would be the rush if he were too busy to stop. Daniel finds time to deliver the remark, which is the point.","1":"This would be the court if he were building a case against someone in the room, to a third person. He is speaking to the person himself, with a smile."},"example":"A shop manager to a new starter, Monday. \u201cGood first week, sunshine. Most people learn the till before the cash-up.\u201d"},{"type":"pick","who":"Clara","text":"\u201cI rewrote the test plan three times, I stayed until nine on Tuesday, I even checked the spelling in every ticket. And you still say it isn't ready.\u201d","cue":"pushing the laptop an inch towards Daniel","options":["look how hard I've tried","the rush","the corner"],"answer":0,"why":"She lists the effort and leaves out the result. The effort works as a shield: whatever the verdict, she can say she tried, and trying is hard to argue with. Meanwhile the one question that matters, whether the plan does the job, goes unanswered.","traps":{"1":"This would be the rush if she were too busy to stop. Clara has stopped. She is standing at his desk presenting her evenings.","2":"This would be the corner if every reply he could give were wrong. Clara has not set two doors. She is asking to be admired for trying."},"example":"A student at a parents' evening, Thursday. \u201cI wrote it three times and used the good pen. And you still gave me a six.\u201d"},{"type":"pick","who":"Daniel","text":"\u201cIf it weren't for Omar's two-reviewer rule, we'd have shipped on Monday. He makes everything wait.\u201d","cue":"eyes on the board, not on Omar's desk","options":["the rush","if it weren't for you","sweetheart"],"answer":1,"why":"He blames someone else's rule for what he is not doing, and the complaint is the point. The rule also keeps him from the risk of shipping something that breaks, so he complains about it and never tests it. While Omar is the cause, nothing has to change at his end.","traps":{"0":"This would be the rush if he were taking on more work. He is doing the opposite and holding back, with a tidy reason.","2":"This would be sweetheart if the sentence ended on a pet name with a sting in it. Daniel's sting sits in the blame alone."},"example":"A neighbour at the post box, Tuesday. \u201cIf it weren't for my sister's shifts, I'd have joined the choir years ago.\u201d<br>The shifts get the blame, and the choir is never tried."},{"type":"pick","who":"Sam","text":"\u201cDon't worry, I'll take the build, the release notes, the standup rota, the cake for Omar's birthday. Everyone's busy, so it's me.\u201d","cue":"already pulling two more tickets onto his own board","options":["the rush","the corner","look how hard I've tried"],"answer":0,"why":"He is too busy to stop, and the busyness is the bait. He takes on every job as it lands and offers more, so the list only grows. In the book the day ends in a collapse where nothing is finished, and he blames himself for it.","traps":{"1":"This would be the corner if every reply you gave were wrong. Sam has set no trap for you. He is simply piling jobs onto himself.","2":"This would be look how hard I've tried if he were presenting his effort for admiration. Sam is hiding in the work, and nobody is being invited to look."},"example":"A volunteer at a village fete, Saturday. \u201cSit down, all of you, I'll do the urn, the tombola, the bunting. Nobody else is free.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Three scenes with the same people. Keep both meters above half at the end of each one, and watch for the moment someone hands you a chair you didn't ask for.","items":[{"type":"scene","title":"Thursday, 5:05pm, the team room","setting":"Halden. Sam is at his desk with his headphones half off. Daniel has pulled a chair next to yours, the marker still in his hand. <i>The Heckler, in your head: \u201cYou're the neutral one. Rule on it.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Daniel","text":"\u201cLet me tell you what Sam did with ticket 214. You're the neutral one, so you tell him.\u201d","cue":"low voice, not looking at Sam's desk two metres away","lines":[{"text":"\u201cTell him, Daniel. He's two desks away with his headphones half off.\u201d","tag":"best","you":4,"them":3,"outcome":"Daniel stands. \u201cSam. 214.\u201d Sam pulls the headphones off and sits up, surprised to be asked straight.","why":"A court runs on talk about someone, not to them. Speaking to the person directly stops it before the first witness."},{"text":"\u201cGo on, what did he do this time?\u201d","tag":"ok","you":-2,"them":2,"outcome":"Daniel gives you the whole week: the half-closed tickets, the Tuesday comment, the muted standup. Sam keeps typing.","why":"You took the chair without being asked. The court has its judge, and the case grows while Sam listens from two desks away."},{"text":"\u201cTicket 214 again? He's holding up the whole release.\u201d","tag":"game","you":2,"them":-4,"outcome":"Sam's typing stops. Daniel says, \u201cExactly,\u201d as though you had both signed something.","why":"A trap move: you passed judgment on someone who could hear. The court has two against one, and the room goes stiff."}]},{"who":"Sam","text":"\u201cSorry, sorry. 214 was waiting on a reply from the client, and the reply came at four. I'd have closed it by five, I swear.\u201d","cue":"not looking up, a hand over his eyes","lines":[{"text":"\u201cThen give Daniel a time, Sam. Say it to him, not to me.\u201d","tag":"best","you":4,"them":3,"outcome":"He turns his chair. \u201cFive-thirty. And I'll tell you when it's green.\u201d","why":"You send the answer to the person who is owed it. A time said to the right face is the only defence a court cannot argue with."},{"text":"\u201cFine, I'll rule that five-thirty counts, and that's the end of it.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Sam nods. Daniel says, \u201cI asked you to tell him, not to rule on it.\u201d","why":"A verdict ends the argument for a minute and keeps you in the chair. Daniel learns the court still works, so he will come back."},{"text":"\u201cDaniel's right, you're always late. It's your fault.\u201d","tag":"game","you":2,"them":-5,"outcome":"Sam says, \u201cOkay, okay,\u201d and the sorry turns into a sulk behind the monitor.","why":"You took the prosecution's side and read out the sentence. The apology is gone, and Sam has proof the room is against him."}]},{"who":"Daniel","text":"\u201cSee? There's always a reply. So you'll talk to him about standup as well, won't you?\u201d","cue":"capping the marker, then uncapping it","lines":[{"text":"\u201cSay the standup thing to him, Daniel. Look at him and say all of it.\u201d","tag":"best","you":3,"them":4,"outcome":"Daniel crosses the gap. \u201cStandup. You mute yourself and then answer after the next person starts. Stop it.\u201d Sam says, \u201cOkay, fair.\u201d","why":"The case moves back into the room. What was about him becomes what is between the two of them, and only that version can be settled."},{"text":"\u201cSure, I'll talk to him about standup.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Daniel says, \u201cGood,\u201d and you have taken on a second case without a witness.","why":"You agreed to carry a request for someone else. It sounds helpful, but the court is still open and you are its messenger."},{"text":"\u201cDaniel, have you ever asked him straight? In words?\u201d","tag":"game","you":1,"them":-3,"outcome":"Daniel caps the marker with a click. \u201cWhose side are you on?\u201d The room goes flat.","why":"A trap move: a question with a verdict hidden in it. The case flips and you become the defendant."}]},{"who":"Sam","text":"\u201cSo what's the verdict? You always have one.\u201d","cue":"grinning now, the checklist still open","lines":[{"text":"\u201cNo verdict. You two settle the time for 214 now, in front of me.\u201d","tag":"best","you":4,"them":4,"outcome":"\u201cFive-thirty,\u201d Daniel says. Sam nods and the red ticket on the board gets a pencil dot.","why":"You hand the decision to the two people with the deadline between them. The court closes because nobody is waiting for a judge."},{"text":"\u201cFive-thirty for 214, and I'll chase the client myself.\u201d","tag":"ok","you":-1,"them":1,"outcome":"Sam says, \u201cHa, the judge chases the client,\u201d and Daniel almost smiles.","why":"A fair ruling and the mood lifts, but you still hold the verdict. Next week somebody will ask you again."},{"text":"\u201cGuilty. Sam, you own every red ticket until Friday.\u201d","tag":"game","you":2,"them":-6,"outcome":"\u201cThat's not fair,\u201d says Sam. Daniel says, \u201cSee, he never listens,\u201d and both stop talking to you.","why":"You sentenced him from the chair, and the sentence closed the case with no agreement. Now both are talking about you."}]}],"payoff":"The court closes with you in the judge's seat. Both of them are sure you picked a side, and ticket 214 stays red until the freeze.","fallout":{"them":"Daniel caps the marker and goes back to the board without a word. The team room is quiet for the rest of the hour."},"example":"A tenants' meeting, Tuesday. Two neighbours argue about the lift key and the secretary is asked to rule. She says, \u201cAsk each other directly,\u201d and the key changes hands."},{"type":"scene","title":"Friday, 6:20pm, the lift lobby","setting":"Halden. The release went live at 6:04. Sam is at the lift with his coat on, pressing the button twice. <i>The Heckler, in your head: \u201cSay no first, so you can't be the one who lets him down.\u201d<\/i>","meters":{"you":50,"them":50},"beats":[{"who":"Sam","text":"\u201cWe're all going for chips on the high street. You fixed the build, you have to come. Oh, forget it. You never come to anything with the team.\u201d","cue":"pressing the button a third time","lines":[{"text":"\u201cI'll come. Give me five minutes to shut the laptop, and the chips are on me.\u201d","tag":"best","you":4,"them":4,"outcome":"He stops pressing the button and grins. \u201cFive minutes. Don't bring the work face.\u201d","why":"You drop the refusal and say a yes with a time and a job attached. A warm yes takes the wall away."},{"text":"\u201cI'm not sure. It's been a long week.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"He nods too fast. \u201cSure.\u201d The lift arrives and he waves it on.","why":"A maybe leaves the door half shut. Nothing breaks, and he gets to be the one who was left out."},{"text":"\u201cFine, I'll come, but only because you've made me feel like the bad teammate.\u201d","tag":"game","you":-4,"them":-5,"outcome":"He sighs and holds the door. Nobody says a word between the lift and the street.","why":"A trap move: you said yes and made it his fault. Both answers lose in a corner, and this one keeps you both on the same wall."}]},{"who":"Sam","text":"\u201cOh, now you're coming? Only because I said you wouldn't. Right, I'll tell them you might.\u201d","cue":"half in the lift, thumb on his phone","lines":[{"text":"\u201cI want to come. Tell me who's there, and I'll tell you my chip order.\u201d","tag":"best","you":4,"them":4,"outcome":"He steps back out. \u201cOmar, Clara, two from QA. Omar's ordering the curry sauce, which is a crime.\u201d","why":"You answer the plan and leave the label alone. He gets to be funny about something, which is what the corner was hiding."},{"text":"\u201cYou're right, I never come. I'll try next time.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cNext time,\u201d he says flatly, and the doors begin to close.","why":"You accepted the label, so the corner is now yours to live in. A promise for next time is a way of staying there."},{"text":"\u201cYes, I never come, because every time I do the night turns into a work meeting.\u201d","tag":"game","you":-3,"them":-6,"outcome":"The lift doors close with Sam inside. Your message to the group sits unread.","why":"A trap move: you agreed with the label and gave him the reason. Both of you have said the corner out loud, and that is where it stays."}]},{"who":"Sam","text":"\u201cThe table's booked, if you want it. I'm not going to chase you.\u201d","cue":"one foot in the lift, one on the carpet","lines":[{"text":"\u201cThanks. I'll take the seat next to Omar, and you can tell me when the chips arrive.\u201d","tag":"best","you":3,"them":4,"outcome":"He grins. \u201cSeat by Omar. He'll take a chip off you before you sit.\u201d","why":"You join in warmly with a small plan of your own. The corner offered a sulky yes or a no, and you gave neither."},{"text":"\u201cSorry, I'm not in the mood.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"\u201cFair enough,\u201d he says, and the lift doors take him.","why":"A calm no beats a sulk, but it still closes the plan. You are now on opposite sides of the doors."},{"text":"\u201cChasing is your thing, Sam. I'm not staying to watch.\u201d","tag":"game","you":-4,"them":-6,"outcome":"He laughs once, not kindly, and presses the button for the ground floor.","why":"A trap move: you turned his request into a verdict on him. The corner closes and the night goes ahead without you."}]}],"payoff":"The corner closes on both of you. Sam goes down alone, and the chips are eaten without your order.","example":"A colleague leaves a book club chat: \u201cYou never come to these, so I won't bother asking.\u201d You write, \u201cI'll come, and I'll save you the sofa seat.\u201d"},{"type":"scene","title":"Monday, 9:20am, the canteen","setting":"Halden. Daniel is stirring a coffee he will not drink. Omar is at the next table with a tray. <i>The Heckler, in your head: \u201cIf he is upset, fixing it is your job.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Daniel","text":"\u201cIf it weren't for Omar's two-reviewer rule, we'd have shipped a day early and I'd have had my weekend. He makes everything wait.\u201d","cue":"pitched to carry two tables","lines":[{"text":"\u201cThat sounds like a lost weekend. If it were only up to you, what would you change?\u201d","tag":"best","you":4,"them":3,"outcome":"A pause. \u201cOne reviewer for the small tickets, I suppose. But I'd have to put that to him.\u201d It is the first plan of the morning.","why":"The blame needs somewhere to go. You hand the choice to the one who holds it, so the \u201cif it weren't for\u201d has to become a decision."},{"text":"\u201cI know. Omar's always been strict about reviews.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cAlways,\u201d says Daniel, and the complaint grows a second paragraph about the queue.","why":"You agreed that Omar is the cause. The blame stays on him, and your agreement gives Daniel a second witness."},{"text":"\u201cIt's his rule, then. I'll tell him to drop it.\u201d","tag":"game","you":-4,"them":-5,"outcome":"\u201cWould you? Good,\u201d says Daniel, and goes to get another coffee.","why":"A trap move: you took the Saviour's chair and promised to fix Omar for him. The blame has a messenger and the rule never gets discussed."}]},{"who":"Omar","text":"\u201cI heard that. The second reviewer caught the date bug in March.\u201d","cue":"not looking up from his tray","lines":[{"text":"\u201cThen say that to Daniel yourself, Omar. Don't send it through me.\u201d","tag":"best","you":4,"them":3,"outcome":"A pause. Omar turns his chair. \u201cDaniel. March. The date bug. Two reviewers, one catch.\u201d","why":"You send the message back to the person who can say it to Daniel's face. Omar's steady \u201cMarch\u201d becomes an argument only when he addresses it to him."},{"text":"\u201cYou two sort it out. I'm only the one with the toast.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"\u201cFine,\u201d says Omar, and he goes back to his tray.","why":"Neutral and harmless, but it leaves Omar's quote of March as a remark and Daniel's blame where it was."},{"text":"\u201cOmar, you never bend. You just quote March.\u201d","tag":"game","you":-3,"them":-6,"outcome":"Daniel says, \u201cSee? Even they agree with me,\u201d and Omar's chair scrapes back.","why":"You joined the case against him, so the canteen turns into a court with you as the witness. The conversation ends early."}]},{"who":"Daniel","text":"\u201cHe doesn't even argue it with me. And if it weren't for you backing him last week, I'd have it changed already. So what would you do?\u201d","cue":"quieter now, pleased to have a witness","lines":[{"text":"\u201cI'm not the reason, Daniel. Ask him for one reviewer on small tickets, straight out, and I'll ask on Wednesday how it went.\u201d","tag":"best","you":4,"them":4,"outcome":"He is silent, then says, \u201cOne reviewer. Straight out. Hmm.\u201d It is the second plan of the morning.","why":"You refuse the blame you were handed, then give Daniel a specific ask he can make himself. Asking straight is the way out of the \u201cif it weren't for\u201d line."},{"text":"\u201cMaybe put it on the retro board and let the team vote.\u201d","tag":"ok","you":-1,"them":0,"outcome":"\u201cThe team will vote for lunch,\u201d says Daniel. The blame moves along the table.","why":"A kind idea, but you are running the plan and Daniel is turning it down. You have become the one who has to fix it."},{"text":"\u201cI suppose it's me, then. Sorry I backed him.\u201d","tag":"game","you":-5,"them":-6,"outcome":"\u201cNo, no, you're all right,\u201d says Daniel, and asks whether you have had breakfast.","why":"A trap move: you took the blame and asked to be forgiven for it. The question about the rule is never asked, and the blame moves into your pocket."}]}],"payoff":"Daniel leaves sure that the team is against him, and the two-reviewer rule stays on the wall.","example":"A cousin on a video call, Sunday. \u201cIf it weren't for my manager's rota, we'd have gone to the coast by now.\u201d You say, \u201cAnd if the rota weren't in the way, what would you do?\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions. Pick the reply that matches what happened, and why it worked.","items":[{"type":"pick","who":"Daniel","text":"\u201cLet me tell you what Sam did with 214.\u201d Which reply stops the case from running?","cue":"the case is open and you are the one in the judge's chair","options":["Give Daniel a ruling on 214, so he can get back to the board.","Tell Daniel to say it to Sam, who is two desks away.","Ask Sam to explain ticket 214 to you, the neutral one."],"answer":1,"why":"When someone talks about a person who is in the room, the talk is aimed at you as the judge, and the person it is about is left out. Turning the talk towards that person removes the judge. The court has nowhere to sit.","traps":{"0":"A verdict ends the talk for a minute, but the case stays open. Daniel will bring the next one to the same chair, because you have shown him where the judge sits.","2":"This still puts you in the middle. Sam now speaks to the judge, and the case becomes a hearing with better manners. The room is the same and only the seating has moved."},"example":"A friend in a queue, Saturday. \u201cLet me tell you what my brother said about the flat.\u201d You say, \u201cTell him, he's on the phone. Put him on speaker.\u201d"},{"type":"pick","who":"Sam","text":"\u201cYou never come to anything with the team, so forget it. I'll tell them you're busy.\u201d Which reply steps out of the corner?","cue":"coat on, finger over the lift button","options":["I'll come, and I'll say I'm annoyed that you made it a fight.","I'm not coming, because you always make a team night into a test.","I'll come, and I'll order the chips."],"answer":2,"why":"The corner has two doors and both lead to the same wall. Coming means you came only because you were pushed, and staying away means you never come. The way out is to drop the refusal and join in warmly on the plan.","traps":{"0":"This goes through the first door. You come, but you bring the sulk with you, so the label \u201cnever comes\u201d is still on the table and he can say he was right.","1":"This goes through the second door. The refusal confirms the label, and the corner closes behind you. He can now say with a straight face that you never come."},"example":"A group chat about a cricket match, Saturday. \u201cYou never turn up, so I've booked the nets without you.\u201d You reply, \u201cCount me in, and I'll bring the drinks.\u201d"}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://claude.ai/artifact/FzdEytVBojsBteGVMXXV4K","next":{"slot":"4.5","title":"Traps in the Room","url":"https://claude.ai/artifact/CiZTLP1gdtjsKkXr7uuvrk"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: MULTI ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
