<script>window.TA_GAME = {"slot":"6.5","setting":"Family","title":"Shape of a Life Story","world":6,"worldName":"The Story You Wrote","week":6,"weekName":"The Story You Wrote","mechanic":"Match","concept":"After this one you can match a life story to the shape its plan takes over time, and say what that shape costs the person living it.","plainWord":"the Plan's shape","bookTerm":"Script process","bookIdea":"The script process is how a life script plays out over time, and it comes in six shapes: Until, After, Never, Always, Almost and Open-ended.","bookSource":"TA Today, ch. 15","opener":{"setting":"Wednesday, 8:40pm. Gran's flat downstairs, the sitting room, the television on mute. Her photo album is open on her knee, and Leo is on the floor beside her.","lines":[{"who":"Gran","text":"\u201cLook at this one. I was going to live properly once the children were settled. Everything was going to start then.\u201d","cue":"turning an album page with one finger"},{"who":"Leo","text":"\u201cDid they get settled, Gran?\u201d","cue":"eating a biscuit, not looking up"}],"ask":"Every plan has a shape. Match each life story to the shape it takes over time, then say what the shape costs the person living it."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Every life has a plan, and every plan has a shape. Three short stories. Pick the shape that fits each one.","items":[{"type":"pick","who":"Dad","text":"\u201cOnce the bad year is over, we'll talk about the house. Not before.\u201d","cue":"a phone call, the television on mute behind him","options":["not until","after this, the price","always the same"],"answer":0,"why":"The talk waits for a condition. Once the year is over, and not before, the conversation has a gate on it. That is 'not until': the plan says life starts when something else is done.","traps":{"1":"This would be 'after this, the price' if he were having a treat now and paying for it later. Nothing pleasant is happening here. The house conversation is simply put off.","2":"This would be 'always the same' if the same talk kept coming back every Sunday. Here it is one postponed talk with a condition attached."},"example":"A parents' meeting at a school. The principal says the bus route will be discussed once the budget is approved, and the budget is still not approved in March."},{"type":"pick","who":"A woman at a garden stall","text":"\u201cI've wanted a garden all my life. I read the seed catalogue every spring, and I never order anything.\u201d","cue":"turning the catalogue page, then closing it","options":["never gets it","after this, the price","plan runs out"],"answer":0,"why":"She wants it, looks at it every spring, and never reaches for it. The wish and the not-getting go together. That is 'never gets it': the thing she wants stays on the page.","traps":{"1":"This would be 'after this, the price' if she took a pleasure now and got a bill later. There is no treat here, only the wish.","2":"This would be 'plan runs out' if the plan simply had nothing written after a certain point. Her plan has a want in it, and the want never gets through the door."},"example":"A tenant who looks at the same flat listing every month and never rings the agent."},{"type":"pick","who":"A school cricket captain","text":"\u201cThree runs short of the trophy in the final over. Second final in a row, and we fell at the last ball again.\u201d","cue":"holding up the scorecard, one finger on the number three","options":["almost makes it","after this, the price","never gets it"],"answer":0,"why":"The plan got all the way to the last step and fell over it. That is 'almost makes it': close enough to count, and never through the door.","traps":{"1":"This would be 'after this, the price' if they had a celebration now and a bill later. Nothing like that happened. The team simply lost the last over.","2":"This would be 'never gets it' if the team never reached the final. In this story they got there twice, and only the last ball got in the way."},"example":"A cookery competition. A baker reaches the final plate, then the oven timer rings too early and the cake sinks. She says \u201cNext year\u201d and means it."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two boards of six. Each story is a plan with a shape. Match the story to the shape it takes over time, whatever the mood of the moment.","items":[{"type":"sort","prompt":"Six plans. Match each story to the shape it takes over time.","bins":["not until","after this, the price","never gets it","always the same","almost makes it","plan runs out"],"items":[{"text":"\u201cI'll start living once the children are settled. Then I'll sit in the temple all morning, and nobody will need me.\u201d","answer":0,"why":"The living waits for a condition: the children settled. Until that happens, the plan has no start. That is 'not until'."},{"text":"\u201cOne more round, then I'll be fine. The rent can wait. I'll pay for tonight next month, and the month after that too.\u201d","answer":1,"why":"The fun comes now and the bill comes later, and the bill keeps coming. That is 'after this, the price'."},{"text":"\u201cI've wanted a little place by the sea for thirty years. I read the listings every Sunday, and I never ring anyone.\u201d","answer":2,"why":"The want is real and old, and the person never reaches for it. That is 'never gets it'."},{"text":"\u201cSame call again. Mum asks about the money, I say the rent is fine, and we both go quiet until she asks again.\u201d","answer":3,"why":"Same question, same answer, same silence, every Sunday. The plan comes round again and again. That is 'always the same'."},{"text":"\u201cWe had the deposit paid and the keys in sight, and then the owner backed out at the last signature. So close.\u201d","answer":4,"why":"The story stops one signature short of the finish. That is 'almost makes it': close enough to hurt, and never through the door."},{"text":"\u201cThe children have all left home, and the house is quiet. I did everything I was meant to do, and I have no idea what the next bit is meant to be.\u201d","answer":5,"why":"The plan was clear up to a point and says nothing after it. The script has given out. That is 'plan runs out'."}]},{"type":"sort","prompt":"Six more. Match each one to its shape.","bins":["not until","after this, the price","never gets it","always the same","almost makes it","plan runs out"],"items":[{"text":"\u201cOn-call again. It was me last time, and it'll be me on the next release too.\u201d","answer":3,"why":"The same scene, the same person, the same ending. The plan loops, and the loop is the shape. That is 'always the same'."},{"text":"\u201cI missed the final exam by one mark. Again. Third attempt, and one mark short each time.\u201d","answer":4,"why":"She keeps getting to the last step and falling short of it. The plan almost makes it every time. That is 'almost makes it'."},{"text":"\u201cI retire on Friday. There's a party and a cake, and then nothing planned at all. I never thought past the party.\u201d","answer":5,"why":"Everything is planned up to the party, and nothing after it. The script gives out at that point. That is 'plan runs out'."},{"text":"\u201cOnce the holiday weekend rush is over, I'll talk to Daniel about the grade. Not before.\u201d","answer":0,"why":"The talk is parked behind one event, and nothing moves before it. That is 'not until': the start is tied to something else."},{"text":"\u201cTwo weeks of late dinners and a weekend away feel great. The bill comes next month, with interest, and I'll sort it then.\u201d","answer":1,"why":"The late dinners are paid for later, and the cost grows before it lands. That is 'after this, the price'."},{"text":"\u201cI'd love to learn the cello. I look at them in the shop window most weeks. But that's not for people like me.\u201d","answer":2,"why":"The want is there, and the person talks themselves out of reaching for it. That is 'never gets it'."}]}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cGran's plan says live once the children are settled. Which explanation names the price of that plan?\u201d","cue":"tapping the album page","options":["It is an Until script. Life waits for a condition, and the years of waiting are the price.","It is an Until script. Once the condition is met the plan ends well, so there is no price to pay.","It is an Always script. The same wait comes round each year, so the price is the same each year."],"answer":0,"why":"The books call this the Until script. The plan puts the start of living behind a condition, and the condition may take years to arrive. The price is the life not lived in the meantime, and it is paid every day.","traps":{"1":"This reading would have everyone wish Gran well and move on. Nobody would ask what the waiting has cost her, and the years would simply vanish from the story.","2":"This reading would send the talk to the same argument every Sunday. The Until plan is a single postponed start, so the real price stays hidden."},"example":"A cousin who says \u201cI'll start the course once the baby sleeps through the night.\u201d Two years later the baby is a toddler, and the course is still on the list."},{"type":"pick","who":"Nadia","text":"\u201cA man retires on Friday. There is a party, a cake and a card, and nothing planned after it. Which shape is that, and what does it mean?\u201d","cue":"pen in hand, looking at the calendar","options":["Open-ended: he is free to choose anything now, so the shape has no cost.","Open-ended: the script gives out at that point, and nothing is planned for what comes next.","Until: he is holding everything back until a condition is met."],"answer":1,"why":"The books call this the open-ended shape. The script runs out at a set point, and nothing is written for after it. Everything up to Friday was planned, and the party is where the plan stops. What it costs is a blank where the plan used to be.","traps":{"0":"This reading would hear the gap as freedom. Nobody would ask what he will do on Monday, and the blank would arrive unprepared.","2":"Until would mean he was holding something back until a condition was met. Nothing is held back here. The plan has simply stopped."},"example":"A mother of grown-up children, Sunday. \u201cI did all of it, and now the house is quiet and I don't know what comes next.\u201d"}]}],"debrief":{"nadia":"Every plan has a shape, and most of them look harmless until you look at the price. Gran's wait has run for years, and a retirement party can end a plan overnight. Ask what the shape costs, and who pays the bill when the plan finally stops.","bookTerm":"Script process","bookNote":"The books call this the script process: how a life script plays out over time, in six shapes called Until, After, Never, Always, Almost and Open-ended."},"reflection":{"prompt":"Which shape did your own week look like most, and at what point in the week did you feel its price?"},"next":"6.6","baseStory":{"setting":"Family","blurb":"Gran turns the pages of her photo album while Leo asks whether the waiting ever ended."},"moreStories":[{"setting":"Work","blurb":"Daniel will not talk rota until the client signs, and Clara has not sent one email to him.","opener":{"setting":"Thursday, 5:40pm. Halden, the team room. The release board is still amber, and Clara's chair has not moved since lunch.","lines":[{"who":"Daniel","text":"\u201cNobody goes home before the client signs. After that, we'll talk about the rota.\u201d","cue":"eyes on the red laptop"},{"who":"Clara","text":"\u201cI'll ask about the senior role when the appendix is finished. It's nearly finished.\u201d","cue":"typing without a pause"},{"who":"Omar","text":"\u201cIs nearly the same as finished? I'm asking about the chips.\u201d","cue":"holding the canteen menu up like a flag"}],"ask":"Every plan has a shape. Match each life story to the shape it takes over time, then say what the shape costs the person living it."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Every life has a plan, and every plan has a shape. Three short stories. Pick the shape that fits each one.","items":[{"type":"pick","who":"Daniel","text":"\u201cOnce the client has signed, we'll sort the on-call rota. Until then, don't ask.\u201d","cue":"a hand up, still reading the screen","options":["after this, the price","not until","almost makes it"],"answer":1,"why":"The rota waits for one event, and nothing moves before it. That is 'not until': the start has a gate on it, and the gate belongs to someone else.","traps":{"0":"This would be 'after this, the price' if there were a treat now and a bill later. Nobody is enjoying anything here. A decision is simply parked.","2":"This would be 'almost makes it' if the rota had reached the last step and slipped. It has not been started yet."},"example":"A landlord who says the repairs will be looked at once the new tenant moves in. The tenant has not moved in, and the tap still drips."},{"type":"pick","who":"Clara","text":"\u201cThe email asking Daniel about the senior role? I've written it four times. He hasn't said no. I just never press send.\u201d","cue":"angling the screen away from Omar","options":["not until","almost makes it","never gets it"],"answer":2,"why":"The want is real, the draft exists, and the finger never reaches the button. That is 'never gets it': the thing she wants stays in the drafts folder.","traps":{"0":"This would be 'not until' if she had named a condition and was waiting for it. Here there is a draft and no reason given, only the stopping.","1":"This would be 'almost makes it' if she had sent it and been turned down at the last step. She has not got that far."},"example":"A man who has the library form filled in for years and never hands it over at the desk."},{"type":"pick","who":"Omar","text":"\u201cThe build went green at 10:12. The demo slot closed at 10:00. So close.\u201d","cue":"reading the timestamp aloud","options":["almost makes it","plan runs out","always the same"],"answer":0,"why":"The plan got to the last step and missed it by minutes. That is 'almost makes it': close enough to count, and still outside the door.","traps":{"1":"This would be 'plan runs out' if nothing had been planned for after a point. Here a lot was planned, and the clock beat it.","2":"This would be 'always the same' if this exact miss kept coming round every release. One close finish is a different shape."},"example":"A relay runner who hands over the baton a stride after the line."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two boards of six. Each story is a plan with a shape. Match the story to the shape it takes over time, whatever the mood of the moment.","items":[{"type":"sort","prompt":"Six plans. Match each story to the shape it takes over time.","bins":["not until","after this, the price","never gets it","always the same","almost makes it","plan runs out"],"items":[{"text":"\u201cI'll take my holiday once this quarter is over. Then I'll book the coast and switch the phone off for a week.\u201d","answer":0,"why":"The holiday waits for a condition, the quarter ending. Until then the plan has no start. That is 'not until'."},{"text":"\u201cAnother all-nighter, and the release is out. I'll feel it on Monday, and on Tuesday too, and I'll still say yes next time.\u201d","answer":1,"why":"The relief comes now and the bill follows, and keeps following. That is 'after this, the price'."},{"text":"\u201cI've had an idea for a small tool that tidies the test logs for a year. I've sketched it twice. That's not for someone at my grade.\u201d","answer":2,"why":"The wish is real and old, and the person talks themselves out of reaching. That is 'never gets it'."},{"text":"\u201cEvery release, Daniel shouts at four, I fix it by six, and nobody says a word. Same night, new version number.\u201d","answer":3,"why":"The same scene, the same people, the same ending. The plan loops. That is 'always the same'."},{"text":"\u201cOne vote short of the team lead job. And last year, one vote short as well.\u201d","answer":4,"why":"Each time the story gets to the final step and falls just short. That is 'almost makes it'."},{"text":"\u201cThe project ends on Friday. I planned every sprint up to it. On Monday I have no idea what I'm meant to be doing.\u201d","answer":5,"why":"Everything is planned up to a point and nothing after it. The plan has given out. That is 'plan runs out'."}]},{"type":"sort","prompt":"Six more. Match each one to its shape.","bins":["not until","after this, the price","never gets it","always the same","almost makes it","plan runs out"],"items":[{"text":"\u201cI'll tell Daniel the estimate is wrong once the demo is over. Not a minute before.\u201d","answer":0,"why":"The honest talk is parked behind one event. That is 'not until': the start is tied to something else."},{"text":"\u201cClient dinner, a late flight, a huge pudding. I'll be wrecked on Thursday, and I'll deal with Thursday when it comes.\u201d","answer":1,"why":"The treat is now and the cost is later. That is 'after this, the price'."},{"text":"\u201cI'd love to run a workshop for the new starters. The slides are done. I never booked the room.\u201d","answer":2,"why":"The want is there and the reaching never happens. That is 'never gets it'."},{"text":"\u201cOmar asks if I'm okay. I say fine. He lets it go. Then I stay till eight again.\u201d","answer":3,"why":"The same question, the same answer, the same evening. The plan comes round again. That is 'always the same'."},{"text":"\u201cWe passed every item on the audit but one. The auditor found the one. Third audit running.\u201d","answer":4,"why":"The story keeps stopping one item short of clear. That is 'almost makes it'."},{"text":"\u201cDaniel's handover notes are very thorough, and they stop at his last day on Friday. There is nothing after.\u201d","answer":5,"why":"The plan is clear up to a point and silent after it. That is 'plan runs out'."}]}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Omar","text":"\u201cClara will ask Daniel for the senior role once the appendix is perfect. Which reading names the price of that plan?\u201d","cue":"passing her a mug","options":["It is an Always script. The same late night comes round with every release, so the price is simply being tired again and again.","It is an Almost script. She keeps getting to the final step and missing it, so the price is the sting at the finish line each time.","It is an Until script. The ask waits for a condition that never fully arrives, so the price is the role itself."],"answer":2,"why":"The books call this the Until script. Asking for the role is put behind a condition, and a perfect appendix is a condition that always has one more fix in it. The price is paid each week the role stays out of reach.","traps":{"0":"This reading would send everyone to the late nights. Nobody would ask about the email in the drafts, and the real wait would stay hidden.","1":"This reading would treat her as someone who tried and fell short. She has not tried yet. That is what the waiting hides."},"example":"A friend who will apply for the better flat once the spare room is decluttered. The room is never quite done, and the listing goes."},{"type":"pick","who":"Omar","text":"\u201cHalden's old billing project ends on Friday. Daniel's plan has a cake, a speech and no Monday. Which shape is it, and what does it cost?\u201d","cue":"looking at the calendar","options":["Open-ended: the plan gives out here, and the cost is a blank Monday.","Open-ended: he is free to choose anything now, so the shape has no real cost to him, only room.","Until: he is holding everything back until a condition is met, and the cost is the long wait."],"answer":0,"why":"The books call this the open-ended shape. The script runs out at a set point, and nothing is written for after it. Everything up to Friday was planned, and the blank that follows is what it costs.","traps":{"1":"This reading hears the gap as freedom. Nobody would ask what he does on Monday, and the blank would arrive unprepared.","2":"Until would mean something is held back for a condition. Nothing is held back here. The plan has simply stopped."},"example":"A footballer whose last game is Saturday and whose diary is empty from Sunday."}]}]},{"setting":"Friends & Community","blurb":"Joseph keeps postponing the five-a-side, and Ruby is holding the pen at his birthday card.","opener":{"setting":"Saturday, 11:15am. The Corner Table, the back table. Joseph's birthday card is half signed, and Ruby is holding the pen.","lines":[{"who":"Ruby","text":"\u201cJoseph says he'll book the pitch once his knee is better. That was in April.\u201d","cue":"turning the card over"},{"who":"Joseph","text":"\u201cIt's nearly better. Ask me in a month.\u201d","cue":"stirring a coffee that went cold an hour ago"},{"who":"Nadia","text":"\u201cWho has a pen that works for the left corner?\u201d","cue":"not looking at either of them"}],"ask":"Every plan has a shape. Match each life story to the shape it takes over time, then say what the shape costs the person living it."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Every life has a plan, and every plan has a shape. Three short stories. Pick the shape that fits each one.","items":[{"type":"pick","who":"Ruby","text":"\u201cEvery year I say I'll join Nadia's Sunday group. I write my name on the list by the door and then I walk past.\u201d","cue":"tapping the card against the table","options":["almost makes it","not until","never gets it"],"answer":2,"why":"She wants it, she writes the name, and she walks past. The wish and the not-getting go together. That is 'never gets it'.","traps":{"0":"This would be 'almost makes it' if she had walked in and been sent home at the last step. She never gets near the door.","1":"This would be 'not until' if she had named a condition to wait for. She gives no reason, only the walking past."},"example":"A neighbour who keeps meaning to knock on the new family's door and always ends up carrying the bins instead."},{"type":"pick","who":"Joseph","text":"\u201cI'll book the pitch when the knee is better. Not a day before.\u201d","cue":"one hand on his knee","options":["not until","after this, the price","plan runs out"],"answer":0,"why":"The booking waits for a condition, the knee, and nothing moves before it. That is 'not until': the start belongs to something else.","traps":{"1":"This would be 'after this, the price' if he were having a treat now and paying later. There is no treat, only a postponed booking.","2":"This would be 'plan runs out' if nothing had been planned past a point. Here the plan is simply held."},"example":"A man who says he will visit his sister once the house is painted. The house is never painted."},{"type":"pick","who":"A man at the next table","text":"\u201cAnother round for everyone, it's my birthday. The card is maxed, but never mind. I'll worry about it in the new year.\u201d","cue":"raising two fingers at the counter","options":["always the same","after this, the price","not until"],"answer":1,"why":"The treat comes now and the bill comes later. That is 'after this, the price': the good feeling is paid for in advance of the cost.","traps":{"0":"This would be 'always the same' if this evening had happened exactly like this every year. It is one round, with a bill behind it.","2":"This would be 'not until' if he were putting something off. He is doing the opposite, spending first."},"example":"A friend who books a weekend away on a credit card, then spends March eating beans on toast."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two boards of six. Each story is a plan with a shape. Match the story to the shape it takes over time, whatever the mood of the moment.","items":[{"type":"sort","prompt":"Six plans. Match each story to the shape it takes over time.","bins":["not until","after this, the price","never gets it","always the same","almost makes it","plan runs out"],"items":[{"text":"\u201cWe'll have the street party once the council signs off the road closure. Until then nobody buys a single flag.\u201d","answer":0,"why":"The party waits for one condition. That is 'not until'."},{"text":"\u201cThird birthday dinner this month. The card will cry next week, and I'll say yes again anyway.\u201d","answer":1,"why":"The nice evenings come first and the bill follows, over and over. That is 'after this, the price'."},{"text":"\u201cI've wanted to join the choir at the church hall for ten years. I stand outside the door on Thursdays and then I go home.\u201d","answer":2,"why":"A real want that never reaches the door. That is 'never gets it'."},{"text":"\u201cEvery five-a-side I end up in goal. I let in the same soft shot, we say 'next week', and next week is the same.\u201d","answer":3,"why":"The same scene again and again. That is 'always the same'."},{"text":"\u201cWe reached the park league final. Lost on the last kick, same as the year before.\u201d","answer":4,"why":"Close enough to taste it, and out again at the last step. That is 'almost makes it'."},{"text":"\u201cThe bake sale was my whole summer for twenty years. It closed last week, and I don't know what Saturdays are for now.\u201d","answer":5,"why":"A plan that was clear up to its end and says nothing after it. That is 'plan runs out'."}]},{"type":"sort","prompt":"Six more. Match each one to its shape.","bins":["not until","after this, the price","never gets it","always the same","almost makes it","plan runs out"],"items":[{"text":"\u201cI'll invite the new family on our street over once the spare room is painted. It can't be seen like that.\u201d","answer":0,"why":"The invitation sits behind a condition that is always a little off. That is 'not until'."},{"text":"\u201cA whole weekend at the festival, no sleep, and the cost of a tent. The comedown arrives on Monday and lasts all week.\u201d","answer":1,"why":"The fun is up front and the cost lands afterwards. That is 'after this, the price'."},{"text":"\u201cI've written to my old school friend a dozen times. The message is in drafts. It always will be.\u201d","answer":2,"why":"The want and the not-reaching live side by side. That is 'never gets it'."},{"text":"\u201cEvery Sunday Peter tells the story about the bus. We laugh at the same place and then change the subject.\u201d","answer":3,"why":"The same story, the same laugh, the same change of subject. That is 'always the same'."},{"text":"\u201cWe were two points short of the quiz trophy. The fourth quiz where we've been two points short.\u201d","answer":4,"why":"Each time, the finish is one step out of reach. That is 'almost makes it'."},{"text":"\u201cJoseph's club wound up on Friday. There was a speech and a send-off, and no plan for what the Tuesday regulars do now.\u201d","answer":5,"why":"The plan is clear to a point and then blank. That is 'plan runs out'."}]}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cJoseph's plan says the pitch gets booked when the knee is better. Which explanation names the price of that plan?\u201d","cue":"pointing at the card","options":["It is an Until script. Playing waits for a condition, and the months of not playing are the price.","It is an Until script. Once the knee is better the plan ends well, so there is no real price for anyone to pay.","It is an Always script. The same excuse comes round each month, so the price is simply the same excuse."],"answer":0,"why":"The books call this the Until script. The start of the game is tied to a condition, and the condition keeps moving. The price is the months nobody plays, paid a little each week.","traps":{"1":"This reading would wish Joseph well and move on. Nobody would ask what the waiting has cost the whole team, and the months would vanish.","2":"This reading would turn it into an argument about excuses. The Until plan is one start held behind a gate, so the real price stays hidden."},"example":"A cousin who says he will start the course once the baby sleeps through. Two years on, the baby is a toddler and the course is still on the list."},{"type":"pick","who":"Nadia","text":"\u201cThe club wound up on Friday: a speech, a cake and nothing for Tuesday. Which shape is that, and what does it cost?\u201d","cue":"the pen still in her hand","options":["Almost: the club got to the last step and missed it, so the cost is a trophy that never came.","Open-ended: the plan gives out at that point, and the cost is a blank Tuesday.","Never: the wish for something else sits there and is never reached, so the cost is the wish."],"answer":1,"why":"The books call this the open-ended shape. The script ran out on Friday, and nothing was written for Tuesday. The cost is the blank where the club used to be.","traps":{"0":"Almost would need a final step they missed. The club did not fall short. It finished, and that is the trouble.","2":"Never would need a wish that is not reached. Nobody here is wishing for anything yet. The plan has just stopped."},"example":"A mother of grown-up children, Sunday. \u201cI did all of it, and now the house is quiet and I don't know what comes next.\u201d"}]}]},{"setting":"Relationships","blurb":"Clara says she will answer Omar's text properly once the project is done, and he is still hungry.","opener":{"setting":"Friday, 7:20pm. The Corner Table, a window seat. Omar's phone is face down by the sugar, and Clara has read the menu three times.","lines":[{"who":"Clara","text":"\u201cI'll tell you what I actually think when the project is done. It wouldn't be fair before.\u201d","cue":"squaring the menu to the table edge"},{"who":"Omar","text":"\u201cI only asked if you wanted chips.\u201d","cue":"smiling, half a step behind"},{"who":"Tolu","text":"\u201cTwo of you, and you're both reading the sugar packets.\u201d","cue":"pausing with the coffee pot, then moving on"}],"ask":"Every plan has a shape. Match each life story to the shape it takes over time, then say what the shape costs the person living it."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Every life has a plan, and every plan has a shape. Three short stories. Pick the shape that fits each one.","items":[{"type":"pick","who":"Clara","text":"\u201cI'll answer your text properly once the project's done. Not before.\u201d","cue":"her thumb over the phone","options":["not until","never gets it","always the same"],"answer":0,"why":"The answer waits for a condition, and nothing moves before it. That is 'not until': what she feels is held behind the project.","traps":{"1":"This would be 'never gets it' if she were wishing to answer and never would. She has named a date, so the answer is parked, not given up.","2":"This would be 'always the same' if the same reply came round every week. This is a single postponed answer."},"example":"A man who says he will propose once the house is finished. The house is never finished."},{"type":"pick","who":"Tolu","text":"\u201cSame worry on every second date. I cancel at six with a headache, and by seven I feel awful about it.\u201d","cue":"wiping the counter, not looking up","options":["almost makes it","always the same","plan runs out"],"answer":1,"why":"The same cancel, the same guilt, the same evening. The plan loops back to the start. That is 'always the same'.","traps":{"0":"This would be 'almost makes it' if she got to the last step and fell short. She never leaves the flat, so there is no last step.","2":"This would be 'plan runs out' if nothing had been planned after a point. Here the plan keeps coming round."},"example":"A friend who agrees to every party and texts \u201ccan't make it\u201d at the door, three times a year, for ten years."},{"type":"pick","who":"Clara","text":"\u201cI've wanted to say it to him since March. I rehearse it on the bus, and I get off two stops early.\u201d","cue":"looking out of the window at the bus stop","options":["not until","after this, the price","never gets it"],"answer":2,"why":"The want is clear, and the reaching never happens. That is 'never gets it': she rehearses the words and gets off the bus.","traps":{"0":"This would be 'not until' if she had set a condition to wait for. She sets none, so there is nothing to wait for.","1":"This would be 'after this, the price' if she were enjoying a treat now. The bus ride is a rehearsal, not a pleasure."},"example":"A student who has wanted to ask the teacher for extra help since term began, and walks past the office every Monday."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two boards of six. Each story is a plan with a shape. Match the story to the shape it takes over time, whatever the mood of the moment.","items":[{"type":"sort","prompt":"Six plans. Match each story to the shape it takes over time.","bins":["not until","after this, the price","never gets it","always the same","almost makes it","plan runs out"],"items":[{"text":"\u201cI'll let him meet my friends once the flat is sorted and I'm less of a mess. Not before.\u201d","answer":0,"why":"The meeting waits for a condition that keeps moving. That is 'not until'."},{"text":"\u201cTexting till two is wonderful. I'll be ill on the train tomorrow, and the day after, and I'll do it again anyway.\u201d","answer":1,"why":"The pleasure is now and the cost follows. That is 'after this, the price'."},{"text":"\u201cI want someone to say 'I'm proud of you' and mean it. Whenever someone tries, I change the subject.\u201d","answer":2,"why":"The want is real and the reaching never comes. That is 'never gets it'."},{"text":"\u201cEvery time we get close, I make a joke, he laughs, and we're back to being colleagues.\u201d","answer":3,"why":"The same step forward, the same joke, the same step back. That is 'always the same'."},{"text":"\u201cWe got as far as the cinema queue, then her phone rang and she went home. Third time that has happened.\u201d","answer":4,"why":"Every time the evening gets one step from the finish and stops. That is 'almost makes it'."},{"text":"\u201cHe had a plan for the first six months of us. Past the holiday in July, there is nothing, and he's nervous about it.\u201d","answer":5,"why":"The plan is clear up to a point and silent beyond. That is 'plan runs out'."}]},{"type":"sort","prompt":"Six more. Match each one to its shape.","bins":["not until","after this, the price","never gets it","always the same","almost makes it","plan runs out"],"items":[{"text":"\u201cI'll tell you what I think of your friend once we've been together a year. Not before.\u201d","answer":0,"why":"The honest word is held behind a milestone. That is 'not until'."},{"text":"\u201cI flirted all evening and it felt wonderful. I'll pay for it with an awkward Monday and a shared lift.\u201d","answer":1,"why":"The good time first, the awkwardness after. That is 'after this, the price'."},{"text":"\u201cI've wanted to ask her to the lake since spring. I look up the bus times every Friday, and I never ask.\u201d","answer":2,"why":"A clear want that never gets asked. That is 'never gets it'."},{"text":"\u201cWe argue about who pays, I give in, and I'm cross all the way home. It happens each time.\u201d","answer":3,"why":"The same disagreement, the same giving in, the same walk home. That is 'always the same'."},{"text":"\u201cHe said 'I think I' on the phone and then the signal dropped. Twice now it has stopped one word short.\u201d","answer":4,"why":"The sentence keeps stopping a word before the end. That is 'almost makes it'."},{"text":"\u201cWe've done the first date, the second, meeting the parents. Now there is no next thing on the list, and we sit there.\u201d","answer":5,"why":"Everything was planned up to a point and nothing after it. That is 'plan runs out'."}]}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Omar","text":"\u201cClara says she'll answer my text once the project is done. Which reading names the price of that plan?\u201d","cue":"turning his phone over at last","options":["It is an Always script. The same pause comes round each time they get close, so the price is one more long pause.","It is an Until script. Closeness waits for a condition, and the price is the weeks she stays out of reach.","It is an Almost script. She keeps reaching the last step and missing it, so the price is the finish line itself."],"answer":1,"why":"The books call this the Until script. Closeness is put behind a condition, and the project always has a next stage. The price is paid in the weeks of distance, while both of them tell themselves it is only for now.","traps":{"0":"This reading would turn it into a pattern of pauses and send the talk to the old argument. The single postponed start would go unnamed.","2":"This reading would treat her as someone who tried and fell short. She has not tried yet, and that is what the waiting hides."},"example":"A cousin who says he will start the course once the baby sleeps through the night."},{"type":"pick","who":"Tolu","text":"\u201cThey have done the first date, the second, and meeting the parents. Now there is no next thing, and they sit there. Which shape is it, and what does it cost?\u201d","cue":"setting down two cups","options":["Until: they are holding everything back for a condition, and the cost is the long wait.","Almost: they reach the last step and fall one short, so the cost is the sting of missing the finish line.","Open-ended: the plan gives out here, and the cost is a blank where the next step was."],"answer":2,"why":"The books call this the open-ended shape. The script ran out after the last thing on the list, and nothing is written for what comes next. The cost is the silence at the table.","traps":{"0":"Until would mean something is being held back for a condition. Nothing is held back here. The list has simply run out.","1":"Almost would need a last step they missed. They have done every step. The trouble is what comes after."},"example":"A couple at the end of a holiday, with no plan for the first Monday home."}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://claude.ai/artifact/FzdEytVBojsBteGVMXXV4K","next":{"slot":"6.6","title":"The Plan Board","url":"https://claude.ai/artifact/6ohNLgWTiVsxZKktMYnqJR"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: MULTI ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
