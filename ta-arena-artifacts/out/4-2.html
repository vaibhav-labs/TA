<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"4.2","setting":"Home & Flatmates","title":"Six Steps of a Trap","world":4,"worldName":"Conversation Traps","week":4,"weekName":"Conversation Traps","mechanic":"Sequence","concept":"After this one you can put a trap's six steps in order, bait first and sting last, and point to the flip where the chairs swap.","plainWord":"the six steps","bookTerm":"Formula G","bookIdea":"Formula G sets out how a game runs in six parts and a fixed order: a con aimed at a weak spot (the gimmick) draws a response, then comes the switch, the crossup of confusion, and the payoff last.","bookSource":"TA Today, ch. 23; Scripts People Live, ch. 11","opener":{"setting":"Thursday, 9:40pm. Hawthorn Court, apartment 3B, the sofa. The bathroom light is still on, and nobody has turned it off.","lines":[{"who":"Sam","text":"\u201cDid you leave the bathroom light on? I'm not blaming anyone. Just the one who gets blamed for it.\u201d","cue":"from the doorway, arms folded"},{"who":"Maya","text":"\u201cI turned it off. I always turn it off.\u201d","cue":"pulling the blanket straight without looking up"},{"who":"Sam","text":"\u201cHa. Okay. You're always so sure of yourself, aren't you? Forget it.\u201d","cue":"already walking to his room"}],"ask":"Put the six steps of each trap in order, with the bait first and the sting last, and find the flip where the chairs swap."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each set below is one short trap, with six lines. Tap them in the order the trap runs, with the bait first and the sting last.","items":[{"type":"sort","prompt":"Put these six lines in the order the trap runs, with the bait first and the sting last.","order":true,"items":[{"text":"Sam: \u201cSorry, sorry. I've knocked your notes off the table again. I'm hopeless, aren't I?\u201d","why":"Bait comes first. It reads as a plain apology, so you feel you ought to answer, and nothing in it asks you for anything yet."},{"text":"Sam: \u201cEveryone always ends up picking up my mess. It's the story of my life.\u201d","why":"The hook comes second. It catches the Saviour's reflex in you, the urge to pick things up for people."},{"text":"You: \u201cIt's fine, I'll pick them up. Don't worry about it.\u201d","why":"The bite comes third. It is the reply that takes the hook, so you move into the Saviour's chair and start clearing up his mess."},{"text":"Sam: \u201cWow, you always make it sound like I'm the problem. Like I can't do anything right.\u201d","why":"The flip comes fourth. Sam leaves the Sufferer's chair for the Blamer's, which leaves you in the Sufferer's, the one now being blamed."},{"text":"You: \u201cWait, what? I was only trying to help.\u201d","why":"The blink comes fifth. You meant to help and find yourself cast as the problem, so you are caught off guard and stop for a moment."},{"text":"Sam: \u201cForget it. Whatever.\u201d","why":"The sting comes last. Neither of you got what you wanted, and you both carry the same bad feeling. The trap is ready to run again at the next spill."}],"example":"A family WhatsApp group, Sunday. \u201cSorry, I forgot the sweets again. I'm useless, aren't I?\u201d<br>\u201cDon't be silly, I'll get them.\u201d<br>\u201cNo, you always do everything. Forget it.\u201d"},{"type":"sort","prompt":"Put these six lines in the order the trap runs. Start with the bait and end with the sting.","order":true,"items":[{"text":"Daniel: \u201cGood, you're here. Quick question about the sheet you sent this morning.\u201d","why":"Bait comes first. The question sounds routine, so you relax, and nothing has been caught yet."},{"text":"Daniel: \u201cI was going to check it myself. I thought you were careful with these.\u201d","why":"The hook comes second. Being called careful is a nod you want, and he holds it just out of reach, so you start to reach for it."},{"text":"You: \u201cI did check it. I think. Let me have a look.\u201d","why":"The bite comes third. You doubt your own check before anyone has shown you a mistake, which is the reply the hook was fishing for."},{"text":"Daniel: \u201cAh. So you haven't checked it. I knew it. I'll do it myself, then.\u201d","why":"The flip comes fourth. Daniel takes the Blamer's chair, your doubt becomes his evidence, and you are left in the Sufferer's."},{"text":"You: \u201cHang on. I sent it at nine. You read it and said it was fine.\u201d","why":"The blink comes fifth. You remember the nine o'clock send, and his story does not match what happened, so you stop and look at him."},{"text":"Daniel: \u201cFine. Just don't let it happen again.\u201d He turns back to his screen.","why":"The sting comes last. He has the final word and you are left with the doubt he planted. The sheet is still not checked."}],"example":"A parents' WhatsApp group, Monday. \u201cDid you bring the sports kit?\u201d<br>\u201cI think so. Let me check.\u201d<br>\u201cAh, so you didn't. I knew it.\u201d"},{"type":"sort","prompt":"Put these six lines in the order the trap runs, with the bait first and the sting last.","order":true,"items":[{"text":"Omar: \u201cCan you shut the bathroom window when you're done? It's freezing in here.\u201d","why":"Bait comes first. It is a fair request in a cold flat, so nobody can object to it yet."},{"text":"Omar: \u201cSome of us notice when the heating's on. Some of us don't.\u201d","why":"The hook comes second. It lands on your sense of being careless, so you feel called to defend yourself instead of just shutting the window."},{"text":"You: \u201cSorry. I was in the shower. I'll shut it now, don't shout.\u201d","why":"The bite comes third. You answer the hook with an excuse. That puts you in the Sufferer's chair, and you have to prove you were not careless."},{"text":"Omar: \u201cLook what you made me do. Now I'm the one raising my voice at a window.\u201d","why":"The flip comes fourth. Omar moves from the Blamer's chair into the Sufferer's, and that leaves you in the Blamer's, the one he says made him shout."},{"text":"You: \u201cWait. You're the one who started it, not me.\u201d","why":"The blink comes fifth. You only asked about a window, so being blamed for his shouting catches you out. You say so."},{"text":"Omar: \u201cFine. Make it about you, like always.\u201d He carries the kettle into the kitchen.","why":"The sting comes last. Omar has the last word and you feel accused. The same argument is set up for the next open window."}],"example":"A school gate, Wednesday. \u201cCan you bring the lunch box? It's on the bench.\u201d<br>\u201cI'm not the one who forgets things.\u201d<br>\u201cLook what you made me do. Now I'm late too.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"These lines look alike, so the order is harder to hear. Watch for the moment the chairs swap, and let that tell you where the flip is.","items":[{"type":"sort","prompt":"These lines look alike. Put them in the order the trap runs, with the bait first and the sting last, and watch where the chairs swap.","order":true,"items":[{"text":"Gran: \u201cI'm not complaining, but nobody reads these letters for me. You're the only one who understands them.\u201d","why":"Bait comes first. It sounds like a small complaint and a compliment, so a helper hears a favour to be done and no trap at all."},{"text":"Gran: \u201cOf course you're busy, with all that office work. Not that I'd know, nobody tells me anything.\u201d","why":"The hook comes second. Being busy becomes a fault you owe her for, and that catches the part of you that wants to make it up to her."},{"text":"You: \u201cI'll read it with you tonight. Don't worry, I'll sort the whole letter.\u201d","why":"The bite comes third. You offer to carry the whole letter, so you move into the Saviour's chair, and she settles into the Sufferer's."},{"text":"Gran: \u201cOh, you've decided it's a big job, have you? I'll manage on my own, as always.\u201d","why":"The flip comes fourth. Gran leaves the Sufferer's chair for the Blamer's, and it is you who is now accused of making the letter a burden."},{"text":"You: \u201cHang on, I only said I'd read it. Nobody said it was a big job.\u201d","why":"The blink comes fifth. The story has changed under you, and you are caught between an offer you made and a charge you never earned."},{"text":"Gran: \u201cFine. I'll ask the neighbour, then.\u201d She puts the envelope back in the drawer.","why":"The sting comes last. She ends up alone with the letter and you feel you have let her down. The next letter will bring the same trap back."}],"example":"A housing society meeting, Saturday. \u201cYou're the only one who can talk to the secretary. Could you raise the lift?\u201d<br>\u201cI'll raise it.\u201d<br>\u201cOh, so it's that important now?\u201d"},{"type":"sort","prompt":"Put these six lines in the order the trap runs. Some lines sound like teasing, and one line is the flip.","order":true,"items":[{"text":"Clara: \u201cI've opened the sheet four times. Clearly I'm the slowest person in the city.\u201d","why":"Bait comes first. It is a joke at her own expense, and it asks someone to laugh or to say she is not that slow."},{"text":"Daniel: \u201cFour times? Well, at least you're consistent. Some people give up at two.\u201d","why":"The hook comes second. He praises the wrong thing, her persistence, while calling her slow, so she has to decide whether to laugh it off or argue."},{"text":"Clara: \u201cHa. Yes. I'm the one who never gives up, that's me.\u201d","why":"The bite comes third. She takes the sarcasm as a compliment and joins in, which keeps her in the Sufferer's chair while she pretends it is a joke."},{"text":"Daniel: \u201cClara, I thought you'd have it by now. Did you even read the brief?\u201d","why":"The flip comes fourth. Daniel stops teasing like a friend and takes the Blamer's chair, and Clara is left holding the blame."},{"text":"Clara: \u201cWait. You just said I was consistent. Now I didn't read the brief?\u201d","why":"The blink comes fifth. The praise she was given has been taken back in the same breath, and she is stuck turning the sentence over."},{"text":"Daniel: \u201cDoesn't matter. I'll do it myself.\u201d He turns back to his screen, and she closes hers.","why":"The sting comes last. He does the work alone and she feels she has failed. The same trap is waiting for the next sheet."}],"example":"A snooker club, Saturday. \u201cYou lost again? Some people never learn the angle.\u201d<br>\u201cHa, yes, that's me. Never learns.\u201d<br>\u201cThen you should play someone else.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"One longer trap, where the chairs swap at the flip. Put the lines in order, and use the why on each line to see who sits where before and after.","items":[{"type":"sort","prompt":"Put these six lines in order. Read each why as you go, because it says which chair each of you is in, and where the chairs swap.","order":true,"items":[{"text":"Mum: \u201cDon't worry if you're busy. I know you're busy. I'm only sitting here with the lentils.\u201d","why":"Bait comes first. It gives you permission to be busy, so there is nothing to answer yet, only a small guilt waiting to be picked up."},{"text":"Mum: \u201cThree rings and no answer. Still, I'm only your mother. I'm used to it.\u201d","why":"The hook comes second. The missed calls become her hurt, which pulls you into the Saviour's chair, the one that has to make it up to her."},{"text":"You: \u201cSorry, Mum. I'll ring you properly tonight. Twice, if you like.\u201d","why":"The bite comes third. You take on a promise you may not keep, so you are the Saviour fixing her hurt, and she is the Sufferer waiting for the fix."},{"text":"Mum: \u201cTonight, of course. You'll ring when you're done with everyone else. You always do this.\u201d","why":"The flip comes fourth. Mum moves into the Blamer's chair, and you slide into the Sufferer's, the one who always lets her down."},{"text":"You: \u201cMum, I said I'd ring. Why are we em a second time"},{"who":"Ruby","text":"\u201cDon't look at me. I only come to shout.\u201d","cue":"lacing a boot, not looking up"},{"who":"Joseph","text":"\u201cNo, no, of course. It's probably me. It's always me who loses things.\u201d","cue":"dropping the bag on the bench"}],"ask":"Put the six steps of each trap in order, with the bait first and the sting last, and find the flip where the chairs swap."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each set below is one short trap, with six lines. Tap them in the order the trap runs, with the bait first and the sting last.","items":[{"type":"sort","prompt":"Put these six lines in the order the trap runs, with the bait first and the sting last.","order":true,"items":[{"text":"Joseph: \u201cSorry, sorry. The ball pump's still in my car. I'm useless at this, aren't I?\u201d","why":"Bait comes first. It sounds like a plain apology about a pump, so you feel you ought to answer, and nothing in it asks for anything yet."},{"text":"Joseph: \u201cSomebody always ends up sorting out my mess on a Thursday. I never know how to thank them.\u201d","why":"The hook comes second. It catches the fixer in you, the part that cannot watch a friend struggle with a flat ball."},{"text":"You: \u201cGive me your keys, I'll fetch it. Don't worry about it.\u201d","why":"The bite comes third. It is the reply that takes the hook, so you step into the Saviour's chair and he settles into the Sufferer's."},{"text":"Joseph: \u201cWow, you say that like I can't manage one pump. Like I can't do anything right.\u201d","why":"The flip comes fourth. Joseph leaves the Sufferer's chair for the Blamer's, and you are left in the Sufferer's, the one being blamed for helping."},{"text":"You: \u201cHang on. I only offered to fetch it.\u201d","why":"The blink comes fifth. You meant a favour and find yourself on trial, so you stop short and look at him."},{"text":"Joseph: \u201cForget it. We'll kick it flat.\u201d He sits down on the bench and starts on his laces.","why":"The sting comes last. Neither of you got what you wanted, and you both carry the same sour feeling. The trap is ready for the next forgotten thing."}],"example":"A neighbours' WhatsApp group, Tuesday. \u201cSorry, I forgot the bin rota again. I'm hopeless.\u201d<br>\u201cDon't be silly, I'll put them out.\u201d<br>\u201cSo I can't even manage bins. Forget it.\u201d"},{"type":"sort","prompt":"Put these six lines in the order the trap runs. Start with the bait and end with the sting.","order":true,"items":[{"text":"Ruby: \u201cQuick one about the cake. Did the bakery send you the order sheet?\u201d","why":"Bait comes first. It is a routine question about a cake, so you relax, and nothing has been caught yet."},{"text":"Ruby: \u201cI'd ring them myself, but you're so good with details. Everyone says so.\u201d","why":"The hook comes second. A compliment is held out where you can see it, and the part of you that wants it starts to reach."},{"text":"You: \u201cI think they did. I'll check my phone, I might have missed it.\u201d","why":"The bite comes third. You doubt your own memory before anyone has shown you a mistake, which is what the hook was fishing for."},{"text":"Ruby: \u201cAh. So you've lost it. I knew it. I'll go down there myself.\u201d","why":"The flip comes fourth. Ruby takes the Blamer's chair, your doubt becomes her evidence, and you are left in the Sufferer's."},{"text":"You: \u201cHang on. They sent it on Tuesday and you read it over my shoulder.\u201d","why":"The blink comes fifth. You remember Tuesday, and her story does not match, so you stop and look at her."},{"text":"Ruby: \u201cFine. Just don't let it happen again.\u201d She goes back to her tea.","why":"The sting comes last. She has the final word and you carry the doubt she planted. The order sheet is still where it was."}],"example":"A book club chat, Sunday. \u201cDid the library send you the list?\u201d<br>\u201cI think so. Let me check.\u201d<br>\u201cAh, so you've lost it. I knew it.\u201d"},{"type":"sort","prompt":"Put these six lines in the order the trap runs, with the bait first and the sting last.","order":true,"items":[{"text":"Peter: \u201cCould someone put the chairs back? My knee won't let me.\u201d","why":"Bait comes first. It is a fair request in a hall full of stacked chairs, so nobody can object to it yet."},{"text":"Peter: \u201cSome people stack chairs without being asked. Some people stand there holding cups.\u201d","why":"The hook comes second. It lands on your sense of being careless, so you feel called to defend yourself instead of just lifting a chair."},{"text":"You: \u201cI was handing out the biscuits. I'll do it now, there's no need to shout.\u201d","why":"The bite comes third. You answer the hook with an excuse, which puts you in the Sufferer's chair, where you have to prove you were not careless."},{"text":"Peter: \u201cSee what you've done? Now I'm the old man snapping over chairs.\u201d","why":"The flip comes fourth. Peter moves from the Blamer's chair to the Sufferer's, and you are left in the Blamer's, the one who made him snap."},{"text":"You: \u201cWait. You brought up the chairs, not me.\u201d","why":"The blink comes fifth. You only heard a request, so being blamed for his temper catches you out, and you say so."},{"text":"Peter: \u201cFine. Make it about you.\u201d He lifts one chair himself and sets it down hard.","why":"The sting comes last. He has the final word and you feel accused. The same argument is waiting for the next stack of chairs."}],"example":"A school fete, Saturday. \u201cCan you carry the tombola prizes?\u201d<br>\u201cI'm not the one who forgets things.\u201d<br>\u201cLook what you made me do. Now we're late.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"These lines look alike, so the order is harder to hear. Watch for the moment the chairs swap, and let that tell you where the flip is.","items":[{"type":"sort","prompt":"These lines look alike. Put them in the order the trap runs, with the bait first and the sting last, and watch where the chairs swap.","order":true,"items":[{"text":"Joseph: \u201cThe envelope for Ruby's present is nearly full. Everyone's been very kind about my share.\u201d","why":"Bait comes first. It sounds like thanks and a small worry, so a helper hears a favour waiting and no trap at all."},{"text":"Joseph: \u201cYou covered me last time, didn't you? I think about that more than you'd guess.\u201d","why":"The hook comes second. Gratitude turns into a debt he is carrying, and that catches the part of you that wants to lift it."},{"text":"You: \u201cForget last time. I'll put your share in again, it's nothing.\u201d","why":"The bite comes third. You offer to carry his whole share, so you step into the Saviour's chair and he settles into the Sufferer's."},{"text":"Joseph: \u201cOh, so I'm a charity case now. Good to know what the group thinks.\u201d","why":"The flip comes fourth. Joseph leaves the Sufferer's chair for the Blamer's, and it is you who is now accused of looking down on him."},{"text":"You: \u201cHold on, I only said I'd cover it. Nobody said charity.\u201d","why":"The blink comes fifth. The story has changed under you, and you are caught between an offer you made and a charge you never earned."},{"text":"Joseph: \u201cFine. I'll leave this with Nadia and you can explain why.\u201d He sets the envelope on the counter and goes to the door.","why":"The sting comes last. He leaves with the last word and you feel you have wronged him. Ruby's present is still short."}],"example":"A leaving collection at a gym, Friday. \u201cI'm a bit short this month.\u201d<br>\u201cI'll cover you.\u201d<br>\u201cOh, so I'm a charity case now.\u201d"},{"type":"sort","prompt":"Put these six lines in the order the trap runs. Some lines sound like teasing, and one line is the flip.","order":true,"items":[{"text":"Joseph: \u201cThird own goal this season. At this rate I should invoice the other side.\u201d","why":"Bait comes first. It is a joke at his own expense, and it asks someone to laugh or to say he is not that bad."},{"text":"Terry: \u201cThird? Well, you're steady. Most men would have retired at two.\u201d","why":"The hook comes second. He praises the wrong thing, steadiness, while calling Joseph a liability, so Joseph has to choose between laughing it off and arguing."},{"text":"Joseph: \u201cHa. Yes. Steady, that's my brand.\u201d","why":"The bite comes third. Joseph takes the sarcasm as praise and joins in, which keeps him in the Sufferer's chair while he pretends it is a joke."},{"text":"Terry: \u201cJoseph, I put you at the back because I thought you'd listen. Did you hear a word of the team talk?\u201d","why":"The flip comes fourth. Terry stops teasing like a mate and takes the Blamer's chair, and Joseph is left holding the blame."},{"text":"Joseph: \u201cWait. You just said steady. Now I wasn't listening?\u201d","why":"The blink comes fifth. The praise he was handed has been taken back in the same breath, and he is stuck turning the sentence over."},{"text":"Terry: \u201cDoesn't matter. I'll pick the side myself.\u201d He tucks the clipboard under his arm, and Joseph unlaces a boot.","why":"The sting comes last. Terry picks alone and Joseph feels dropped. The same trap is waiting for the next match."}],"example":"A pub quiz, Wednesday. \u201cI got every question wrong. Genius at work.\u201d<br>\u201cWell, you're consistent.\u201d<br>\u201cHa, yes.\u201d<br>\u201cDid you even read the round?\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"One longer trap, where the chairs swap at the flip. Put the lines in order, and use the why on each line to see who sits where before and after.","items":[{"type":"sort","prompt":"Put these six lines in order. Read each why as you go, because it says which chair each of you is in, and where the chairs swap.","order":true,"items":[{"text":"Ruby: \u201cDon't worry if you can't make Saturday. I know you've got the match. I'm only sitting here with the candles.\u201d","why":"Bait comes first. It gives you permission to be busy, so there is nothing to answer yet, only a small guilt waiting to be picked up."},{"text":"Ruby: \u201cSeven yeses on the list. Still, I'm only turning forty. Nobody has to come.\u201d","why":"The hook comes second. A plain birthday becomes her hurt, which pulls you into the Saviour's chair, the one that has to make it up to her."},{"text":"You: \u201cSorry, Ruby. I'll come straight from the match and bring the candles myself.\u201d","why":"The bite comes third. You take on a promise that costs you, so you are the Saviour fixing her hurt, and she is the Sufferer waiting for the fix."},{"text":"Ruby: \u201cStraight from the match, in your muddy kit. Of course. You always turn up late and call it a favour.\u201d","why":"The flip comes fourth. Ruby moves into the Blamer's chair and you slide into the Sufferer's, the one who always lets her down."},{"text":"You: \u201cRuby, I'm offering to come. Why are we arguing about a muddy kit?\u201d","why":"The blink comes fifth. You were only offering to be there, so the argument catches you off guard. You stop trying to fix it."},{"text":"Ruby: \u201cFine. Come when you can. I'll save you a plate, not that anyone eats.\u201d She ends the call before you can answer.","why":"The sting comes last. She has the last word and the line goes dead. You both carry the feeling that a promise counts for less than a grievance."}],"example":"A group chat for a leaving do, Thursday. \u201cDon't worry if you can't come.\u201d<br>\u201cI'll try, I'm on late shift.\u201d<br>\u201cFine, don't worry about us.\u201d"}]}]},{"setting":"Relationships","blurb":"Clara is on the edge of a second date with Omar, and she cannot tell anyone she wants it.","opener":{"setting":"Friday, 6:30pm. The Corner Table, the window seat. Omar's coat is still over the back of Clara's chair, and he left an hour ago.","lines":[{"who":"Clara","text":"\u201cHe'll think I took it on purpose. I did not take it on purpose.\u201d","cue":"holding the sleeve with two fingers"},{"who":"Beth","text":"\u201cHe'll think you like him. You do. Hand it over, I'll say you forgot.\u201d","cue":"reaching across, bluntly"},{"who":"Clara","text":"\u201cDon't. I'm fine. I always manage.\u201d","cue":"pulling the coat back onto her lap"}],"ask":"Put the six steps of each trap in order, with the bait first and the sting last, and find the flip where the chairs swap."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each set below is one short trap, with six lines. Tap them in the order the trap runs, with the bait first and the sting last.","items":[{"type":"sort","prompt":"Put these six lines in the order the trap runs, with the bait first and the sting last.","order":true,"items":[{"text":"Clara: \u201cI left Omar's coat on the chair at the Corner Table. Typical me, I can't do one nice thing right.\u201d","why":"Bait comes first. It reads as a small confession about a coat, so you feel you ought to answer, and nothing in it asks for anything yet."},{"text":"Clara: \u201cPeople say I try too hard. Nobody says it kindly.\u201d","why":"The hook comes second. It catches the comforter in you, the part that cannot let a friend feel foolish."},{"text":"You: \u201cDon't be silly, you're lovely. I'll take it round to him myself.\u201d","why":"The bite comes third. It is the reply that takes the hook, so you step into the Saviour's chair and she settles into the Sufferer's."},{"text":"Clara: \u201cLovely. You say that like I'm too fragile to carry a coat across a room.\u201d","why":"The flip comes fourth. Clara leaves the Sufferer's chair for the Blamer's, and you are left in the Sufferer's, the one now being blamed for kindness."},{"text":"You: \u201cHang on, I only offered to carry it.\u201d","why":"The blink comes fifth. You meant a favour and find yourself accused of pity, so you stop and look at her."},{"text":"Clara: \ 1cSo he didn't. I knew it.\u201d"},{"type":"sort","prompt":"Put these six lines in the order the trap runs, with the bait first and the sting last.","order":true,"items":[{"text":"Clara: \u201cCan you pass Omar the sugar? He's been waiting a while.\u201d","why":"Bait comes first. It is a fair request at a small table on a second date, so nobody can object to it yet."},{"text":"Clara: \u201cSome people notice when a man's cup is empty. Some people look at their phone.\u201d","why":"The hook comes second. It lands on your sense of being careless, so you feel called to defend yourself instead of passing the sugar."},{"text":"You: \u201cI was reading a message. I'll pass it now, no need to snap.\u201d","why":"The bite comes third. You answer the hook with an excuse, which puts you in the Sufferer's chair, where you have to prove you were not careless."},{"text":"Clara: \u201cLook what you made me do. Now I'm the woman fussing over sugar on a second date.\u201d","why":"The flip comes fourth. Clara moves from the Blamer's chair to the Sufferer's, and you are left in the Blamer's, the one who made her fuss."},{"text":"You: \u201cWait. You brought up the sugar, not me.\u201d","why":"The blink comes fifth. You only heard a request, so being blamed for her nerves catches you out, and you say so."},{"text":"Clara: \u201cFine. Make it about you.\u201d She slides the sugar across to Omar without looking at either of you.","why":"The sting comes last. She has the final word and you feel accused. Omar sits between you with an empty spoon."}],"example":"A wedding table, Saturday. \u201cCan you pass the bread?\u201d<br>\u201cI'm not the one who forgets things.\u201d<br>\u201cLook what you made me do. Now I'm shouting.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"These lines look alike, so the order is harder to hear. Watch for the moment the chairs swap, and let that tell you where the flip is.","items":[{"type":"sort","prompt":"These lines look alike. Put them in the order the trap runs, with the bait first and the sting last, and watch where the chairs swap.","order":true,"items":[{"text":"Clara: \u201cOmar said my sheet was good. He's being polite, obviously. He's like that.\u201d","why":"Bait comes first. It sounds like a small boast and a small doubt, so a friend hears a chance to reassure and no trap at all."},{"text":"Clara: \u201cYou'd tell me if it was rubbish. You're the only honest one I've got.\u201d","why":"The hook comes second. Honesty becomes a job handed to you, and that catches the part of you that wants to prove you can be trusted with it."},{"text":"You: \u201cIt's good, Clara. I'll go through every line with you tonight, so you can stop worrying.\u201d","why":"The bite comes third. You offer to carry all of her worry, so you step into the Saviour's chair and she settles into the Sufferer's."},{"text":"Clara: \u201cSo I do need checking. Brilliant. Thanks for the vote of confidence.\u201d","why":"The flip comes fourth. Clara leaves the Sufferer's chair for the Blamer's, and it is you who is now accused of doubting her."},{"text":"You: \u201cHold on, I only offered to read it with you.\u201d","why":"The blink comes fifth. The story has changed under you, and you are caught between an offer you made and a charge you never earned."},{"text":"Clara: \u201cFine. I'll send it as it is.\u201d She presses the key before you can say another word.","why":"The sting comes last. She leaves with the last word and you feel you have wronged her. The sheet goes out unread by anyone but her."}],"example":"A cooking class, Thursday. \u201cChef said my sauce was fine. He's just polite.\u201d<br>\u201cI'll taste it with you.\u201d<br>\u201cSo it needs checking. Lovely.\u201d"},{"type":"sort","prompt":"Put these six lines in the order the trap runs. Some lines sound like teasing, and one line is the flip.","order":true,"items":[{"text":"Clara: \u201cI've reread his message eleven times. Clearly I'm the slowest woman in oever did it.\u201d","cue":"from the whiteboard, marker uncapped"},{"who":"Omar","text":"\u201cMight be the config from this morning. I'll look in a minute.\u201d","cue":"not looking up from his screen"},{"who":"Sam","text":"\u201cIt's me, isn't it. It's always me. I'm hopeless.\u201d","cue":"already reaching for the laptop"}],"ask":"Put the six steps of each trap in order, with the bait first and the sting last, and find the flip where the chairs swap."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each set below is one short trap, with six lines. Tap them in the order the trap runs, with the bait first and the sting last.","items":[{"type":"sort","prompt":"Put these six lines in the order the trap runs, with the bait first and the sting last.","order":true,"items":[{"text":"Sam: \u201cSorry, sorry. I've broken the staging build again. I'm hopeless, aren't I?\u201d","why":"Bait comes first. It sounds like a plain apology about a build, so you feel you ought to answer, and nothing in it asks for anything yet."},{"text":"Sam: \u201cEveryone ends up fixing my commits. It's the story of my career.\u201d","why":"The hook comes second. It catches the fixer in you, the part that cannot leave a teammate's mess sitting on the screen."},{"text":"You: \u201cI'll roll it back for you. Don't worry about it.\u201d","why":"The bite comes third. It is the reply that takes the hook, so you step into the Saviour's chair and he settles into the Sufferer's."},{"text":"Sam: \u201cWow, you make it sound like I can't commit one file. Like I can't do anything right.\u201d","why":"The flip comes fourth. Sam leaves the Sufferer's chair for the Blamer's, and you are left in the Sufferer's, the one now being blamed for helping."},{"text":"You: \u201cHang on. I only offered to roll it back.\u201d","why":"The blink comes fifth. You meant a favour and find yourself on trial, so you stop short and look at him."},{"text":"Sam: \u201cForget it. Whatever.\u201d He pulls the laptop toward him and the fan whirs louder.","why":"The sting comes last. Neither of you got what you wanted, and the build is still broken. The trap is ready for the next red screen."}],"example":"A shared fridge note, Tuesday. \u201cSorry, I've finished the milk again. I'm useless.\u201d<br>\u201cDon't worry, I'll buy more.\u201d<br>\u201cSo I can't even manage milk. Forget it.\u201d"},{"type":"sort","prompt":"Put these six lines in the order the trap runs. Start with the bait and end with the sting.","order":true,"items":[{"text":"Clara: \u201cCan I check one thing with you? The appendix for the client.\u201d","why":"Bait comes first. It is a routine question about a document, so you relax, and nothing has been caught yet."},{"text":"Clara: \u201cI'd check it myself, but you're so quick with these. Daniel says so.\u201d","why":"The hook comes second. A compliment is held out where you can see it, and the part of you that wants it starts to reach."},{"text":"You: \u201cI did check it. I think. Let me scroll back and look.\u201d","why":"The bite comes third. You doubt your own check before anyone has shown you a mistake, which is the reply the hook was fishing for."},{"text":"Clara: \u201cSo you haven't checked it. I knew it. I'll go through it myself.\u201d","why":"The flip comes fourth. Clara takes the Blamer's chair under deadline pressure, your doubt becomes her evidence, and you are left in the Sufferer's."},{"text":"You: \u201cHang on. I sent it at four and you read it over my shoulder.\u201d","why":"The blink comes fifth. You remember the four o'clock send, and her story does not match, so you stop and look at her."},{"text":"Clara: \u201cFine. Just don't let it happen again.\u201d She turns her screen so you cannot see it.","why":"The sting comes last. She has the final word and you carry the doubt she planted. The appendix is still unchecked."}],"example":"A student marking pool, Monday. \u201cQuick question about the rubric.\u201d<br>\u201cI think I used it. Let me  expense, and it asks someone to laugh or to say he is not that bad."},{"text":"Daniel: \u201cLooking? Well, you're consistent. Most people need to touch it.\u201d","why":"The hook comes second. He praises the wrong thing, consistency, while calling Sam a liability, so Sam has to choose between laughing it off and arguing."},{"text":"Sam: \u201cHa. Yes. Consistent, that's me.\u201d","why":"The bite comes third. Sam takes the sarcasm as praise and joins in, which keeps him in the Sufferer's chair while he pretends it is a joke."},{"text":"Daniel: \u201cSam, I thought you'd have rebooted by now. Did you even read the runbook?\u201d","why":"The flip comes fourth. Daniel stops teasing like a colleague and takes the Blamer's chair, and Sam is left holding the blame."},{"text":"Sam: \u201cWait. You said consistent. Now I didn't read the runbook?\u201d","why":"The blink comes fifth. The praise he was handed has been taken back in the same breath, and he is stuck turning the sentence over."},{"text":"Daniel: \u201cDoesn't matter. Omar can do it.\u201d He turns away, and Sam closes the lid.","why":"The sting comes last. Daniel hands the job on and Sam feels he has failed. The same trap is waiting for the next red screen."}],"example":"A running club, Saturday. \u201cLast again. I'm the slowest in the county.\u201d<br>\u201cWell, you're consistent.\u201d<br>\u201cHa, yes.\u201d<br>\u201cDid you even train?\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"One longer trap, where the chairs swap at the flip. Put the lines in order, and use the why on each line to see who sits where before and after.","items":[{"type":"sort","prompt":"Put these six lines in order. Read each why as you go, because it says which chair each of you is in, and where the chairs swap.","order":true,"items":[{"text":"Daniel: \u201cDon't worry if you're still on the release. I know you're busy. I'm only sitting here with the dashboard.\u201d","why":"Bait comes first. It gives you permis
