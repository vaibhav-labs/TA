<html lang="en-GB">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keep It Real for Six Turns · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"7.6","setting":"Friends & Community","title":"Keep It Real for Six Turns","world":7,"worldName":"Free to Choose","week":7,"weekName":"Free to Choose","mechanic":"Open","concept":"After this one you can keep a candid conversation real for six turns, without rescuing anyone or blaming them.","plainWord":"after the traps","bookTerm":"After games","bookIdea":"Berne's last chapter closes his bleak picture of life as a wait filled with pastimes and games by saying that, for some people, awareness, spontaneity and an intimacy more rewarding than any game lift them above it, though all three can be frightening and even risky for someone unprepared, so his hope is for individuals who get ready.","bookSource":"Games People Play, ch. 18","opener":{"setting":"Sunday, 5:40pm, The Corner Table, the back table. The group has gone home. Nadia has two cups of tea and no notes.","lines":[{"who":"Nadia","text":"\u201cSit down. I've got the tea, and I've got nothing written down.\u201d","cue":"pushing one cup across the table, not smiling yet"}],"ask":"Can you keep this conversation real for six turns, without rescuing anyone or blaming them?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Nadia's lines can hook you. Tap what each one is doing, and listen for the one with no hook in it.","items":[{"type":"pick","who":"Nadia","text":"\u201cYou're the only one who really gets it, aren't you?\u201d","cue":"smiling into her cup","options":["A hook: flattery to keep you in the chair","A real question","A joke about the tea"],"answer":0,"why":"She is handing you a compliment that makes you the one who gets it. Taking it means you stop looking at your own part.","traps":{"1":"A real question. It sounds like one, but it asks for your opinion of yourself, which is the hook again.","2":"A joke about the tea. It is light, and it sidesteps the question. But it is the same move: it gives the hook a laugh and leaves it in place."},"example":"Football club, Saturday.<br>Coach: \u201cYou're the only player who listens to me. The rest are hopeless.\u201d<br>You: \u201cThe rest are learning. I'm still learning too.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cSam will be fine, won't he? I'd hate to think it's on you if he isn't.\u201d","cue":"turning her cup slowly, not looking up","options":["A real question about Sam","A hook: she is handing you his rent","A plain answer about the flat"],"answer":1,"why":"Her question puts Sam's future on your shoulders. If you answer it, you take the saviour's chair for someone who is not even at the table.","traps":{"0":"A real question about Sam. It sounds fair, but it asks you to forecast his life. That is the same chair with a different label.","2":"A plain answer about the flat. It sounds sensible, but it accepts her frame, that his lateness is yours to fix, and answers inside it."},"example":"Neighbourhood cricket nets, Saturday.<br>Captain: \u201cWill Ian's team turn up? It's on you if they don't.\u201d<br>You: \u201cAsk Ian. He has a phone.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cDaniel's been unbearable this year. Anyone would have walked out by now, wouldn't they?\u201d","cue":"pen tapping the table, waiting","options":["A plain feeling you can name","A question about the schedule","Joining in: the blamer's chair"],"answer":2,"why":"She is asking you to agree and add a charge, so the case against Daniel grows. That is the blamer's chair, and this boss is built to test it.","traps":{"0":"A plain feeling you can name. It is honest, but here the line is asking for a verdict, and a feeling is not a verdict.","1":"A question about the schedule. It sounds like a way to change the subject, but the subject still goes back to Daniel in five minutes."},"example":"Tea stall, by the bus stop, 6:45pm.<br>Man: \u201cThe conductor's useless. Everyone says so, don't they?\u201d<br>You: \u201cI haven't ridden with him. Did you get your tea yet?\u201d"},{"type":"pick","who":"Nadia","text":"\u201cI'm not fishing, and I'm not going to fix anything for you. I'd like to hear how the term actually went.\u201d","cue":"both hands round the cup, looking straight at you","options":["Small talk to fill the time","A hook: she wants you to need her","A plain question with no game in it"],"answer":2,"why":"She says what she wants and leaves the answer to you. There is no compliment to grab, no rescue to accept and no one to blame. This is what a conversation sounds like once the traps are gone.","traps":{"0":"Small talk to fill the time. It is quiet and friendly, but small talk wouldn't ask for the actual answer. She is asking for the real one.","1":"A hook: she wants you to need her. She has said she won't fix anything, so there is no rescue on offer and nothing to lean on."},"example":"Hospital corridor, 4:15pm.<br>Nurse: \u201cI can't promise it will be quick. I can tell you what I know, if you'd like.\u201d<br>Visitor: \u201cYes, please.\u201d<br>Nothing is being sold, and nobody is rescuing."}]},{"level":"Play","label":"Play, the week in motion","intro":"Two short conversations with Nadia, three turns each. She leaves doors open. Some lead somewhere useful, and some lead back to the old chairs.","items":[{"type":"scene","title":"Sunday, 5:40pm, the back table","setting":"The Corner Table. The chairs are stacked by the door, and the only light is the one over the counter. Nadia's notebook is still shut.","meters":{"you":50,"them":50},"beats":[{"who":"Nadia","text":"\u201cSo. Tell me one thing you did this term that you're proud of, and one you aren't. No jokes.\u201d","cue":"not smiling yet, a notebook still closed","lines":[{"text":"\u201cThe deal with Maya. And I still fix things nobody asked me to fix, so I'm not finished.\u201d","tag":"best","you":4,"them":3,"outcome":"Nadia nods once. \u201cGood. That's the honest version. Keep it.\u201d","why":"You name the win and the old habit in one breath. Candid means saying both halves, the win and the bruise."},{"text":"\u201cThe deal with Maya, and I'm not sure about the rest.\u201d","tag":"ok","you":1,"them":1,"outcome":"She waits for the rest, and the rest doesn't come.","why":"This is honest but thin. You gave one half, and the silence after it is where the test is."},{"text":"\u201cI'm proud of most of it. You'd know, you've been watching me all term.\u201d","tag":"ok","you":-4,"them":-4,"outcome":"Nadia says \u201cMm,\u201d and the answer she wanted goes unsaid.","why":"This asks her to approve of you. It trades a real answer for her praise, and that keeps you looking for the praise instead of the answer."}]},{"who":"Nadia","text":"\u201cSam will be fine, won't he? I'd hate to think it's on you if he isn't.\u201d","cue":"turning the cup, not looking at you","lines":[{"text":"\u201cHe's a grown man. If his share is late, that's his to sort out. I'm not covering it.\u201d","tag":"best","you":4,"them":2,"outcome":"Nadia's mouth twitches. \u201cGood. Say that to him, not to me.\u201d","why":"You leave Sam's share with Sam and refuse the rescue out loud. The rent stays in his lap."},{"text":"\u201cI hope he is. I'll try to help where I can.\u201d","tag":"ok","you":-2,"them":0,"outcome":"She nods, and the words \u201cwhere I can\u201d sit on the table between you.","why":"This sounds kind, but \u201cwhere I can\u201d is a promise to keep rescuing. It is the saviour's chair in a soft voice."},{"text":"\u201cIt's totally Sam's fault, isn't it. He never pays.\u201d","tag":"ok","you":-5,"them":-6,"outcome":"Nadia says, \u201cThere it is,\u201d and writes nothing down.","why":"This takes the blamer's chair and hands it to Sam. It sounds like agreement, and it locks you both into the same story."}]},{"who":"Nadia","text":"\u201cYou've made this look easy, you know. Some of us find it harder.\u201d","cue":"a smile, not quite warm","lines":[{"text":"\u201cIt isn't easy. I got it wrong with Omar on Tuesday, and I'm still learning. Is it hard for you too?\u201d","tag":"best","you":3,"them":4,"outcome":"Nadia's smile loosens. \u201cSome weeks, yes. Thank you for asking me that.\u201d","why":"You turn down the compliment without making a show of it, then hand the question back to her as one adult to another."},{"text":"\u201cThanks. I've had good teachers.\u201d","tag":"ok","you":0,"them":1,"outcome":"She nods and does not write anything down.","why":"It is a polite thank you. There is no hook in it, and it gives her nothing real either."},{"text":"\u201cI think I'm finally the one who gets it, Nadia. Better than anyone here.\u201d","tag":"ok","you":-6,"them":-6,"outcome":"Nadia picks up her cup and looks at the door.","why":"You have accepted the praise and made it a rank. Now you need someone to be below you, and that is the old game."}]}],"fallout":{"them":"Nadia finishes her tea in two swallows, says she has to lock up early, and leaves before you can answer."}},{"type":"scene","title":"Sunday, 6:10pm, the same table","setting":"The Corner Table. The second round of tea has come, and Nadia has finally opened the notebook. The light over the counter hums.","meters":{"you":55,"them":50},"beats":[{"who":"Nadia","text":"\u201cHave you seen how Daniel talks to you? You should go to HR. I'm on your side here, and so is everyone who has watched him.\u201d","cue":"leaning in, lowering her voice to the table","lines":[{"text":"\u201cThat sounded like you're on my side against him. I'd rather decide what to do about Daniel myself.\u201d","tag":"best","you":4,"them":4,"outcome":"Nadia sits back and looks at you for a long moment. \u201cThank you. That's the one I almost did.\u201d","why":"You catch her almost playing the saviour's chair for you, against him, and you say so plainly. She thanks you because the move she nearly made would have trapped you both."},{"text":"\u201cMaybe. I'll think about HR.\u201d","tag":"ok","you":-2,"them":0,"outcome":"She says, \u201cDo,\u201d and her voice goes back to its usual pitch.","why":"You don't join the case, but you don't catch it either. The almost-game passes, and the lesson passes with it."},{"text":"\u201cYes, he's a nightmare. Let's get him.\u201d","tag":"ok","you":-6,"them":-6,"outcome":"Nadia's pen starts moving, and she writes a list of Daniel's charges.","why":"You take her invitation and add a charge. Now the case has two people on it, and the room will feel it on Monday."}]},{"who":"Nadia","text":"\u201cYou never ask Gran for anything, do you? Why's that?\u201d","cue":"tilting her head, the way Gran does when she is listening for a lie","lines":[{"text":"\u201cBecause if I ask, she'll say yes, and then I'll owe her for the rest of my life. I'd rather ask her straight, next time.\u201d","tag":"best","you":3,"them":4,"outcome":"Nadia nods. \u201cThen ask her straight. Let's see what she does with a straight question.\u201d","why":"You name the hidden cost, then choose the direct ask. A plain request is the way out of waiting."},{"text":"\u201cShe's too old for all that now. Let her be.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"Nadia says, \u201cIs that what you think, or what she told you?\u201d","why":"A kind excuse. It keeps the wish buried, and it speaks for Gran, which is a rescue in its own right."},{"text":"\u201cBecause she'd make me feel guilty for wanting anything, like always.\u201d","tag":"ok","you":-5,"them":-6,"outcome":"Nadia says, \u201cMm,\u201d and turns the cup a quarter turn on the table.","why":"This makes Gran the villain, so you can stay the one who waits and suffers. It keeps asking out of the picture."}]},{"who":"Nadia","text":"\u201cLast one, and then the tea's cold. What will you stop doing this week, and who will you tell?\u201d","cue":"pen in her hand now","lines":[{"text":"\u201cI'll stop covering Sam's share, and I'll tell him on Friday, out loud, with the number.\u201d","tag":"best","you":4,"them":4,"outcome":"Nadia writes it down. \u201cGood. That's a promise you can hold him to.\u201d","why":"You stop the rescue, and you name the person and the day. Letting him feel the cost is the way out for someone who keeps saving."},{"text":"\u201cI'll drop the Daniel file, and I'll sit down with him on Monday and go through the sums.\u201d","tag":"best","you":4,"them":4,"outcome":"Nadia nods slowly. \u201cMonday. Bring the sums, not the file.\u201d","why":"You let go of the case and take the talk to the one person it is about. That is the way out for someone who keeps blaming."},{"text":"\u201cI'll ask Gran what she wants for the holiday weekend, straight out, and I won't wait for her to offer.\u201d","tag":"best","you":4,"them":4,"outcome":"Nadia smiles, properly this time. \u201cThen you'll know what she wants. And she'll know you asked.\u201d","why":"You stop waiting to be offered, and you ask. That is the way out for someone who keeps suffering, and it turns the wait into a request."},{"text":"\u201cNothing, really. Who would I tell? Nobody listens.\u201d","tag":"ok","you":-6,"them":-7,"outcome":"Nadia closes the notebook without writing anything in it.","why":"This is the old routine in one line: a verdict on everyone else, and nobody to tell. It keeps the week exactly as it was."}]}],"fallout":{"them":"Nadia stands, says the group starts at seven next week, and leaves before you can answer."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two to read back. Name the chair in the first, and say what Berne's last chapter makes of the wobble in the second.","items":[{"type":"pick","who":"Nadia","text":"\u201cHave you seen how Daniel talks to you? I'm on your side here.\u201d","cue":"Which explanation fits?","options":["Sincere concern, and nothing more. She just wants you to be safe at work.","A saviour's move for you that doubles as a blamer's move against Daniel. It asks you to sign the case. Karpman's drama triangle, which Steiner calls the rescue triangle, has exactly these seats, and people swap between them.","A test of your mood, to see if you'll get upset. It has no trap in it."],"answer":1,"why":"She offered to rescue you by going after Daniel. The saviour's chair and the blamer's chair are both in the line, and the swap is the trap. Steiner's rescue triangle, taken from Karpman's drama triangle, is these three seats with people moving between them.","traps":{"0":"Sincere concern. It sounds caring, and she may be partly sincere. But the line asks you to join a case against him, and that is the trap, whatever her heart is doing.","2":"A test of your mood. It sounds like a good guess, but the line has a clear hook: a case and a rescue, with you as the one who signs."},"example":"Society meeting, Sunday, 6:30pm.<br>Neighbour: \u201cThe treasurer's been useless. I'm on your side, just say it.\u201d<br>You: \u201cI'll talk to the treasurer myself, thanks.\u201d"},{"type":"pick","who":"You","text":"Walking home, you feel wobbly. Saying true things out loud felt risky, and a small voice says the old chairs were safer.","cue":"What does Berne's last chapter say about that?","options":["Life after games is easy once you know the moves, so the wobble means you did something wrong.","Awareness, spontaneity and intimacy can be frightening and even risky for someone unprepared. His hope is for individuals who get ready, so a wobble is normal.","Once enough people drop their games, the whole human race will follow, so the wobble will pass on its own."],"answer":1,"why":"Berne ends the book by saying that for some people there is more than the bleak picture of life as a wait filled with pastimes and games. He also warns that the way out can be frightening and even perilous to the unprepared. His hope rests with individuals, and of the human race as a whole he is doubtful.","traps":{"0":"Easy once you know the moves. It would be comforting, but Berne says the opposite: the way past games can be frightening, so a wobble is no sign of a mistake.","2":"The whole human race will follow. Berne is not that hopeful. He says there may be no hope for the human race as a whole, but there is hope for individual people."},"example":"Climbing wall, Saturday, 11:00am.<br>Beginner: \u201cMy legs are shaking, so I must be doing it wrong.\u201d<br>Instructor: \u201cFirst time on the high wall? Shaking means you're doing something new. Rest a minute, then go on.\u201d"}]}],"debrief":{"nadia":"Seven weeks ago you were still working out a warm nod from a cold one at a kitchen table. Tonight you sat through six turns of someone else's oldest opening lines and took none of the chairs on offer, and the tea went cold because neither of you needed it as a prop. That was never going to be finished, and it was never a prize for getting here. It is one real conversation, and that is the thing itself.","bookTerm":"After games","bookNote":"The books call this life after games. Berne's last chapter says there is something more rewarding than games, but that awareness, spontaneity and intimacy can be frightening and even risky for the unprepared, so he offers hope to individuals."},"reflection":{"prompt":"Name one game you now recognise that you could not see back in week 1. What is the smallest real step out of it you could actually take this week, not a fix, just a start?"},"next":null,"baseStory":{"setting":"Friends & Community","blurb":"After the Sunday group, Nadia sits you down with tea and tries every old hook on you."},"moreStories":[{"setting":"Home & Flatmates","blurb":"Maya makes tea after the rota meeting, and Sam's late gas share sits between you.","opener":{"setting":"Sunday, 5:40pm, the flat, the kitchen. Sam is out on a shift. Maya has two mugs of tea and the rota sheet face down.","lines":[{"who":"Maya","text":"\u201cSit down. I've made tea, and I've turned the sheet over.\u201d","cue":"sliding a mug across the table, not smiling yet"},{"who":"Maya","text":"\u201cIt's nine days, by the way. I'm not counting.\u201d","cue":"squaring her mug on its coaster"}],"ask":"Can you keep this conversation real for six turns, without rescuing anyone or blaming them?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Her lines can hook you. Tap what each one is doing, and listen for the one with no hook in it.","items":[{"type":"pick","who":"Maya","text":"\u201cYou're the only one in this flat who actually reads the rota, you know.\u201d","cue":"tapping the face-down sheet with one finger","options":["A hook: flattery to make you her ally","A plain thank you for reading the rota","A joke about how dull the rota is to read"],"answer":0,"why":"She praises you in a way that puts Sam below you. If you take it, you become the good flatmate, and that seat needs a bad one to sit across from it.","traps":{"1":"A plain thank you. It feels polite, but it accepts the seat she is offering, and Sam is already in the other one.","2":"A joke about the rota. It is light, but it laughs along with her and leaves the praise exactly where she put it."},"example":"Bus stop, Monday, 8:10am.<br>Neighbour: \u201cYou're the only one who sorts the recycling properly. The rest are hopeless.\u201d<br>You: \u201cEveryone's got a different bin day. I just wrote mine on the fridge.\u201d"},{"type":"pick","who":"Maya","text":"\u201cSam will find the gas money, won't he? I'd hate to think it lands on you.\u201d","cue":"turning the mug by its handle, not looking up","options":["A plain answer about when the bill is due","A real question about how Sam is getting on","A hook: she is handing you his debt"],"answer":2,"why":"Her question puts Sam's money on your shoulders. If you answer it, you take the saviour's chair for a man who is out on a shift and is not even at the table.","traps":{"0":"A plain answer about the bill. It sounds sensible, but it accepts her frame, that his lateness is yours to cover, and answers inside it.","1":"A real question about Sam. It sounds kind, but it asks you to forecast his job and his luck, and that is the same chair with a softer label."},"example":"Allotment committee, Saturday.<br>Chair: \u201cRavi will pay his plot fee, won't he? It'd be a shame if you had to cover.\u201d<br>You: \u201cIt's Ravi's fee. Ask Ravi.\u201d"},{"type":"pick","who":"Maya","text":"\u201cMr Pell's been impossible about the damp. Anyone would have moved out by now, wouldn't they?\u201d","cue":"pen tapping the table, waiting","options":["A plain feeling about the damp, said aloud","Joining in: the blamer's chair","A question about the repair date"],"answer":1,"why":"She wants you to agree and add a charge, so the case against Mr Pell grows. That is the blamer's chair, and a wet bedroom wall makes it easy to sit in.","traps":{"0":"A plain feeling about the damp. It is honest, but this line is asking for a verdict on Mr Pell, and a feeling is not a verdict.","2":"A question about the repair date. It sounds like a way to change the subject, but the subject walks back to Mr Pell within five minutes."},"example":"Launderette, Wednesday.<br>Woman: \u201cThe management is a disgrace. Everyone says so, don't they?\u201d<br>You: \u201cI've only seen the broken dryer. Is yours the one that eats coins?\u201d"},{"type":"pick","who":"Maya","text":"\u201cI'm not fishing, and I'm not going to fix anything. I'd like to hear how the month actually went for you.\u201d","cue":"both hands round the mug, looking straight at you","options":["Small talk to fill the gap before the real thing","A hook: she wants you to need her for the answer","A plain question with no game in it"],"answer":2,"why":"She says what she wants and leaves the answer to you. There is no praise to grab, no rescue on offer and nobody to blame. This is how a conversation sounds once the traps are gone.","traps":{"0":"Small talk. The tone is friendly, but small talk would not ask for the actual answer, and she just did.","1":"A hook that wants you to need her. She has said she will fix nothing, so there is no rescue to lean on."},"example":"Driving lesson, Tuesday, 4:30pm.<br>Instructor: \u201cI won't grab the wheel. Tell me what felt hard today.\u201d<br>Learner: \u201cThe roundabout. I froze.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two short conversations, three turns each. She leaves doors open. Some lead somewhere useful, and some lead back to the old chairs.","items":[{"type":"scene","title":"Sunday, 5:40pm, the kitchen table","setting":"The flat. The bin bags wait by the door, the rota sheet is face down, and the kettle ticks as it cools.","meters":{"you":50,"them":50},"beats":[{"who":"Maya","text":"\u201cTell me one thing you did this month that you're proud of, and one you aren't. No jokes.\u201d","cue":"pen capped, the sheet still face down","lines":[{"text":"\u201cI said the bins thing out loud to Sam. And I still tidy up after him before you see it, so I'm not finished.\u201d","tag":"best","you":4,"them":3,"outcome":"Maya turns the sheet a quarter turn, then leaves it. \u201cThat's the honest version. I'll take it.\u201d","why":"You name the win and the old habit in one go. Candid means giving both halves, the part you like and the part that stings."},{"text":"\u201cI said the bins thing out loud. The rest is fine.\u201d","tag":"ok","you":1,"them":0,"outcome":"She waits for the rest, and the kettle ticks through the gap.","why":"Half an answer, and \u201cfine\u201d shuts the door on the other half. It is honest as far as it goes, which is not far."},{"text":"\u201cI'm proud of most of it. You've seen the sheet, you'd know.\u201d","tag":"ok","you":-4,"them":-4,"outcome":"Maya says \u201cMm\u201d and uncaps the pen, just to have something to hold.","why":"This asks her record to do the answering for you. You swap a real reply for her approval, and then you are looking for the approval."}]},{"who":"Maya","text":"\u201cSam will find the gas money, won't he? I'd hate to think it's on you if he doesn't.\u201d","cue":"turning the mug, not looking at you","lines":[{"text":"\u201cIt's totally Sam's fault. He never pays on time.\u201d","tag":"ok","you":-5,"them":-6,"outcome":"Maya says \u201cThere it is,\u201d and writes a date in the margin.","why":"You take the blamer's chair and give Sam the villain's. It sounds like agreement, and it locks you both into one story about him."},{"text":"\u201cI hope so. I'll cover the gap if I have to.\u201d","tag":"ok","you":-2,"them":0,"outcome":"She nods, and \u201cif I have to\u201d sits between the mugs.","why":"Kind on the surface. \u201cIf I have to\u201d is a promise to keep rescuing, the saviour's chair in a soft voice."},{"text":"\u201cThat's Sam's to sort. If the gas is late, I'm not covering it.\u201d","tag":"best","you":4,"them":2,"outcome":"Maya's mouth twitches. \u201cGood. Tell him that, not me.\u201d","why":"You leave Sam's share with Sam and turn down the rescue out loud. The bill stays in his lap, where it belongs."}]},{"who":"Maya","text":"\u201cYou make this flat look easy, you know. Some of us find it harder.\u201d","cue":"a smile that stops before her eyes","lines":[{"text":"\u201cThanks. I've had a lot of practice with milk.\u201d","tag":"ok","you":0,"them":1,"outcome":"She laughs once, shortly, and the sheet stays face down.","why":"A polite thank you with a joke on top. No hook in it, and nothing real in it either."},{"text":"\u201cIt isn't easy. I snapped at Sam on Tuesday over a spoon. Is it hard for you too?\u201d","tag":"best","you":3,"them":4,"outcome":"Maya's smile finally reaches her eyes. \u201cMost nights, yes. Thank you for asking.\u201d","why":"You turn down the compliment without a speech, then hand the question back to her as one adult to another."},{"text":"\u201cI think I'm the only one here who really gets how to live with people.\u201d","tag":"ok","you":-6,"them":-6,"outcome":"Maya picks up her mug and looks at the door.","why":"You have taken the praise and turned it into a rank. Now you need someone below you, and that is the old game."}]}],"fallout":{"them":"Maya takes both mugs to the sink, says she has an early shift, and goes before you can answer."}},{"type":"scene","title":"Sunday, 6:10pm, the same table","setting":"The second round of tea has come out and the rota sheet is turned over at last. The balcony door rattles in the wind.","meters":{"you":55,"them":50},"beats":[{"who":"Maya","text":"\u201cHave you heard how Mr Pell talks to you on the phone? You should write to the council. I'm on your side, and so is anyone who's heard him.\u201d","cue":"leaning in, voice dropped to the table","lines":[{"text":"\u201cMaybe. I'll think about the council.\u201d","tag":"ok","you":-2,"them":0,"outcome":"She says \u201cDo,\u201d and her voice goes back to its usual pitch.","why":"You don't join the case, but you don't catch the move either. The almost-game passes by, and so does the chance to name it."},{"text":"\u201cYes, he's a nightmare. Let's write it all down.\u201d","tag":"ok","you":-6,"them":-6,"outcome":"Maya's pen starts moving, and half a page fills with dates.","why":"You take her invitation and add a charge. Now two people hold the file, and the flat will feel it on Monday."},{"text":"\u201cThat sounded like you're on my side against him. I'd rather decide what to do about Mr Pell myself.\u201d","tag":"best","you":4,"them":4,"outcome":"Maya sits back and looks at you for a long moment. \u201cFair. I was about to do the whole thing for you.\u201d","why":"You catch her almost playing saviour on your behalf, and you say so plainly. She can thank you because the move she nearly made would have trapped you both."}]},{"who":"Maya","text":"\u201cYou never ask Sam for the money back out loud, do you? Why's that?\u201d","cue":"head on one side, like she is checking a total","lines":[{"text":"\u201cBecause if I ask, he'll apologise for ten minutes and I'll end up comforting him. I'd rather ask once, with the number, and let him answer.\u201d","tag":"best","you":3,"them":4,"outcome":"Maya nods. \u201cThen ask once. See what he does with a number instead of a sigh.\u201d","why":"You name what asking costs you, then choose the plain ask anyway. A straight request is the way out of waiting."},{"text":"\u201cHe's got a lot on. Let him be.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"Maya says, \u201cIs that what you think, or what he told you?\u201d","why":"A kind excuse. It keeps the wish buried, and it speaks for Sam, which is a small rescue of its own."},{"text":"\u201cBecause he'd make it all about how sorry he is, like always.\u201d","tag":"ok","you":-5,"them":-6,"outcome":"Maya turns her mug a quarter turn on the table.","why":"This makes Sam the one who spoils every ask, so you can stay the patient one. It keeps the asking out of the picture."}]},{"who":"Maya","text":"\u201cLast one, and then the tea's cold. What will you stop doing this week, and who will you tell?\u201d","cue":"pen in her hand now","lines":[{"text":"\u201cNothing, really. Who would I tell? Nobody in this flat listens.\u201d","tag":"ok","you":-6,"them":-7,"outcome":"Maya caps the pen without writing anything.","why":"This is the old routine in two lines: a verdict on everyone else, and no one to tell. It leaves the week exactly as it was."},{"text":"\u201cI'll stop covering Sam's bin week, and I'll tell him on Friday, out loud, with the date on the sheet.\u201d","tag":"best","you":4,"them":4,"outcome":"Maya writes it down. \u201cFriday. I'll make sure the sheet is on the fridge.\u201d","why":"You stop the rescue and name the person and the day. Letting him feel the cost is the way out for someone who keeps saving."},{"text":"\u201cI'll drop the file on Mr Pell, and I'll ring him myself on Monday and ask for a date for the damp.\u201d","tag":"best","you":4,"them":4,"outcome":"Maya nods slowly. \u201cMonday. Ring him from the balcony, the signal's better.\u201d","why":"You let go of the case and take the talk to the one person it concerns. That is the way out for someone who keeps blaming."},{"text":"\u201cI'll ask you to swap bin weeks, straight out, and I won't wait for you to offer.\u201d","tag":"best","you":4,"them":4,"outcome":"Maya smiles properly, for the first time all evening. \u201cThen I'll say yes or no. Either way you'll know.\u201d","why":"You stop waiting to be offered and you ask. That is the way out for someone who keeps suffering, and it turns the wait into a request."}]}],"fallout":{"them":"Maya stands, says the next rota meeting is Sunday at six, and goes to run the bath before you can answer."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two to read back. Name the chair in the first, and say what Berne's last chapter makes of the wobble in the second.","items":[{"type":"pick","who":"Maya","text":"\u201cHave you heard how Mr Pell talks to you? I'm on your side here.\u201d","cue":"Which explanation fits?","options":["Plain concern and nothing more. She heard the phone call, she wants you looked after in your own flat, and there is no hook anywhere in it.","A saviour's move for you and a blamer's move against Mr Pell. It asks you to sign the case, and people swap seats on Karpman's triangle.","A test of your temper, to see whether you will get upset. She only wants to know if you can be pushed, so the line holds no trap at all."],"answer":1,"why":"She offered to rescue you by going after Mr Pell. The saviour's chair and the blamer's chair are both in the line, and the swap between them is the trap. Steiner's rescue triangle, taken from Karpman's drama triangle, is these seats with people moving between them.","traps":{"0":"Plain concern. It sounds caring, and she may mean part of it. But the line asks you to join a case against him, and that is the trap whatever her heart is doing.","2":"A test of your temper. It is a reasonable guess, but the line has a clear hook: a case and a rescue, with you as the one who signs."},"example":"Residents' meeting, Sunday, 6:30pm.<br>Neighbour: \u201cThe caretaker's been useless. I'm on your side, just say it.\u201d<br>You: \u201cI'll talk to the caretaker myself, thanks.\u201d"},{"type":"pick","who":"You","text":"You carry the mugs to the sink. Saying true things out loud felt risky, and a small voice says the old chairs were safer.","cue":"What does Berne's last chapter say about that?","options":["Awareness, spontaneity and intimacy can feel risky to someone unprepared. His hope is for people who get ready, so a wobble is normal.","Life after games is easy once you know the moves, so the wobble means you did something wrong tonight and should go back to the old chairs.","Once enough flatmates drop their games, everyone else will follow, so the wobble will pass by itself in a week or two without any effort from you."],"answer":0,"why":"Berne ends the book by saying that some people can rise above the bleak picture of life as a wait filled with pastimes and games. He also warns that the way out can be frightening and even risky for the unprepared. His hope rests with individuals, not with the human race as a whole.","traps":{"1":"Easy once you know the moves. It would be comforting, but Berne says the opposite: the way past games can be frightening, so a wobble is no sign of a mistake.","2":"Everyone else will follow. Berne is not that hopeful. He doubts the human race as a whole will change, and puts his hope in individual people."},"example":"Climbing wall, Saturday, 11:00am.<br>Beginner: \u201cMy legs are shaking, so I must be doing it wrong.\u201d<br>Instructor: \u201cFirst time on the high wall? Shaking means it's new. Rest a minute, then go on.\u201d"}]}]},{"setting":"School & College","blurb":"Helen waits in the library after class, with Sam's unfinished page due on Friday.","opener":{"setting":"Thursday, 8:50pm, the library, second floor. Class finished at eight. Sam has gone for the last bus with page four still empty. Helen has two cups of machine coffee and the feedback sheet face down.","lines":[{"who":"Helen","text":"\u201cSit. I got you the one that tastes less of soup.\u201d","cue":"sliding a paper cup across the table, not smiling yet"},{"who":"Helen","text":"\u201cPage four is blank, by the way. I'm not counting. It's one page.\u201d","cue":"squaring the stapler against the table edge"}],"ask":"Can you keep this conversation real for six turns, without rescuing anyone or blaming them?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Her lines can hook you. Tap what each one is doing, and listen for the one with no hook in it.","items":[{"type":"pick","who":"Helen","text":"\u201cYou're the only one in this group who actually reads the brief, you know.\u201d","cue":"tapping the face-down feedback sheet","options":["A joke about how long the brief runs on","A plain thank you for reading it so closely","A hook: flattery to make you her ally"],"answer":2,"why":"She praises you in a way that lowers the others. If you take it, you become the one who does the reading, and the group splits into readers and the rest.","traps":{"0":"A joke about the brief. It is light, but it laughs along and leaves the praise sitting where she put it.","1":"A plain thank you. It feels polite, and it accepts the seat she is offering, with Sam in the other one."},"example":"Pub quiz, Wednesday.<br>Captain: \u201cYou're the only one who reads the questions properly. The others just shout.\u201d<br>You: \u201cThey get the right answer sometimes. Who's got the pen?\u201d"},{"type":"pick","who":"Helen","text":"\u201cSam will do page four tonight, won't he? I'd hate for it to land on you again.\u201d","cue":"straightening the stapler on the table","options":["A real question about how Sam's week has been","A hook: she is handing you his page","A plain answer about when the poster is due"],"answer":1,"why":"Her question hands you Sam's page before he has said a word about it. If you answer, you take the saviour's chair for someone who caught the last bus home.","traps":{"0":"A real question about Sam. It sounds kind, but it asks you to guess at his week, and the guess is the first step to doing his page.","2":"A plain answer about the deadline. It sounds practical, and it accepts her frame that his page is yours to worry about."},"example":"Netball club, Thursday.<br>Captain: \u201cJo will bring the bibs, won't she? Awful if you had to.\u201d<br>You: \u201cJo's bringing them. Ask Jo.\u201d"},{"type":"pick","who":"Helen","text":"\u201cMr Dawson's feedback this term has been unbearable. Anyone would have dropped the course by now, wouldn't they?\u201d","cue":"a long breath out through her nose","options":["Joining in: the blamer's chair","A plain feeling you can name about the marks","A question about his office hours"],"answer":0,"why":"She wants you to agree and add a charge, so the case against Mr Dawson grows. That is the blamer's chair, and a harsh feedback sheet makes it comfortable.","traps":{"1":"A plain feeling about the marks. It is honest, but this line asks for a verdict on Mr Dawson, and a feeling is not a verdict.","2":"A question about his office hours. It sounds like a way out, but the talk comes back to Mr Dawson before the cups are empty."},"example":"Canteen queue, Friday.<br>Student: \u201cThe lecturer's hopeless. Everybody thinks so, don't they?\u201d<br>You: \u201cI got one good lecture out of him. Did you try the soup?\u201d"},{"type":"pick","who":"Helen","text":"\u201cI'm not fishing, and I'm not going to fix anything. I'd like to hear how the course actually went for you.\u201d","cue":"looking straight at you over the cup","options":["A hook: she wants you to lean on her","A plain question with no game in it","Small talk to fill the time before the last bus"],"answer":1,"why":"She says what she wants and leaves the answer to you. There is nothing to flatter, no rescue on offer and no one to blame. This is a conversation once the traps are gone.","traps":{"0":"A hook that wants you to lean on her. She has said she will fix nothing, so there is nothing to lean against.","2":"Small talk before the bus. It is friendly, but small talk would not ask for the real answer, and she is asking for it."},"example":"Allotment gate, Sunday.<br>Neighbour: \u201cI won't tell you what to plant. What did you try this year?\u201d<br>You: \u201cBeans. They did nothing.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two short conversations, three turns each. She leaves doors open. Some lead somewhere useful, and some lead back to the old chairs.","items":[{"type":"scene","title":"Thursday, 8:50pm, the study table","setting":"The library, second floor. The vending machine hums, a stapler sits between the two cups, and the feedback sheet is face down.","meters":{"you":50,"them":50},"beats":[{"who":"Helen","text":"\u201cTell me one thing you did on this course that you're proud of, and one you aren't. No jokes.\u201d","cue":"stapler in her hand, the sheet still face down","lines":[{"text":"\u201cI'm proud of most of it. You were in the group, you saw.\u201d","tag":"ok","you":-4,"them":-4,"outcome":"Helen says \u201cMm\u201d and clicks the stapler twice.","why":"This leans on her memory to do your answering. You trade a real reply for her approval, and then you are waiting for it."},{"text":"\u201cThe mock presentation, and I'm not sure about the rest.\u201d","tag":"ok","you":1,"them":1,"outcome":"She waits for the rest. A trolley squeaks somewhere between the shelves.","why":"Half an answer. You gave one side, and the quiet after it is where the test is."},{"text":"\u201cStanding up in the mock presentation. And I still rewrite other people's slides at midnight and tell nobody, so I'm not finished.\u201d","tag":"best","you":4,"them":3,"outcome":"Helen puts the stapler down. \u201cRight. That's the one. Keep it.\u201d","why":"You name the win and the old habit together. Candid means both halves, the one you like and the one that stings."}]},{"who":"Helen","text":"\u201cSam will do page four tonight, won't he? I'd hate to think it's on you if he doesn't.\u201d","cue":"cup halfway to her mouth, not looking at you","lines":[{"text":"\u201cThat's Sam's page. If it's late, I'm not writing it for him.\u201d","tag":"best","you":4,"them":2,"outcome":"Helen breathes out through her nose. \u201cGood. Tell him that, not me.\u201d","why":"You leave the page with its owner and turn the rescue down out loud. It stays his problem, and he can feel it."},{"text":"\u201cI hope so. I'll look over page four if he's stuck.\u201d","tag":"ok","you":-2,"them":0,"outcome":"She nods, and \u201clook over\u201d sits on the table like a promise.","why":"It sounds generous. \u201cLook over\u201d turns into \u201cwrite\u201d by Thursday night, and that is the saviour's chair in a soft voice."},{"text":"\u201cIt's all Sam's fault. He always leaves it to the last night.\u201d","tag":"ok","you":-5,"them":-6,"outcome":"Helen says \u201cWell,\u201d and sips the coffee she did not want.","why":"You take the blamer's chair and give Sam the villain's. It feels like agreement, and it locks you both into a story about him."}]},{"who":"Helen","text":"\u201cYou make this course look easy, you know. Some of us are drowning.\u201d","cue":"a smile that does not hold","lines":[{"text":"\u201cI think I'm the only one here who's got the hang of studying.\u201d","tag":"ok","you":-6,"them":-6,"outcome":"Helen picks up her cup and checks the clock on the wall.","why":"You accepted the praise and made it a rank. Now you need someone below you, and that is the old game."},{"text":"\u201cThanks. I've had a lot of coffee.\u201d","tag":"ok","you":0,"them":1,"outcome":"She laughs once, and the sheet stays face down.","why":"A polite thank you with a joke on top. No hook in it, and nothing real either."},{"text":"\u201cIt isn't easy. I cried over the reading list on Sunday. How bad is it for you?\u201d","tag":"best","you":3,"them":4,"outcome":"Helen's smile holds this time. \u201cBad on Tuesdays. Thank you for asking.\u201d","why":"You turn down the compliment without a fuss, then hand the question back to her as one adult to another."}]}],"fallout":{"them":"Helen gathers her cups, says her bus goes in six minutes, and leaves before you can answer."}},{"type":"scene","title":"Thursday, 9:20pm, the same table","setting":"The library is nearly empty. Helen has turned the feedback sheet over at last, and a cleaner's trolley rattles past the shelves.","meters":{"you":55,"them":50},"beats":[{"who":"Helen","text":"\u201cHave you read what Mr Dawson wrote on your poster? You should go to the head of department. I'm on your side, and so is everyone who's had him.\u201d","cue":"leaning across the table, voice low","lines":[{"text":"\u201cThat sounded like you're on my side against him. I'd rather decide what to do about Mr Dawson myself.\u201d","tag":"best","you":4,"them":4,"outcome":"Helen sits back. \u201cFair. I was about to write the whole email for you.\u201d","why":"You catch her almost playing saviour on your behalf and you say so plainly. She can thank you because the move would have trapped you both."},{"text":"\u201cMaybe. I'll think about the head of department.\u201d","tag":"ok","you":-2,"them":0,"outcome":"She says \u201cDo,\u201d and her voice drops back to normal.","why":"You don't join the case, and you don't catch the move either. The almost-game passes by with its lesson."},{"text":"\u201cYes, he's useless. Let's put it in an email.\u201d","tag":"ok","you":-6,"them":-6,"outcome":"Helen opens her laptop and starts on a subject line.","why":"You take her invitation and add a charge. Now two people have a case, and the class will feel it next week."}]},{"who":"Helen","text":"\u201cYou never ask Tom for his notes from the week you missed, do you? Why's that?\u201d","cue":"head tilted, reading your face","lines":[{"text":"\u201cHe's busy with his own deadline. Leave him.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"Helen says, \u201cIs that what you think, or what he said?\u201d","why":"A kind excuse. It keeps the want buried, and it speaks for Tom, which is a small rescue of its own."},{"text":"\u201cBecause he'd lecture me about why I missed it, like always.\u201d","tag":"ok","you":-5,"them":-6,"outcome":"Helen turns her cup a quarter turn on the table.","why":"This makes Tom the one who spoils every ask, so you can stay the patient one. Asking drops out of the picture."},{"text":"\u201cBecause if I ask, he'll say yes and remind me for a month. I'd rather ask him straight tomorrow, and thank him once.\u201d","tag":"best","you":3,"them":4,"outcome":"Helen nods. \u201cThen ask. See what he does with a straight question.\u201d","why":"You name what asking costs you, then choose the plain request anyway. That is the way out of waiting to be offered."}]},{"who":"Helen","text":"\u201cLast one, and then they lock up. What will you stop doing this week, and who will you tell?\u201d","cue":"bag already on her shoulder","lines":[{"text":"\u201cI'll stop rewriting Sam's slides, and I'll tell him before class tomorrow, out loud, with the page number.\u201d","tag":"best","you":4,"them":4,"outcome":"Helen writes it on the back of her hand. \u201cBefore class. I'll ask you on Friday.\u201d","why":"You stop the rescue and name the person and the moment. Letting him feel the cost is the way out for someone who keeps saving."},{"text":"\u201cNothing, really. Who would I tell? It's all down to the marking anyway.\u201d","tag":"ok","you":-6,"them":-7,"outcome":"Helen zips her bag without a word.","why":"A verdict on the marking, and nobody told. It keeps the week exactly as it was."},{"text":"\u201cI'll drop the case against Mr Dawson, and I'll take the feedback sheet to his office hour on Monday and ask what he means.\u201d","tag":"best","you":4,"them":4,"outcome":"Helen nods slowly. \u201cMonday. Take a pen, not the email.\u201d","why":"You let go of the case and take the question to the one person it concerns. That is the way out for someone who keeps blaming."},{"text":"\u201cI'll ask you to check my reference list, straight out, and I won't wait for you to offer.\u201d","tag":"best","you":4,"them":4,"outcome":"Helen smiles, properly. \u201cSend it tonight. I'll say if it's too much.\u201d","why":"You stop waiting to be offered and you ask. That is the way out for someone who keeps suffering, and it turns the wait into a request."}]}],"fallout":{"them":"Helen shoulders her bag, says the library shuts in five minutes, and goes before you can answer."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two to read back. Name the chair in the first, and say what Berne's last chapter makes of the wobble in the second.","items":[{"type":"pick","who":"Helen","text":"\u201cHave you read what Mr Dawson wrote on your poster? I'm on your side here.\u201d","cue":"Which explanation fits?","options":["A saviour's move for you and a blamer's move against Mr Dawson. It asks you to sign the case, and the seats swap fast.","Sincere concern and nothing more. She read the sheet over your shoulder, she wants you looked after, and there is no hook anywhere in the line.","A test of your nerve, to see whether you will lose your temper. She only wants to know if you can be pushed, so the line holds no trap."],"answer":0,"why":"She offered to rescue you by going after Mr Dawson. The saviour's chair and the blamer's chair are both in the line, and the swap is the trap. Steiner's rescue triangle, from Karpman's drama triangle, is these seats with people moving between them.","traps":{"1":"Sincere concern. It sounds warm, and she may mean some of it. But the line asks you to join a case against him, and that is the trap whatever she feels.","2":"A test of your nerve. It is a fair guess, but the line has a clear hook: a case and a rescue, with you as the one who signs."},"example":"Committee room, Tuesday, 7:30pm.<br>Member: \u201cThe chairman's impossible. I'm on your side, just say it.\u201d<br>You: \u201cI'll speak to the chairman myself, thanks.\u201d"},{"type":"pick","who":"You","text":"Walking to the bus stop your hand
