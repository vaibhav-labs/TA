<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Halves of a Pair · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"5.5","setting":"Home & Flatmates","title":"Two Halves of a Pair","world":5,"worldName":"Under the Surface","week":5,"weekName":"Under the Surface","mechanic":"Choice-story","concept":"After this one you can see two people who share the three voices between them, and find the move that gives each of them all three.","plainWord":"two people sharing three voices","bookTerm":"Symbiosis","bookIdea":"A symbiosis is a relationship in which one person acts the Parent and the Adult while the other acts the Child, so between them they use only three of the six ego states.","bookSource":"TA Today, ch. 1 and 20","opener":{"setting":"Saturday, 7:40am. Hawthorn Court, apartment 3B, the kitchen. The fridge has a sheet on it in Maya's handwriting, and she has just come off a night shift.","lines":[{"who":"Maya","text":"\u201cSam, the sheet says you still owe the gas. I've checked it twice.\u201d","cue":"still in her ward shoes, not sitting down"},{"who":"Sam","text":"\u201cI know, I know. I'm hopeless. You still love me, right?\u201d","cue":"grinning at the fridge, already reaching for the biscuits"}],"ask":"Which of them plays the Boss and the Pilot, which of them plays the Kid, and what move would give each of them all three voices?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line here comes from one of the three voices: the Boss, the Pilot or the Kid. Tap the voice that is talking, and then the picture of the pair.","items":[{"type":"pick","who":"Maya","text":"<i>She reads the week's jobs off the fridge sheet, one finger on each line, and does not look up. \u201cBins out Thursday. Gas by Friday. Don't argue, just do it.\u201d<\/i>","cue":"Saturday, 7:45am, the fridge door","options":["the Boss","the Pilot","the Kid"],"answer":0,"why":"\u201cDon't argue, just do it\u201d is an order with no reasons and no room for a reply. That is the Boss, the voice that learned how a flat should run. The Pilot would give the facts and leave the choice open.","traps":{"1":"The Pilot deals with what is in front of you, and the bins and the gas are that kind of fact. But the Pilot would not say \u201cdon't argue,\u201d so the words here are more than facts.","2":"The Kid would whine or plead, something like \u201cOh, do I have to?\u201d Maya is not asking for anything, so the Kid is not talking in this line."},"example":"A school gate, Monday, 8:10am.<br>Mum: \u201cBag on your back. No dawdling. Don't argue.\u201d<br>Son: \u201cOkay.\u201d He stops talking and walks to the gate with his eyes on the ground."},{"type":"pick","who":"Sam","text":"<i>He holds up the empty milk carton and grins. \u201cSorry, sorry, I know, I'm hopeless. You love me anyway.\u201d He reaches for the biscuit tin before anyone can answer.<\/i>","cue":"Saturday, 7:52am, the counter","options":["the Boss","the Pilot","the Kid"],"answer":2,"why":"The apology is charming, and it is also a way of collecting a warm nod without making a plan. \u201cI'm hopeless\u201d asks to be rescued, and the biscuit tin shows the wish is for comfort. That is the Kid, the part that wants a nod and asks for it.","traps":{"0":"The Boss would be stern, something like \u201cPay it back today.\u201d Sam is grinning and pleading, not giving orders, so the Boss is not the voice here.","1":"The Pilot would say what is owed and when it will be paid. Sam never mentions a date, and that missing date is the clue."},"example":"A cricket net, Saturday.<br>Player: \u201cSorry, sorry, I dropped the catch again. You love me, right?\u201d<br>Coach: \u201cFine. Go and get the ball, you clown.\u201d"},{"type":"pick","who":"Apartment 3B","text":"<i>Maya keeps the sheet, counts every bill and tells Sam what to do. Sam keeps the jokes and the apologies, and waits to be told. The flat runs, and it runs on those two jobs only.<\/i>","cue":"Wednesday, 9:40pm, apartment 3B, the kitchen","options":["One plays the Boss and the Pilot, the other plays the Kid","A shared plan, with both of them checking the sheet","Two people who simply dislike chores"],"answer":0,"why":"Maya gives the orders and does the sums, which are the Boss and the Pilot. Sam supplies the sorry and the charm, which is the Kid. Between them the flat uses three voices where two people could have six. That is the two halves pattern, and it stays stuck while each one keeps to their side.","traps":{"1":"A shared plan would show both of them on the sheet. Here the sheet belongs to Maya alone, and Sam never opens it, so it only looks shared from across the room.","2":"Dislike of chores would be a feeling about the bins and the dishes. The clip is about how the two of them fit together, not about what they think of the work."},"example":"A band with two players, Friday.<br>Drummer: \u201cI've got the setlist and the van, and I'll tell you when to start. You just sing and keep everyone laughing.\u201d<br>Singer: \u201cDeal. And I'll forget the setlist, as usual.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes in the same flat. Maya plays the Boss and the Pilot, and Sam plays the Kid. Find the line that gives each of them a voice they have been leaving unused, and watch what the words do to the meters.","items":[{"type":"scene","title":"Monday, 22:30, the kitchen","setting":"Hawthorn Court, apartment 3B. The sheet is on the fridge door in Maya's writing, and the light over the cooker is the only light on.","meters":{"you":50,"them":50},"beats":[{"who":"Sam","text":"\u201cSorry, sorry, I know. The rent's late again, and I'm the milk man of the month. I'll sort it, I promise.\u201d","cue":"still in his work shirt, the milk carton in one hand","lines":[{"text":"\u201cTell me the day, Sam, not the promise. Friday, or Saturday?\u201d","tag":"best","you":4,"them":2,"outcome":"He stops grinning for a second. \u201cFriday. Put it on the sheet.\u201d","why":"You ask for a date instead of accepting a sorry. A date is the Pilot's job, and Sam usually leaves the Pilot to Maya."},{"text":"\u201cIt's fine. Maya's already done the sheet.\u201d","tag":"ok","you":-1,"them":1,"outcome":"He laughs, relieved. Then he goes to find the biscuits.","why":"It is kind, and it keeps the pattern as it is. Maya does the sheet, Sam does the sorry, and nobody has to plan anything."},{"text":"\u201cYou always say sorry and then nothing happens. We all know how this goes.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Sam puts the carton down, says \u201cRight. Fine,\u201d and goes to his room.","why":"You pick a side and hand Sam all of the blame. His warmth goes cold, and the sulk is all he has left to hold."}]},{"who":"Maya","text":"\u201cIt's fine. I've done the sheet. Sam, you're down for the gas, and four hundred for the milk.\u201d","cue":"standing at the counter in her scrubs, not sitting down","lines":[{"text":"\u201cMaya, sit down first. Then show me the sheet, and we'll check the numbers together.\u201d","tag":"best","you":4,"them":4,"outcome":"She hesitates, then pulls out a stool and sits with the sheet on her knee. \u201cFine. Check it, then.\u201d","why":"You ask her to sit, which gives her the Kid's turn at being looked after, and you share the sums so the Pilot's job is no longer hers alone."},{"text":"\u201cThanks. Send me my share and I'll check it.\u201d","tag":"ok","you":0,"them":1,"outcome":"She nods and goes back to the cooker, the sheet still in her hand.","why":"It is polite and fair, but it leaves her on her feet doing the work alone. The pattern holds."},{"text":"\u201cYou're the only one who ever gets things done in this flat. I'd be lost without you.\u201d","tag":"game","you":-5,"them":3,"outcome":"The scene stops there. Maya says \u201cSure, I'll keep doing it,\u201d and turns back to the cooker.","why":"Praise like this ties her down. It makes the sheet hers and the applause yours, so she keeps the Boss's job and you keep the job of being impressed."}]},{"who":"Sam","text":"\u201cYou're amazing, Maya. I don't know what we'd do without you.\u201d","cue":"leaning on the fridge, grinning","lines":[{"text":"\u201cThen pay her on Friday, and she won't have to chase you for it.\u201d","tag":"best","you":4,"them":2,"outcome":"The grin slips, then comes back smaller. \u201cFriday. Yes. Okay.\u201d","why":"You turn the praise into a plan. Praise with no date is a nod for being, and this one needs a Friday to count for anything."},{"text":"\u201cNo worries. It's what we do.\u201d","tag":"ok","you":-1,"them":1,"outcome":"They both laugh, and the sheet stays exactly where it is.","why":"It sounds friendly, but it agrees that the pattern is normal. The praise is taken, and the sheet stays with Maya."},{"text":"\u201cThen stop being late and she won't have to do the sheet at all.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Sam looks at the floor, Maya says \u201cDon't, please,\u201d and the room goes quiet.","why":"You blame Sam for both the lateness and the work, which splits the flat into two sides. It sounds fair, and it keeps everyone in the same seats."}]},{"who":"Maya","text":"\u201cPlease don't make it a whole thing. I'm fine.\u201d","cue":"rubbing her eyes with the heel of one hand","lines":[{"text":"\u201cYou're not fine if you're on your feet at ten at night. Sit, I'll make the tea, and we'll do the sheet after.\u201d","tag":"best","you":4,"them":3,"outcome":"She sits. \u201cOkay. Two sugars, and no sheet tonight.\u201d","why":"You name the real feeling, which is tiredness, and you ask her to take a turn at being looked after. That is the Kid's voice, and she is allowed to use it."},{"text":"\u201cOK. Goodnight, then. See you in the morning.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"She says \u201cNight,\u201d and the sheet stays on the counter.","why":"A polite goodnight does no harm, but it leaves her on her feet with the sheet still undone."},{"text":"\u201cFine. You're always fine, aren't you? Nothing ever gets to you.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Maya puts the sheet in her pocket and goes to her room.","why":"This is a hook with a joke on the outside. It makes her steadiness the thing to prove, so she has to keep being the one who holds everything."}]},{"who":"Sam","text":"\u201cShall I take the bins on Thursdays? I'll put it in my phone. I promise I will.\u201d","cue":"already holding his phone, thumb over the calendar","lines":[{"text":"\u201cYes. Put it in the shared calendar, and tell Maya when it's done, not when she asks.\u201d","tag":"best","you":4,"them":4,"outcome":"He types it in and grins. \u201cThursday, bins. I'll tell her when it's done.\u201d","why":"You give Sam a plan he owns, and a report to make, so the planning starts to be his as well. That is the Pilot's job, which he usually hands away."},{"text":"\u201cSure. Thanks.\u201d","tag":"ok","you":0,"them":2,"outcome":"He pockets the phone. The bins will be done when someone else remembers them.","why":"You accept the offer but never ask for a plan, so it stays a feeling. Sure is polite, and the calendar stays empty."},{"text":"\u201cDon't bother. You'll forget, and then it'll be on me again.\u201d","tag":"game","you":-6,"them":-6,"outcome":"The scene stops there. Sam puts the phone away and says nothing at all.","why":"This is blame again, and it tells him his offer does not count. He will stop offering, and the planning falls back on Maya."}]}],"payoff":"Monday, 22:50. The milk is still on the counter, and the sheet on the fridge has not been checked.","fallout":{"them":"Sam stops saying sorry in the flat for the rest of the week, and he does not offer anything else either."}},{"type":"scene","title":"Saturday, 7:40am, the kitchen","setting":"Apartment 3B. Maya has come off a night shift, and the shopping list is on the table in her handwriting. Sam has his tote bag over one shoulder.","meters":{"you":50,"them":50},"beats":[{"who":"Sam","text":"\u201cShopping! Leave it to me. I'll get the good cheese and the mangoes. No list needed.\u201d","cue":"already at the door with the tote bag over one shoulder","lines":[{"text":"\u201cDo the list first, read it back to Maya, and then go for the mangoes.\u201d","tag":"best","you":4,"them":2,"outcome":"He pulls out his phone and types. \u201cCheese, rice, mangoes last. Got it.\u201d","why":"You turn his charm into a plan he reads back out loud, so he uses his Pilot as well as his warmth."},{"text":"\u201cNice one. Have fun. Bring back something sweet.\u201d","tag":"ok","you":0,"them":2,"outcome":"He grins and waves the tote bag. \u201cMangoes it is.\u201d","why":"This is pleasant, but it gives Sam the fun part of the errand and leaves the list with Maya, who has been up all night."},{"text":"\u201cLast time you came back with three tubs of ice cream and no rice. Don't do it again.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Sam says \u201cRight, of course,\u201d and goes out without the bag.","why":"Teasing him back into the Kid's corner shuts him out of the plan. The list stays on the table, unread."}]},{"who":"Maya","text":"\u201cI've written the list. Don't change it, it's already been checked twice.\u201d","cue":"sitting at the table with a cup of tea she has not touched","lines":[{"text":"\u201cRead it to me, and tell me which bit you'd like to hand over. The mangoes, maybe?\u201d","tag":"best","you":4,"them":4,"outcome":"She looks up, surprised. \u201cThe mangoes. Yes. Okay.\u201d She hands him the pen.","why":"You ask her to choose what to give away, instead of carrying the whole list alone. Giving a piece away lets her sit still while someone else does a bit of the Pilot's work."},{"text":"\u201cOK, I'll stick to it exactly.\u201d","tag":"ok","you":-1,"them":1,"outcome":"She nods, and the list stays where it is, all in her handwriting.","why":"Sticking to the list is fair, but it leaves the list with her and gives her no turn at being looked after."},{"text":"\u201cIt's your list, so if it's wrong, that's your fault and not mine.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Maya looks at the list, then at the door, and says nothing.","why":"This is blame, and it moves her from planning into a fight about the list. Now the list is the thing they argue about, and nothing gets bought."}]},{"who":"Sam","text":"\u201cI'll cook dinner as well. Lentils, or that potato one you like.\u201d","cue":"bag back on his shoulder, already thinking about dinner","lines":[{"text":"\u201cLentils, and you own the rice timing, because you're better at it. Set a timer, and tell her when it's on.\u201d","tag":"best","you":4,"them":3,"outcome":"He nods, pleased to be trusted with something specific. \u201cTimer. Got it.\u201d","why":"You give him a job with a clear end. He keeps his warmth and takes on the planning part of dinner."},{"text":"\u201cLovely. Surprise us.\u201d","tag":"ok","you":0,"them":2,"outcome":"He grins. \u201cSurprise, I can do that.\u201d","why":"This is warm and light. But a surprise dinner is a feeling with no plan, so Maya will still be checking the pot later."},{"text":"\u201cYou'll burn it like last time, so I'll cook it instead.\u201d","tag":"game","you":-4,"them":-4,"outcome":"The scene stops there. Sam's grin drops. \u201cFine. You do it, then.\u201d","why":"You take the job from him before he has started. It looks like a rescue, and it keeps him in the Kid's corner for good."}]},{"who":"Maya","text":"\u201cI can't do the rest of the week like this. I'm so tired I can't tell what I'm saying.\u201d","cue":"head against the cupboard door, eyes shut","lines":[{"text":"\u201cThat's true, and it's a lot. What would make Wednesday lighter, and who could take part of it?\u201d","tag":"best","you":4,"them":4,"outcome":"She opens her eyes. \u201cWednesday's the bins and the laundry. Sam could do the bins.\u201d","why":"You take her tiredness as real information and ask for a plan. She can be frank about the load, and the load gets a second pair of hands."},{"text":"\u201cDon't worry, we'll sort it. Go to bed.\u201d","tag":"ok","you":-2,"them":1,"outcome":"She says \u201cWe won't, we never do,\u201d and goes to her room.","why":"This sounds like kindness, but it is a promise nobody makes. It takes the load off her for a minute and leaves the week as it was."},{"text":"\u201cYou always say you're tired. Make a plan or stop complaining.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Maya says \u201cFine,\u201d and the tiredness goes back inside her.","why":"This is the Boss voice, and it shames the feeling without giving her a job. She goes back to carrying everything alone."}]},{"who":"Sam","text":"\u201cI'll do the bins on Wednesday, and I'll put the rent sheet on the fridge with my name on it.\u201d","cue":"a little more serious now, the tote bag on the floor","lines":[{"text":"\u201cGood. Write both on the sheet, and say them to Maya before you go out.\u201d","tag":"best","you":4,"them":4,"outcome":"He writes it on the sheet. \u201cBins Wednesday, rent sheet, my name. Done.\u201d","why":"You make his plan visible and have him say it out loud, so both of them can see it. Sam starts to use a voice he usually leaves to Maya."},{"text":"\u201cBrilliant, you're a legend. Thank you.\u201d","tag":"ok","you":0,"them":3,"outcome":"He beams, and the plan goes back into a feeling.","why":"Praise is a warm nod, but it lands on the feeling and skips the plan. Nothing gets written down."},{"text":"\u201cDon't promise. You never do it.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Sam picks up his bag and leaves, and the sheet stays blank.","why":"Calling it a promise you never keep sends him back to the Kid's corner, and it makes the plan something to doubt before it starts."}]}],"payoff":"Saturday, 8:20am. The list stays on the table, and the shopping turns into a rushed trip to the corner shop.","fallout":{"you":"Maya takes the list to her room and does the shopping herself, alone, in a hurry."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. You can use the book words now.","items":[{"type":"pick","who":"Nadia","text":"\u201cMaya keeps the sheet and gives the orders, and Sam keeps the jokes and waits to be told. Which word do the books use for a relationship where one person plays the Parent and the Adult and the other plays the Child?\u201d","cue":"turning her cup, one eyebrow up","options":["Symbiosis","Racket","Passivity"],"answer":0,"why":"Maya plays the Parent and the Adult, with the orders and the sums, and Sam plays the Child, with the sorry and the charm. Between them they use three of the six ego states. The books call that pattern a symbiosis.","traps":{"1":"A racket is a stand-in feeling, something shown because the real one was not allowed. Sam's apologies might look like that, but the question is about the fit between two people, not about one feeling.","2":"Passivity describes one person's way of dodging a problem. Both of them act all the time, and the question asks how the two of them fit together."},"example":"A school trip, Friday.<br>Teacher: \u201cI've got the register and the bus times. You just smile at the parents.\u201d<br>Helper: \u201cFine, I'll smile. Don't ask me about the bus.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cWhat move would give both of them all three voices, the Boss, the Pilot and the Kid?\u201d","cue":"pen in hand, waiting","options":["Give Maya a turn at being looked after, and give Sam one piece of the planning with a clear hand-off.","Take over the sheet yourself, so neither of them has to think about it any more.","Tell Sam to stop apologising, since the apologies are wearing everyone out."],"answer":0,"why":"Both of them are using only part of what they have. Maya gets a turn in the Kid's chair, and Sam gets a piece of the Pilot's work with a clear end. That loosens the symbiosis from both ends without cutting anyone out of the flat.","traps":{"1":"Taking over the sheet makes you the new Boss and Pilot, and the pair gets a third person to lean on. It feels helpful, but now the symbiosis includes you and nobody has taken up a new voice.","2":"Telling Sam to stop apologising cuts off his Kid without giving him a plan. It looks like a fix, and it leaves Maya with the whole sheet."},"example":"A housing society meeting, Sunday.<br>Neighbour A: \u201cI'll write the minutes, and you do the chairs and the tea, as always.\u201d<br>Neighbour B: \u201cFine. You write, and one of us can sit down for a change. Me first.\u201d"}]}],"debrief":{"nadia":"Two people in one flat, and a sheet on the fridge that only one of them ever looked at. Maya played the Boss and the Pilot and Sam played the Kid, so the flat used three voices where six were on offer. Give each of them a job from the voices they have been leaving to the other.","bookTerm":"Symbiosis","bookNote":"The books call this symbiosis: a relationship in which one person acts the Parent and the Adult and the other acts the Child, so that between them they use only three of the six ego states."},"reflection":{"prompt":"In which relationship of yours does one person give the orders and do the sums while the other is looked after, and which one job could you take back this week?"},"next":"5.6","baseStory":{"setting":"Home & Flatmates","blurb":"Maya runs the flat from a fridge sheet while Sam apologises and waits; the gas bill is overdue."},"moreStories":[{"setting":"Family","blurb":"Mum runs the paperwork and Dad says ask your mother, with Gran's bus pass form due Tuesday.","opener":{"setting":"Sunday, 1:15pm. Gran's flat downstairs at Hawthorn Court, the kitchen. A brown envelope sits by the teapot, and the lunch is going cold.","lines":[{"who":"Mum","text":"\u201cThe bus pass renewal is due Tuesday. I've filled in every box, so all your father has to do is sign it.\u201d","cue":"pen uncapped, held out like a ticket"},{"who":"Dad","text":"\u201cAsk your mother. Whatever she says is right. I'd only get it wrong.\u201d","cue":"buttering bread he does not want, eyes on the plate"}],"ask":"Which of them plays the Boss and the Pilot, which of them plays the Kid, and what move would give each of them all three voices?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line here comes from one of the three voices: the Boss, the Pilot or the Kid. Tap the voice that is talking, and then the picture of the pair.","items":[{"type":"pick","who":"Mum","text":"<i>She slides the form across the table, a tick already in every box. \u201cSign there, and there. Don't read it, you'll only slow us down. Just do as it says.\u201d<\/i>","cue":"Sunday, 1:20pm, Gran's table","options":["the Boss","the Pilot","the Kid"],"answer":0,"why":"\u201cJust do as it says\u201d is an order with no reasons and no room for a reply. That is the Boss, the voice that learned how a household should be run. The Pilot would say what the form is for and when it is due.","traps":{"1":"The Pilot deals in plain facts, and a due date is one. But the Pilot would not tell Dad not to read it, so these words ask for more than facts.","2":"The Kid would plead or sulk, something like \u201cDo I have to?\u201d Mum is asking for nothing here, so the Kid is not talking."},"example":"A choir rehearsal, Thursday.<br>Conductor: \u201cStand there. Sing what's on the sheet. Don't ask why.\u201d<br>Singer: \u201cRight.\u201d She stops asking and stays in her place."},{"type":"pick","who":"Dad","text":"<i>He turns the pen over as if it might bite. \u201cForms and me never got on. Your mother's the clever one. Tell me where to put my name and I'll put it, and I'll try not to smudge it.\u201d<\/i>","cue":"Sunday, 1:24pm, Gran's table","options":["the Boss","the Pilot","the Kid"],"answer":2,"why":"Dad hands the thinking to someone else and asks to be told what to do, with a small joke to soften it. That is the Kid, the part that wants direction and a smile for being no trouble. He never asks what the form says.","traps":{"0":"The Boss would give orders, something like \u201cFill it in before Tuesday.\u201d Dad is asking to be told, not telling anyone.","1":"The Pilot would read the form and say what it asks and by when. Dad has not looked at a single line, and that is the clue."},"example":"A bike shop, Saturday.<br>Customer: \u201cYou're the expert. Just tell me which tyre and I'll nod.\u201d<br>Mechanic: \u201cThe thick one. Don't haggle.\u201d"},{"type":"pick","who":"Gran's kitchen","text":"<i>Mum keeps the forms and the orders. Dad keeps the dry jokes and waits to be told. The bus pass has been renewed this way every year, and every year the afternoon goes the same way.<\/i>","cue":"Sunday, 1:30pm, Gran's flat downstairs","options":["Two people taking turns at the wheel","One plays the Boss and the Pilot, the other plays the Kid","Two people who disagree about the bus pass"],"answer":1,"why":"Mum gives the orders and does the sums, which are the Boss and the Pilot. Dad supplies the joke and the waiting, which is the Kid. Between them the household uses three voices where two adults could have six. They fit together so well that neither has to change.","traps":{"0":"Taking turns would put Dad at the wheel sometimes. In this picture he never is, so it only looks like teamwork from outside.","2":"A disagreement would have two sides pushing. Here nobody pushes back, and the quiet agreement is the pattern."},"example":"A cricket club committee, Friday.<br>Secretary: \u201cI've got the fixtures and the van. You just turn up and wave.\u201d<br>Captain: \u201cPerfect. I'll forget the van, as usual.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes with the same two people. One plays the Boss and the Pilot, and the other plays the Kid. Find the line that gives each of them a voice they have been leaving unused, and watch what the words do to the meters.","items":[{"type":"scene","title":"Sunday, 1:30pm, Gran's kitchen","setting":"Gran's flat downstairs. Gran is at the cooker with her back turned, pretending not to listen, and Leo is under the table with his tablet.","meters":{"you":50,"them":50},"beats":[{"who":"Dad","text":"\u201cYour mother does all this. I'd only muddle the dates.\u201d","cue":"pushing the form an inch away with one finger","lines":[{"text":"\u201cWhat are the dates, Dad? Tell me the one you do know, and we'll start there.\u201d","tag":"best","you":4,"them":2,"outcome":"He frowns at the ceiling. \u201cTuesday's the deadline. And it needs a photo.\u201d","why":"You ask a plain factual question he can answer. That gives the Pilot in him a small job, and he does it."},{"text":"\u201cIt's fine, Mum's got it.\u201d","tag":"ok","you":-1,"them":1,"outcome":"He nods, relieved, and tears off a piece of bread.","why":"It is kind, and it leaves the pair as it is. Mum does the forms, Dad does the relief."},{"text":"\u201cDad, you always say that. Just once, do something.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Dad says \u201cRight,\u201d and Gran turns the radio up.","why":"You scold him from a Parent's seat, and that puts him straight back in the Kid's. He goes quiet and ashamed, which does the form no good."}]},{"who":"Mum","text":"\u201cI've done it all. Don't touch it, I've checked every box twice.\u201d","cue":"her pen laid across the page like a ruler","lines":[{"text":"\u201cEat while it's hot, Mum. I'll read the boxes out, and Dad can tick the ones he knows.\u201d","tag":"best","you":4,"them":4,"outcome":"She sits, a little surprised. \u201cWell. If you read, I'll listen.\u201d","why":"She gets a turn at being looked after, which is the Kid's seat, and Dad gets a small job that is his."},{"text":"\u201cFine, you know best.\u201d","tag":"ok","you":-1,"them":1,"outcome":"She nods and picks the pen back up.","why":"Agreeing is pleasant, and it leaves her carrying the form alone."},{"text":"\u201cYou never let anyone else do anything. That's why Dad doesn't try.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Mum puts the lid back on her pen and says, \u201cI see.\u201d","why":"You blame one half of the pair for the whole pattern. She defends the form, and the form gets heavier."}]},{"who":"Dad","text":"\u201cShe's brilliant, your mother. I don't know what I'd do without her.\u201d","cue":"raising the teapot toward her like a toast","lines":[{"text":"\u201cThen tell her what you'll do by Tuesday, Dad. That helps more than the toast.\u201d","tag":"best","you":4,"them":2,"outcome":"\u201cThe photo. I'll go to the chemist on Monday.\u201d Mum says nothing, but her shoulders drop an inch.","why":"You turn praise into a plan, and a plan is the Pilot's job. Praise with no date is only a warm nod."},{"text":"\u201cShe is. Pass the salt.\u201d","tag":"ok","you":-1,"them":1,"outcome":"He passes the salt, pleased, and the toast stands.","why":"Friendly, and it agrees the pattern is normal. The form stays with Mum."},{"text":"\u201cShe'd be happier if you stopped saying that and did something.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Dad sets the teapot down and looks at Mum, not at you.","why":"It sounds like a fair point and it is aimed at him. He hears the old message that he is the one who does too little."}]},{"who":"Mum","text":"\u201cDon't fuss. I'm fine. I always manage.\u201d","cue":"standing again to clear plates nobody has finished","lines":[{"text":"\u201cYou do manage, and it shows. Sit for ten minutes, Mum. Dad can clear.\u201d","tag":"best","you":4,"them":3,"outcome":"She sits. Dad gets up, startled, and starts stacking plates.","why":"You name what she carries and offer her the Kid's turn at being looked after. Dad gets a job with an end."},{"text":"\u201cAll right, I'll help you.\u201d","tag":"ok","you":0,"them":1,"outcome":"You take the plates yourself. Dad stays in his chair.","why":"It helps today, and now there is a third person doing the Boss's work. Dad still has nothing to do."},{"text":"\u201cYou're not fine, you're a martyr. Everyone can see it.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Mum says, \u201cEat your lunch,\u201d and the plates stay in her hands.","why":"This is a hook with a label on the outside. She has to prove she is fine, so she will hold more, not less."}]}],"payoff":"Sunday, 2:10pm. The form goes back in the envelope unsigned, and Mum carries it up to finish alone.","fallout":{"them":"Mum stops asking for help with anything that weekend, and the form is posted in her handwriting."}},{"type":"scene","title":"Tuesday, 8:10am, the phone call home","setting":"You are on the bus with the phone against your ear. Mum is on the line with the kettle clicking behind her, and Dad is somewhere further back with the television on mute.","meters":{"you":50,"them":50},"beats":[{"who":"Mum","text":"\u201cYour father forgot the photo again. I'll sort it. I always do. Did you eat?\u201d","cue":"the kettle clicking off behind her","lines":[{"text":"\u201cPut Dad on for a minute, Mum. I'd like to hear what he plans for the photo.\u201d","tag":"best","you":4,"them":3,"outcome":"A pause. Then footsteps. \u201cHello, love. The photo. Chemist, five o'clock.\u201d","why":"You ask for Dad's own plan instead of agreeing that he has none. Mum gets a break from being the only one who knows."},{"text":"\u201cI ate, Mum. Thanks for sorting it.\u201d","tag":"ok","you":-1,"them":1,"outcome":"\u201cGood. That's one less thing.\u201d The phone goes quiet.","why":"Polite and warm, and it thanks her for carrying everything. The pattern is paid for again."},{"text":"\u201cYou do everything and then complain, Mum. Let him fail once.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Mum says, \u201cI'm not complaining,\u201d and the line goes flat.","why":"You take away her one way of showing care, and you hand her a complaint she did not make. She will defend the job."}]},{"who":"Dad","text":"\u201cHello, love. Sorry about all this. Your mother says I'm hopeless at the post office.\u201d","cue":"his voice low, the television audible behind him","lines":[{"text":"\u201cTell me what time you'll get there, Dad, and ring Mum when it's done.\u201d","tag":"best","you":4,"them":4,"outcome":"\u201cHalf past four. I'll tell her.\u201d Something that sounds like a smile.","why":"You turn the apology into a time and a report. A time is the Pilot's work, and he has been leaving it to Mum."},{"text":"\u201cYou're not hopeless, Dad. Don't be silly.\u201d","tag":"ok","you":0,"them":2,"outcome":"He laughs, a bit relieved. \u201cWell, thank you.\u201d","why":"It is kind, and it gives him a nod for being sorry. There is still no plan."},{"text":"\u201cStop saying sorry and just do it, Dad.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Dad says \u201cRight, yes,\u201d and hands the phone back.","why":"This is the Boss's voice, and it gives him no job. The apology goes away and the freeze stays."}]},{"who":"Mum","text":"\u201cHe'll forget by lunch. Give it here.\u201d","cue":"the phone changing hands with a scrape","lines":[{"text":"\u201cLet it be his until five, Mum. If it's not done, he can tell you himself.\u201d","tag":"best","you":4,"them":3,"outcome":"\u201cFive o'clock. Fine. I'll leave the kettle for him.\u201d","why":"You hand the job to Dad with an end time, and Mum gets to stop being the backup."},{"text":"\u201cAll right, you do it, Mum.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cI will. I always do.\u201d","why":"It ends the call on a warm note and gives the job straight back to the Boss."},{"text":"\u201cThat's why he never learns, Mum.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Mum says, \u201cIt is not,\u201d and puts the phone down.","why":"You blame her for the pattern in the very moment she is trying to be kind. She will defend how she runs things."}]},{"who":"Mum","text":"\u201cI'm so tired of being the one who knows where everything is.\u201d","cue":"lower now, turned away from the receiver","lines":[{"text":"\u201cThat sounds heavy. What is one thing you'd love never to look for again?\u201d","tag":"best","you":4,"them":4,"outcome":"\u201cThe car keys. Every morning.\u201d A short laugh. \u201cYour father could hang them on a hook.\u201d","why":"You take the tiredness as real and ask for one specific piece to hand over. That is a plan she can use."},{"text":"\u201cYou're brilliant, Mum. We'd all be lost.\u201d","tag":"ok","you":-2,"them":2,"outcome":"\u201cWell,\u201d she says, and sounds both pleased and tired.","why":"Praise makes her important and keeps her in the job. The tiredness goes unanswered."},{"text":"\u201cSo stop doing it, and see what happens.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Mum says, \u201cEasy to say from there,\u201d and the call ends.","why":"Advice with no plan sounds like blame. It also says her care is a choice she could drop, and she cannot."}]}],"payoff":"Tuesday, 8:40am. The call ends with the photo still unbooked, and Mum says she will do it on her way to the shops.","fallout":{"you":"Mum rings off with \u201cNever mind, I'll do it,\u201d and the form is posted by lunchtime in her handwriting."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. You can use the book words now.","items":[{"type":"pick","who":"Nadia","text":"\u201cMum keeps the forms and the orders, and Dad keeps the dry jokes and waits to be told. What do the books call a relationship where one person plays the Parent and the Adult and the other plays the Child?\u201d","cue":"turning her cup, one eyebrow up","options":["Ulterior transaction","Passivity","Symbiosis"],"answer":2,"why":"Mum plays the Parent and the Adult, with the orders and the dates, and Dad plays the Child, with the joke and the waiting. Between them they use three of the six ego states. The books call that pattern a symbiosis.","traps":{"0":"An ulterior transaction has a hidden message under the spoken one. Nothing is hidden here, and the question is about how two people fit together.","1":"Passivity describes one person's way of dodging a problem. Mum and Dad both act all the time, and the pattern lives in the fit between them."},"example":"A village hall committee, Wednesday.<br>Chair: \u201cI'll do the agenda and the accounts. You just bring biscuits.\u201d<br>Treasurer: \u201cLovely. I'll forget the biscuits.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cWhat move would give Mum and Dad all three voices between them?\u201d","cue":"pen in hand, waiting","options":["Post the form yourself this once, so the dates stop being a worry for either of them.","Give Mum a turn at being looked after, and Dad one dated job to report back on.","Tell Dad he has to read every form himself from now on, and not to ask Mum for help."],"answer":1,"why":"Both of them are using only part of what they have. Mum gets a turn in the Kid's chair, and Dad gets a piece of the Pilot's work with an end time. That loosens the symbiosis from both sides without pushing either of them out.","traps":{"0":"Posting it yourself makes you the new Boss and Pilot, and the pair gets a third person to lean on. It feels helpful, and nobody has used a new voice.","2":"Telling Dad to do it all alone is the Boss's order, with no support and no fallback. He may freeze, and Mum will step in the moment he does."},"example":"A shared allotment, Saturday.<br>Neighbour A: \u201cI'll plan the beds, and you dig, as always.\u201d<br>Neighbour B: \u201cHow about I choose the beans this year, and you sit down with the tea first?\u201d"}]}]},{"setting":"Friends & Community","blurb":"Ruby runs Hannah's surprise party from a clipboard while Joseph jokes and waits to be told.","opener":{"setting":"Friday, 6:30pm. The Corner Table, the back table after Nadia's group has left. Paper squares are still on the cloth, and Ruby has a clipboard.","lines":[{"who":"Ruby","text":"\u201cHannah's surprise is Sunday at two. Cake collected by noon, chairs, candles, the card. Joseph, you only have to get the cake. One job.\u201d","cue":"ticking the clipboard with a pen on a string"},{"who":"Joseph","text":"\u201cCake, yes. Brilliant. What was the bakery called again, and what colour is it? I'm rubbish at this, sorry.\u201d","cue":"laughing, already looking at his phone"}],"ask":"Which of them plays the Boss and the Pilot, which of them plays the Kid, and what move would give each of them all three voices?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line here comes from one of the three voices: the Boss, the Pilot or the Kid. Tap the voice that is talking, and then the picture of the pair.","items":[{"type":"pick","who":"Ruby","text":"<i>She reads from the clipboard without looking up. \u201cThe bakery shuts at one on Sunday. Pick-up is at the back counter, the order is under my name, and it's paid. Quarter to twelve is the safest time.\u201d<\/i>","cue":"Friday, 6:34pm, the Corner Table","options":["the Boss","the Pilot","the Kid"],"answer":1,"why":"These are facts, a time and a place, and Ruby leaves the next move to whoever hears them. That is the Pilot, the voice that deals with what is in front of you. The Boss would add an order, and the Kid would ask for help.","traps":{"0":"The Boss would give an instruction with a warning in it, something like \u201cBe there at quarter to twelve or else.\u201d Ruby gives times and a place and no threat.","2":"The Kid would wheedle or plead, something like \u201cCould you do this one thing for me?\u201d Ruby is stating information, not asking for a favour."},"example":"A railway platform, Saturday.<br>Guard: \u201cThe last train is at 10:52 from platform two. The next one is at six.\u201d<br>Passenger: \u201cThanks. I'll run.\u201d"},{"type":"pick","who":"Joseph","text":"<i>He puts both hands up and laughs. \u201cWhatever you say, boss. I'll forget the lot by Sunday, you know me. Just text me on the day and I'll do it.\u201d<\/i>","cue":"Friday, 6:37pm, the Corner Table","options":["the Boss","the Pilot","the Kid"],"answer":2,"why":"Joseph hands the plan to someone else with a joke, and asks to be told. \u201cI'll forget the lot\u201d is charm that keeps him from having to decide anything. That is the Kid, which wants to be directed and liked for it.","traps":{"0":"The Boss would order someone else about. Joseph is the one waiting to be ordered.","1":"The Pilot would say when and how he will get to the bakery. Joseph says only that he will forget, and the missing time is the clue."},"example":"A five-a-side game, Thursday.<br>Player: \u201cJust tell me where to stand and I'll run there. I'm useless at tactics.\u201d<br>Captain: \u201cBack left. Don't wander.\u201d"},{"type":"pick","who":"The back table","text":"<i>Ruby keeps the clipboard and the reminders. Joseph keeps the jokes and the gentle promises, and waits for the next text. Hannah's party will happen, and it will happen because of one person.<\/i>","cue":"Friday, 6:45pm, the Corner Table","options":["One plays the Boss and the Pilot, the other plays the Kid","Two friends sharing the plan evenly","Two people who disagree about the cake"],"answer":0,"why":"Ruby gives the orders and holds the facts, which are the Boss and the Pilot. Joseph supplies the charm and the waiting, which is the Kid. Between them the party uses three voices where two friends have six, and the whole plan sits with one of them.","traps":{"1":"Sharing evenly would put Joseph's name on the clipboard too. He has none of the plan, so it only looks even.","2":"A disagreement about the cake would have both of them arguing. Neither is, and the lack of argument is the pattern."},"example":"A flatshare dinner, Sunday.<br>Cook: \u201cI've got the menu and the shopping. You just come in and be funny.\u201d<br>Guest: \u201cDone. And I'll bring the wrong wine.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Two scenes with the same two people. One plays the Boss and the Pilot, and the other plays the Kid. Find the line that gives each of them a voice they have been leaving unused, and watch what the words do to the meters.","items":[{"type":"scene","title":"Friday, 6:40pm, the Corner Table","setting":"The back table is clear except for Ruby's clipboard and a plate of Nadia's leftover shortbread. Hannah's card lies half signed between the cups.","meters":{"you":50,"them":50},"beats":[{"who":"Joseph","text":"\u201cRuby's got it covered. She always does. I'll just turn up and be charming.\u201d","cue":"tearing a corner off a beer mat","lines":[{"text":"\u201cCharm is fine. Say what time you'll collect the cake, Joseph, and say it to Ruby.\u201d","tag":"best","you":4,"them":2,"outcome":"\u201cQuarter to twelve. Ruby, I'll be there at quarter to.\u201d She makes a tick.","why":"You ask for a time, which is the Pilot's work, and you ask him to say it to the person who usually holds the plan."},{"text":"\u201cHa, fair enough. That's what you're for.\u201d","tag":"ok","you":-1,"them":1,"outcome":"He grins, and the beer mat gets another tear.","why":"It is a friendly joke that agrees with his side of the pattern."},{"text":"\u201cYou turn up charming and she does everything. Doesn't that bother you?\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Joseph says, \u201cIt's just how we are,\u201d and picks up his coat.","why":"You invite him to defend himself. A defence is the Kid's reply, not a plan."}]},{"who":"Ruby","text":"\u201cDon't rearrange anything. It's on the clipboard. It's all done.\u201d","cue":"her pen laid across the page like a ruler","lines":[{"text":"\u201cIt looks done. Which one thing could Joseph take off it, so you can finish your coffee first?\u201d","tag":"best","you":4,"them":4,"outcome":"She hesitates. \u201cThe chairs. Joseph, the chairs.\u201d He salutes.","why":"You invite her to give a piece away. That lets her sit and be looked after for a minute, and Joseph takes a real job."},{"text":"\u201cFine, I won't touch it.\u201d","tag":"ok","you":-1,"them":1,"outcome":"She nods and straightens the page.","why":"It respects the clipboard and leaves the whole of it with her."},{"text":"\u201cIf it falls apart, it's because you didn't let anyone help.\u201d","tag":"game","you":-4,"them":-6,"outcome":"The scene stops there. Ruby says, \u201cThen I'll just do it,\u201d and caps her pen.","why":"This puts the blame on her in advance. She will now do everything, and call it your doing."}]},{"who":"Joseph","text":"\u201cRuby, you're a genius. Hannah's so lucky. I'd be nothing without you.\u201d","cue":"raising his mug","lines":[{"text":"\u201cThen be something on Sunday, Joseph. Tell her which chairs, and when you'll bring them.\u201d","tag":"best","you":4,"them":3,"outcome":"\u201cChairs from the back room at one. Horseshoe.\u201d He writes it on the list himself.","why":"You turn the praise into a plan. Praise is a warm nod, and it needs a time before it counts for anything."},{"text":"\u201cTo Ruby.\u201d","tag":"ok","you":0,"them":2,"outcome":"Everyone clinks mugs. The clipboard stays where it is.","why":"It joins the toast and lets the pattern stand."},{"text":"\u201cYou say that every time, and then she does it all again.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Joseph laughs too loudly and looks at his mug.","why":"You expose the pattern as a joke at his cost. He covers with more charm, and the plan still sits with Ruby."}]},{"who":"Ruby","text":"\u201cI'm absolutely fine. I just need everyone to do exactly what's written.\u201d","cue":"her voice too level, the pen clicking","lines":[{"text":"\u201cYou look tired as well as fine. Sit for the shortbread, Ruby, and we'll go down the list together.\u201d","tag":"best","you":4,"them":4,"outcome":"She sits. \u201cTen minutes.\u201d She lets Joseph read the next line.","why":"You name the tiredness as well as the competence, and you offer her the Kid's turn at being looked after."},{"text":"\u201cUnderstood. Exactly as written.\u201d","tag":"ok","you":-1,"them":0,"outcome":"She nods. The pen goes on clicking.","why":"It keeps the peace and gives her nothing to put down."},{"text":"\u201cExactly as written. Heaven forbid anyone breathes.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Ruby puts the clipboard in her bag and says nothing else.","why":"Sarcasm calls her control the problem. She hears it as a verdict and holds on harder."}]}],"payoff":"Friday, 7:05pm. The clipboard goes home in Ruby's bag, and Hannah's party is still one person's job.","fallout":{"them":"Joseph texts \u201cjust tell me what to do\u201d on Saturday instead of planning anything."}},{"type":"scene","title":"Sunday, 11:40am, outside the bakery","setting":"A back door with a hand-written sign: closes at one. Joseph has arrived, late, with his phone held at arm's length. Ruby has texted him twice.","meters":{"you":50,"them":50},"beats":[{"who":"Joseph","text":"\u201cRuby's texted twice and I haven't read either. Can you read them? I'll panic if I do.\u201d","cue":"holding the phone away from himself","lines":[{"text":"\u201cRead them yourself, Joseph. I'm right here, and all you need is the counter and the name.\u201d","tag":"best","you":4,"them":3,"outcome":"He reads, lips moving. \u201cBack counter. Under Ruby. Paid.\u201d","why":"You give him the Pilot's task with someone beside him. He does the reading."},{"text":"\u201cI'll read them. Wait here.\u201d","tag":"ok","you":-1,"them":2,"outcome":"You read them out, and he thanks you three times.","why":"It rescues him, and now you are the one doing the Pilot's work for him."},{"text":"\u201cTwo texts and you haven't looked? That's every time, Joseph.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Joseph says \u201cSorry, sorry,\u201d and goes in without reading.","why":"You scold, and he apologises. The apology stands in for the reading."}]},{"who":"Joseph","text":"\u201cLook at it! I'll carry it. No, you carry it. Actually, I'll carry it. Probably.\u201d","cue":"arms round the cake box like a baby","lines":[{"text":"\u201cYou carry it. Say which corner you'd want to swap at, and we'll agree it now.\u201d","tag":"best","you":4,"them":4,"outcome":"\u201cThe postbox.\u201d He shifts the box higher. \u201cIf I wobble, I'll say.\u201d","why":"You give him the job and an exit he picks himself. That is a small Pilot move on his side."},{"text":"\u201cI'll take it, Joseph. Safer.\u201d","tag":"ok","you":-1,"them":0,"outcome":"He hands the box over, relieved.","why":"It protects the cake and confirms he cannot be trusted with it."},{"text":"\u201cYou'll drop it. You always drop things. Hand it over.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Joseph hands the box across and trails behind you.","why":"This is the Boss's voice with a taunt in it. It puts him in the Kid's seat for the rest of the morning."}]},{"who":"Ruby","text":"\u201cYou're late. I've had the candles on the table since half ten and nobody asked me if I wanted tea.\u201d","cue":"standing among the chairs, jacket still on","lines":[{"text":"\u201cHe got the cake, and he did the counter himself. Sit down, Ruby, and I'll bring you tea.\u201d","tag":"best","you":4,"them":3,"outcome":"She sits on a chair that is not part of the horseshoe. \u201cMilk, one sugar.\u201d","why":"You tell her what he did, which is information, and you offer her a Kid's turn at being looked after."},{"text":"\u201cSorry, Ruby. My fault, the traffic.\u201d","tag":"ok","you":-3,"them":1,"outcome":"\u201cIt's fine,\u201d she says, in the voice of someone who is not.","why":"You take the blame so she does not have to be cross. She stays in charge and stays tired."},{"text":"\u201cEveryone's doing their best. You could try saying thank you.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Ruby takes off her jacket and stacks chairs hard.","why":"It sounds fair and lands as a rebuke. She answers by doing more, not by sitting down."}]},{"who":"Ruby","text":"\u201cJoseph, the chairs. In a horseshoe. No, a line. Just do what I said.\u201d","cue":"pointing with the pen","lines":[{"text":"\u201cJoseph, horseshoe or line? You pick, and tell Ruby why.\u201d","tag":"best","you":4,"them":4,"outcome":"\u201cHorseshoe. Hannah can see everyone from the door.\u201d Ruby opens her mouth, shuts it. \u201cHorseshoe.\u201d","why":"You give him a decision and a reason to say aloud. Ruby gets to practise leaving one thing to someone else."},{"text":"\u201cHorseshoe, then. Joseph, do as she says.\u201d","tag":"ok","you":-2,"them":1,"outcome":"He moves the chairs, exactly as she said.","why":"You back the Boss's order, and Joseph stays in the Kid's seat."},{"text":"\u201cIt's a birthday, not a military exercise.\u201d","tag":"game","you":-4,"them":-5,"outcome":"The scene stops there. Ruby says, \u201cFine,\u201d and lines the chairs herself.","why":"A joke at her expense about her control. She wins the argument by doing it all."}]}],"payoff":"Sunday, 12:35pm. The chairs go up in Ruby's order and the cake sits in the middle. Hannah will walk into a room that took one person to run.","fallout":{"you":"Ruby sends everyone out for ice, and does the rest herself with her jacket still on."}}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions to explain back. You can use the book words now.","items":[{"type":"pick","who":"Nadia","text":"\u201cRuby holds the clipboard and the orders, and Joseph holds the jokes and waits for the next text. What do the books call a pair where one plays the Parent and the Adult, and the other plays the Child?\u201d","cue":"wiping the table, not looking up","options":["Symbiosis","Ulterior transaction","Crossed transaction"],"answer":0,"why":"Ruby plays the Parent and the Adult, with the list and the facts, and Joseph plays the Child, with the charm and the waiting. Between them they use three of the six ego states. The books call that a symbiosis.","traps":{"1":"An ulterior transaction hides a second message under the first. There is no hidden message here, and the question is about the shape of the pair.","2":"A crossed transaction is one reply that lands on the wrong ego state. This is a standing arrangement between two people, not a single exchange."},"example":"A choir trip, Tuesday.<br>Organiser: \u201cI'll book the coach and decide the seating. You keep the singers cheerful.\u201d<br>Volunteer: \u201cDone. Please don't ask me about the coach.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cWhich move gives both Ruby and Joseph all three voices?\u201d","cue":"pen tapping the clipboard","options":["Take the clipboard yourself for the weekend, so neither of them has to carry the party.","Tell Ruby to stop planning altogether, and tell Joseph that he has to stop joking about it.","Ask Ruby to hand over one real job, and ask Joseph to plan it and report back."],"answer":2,"why":"Ruby has been using only the Boss and the Pilot, and Joseph only the Kid. A real job with a report loop gives Joseph some Pilot, and handing it over gives Ruby some Kid. That loosens the symbiosis from both ends.","traps":{"0":"Taking the clipboard makes you the new Boss and Pilot, and the pair gets a third person to lean on. It feels kind and changes no one's voice.","1":"Telling Ruby to stop planning and Joseph to stop joking cuts both of them off from what they are good at. Each would need a different voice to take its place, and neither has one ready."},"example":"A student society, Monday.<br>President: \u201cI'll do the budget, the room and the speakers.\u201d<br>Treasurer: \u201cLet me do the room booking and report back on Friday. You sit one out.\u201d"}]}]},{"setting":"School & College","blurb":"Theo takes over the group project while Nora apologises and waits; the presentation is due Thursday.","opener":{"setting":"Tuesday, 7:10pm. The college, room 4, ten minutes before Ms Hollis arrives. Sam's evening class has a group talk due Thursday, and Theo has brought a printed plan.","lines":[{"who":"Theo","text":"\u201cI've split the slides and written the script. Nora, you do slide six, and say it exactly as it's written. Don't change a word.\u201d","cue":"squaring the pages against the desk"},{"who":"Nora","text":"\u201cSure, I'll do whatever you say. I'm rubbish at this, so I'd only make it worse. Sorry.\u201d","cue":"smiling at her pencil case"}],"ask":"Which of them plays the Boss and the Pilot, which of them plays the Kid, and what move would give each of them all three voices?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each line here comes from one of the three voices: the Boss, the Pilot or the Kid. Tap the voice that is talking, and then the picture of the pair.","items":[{"type":"pick","who":"Theo","text":"<i>He hands out stapled pages and taps the first one. \u201cRead your part tonight and say it exactly as written. No changes. We're doing it my way because my way works.\u201d<\/i>","cue":"Tuesday, 7:14pm, room 4","options":["the Boss","the Pilot","the Kid"],"answer":0,"why":"\u201cNo changes\u201d and \u201cmy way works\u201d are orders with no reasons attached, and there is no gap left for an answer. That is the Boss, the voice that decides how things are done. The Pilot would say what the slides need and when.","traps":{"1":"The Pilot would give facts and leave the choice open, something like \u201cThe talk is ten minutes and the slides are due Thursday.\u201d Theo says what to do instead.","2":"The Kid would plead or grumble, something like \u201cCan we please do it my way?\u201d Theo is telling, not asking."},"example":"A kitchen at a restaurant, Friday.<br>Chef: \u201cYou chop it my way. No changes. It works.\u201d<br>Trainee: \u201cYes, chef.\u201d He stops asking."},{"type":"pick","who":"Nora","text":"<i>She holds the page with two fingers as if it were hot. \u201cI'll do slide six if you tell me what to say. I'm rubbish at presenting. Please don't be cross with me.\u201d<\/i>","cue":"Tuesday, 7:17pm, room 4","options":["the Pilot","the Kid","the Boss"],"answer":1,"why":"Nora hands the thinking to Theo, calls herself rubbish and asks him not to be cross. That is the Kid, the part that wants direction and wants not to be told off. She has not asked what slide six needs.","traps":{"0":"The Pilot would ask what slide six has to cover and by when. Nora asks only to be told what to say.","2":"The Boss would give instructions of her own. Nora is asking for instructions, so she is on the receiving end."},"example":"A driving lesson, Wednesday.<br>Learner: \u201cJust tell me when to turn and I'll do it. Please don't shout.\u201d<br>Instructor: \u201cLeft here.\u201d"},{"type":"pick","who":"Room 4","text":"<i>Theo writes the slides and the script, and decides who stands where. Nora reads what she is given and apologises as she reads. From the back of the room it looks like teamwork.<\/i>","cue":"Tuesday, 7:25pm, room 4","options":["Two classmates who take turns leading","Two people who dislike group work","One plays the Boss and the Pilot, the other plays the Kid"],"answer":2,"why":"Theo gives the orders and holds the plan, which are the Boss and the Pilot. Nora supplies the apology and the waiting, which is the Kid. The group has three voices between two people who could use six, and it works well enough that nobody asks for more.","traps":{"0":"Taking turns would put Nora in the lead sometimes. She has never led, and he has never followed.","1":"Disliking group work is a feeling about the task. The picture is about how the two of them fit together."},"example":"A garden club stall, Sunday.<br>Organiser: \u201cI've priced e
