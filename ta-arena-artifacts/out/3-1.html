<script>window.TA_GAME = {"slot":"3.1","setting":"Home & Flatmates","title":"Draw the Arrow","world":3,"worldName":"Back and Forth","week":3,"weekName":"Back and Forth","mechanic":"Vector","concept":"After this one you can draw the arrow for any line, from the voice that sends it to the voice that gets it, and say whether the reply matches it or cuts it.","plainWord":"a volley","bookTerm":"Transaction","bookIdea":"A transaction is one line and its reply. It is complementary when the reply comes from the ego state that was addressed and goes back to the one that spoke, and crossed when it does not.","bookSource":"Games People Play, ch. 2; TA Today, ch. 7","opener":{"setting":"Monday, 19:30, the kitchen in apartment 3B, Hawthorn Court. Maya has her phone propped against the fruit bowl.","lines":[{"who":"Maya","text":"\u201cSit down. I want to show you something you said to Sam last night.\u201d","cue":"scrolling her notes app with one thumb"},{"who":"Maya","text":"\u201cEvery line in a conversation is an arrow. It starts with the voice that sends it and lands on the voice that gets it.\u201d","cue":"drawing a line on the back of a takeaway menu with her finger"}],"ask":"For each line, which voice sends it, and does the reply come back from the voice that was spoken to?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> you see a line and the reply to it. Work out which voice the reply comes from. If it comes from the voice that was spoken to, the volley is <b>matched<\/b> and keeps going. A reply from a different voice is a <b>cut<\/b>, and the conversation stops.","items":[{"type":"pick","who":"Sam, last night, replying to you","text":"\u201cUgh, you sound like my mum.\u201d","cue":"flat, not looking up from his phone","prompt":"Which voice does the reply come from?","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"The reply is sulky and childish, a complaint about being told off. That is the Kid answering. Your line was aimed at the part of him that gets told what to do, and that part has answered.","traps":{"0":"The Boss would sound like \u201cDon't tell me how to live, I'm the one who pays.\u201d That is a lecture thrown back at you. Your line was aimed at the part of him that gets told what to do, so a Boss reply would come from a different voice and cut the volley.","1":"The Pilot would say \u201cFair point, I'll sort the rent by Friday.\u201d That is calm and practical, and it is not what this line sounds like."},"example":"A family WhatsApp group, a brother to his sister after she told him to clear the table: \u201cUgh, you sound like Mum.\u201d<br>He is answering from the part of him that was told off, so the reply comes back from the Kid."},{"type":"pick","who":"Clara, in the Halden canteen, replying to you","text":"\u201cIt was mostly the library.\u201d","cue":"shrugging, a bit too quick","prompt":"Which voice does her reply come from?","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"She is quick and a bit small, shrugging your compliment off, so it is the Kid. You spoke to her Pilot, and the reply came from a different voice, so the volley is cut.","traps":{"0":"The Boss would sound like \u201cWell, somebody has to check the work.\u201d That is a verdict on your code, and the reply would come from a different voice from the one you spoke to.","1":"The Pilot would give the facts and keep the work in front of you: \u201cIt was mostly the library, and the cache reset did the rest.\u201d The words alone could pass for a Pilot's, but the quick shrug gives it away as the Kid. A real Pilot reply answers from the voice you spoke to, so the volley would stay matched."},"example":"A school gate, a mother to another mother about the science fair: \u201cYour poster was lovely.\u201d<br>\u201cOh, I'm useless at posters, sorry.\u201d The reply comes from a different voice than the one the praise was aimed at, so the talk about the fair stops there."},{"type":"pick","who":"Daniel, in the Halden corridor, replying to you","text":"\u201cLet's keep this simple. Send me the numbers by noon.\u201d","cue":"already walking away","prompt":"Which voice does his reply come from?","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"A clipped order with a deadline is the Boss, the voice that sets the rules for the room. You spoke to the Boss in him, and the Boss answered, so the volley is matched and can keep running.","traps":{"1":"The Pilot would say \u201cNoon works, but what do you need from me first?\u201d That is a plan about the numbers, not an order, so the line would sound like a question you could answer.","2":"The Kid would sound like \u201cOkay, okay, I'll try.\u201d That is small and eager to please, so his order would sound like a favour you could refuse."},"example":"A bus stop, a father to a teenager who asked if she could go to the mall: \u201cHome by six. Let's keep this simple.\u201d<br>The reply comes from the voice that set the rule, so the volley runs on."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"pick","who":"You, to Clara, on a Tuesday","text":"\u201cYour auth code was clean.\u201d","cue":"warm, meant as praise","prompt":"Which voice of Clara's should answer?","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"You spoke to her Pilot, the voice that handles the work, so a matched reply comes back from the Pilot. Your praise is about the code, and the Pilot is the voice that can take it as information.","traps":{"0":"The Boss would answer \u201cOf course it was clean, I checked it twice.\u201d That is a claim of authority, and it would be a cut: her Boss answering your Pilot's compliment.","2":"The Kid would answer \u201cReally? Thanks, I didn't think anyone noticed.\u201d That is warm, but it is a cut, because the reply came from a voice you did not speak to."},"example":"A family WhatsApp group, a cousin to a cousin about a cake: \u201cYour cake looked fine.\u201d<br>\u201cThanks, I used less sugar this time.\u201d The reply comes from the same calm voice the line was sent to, so the thread keeps going."},{"type":"pick","who":"Sam, to you, in 3B, on Monday night","text":"\u201cYou sound like my mum. Can we not do this?\u201d","cue":"arms folded, standing by the fridge","prompt":"You want this to stop and still get the rent sorted. Which of your voices answers?","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"His line came from his Kid and was aimed at your Boss. To stop the loop you answer from a different voice, so the arrows cross. The Pilot does that, and it still deals with the rent: \u201cFair enough. Let's talk about the rent on Friday.\u201d","traps":{"0":"The Boss would answer \u201cDon't tell me what to do, Sam, you owe me.\u201d That keeps the same Boss-to-Kid loop going, so it is matched, and it can run on and on.","2":"The Kid would answer \u201cSorry, sorry, I know, I'm the worst.\u201d That is a cut too, since Sam's line was aimed at your Boss. It stops the fight, but only because you gave in, and the rent talk never happens."},"example":"A kitchen at midnight, a son to his father after a row: \u201cYou sound like Mum.\u201d<br>\u201cFair enough, the bins can wait till Sunday.\u201d The reply comes from a different voice than the one the line was aimed at, so the argument stops instead of going round again."},{"type":"pick","who":"Omar, in the Halden kitchen, after you asked about the release","text":"\u201cIt'll go out when it goes out.\u201d","cue":"tired, not turning round","prompt":"Which voice does his reply come from?","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"A flat ruling that closes the question is the Boss. You asked him in your Pilot, so a matched reply would have come back from his Pilot. His Boss answered instead, so the volley is cut and the talk stops there.","traps":{"1":"The Pilot would say \u201cTuesday, I think. I'll check the build and tell you.\u201d That is a real answer from the voice you asked, so the volley would stay matched and the talk would keep going.","2":"The Kid would say \u201cI don't know, sorry, I'm not sure.\u201d That is an apology, not a ruling, and it leaves your question hanging."},"example":"A train platform, a young woman asks an old man when the next train comes. He says: \u201cIt comes when it comes.\u201d<br>She asked from her Pilot and he answered from his Boss, so the exchange goes nowhere."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Your line to Clara, then her reply, both on the Halden chat","text":"You sent: \u201cYour auth code was clean.\u201d She replied: \u201cIt was mostly the library.\u201d The arrows cross. Why did the conversation stop there?","prompt":"What is the best explanation?","options":["Her reply came from a different voice than the one you spoke to, so the volley was cut.","You both spoke as the Pilot, and two Pilots always stall each other.","Her reply was too short, so the volley could not keep running."],"answer":0,"why":"You spoke to her Pilot, but her reply came from a different voice, so the arrows went across each other and the volley stopped. The reply came from the wrong voice, which is why it felt like it did not land.","traps":{"1":"Two Pilots can keep a volley running for a long time. Your line was aimed at her Pilot, but her Pilot did not answer: the reply came from another voice, so the stall came from her reply.","2":"Length has nothing to do with it. A one-word reply from the right voice would have kept the volley matched, and a long reply from the wrong voice would still cut it."},"example":"A family WhatsApp group, a sister to her brother about a school form: \u201cDone, I sent it.\u201d He replies with a sulky \u201cWhatever, I'll do it later.\u201d<br>The second message comes from a different voice than the one she spoke to, so the thread goes quiet."},{"type":"pick","who":"You, on the Monday night, after Sam's \u201cYou sound like my mum\u201d","text":"Sam's line came from his Kid and landed on your Boss. You want the loop to stop.","prompt":"Which reply is a cut?","options":["The Boss: \u201cYou owe me for the milk, so don't start.\u201d","The Pilot: \u201cFair enough, let's talk about the rent on Friday.\u201d","The Boss, kindly: \u201cI know you're tired, but the milk is still owed.\u201d"],"answer":1,"why":"A nasty matched volley keeps running as long as each reply comes from the voice that was addressed. Your Pilot is a different voice from the one he addressed, so the reply is a cut, and the loop stops without anyone giving in.","traps":{"0":"The Boss reply is matched. It answers from the same voice Sam addressed, so it hands him a new line to answer from his Kid, and the loop runs on.","2":"The kind Boss reply is still matched. It answers from the voice Sam addressed, so it sounds gentle and keeps the loop running."},"example":"A school gate, a mother to a neighbour after a loud argument about the parking space: \u201cFair enough, let's sort the parking on Friday.\u201d<br>The reply comes from a different voice than the one that was spoken to, so the fight stops instead of running on."}]}],"debrief":{"nadia":"Maya drew the arrows, and then you drew one yourself. A matched volley can run on and on, even the nasty ones. A cut stops it, and you get to choose which one you want to keep going. Notice which voice answers the next time someone speaks to you.","bookTerm":"Transaction","bookNote":"The books call a line and its reply a transaction: complementary when the reply comes from the voice that was spoken to and goes back to the voice that spoke, and crossed when it does not. While transactions stay complementary, the talk can go on indefinitely."},"reflection":{"prompt":"Think of a conversation this week that kept going round and round. Which voice did you answer from each time, and which voice would have cut it?"},"next":"3.2","baseStory":{"setting":"Home & Flatmates","blurb":"Maya draws arrows on a takeaway menu to show what went wrong between you and Sam."},"moreStories":[{"setting":"Friends & Community","blurb":"Joseph is fourteen fares short on the pitch fee, and Ruby wants out of goal.","opener":{"setting":"Thursday, 21:05, the car park behind the sports hall. The five-a-side is over and Joseph is counting a margarine tub of pitch fees for the second time.","lines":[{"who":"Joseph","text":"\u201cFourteen short. The hall wants it by Monday, and somebody has taken the green bibs home again.\u201d","cue":"shaking the tub as if it might confess"},{"who":"Ruby","text":"\u201cI've been in goal for eleven weeks. I'm only saying it's a number.\u201d","cue":"peeling off a glove, looking at neither of you"}],"ask":"For each line, which voice sends it, and does the reply come back from the voice that was spoken to?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> you see a line and the reply to it. Work out which voice the reply comes from. If it comes from the voice that was spoken to, the volley is <b>matched<\/b> and keeps going. A reply from a different voice is a <b>cut<\/b>, and the conversation stops.","items":[{"type":"pick","who":"Ruby, replying after you said she can't just drop out of goal","text":"\u201cFine. I'll stand there till I'm seventy, shall I?\u201d","cue":"pulling off one glove finger by finger","prompt":"Which voice does the reply come from?","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"Sulky, hurt and a little theatrical: that is the Kid. Your line was a rule, aimed at the part of her that gets told what to do, and that part has answered. The volley is matched, so it could go round all night.","traps":{"0":"The Boss would sound like \u201cThe sheet says rotate, so rotate, and don't lecture me.\u201d That is a rule thrown back at you, and it would come from a different voice than the one you spoke to.","1":"The Pilot would say \u201cEleven weeks is a lot. Can we swap Thursday and Sunday?\u201d That is a plan, and it is nothing like the sulk you just heard."},"example":"A hallway, a mother to her son who wants to drop piano: \u201cYou can't just stop.\u201d<br>\u201cFine. I'll play till I'm seventy, then.\u201d He answers from the part of him that was told what to do."},{"type":"pick","who":"Joseph, replying after you said you counted too and the tub is fourteen short","text":"\u201cRight. Pockets out by Monday, everyone, and I mean everyone.\u201d","cue":"already walking to his boot","prompt":"Which voice does the reply come from?","options":["The Boss","The Kid","The Pilot"],"answer":0,"why":"A clipped order with a deadline is the Boss. You spoke to the part of him that does sums, and a different voice answered, so the volley is cut and the sums go nowhere.","traps":{"1":"The Kid would say \u201cWhy does it always land on me? I only run the thing.\u201d That is a plea, and it would pull you into comforting him while the fees drop out of sight.","2":"The Pilot would say \u201cFourteen, then. I'll put a deadline in the group chat tonight.\u201d That uses your numbers, so the volley would stay matched."},"example":"A staff room, a teacher asks the head what time the fire drill is: \u201cWhen I say it is.\u201d<br>She asked from her Pilot and he answered from his Boss, so the question is dropped."},{"type":"pick","who":"Nadia, wheeling her bike past, replying to you","text":"\u201cForty-eight hours, in writing. Joseph has the email from March.\u201d","cue":"one foot on a pedal, not stopping","prompt":"Which voice does the reply come from?","options":["The Kid","The Pilot","The Boss"],"answer":1,"why":"Facts, a time limit and a place to find them, with no verdict attached: that is the Pilot. You asked the part of her that knows things, and that part answered. The volley is matched and the talk can go on.","traps":{"0":"The Kid would say \u201cOh, I'm no good with halls, ask Joseph, I'd only get it wrong.\u201d That is a shrug, and you would leave knowing nothing.","2":"The Boss would say \u201cYou should know that already. It's on the booking form.\u201d That is a verdict on you, and it shuts the question."},"example":"A bus stop, a man asks a stranger what the last bus is: \u201cTen past eleven, the board says.\u201d<br>He asked a plain question and got a plain answer, so they carry on talking."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"pick","who":"You, to Joseph, a minute later","text":"\u201cIf everyone puts in one fare on Monday, does that cover the fourteen?\u201d","cue":"working it out on your fingers, level voice","prompt":"Which voice of Joseph's should answer?","options":["The Pilot","The Boss","The Kid"],"answer":0,"why":"You asked from your Pilot and the question is a sum, so a matched reply comes from his Pilot: \u201cIf all fourteen turn up, yes.\u201d That voice can take a number as information and give one back.","traps":{"1":"The Boss would say \u201cIt's not for you to work out my tub, just bring yours.\u201d That is a cut: his Boss answering a question meant for his Pilot.","2":"The Kid would say \u201cI knew I'd get the counting wrong. I'm rubbish with money.\u201d That is warm enough, but it is a cut as well, and now you are reassuring him."},"example":"A school gate, a dad asks another dad if the trip money is due Friday: \u201cFriday, yes, and it's the full amount.\u201d<br>The reply comes from the voice that was asked, so the talk moves on."},{"type":"pick","who":"Ruby, to you, bag over her shoulder","text":"\u201cDon't look at me like that. You're not my headteacher.\u201d","cue":"zipping the bag too hard","prompt":"You want this to stop and still look at the goal rota. Which of your voices answers?","options":["The Boss","The Pilot","The Kid"],"answer":1,"why":"Her line came from her Kid and landed on your Boss. To stop the loop you answer from a different voice, so the arrows cross. The Pilot does that and keeps the rota alive: \u201cFair. Can we look at who's had goal on Sunday, over tea?\u201d","traps":{"0":"The Boss would say \u201cI'm not your headteacher, but the sheet says Thursday is yours.\u201d That is matched, so it keeps the same Boss-to-Kid loop going.","2":"The Kid would say \u201cSorry, sorry, I'll stay in goal, forget I said anything.\u201d That is a cut too, but it stops the row because you gave in, and the rota never gets looked at."},"example":"A shop floor, a worker to her supervisor: \u201cYou're not my mother.\u201d<br>\u201cFair. Can we check the rota at break?\u201d The reply comes from a different voice, so the row ends and the rota gets a hearing."},{"type":"pick","who":"Joseph, after you asked who had the green bibs","text":"\u201cWhy's it always me you ask? I wash them, you know.\u201d","cue":"tub clamped under one arm","prompt":"Which voice does the reply come from?","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"Hurt, defensive and wanting credit for the washing: that is the Kid. You asked from your Pilot, and a different voice answered, so the volley is cut and the bibs stay lost.","traps":{"0":"The Boss would say \u201cIt's on the list in the group chat. Read it before you ask.\u201d That is a ruling, and it closes the question.","1":"The Pilot would say \u201cSunday's lot took them. I'll ask in the chat.\u201d That answers your question, so the volley would stay matched."},"example":"A kitchen, a woman asks her husband where the spare keys are: \u201cWhy is it always me you ask? I have a job too.\u201d<br>She asked a plain question and got a complaint back."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Your line to Joseph, then his reply, outside the hall","text":"You said: \u201cI counted too. Fourteen short, and the hall wants it Monday.\u201d He said: \u201cRight. Pockets out by Monday, everyone, and I mean everyone.\u201d Why did the talk about the fees stop there?","prompt":"What is the best explanation?","options":["He was in a hurry, and any hurried reply ends a volley, whoever sends it and however well it is matched.","His order came from another voice than the one you spoke to, so the volley was cut.","You both stayed on the topic of money, and two people on one topic always run out of things to say."],"answer":1,"why":"You spoke to the part of him that does sums, but his reply came from a different voice, so the arrows went across each other and the volley stopped. The speed did not matter.","traps":{"0":"A hurried reply from the right voice would have kept the volley going. Speed has nothing to do with it.","2":"Two people can stay on one topic for hours if each reply comes from the voice that was spoken to. The stall came from which voice answered."},"example":"A call centre, a man asks about his bill and the agent says: \u201cPolicy is policy.\u201d<br>He spoke to her Pilot and her Boss answered, so the bill is never discussed."},{"type":"pick","who":"Joseph, five minutes later","text":"Joseph said: \u201cEveryone's always on at me about the tub. I do the whole booking and nobody says ta.\u201d His line came from his Kid and landed on your Boss. You want the loop to stop.","prompt":"Which reply is a cut?","options":["The Pilot: \u201cThanks for the booking. Can we sort the fourteen on Monday?\u201d","The Boss: \u201cWell, you did lose the bibs, so stop moaning.\u201d","The Boss, kindly: \u201cI know it's a lot, Joseph, but the tub still has to be full by Monday.\u201d"],"answer":0,"why":"His line landed on your Boss, so a reply from your Boss is matched. Your Pilot is a different voice, so the reply is a cut, and the loop stops without anyone giving in.","traps":{"1":"The Boss reply is matched. It answers from the voice Joseph addressed, hands him a new complaint to answer, and the loop runs on.","2":"The kind Boss reply is still matched. It sounds gentle, but it comes from the voice he addressed, so it keeps the loop running."},"example":"A shared office, a man to his colleague about the kettle rota: \u201cNobody ever thanks me for the washing up.\u201d<br>\u201cThanks for doing it. Shall we do Mondays together?\u201d The reply comes from a different voice, so the grumble ends."}]}]},{"setting":"Family","blurb":"Gran has a council letter, Mum is on the phone, and lunch is drying out downstairs.","opener":{"setting":"Sunday, 13:10, Gran's kitchen downstairs at Hawthorn Court. Mum is on the phone, propped against the teapot. Leo is under the table with a tablet and the lamb is drying out in the oven.","lines":[{"who":"Gran","text":"\u201cRead it to me. It's been on the dresser since Tuesday, and nobody reads these letters for me.\u201d","cue":"holding the envelope at arm's length, glasses swinging on their string"},{"who":"Mum","text":"\u201cDid you eat? And don't let her carry that tray. She'll say she's fine.\u201d","cue":"her face tilted in the phone, Dad's television on mute somewhere behind her"}],"ask":"For each line, which voice sends it, and does the reply come back from the voice that was spoken to?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> you see a line and the reply to it. Work out which voice the reply comes from. If it comes from the voice that was spoken to, the volley is <b>matched<\/b> and keeps going. A reply from a different voice is a <b>cut<\/b>, and the conversation stops.","items":[{"type":"pick","who":"Mum, on the phone, replying after you said you had rice and an egg at twelve","text":"\u201cAn egg is not lunch. You will have a proper meal tonight, and I want a photo.\u201d","cue":"the television flickering behind her","prompt":"Which voice does the reply come from?","options":["The Kid","The Boss","The Pilot"],"answer":1,"why":"A rule with a deadline and a demand for proof: that is the Boss. You gave a plain fact from your Pilot, and a different voice answered, so the volley is cut.","traps":{"0":"The Kid would say \u201cI worry so much I can't sleep, and you never tell me anything.\u201d That is a plea, and it would leave you comforting her instead of finishing lunch.","2":"The Pilot would say \u201cAn egg is fine for lunch. Did you buy bread this week?\u201d That answers your fact, so the volley would stay matched."},"example":"A phone call, a father to his daughter at university: \u201cI had toast.\u201d<br>\u201cToast is not breakfast. Send me a photo of a real meal tonight.\u201d She gave a fact and got a rule."},{"type":"pick","who":"Gran, replying after you read out the date on the letter","text":"\u201cOh, they won't want to come out for an old woman. Tell them not to bother.\u201d","cue":"folding the letter smaller each time","prompt":"Which voice does the reply come from?","options":["The Boss","The Pilot","The Kid"],"answer":2,"why":"Small, apologetic and asking to be talked out of it: that is the Kid. You read out a date, which is information, and a different voice answered. The volley is cut and the date goes unmentioned.","traps":{"0":"The Boss would say \u201cEight is far too early. They can come after ten, and you tell them I said so.\u201d That is a ruling, and it would leave you carrying a message.","1":"The Pilot would say \u201cThe ninth is Thursday. I'll move the doctor.\u201d That answers your date, so the volley would stay matched."},"example":"A chemist's counter, a pharmacist says the tablets will be ready Thursday: \u201cOh, don't go to any trouble for me.\u201d<br>He gave a day and got an apology back."},{"type":"pick","who":"Leo, under the table, replying after you said lunch was ready","text":"\u201cFive more minutes! I'm nearly through the level!\u201d","cue":"not looking up, thumbs still going","prompt":"Which voice does the reply come from?","options":["The Kid","The Boss","The Pilot"],"answer":0,"why":"A whine with a bargain in it is the Kid. Your line was a call to the part of him that gets told what to do, and that part answered. It is matched, so it could go round until the lamb turns to leather.","traps":{"1":"The Boss would say \u201cGran said screens till two, and it's one thirty, so that's the rule.\u201d That is quoting a rule at you, and a different voice from the one you called.","2":"The Pilot would say \u201cThe level saves in four minutes. I'll come straight after.\u201d That is calm and exact, and it is not how an eight-year-old sounds mid-level."},"example":"A park, a mother calls her son off the swings: \u201cTime to go.\u201d<br>\u201cFive more minutes!\u201d He answers from the part of him that was told what to do."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"pick","who":"You, to Gran, with the letter flat on the table","text":"\u201cGran, shall I ring the heating line from my phone and book the engineer?\u201d","cue":"level voice, pen ready","prompt":"Which voice of Gran's should answer?","options":["The Boss","The Kid","The Pilot"],"answer":2,"why":"You asked from your Pilot and the question is practical, so a matched reply comes from her Pilot: \u201cYes, ring. The number is at the bottom.\u201d That voice can accept help as a plain arrangement.","traps":{"0":"The Boss would say \u201cI kept this house warm for forty years without anyone ringing for me.\u201d That is a cut: her Boss answering a question meant for her Pilot.","1":"The Kid would say \u201cDon't trouble yourself. I'll sit here in my coat, I'm used to it.\u201d That is a cut too, and now you have to talk her into being helped."},"example":"A garden fence, a neighbour offers to ring the plumber: \u201cYes please, it's the number on the card.\u201d<br>The answer comes from the voice that was asked, so the job gets done."},{"type":"pick","who":"Mum, on the phone, as you lift the tray","text":"\u201cGo on, tell me I'm fussing again. Everyone else does.\u201d","cue":"voice wobbling, the television still flickering behind her","prompt":"You want this to stop and still settle half-term. Which of your voices answers?","options":["The Pilot","The Boss","The Kid"],"answer":0,"why":"Her line came from her Kid and landed on your Boss. To stop the loop you answer from a different voice, so the arrows cross. The Pilot does that and keeps half-term in play: \u201cThe tray is fine, Mum. Can I ring you at four about half-term?\u201d","traps":{"1":"The Boss would say \u201cYou are fussing, Mum. Gran has carried that tray for years.\u201d That is matched, so it keeps the same Boss-to-Kid loop going.","2":"The Kid would say \u201cSorry, Mum, you're right, I'll ring more.\u201d That is a cut too, but it stops the call by giving in, and half-term never gets a time."},"example":"A hospital corridor, a daughter to her father on the phone: \u201cGo on, tell me I'm being silly.\u201d<br>\u201cIt's five o'clock, Dad. Shall I call after tea?\u201d The reply comes from a different voice, so the loop stops."},{"type":"pick","who":"Mrs Kale, in the doorway, after you asked what the council letter means","text":"\u201cIt means they want to catch her out. Ring nobody, sign nothing.\u201d","cue":"pointing her stick at the envelope","prompt":"Which voice does the reply come from?","options":["The Kid","The Boss","The Pilot"],"answer":1,"why":"A flat ruling that closes the question is the Boss. You asked from your Pilot, so a matched reply would have been an answer. Her Boss answered instead, so the volley is cut and the letter is still unread.","traps":{"0":"The Kid would say \u201cI couldn't say, dear, they never tell us anything. I'm sorry.\u201d That is an apology with no answer in it.","2":"The Pilot would say \u201cA visit, I think. The ninth is on the second page.\u201d That is an answer from the voice you asked, so the volley would stay matched."},"example":"A shop, a customer asks if the coat comes in blue: \u201cThey never do.\u201d<br>He asked a plain question and got a ruling."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Your line to Gran, then her reply, in her kitchen","text":"You said: \u201cIt says the engineer comes on the ninth, between eight and twelve.\u201d She said: \u201cOh, they won't want to come out for an old woman. Tell them not to bother.\u201d Why did the booking go no further?","prompt":"What is the best explanation?","options":["You gave her too much to take in at once, so she had nothing she could answer.","You both spoke as the Pilot, and two Pilots in one kitchen always run out of things to say.","Her reply came from a different voice than the one you spoke to, so the volley was cut."],"answer":2,"why":"You read out a date to her Pilot, but the reply came from her Kid, so the arrows crossed and the volley stopped. The date never got a yes or no.","traps":{"0":"A date and a time window is not too much. A short reply from the right voice would have kept the volley going.","1":"Two Pilots can keep a volley going for a long time. Her Pilot never answered: another voice did."},"example":"A station, a man tells his mother the train is at ten: \u201cOh, don't worry about me, I'll sit here.\u201d<br>His plain fact got an apology instead of a yes."},{"type":"pick","who":"Mum, on the phone, as you lift the tray","text":"Mum's line came from her Kid and landed on your Boss: \u201cGo on, tell me I'm fussing again. Everyone else does.\u201d The loop is hers to keep going.","prompt":"Which reply is matched, so the loop runs on?","options":["The Pilot: \u201cThe tray is fine, Mum. Can I ring you at four about half-term?\u201d","The Boss: \u201cYou are fussing, Mum. Gran has carried that tray for years.\u201d","The Kid: \u201cSorry, Mum, you're right, I'll ring more.\u201d"],"answer":1,"why":"Her line landed on your Boss, so a reply from your Boss is matched. It hands her something to be hurt by, and the loop runs on.","traps":{"0":"The Pilot reply is a cut. It comes from a different voice than the one she addressed, so the loop stops.","2":"The Kid reply is a cut as well. It ends the call by giving in, which is still a different voice from the one she addressed."},"example":"A kitchen phone, a son to his mother: \u201cTell me I'm hopeless, go on.\u201d \u201cYou are, a bit. Wash your shirt.\u201d<br>The reply comes from the voice that was addressed, so the same row can start again next week."}]}]},{"setting":"Relationships","blurb":"Clara has sat on Omar's text since Tuesday, and the second date is at half seven.","opener":{"setting":"Friday, 18:25, The Corner Table. Clara has had Omar's text open on her phone since Tuesday. The second date is at 19:30 and she has not answered it.","lines":[{"who":"Clara","text":"\u201cHe put no pressure at the end of it. Who does that? That is all the pressure.\u201d","cue":"turning the phone face down, then face up again"},{"who":"Clara","text":"\u201cSay something useful. You're good at useful.\u201d","cue":"pushing a cold flat white an inch towards you"}],"ask":"For each line, which voice sends it, and does the reply come back from the voice that was spoken to?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>How this one works:<\/b> you see a line and the reply to it. Work out which voice the reply comes from. If it comes from the voice that was spoken to, the volley is <b>matched<\/b> and keeps going. A reply from a different voice is a <b>cut<\/b>, and the conversation stops.","items":[{"type":"pick","who":"Clara, replying after you said the text came in on Tuesday and a one-line answer would do","text":"\u201cI can't send something throwaway. It has to be right, so I'll draft it properly tonight.\u201d","cue":"smoothing a napkin flat with her thumb","prompt":"Which voice does the reply come from?","options":["The Boss","The Kid","The Pilot"],"answer":0,"why":"\u201cIt has to be right\u201d is a rule with no gap in it, and \u201ctonight\u201d is already too late. That is the Boss. You gave her a plain fact from your Pilot, and a different voice answered, so the volley is cut.","traps":{"1":"The Kid would say \u201cI know, I'm hopeless at this, sorry you have to sit here.\u201d That is an apology, and it would put you in charge of comforting her.","2":"The Pilot would say \u201cFine. Seven thirty works, and I'll bring an umbrella. Send.\u201d That answers your fact, so the volley would stay matched."},"example":"A kitchen table, a student asks his sister to just email the tutor: \u201cI can't send a throwaway. I'll redraft it tonight.\u201d<br>He asked from his Pilot and she answered from her Boss, so the email stays unsent."},{"type":"pick","who":"Clara, replying after you said: \u201cJust send it. Stop being silly.\u201d","text":"\u201cI know, I know. I'm being ridiculous. Sorry.\u201d","cue":"laughing too loud","prompt":"Which voice does the reply come from?","options":["The Pilot","The Kid","The Boss"],"answer":1,"why":"Your line was an order, aimed at the part of her that gets told off, and that part answers: quick, apologetic, a bit small. That is the Kid. The volley is matched, so your next push gets her next sorry.","traps":{"0":"The Pilot would say \u201cIt's 18:31. Eleven words and I'm done.\u201d That is a plan, and it is not what you heard.","2":"The Boss would say \u201cSilly? You try answering someone who writes no pressure.\u201d That fights back from a voice you did not address, so it would be a cut."},"example":"A landing, a mother to her son who will not tell the head about a lost jumper: \u201cJust go and ask. Stop being silly.\u201d<br>\u201cI know, I'm sorry, I'm being stupid.\u201d He answers from the part of him that was told off."},{"type":"pick","who":"Omar, at the door, replying after you said she has been rewriting the text since Tuesday","text":"\u201cI did wonder. If she'd said Friday, I'd have said Friday. She only had to ask.\u201d","cue":"unwinding his scarf, quite level","prompt":"Which voice does the reply come from?","options":["The Kid","The Boss","The Pilot"],"answer":2,"why":"Plain, a little rueful, with an answer inside it: that is the Pilot. You offered a fact and the voice that handles facts answered, so the volley is matched.","traps":{"0":"The Kid would say \u201cOh. So I did something wrong. I always read these things wrong.\u201d That is hurt, and you would have to talk him down.","1":"The Boss would say \u201cShe should have said so on Tuesday. That's how it works, you tell someone when it's too much.\u201d That is a rule, and it would close the subject."},"example":"A pavement, a woman tells a friend her sister has been avoiding the invitation: \u201cI wondered. If she'd said no, I'd have asked someone else.\u201d<br>The friend answers plainly, so the talk keeps going."}]},{"level":"Play","label":"Play, the week in motion","items":[{"type":"pick","who":"You, to Clara, as the clock passes 18:40","text":"\u201cHe booked the noodle place. You like that place, don't you?\u201d","cue":"tapping the table once, keeping it light","prompt":"Which voice of Clara's should answer?","options":["The Kid","The Pilot","The Boss"],"answer":1,"why":"You asked from your Pilot and the question is a simple preference, so a matched reply comes from hers: \u201cI do. Their broth is the only thing I'd eat on a Friday.\u201d That voice can say what she likes without earning it.","traps":{"0":"The Kid would say \u201cHe picked a place I like? Nobody does that. I don't deserve it.\u201d That is a cut, and you would be talking her out of a verdict nobody gave.","2":"The Boss would say \u201cHe shouldn't book without asking. It's presumptuous on a second date.\u201d That is a cut too, and it turns a kind gesture into a rule broken."},"example":"A birthday card shop, a friend asks if the blue card is her mother's favourite: \u201cIt is, she loves a blue one.\u201d<br>The answer comes from the voice that was asked, so the choice is made."},{"type":"pick","who":"Clara, to you, thumb over the send button","text":"\u201cGo on, tell me I've ruined it. You will anyway.\u201d","cue":"laughing too loud, not looking up","prompt":"You want this to stop and still get the reply sent. Which of your voices answers?","options":["The Boss","The Kid","The Pilot"],"answer":2,"why":"Her line came from her Kid and landed on your Boss. To stop the loop you answer from a different voice, so the arrows cross. The Pilot does that and gets the text written: \u201cIt's 18:45 and the table is at half seven. Shall we write it together?\u201d","traps":{"0":"The Boss would say \u201cYou've left him waiting five days, so yes, a bit.\u201d That is matched, so it keeps the same Boss-to-Kid loop going.","1":"The Kid would say \u201cSorry, no, you've ruined nothing, forget I said it.\u201d That is a cut too, but it ends the moment by giving in, and the text never leaves the phone."},"example":"A bakery queue, a girl to her brother before a call to their aunt: \u201cGo on, tell me I'll mess it up.\u201d<br>\u201cIt's ten past. Shall we ring her together?\u201d The reply comes from a different voice, so the teasing stops."},{"type":"pick","who":"Omar, replying after Clara asked him if half seven was still on","text":"\u201cIt's booked for seven thirty. If you'd rather cancel, tell me by seven.\u201d","cue":"tight smile, checking his watch","prompt":"Which voice does the reply come from?","options":["The Boss","The Pilot","The Kid"],"answer":0,"why":"A clipped rule with a time limit is the Boss. She asked from her Pilot, so a matched reply would have been a plain yes. His Boss answered, so the volley is cut, and the real question underneath goes unspoken.","traps":{"1":"The Pilot would say \u201cHalf seven, yes. I'll wait outside the entrance.\u201d That answers the question from the voice she asked, so the volley would stay matched.","2":"The Kid would say \u201cI hope so. Sorry, I'm probably getting this wrong, I'd hate to put you off.\u201d That is a plea, and it would hand her the job of reassuring him."},"example":"A phone call, a woman asks her landlord if the plumber is still coming Tuesday: \u201cHe's booked. Tell me by Monday if that's changed.\u201d<br>She asked a plain question and got a rule."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Your line to Clara, then her reply, at the Corner Table","text":"You said: \u201cJust send it. Stop being silly.\u201d She said: \u201cI know, I know. I'm being ridiculous. Sorry.\u201d The arrows match. Why is this likely to keep running?","prompt":"What is the best explanation?","options":["Her reply came from the voice you spoke to, so the volley stays matched and can run on.","She said sorry, and a sorry always makes the other person stop and think about what they said.","You spoke from your Pilot, and a Pilot's line always draws a nervous answer from the other person."],"answer":0,"why":"Your line was aimed at the part of her that gets told off, and that part answered. When each reply comes from the voice that was addressed, the volley can run on, and your next scolding gets her next apology.","traps":{"1":"A sorry can come from the voice that was addressed and keep a volley going. It stops nothing by itself.","2":"You spoke from your Boss, not your Pilot. The Pilot's lines can draw calm answers as easily as nervous ones."},"example":"A group chat, a sister writes \u201cJust reply to Mum, stop being silly.\u201d Her brother: \u201cI know, I know, I'm sorry.\u201d<br>He answers from the voice that was told off, so the two of them can go round again next week."},{"type":"pick","who":"Clara, before she presses send","text":"Her line came from her Kid and landed on your Boss: \u201cGo on, tell me I've ruined it. You will anyway.\u201d You want the loop to stop.","prompt":"Which reply is a cut?","options":["The Boss: \u201cYou've left him waiting five days, so yes, a bit.\u201d","The Boss, kindly: \u201cYou haven't ruined it, but you do have to answer him tonight.\u201d","The Pilot: \u201cIt's 18:45. Let's write it together and be done by seven.\u201d"],"answer":2,"why":"Her line landed on your Boss, so a reply from your Boss is matched. Your Pilot is a different voice, so the reply is a cut, and the loop stops without anyone giving in.","traps":{"0":"The Boss reply is matched. It answers from the voice she addressed, so it hands her a new scolding to answer, and the loop runs on.","1":"The kind Boss reply is still matched. It sounds gentle, but it comes from the voice she addressed, so the loop keeps going."},"example":"A hallway, a boy to his dad about a bad drawing: \u201cGo on, say it's rubbish.\u201d \u201cIt's quarter to eight. Shall we finish the sky?\u201d<br>The reply comes from a different voice, so the loop breaks."}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://claude.ai/artifact/FzdEytVBojsBteGVMXXV4K","next":{"slot":"3.2","title":"Keep It Going","url":"https://claude.ai/artifact/Bq2wTtJbNR58JADVMzx4p6"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: MULTI ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
