<style>

  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }

  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }

  .sort-item { margin: 0 0 16px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }

  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }

  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;

  }

  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),

  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }

<script>window.TA_GAME = {"slot":"6.3","setting":"Family","title":"A Child's Hidden No","world":6,"worldName":"The Story You Wrote","week":6,"weekName":"The Story You Wrote","mechanic":"Diagnose","concept":"After this one you can read a childhood scene for the Don't a child would take from it, and say which permission would counter it.","plainWord":"the Don'ts","bookTerm":"Injunctions","bookIdea":"Injunctions are Don'ts that come from the parent's own Child, often through what the parent does rather than what they say, and each one needs its own permission to counter it.","bookSource":"Scripts People Live, ch. 4, 6, 7 and 21; TA Today, ch. 14","opener":{"setting":"Saturday, 10:30am. Hawthorn Court, Gran's flat downstairs, the kitchen. Leo is on the stool by the window with a pencil.","lines":[{"who":"Gran","text":"\u201cSit there and draw. Don't touch the cooker, it's hot. It's always hot.\u201d","cue":"not turning round"},{"who":"Leo","text":"\u201cIt has twelve wheels. Nobody counts them.\u201d","cue":"holding the paper up to the window light"}],"ask":"Name the Don't a child would decode from each scene. Most of these scenes have only a few words."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each scene is from a childhood. Most of them have only a few words. Name the Don't the child is taking from the grown-up's hands and timing.","items":[{"type":"pick","who":"Leo, 8","text":"<i>He holds up a drawing of a bus with twelve wheels. Gran is at the pressure cooker and does not turn round. He folds the drawing in four and slides it under the newspaper.<\/i>","cue":"Saturday, 11:40am, Gran's flat downstairs, the kitchen","options":["Don't be important","Don't feel","Don't be close"],"answer":0,"why":"Nobody looks at the drawing, so he takes it back. There is no shouting and no crying. What he decides is that what he makes doesn't count, and that is don't be important. The permission that counters it is 'you may be important, and what you make can be looked at'.","traps":{"1":"It would be read as don't feel. A child told not to feel would be crying into the newspaper, and this clip has no tears. The drawing is what gets hidden.","2":"It would be read as don't be close. He is not moving away from Gran at all. What moves is the drawing, out from the table and under the newspaper."},"example":"An art wall at a school, Friday. A girl's painting is pinned at the bottom of the corridor, under three others. The next week she stops bringing her sketchbook in."},{"type":"pick","who":"A boy, six","text":"<i>He comes off his bicycle at the gate and grazes his knee. His lip shakes. Then his father picks the bicycle up, says \u201cUp you get,\u201d and checks the chain. The boy stops the lip.<\/i>","cue":"Thursday, 3:10pm, the school gate","options":["Don't feel","Don't succeed","Don't be close"],"answer":0,"why":"Nobody asks about the knee, and the lip is the first thing the boy stops. What he decides is that the feeling must not show, so the feeling goes. The permission that counters it is 'you may feel, and a grown-up can notice it with you'.","traps":{"1":"It would be read as don't succeed. Nothing in the clip is about a race or a win, only a fall and a chain that needs checking. Picking this sends the story somewhere the scene never goes.","2":"It would be read as don't be close. The father stands near enough to speak, so distance is not the message. The message is about the knee and the lip."},"example":"A cricket net, Sunday. A boy takes a ball on the shin and bites his lip. He says \u201cIt's nothing, play on,\u201d and the coach says nothing, so he bats on with a stiff leg."},{"type":"pick","who":"A girl, seven","text":"<i>She climbs onto the bus-stop bench and reaches for her mother's arm. Her mother holds the phone up, says \u201cNot now, I'm on a call,\u201d and turns her shoulder. The girl's arms come back down.<\/i>","cue":"Tuesday, 6:50pm, the bus stop by the market","options":["Don't belong","Don't be close","Don't be a child"],"answer":1,"why":"The reach is met with a turned shoulder, and the arms come down. The child decides that closeness isn't available right now, and she may decide it for good. That is don't be close. The permission that counters it is 'you may be close, and you can ask for it'.","traps":{"0":"It would be read as don't belong. The mother is only pulling away from the phone call, and nothing in the clip puts the girl outside the family.","2":"It would be read as don't be a child. The girl is not asked to be grown up. She is simply not held, and that is a different message."},"example":"A cookery class, Saturday. A boy asks the teacher to check his dough. She says \u201cFive minutes, I'm dealing with the ovens,\u201d and he stops asking for help for the rest of the class."}]},{"level":"Play","label":"Play, the week in motion","intro":"These are harder. The options sit close together, and the grown-up's words and actions point different ways. Ask what the child would take from the last thing that happened.","items":[{"type":"pick","who":"You, at six","text":"<i>You swing your school bag onto your back. Mum lifts it off and carries it on her own shoulder. You walk to the bus with nothing on your back, and she does not give it back.<\/i>","cue":"Monday, 7:20am, the lane outside the old house","options":["Don't grow up","Don't be a child","Don't be important"],"answer":0,"why":"Mum is not cross and she is not unkind. She is keeping you the size of a child, which is what the Don't says: don't grow up. Her worry is real, and the child decides that growing up is risky. The permission that counters it is 'you may grow up, and the bag is yours to carry'.","traps":{"1":"It would be read as don't be a child. This clip pulls the other way: you are being kept small, and nobody pushes you to grow up. Picking this would put the lesson on the wrong side of the bag.","2":"It would be read as don't be important. Mum is paying you close attention. The bag is taken because you are worth carrying for."},"example":"A group photo at a wedding, Sunday. An aunt takes a child's sandal off his foot and says \u201cStand still, you'll trip,\u201d every time he moves toward the cake."},{"type":"pick","who":"A girl, nine","text":"<i>She wins the ribbon at the science fair and is handed it in front of the class. It goes into her pocket before she looks up. Then she asks her teacher, in a small voice, whether it was only a small project.<\/i>","cue":"Friday, 1:30pm, the school hall","options":["Don't be important","Don't succeed","Don't think"],"answer":1,"why":"The win is real, and within a minute she has taken it back. The ribbon goes in the pocket and the project becomes 'only small'. The child decides that a success isn't safe to keep. The permission that counters it is 'you may succeed, and keep what you have won'.","traps":{"0":"It would be read as don't be important. She is being noticed, and she is the one who shrinks the moment. The clip is only about the win being undone. Nobody overlooks her.","2":"It would be read as don't think. Her teacher takes the project seriously, and nothing in the clip tells her to stop working things out. What goes wrong is her own decision to give the win back."},"example":"A running race, Saturday. A boy comes second, shakes the winner's hand, and says, \u201cLucky, really. He's faster on a bad day anyway.\u201d Then he gives his medal to his brother."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cLeo decided don't be important, and his drawing went under the newspaper. Which permission would counter that Don't?\u201d","cue":"turning her cup, looking at the window","options":["You may be important, and what you make can be looked at.","You may be important, so long as you're the good one and don't make a fuss.","Don't be important, but be useful to Gran."],"answer":0,"why":"The books call these injunctions. A permission is the answering message: a caring grown-up says you may do what the Don't forbade. The second option is a Must in disguise: it makes being important depend on being good. The third keeps the Don't and only adds a job for Gran.","traps":{"1":"Leo would hear that being important is a prize for being good and quiet. He would learn to hide his drawings until they were perfect, and the Don't would stay, with a condition on top.","2":"Leo would hear that his drawing doesn't count and that he can be useful instead. Gran would get a helper, and the bus with twelve wheels would stay under the newspaper."},"example":"A family WhatsApp group, Tuesday. A cousin posts a poem, and her mother replies, \u201cLovely, now do your homework.\u201d Nobody mentions the poem again. A real permission would be a reply that asks her to read it aloud."}]}],"debrief":{"nadia":"Most of those scenes had only a few words, and the child still got the message. A child reads the hands, the turned shoulder and the pause before the answer. The Don't is what the child decided it meant, and a permission is what could answer it later.","bookTerm":"Injunctions","bookNote":"The books call these injunctions: Don'ts that come from the parent's own Child, often without a word said, and each one needs its own permission to counter it."},"reflection":{"prompt":"Which Don't did you act on this week, and which grown-up did it sound like?"},"next":"6.4","baseStory":{"setting":"Family","blurb":"Leo draws a bus with twelve wheels in Gran's kitchen, and the grown-ups around him barely look up."},"moreStories":[{"setting":"Home & Flatmates","blurb":"Sam's mum has posted a shoebox from the loft, and the bin lorry comes at ten.","opener":{"setting":"Saturday, 9:48am. Hawthorn Court, apartment 3B, the kitchen. A shoebox sits on the table beside Maya's rota sheet.","lines":[{"who":"Sam","text":"\u201cIt's loft junk. Mum posted it with a note that says do what you like. I'll bin it before the lorry.\u201d","cue":"one elbow pressing the lid down"},{"who":"Maya","text":"\u201cTen minutes to the lorry, and you've never once made it. Open it. I'll read the backs.\u201d","cue":"pen resting on the rota, not writing"},{"who":"Sam","text":"\u201cSorry, it's only photos. There's nothing in there.\u201d","cue":"already lifting a corner"}],"ask":"Name the Don't a child would decode from each memory in the box. Most of them have only a few words."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each item is a memory out of the box or off the back of a photo. Most of them have only a few words. Name the Don't the child is taking from the grown-up's hands and timing.","items":[{"type":"pick","who":"Sam, 5","text":"<i>The back of the photo says \u201cCar park, September.\u201d In it, a boy reaches up for his mother's hand. She takes his hand, puts it in his coat pocket and says \u201cPockets, Sam.\u201d She goes on talking to the woman beside her. His hand stays in the pocket.<\/i>","cue":"Saturday, 12:15pm, a supermarket car park","options":["Don't be a child","Don't be close","Don't belong"],"answer":1,"why":"The reach for a hand is answered by putting the hand away, and it stays there. There is no scolding and no sound. What he decides is that wanting to be held is something to keep in a pocket, and that is don't be close. The permission that counters it is 'you may be close, and you can reach for it'.","traps":{"0":"It would be read as don't be a child. Nobody asks him to act older or to take on a grown-up's job. He is simply not held, and the picture is of a hand.","2":"It would be read as don't belong. He is on the outing with his mother, in the photo, and nobody is leaving him out. What he loses is the hand."},"example":"A hospital waiting room, Monday. A little girl leans against her dad's arm. He lifts it to check his watch and does not put it back. She sits up straight."},{"type":"pick","who":"Maya, 10","text":"<i>An exercise book lies open at long division. She asks her father why the answer is twelve. He takes the pencil, rubs out her working and says \u201cJust do it the way the book does.\u201d She copies the answer and does not ask again.<\/i>","cue":"Wednesday, 7:15pm, a kitchen table with a plastic cloth","options":["Don't think","Don't succeed","Don't be important"],"answer":0,"why":"Her question is answered with a rubber. The working she did herself goes, and the book's way stays. What she decides is that working things out for herself is unwelcome, and that is don't think. The permission that counters it is 'you may think, and your own working is worth keeping'.","traps":{"1":"It would be read as don't succeed. She gets the answer right in the end, and nobody blocks a win. What gets rubbed out is the thinking on the way.","2":"It would be read as don't be important. Her father sits with her, with the pencil in his hand, so she has his attention. It is her question that gets the rubber."},"example":"A bike repair, Saturday. A boy says \u201cI think the chain goes the other way.\u201d His uncle says \u201cHand it here, I know,\u201d and turns it back. Next time the boy waits to be told."},{"type":"pick","who":"Sam, 8","text":"<i>The photo is of a front window. Children are kicking a ball on the green outside. Sam's father pulls the curtain across and says \u201cWe keep ourselves to ourselves on this street.\u201d Sam stays on the sofa with the curtain between him and the green.<\/i>","cue":"Sunday, 4:00pm, a new house, the front room","options":["Don't feel","Don't be close","Don't belong"],"answer":2,"why":"The curtain goes across at the moment other children are in sight. Inside the house nothing is wrong. What Sam decides is that people like them stay out of the group outside, and that is don't belong. The permission that counters it is 'you may belong, and there is a place for you out there'.","traps":{"0":"It would be read as don't feel. He may well be sad, but nobody tells him to hide it. The message is about the ball on the green and where he is allowed to stand.","1":"It would be read as don't be close. His father is in the room and speaking to him. The shutting out is of the street and the other children."},"example":"A school coach trip, Thursday. A teacher says \u201cWe sit with our own class, thanks,\u201d when a boy waves at friends two rows up. He stops waving."}]},{"level":"Play","label":"Play, the week in motion","intro":"These are harder. The options sit close together, and the grown-up's words and actions point different ways. Ask what the child would take from the last thing that happened.","items":[{"type":"pick","who":"Sam, 10","text":"<i>Dad is away on the boats for the week. Sam does the washing-up before anyone asks. Mum looks at the clean rack and says \u201cLook at you. The man of the house.\u201d The next Saturday he skips football to put the shopping away.<\/i>","cue":"Saturday, 10:05am, the old kitchen","options":["Don't grow up","Don't be a child","Don't be important"],"answer":1,"why":"Mum is pleased, and her words are warm. The praise lands on the grown-up job and on nothing else, and by next week football has gone for it. What he decides is that being a child costs her something, and that is don't be a child. The permission that counters it is 'you may be a child, and the washing-up can wait for a grown-up'.","traps":{"0":"It would be read as don't grow up. That one keeps a child small, and this clip pulls the other way: he is made bigger than ten. Picking it puts the lesson on the wrong side of the rack.","2":"It would be read as don't be important. Mum notices him, names him and thanks him. He is important here, and what is asked of him is a job that is not a child's."},"example":"A school gate, Friday. A mother says to her six-year-old, \u201cYou're my sensible one, hold your sister's hand and don't let go.\u201d He walks the whole way with a stiff arm and does not look at the puddles."},{"type":"pick","who":"Maya, 12","text":"<i>She tells her mother that the new school frightens her. Her mother says \u201cNothing to be frightened of, you're a clever girl,\u201d fills the kettle and starts on the uniform list. Maya says \u201cYes, fine,\u201d and goes upstairs to iron the shirt twice.<\/i>","cue":"Sunday, 8:30pm, the kitchen","options":["Don't feel","Don't be important","Don't be close"],"answer":0,"why":"The words are kind, and the kettle is the real answer. The fear is told it has no reason, and Maya hands it back by ironing. What she decides is that fear is not to be shown, and that is don't feel. The permission that counters it is 'you may feel it, and a grown-up will sit with you'.","traps":{"1":"It would be read as don't be important. Her mother calls her clever and answers her at once. The fear is what gets waved past, and Maya is still heard.","2":"It would be read as don't be close. Her mother is a metre away at the kettle and talking to her. The distance is between the fear and the answer."},"example":"A swimming lesson, Tuesday. A boy says he does not want the deep end. His dad says \u201cThere's nothing to be scared of, look, your sister's in,\u201d and holds out the towel. The boy says nothing more."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Maya","text":"\u201cMum wrote 'man of the house' on the back of the card. Sam took don't be a child from it. Which permission would counter that Don't?\u201d","cue":"the lorry grinding past the window, the box still on the table","options":["You may be a child, once your jobs are done and the sheet is signed.","Don't be a child, but be a cheerful helper about it.","You may be a child, and the washing-up can wait for a grown-up."],"answer":2,"why":"The books call these injunctions. A permission is the answering message: a caring grown-up says you may do what the Don't forbade. The first option is a Must in disguise, because it makes childhood a prize for finishing the jobs. The second keeps the Don't and adds a smile.","traps":{"0":"Sam would hear that being a child is what you get at the end of the chores. The jobs never end, so the Don't would stay, with a condition on top.","1":"Sam would hear that he is still the little man and should be nice about it. Mum would get a cheerful helper, and the football boots would stay in the cupboard."},"example":"A family chat, Wednesday. A sister writes, \u201cYou can come to my party once you've sorted Mum's shopping.\u201d A real permission would read, \u201cCome to the party. The shopping can wait, or I'll do it.\u201d"}]}]},{"setting":"Friends & Community","blurb":"Nadia's Sunday group trades childhood cards while Joseph's birthday cake melts in Ruby's van.","opener":{"setting":"Sunday, 4:10pm. The Corner Table, the back table. Nadia has a stack of index cards face down between the cups.","lines":[{"who":"Ruby","text":"\u201cJoseph's cake is in the van with the heater on. Can we do two cards and sing?\u201d","cue":"keys already in her fist"},{"who":"Joseph","text":"\u201cI'll read mine last. Or at the party, if there is one.\u201d","cue":"turning his card over and back again"},{"who":"Nadia","text":"\u201cPeter first. Read it as it happened, with nothing added.\u201d","cue":"tapping the top card"}],"ask":"Name the Don't a child would decode from each card. Most of them have only a few words."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each item is a scene from a card in Nadia's stack, read out by someone in the group. Most of them have only a few words. Name the Don't the child is taking from the grown-up's hands and timing.","items":[{"type":"pick","who":"Peter, 9","text":"<i>He runs home with the news that he is in the school relay team. His father is up a ladder at the gutter and says \u201cHold the ladder.\u201d When Peter finishes his news, his father says \u201cDon't get ideas.\u201d Peter holds the ladder until it is dark and never mentions the team again.<\/i>","cue":"Tuesday, 5:30pm, the side of a house","options":["Don't be close","Don't feel","Don't succeed"],"answer":2,"why":"The news of a place on the team is answered with a warning, and the team is never spoken of again. What Peter decides is that doing well brings trouble and is better kept quiet, and that is don't succeed. The permission that counters it is 'you may succeed, and you can say so out loud'.","traps":{"0":"It would be read as don't be close. He is standing next to his father, holding the ladder and doing the job. The message is about the team, and Peter stays near.","1":"It would be read as don't feel. Nobody tells him to hide a feeling. He tells his news freely, and the answer is a warning about ideas."},"example":"A cake stall, Saturday. A girl sells out by noon. Her uncle says \u201cDon't let it go to your head, it's only buns,\u201d and counts the tin. She bakes half as many next week."},{"type":"pick","who":"Ruby, 7","text":"<i>She plays a tree with one line in the school play and says it clearly. Her mother, in the third row, holds up her phone and films the boy beside her, who is the lead. In the car she says \u201cLovely, that was long, wasn't it?\u201d Ruby stops practising her line in the bath.<\/i>","cue":"Thursday, 7:40pm, a school hall","options":["Don't think","Don't be important","Don't succeed"],"answer":1,"why":"Her moment is on the stage and her mother's phone is pointed somewhere else. Nobody says a hard word. What Ruby decides is that she is not the one to be looked at, and that is don't be important. The permission that counters it is 'you may be important, and someone will watch you do it'.","traps":{"0":"It would be read as don't think. Nothing she works out is overruled. She says her line well, and it is the looking that goes elsewhere.","2":"It would be read as don't succeed. She does the line well and nobody punishes her for it. What is missing is anybody watching her do it."},"example":"A parents' evening, Monday. A father reads his messages while the teacher talks about his daughter's project, then asks about his son's. She brings the project home less."},{"type":"pick","who":"Hannah, 8","text":"<i>At her grandmother's funeral she starts to cry in the second pew. Her aunt walks her out to the porch, wipes her face with a tissue and says \u201cNot in there. We don't do that in front of people.\u201d She goes back in dry-eyed and holds the order of service flat on her knee.<\/i>","cue":"Saturday, 11:20am, a church porch","options":["Don't feel","Don't be a child","Don't belong"],"answer":0,"why":"The tears are handled with a tissue and a rule, and she goes back in dry. What Hannah decides is that a feeling has to be shown to no one, and that is don't feel. The permission that counters it is 'you may feel, and grief can be seen'.","traps":{"1":"It would be read as don't be a child. She is not asked to act grown up or to take on a job. The message is about the tears, and the fix is a rule about faces.","2":"It would be read as don't belong. She is brought back to her pew, among the family. What gets edited is what her face is allowed to do."},"example":"A hospital corridor, Sunday. A boy of seven starts to cry about his grandad. His father says \u201cBig breath, we're in public,\u201d and straightens the boy's collar. The tears stop."}]},{"level":"Play","label":"Play, the week in motion","intro":"These are harder. The options sit close together, and the grown-up's words and actions point different ways. Ask what the child would take from the last thing that happened.","items":[{"type":"pick","who":"Hannah, 16","text":"<i>She asks to take the train to her cousin's, an hour away. Her mother says \u201cOh, poppet, you're not ready for that,\u201d and drives her instead, the way she did at ten. They talk on the way about what to eat.<\/i>","cue":"Saturday, 8:00am, the car outside the station","options":["Don't be a child","Don't grow up","Don't succeed"],"answer":1,"why":"Mum's love is plain, and so is the lift. A sixteen-year-old is kept the size of ten, and the train stays out of reach. What Hannah decides is that growing up is a risk her mother cannot bear, and that is don't grow up. The permission that counters it is 'you may grow up, and the train is yours to take'.","traps":{"0":"It would be read as don't be a child. That one pushes a child to act older. Here the pull runs the other way, and nobody asks Hannah to be more than ten.","2":"It would be read as don't succeed. Nothing about winning or failing is in the clip. The lift is protection, and what it blocks is the train."},"example":"A holiday dinner, July. A father cuts his fifteen-year-old's chicken 'to save time'. She lets him and eats it."},{"type":"pick","who":"Joseph, 10","text":"<i>Joseph's card is the last one. At his first training session the coach hands out bibs and gives him none. \u201cSit by the bench for now, we'll see.\u201d His mother waves from the car park. The next week the kit bag stays in the cupboard under the stairs.<\/i>","cue":"Tuesday, 6:15pm, a muddy pitch behind the leisure centre","options":["Don't be close","Don't be important","Don't belong"],"answer":2,"why":"Everyone else is given a bib and he is told to wait at the side. His mother's wave is the one welcome in the picture. What he decides is that this is a place where he is not wanted, so the bag goes in the cupboard. That is don't belong. The permission that counters it is 'you may belong here, and a place on the pitch is yours'.","traps":{"0":"It would be read as don't be close. His mother is waving from the car park and nobody pushes her away. The distance is between him and the team.","1":"It would be read as don't be important. The coach is not ignoring him, and even says 'we'll see'. What goes wrong is where he is told to stand."},"example":"A first day at a new job, Monday. A woman is shown the desk by the printer while everyone else sits in a block. \u201cYou'll be here for now.\u201d She eats lunch at that desk all week."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cJoseph hasn't come to five-a-side for a month. If he took don't belong from the bench, which permission would counter that Don't?\u201d","cue":"setting the card face up, the candles in the van beginning to smell of warm wax","options":["You may belong here, and the place is yours already.","You may belong, once you've turned up for a month of Tuesdays.","Don't belong on the bench, but stand with us by the touchline."],"answer":0,"why":"The books call these injunctions. A permission is the answering message: a caring person says you may do what the Don't forbade. The second option is a Must in disguise, because it makes a place something you earn by attendance. The third keeps the Don't and only moves where he is allowed to stand.","traps":{"1":"Joseph would hear that a place is a prize for a good record. He would count his weeks, and the first one he missed would put him back on the bench.","2":"Joseph would hear that he still does not belong on the team, only near it. Ruby would get a spectator, and the kit bag would stay in the cupboard."},"example":"A book club WhatsApp group, Tuesday. A newcomer writes, \u201cIs it all right if I come?\u201d Someone replies, \u201cYes, once you've read the last six.\u201d A real permission would be, \u201cYes. Bring whatever you've read.\u201d"}]}]},{"setting":"Relationships","blurb":"A second date for Omar and Clara, and a text she read nine times.","opener":{"setting":"Thursday, 8:05pm. A noodle place with a queue to the door, two days after the text. Omar and Clara are standing under the heater.","lines":[{"who":"Clara","text":"\u201cI read your message nine times and answered none of them. I kept rewriting it until it was right, and then it was Thursday.\u201d","cue":"reading the menu in the window instead of looking at him"},{"who":"Omar","text":"\u201cA thumbs-up would have done. I was only asking if you wanted noodles.\u201d","cue":"easy, hands in his coat pockets"},{"who":"Clara","text":"\u201cThen it should have been simple. That's what bothers me.\u201d","cue":"the heater ticking above them"}],"ask":"Name the Don't a child would decode from each memory they swap in the queue. Most of them have only a few words."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each item is a memory one of them tells while the queue moves. Most of them have only a few words. Name the Don't the child is taking from the grown-up's hands and timing.","items":[{"type":"pick","who":"Clara, 8","text":"<i>Her little brother cries at the airport barrier. Her mother pushes the passports and the bag into Clara's hands: \u201cYou're the sensible one, hold these.\u201d Clara's own eyes were wet. She blinks, checks the gate number twice and stands up straight.<\/i>","cue":"Saturday, 5:20am, the departures hall","options":["Don't be a child","Don't be close","Don't belong"],"answer":0,"why":"Her mother is under pressure and hands Clara a job. Clara's was the second pair of wet eyes in the family, and it is the one that dries first. What she decides is that she must be older than she is, and that is don't be a child. The permission that counters it is 'you may be a child, and someone else will hold the passports'.","traps":{"1":"It would be read as don't be close. Her mother is standing right beside her and speaking to her. The message is in the job she is given, and the child stays near.","2":"It would be read as don't belong. She is on the holiday, in the family, and trusted with the passports. Nobody is sending her out."},"example":"A funeral lunch, Saturday. A grandmother says to a nine-year-old, \u201cYou pour the tea, you're the grown-up of the three,\u201d and nobody asks if he wants a biscuit."},{"type":"pick","who":"Omar, 6","text":"<i>He asks where the family dog went. His uncle says \u201cDogs go. Eat your dinner.\u201d Omar eats his dinner. He does not ask again, and the lead stays on its hook by the door for a year.<\/i>","cue":"Sunday, 6:30pm, his uncle's kitchen","options":["Don't think","Don't be a child","Don't feel"],"answer":2,"why":"A question about a loss gets a plate. Nobody is harsh, and the question stops. What he decides is that sadness has no place at the table, and that is don't feel. The permission that counters it is 'you may feel it, and a grown-up will say the dog's name'.","traps":{"0":"It would be read as don't think. He is allowed to ask what he likes. It is the loss under the question that gets turned into dinner.","1":"It would be read as don't be a child. He is not given a job or asked to act older. He is six at a table and the sadness is sent away."},"example":"A garden, Sunday. A girl asks where the goldfish went. Her father says \u201cGone. Pass the salad,\u201d and she passes the salad."},{"type":"pick","who":"Omar, 12","text":"<i>It is his first morning in a new city. The teacher puts him at the empty desk by the radiator and says \u201cThis is Omar, he's come from somewhere else.\u201d Nobody sits next to him all week, and the teacher never moves the desk.<\/i>","cue":"Monday, 8:50am, a classroom with a radiator that ticks","options":["Don't be close","Don't belong","Don't feel"],"answer":1,"why":"A desk by the radiator and a label for where he comes from. The room has already decided where he sits. What he decides is that he is the outsider here, and that is don't belong. The permission that counters it is 'you may belong, and there is a desk for you in the middle'.","traps":{"0":"It would be read as don't be close. Nobody has pushed him away from a person, and no grown-up refuses his hand. The gap is between him and the class.","2":"It would be read as don't feel. Nobody tells him to hide anything. The desk and the label tell him where he stands."},"example":"A choir rehearsal, Wednesday. A conductor says to a new tenor, \u201cYou'll sit at the end, near the door, until we know you.\u201d He keeps his coat on."}]},{"level":"Play","label":"Play, the week in motion","intro":"These are harder. The options sit close together, and the grown-up's words and actions point different ways. Ask what the child would take from the last thing that happened.","items":[{"type":"pick","who":"Clara, 13","text":"<i>She tells her mother, once, about a boy she likes. Her mother laughs, kindly, and tells Auntie on the phone that evening in the voice for funny stories. Clara hears it from the stairs. After that she writes nothing down and tells no one anything.<\/i>","cue":"Friday, 9:10pm, the stairs","options":["Don't feel","Don't be important","Don't be close"],"answer":2,"why":"Her mother means it kindly and the laugh is warm. But the secret is passed on within hours and told as a funny story, and Clara closes up. What she decides is that telling a person what she cares about is unsafe, and that is don't be close. The permission that counters it is 'you may be close, and what you tell will be kept'.","traps":{"0":"It would be read as don't feel. She keeps the feeling and nobody tells her to stop having it. She stops telling, and that is a different decision.","1":"It would be read as don't be important. Her mother does notice her and answers her at once. What goes wrong is the phone call afterwards."},"example":"A group chat, Monday. A boy tells his best friend he is nervous about the audition. By lunch the whole class is doing his voice. After that he says 'fine' to everything."},{"type":"pick","who":"Omar, 14","text":"<i>He asks his mother, once, for a lift to a match across town. She says \u201cYou're the easy one, we never worry about you,\u201d and turns to deal with his sister. He takes two buses. After that he asks only for one small thing at a time, and always by name.<\/i>","cue":"Saturday, 12:40pm, the front step","options":["Don't be important","Don't be a child","Don't belong"],"answer":0,"why":"It is meant as a compliment, and it is also a list of what he does not need. His needs are not on the family's list, so he takes the buses. What he decides is that his asking should stay small, and that is don't be important. The permission that counters it is 'you may be important, and your asking will be answered'.","traps":{"1":"It would be read as don't be a child. His mother is not handing him a job. She is saying he needs nothing, and the cost is his asking, not his age.","2":"It would be read as don't belong. He is in the family and valued as the easy one. What drops out is his need for a lift."},"example":"A dinner table, Thursday. A mother says of her middle child, \u201cHe's no trouble,\u201d and his sister gets the second helping and the school-run chat. He stops mentioning the match."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Clara","text":"\u201cSo I took don't be close from the stairs. What would counter it, if I let myself hear it?\u201d","cue":"turning her phone over, the ninth draft still open","options":["You may be close, as long as you've checked it twice first.","You may be close, and you can send the unfinished one.","Don't be close to everyone, only to the people who've earned it."],"answer":1,"why":"The books call these injunctions. A permission is the answering message: a caring person says you may do what the Don't forbade. The first option is a Must in disguise, because it makes closeness depend on a perfect draft. The third keeps the Don't and only sorts who gets past it.","traps":{"0":"Clara would hear that being close is a prize for getting it right. She would write the tenth draft, and the Don't would stay, with a condition on top.","2":"Clara would hear that closeness has to be earned person by person. Omar would be sitting an exam, and the text would still be unanswered."},"example":"A friends' WhatsApp group, Sunday. Someone writes, \u201cSay it when it's finished.\u201d A real permission would be, \u201cSend it half-written. I'll take the first line.\u201d"}]}]}]};</script>
<script>window.TA_NAV = {"hub":"https://claude.ai/artifact/FzdEytVBojsBteGVMXXV4K","next":{"slot":"6.4","title":"Three Everyday Plans","url":"https://claude.ai/artifact/8yPoVaZnJyJqeeygNaEER8"}};</script>
<script>
(function () {
  "use strict";

  var GAME = window.TA_GAME;
  var NAV = window.TA_NAV || { hub: null, next: null };
  var card = document.getElementById("card");
  var STORE_KEY = "ta-arena-reflect-" + (GAME ? GAME.slot : "");

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open
  // tags are closed at the end of the field, so markup cannot leak into the card.
  function rich(s) {
    if (s === undefined || s === null) return "";
    var open = [];
    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";
      var m = /^<\s*(\/?)\s*([a-zA-Z]+)\s*(\/?)\s*>$/.exec(tok);
      if (!m) return "";
      var name = m[2].toLowerCase();
      var closing = m[1] === "/";
      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";
      if (closing) {
        if (open[open.length - 1] === name) { open.pop(); return "</" + name + ">"; }
        return "";
      }
      if (m[3]) return "";
      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  var VOICE = { parent: "p", adult: "a", child: "c" };
  function pill(label) {
    var key = String(label).trim().toLowerCase();
    var cls = Object.prototype.hasOwnProperty.call(VOICE, key) ? VOICE[key] : "x";
    return '<span class="pill ' + cls + '">' + rich(label) + '</span>';
  }

  function exchange(who, text, cue) {
    return '<div class="exchange"><p class="line"><span class="who">' + rich(who) + '</span>' +
      rich(text) + '</p>' + (cue ? '<p class="cue">' + rich(cue) + '</p>' : '') + '</div>';
  }

  function exampleBox(text) {
    return text ? '<div class="example"><div class="ex-label">Real example</div>' + rich(text) + '</div>' : "";
  }

  function nextbar(label) {
    return '<div class="nextbar"><button class="next" type="button">' + label + '</button></div>';
  }

  function bindNext(fn) {
    var b = card.querySelector(".nextbar button.next");
    if (b) b.addEventListener("click", function () { fn(); });
  }

  function shuffled(n) {
    var idx = [], i, j, t, attempt;
    for (i = 0; i < n; i++) idx.push(i);
    for (attempt = 0; attempt < 20; attempt++) {
      for (i = n - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      if (idx.some(function (v, p) { return v !== p; })) break;
    }
    return idx;
  }

  // Flat list of items across the three rounds; one progress segment each.
  // Each game can carry several settings (stories). The first is the file's own opener and
  // rounds; the rest come from GAME.moreStories. The lesson, debrief and reflection are shared.
  var STORIES = GAME ? [{
    setting: (GAME.baseStory && GAME.baseStory.setting) || GAME.setting || "",
    blurb: (GAME.baseStory && GAME.baseStory.blurb) || "",
    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;
  var ITEMS = [];
  var TOTAL = 0;
  function useStory(i) {
    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
    });
    TOTAL = ITEMS.length;
  }
  useStory(0);
  var MULTI = STORIES.length > 1;
  // If the hub's setting filter sent us here with ?setting=X and this game has that
  // setting, go straight into it instead of asking again on a "choose a setting" screen.
  var PRESET_STORY = -1;
  try {
    var wantSetting = new URLSearchParams(window.location.search).get("setting");
    if (wantSetting) {
      for (var si = 0; si < STORIES.length; si++) {
        if (STORIES[si].setting === wantSetting) { PRESET_STORY = si; break; }
      }
    }
  } catch (e) { /* URLSearchParams unsupported: fall through to the picker */ }
  if (PRESET_STORY >= 0) useStory(PRESET_STORY);
  var DONE_KEY = "ta-arena-done-" + (GAME ? GAME.slot : "");
  function readDone() {
    try { return JSON.parse(window.localStorage.getItem(DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markDone(i) {
    var d = readDone();
    if (d.indexOf(i) < 0) d.push(i);
    try { window.localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch (e) { /* blocked: fine */ }
    return d;
  }

  function progressHTML(done, current) {
    var bars = "";
    for (var i = 0; i < TOTAL; i++) {
      bars += '<i class="' + (i < done ? "done" : (i === current ? "current" : "")) + '"></i>';
    }
    return '<div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="' +
      TOTAL + '" aria-valuenow="' + done + '">' + bars + '</div>';
  }

  function paintProgress(done, current) {
    var old = card.querySelector(".progress");
    if (old) old.outerHTML = progressHTML(done, current);
  }

  function frame(k, body, showIntro) {
    var rec = ITEMS[k];
    var intro = showIntro && rec.round.intro ? '<p class="round-intro">' + rich(rec.round.intro) + '</p>' : "";
    return progressHTML(k, k) + '<div class="round-label" data-lv="' + esc(String(rec.round.label).split(/[ ,]/)[0].toLowerCase()) + '">' + rich(rec.round.label) + '</div>' + intro + body;
  }

  // ---------- flow ----------

  var state = { screen: (MULTI && PRESET_STORY < 0) ? "stories" : "intro", k: 0 };

  function settle() {
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: "start" });
    card.focus({ preventScroll: true });
  }

  function render() {
    if (state.screen === "stories") renderStories();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "item") renderItem(state.k);
    else if (state.screen === "debrief") renderDebrief();
    else if (state.screen === "reflect") renderReflect();
    else renderEnd();
    settle();
  }

  function advance() {
    if (state.screen === "intro") {
      state.screen = "item"; state.k = 0;
    } else if (state.screen === "item") {
      if (state.k + 1 < TOTAL) state.k += 1;
      else {
        var before = readDone().length;
        markDone(cur);
        state.screen = before > 0 ? "end" : "debrief";
      }
    } else if (state.screen === "debrief") {
      state.screen = "reflect";
    } else if (state.screen === "reflect") {
      state.screen = "end";
    }
    render();
  }

  function renderItem(k) {
    var it = ITEMS[k].item;
    if (it.type === "pick") renderPick(k, it);
    else if (it.type === "scene") renderScene(k, it);
    else if (it.type === "sort") { if (it.order === true) renderOrder(k, it); else renderBins(k, it); }
    else if (it.type === "counter") renderCounter(k, it);
    else advance();
  }

  function renderIntro() {
    var op = STORIES[cur].opener || {};
    var lines = (op.lines || []).map(function (ln) {
      return '<p class="line"><span class="who">' + rich(ln.who) + '</span>' + rich(ln.text) + '</p>' +
        (ln.cue ? '<p class="cue">' + rich(ln.cue) + '</p>' : "");
    }).join("");
    var rounds = (STORIES[cur].rounds || []).map(function (r) {
      var n = (r.items || []).length;
      return '<li><span class="dot"></span><span><b>' + rich(r.level) + '</b>, ' + n +
        (n === 1 ? ' item' : ' items') + '</span></li>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) +
      ' · Game ' + esc(GAME.slot) + (MULTI && STORIES[cur].setting ? ' · ' + esc(STORIES[cur].setting) : '') + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<p class="lede"><i>' + rich(op.setting) + '</i></p>' +
      '<div class="exchange">' + lines + '</div>' +
      '<div class="ask"><div class="kicker">The question</div><p>' + rich(op.ask) + '</p></div>' +
      '<div class="rules-box"><div class="round-label">How this one works</div>' +
      '<ul class="rules-list">' + rounds +
      '<li><span class="dot"></span><span>Feedback follows every answer, with a real example</span></li>' +
      '</ul></div>' +
      nextbar("Start the game →") +
      (MULTI ? '<div class="nextbar"><button class="linkbtn" type="button" id="otherSetting">← Choose another setting</button></div>' : "");
    bindNext(advance);
    bindOther();
  }

  function bindOther() {
    var b = card.querySelector("#otherSetting");
    if (b) b.addEventListener("click", goStories);
  }

  function goStories() {
    state.screen = "stories"; state.k = 0;
    render();
  }

  function renderStories() {
    var done = readDone();
    var cards = STORIES.map(function (st, i) {
      var ticked = done.indexOf(i) >= 0;
      return '<button class="choice story-card' + (ticked ? ' played' : '') + '" type="button" data-i="' + i + '">' +
        '<span class="story-top"><b>' + esc(st.setting || ("Story " + (i + 1))) + '</b>' +
        (ticked ? '<span class="played-tag">Played</span>' : '') + '</span>' +
        '<span class="story-blurb">' + rich(st.blurb || "") + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="tagline">You · World ' + esc(GAME.world) + ', ' + rich(GAME.worldName) + ' · Game ' + esc(GAME.slot) + '</div>' +
      '<div class="card-head"><div><h1>' + rich(GAME.title) + '</h1>' +
      '<p class="deck">' + rich(GAME.concept) + '</p></div>' +
      '<div class="case-no"><span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>' + esc(GAME.slot) + '<br>' + rich(GAME.weekName) + '</div></div>' +
      '<div class="ask"><div class="kicker">Choose a setting</div><p>Same idea, different people and places. Pick the one closest to your life, or play them all. ' +
      done.length + ' of ' + STORIES.length + ' played.</p></div>' +
      '<div class="choices">' + cards + '</div>';
    card.querySelectorAll("button.story-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        useStory(parseInt(btn.getAttribute("data-i"), 10));
        state.screen = "intro"; state.k = 0;
        render();
      });
    });
  }

  // ---------- pick ----------

  function renderPick(k, it) {
    var labels = it.options;
    card.innerHTML = frame(k,
      exchange(it.who, it.text, it.cue) +
      '<p class="prompt">' + rich(it.prompt || "Which one is it?") + '</p>' +
      '<div class="choices">' + labels.map(function (lab, i) {
        return '<button class="choice" type="button" data-i="' + i + '">' + pill(lab) + '</button>';
      }).join("") + '</div>', ITEMS[k].first);
    var buttons = card.querySelectorAll("button.choice");
    var answered = false;
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-i"), 10)); });
    });
    function choose(i) {
      if (answered) return;
      answered = true;
      var right = i === it.answer;
      buttons.forEach(function (b) { b.disabled = true; });
      buttons[it.answer].classList.add("correct");
      if (!right) buttons[i].classList.add("wrong");
      var body = right
        ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
          '<p class="feedback"><b>Why:</b> ' + rich(it.why) + '</p></div>'
        : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
          '<p class="feedback"><b>You picked ' + rich(labels[i]) + '.</b> ' +
          rich((it.traps || {})[String(i)]) + '</p>' +
          '<p class="feedback"><b>The right call is ' + rich(labels[it.answer]) + '.</b> ' +
          rich(it.why) + '</p></div>';
      var fb = document.createElement("div");
      fb.innerHTML = body + exampleBox(it.example) + nextbar("Continue →");
      card.appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }
  }

  // ---------- scene ----------

  var TAG_LABEL = { best: "Best move", ok: "Fair move", game: "Trap move" };
  var TAG_CLASS = { best: "ok", ok: "amber", game: "cross" };
  var TAG_PICK = { best: "correct", ok: "amber", game: "wrong" };
  var DEFAULT_FALLOUT = {
    you: "You have nothing left to give in this exchange, so the scene stops here.",
    them: "The other person has shut the conversation down, so the scene stops here."
  };

  function meterRow(key, label, v) {
    return '<div class="meter ' + key + (v <= 0 ? " empty" : "") + '">' +
      '<span class="name">' + label + '</span>' +
      '<span class="track"><span class="fill" data-m="' + key + '" style="width:' + v + '%"></span></span>' +
      '<span class="num" data-n="' + key + '">' + v + '</span></div>';
  }

  function meterHTML(m) {
    return '<div class="meters">' + meterRow("you", "You", m.you) + meterRow("them", "Them", m.them) + '</div>';
  }

  function setMeters(m) {
    ["you", "them"].forEach(function (key) {
      var fill = card.querySelector('.fill[data-m="' + key + '"]');
      var num = card.querySelector('.num[data-n="' + key + '"]');
      var row = card.querySelector(".meter." + key);
      if (fill) fill.style.width = m[key] + "%";
      if (num) num.textContent = String(m[key]);
      if (row) row.classList.toggle("empty", m[key] <= 0);
    });
  }

  function renderScene(k, sc) {
    var rec = ITEMS[k];
    var meters = { you: clamp(Number(sc.meters.you)), them: clamp(Number(sc.meters.them)) };
    var beats = sc.beats || [];
    var bi = 0;

    function drawBeat() {
      var b = beats[bi];
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="setting">' + rich(sc.setting) + '</p>' +
        meterHTML(meters) +
        '<p class="kicker">Beat ' + (bi + 1) + ' of ' + beats.length + '</p>' +
        exchange(b.who, b.text, b.cue) +
        '<div class="choices">' + b.lines.map(function (ln, i) {
          return '<button class="choice" type="button" data-i="' + i + '">' + rich(ln.text) + '</button>';
        }).join("") + '</div>', rec.first && bi === 0);
      var buttons = card.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { pick(parseInt(btn.getAttribute("data-i"), 10), buttons); });
      });
    }

    function pick(i, buttons) {
      if (buttons[0].disabled) return;
      var ln = beats[bi].lines[i];
      buttons.forEach(function (x) { x.disabled = true; });
      buttons[i].classList.add(TAG_PICK[ln.tag] || "amber");
      meters.you = clamp(meters.you + ln.you);
      meters.them = clamp(meters.them + ln.them);
      setMeters(meters);
      var dead = [];
      if (meters.you <= 0) dead.push("you");
      if (meters.them <= 0) dead.push("them");
      var ends = ln.tag === "game" || dead.length > 0;
      var cls = TAG_CLASS[ln.tag] || "amber";
      var html = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (TAG_LABEL[ln.tag] || "Move") + '</div>' +
        '<p class="feedback">' + rich(ln.outcome) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(ln.why) + '</p></div>';
      if (ln.tag === "game") {
        html += '<div class="example"><div class="ex-label">How it ends</div>' + rich(sc.payoff) + '</div>';
      }
      if (dead.length) {
        var fo = sc.fallout || {};
        var lines = [];
        if (dead.indexOf("them") >= 0) lines.push(fo.them || DEFAULT_FALLOUT.them);
        if (dead.indexOf("you") >= 0) lines.push(fo.you || DEFAULT_FALLOUT.you);
        html += '<div class="example"><div class="ex-label">How it ends</div>' +
          lines.map(function (t) { return rich(t); }).join("<br><br>") + '</div>';
      }
      var last = ends || bi === beats.length - 1;
      var fb = document.createElement("div");
      fb.innerHTML = html + nextbar("Continue →");
      card.appendChild(fb);
      bindNext(function () {
        if (last) { sceneOver(); return; }
        bi += 1;
        drawBeat();
        settle();
      });
    }

    function sceneOver() {
      card.innerHTML = frame(k,
        '<h2 class="scene-title">' + rich(sc.title) + '</h2>' +
        '<p class="kicker">Scene over</p>' +
        meterHTML(meters) +
        exampleBox(sc.example) +
        nextbar("Continue →"), false);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    drawBeat();
  }

  // ---------- sort: bins (each card goes in a bin, one after another) ----------

  function renderBins(k, sc) {
    var items = sc.items || [];
    var bins = sc.bins || [];
    var list;

    function finish() {
      var end = document.createElement("div");
      end.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
      card.appendChild(end);
      paintProgress(k + 1, -1);
      bindNext(advance);
    }

    function addCard(i) {
      var c = items[i];
      var wrap = document.createElement("div");
      wrap.className = "sort-item";
      wrap.innerHTML = '<div class="exchange"><p class="line">' + rich(c.text) + '</p></div>' +
        '<div class="choices">' + bins.map(function (label, bi) {
          return '<button class="choice" type="button" data-i="' + bi + '">' + rich(label) + '</button>';
        }).join("") + '</div>';
      list.appendChild(wrap);
      var buttons = wrap.querySelectorAll("button.choice");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (buttons[0].disabled) return;
          choose(parseInt(btn.getAttribute("data-i"), 10));
        });
      });

      function choose(pick) {
        buttons.forEach(function (x) { x.disabled = true; });
        var right = pick === c.answer;
        buttons[c.answer].classList.add("correct");
        if (!right) buttons[pick].classList.add("wrong");
        var fb = document.createElement("div");
        fb.innerHTML = right
          ? '<div class="why-box ok"><div class="stamp ok">Right call</div>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>'
          : '<div class="why-box cross"><div class="stamp cross">Not quite</div>' +
            '<p class="feedback"><b>You picked ' + rich(bins[pick]) + '.</b> It belongs in ' +
            rich(bins[c.answer]) + '.</p>' +
            '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>';
        wrap.appendChild(fb);
        if (i + 1 < items.length) {
          addCard(i + 1);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        } else {
          finish();
        }
      }
    }

    card.innerHTML = frame(k, '<p class="prompt">' + rich(sc.prompt) + '</p><div class="sort-list"></div>',
      ITEMS[k].first);
    list = card.querySelector(".sort-list");
    if (items.length) addCard(0);
  }

  // ---------- sort: order (tap the cards in sequence) ----------

  function renderOrder(k, sc) {
    var items = sc.items || [];
    var placed = 0;
    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(sc.prompt) + '</p>' +
      '<ol class="seq" aria-label="Placed so far"></ol>' +
      '<div class="pool choices">' + shuffled(items.length).map(function (idx) {
        return '<button class="choice" type="button" data-i="' + idx + '">' + rich(items[idx].text) + '</button>';
      }).join("") + '</div>' +
      '<div class="order-fb"></div>', ITEMS[k].first);
    var seq = card.querySelector(".seq");
    var fbBox = card.querySelector(".order-fb");

    card.querySelectorAll(".pool button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        tap(parseInt(btn.getAttribute("data-i"), 10), btn);
      });
    });

    function tap(idx, btn) {
      if (idx === placed) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (placed + 1) + '</span><span><span class="ct">' +
          rich(items[idx].text) + '</span><span class="why">' + rich(items[idx].why) + '</span></span>';
        seq.appendChild(li);
        placed += 1;
        btn.remove();
        fbBox.innerHTML = "";
        if (placed === items.length) {
          fbBox.innerHTML = exampleBox(sc.example) + nextbar("Continue →");
          paintProgress(k + 1, -1);
          bindNext(advance);
        }
      } else {
        fbBox.innerHTML = '<div class="why-box amber"><div class="stamp amber">Not yet</div>' +
          '<p class="feedback">' + rich(items[placed].why) + '</p></div>';
      }
    }
  }

  // ---------- counter ----------

  function renderCounter(k, c) {
    var palette = c.palette || [];
    var used = palette.map(function () { return false; });
    var total = 0, picks = 0, sent = false;

    card.innerHTML = frame(k,
      '<p class="prompt">' + rich(c.prompt) + '</p>' +
      '<div class="total"><span>Total</span><b data-total>0</b>' +
      '<span>Target ' + esc(c.target) + ', within ' + esc(c.tolerance) + '</span></div>' +
      '<div class="band" aria-hidden="true"><span class="fill" data-fill></span></div>' +
      '<p class="kicker">Picks used: <span data-picks>0</span> of ' + esc(c.maxPicks) + '</p>' +
      '<div class="choices">' + palette.map(function (p, i) {
        return '<button class="choice pal" type="button" data-i="' + i + '"><span>' + rich(p.text) +
          '</span><span class="val">+' + esc(p.value) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="counter-actions"><button class="ghost" type="button" data-reset>Reset</button>' +
      '<button class="next" type="button" data-send>Send</button></div>' +
      '<div class="counter-fb"></div>', ITEMS[k].first);

    var totalEl = card.querySelector("[data-total]");
    var fillEl = card.querySelector("[data-fill]");
    var picksEl = card.querySelector("[data-picks]");
    var sendBtn = card.querySelector("[data-send]");
    var resetBtn = card.querySelector("[data-reset]");
    var palBtns = card.querySelectorAll("button.pal");

    function paint() {
      totalEl.textContent = String(total);
      picksEl.textContent = String(picks);
      fillEl.style.width = Math.min(100, Math.round(total / c.target * 100)) + "%";
      fillEl.classList.toggle("over", total > c.target + c.tolerance);
      palBtns.forEach(function (b, i) {
        b.disabled = sent || used[i] || picks >= c.maxPicks;
      });
      sendBtn.disabled = sent || picks < 1;
      resetBtn.disabled = sent || picks < 1;
    }

    palBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-i"), 10);
        if (sent || used[i] || picks >= c.maxPicks) return;
        used[i] = true;
        picks += 1;
        total += palette[i].value;
        paint();
      });
    });

    resetBtn.addEventListener("click", function () {
      if (sent) return;
      used = palette.map(function () { return false; });
      total = 0;
      picks = 0;
      paint();
    });

    sendBtn.addEventListener("click", function () {
      if (sent || picks < 1) return;
      sent = true;
      paint();
      var hit = Math.abs(total - c.target) <= c.tolerance;
      var under = !hit && total < c.target;
      var msg = hit ? c.hitMsg : (under ? c.underMsg : c.overMsg);
      var cls = hit ? "ok" : (under ? "amber" : "cross");
      var fb = document.createElement("div");
      fb.innerHTML = '<div class="why-box ' + cls + '"><div class="stamp ' + cls + '">' +
        (hit ? "Right call" : "Not quite") + '</div>' +
        '<p class="feedback">' + rich(msg) + '</p>' +
        '<p class="feedback"><b>Why:</b> ' + rich(c.why) + '</p></div>' +
        nextbar("Continue →");
      card.querySelector(".counter-fb").appendChild(fb);
      paintProgress(k + 1, -1);
      bindNext(advance);
    });

    paint();
  }

  // ---------- debrief, reflection, end ----------

  function renderDebrief() {
    var d = GAME.debrief || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="round-label" data-lv="debrief">Debrief</div>' +
      '<h1 class="h2">What Nadia would say</h1>' +
      '<p class="feedback">' + rich(d.nadia) + '</p>' +
      '<div class="why-box neutral"><p class="feedback"><b>' +
      rich(d.bookTerm || GAME.bookTerm) + '</b></p>' +
      '<p class="feedback">' + rich(d.bookNote || GAME.bookIdea) + '</p></div>' +
      nextbar("Continue →");
    bindNext(advance);
  }

  // Storage can be blocked or missing, so every access is guarded.
  function readStore() {
    try { return window.localStorage.getItem(STORE_KEY) || ""; } catch (e) { return ""; }
  }

  function writeStore(value) {
    try { window.localStorage.setItem(STORE_KEY, value); } catch (e) { /* blocked: the page still works */ }
  }

  function renderReflect() {
    var r = GAME.reflection || {};
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="reflect-tag">Your turn</div>' +
      '<p class="prompt">' + rich(r.prompt) + '</p>' +
      '<textarea class="reflect-box" aria-label="Your reflection" ' +
      'placeholder="A few lines is plenty. This stays on your device, and nobody else sees it."></textarea>' +
      nextbar("Continue →");
    var box = card.querySelector("textarea");
    box.value = readStore();
    box.addEventListener("input", function () { writeStore(box.value); });
    bindNext(advance);
  }

  function worldHub() {
    var h = safeUrl(NAV.hub);
    return h && GAME && GAME.world ? h.replace(/#.*$/, "") + "#world-" + GAME.world : h;
  }

  function renderEnd() {
    var hub = worldHub();
    var nxt = NAV.next || null;
    var links = MULTI ? '<button class="next" type="button" id="otherSetting">Play another setting</button>' : "";
    links += hub ? '<a class="next" href="' + esc(hub) + '">Back to the world</a>' : "";
    if (nxt) {
      var nxtUrl = safeUrl(nxt.url);
      links += nxtUrl
        ? '<a class="next" href="' + esc(nxtUrl) + '">Next game: ' +
          rich(nxt.title || ("Game " + nxt.slot)) + ' →</a>'
        : '<p class="next-soon">Next game opens soon</p>';
    }
    card.innerHTML = progressHTML(TOTAL, -1) +
      '<div class="end-emblem">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</div><div class="end-badge">Case closed</div>' +
      '<h1 class="h2">Game ' + esc(GAME.slot) + ' is done.</h1>' +
      '<p class="feedback">' + rich(GAME.concept) + '</p>' +
      '<div class="source"><b>From:</b> ' + rich(GAME.bookSource) + '</div>' +
      (MULTI ? '<p class="feedback">Settings played: ' + readDone().length + ' of ' + STORIES.length + '.</p>' : '') +
      '<div class="nextbar end-nav">' + links + '</div>';
    bindOther();
  }

  // ---------- start ----------

  function init() {
    var series = document.getElementById("series");
    var hubLink = document.getElementById("hubLink");
    if (!GAME || !GAME.rounds) {
      series.textContent = "You";
      card.innerHTML = '<h1 class="h2">This game could not load.</h1>';
      return;
    }
    series.innerHTML = '<span class="emb-wrap">' + ((window.TA_EMB || {})[String(GAME.world)] || "") + '</span>You <small>· World ' + esc(GAME.world) + ' · Game ' + esc(GAME.slot) + '</small>';
    var sb = document.getElementById("storiesBtn");
    if (MULTI && sb) { sb.hidden = false; sb.addEventListener("click", goStories); }
    var hub = worldHub();
    if (hub) {
      hubLink.textContent = "World map";
      hubLink.setAttribute("href", hub);
      hubLink.hidden = false;
    }
    render();
  }

  init();
})();
</script>

<script>
/* Visual refresh: world colour, synthesized sound (no audio files) and trap shake. Presentation only. */
(function () {
  "use strict";
  var G = window.TA_GAME;
  if (G && G.world) document.documentElement.setAttribute("data-world", String(G.world));
  var card = document.getElementById("card"), btn = document.getElementById("sfx");
  var on = true, ctx = null;
  try { on = window.localStorage.getItem("ta-sfx") !== "off"; } catch (e) {}
  function label() { btn.textContent = on ? "SFX ON" : "SFX OFF"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  label();
  btn.addEventListener("click", function () {
    on = !on; label();
    try { window.localStorage.setItem("ta-sfx", on ? "on" : "off"); } catch (e) {}
  });
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { ctx = new AC(); } catch (e) {} } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    var c = audio(); if (!c || !on) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function tap() { tone("sine", 440, 220, 0, 0.05, 0.12); }
  function success() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.08, 0.18, 0.12); }); }
  function thud() { tone("sawtooth", 140, 55, 0, 0.28, 0.12); }
  function victory() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone("triangle", f, f, i * 0.1, 0.3, 0.12); }); }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button.choice, button.next, button.ghost")) tap();
  }, true);
  function shake() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    setTimeout(function () { card.classList.remove("shake"); }, 450);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        var q = function (sel) { return n.matches(sel) || n.querySelector(sel); };
        if (q(".end-badge")) victory();
        else if (q(".why-box.ok")) success();
        else if (q(".why-box.cross")) { thud(); shake(); }
      });
    });
  }).observe(card, { childList: true, subtree: true });
})();
</script>
