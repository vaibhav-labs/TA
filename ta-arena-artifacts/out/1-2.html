<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sort the Nods · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

<script>window.TA_GAME = {"slot":"1.2","setting":"Home & Flatmates","title":"Sort the Nods","world":1,"worldName":"Being Noticed","week":1,"weekName":"Being Noticed","mechanic":"Sort-it","concept":"After this one you can sort the nods you get into warm or cold, and for doing or for being, and you can catch yourself batting one away.","plainWord":"the bounce","bookTerm":"Stroke filter","bookIdea":"Some people wave away warm recognition before it can land, so the good nods never register.","bookSource":"Scripts People Live, ch. 8 and 22; TA Today, ch. 8","opener":{"setting":"Tuesday, 19:00. The 3B balcony. Maya is back from a twelve-hour shift, feet up on the railing.","lines":[{"who":"Maya","text":"\u201cSo how's Halden? Sam said you looked like a kicked puppy last night.\u201d","cue":"first proper talk of the week"},{"who":"Maya","text":"\u201c...\u201d","cue":"waits, not pushing"}],"ask":"Which of the nods you got this week did you actually let in, and which did you wave away?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each card is one line from earlier this week. Tap what kind of nod it was.","items":[{"type":"pick","who":"Sam","text":"\u201cOh, yeah! Sam. Sorry, mornings.\u201d","cue":"Monday, 7:50, one earbud out","options":["Warm","Cold"],"answer":0,"why":"Warm. He gave you his name and pulled out an earbud to do it. The nod is for being, not for anything you did.","traps":{"1":"Cold would need him to brush you off. He pulled an earbud out to talk to you, so cold misreads the moment."},"example":"A neighbour at the lift.<br>\u201cOh, hi! Sorry, I'm always in a rush. I'm Rosa.\u201d<br>She tells you her name, and nothing you did made her do it."},{"type":"pick","who":"Mum","text":"\u201cI told him you know what you're doing.\u201d","cue":"Monday night, the phone, talking about you to your father","options":["For being","For doing"],"answer":1,"why":"For doing. She is praising how you handle things, which is something you do. It is warm, and it is the kind you can lose if you stop doing the thing.","traps":{"0":"For being would mean she praises who you are. She praises how you handle things, and that difference matters when you want to keep the nod."},"example":"A coach at the end of a match.<br>\u201cYou read the play well today.\u201d<br>He is praising how you read it, not who you are."},{"type":"pick","who":"Gran","text":"\u201cSaturday it is. And eat something!\u201d","cue":"Monday, the stairwell, after you said you'd come for the flattened rice","options":["Cold","Warm"],"answer":1,"why":"Warm. She is keeping a plate for you and reminding you to eat. That is a nod for being, and she would give it whatever you had done.","traps":{"0":"Cold would mean she is brushing you off. She is planning Saturday around you, so cold gets her wrong."},"example":"A neighbour at the gate.<br>\u201cCome to ours for lunch on Sunday. Bring nothing.\u201d<br>She wants you there, and she asks nothing back."}]},{"level":"Play","label":"Play, the week in motion","intro":"Maya has the list. Sort it, then tell her which nods you took in.","items":[{"type":"scene","title":"Tuesday, 19:00, the balcony","setting":"Maya, feet up after a twelve-hour shift. She wants the whole day, line by line.","meters":{"you":60,"them":50},"beats":[{"who":"Maya","text":"\u201cSo how's Halden? Sam said you looked like a kicked puppy last night.\u201d","cue":"feet up on the railing","lines":[{"text":"\u201cHe's not wrong.\u201d","tag":"best","you":0,"them":5,"outcome":"She laughs, and it's a real laugh. \u201cPoor you. Okay, tell me about it.\u201d","why":"Admitting something true lets her in. You gave her a real answer, and she can work with a real answer."},{"text":"\u201cIt's fine, really.\u201d","tag":"ok","you":-4,"them":0,"outcome":"\u201cMm. That's my line.\u201d","why":"Saying it's fine closes the door on the one person offering to listen. Maya knows that line well, and she says so."}]},{"who":"Maya","text":"\u201cOkay, tell me the day. Everything anyone said to you. I'll tell you which ones were real.\u201d","cue":"sets her phone face-up on the railing, notes app open","lines":[{"text":"\u201cGo on, then.\u201d","tag":"best","you":2,"them":3,"outcome":"She opens a blank note and waits for the first line.","why":"Saying yes to a list of your day lets you see which nods you have been carrying. Checking them is the whole point of the sort."},{"text":"\u201cCan we eat first?\u201d","tag":"ok","you":-2,"them":-2,"outcome":"\u201cSoup first. Then the list. Don't think I've forgotten.\u201d","why":"Asking to skip it is reasonable, but it only moves the sorting later. She still wants the day, and so do you."}]},{"who":"Maya","text":"\u201cTwelve lines from Monday and Tuesday. Warm or cold, for doing or for being. Drag each one into its corner.\u201d","cue":"phone propped against the flowerpot","lines":[{"text":"\u201cRight. Let's do it.\u201d","tag":"best","you":2,"them":2,"outcome":"The first card slides in. Your day is on the screen, one line at a time.","why":"Looking at each line as data, not as a verdict on you, keeps the sort fair. That is what the next minute is for."},{"text":"\u201cCan't I just say it was fine?\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cIt was fine, you said. Sort them.\u201d","why":"A quick \u201cit was fine\u201d is the bounce in another form. Maya won't take the summary, so you get the list instead."}]}],"example":"A family group chat.<br>Aunt: \u201cGood luck today!\u201d<br>You reply \u201cIt's nothing.\u201d The good luck is still there, and it has nowhere to land."},{"type":"sort","prompt":"Put each line in its corner. Warm or cold, for doing or for being.","bins":["Warm, for doing","Warm, for being","Cold, for doing","Cold, for being"],"items":[{"text":"\u201cName?\u201d","answer":3,"why":"The receptionist registered you and asked nothing back. Cold, and it is for being there at all."},{"text":"\u201cDon't be late to it, I hate that.\u201d","answer":2,"why":"Daniel is talking about one thing you did, your timing, and he said it with no warmth. Cold, for doing."},{"text":"\u201cNobody reads the incident log.\u201d (said after you asked)","answer":0,"why":"He is pleased you asked about his work. Warm, and aimed at something you did."},{"text":"\u201cOh thank god, someone newer than me.\u201d","answer":1,"why":"Clara is glad you are here, and that needs nothing from you. Warm, for being."},{"text":"\u201cOh, new boy! You're too thin.\u201d","answer":1,"why":"The complaint is the affection. Gran cares that you are here and fed. Warm, for being."},{"text":"\u201cDid you eat?\u201d","answer":1,"why":"She asks because you are on her mind, not because you earned it. Warm, for being."},{"text":"Sam nods at the cereal, not at you.","answer":3,"why":"Small and cold, but it reaches you as a person, and it asks nothing of you. Cold, for being."},{"text":"\u201cYour PR's got three lint errors.\u201d","answer":2,"why":"A correction about your work. Cold, and aimed at what you did."},{"text":"\u201c...but the logic's right, which is more than I expected.\u201d","answer":0,"why":"Warm, and aimed at your work. It is praise for doing, the kind most people run on."},{"text":"The security guard raises his hand as you walk in.","answer":1,"why":"He lifted his hand because you were there. Warm, for being."},{"text":"\u201cOh. You're the new one.\u201d (said to the monitor)","answer":3,"why":"Daniel registered that you exist and put no warmth into it. The line is about who you are, the new one, and not about anything you did. Cold, for being."},{"text":"\u201cOkay, tell me the day.\u201d","answer":1,"why":"She is asking for your day, which is interest in you and not in anything you did. Warm, for being."}],"example":"A Sunday family group chat.<br>\u201cNice photo!\u201d gets three hearts.<br>\u201cWho's coming Thursday?\u201d gets silence."},{"type":"scene","title":"Tuesday, 19:30, the balcony","setting":"The list is sorted. Maya wants to know which nods you let in, then she goes to make a lentil stew.","meters":{"you":60,"them":50},"beats":[{"who":"Maya","text":"\u201cNow. Which of those did you actually let in?\u201d","cue":"phone face-up again, the warm lines reappearing","lines":[{"text":"\u201cOmar's logic one. And the guard's. I took both.\u201d","tag":"ok","you":2,"them":3,"outcome":"She nods, slowly. \u201cGood. Keep those.\u201d","why":"Taking a warm nod in is the fix. Two of them is a start, and it shows you can let one land."},{"text":"\u201cI bounced most of them. I'll own that.\u201d","tag":"best","you":6,"them":4,"outcome":"She doesn't smile. Still, she holds your eye. \u201cRight. Let's go through them.\u201d","why":"Naming the bounce is what breaks it. A warm nod you can see is a warm nod you can take.","flags":["bounce_count_w1"]},{"text":"\u201cNone of them. Those don't count.\u201d","tag":"ok","you":-6,"them":-4,"outcome":"\u201cThen they'll keep being nothing to you,\u201d she says, and turns the phone over.","why":"Ruling out every warm nod keeps the day cold. The nods were there, and you decided they didn't count."}]},{"who":"Maya","text":"\u201cOmar said your logic was right, and you said it was mostly copied from the docs. That's a bounce. Clara was glad to see you, and you said you were hiding from the big table. Bounce.\u201d","cue":"reading back from the list, one line at a time","lines":[{"text":"\u201cOkay. I see it. The next one is mine to take.\u201d","tag":"best","you":3,"them":3,"outcome":"She smiles. \u201cThat's the fix. Noticing it.\u201d","why":"Seeing a bounce while it happens is most of the fix. The next nod has a chance to land."},{"text":"\u201cIt was mostly the docs, though.\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cThere it goes again.\u201d","why":"That is the same bounce with a new excuse. The nod goes back across the table, and the other person feels brushed off."},{"text":"\u201cCan we talk about the stew?\u201d","tag":"ok","you":-3,"them":-1,"outcome":"\u201cSoup in two minutes. You're still doing homework.\u201d","why":"Changing the subject is a bounce too. It works, but it stops the nod before you can look at it."}]},{"who":"Maya","text":"\u201cRight, I'm making a lentil stew, and you're eating it.\u201d","cue":"stands up, already halfway to the stove","lines":[{"text":"\u201cYou've just done twelve hours. Let me.\u201d","tag":"best","you":4,"them":4,"outcome":"She stops. \u201c\u2026Nobody says that.\u201d","why":"Offering to do something for her, when she is the one who is tired, gives her a nod she rarely gets. It is real, and it lands.","flags":["maya_offered_1"]},{"text":"\u201cThanks, Maya, you're a star.\u201d","tag":"ok","you":0,"them":2,"outcome":"She's already in the kitchen and doesn't hear it.","why":"A warm nod for doing, handed to someone who is drowning in those. It is kind, but she can't take it in from the stove."},{"text":"Sit and wait for it.","tag":"ok","you":-3,"them":-2,"outcome":"The stew arrives in silence.","why":"Letting her do everything without an offer keeps her in the same chair, which is where she already sits."}]}],"example":"A flatmate who always cooks.<br>\u201cSit, I'll do it.\u201d<br>The offer that comes back is the one that changes the evening."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"Omar said the logic was right, and you said it was copied from the docs. Why does batting that away cost you?","options":["It sends the nod back before it lands, so the giver feels brushed off and you stay short","It shows you're modest, so nobody can hold it against you","It only matters when the person giving the nod is your boss"],"answer":0,"why":"The bounce is waving a warm nod away before it lands. You say \u201cit was nothing\u201d, and the nod never registers. The giver feels brushed off, and you stay short of the nod you needed.","traps":{"1":"Modesty feels safe, but nobody is holding anything against you. The bounce is what stops the nod sinking in, and modesty doesn't change that.","2":"The bounce works the same whoever gives the nod. Omar is not your boss, and his praise still bounced."},"example":"A friend's birthday message.<br>\u201cYou're the best, thank you for everything.\u201d<br>You reply \u201cOh, it was nothing,\u201d and the message has nowhere to land."}]}],"debrief":{"nadia":"There are four kinds of nod: warm or cold, and for doing or for being. It is easy to live on the two for doing and go short on the two for being. A complaint can be a warm nod, as with \u201cyou're too thin\u201d, and a flat \u201cName?\u201d is still a nod, only a cold one. The bounce is what you do when a warm nod comes and you wave it away, so noticing it is the fix.","bookTerm":"Stroke filter","bookNote":"TA writers call this a stroke filter: the habit of screening out the warm nods that come your way. Steiner describes the same habit in Scripts People Live. A nod needs a few seconds to soak in, and people often wave it off with a shrug or a quick thank you."},"reflection":{"prompt":"This week, when someone said something warm, what did you say back?"},"next":"1.3","baseStory":{"setting":"Home & Flatmates","blurb":"Maya sorts a week of other people's nods with you on the 3B balcony, line by line."},"moreStories":[{"setting":"Friends & Community","blurb":"Joseph's birthday tea went well, and Ruby wants to know what you actually took in.","opener":{"setting":"Saturday, 16:40. The Corner Table, the back booth. Joseph's birthday tea is over, and the cake box sits on the seat beside you.","lines":[{"who":"Ruby","text":"\u201cNine people thanked you today. I counted.\u201d","cue":"turns the bill over and uncaps a pen"},{"who":"Ruby","text":"\u201cAnd you handed every one of them back.\u201d","cue":"pen hovering, waiting"}],"ask":"Which of the nods you got today did you actually let in, and which did you wave away?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each card is one line from this week. Tap what kind of nod it was.","items":[{"type":"pick","who":"Joseph","text":"\u201cGoalie again. Fine.\u201d","cue":"Thursday, five-a-side, lacing a boot, not looking up","options":["Warm","Cold"],"answer":1,"why":"Cold. He registers that you are there and puts no warmth in it. It is still a nod, only a flat one.","traps":{"0":"Warm would need some pleasure in it. He kept his eyes on his boot, so warm reads in more than he gave."},"example":"A foreman at the site gate.<br>\u201cOh. You again.\u201d<br>He sees you, and nothing else comes with it."},{"type":"pick","who":"Ruby","text":"\u201cCome Saturday. The table's short without you.\u201d","cue":"Wednesday, a voice note recorded between buses","options":["For doing","For being"],"answer":1,"why":"For being. She wants you at the table and names nothing you did. It is warm, and you keep it even if you do nothing at all.","traps":{"0":"For doing would mean she was praising something you made or fixed. She asks for you, with no job attached."},"example":"A neighbour on the stairs.<br>\u201cDo come to the street party. It's dull when you're away.\u201d<br>She asks for you, and no favour is attached."},{"type":"pick","who":"Nadia","text":"\u201cTable for nine at three. You're a star for sorting it.\u201d","cue":"Friday, the Sunday group chat","options":["Warm","Cold"],"answer":0,"why":"Warm. She is thanking you for something you did. Most of us live on this kind, and it is easy to bounce.","traps":{"1":"Cold would mean she was brushing you off. She is thanking you by name, so cold misses the warmth."},"example":"A teammate after a match.<br>\u201cCheers for driving everyone today.\u201d<br>Warm, and it is for the lift."}]},{"level":"Play","label":"Play, the week in motion","intro":"Ruby has the bill and a pen. Sort the day, then tell her which nods you took in.","items":[{"type":"scene","title":"Saturday, 16:45, the back booth","setting":"Ruby earns her place by being useful, and she has turned the bill over to write on. She wants your day, line by line.","meters":{"you":60,"them":50},"beats":[{"who":"Ruby","text":"\u201cYou stood by the door like staff the whole time. What was that?\u201d","cue":"tapping the pen on the sugar bowl","lines":[{"text":"\u201cI didn't know where to stand.\u201d","tag":"best","you":0,"them":5,"outcome":"Ruby snorts. \u201cNobody does. Go on.\u201d","why":"Saying the small true thing gives her something to work with. She asked a real question and got a real answer."},{"text":"\u201cSomeone had to watch the cake.\u201d","tag":"ok","you":-4,"them":0,"outcome":"One eyebrow goes up. \u201cIt was in a box.\u201d","why":"A tidy excuse sounds useful and hides the answer she asked for. Ruby knows a job when she hears one."}]},{"who":"Ruby","text":"\u201cEverything anyone said to you today. I'll write it on the bill, and we'll say which ones were real.\u201d","cue":"clicks the pen","lines":[{"text":"\u201cGo on, then.\u201d","tag":"best","you":2,"them":3,"outcome":"She writes a number one and waits for your first line.","why":"Agreeing to the list lets you see which nods you carried home. The checking is the point of the sort."},{"text":"\u201cCan we split the bill first?\u201d","tag":"ok","you":-2,"them":-2,"outcome":"\u201cThe bill is the list. Sit.\u201d","why":"Asking to pay first is reasonable, and it only puts the sorting off. She still wants the day, and so do you."}]},{"who":"Ruby","text":"\u201cTwelve lines. Warm or cold, for what you did or for who you are. A corner each.\u201d","cue":"fans out napkins, one line on each","lines":[{"text":"\u201cRight. Deal them out.\u201d","tag":"best","you":2,"them":2,"outcome":"The first napkin slides across the table. Your day is in front of you, one line at a time.","why":"Reading each line as plain information, with no verdict on you attached, keeps the sort fair."},{"text":"\u201cCan't I just say it went well?\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cIt went well, you said. Pick up a napkin.\u201d","why":"Saying it went well is the bounce in short form. Ruby won't take the summary, so you get the list instead."}]}],"example":"A group chat after a party.<br>Host: \u201cThanks for coming, it meant a lot.\u201d<br>You reply \u201cIt was nothing.\u201d The thanks is still there, and it has nowhere to land."},{"type":"sort","prompt":"Put each line in its corner. Warm or cold, for doing or for being.","bins":["Warm, for doing","Warm, for being","Cold, for doing","Cold, for being"],"items":[{"text":"The woman at the till says \u201cNext.\u201d without looking up.","answer":3,"why":"She registered you and asked for nothing more. Cold, and it is for being in the queue at all."},{"text":"\u201cYou've put the candles on crooked.\u201d","answer":2,"why":"A remark about one thing you did. Cold, and aimed at your doing."},{"text":"\u201cThe cake's perfect. Who found a place that does lemon?\u201d","answer":0,"why":"She is pleased with your choice and says so. Warm, aimed at something you did."},{"text":"\u201cCome and sit by me.\u201d","answer":1,"why":"Joseph's mum wants you near. Nothing you did earned it. Warm, for being."},{"text":"Joseph's brother-in-law shakes your hand and looks at the door behind you.","answer":3,"why":"He registers you and puts no warmth in it. Cold, for being there."},{"text":"\u201cRuby said you'd be late, and I said we'd wait.\u201d","answer":1,"why":"Joseph held the cake back for you. The nod is for who you are, and it asks nothing. Warm, for being."},{"text":"\u201cTable for nine was meant to be by the window.\u201d","answer":2,"why":"A complaint about one thing you arranged. Cold, and for doing."},{"text":"\u201cYou remembered he hates nuts. Brilliant.\u201d","answer":0,"why":"Praise for a detail you got right. Warm, and for doing."},{"text":"The barista has your tea on the counter before you ask.","answer":1,"why":"She remembered you, and no task earned it. Warm, for being."},{"text":"\u201cUsual?\u201d (said to the milk jug)","answer":3,"why":"The barista knows you exist and gives it no warmth. The line is about who you are, and the milk jug gets the eye contact. Cold, for being."},{"text":"\u201cGood, you're here. Now we can start.\u201d","answer":1,"why":"Nadia was waiting for you in particular. Warm, for being."},{"text":"Ruby saves the end of the booth with her coat, and she sits on her hands to keep it.","answer":1,"why":"She holds a place for you with her own coat. Warm, for being."}],"example":"A neighbours' group chat.<br>\u201cLovely cake!\u201d gets four hearts.<br>\u201cWho's bringing chairs?\u201d gets silence."},{"type":"scene","title":"Saturday, 17:15, the back booth","setting":"The napkins are sorted. Ruby wants to know which nods you let in, and then she has chairs to stack.","meters":{"you":60,"them":50},"beats":[{"who":"Ruby","text":"\u201cWhich of those did you actually let in?\u201d","cue":"the warm napkins in a row beside the sugar","lines":[{"text":"\u201cI bounced most of them. That's mine.\u201d","tag":"best","you":6,"them":4,"outcome":"She doesn't smile. She holds your eye, though. \u201cRight. Let's go through them.\u201d","why":"Naming the bounce is what breaks it. A warm nod you can see is a warm nod you can take.","flags":["bounce_count_w1"]},{"text":"\u201cJoseph's mum, and the barista. I took those two.\u201d","tag":"ok","you":2,"them":3,"outcome":"She nods, slowly. \u201cGood. Keep those.\u201d","why":"Taking a warm nod in is the fix. Two of them is a start, and it shows you can let one land."},{"text":"\u201cNone. Everybody says that at a party.\u201d","tag":"ok","you":-6,"them":-4,"outcome":"\u201cThen they'll keep being nothing to you,\u201d she says, and caps the pen.","why":"Ruling out every warm nod keeps the day cold. The nods were there, and you decided they didn't count."}]},{"who":"Ruby","text":"\u201cNadia said the table was perfect and you said anyone can ring a cafe. Joseph's mum said she was glad you came and you said you only came for the cake. Two bounces.\u201d","cue":"reading the napkins back, one at a time","lines":[{"text":"\u201cFair. Next time I'll just say thank you.\u201d","tag":"best","you":3,"them":3,"outcome":"She smiles. \u201cThat's the fix. Noticing it.\u201d","why":"Seeing a bounce while it happens is most of the fix. The next nod has a chance to land."},{"text":"\u201cAnyone could have rung, though.\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cThere it goes again.\u201d","why":"That is the same bounce with a new excuse. The nod goes back across the table, and the giver feels brushed off."},{"text":"\u201cAre you having the last slice?\u201d","tag":"ok","you":-3,"them":-1,"outcome":"\u201cSlice when we're done. You're dodging.\u201d","why":"Changing the subject is a bounce too. It works for a minute and stops the nod before you can look at it."}]},{"who":"Ruby","text":"\u201cRight. I'm stacking the chairs and getting the boxes to the car.\u201d","cue":"already holding two chairs by their backs","lines":[{"text":"\u201cYou've been on your feet since noon. Sit, I'll do the boxes.\u201d","tag":"best","you":4,"them":4,"outcome":"She stops with a chair in the air. \u201c\u2026Nobody says that to me.\u201d","why":"Taking the job off the person who always does it hands her a nod she rarely gets. It asks nothing back, so it lands."},{"text":"\u201cRuby, you're a legend.\u201d","tag":"ok","you":0,"them":2,"outcome":"She is already at the door with the chairs and doesn't hear it.","why":"A warm nod for doing, handed to someone who lives on those. It is kind, and it can't land while her arms are full."},{"text":"Sit and watch her.","tag":"ok","you":-3,"them":-2,"outcome":"The chairs go up one by one. Nobody speaks.","why":"Watching without an offer keeps her in the job she always has."}]}],"example":"A friend who always hosts.<br>\u201cSit down, I'll wash up.\u201d<br>The offer that comes back is the one that changes the evening."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"Nadia said the table was perfect, and you told her anyone can ring a cafe. Why does batting that away cost you?","options":["It keeps the party easy, because nobody has to fuss over who did what and the cake gets the attention","It only matters at big events like a birthday, and everyday thank-yous are too small to bother with","It sends the thanks back before it lands, so she feels brushed off and you go home short"],"answer":2,"why":"The bounce waves a warm nod away before it lands. Nadia gave you a nod for doing, you passed it back, and you leave with less than she meant you to have.","traps":{"0":"Keeping it easy feels kind. Nobody was fussing, and the nod still bounced, so Nadia is left holding it.","1":"The bounce works the same on a small thank-you. A big day only gives you more of them to wave off."},"example":"A lift home from a friend.<br>\u201cThanks for driving, you're a lifesaver.\u201d<br>You answer \u201cOh, it was on my way,\u201d and the thanks goes back unopened."}]}]},{"setting":"Family","blurb":"Dad grunted at your first-aid certificate, and Gran has the washing-up cloth and a lot of questions.","opener":{"setting":"Sunday, 14:20. Gran's kitchen, downstairs. Lunch is over, the washing-up is half done, and Leo is under the table with a pack of spelling cards.","lines":[{"who":"Gran","text":"\u201cDry. Don't stand there like a visitor. Your father said one thing about that certificate and you've been chewing it since the soup.\u201d","cue":"hands you a tea towel without turning round"},{"who":"Leo","text":"\u201cCan I do the cards for him, Gran?\u201d","cue":"from under the table, a pencil in his fist"}],"ask":"Which of the nods you got this week did you actually let in, and which did you wave away?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each card is one line from this week. Tap what kind of nod it was.","items":[{"type":"pick","who":"Leo","text":"\u201cYou smell like rain! Can I wear your hat?\u201d","cue":"Monday, the school gate, tugging your sleeve","options":["Cold","Warm"],"answer":1,"why":"Warm. He is pleased you are there and wants to be close to you. He asks for nothing you did.","traps":{"0":"Cold would mean he was shrugging you off. He is tugging your sleeve and asking for your hat, so cold misreads him."},"example":"A niece at the door.<br>\u201cYou're here! Come and see my room!\u201d<br>She wants you, and you did nothing to earn it."},{"type":"pick","who":"Gran","text":"\u201cSit. I kept the soft chair for you.\u201d","cue":"Wednesday, the stairwell door, already open","options":["For being","For doing"],"answer":0,"why":"For being. She kept the chair because you were coming, and nothing you did made her do it. It is warm, and you keep it whatever you do next.","traps":{"1":"For doing would mean she was rewarding something you made or fixed. She saved the chair for you, whatever you had done that day."},"example":"An aunt at a wedding.<br>\u201cI've kept you a seat by me.\u201d<br>The seat is for you, and no deed earned it."},{"type":"pick","who":"Dad","text":"\u201cHm.\u201d","cue":"Sunday, behind the paper, after you said you'd passed the first-aid course","options":["Warm","Cold"],"answer":1,"why":"Cold. He heard you, and the grunt carries no warmth. A cold nod is still a nod, and he did give you one.","traps":{"0":"Warm would need a word or a smile in it. A grunt from behind a newspaper gives you nothing to read as warm."},"example":"A driver at a roundabout.<br>A flat nod with his eyes on the road.<br>He saw you, and that is all it says."}]},{"level":"Play","label":"Play, the week in motion","intro":"Gran has the cards and a pencil. Sort the week, then tell her which nods you took in.","items":[{"type":"scene","title":"Sunday, 14:30, Gran's kitchen","setting":"Gran is up to her elbows in suds. Leo has his spelling cards, and she wants every line anybody said to you this week.","meters":{"you":60,"them":50},"beats":[{"who":"Gran","text":"\u201cYour mother says you went grey at the table. What happened?\u201d","cue":"passing a wet plate without looking","lines":[{"text":"\u201cDad grunted at the certificate and I couldn't read it.\u201d","tag":"best","you":0,"them":5,"outcome":"Gran gives a short laugh. \u201cA grunt. That's a speech, for him. Go on.\u201d","why":"Saying the real thing lets her help. She asked a real question, and the small truth gave her something to work with."},{"text":"\u201cI'm fine, Gran. I'm just full.\u201d","tag":"ok","you":-4,"them":0,"outcome":"\u201cFull people don't dry a plate like that.\u201d","why":"Saying you're full closes the door on the one person offering to listen. Gran has heard that line before, and she says so."}]},{"who":"Gran","text":"\u201cRight. Every word anyone said to you this week, family or stairwell. Leo writes, I judge.\u201d","cue":"slides the spelling cards across the table to Leo","lines":[{"text":"\u201cGo on, then.\u201d","tag":"best","you":2,"them":3,"outcome":"Leo licks his pencil. Gran waits for your first line.","why":"Saying yes to the list lets you see which nods you have been carrying. Checking them is the whole point of the sort."},{"text":"\u201cCan we do the pudding first?\u201d","tag":"ok","you":-2,"them":-2,"outcome":"\u201cPudding after. The cards are not going anywhere.\u201d","why":"Asking to skip it is reasonable, but it only moves the sorting later. She still wants the week, and so do you."}]},{"who":"Gran","text":"\u201cTwelve cards. Warm or cold, for what you did or for who you are. Leo, a corner each.\u201d","cue":"taps the table twice","lines":[{"text":"\u201cRight. Let's do it.\u201d","tag":"best","you":2,"them":2,"outcome":"Leo slides the first card across. He has spelt \u201ccertificate\u201d with an s in the middle, and you leave it alone.","why":"Looking at each line as data, not as a verdict on you, keeps the sort fair."},{"text":"\u201cCan't I just say it was a good week?\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cA good week, you said. Sort the cards.\u201d","why":"A quick \u201cgood week\u201d is the bounce in another form. Gran won't take the summary, so you get the cards."}]}],"example":"A family group chat.<br>Aunt: \u201cWell done on the course!\u201d<br>You reply \u201cIt was nothing.\u201d The praise is still there, and it has nowhere to land."},{"type":"sort","prompt":"Put each line in its corner. Warm or cold, for doing or for being.","bins":["Warm, for doing","Warm, for being","Cold, for doing","Cold, for being"],"items":[{"text":"Dad lifts his chin at you from the sofa, eyes still on the football.","answer":3,"why":"He registered you and put no warmth in it. Cold, and it is for being there at all."},{"text":"\u201cYou've left the tap dripping again.\u201d","answer":2,"why":"Mum is talking about one thing you did. Cold, for doing."},{"text":"\u201cYou did my knee up in a minute. I barely felt it.\u201d","answer":0,"why":"Grace is pleased with what you did, and she says so. Warm, for doing."},{"text":"\u201cSit by me!\u201d","answer":1,"why":"Leo wants you next to him and asks for no favour. Warm, for being."},{"text":"\u201cOh. It's you.\u201d (through a gap in Mrs Kale's door)","answer":3,"why":"She registers who is on the landing and puts nothing warm in it. The line is about who you are. Cold, for being."},{"text":"Mum touches your sleeve to check it is dry.","answer":1,"why":"She checks because you are on her mind, and you did nothing to earn it. Warm, for being."},{"text":"\u201cYour folder is on my chair.\u201d","answer":2,"why":"Dad is talking about one thing you left behind. Cold, and aimed at what you did."},{"text":"\u201cGood. Somebody in this house should know what to do.\u201d","answer":0,"why":"Gruff, and still praise for the course you finished. Warm, for doing."},{"text":"\u201cThere he is.\u201d","answer":1,"why":"Gran says it every time you walk in. She is glad of you. Warm, for being."},{"text":"Dad passes the salt without looking up.","answer":3,"why":"Small and cold, but it reaches you as a person and asks nothing of you. Cold, for being."},{"text":"\u201cCome down Sunday. I'll make the pie you like.\u201d","answer":1,"why":"Mum plans a pie around you. She cares that you are there and fed. Warm, for being."},{"text":"\u201cCome up for tea whenever. The door's always on the latch.\u201d","answer":1,"why":"Grace is offering you a place in her day with nothing owed. Warm, for being."}],"example":"A family dinner chat.<br>\u201cLovely photo!\u201d gets three hearts.<br>\u201cWho's collecting Gran?\u201d gets silence."},{"type":"scene","title":"Sunday, 15:00, Gran's kitchen","setting":"The cards are sorted. Gran wants to know which nods you let in, and then she means to take the bin bags out to the yard.","meters":{"you":60,"them":50},"beats":[{"who":"Gran","text":"\u201cNow. Which of those did you actually let in?\u201d","cue":"dries her hands on her apron, the warm cards lined up","lines":[{"text":"\u201cGrace's one, and Mum's sleeve one. Those two.\u201d","tag":"ok","you":2,"them":3,"outcome":"She nods, slowly. \u201cGood. Keep those.\u201d","why":"Taking a warm nod in is the fix. Two of them is a start, and it shows you can let one land."},{"text":"\u201cNone. Family says that kind of thing out of habit.\u201d","tag":"ok","you":-6,"them":-4,"outcome":"\u201cThen they'll keep being nothing to you,\u201d she says, and turns the cards face down.","why":"Ruling out every warm nod keeps the week cold. The nods were there, and you decided they didn't count."},{"text":"\u201cI bounced most of them. That's mine to own.\u201d","tag":"best","you":6,"them":4,"outcome":"She doesn't smile. She holds your eye, though. \u201cRight. Let's go through them.\u201d","why":"Naming the bounce is what breaks it. A warm nod you can see is a warm nod you can take.","flags":["bounce_count_w1"]}]},{"who":"Gran","text":"\u201cYour father said somebody in this house should know what to do, and you told him anyone can pass that course. Leo said sit by me, and you said later. Two bounces.\u201d","cue":"reading from the cards, one eyebrow up","lines":[{"text":"\u201cFair. The next one I'll take.\u201d","tag":"best","you":3,"them":3,"outcome":"She smiles. \u201cThat's the fix. Noticing it.\u201d","why":"Seeing a bounce while it happens is most of the fix. The next nod has a chance to land."},{"text":"\u201cIt really was a short course, Gran.\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cThere it goes again.\u201d","why":"That is the same bounce with a new excuse. The nod goes back across the table, and the giver feels brushed off."},{"text":"\u201cIs the kettle on?\u201d","tag":"ok","you":-3,"them":-1,"outcome":"\u201cKettle in two minutes. You're still dodging.\u201d","why":"Changing the subject is a bounce too. It works for a minute and stops the nod before you can look at it."}]},{"who":"Gran","text":"\u201cNow I'm taking the bin bags out to the yard, and nobody is stopping me.\u201d","cue":"already gripping two bags in each hand","lines":[{"text":"\u201cYou've been on your feet since seven. I'll take them.\u201d","tag":"best","you":4,"them":4,"outcome":"She stops at the door. \u201c\u2026Nobody asks me that.\u201d","why":"Taking the job off the person who always does it hands her a nod she rarely gets. It asks nothing back, so it lands."},{"text":"\u201cThanks, Gran, you're an angel.\u201d","tag":"ok","you":0,"them":2,"outcome":"The back door swings shut before you finish.","why":"A warm nod for doing, handed to someone who gets plenty of those. It is kind, and it misses her through a closing door."},{"text":"Sit and wait for her to come back.","tag":"ok","you":-3,"them":-2,"outcome":"The bags thump across the yard. The kettle clicks off by itself.","why":"Letting her do everything without an offer keeps her in the same job, which is where she already is."}]}],"example":"A grandmother who always cooks.<br>\u201cSit down, I'll carry that.\u201d<br>The offer that comes back is the one she remembers."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"Dad said somebody in this house should know what to do, and you told him anyone can pass that course. Why does batting that away cost you?","options":["It sends the nod back before it lands, so Dad feels brushed off and you stay short","It shows you are modest, and a modest son is easier for a gruff father to respect, so nothing is lost","It only matters when the giver is a boss or a teacher, and a father's praise is too ordinary to count"],"answer":0,"why":"The bounce is waving a warm nod away before it lands. Dad managed a rare bit of praise, you said it was nothing, and he is left feeling brushed off while you go short.","traps":{"1":"Modesty feels safe, but the nod still never sinks in. A gruff father says little, so a bounced nod means a long wait for the next.","2":"The bounce works the same whoever gives the nod. A father's praise is rare, which makes it the one to take in."},"example":"A parent at a graduation.<br>\u201cI'm proud of you.\u201d<br>You reply \u201cIt's only a diploma,\u201d and the pride has nowhere to go."}]}]},{"setting":"Relationships","blurb":"Clara's text has sat unanswered for nineteen hours, and Gemma, who is too honest, wants the whole week.","opener":{"setting":"Sunday, 18:10. Gemma's sofa. Your phone lies face down on the cushion, and Clara's text from Saturday breakfast is still unanswered.","lines":[{"who":"Gemma","text":"\u201cNineteen hours. Show me what she said.\u201d","cue":"holds out a hand without looking up from the lasagne"},{"who":"Gemma","text":"\u201c...\u201d","cue":"waits, oven glove still on"}],"ask":"Which of the nods you got this week did you actually let in, and which did you wave away?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Each card is one line from this week. Tap what kind of nod it was.","items":[{"type":"pick","who":"Clara","text":"\u201cMorning.\u201d (to her laptop)","cue":"Monday, standup, three feet away","options":["Cold","Warm"],"answer":0,"why":"Cold. She registers you and puts no warmth in it. A flat morning is still a nod, only a cold one.","traps":{"1":"Warm would need something in her voice or her face. She said it to the laptop, so warm reads in more than she gave."},"example":"A colleague in the lift.<br>\u201cMorning.\u201d (eyes on her phone)<br>You were seen, and that is the whole message."},{"type":"pick","who":"Clara","text":"\u201cI'm glad it was you.\u201d","cue":"Friday, outside the restaurant, coat half on","options":["For doing","For being"],"answer":1,"why":"For being. She is glad it was you in particular, and nothing you did earned that. It is warm, and it needs nothing back.","traps":{"0":"For doing would mean she was praising something you did, like the booking. She is glad about you, whatever you booked."},"example":"A friend at a station.<br>\u201cI'm glad it's you meeting me.\u201d<br>The gladness is about who walked up, with no job attached."},{"type":"pick","who":"Clara","text":"\u201cThank you for last night. You made it easy.\u201d","cue":"Saturday, 10:12, the text that is still unanswered","options":["Warm","Cold"],"answer":0,"why":"Warm. She is thanking you for how the evening went, and she said it plainly. It is still sitting there, and the waiting is a bounce of its own.","traps":{"1":"Cold would mean she was brushing you off. She wrote to thank you, and for Clara that is a big step."},"example":"A text after a party.<br>\u201cThanks for having us, lovely night.\u201d<br>Warm, and it waits for an answer."}]},{"level":"Play","label":"Play, the week in motion","intro":"Gemma has the whole week typed into her phone. Sort it, then tell her which nods you took in.","items":[{"type":"scene","title":"Sunday, 18:15, Gemma's sofa","setting":"Gemma is too honest to be tactful and too fond of you to stop. She has an oven glove on one hand and your whole week to go through.","meters":{"you":60,"them":50},"beats":[{"who":"Gemma","text":"\u201cNineteen hours. Her text has sat there since Saturday breakfast, and you've been walking round it like a puddle.\u201d","cue":"pulls the lasagne out and shuts the oven with her hip","lines":[{"text":"\u201cI read it eleven times. I couldn't think what to say.\u201d","tag":"best","you":0,"them":5,"outcome":"Gemma puts the dish down. \u201cThere. That wasn't hard. Go on.\u201d","why":"Saying the true thing gives Gemma something to work with. She asked about the silence, and the number eleven is the real answer."},{"text":"\u201cShe's busy. She'll know I'm busy too.\u201d","tag":"ok","you":-4,"them":0,"outcome":"\u201cYou are not busy. You are on my sofa.\u201d","why":"Calling it busy closes the question. Gemma has watched you hold that phone for an hour, and she says so."}]},{"who":"Gemma","text":"\u201cRight. Everything Clara has said to you since Monday. I'll type it in, and you tell me what kind of nod it was.\u201d","cue":"thumbs ready over her screen","lines":[{"text":"\u201cFine. Start with Monday.\u201d","tag":"best","you":2,"them":3,"outcome":"She types a word and looks up.","why":"Saying yes to a list of the week lets you see which nods you have been carrying. Checking them is the whole point of the sort."},{"text":"\u201cCan we eat first?\u201d","tag":"ok","you":-2,"them":-2,"outcome":"\u201cLasagne in twenty minutes. List now.\u201d","why":"Asking to eat first is reasonable, but it only moves the sorting later. She still wants the week, and so do you."}]},{"who":"Gemma","text":"\u201cTwelve lines. Warm or cold, for what you did or for who you are. I read, you place.\u201d","cue":"turns the screen so you can see it","lines":[{"text":"\u201cGo on. Read the first one.\u201d","tag":"best","you":2,"them":2,"outcome":"She reads it flat, like a register. Clara's week comes out one line at a time.","why":"Hearing each line read out plainly takes your worry off it. You can judge it as information."},{"text":"\u201cIt's just her being polite, isn't it?\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cPolite is a nod too. Place it.\u201d","why":"Calling all of it politeness is the bounce before you have looked. Gemma won't take a verdict until the lines are sorted."}]}],"example":"A friend who reads your texts aloud.<br>\u201cShe said what? Say it again, slowly.\u201d<br>Heard in someone else's voice, the line is easier to weigh."},{"type":"sort","prompt":"Put each line in its corner. Warm or cold, for doing or for being.","bins":["Warm, for doing","Warm, for being","Cold, for doing","Cold, for being"],"items":[{"text":"\u201cTwo? Follow me.\u201d (said by the waiter, already walking)","answer":3,"why":"He registers you as a table of two and adds no warmth. Cold, and it is for being there at all."},{"text":"\u201cThe deploy note went out a day late.\u201d","answer":2,"why":"Daniel is talking about one thing you did, and he said it with no warmth. Cold, for doing."},{"text":"\u201cYou picked somewhere quiet. Thank you.\u201d","answer":0,"why":"Clara is thanking you for a choice you made. Warm, and aimed at what you did."},{"text":"Clara laughs at your joke before you have finished it.","answer":1,"why":"She laughs because she is with you, and the joke only starts it. Warm, for being."},{"text":"\u201cOh, you're in.\u201d (Daniel, to his monitor)","answer":3,"why":"Daniel registered that you turned up and put no warmth into it. The line is about you being there. Cold, for being."},{"text":"Clara keeps a chair for you in the canteen, bag on the seat.","answer":1,"why":"She holds a place for you and asks nothing. Warm, for being."},{"text":"\u201cThat's the wrong link.\u201d (Clara, in the team chat)","answer":2,"why":"A plain correction about your work. Cold, and aimed at what you did."},{"text":"\u201cGood, you booked a table. I expected you to say wherever.\u201d","answer":0,"why":"Gemma is pleased you made a plan. Warm, and for doing."},{"text":"The bus driver gives you a flat nod as you tap your card.","answer":3,"why":"Small and cold, but it reaches you as a person and asks nothing of you. Cold, for being."},{"text":"\u201cYou've got ink on your ear.\u201d (Clara reaches over and wipes it)","answer":1,"why":"A tiny fuss over you looking all right. Warm, for being."},{"text":"\u201cSit down. You look like you lost a fight with a shopping trolley.\u201d","answer":1,"why":"The complaint is the affection. Gemma cares that you are here in one piece. Warm, for being."},{"text":"\u201cText me after. I mean it.\u201d","answer":1,"why":"She wants to hear about you, with nothing earned. Warm, for being."}],"example":"A chat with a friend about a date.<br>\u201cDid she laugh?\u201d gets an answer in a minute.<br>\u201cDid you reply?\u201d gets nothing."},{"type":"scene","title":"Sunday, 18:50, Gemma's sofa","setting":"The lines are sorted and the lasagne is cooling. Gemma wants to know which nods you let in, and then she has a job for your thumbs.","meters":{"you":60,"them":50},"beats":[{"who":"Gemma","text":"\u201cWhich of those did you actually let in?\u201d","cue":"reading the warm lines back off her phone","lines":[{"text":"\u201cThe chair one. I took that.\u201d","tag":"ok","you":2,"them":3,"outcome":"She nods. \u201cGood. Keep that one.\u201d","why":"Taking a warm nod in is the fix. One of them is a start, and it shows you can let one land."},{"text":"\u201cI bounced most of them. I'll own that.\u201d","tag":"best","you":6,"them":4,"outcome":"She doesn't smile. She holds your eye, though. \u201cRight. Let's go through them.\u201d","why":"Naming the bounce is what breaks it. A warm nod you can see is a warm nod you can take.","flags":["bounce_count_w1"]},{"text":"\u201cNone. She was being polite.\u201d","tag":"ok","you":-6,"them":-4,"outcome":"\u201cThen you'll keep hearing nothing,\u201d she says, and locks the screen.","why":"Ruling out every warm nod keeps the week cold. The nods were there, and you decided they didn't count."}]},{"who":"Gemma","text":"\u201cClara said she was glad it was you, and you told her anyone would have asked. She said you made it easy, and you said it was only dinner. Two bounces, both to her face.\u201d","cue":"puts the phone down on her knee","lines":[{"text":"\u201cOkay. I see it. The next one is mine to take.\u201d","tag":"best","you":3,"them":3,"outcome":"She smiles. \u201cThat's the fix. Noticing it.\u201d","why":"Seeing a bounce while it happens is most of the fix. The next nod has a chance to land."},{"text":"\u201cIt was only dinner, though.\u201d","tag":"ok","you":-4,"them":-2,"outcome":"\u201cThere it goes again.\u201d","why":"That is the same bounce with a new excuse. The nod goes back across the table, and the giver feels brushed off."},{"text":"\u201cIs the lasagne cool enough yet?\u201d","tag":"ok","you":-3,"them":-1,"outcome":"\u201cLasagne after the text. You're stalling.\u201d","why":"Changing the subject is a bounce too. It works for a minute and stops the nod before you can look at it."}]},{"who":"Gemma","text":"\u201cPhone. Reply to her. I'm not cutting this lasagne until you've pressed send.\u201d","cue":"holds the knife over the dish","lines":[{"text":"\u201cFriday was good because it was you. Thursday, same table?\u201d","tag":"best","you":4,"them":4,"outcome":"Gemma lowers the knife. \u201cShe gets to keep that one. Send it.\u201d","why":"Telling her it was good because of who she is gives her a nod with no usefulness behind it. Clara finds that hard to take, and that is why it matters."},{"text":"\u201cThanks, glad it was easy. Busy week, talk soon.\u201d","tag":"ok","you":-3,"them":-2,"outcome":"Gemma reads it aloud. \u201cThat's a bounce with a stamp on it.\u201d","why":"A neat reply that hands the thanks straight back is the bounce in a text. It is polite, and she will read it as a closed door."},{"text":"\u201cI'll send something after I've eaten.\u201d","tag":"ok","you":-3,"them":-2,"outcome":"The knife goes in. The phone stays face down.","why":"Putting it off is a bounce by delay. Another hour on the cushion makes it twenty hours, and the silence says something too."}]}],"example":"A friend who is slow to text back.<br>\u201cSay it plainly. It was good because of you.\u201d<br>The plain line is the one that stays."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"You","text":"Clara said you made it easy, and you told her it was only dinner. Why does batting that away cost you?","options":["It keeps things light on a second date, where anything heavier would scare her off and spoil the mood","It makes no difference, because a few words over dinner are too small to count as a nod at all","It sends her thanks back before it lands, so she feels brushed off and you stay short"],"answer":2,"why":"The bounce waves a warm nod away before it lands. Clara said something hard for her to say, you passed it back as only dinner, and she is left feeling brushed off while you go short.","traps":{"0":"Keeping it light feels safe. Clara can't take a compliment she hasn't earned, so a bounced one only confirms for her that it was worth nothing.","1":"Small nods are the ones people live on. The words were short, and the nod still never landed."},"example":"A colleague after a presentation.<br>\u201cThat slide of yours was great.\u201d<br>You say \u201cOh, it was just a template,\u201d and the praise goes back unopened."}]}]}]};</script>
