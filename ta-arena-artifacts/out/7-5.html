ne\"/><circle cx=\"9\" cy=\"27\" r=\"4\" fill=\"url(#w6g)\" stroke=\"#fff\" stroke-width=\"1.2\"/><circle cx=\"27\" cy=\"27\" r=\"4\" fill=\"url(#w6g)\" stroke=\"#fff\" stroke-width=\"1.2\"/><line x1=\"12.5\" y1=\"24\" x2=\"23.5\" y2=\"24\" stroke=\"#FFFC00\" stroke-width=\"1.5\" stroke-dasharray=\"2 2\"/></svg>", "7": "<svg class=\"emb\" viewBox=\"0 0 36 36\" aria-hidden=\"true\" focusable=\"false\"><radialGradient id=\"w7g\" cx=\"50%\" cy=\"100%\" r=\"80%\"><stop offset=\"0%\" stop-color=\"#FFFC00\"/><stop offset=\"60%\" stop-color=\"#F59E0B\"/><stop offset=\"100%\" stop-color=\"#D97706\"/></radialGradient><path d=\"M7 23 A11 11 0 0 1 29 23 Z\" fill=\"url(#w7g)\" stroke=\"#FFFC00\" stroke-width=\"1.5\"/><line x1=\"3\" y1=\"23\" x2=\"33\" y2=\"23\" stroke=\"#FDE68A\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><g stroke=\"#FFFC00\" stroke-width=\"2.5\" stroke-linecap=\"round\"><line x1=\"18\" y1=\"5\" x2=\"18\" y2=\"9\"/><line x1=\"8\" y1=\"9\" x2=\"11\" y2=\"12\"/><line x1=\"28\" y1=\"9\" x2=\"25\" y2=\"12\"/><line x1=\"31\" y1=\"17\" x2=\"27\" y2=\"18\"/><line x1=\"5\" y1=\"17\" x2=\"9\" y2=\"18\"/></g></svg>"};</script>
<script>window.TA_GAME = {"slot":"7.5","setting":"Home & Flatmates","title":"Choose Your Own Move","world":7,"worldName":"Free to Choose","week":7,"weekName":"Free to Choose","mechanic":"Choice-story","concept":"After this one you can pick the move that is yours in three short moments, not the one you were trained to make.","plainWord":"being your own person","bookTerm":"Awareness, spontaneity, intimacy","bookIdea":"Berne says autonomy shows up as three recovered capacities: awareness, which is seeing and hearing for yourself in the here and now instead of as you were taught; spontaneity, which is the freedom to choose and show your feelings from the whole range of Parent, Adult and Child instead of only the taught ones; and intimacy, which is game-free candour, and he adds that you start life with all three, lose them to early adaptation, and have to keep winning them back.","bookSource":"Games People Play, ch. 16 and 17","opener":{"setting":"Saturday, 10:15am, the balcony, Hawthorn Court, apartment 3B. The sun is already hot on the railings.","lines":[{"who":"Gran","text":"\u201cMorning, love. Sit down, I've got something for you.\u201d","cue":"coming up the step slowly, one hand on the railing, knees creaking"}],"ask":"In each of the next three moments, which move is yours, and which one is the script?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Being your own person has three parts. Noticing is seeing and hearing for yourself, here and now, in your own way and without the labels you were handed. Choosing fresh is picking the feeling and the reply you want from all your voices, including the ones you were never taught to use. Being real is plain candour with no game in it.","items":[{"type":"pick","who":"You","text":"\u201cHang on, Gran. Smell that. It's sharp and cold, and the peel is thick on one side.\u201d","cue":"peeling the orange, eyes on your thumbs","options":["Noticing","Choosing fresh","Being real"],"answer":0,"why":"You take the orange in with your own senses, here and now, and describe it in your own words instead of saying the polite thing you were taught. That is noticing.","traps":{"1":"Choosing fresh. It sounds like a new reply, but the line only describes the orange. Nothing was picked against a habit.","2":"Being real. It is honest, but the line tells her nothing about how you feel. It stays with the orange, which is noticing."},"example":"Mango stall, by the bus stop, Saturday, 8:00am.<br>Customer: \u201cThese look tired. Is the one at the front fresher?\u201d<br>Vendor: \u201cYes. Smell it, you'll see.\u201d"},{"type":"pick","who":"You","text":"\u201cFine is what I always say. Tonight it's starving, and a bit cross, and I want a biscuit before the rice.\u201d","cue":"to Maya, at the stove, who expected 'fine'","options":["Noticing","Choosing fresh","Being real"],"answer":1,"why":"You catch the usual 'fine' coming and pick a different feeling to show, a hungry, cross, playful one. Choosing which feeling to show, instead of only the taught one, is choosing fresh.","traps":{"0":"Noticing. You do catch the habit, but the work of the line is picking a different feeling to show. Noticing alone would stop at 'I'm about to say fine'.","2":"Being real. It is honest, but the heart of the line is the switch from the taught reply to a chosen one. The candour in it comes second."},"example":"Office lift, Monday, 8:55am.<br>Colleague: \u201cGood weekend?\u201d<br>You (who always say \u201cYes, fine\u201d): \u201cLoud. A wedding, and I'm shattered, and I loved it.\u201d"},{"type":"pick","who":"You","text":"\u201cNo, Mum, I skip lunch when the deadlines close in. I'm scared the money won't stretch, and I didn't want you to worry.\u201d","cue":"on the balcony, phone pressed to your ear","options":["Noticing","Choosing fresh","Being real"],"answer":2,"why":"You say the plain thing with no joke, no hint and no hook, and no game in it. That is being real.","traps":{"0":"Noticing. You do notice the deadlines, and that is in the line. But noticing alone stays on the facts, and this line goes on to say how you feel.","1":"Choosing fresh. It is a new answer to 'are you eating', but what makes it new is the honesty, so the better name is being real."},"example":"Sister's WhatsApp, Sunday night.<br>Sister: \u201cAre you sleeping? Tell me the truth.\u201d<br>You: \u201cNot well. The baby's cough keeps me up, and I didn't want to say it.\u201d<br>Sister: \u201cOh. Now we can talk.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Three short scenes. In each one, pick the move that is yours, not the one you were taught.","items":[{"type":"scene","title":"Saturday, 10:15am, the balcony","setting":"Gran has come up the step with a single orange from the morning stall, still cold from the bag.","meters":{"you":60,"them":50},"beats":[{"who":"Gran","text":"\u201cEat this orange while it's cold. I walked to the stall for it this morning.\u201d","cue":"pressing it into your hand","lines":[{"text":"\u201cThank you, Gran. You shouldn't have gone out.\u201d","tag":"ok","you":0,"them":2,"outcome":"She waves it off. \u201cWalking is good for me,\u201d she says, and sits down on the step.","why":"This is the polite script. It is kind, and it skips the orange, which is the thing she actually gave you."},{"text":"\u201cIt smells sharp. Did you pick it yourself, or is that the stall's?\u201d","tag":"best","you":3,"them":4,"outcome":"Gran's face opens. \u201cI picked it. Look, you can see my thumb mark on the skin.\u201d","why":"You notice what is actually here, the smell and the thumb mark on the peel. Noticing gives her something real back."},{"text":"\u201cYou always do this. Now I owe you, and you'll keep telling me so.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Gran puts the orange on the step and says nothing about it.","why":"This turns a gift into a debt. The orange becomes a ledger entry, and she will keep reminding you of the price."}]},{"who":"Gran","text":"\u201cGo on, peel it. Tell me something from the week. I never hear anything.\u201d","cue":"watching your hands on the peel","lines":[{"text":"\u201cI'm peeling it badly. The demo went well, and I'm a bit proud of it.\u201d","tag":"best","you":3,"them":4,"outcome":"Gran claps once. \u201cBadly is still an orange,\u201d she says, and leans in for the details.","why":"You say how you are, with a small true detail about yourself. It is a fresh line, not the one you would have said at the start of the year."},{"text":"\u201cNothing much happened this week, Gran.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She nods and goes back to her knee, which she describes in full.","why":"It is the scripted small talk. That closes the door on the one thing she asked for."}]},{"who":"Gran","text":"\u201cIs it sweet? Tell me it's sweet, or I'll think the stall cheated me.\u201d","cue":"laughing at her own joke, one hand on the railing","lines":[{"text":"\u201cIt's sweet at the back and sharp at the front. A bit like you, Gran.\u201d","tag":"best","you":3,"them":4,"outcome":"She pats your arm. \u201cFlatterer. Eat the rest, and don't waste the peel.\u201d","why":"You notice the taste exactly, and you say one true thing about her. It has warmth in it because it is specific."},{"text":"\u201cIt's lovely, Gran. Thank you.\u201d","tag":"ok","you":0,"them":1,"outcome":"She nods, pleased. Then she asks about the knee again.","why":"A polite yes that ends the moment. There is nothing wrong with it, and nothing new in it either."}]}],"payoff":"Saturday, 10:40am. The orange goes soft on the step, and Gran brings up the debt at lunch and again at dinner.","example":"Sweet shop, by the bus stop, Friday.<br>Shopkeeper: \u201cTry the fudge, it's on the house. You can owe me a visit.\u201d<br>You: \u201cThanks. Which one's the fresh one?\u201d"},{"type":"scene","title":"Tuesday, 8:20pm, the kitchen","setting":"Apartment 3B. Maya is at the stove, still in her scrubs. The rice has been on for an hour.","meters":{"you":55,"them":45},"beats":[{"who":"Maya","text":"\u201cDid you eat? Don't say fine.\u201d","cue":"not turning round","lines":[{"text":"\u201cI'm fine, Maya. I'll eat later.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"Maya says \u201cFine\u201d back and turns the gas down. The kitchen goes quiet.","why":"This is the trained reply. It answers the question and closes the door, so the two of you carry on apart."},{"text":"\u201cNo, I haven't. Sit with me for ten minutes while I eat, if you can.\u201d","tag":"best","you":4,"them":4,"outcome":"Maya turns round, surprised. She pulls out a chair. \u201cTen minutes. Then I'm back on the rice.\u201d","why":"You answer from a fresh place, with the true thing and a request for company. It breaks the old loop, and she gets to be asked for something instead of only doing the cooking."},{"text":"\u201cSure, Maya. Like you ever sit down for anyone.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Maya stops stirring and says \u201cRight,\u201d then eats standing at the sink, alone.","why":"This is a sting dressed up as a reply. It gives her the accusation she has already filed, and nobody sits down."}]},{"who":"Maya","text":"\u201cOkay. Then what's the matter? You look like you're carrying the whole building.\u201d","cue":"pulling out the chair, not sitting yet","lines":[{"text":"\u201cNothing serious. Just work.\u201d","tag":"ok","you":-1,"them":0,"outcome":"She nods and turns back to the rice.","why":"Work is the safe answer, and it keeps the two of you at arm's length."},{"text":"\u201cThe bank called about the deposit, and I've been telling everyone it's fine all day.\u201d","tag":"best","you":3,"them":4,"outcome":"Maya sits down, for the first time all day. \u201cThen it isn't fine. Tell me the number.\u201d","why":"You name the word you have been using as a shield, and the real thing under it. Choosing fresh is a line that didn't come from the reflex."}]},{"who":"Maya","text":"\u201cRight. Ten minutes. Tell me the number, and don't make it smaller.\u201d","cue":"a plate in each hand now, setting one down for you","lines":[{"text":"\u201cIt's a big fee, and I told the landlord Friday. I'm not calm about it at all.\u201d","tag":"best","you":3,"them":4,"outcome":"Maya puts the plate down. \u201cOkay. Friday's a real day. Let's do the sums.\u201d","why":"You give the true number with the deadline, and you don't shrink it. Being real means saying the thing at its actual size."},{"text":"\u201cIt's fine, we'll sort it.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She picks her plate up again. \u201cGood, then,\u201d and eats standing at the stove.","why":"Fine again. It shuts the door she just opened, and it leaves her eating alone in the same kitchen."}]}],"payoff":"Tuesday, 8:40pm. Maya stops stirring and eats standing at the sink, alone. The rice goes cold on the back burner.","example":"Chemist shop, by the station, 7:30pm.<br>Pharmacist: \u201cAre you feeling okay? Tell me the truth.\u201d<br>You: \u201cNot really. I've got a cough that keeps me up.\u201d"},{"type":"scene","title":"Sunday, 9:30pm, the balcony","setting":"Mum calls from 600 km away, the way she does on the ten-minute mark of your evening. A tap is running in the background at her end.","meters":{"you":50,"them":50},"beats":[{"who":"Mum","text":"\u201cAre you eating properly? Tell me the truth, not the thing you say.\u201d","cue":"her voice at the edge of worry, the tap still running","lines":[{"text":"\u201cYes, Mum, I eat every day. Don't worry.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Mum says \u201cGood, good,\u201d and then asks about the rent again, which means she heard the gap in your voice.","why":"This is the script: the reassurance that closes the call on the worry. It sounds loving, and it leaves her with a number she can't check."},{"text":"\u201cNot always. When the deadlines close in, I skip lunch, and I'm scared the money won't stretch. I didn't want you to worry.\u201d","tag":"best","you":4,"them":5,"outcome":"There is a long pause. Then Mum says she'd rather know the days you skip, so she can call you at lunch.","why":"This is being real: plain candour with no game in it. You don't have to sound strong for the call, and she can hear where you actually are."},{"text":"\u201cYou always do this. Dad was the same, and now you want me to worry about you too.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Mum says \u201cFine,\u201d and ends the call before you can answer.","why":"This turns her worry into a charge against Dad and against you. The real question disappears under the old story."}]},{"who":"Mum","text":"\u201cThen what do you want from me? Tell me what you need.\u201d","cue":"the tap goes off at her end","lines":[{"text":"\u201cI want you to ask how I am, and then wait for the real answer.\u201d","tag":"best","you":3,"them":4,"outcome":"Mum goes quiet, then asks, \u201cHow are you, then?\u201d and waits.","why":"You say what you want, plainly, without asking her to fix your life. That is a real request for company, not a rescue."},{"text":"\u201cDon't worry about it, Mum. It'll sort itself out.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"She sighs and says Dad would have said the same. The call drifts off to the building society.","why":"This is the scripted close. It takes the need off the table and tells her the real thing isn't wanted."}]},{"who":"Mum","text":"\u201cTell me about your week, then. I never get to hear it.\u201d","cue":"the kettle starting at her end","lines":[{"text":"\u201cThe orange was sour, Mum. Gran made me laugh about the stall. Next time I'll call you from the balcony when it's quiet.\u201d","tag":"best","you":4,"them":6,"outcome":"Mum laughs, properly, for the first time in the call. \u201cBalcony, then. Ring me on Sunday.\u201d","why":"You offer a small, true detail from your week, which is a real gift to her. It doesn't need to be a confession to count as intimacy."},{"text":"\u201cWork's fine. Nothing to tell.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She says \u201cOkay,\u201d in the voice that means it isn't okay, and the call ends on the building society.","why":"This is the scripted close. It leaves her with the sense of a door shut, which is exactly what she was afraid of."}]}],"payoff":"Sunday, 9:45pm. Mum says \u201cFine\u201d and ends the call. In the morning she sends a photo of the kitchen calendar, with the holiday weekend circled and nothing else written on it.","example":"Gym, by the bus stop, Saturday.<br>Trainer: \u201cAre you doing the reps, or just standing there?\u201d<br>You: \u201cStanding. My shoulder's sore, and I didn't want to say so.\u201d<br>Trainer: \u201cGood. Then we do the easy set.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Name the part that was missing from that reply. Then sort three more moments.","items":[{"type":"pick","who":"Maya","text":"\u201cDid you eat? Don't say fine.\u201d You said fine anyway, though you knew you hadn't eaten, and the kitchen went quiet.","cue":"the spoon still in her hand","options":["Intimacy. You said too much to Maya, and the line handed her a weight she didn't need.","Spontaneity. 'Fine' was the reply you were taught for that question. The books call the freedom to choose and show a feeling from all your voices spontaneity, and you didn't use it.","Awareness. You didn't hear her question, so the reply came out of nowhere."],"answer":1,"why":"You knew you hadn't eaten, so awareness was working. The word 'fine' arrived without a choice, straight from what you were taught. Choosing a feeling from all your voices, instead of only the taught one, is spontaneity.","traps":{"0":"Intimacy. You didn't say too much, since the line gave her almost nothing. Candour does come into it, but a candid reply starts with picking a feeling to show, and 'fine' was never picked.","2":"Awareness. You heard the question and you knew the answer. The gap was in the reply you gave after that."},"example":"Dance class, Wednesday, 6:00pm.<br>Teacher: \u201cHow's your week? Don't say fine.\u201d<br>Student: \u201cFine.\u201d<br>Teacher: \u201cRight, see you Friday, then.\u201d"},{"type":"sort","prompt":"Three more moments, each with one capacity missing. Put each in the bin for the one that was missing.","bins":["Awareness","Spontaneity","Intimacy"],"items":[{"text":"\u201cI walked home rehearsing what to say to Daniel on Monday. The rain had stopped, and I never saw it.\u201d","answer":0,"why":"Body on the pavement, mind in Monday's meeting. Berne's test for awareness is where your mind is while your body is here."},{"text":"\u201cGran handed me the orange and I said \u2018You shouldn't have\u2019, same as always, though I was pleased and curious.\u201d","answer":1,"why":"Only the taught reply was on offer. Spontaneity is having the whole range of feelings to choose from, and here one rehearsed line covered all of them."},{"text":"\u201cI told Mum I was fine, then dropped hints about the bank, hoping she would offer to pay.\u201d","answer":2,"why":"The hints are a hook. Intimacy is candour with no game in it, and a hint is the opposite of asking plainly."}],"example":"Station platform, 8:05am.<br>Colleague: \u201cEverything all right?\u201d<br>You, eyes on your phone: \u201cFine.\u201d<br>You are three stops past the one where you meant to get off."}]}],"debrief":{"nadia":"You had all three this afternoon and lost one of them by evening, which is how it goes. The orange was real while you held it. The word 'fine' to your mother was not, and she heard the gap before you did. Nobody keeps all three running at once, all day. The only practice going is catching the old line before it leaves your mouth, and sometimes just after.","bookTerm":"Awareness, spontaneity, intimacy","bookNote":"The books call these awareness, spontaneity and intimacy, the three capacities of autonomy. Berne adds that overthrowing the old ways is never final, so you keep winning them back."},"reflection":{"prompt":"Where did you give the scripted reply this week when a fresh one was right there? What is actually stopping you from giving the fresh one next time?"},"next":"7.6","baseStory":{"setting":"Home & Flatmates","blurb":"Gran brings an orange to the balcony, and Mum's Sunday call tests the usual reply."},"moreStories":[{"setting":"Work","blurb":"A Thursday client demo, an export that dies on big files, and Daniel saying don't be late.","opener":{"setting":"Monday, 9:05am. Halden, the team room. The whiteboard has Thursday circled twice in red.","lines":[{"who":"Daniel","text":"\u201cDon't be late on this one. The client sees the export on Thursday at eleven, and I want it working on the big file, not the sample.\u201d","cue":"capping the pen, already looking at the clock"},{"who":"Clara","text":"\u201cI've run the sample twice. I came in at five.\u201d","cue":"eyes on her screen, a cold mug by her elbow"}],"ask":"In each of the next three moments, which move is yours, and which one is the script?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Being your own person has three parts. Noticing is seeing and hearing for yourself, here and now, in your own way and without the labels you were handed. Choosing fresh is picking the feeling and the reply you want from all your voices, including the ones you were never taught to use. Being real is plain candour with no game in it.","items":[{"type":"pick","who":"You","text":"\u201c'On it' is what I always say when you hurry me, Daniel. Today I'll try this one: the big file scares me a bit, and I'd like the checklist before I promise anything.\u201d","cue":"standing at the whiteboard, laptop under one arm","options":["Noticing","Choosing fresh","Being real"],"answer":1,"why":"You hear the usual 'on it' coming and pick a different reply, a scared and practical one. Choosing which feeling to show, instead of only the taught one, is choosing fresh.","traps":{"0":"Noticing. You do catch the habit, but the work of the line is the swap to a new reply. Noticing alone would stop at 'I always say on it'.","2":"Being real. It is candid, but the heart of the line is the switch from the taught reply to a chosen one. The candour comes second."},"example":"Bus queue, Friday, 5:40pm.<br>Friend: \u201cComing Saturday? Say yes, you always say yes.\u201d<br>You (who always say yes): \u201cHalf a yes. Excited, tired, and I'd like to leave by ten.\u201d"},{"type":"pick","who":"You","text":"\u201cClara's tea has been cold since nine. She hasn't looked up from that diff for an hour, and her left foot keeps tapping.\u201d","cue":"low voice, to Omar, across the desks","options":["Noticing","Choosing fresh","Being real"],"answer":0,"why":"You take in the cold mug, the stillness and the foot with your own senses, in your own words. No label like 'stressed' is stuck on her. That is noticing.","traps":{"1":"Choosing fresh. It sounds like a new line, but nothing is swapped for a habit here. The line only describes what is in front of you.","2":"Being real. It is kind, but the line says nothing about how you feel. It stays with what you can see, which is noticing."},"example":"Allotment, Saturday, 8:00am.<br>Neighbour: \u201cAnything wrong with the beans?\u201d<br>You: \u201cThe leaves are curled at the edges, and there's a sticky patch on the lowest ones.\u201d"},{"type":"pick","who":"You","text":"\u201cI'm stuck on the big file, and I'm a bit embarrassed. I'd rather ask you than pretend I've got it. Could you look at my diff after lunch?\u201d","cue":"stopping at Clara's desk, voice low","options":["Noticing","Choosing fresh","Being real"],"answer":2,"why":"You say the plain thing at its real size, with the feeling attached and no joke, hint or hook. Asking a colleague straight is being real.","traps":{"0":"Noticing. You do see that you are stuck, and it is in the line. But noticing alone stays on the facts, and this line goes on to say how you feel and what you want.","1":"Choosing fresh. It is a new answer to the habit of struggling alone, but what makes it new is the plainness, so the better name is being real."},"example":"Book club, Thursday, 8:00pm.<br>Host: \u201cDid anyone finish it?\u201d<br>You: \u201cNo. I stalled at chapter four and I'm embarrassed. Could someone tell me what happens?\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Three short scenes. In each one, pick the move that is yours, not the one you were taught.","items":[{"type":"scene","title":"Monday, 9:30am, the team room","setting":"Omar has left a printed test list on your desk, annotated in green pen. The paper is still warm from the printer.","meters":{"you":60,"them":50},"beats":[{"who":"Omar","text":"\u201cI ran the timeout checks for you. Eleven cases. Green pen means passed.\u201d","cue":"sliding the printout across with one finger","lines":[{"text":"\u201cThanks, Omar. You didn't have to do that.\u201d","tag":"ok","you":0,"them":2,"outcome":"He shrugs. \u201cOnly took the morning,\u201d he says, and goes back to his screen.","why":"This is the polite script. It is kind, and it skips the list, which is the thing he actually made."},{"text":"\u201cOn case six you've written eight over a nine, and the ink is still shiny. What changed?\u201d","tag":"best","you":3,"them":4,"outcome":"Omar leans in. \u201cThe client's proxy cuts off at eight seconds. I redid it, and I'm glad someone saw.\u201d","why":"You notice what is actually on the page, the overwritten number and the wet ink. Noticing gives him something real back."},{"text":"\u201cYou always do this. Now I owe you a favour, and you'll bring it up at the retro.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Omar picks the printout up and says nothing about it.","why":"This turns a gift into a debt. The green pen becomes a ledger entry, and he has never kept one."}]},{"who":"Omar","text":"\u201cAnything on your side? I've got ten minutes before my review.\u201d","cue":"checking the clock over your shoulder","lines":[{"text":"\u201cThe export is ugly. Small files fly, and I'm a bit proud of those. The big one dies at sixty seconds.\u201d","tag":"best","you":3,"them":4,"outcome":"Omar nods slowly. \u201cProud and stuck at once. That's a normal Monday,\u201d he says, and sits on the edge of the desk.","why":"You say how you are, with a small true detail about the work. It is a fresh line, not the 'yeah, fine' you would have said at the start of the year."},{"text":"\u201cNothing much. Just the export.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"He glances at the clock and stands up. \u201cShout if you need me.\u201d","why":"This is the scripted small talk. It closes the door on the one thing he asked for."}]},{"who":"Omar","text":"\u201cDoes the list look usable, or did I waste green ink?\u201d","cue":"laughing at himself, capping the pen","lines":[{"text":"\u201cIt's neat everywhere except the margin by case four, where you've drawn a very angry duck. I like the duck.\u201d","tag":"best","you":3,"them":4,"outcome":"Omar grins. \u201cThat's the timeout. It looks like a duck when it gives up.\u201d He pins the list to your monitor himself.","why":"You notice a precise, odd detail and say one true thing about him. It has warmth in it because it is specific."},{"text":"\u201cIt's great, thanks.\u201d","tag":"ok","you":0,"them":1,"outcome":"He nods, pleased enough. Then he heads off to his review.","why":"A polite yes that ends the moment. There is nothing wrong with it, and nothing new in it either."}]}],"payoff":"Monday, 9:40am. Omar takes the printout back without a word and says he will do his own tests from now on. The green pen stays capped for the rest of the week.","example":"Shop counter, Friday, 4:30pm.<br>Colleague: \u201cI did the stock sheet for you.\u201d<br>You: \u201cYou've circled the tins twice, and one row is in red. What happened there?\u201d"},{"type":"scene","title":"Tuesday, 4:40pm, the team room","setting":"Daniel stops at your desk with a coffee, one eye on the release board. The big file is still failing on your second monitor.","meters":{"you":55,"them":45},"beats":[{"who":"Daniel","text":"\u201cWhere are we on export? Don't say 'nearly'.\u201d","cue":"not sitting down","lines":[{"text":"\u201cNearly, Daniel. Just polishing.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"\u201cNearly means no,\u201d Daniel says, and writes a red 4 on the board.","why":"This is the trained reply. It answers the question and closes the door, so the two of you carry on apart."},{"text":"\u201c'Nearly' is my usual word for it. Today's word is stuck, and a bit excited, because I think I've found where.\u201d","tag":"best","you":4,"them":4,"outcome":"Daniel looks up from the board. \u201cWhere?\u201d he asks, and for once he sits down.","why":"You answer from a fresh place, with a true feeling that is not the cheerful one. It breaks the old loop, and he gets a real report instead of a label."},{"text":"\u201cYou always do this, Daniel. You hurry us, then blame us when the release slips.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Daniel puts his coffee down on your desk, hard.","why":"This is a sting dressed up as a reply. It gives him the accusation he already expects, and nobody sits down."}]},{"who":"Daniel","text":"\u201cStuck where? Give me a number.\u201d","cue":"pen back in his hand","lines":[{"text":"\u201cI'll get it done by Thursday, don't worry.\u201d","tag":"ok","you":-1,"them":0,"outcome":"He taps the pen twice. \u201cI'm not worried. I'm asking.\u201d","why":"Reassurance is the safe answer, and it keeps the two of you at arm's length."},{"text":"\u201cThe big file takes ninety seconds, and the client's proxy cuts off at sixty. I need till Wednesday night.\u201d","tag":"best","you":3,"them":4,"outcome":"Daniel writes 90 and 60 on the board and underlines the gap. \u201cRight. That I can plan around.\u201d","why":"You name the real numbers and what you need. Choosing fresh is a line that didn't come from the reflex."}]},{"who":"Daniel","text":"\u201cEleven sharp on Thursday. I'm not going to say it again.\u201d","cue":"already walking away","lines":[{"text":"\u201cI'll be there at ten forty with a coffee for you. That's me choosing early, not me being told.\u201d","tag":"best","you":3,"them":4,"outcome":"Daniel stops. \u201cBlack,\u201d he says, without turning round, and nearly smiles at the board.","why":"You pick a playful, warm reply where the taught one would be a stiff promise. It is a fresh line, and it costs nothing."},{"text":"\u201cYes, Daniel. I won't be late.\u201d","tag":"ok","you":0,"them":1,"outcome":"He nods and keeps walking.","why":"A dutiful yes. It is safe, and nothing new is in it."}]}],"payoff":"Tuesday, 4:50pm. Daniel says \u201cRight\u201d and takes his coffee away. The red 4 stays on the board, circled, until Thursday.","example":"Greengrocer's, Saturday, 9:00am.<br>Owner: \u201cAny complaints about the plums? Don't say they're fine.\u201d<br>You: \u201cTwo were bruised, and I'm going to come back anyway, because the rest were the best I've had.\u201d"},{"type":"scene","title":"Wednesday, 6:15pm, the quiet meeting room","setting":"Daniel has shut the door. Through the glass you can see the release board and the last of the team packing up.","meters":{"you":50,"them":50},"beats":[{"who":"Daniel","text":"\u201cTell me the truth before the client does. Is Thursday safe?\u201d","cue":"arms folded, the door clicking shut","lines":[{"text":"\u201cIt'll be fine, Daniel. I've got it covered.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Daniel says \u201cGood,\u201d and then asks Clara whether it's covered, which means he heard the gap in your voice.","why":"This is the script: the reassurance that closes the meeting on the worry. It sounds capable, and it leaves him with a promise he can't check."},{"text":"\u201cMostly. The big file works since four, but I haven't run it through the client's proxy. I'm afraid it breaks live, and I didn't want to say.\u201d","tag":"best","you":4,"them":5,"outcome":"There is a long pause. Then Daniel says he would rather know now, so he can clear nine o'clock for you.","why":"This is being real: plain candour with no game in it. You don't have to sound sure for the meeting, and he can hear where you actually are."},{"text":"\u201cYou always do this, Daniel. You shout all week, then ask for the truth the night before.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Daniel says \u201cFine,\u201d opens the door and leaves it open.","why":"This turns his question into a charge against him. The real answer disappears under the old story about his temper."}]},{"who":"Daniel","text":"\u201cThen what do you need from me?\u201d","cue":"the glass fogging slightly behind him","lines":[{"text":"\u201cAsk Omar to cover my standup, and let me run the proxy test first thing. Nobody else needs me before ten.\u201d","tag":"best","you":3,"them":4,"outcome":"Daniel writes it on his hand. \u201cOmar covers. Proxy at nine. Done.\u201d","why":"You say what you want, plainly, without asking him to fix the whole project. That is a real request, not a rescue."},{"text":"\u201cDon't worry about it. I'll sort it out.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"He sighs and says Clara would have asked for something specific.","why":"This is the scripted close. It takes the need off the table and tells him the real thing isn't wanted."}]},{"who":"Daniel","text":"\u201cSomething from the week, then. Clara says you've been at it since seven.\u201d","cue":"sitting down at last","lines":[{"text":"\u201cClara found my off-by-one in ten minutes. I'd stared at it for two hours. I was cross, and then I was just glad.\u201d","tag":"best","you":4,"them":6,"outcome":"Daniel laughs, properly, for the first time all week. \u201cShe found mine in March. Don't tell her I said.\u201d","why":"You offer a small, true detail from your week, which is a real gift to him. It doesn't need to be a confession to count as intimacy."},{"text":"\u201cNothing to tell. Just work.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"He says \u201cOkay,\u201d in the voice that means it isn't, and checks his phone.","why":"This is the scripted close. It leaves him with the sense of a door shut, which is the thing he was braced for."}]}],"payoff":"Wednesday, 6:25pm. Daniel opens the door, says \u201cFine,\u201d and tells the room the export is covered. At eleven on Thursday it falls over in front of the client.","example":"Hospital corridor, Tuesday, 7:00pm.<br>Nurse: \u201cTell me the truth, are you in pain?\u201d<br>Patient: \u201cMore than I said. It's a six, and I didn't want to be a bother.\u201d<br>Nurse: \u201cGood. Then we sort the six.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Name the part that was missing from that reply. Then sort three more moments.","items":[{"type":"pick","who":"Daniel","text":"\u201cWhere are we on export? Don't say 'nearly'.\u201d You said \u201cNearly\u201d anyway, though you had watched it die on the big file twice that morning, and the red 4 went up on the board.","cue":"pen already on the whiteboard","options":["Intimacy. A candid reply would have given Daniel the whole picture, not one cheerful word.","Spontaneity. 'Nearly' was the taught reply, and no other feeling got a turn.","Awareness. You weren't watching your own screen, so the answer came out of thin air."],"answer":1,"why":"You had watched it fail, so awareness was working. The word 'nearly' arrived without a choice, straight from the habit of calming a hurrying boss. Choosing a feeling from all your voices, instead of only the taught one, is spontaneity.","traps":{"0":"Intimacy. Candour does come into it, but a candid reply starts with picking a feeling to show, and 'nearly' was never picked. It just arrived.","2":"Awareness. You watched the failure twice, so you knew exactly where things stood. The gap came in the reply you gave after that."},"example":"Reception desk, Monday, 9:00am.<br>Clerk: \u201cAny problems with the booking? Don't say fine.\u201d<br>Guest: \u201cFine.\u201d<br>Clerk: \u201cRight, you're in room nine.\u201d The leak above room nine goes unmentioned."},{"type":"sort","prompt":"Three more moments, each with one capacity missing. Put each in the bin for the one that was missing.","bins":["Awareness","Spontaneity","Intimacy"],"items":[{"text":"\u201cI ate the whole canteen lunch reading the release notes on my phone. I couldn't tell you what it was.\u201d","answer":0,"why":"Body at the table, mind in the notes. Awareness is being here and hearing and tasting for yourself, and lunch went by unseen."},{"text":"\u201cClara thanked me for the review and I said \u2018Anytime, no problem\u2019, same as for every thanks, though I wanted to tell her I liked doing it.\u201d","answer":1,"why":"One rehearsed line covered a whole range of feelings. Spontaneity is having that range to choose from, and here only the taught reply got a turn."},{"text":"\u201cI told Omar the demo was in hand, then left the failing export log open on my screen where he would see it.\u201d","answer":2,"why":"The open log is a hook. Intimacy is candour with no game in it, and leaving a hint around is the opposite of saying it plainly."}],"example":"Train carriage, 6:10pm.<br>Colleague: \u201cGood day?\u201d<br>You, eyes on your phone: \u201cFine.\u201d<br>You miss your stop."}]}]},{"setting":"Friends & Community","blurb":"Ruby says no fuss, Joseph is baking anyway, and your knee has been lying to the five-a-side group.","opener":{"setting":"Thursday, 6:50pm. The Corner Table, after closing. Chairs are going up on the tables and the radiator is ticking.","lines":[{"who":"Joseph","text":"\u201cShe said no fuss. So we're doing a small fuss. A cake, one candle, ten minutes.\u201d","cue":"balancing a stack of chairs under one arm"},{"who":"Nadia","text":"\u201cThe back table is yours from three on Saturday. Mind the radiator, it bites.\u201d","cue":"wiping the counter, not turning round"}],"ask":"In each of the next three moments, which move is yours, and which one is the script?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Being your own person has three parts. Noticing is seeing and hearing for yourself, here and now, in your own way and without the labels you were handed. Choosing fresh is picking the feeling and the reply you want from all your voices, including the ones you were never taught to use. Being real is plain candour with no game in it.","items":[{"type":"pick","who":"You","text":"\u201cI want to be in. I'm embarrassed: my knee has been bad for a month, and I keep playing on it so nobody thinks I'm soft.\u201d","cue":"on the bench, lacing a boot you can't quite bend to","options":["Noticing","Choosing fresh","Being real"],"answer":2,"why":"You say the plain thing at its real size, with the feeling attached and no joke, hint or hook. Telling Joseph straight is being real.","traps":{"0":"Noticing. You do notice the knee, and it is in the line. But noticing alone stays on the facts, and this line goes on to say how you feel.","1":"Choosing fresh. It is a new answer to 'sure, I'm in', but what makes it new is the candour, so the better name is being real."},"example":"Swimming baths, Saturday, 7:00am.<br>Coach: \u201cComing to the gala? Don't make me chase you.\u201d<br>You: \u201cI'd love to. I'm nervous, and I've been skipping practice so nobody sees me struggle.\u201d"},{"type":"pick","who":"You","text":"\u201c'Nice' is what I say about every haircut. Yours is a bit wild, I'm slightly jealous, and I want to touch the fringe.\u201d","cue":"grinning across the counter at Ruby","options":["Noticing","Choosing fresh","Being real"],"answer":1,"why":"You see the usual 'nice' coming and pick a playful, envious feeling to show instead. Choosing which feeling to show, not only the taught one, is choosing fresh.","traps":{"0":"Noticing. You do catch the habit, but the work of the line is picking a new feeling to show. Noticing alone would stop at 'I always say nice'.","2":"Being real. It is candid, but the heart of the line is the swap from the taught reply to a playful one. The candour comes second."},"example":"Hairdresser's, Friday, 5:15pm.<br>Stylist: \u201cLike it? Don't say nice.\u201d<br>You (who always say nice): \u201cI look like a different person, and I'm going to wear a hat so nobody sees it until Sunday.\u201d"},{"type":"pick","who":"You","text":"\u201cBoth times Ruby said 'no fuss' she looked at the door, and the second time she asked what time it was.\u201d","cue":"stacking the last chair, voice low","options":["Noticing","Choosing fresh","Being real"],"answer":0,"why":"You take in where she looked and what she asked with your own senses, and you don't add a label like 'she secretly wants one'. That is noticing.","traps":{"1":"Choosing fresh. It sounds like a new line, but nothing is swapped for a habit here. The line only reports what you saw.","2":"Being real. It is honest, but the line says nothing about how you feel. It stays with what you watched, which is noticing."},"example":"Bakery, Sunday, 8:30am.<br>Baker: \u201cWhy's the queue so short today?\u201d<br>You: \u201cThe shutters are half down, and there's no smell of bread yet.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Three short scenes. In each one, pick the move that is yours, not the one you were taught.","items":[{"type":"scene","title":"Saturday, 2:50pm, the back table","setting":"Joseph has baked the cake himself. The top cracked in the oven, and he has hidden the crack under icing sugar.","meters":{"you":60,"them":50},"beats":[{"who":"Joseph","text":"\u201cI baked it at six this morning. Don't look at the middle.\u201d","cue":"lifting the tin lid an inch, like a man disarming something","lines":[{"text":"\u201cIt looks great, Joseph. You shouldn't have gone to the trouble.\u201d","tag":"ok","you":0,"them":2,"outcome":"He shuffles. \u201cIt was no trouble,\u201d he says, and puts the lid back on.","why":"This is the polite script. It is kind, and it skips the cake, which is the thing he actually made."},{"text":"\u201cIt smells of burnt sugar and lemon. The crack runs left to right like a river on a map. Did you do the river on purpose?\u201d","tag":"best","you":3,"them":4,"outcome":"Joseph's face opens. \u201cI did now,\u201d he says, and takes the lid off properly.","why":"You notice what is actually here, the smell and the crack. Noticing gives him something real back."},{"text":"\u201cYou always do this, Joseph. Now I owe you a good review, and you'll bring it up at five-a-side.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Joseph puts the lid down on the tin and says nothing about it.","why":"This turns a gift into a debt. The cake becomes a ledger entry, and he will carry the price into Thursday."}]},{"who":"Joseph","text":"\u201cHow are you finding this, then? Be straight with me.\u201d","cue":"wiping his hands down an apron that says Nadia's","lines":[{"text":"\u201cI'm a bit nervous. The balloon keeps sliding off the chair, and I like that we're doing this at all.\u201d","tag":"best","you":3,"them":4,"outcome":"Joseph laughs and ties the balloon to the chair leg. \u201cNervous is allowed. I've dropped the knife twice.\u201d","why":"You say how you are, with a small true detail from the room. It is a fresh line, not the 'fine' you would have said at the start of the year."},{"text":"\u201cFine, Joseph. All good.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"He nods and goes back to fussing with the napkins.","why":"It is the scripted small talk. That closes the door on the one thing he asked for."}]},{"who":"Joseph","text":"\u201cIs the icing too yellow? Tell me it's lemon, or I'll think I've dyed it custard.\u201d","cue":"holding the tin up to the window","lines":[{"text":"\u201cMore like buttercups. The left edge is paler, as if it's shy. A bit like you, Joseph.\u201d","tag":"best","you":3,"them":4,"outcome":"He swats you with a napkin. \u201cCheeky. Pass me the candle before I lose my nerve.\u201d","why":"You notice the colour exactly, and you say one true thing about him. It has warmth in it because it is specific."},{"text":"\u201cIt's lovely, Joseph.\u201d","tag":"ok","you":0,"them":1,"outcome":"He nods, pleased enough. Then he asks about the candle again.","why":"A polite yes that ends the moment. There is nothing wrong with it, and nothing new in it either."}]}],"payoff":"Saturday, 3:02pm. Joseph sets the knife down and lets the cake sit. When Ruby walks in, nobody has spoken for two minutes.","example":"Pottery shop, Wednesday, 5:00pm.<br>Friend: \u201cI made you a mug. Be nice.\u201d<br>You: \u201cThe handle is bigger than my hand, and the glaze is the blue of a swimming pool. Where did you get that blue?\u201d"},{"type":"scene","title":"Saturday, 3:10pm, the back table","setting":"Ruby stops in the doorway with her coat still on and her bag held in front of her like a shield.","meters":{"you":55,"them":45},"beats":[{"who":"Ruby","text":"\u201cWhat's all this? I said no fuss. I look a state.\u201d","cue":"one hand still on the door","lines":[{"text":"\u201cYou look lovely, Ruby. Happy birthday.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"\u201cThanks,\u201d she says, to the floor, and stays by the door.","why":"This is the trained reply. It answers the worry and closes the door, so the two of you carry on apart."},{"text":"\u201cYou said no fuss, and we fussed anyway. I'm not sorry. It's a very small fuss, and the coat can stay on.\u201d","tag":"best","you":4,"them":4,"outcome":"Ruby laughs, a short surprised one. She takes a step in and, coat and all, sits down.","why":"You answer from a fresh place, with a playful, unapologetic feeling. It breaks the old loop, and she gets to be teased instead of managed."},{"text":"\u201cDon't look at me. It was Joseph's idea. I told him you'd hate it.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Joseph's face falls, and Ruby is already half out of the door.","why":"This is a sting dressed up as a reply. It throws Joseph under the bus and confirms Ruby's fear, and nobody sits down."}]},{"who":"Ruby","text":"\u201cRight. Who's cutting this? I'll do it, I always do it. Someone has to.\u201d","cue":"already rolling up her sleeves","lines":[{"text":"\u201cIf you like, Ruby. Thanks.\u201d","tag":"ok","you":-1,"them":0,"outcome":"She takes the knife and cuts eight even slices. Her face closes up again.","why":"It lets her carry the job again. It is safe, and the old pattern stays in place."},{"text":"\u201cNot today. Sit down. You get one job: say whether the middle is cooked.\u201d","tag":"best","you":3,"them":4,"outcome":"Ruby sits, a little stunned. \u201cRaw,\u201d she says, with a grin, before she has even tasted it.","why":"You pick a bossy, affectionate voice where the taught one would be polite. Choosing fresh is a line that didn't come from the reflex."}]},{"who":"Ruby","text":"\u201cEveryone's gone quiet. Someone say something. Please.\u201d","cue":"staring at the candle","lines":[{"text":"\u201cI can't do speeches, so I'm going to sing, badly, and you can't stop me.\u201d","tag":"best","you":3,"them":5,"outcome":"Joseph joins in, in a different key. Nadia bangs the counter in time. Ruby laughs behind her hand, and then without it.","why":"You pick the silly, free voice that you were never taught to use in public. It costs nothing and lifts the whole table."},{"text":"\u201cSpeech, Joseph! Speech!\u201d","tag":"ok","you":0,"them":-1,"outcome":"Joseph goes pink and says he's no good at those. Ruby studies the candle.","why":"It hands the moment to someone else. It is safe and kindly meant, and it leaves the silence where it was."}]}],"payoff":"Saturday, 3:12pm. Ruby says \u201cI'll just go, then.\u201d The bell on the door clangs shut behind her. The cake is cut at four by Nadia, for three people.","example":"Staff room, Friday, 1:00pm.<br>Colleague: \u201cThey bought me a cake. I said no fuss!\u201d<br>You: \u201cYou also said no fuss in March, and you cried in the lift. Sit down, it's tiny.\u201d"},{"type":"scene","title":"Saturday, 5:20pm, the Corner Table","setting":"Everyone has gone. The kettle has gone cold and the radiator ticks. Joseph is tipping chairs onto the tables, and you are holding the last two.","meters":{"you":50,"them":50},"beats":[{"who":"Joseph","text":"\u201cThursday, five-a-side, same as ever? You in?\u201d","cue":"tipping a chair onto its table","lines":[{"text":"\u201cSure, I'll be there.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Joseph says \u201cGreat\u201d and writes it on the back of his hand. On Thursday you sit on the bench with your knee wrapped under your trousers.","why":"This is the script: the yes that closes the question. It sounds easy-going, and it leaves him counting on a player who can't run."},{"text":"\u201cI want to be, and I can't run on this knee. It's been a month, and I kept quiet so nobody would think I was soft.\u201d","tag":"best","you":4,"them":5,"outcome":"Joseph sets his chair down. \u201cA month? I thought you were off the boil,\u201d he says, and means it kindly.","why":"This is being real: plain candour with no game in it. You don't have to look fit for the game, and he can hear where you actually are."},{"text":"\u201cYou always do this, Joseph. You ask when you know I'll say yes.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Joseph says \u201cRight\u201d and takes the chairs out the back himself.","why":"This turns his question into a charge against him. The real thing, the knee, disappears under an old story about him."}]},{"who":"Joseph","text":"\u201cThen what do you want from Thursdays? Tell me, and I'll sort it.\u201d","cue":"chair still in his hands","lines":[{"text":"\u201cI'd like to go in goal for a few weeks, and still come for the pint after.\u201d","tag":"best","you":3,"them":4,"outcome":"Joseph grins. \u201cGoal's yours. The pint's on me, if you stop me being Gary's keeper.\u201d","why":"You say what you want, plainly, without asking him to fix your knee. That is a real request for company, not a rescue."},{"text":"\u201cAnything works, I'm easy.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"He shrugs and says Gary will be pleased to have someone who doesn't mind.","why":"This is the scripted close. It takes the need off the table and tells him the real thing isn't wanted."}]},{"who":"Joseph","text":"\u201cTell me one thing from today. I was too busy with the knife to see any of it.\u201d","cue":"leaning on the radiator","lines":[{"text":"\u201cRuby's laugh on the third try with the candle. It came out as a snort, and she didn't hide it. I'm keeping that one.\u201d","tag":"best","you":4,"them":6,"outcome":"Joseph laughs, properly. \u201cA snort. I missed it. I'll get you to tell it again on Thursday.\u201d","why":"You offer a small, true detail from the day, which is a real gift to him. It doesn't need to be a confession to count as intimacy."},{"text":"\u201cIt was nice. Good cake.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"He says \u201cCheers\u201d in the voice that means he'd hoped for more.","why":"This is the scripted close. It leaves him with the sense of a door shut, which is the thing he was braced for."}]}],"payoff":"Saturday, 5:35pm. Joseph takes the chairs out the back himself. On Thursday the five-a-side bench is full, and there is no spare place on it for you.","example":"Allotment gate, Sunday, 10:00am.<br>Neighbour: \u201cJoining the rota next week?\u201d<br>You: \u201cI want to, and my back is not up to digging. Can I do the compost instead?\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Name the part that was missing from that reply. Then sort three more moments.","items":[{"type":"pick","who":"Ruby","text":"\u201cMum goes in on Tuesday. They say it's routine, but nobody has said how long.\u201d You nodded and said \u201cMm\u201d while working out whether the last slice would be left. When Ruby stopped, you said \u201cSorry, what?\u201d","cue":"stirring her tea, not looking up","options":["Awareness. Your body stayed at the table while your mind went to the cake.","Intimacy. You kept something back from Ruby, so a hint stood where candour should have been.","Spontaneity. 'Mm' was the taught reply, and you didn't use your freedom to choose another feeling."],"answer":0,"why":"Your body was at the table and your mind was on the last slice. Awareness is seeing and hearing for yourself in the here and now, and it had gone before Ruby finished her sentence.","traps":{"1":"Intimacy. You didn't hold anything back or drop a hint, because you weren't there to do either. The gap came earlier, at the listening.","2":"Spontaneity. 'Mm' is a taught reply, but no choice was even in play. You weren't taking in what Ruby said, so there was nothing to answer."},"example":"Waiting room, Tuesday, 11:00am.<br>Friend: \u201cThey said six weeks.\u201d<br>You, scrolling your phone: \u201cMm.\u201d<br>Friend: \u201cNever mind.\u201d"},{"type":"sort","prompt":"Three more moments, each with one capacity missing. Put each in the bin for the one that was missing.","bins":["Awareness","Spontaneity","Intimacy"],"items":[{"text":"\u201cI spent the whole birthday tea checking my phone for tram times, and Ruby's cake had gone before I tasted it.\u201d","answer":0,"why":"Body at the table, mind on the timetable. Awareness is being here in the present, and the tea passed unseen."},{"text":"\u201cJoseph praised my goalkeeping and I said \u2018Fluke\u2019, same as always, though I was thrilled and wanted him to say more.\u201d","answer":1,"why":"One rehearsed word covered a wide range of feelings. Spontaneity is having that range to choose from, and here only the taught reply was offered."},{"text":"\u201cI told Ruby I couldn't make Thursday because of \u2018a thing\u2019, then sighed loudly so she would ask what the thing was.\u201d","answer":2,"why":"The sigh is a hook. Intimacy is candour with no game in it, and fishing for a question is the opposite of saying it plainly."}],"example":"Bus stop, Saturday, 5:30pm.<br>Neighbour: \u201cHeading anywhere nice?\u201d<br>You, mind on tomorrow: \u201cMm.\u201d<br>The bus pulls away from both of you."}]}]},{"setting":"Relationships","blurb":"Clara hides two cinema tickets behind a spreadsheet of reasons it's casual, and you are her friend.","opener":{"setting":"Thursday, 5:40pm. The Corner Table, the window seat. A laptop and two cinema tickets sit between the cups.","lines":[{"who":"Clara","text":"\u201cTwo tickets, Saturday, the old film at the Regent. I've made a spreadsheet of why it's casual. Don't look at it.\u201d","cue":"angling the laptop away with one hand"},{"who":"Clara","text":"\u201cHe's coming at ten past. Say nothing about the tickets. Say nothing about anything.\u201d","cue":"turning the tickets face down, then face up again"}],"ask":"In each of the next three moments, which move is yours, and which one is the script?"},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Being your own person has three parts. Noticing is seeing and hearing for yourself, here and now, in your own way and without the labels you were handed. Choosing fresh is picking the feeling and the reply you want from all your voices, including the ones you were never taught to use. Being real is plain candour with no game in it.","items":[{"type":"pick","who":"You","text":"\u201cYour thumbnail's picked raw, you've turned those tickets over three times, and the laptop has been on one cell for ten minutes.\u201d","cue":"eyes on her hands, voice low","options":["Noticing","Choosing fresh","Being real"],"answer":0,"why":"You take in the thumbnail, the tickets and the stuck cell with your own senses, in your own words. No label like 'nervous' is stuck on her. That is noticing.","traps":{"1":"Choosing fresh. It sounds like a new line, but nothing is swapped for a habit here. The line only describes what you can see.","2":"Being real. It is kind, but the line says nothing about how you feel. It stays with what is in front of you, which is noticing."},"example":"Kitchen, Sunday, 11:00am.<br>Dad: \u201cThe kettle's broken.\u201d<br>You: \u201cThe light doesn't come on, and the plug is warm.\u201d"},{"type":"pick","who":"You","text":"\u201cWhen you list the reasons it's casual, I get nervous for you. I want you to ask him, and I don't want you hurt.\u201d","cue":"keeping your voice level, hands round your cup","options":["Noticing","Choosing fresh","Being real"],"answer":2,"why":"You say the plain thing at its real size, with the feeling attached and no joke, hint or hook. Telling Clara straight is being real.","traps":{"0":"Noticing. You do see the list, and it is in the line. But noticing alone stays on the facts, and this line goes on to say how you feel.","1":"Choosing fresh. It is a new answer to 'go for it, you'll be fine', but what makes it new is the candour, so the better name is being real."},"example":"Sister's WhatsApp, Sunday night.<br>Sister: \u201cShould I take the job?\u201d<br>You: \u201cI'll miss you terribly if you go, and I think you should. Both are true.\u201d"},{"type":"pick","who":"You","text":"\u201c'Lovely' is what I always say. Today it's this: you look like someone about to jump off the high board, and I'm the one cheering at the edge.\u201d","cue":"grinning, straightening her collar","options":["Noticing","Choosing fresh","Being real"],"answer":1,"why":"You see the usual 'lovely' coming and pick a playful, cheering feeling to show instead. Choosing which feeling to show, not only the taught one, is choosing fresh.","traps":{"0":"Noticing. You do catch the habit, but the work of the line is picking a new feeling to show. Noticing alone would stop at 'I always say lovely'.","2":"Being real. It is candid, but the heart of the line is the swap from the taught reply to a playful one. The candour comes second."},"example":"Market stall, Saturday, 10:00am.<br>Friend: \u201cDo I look all right? Don't say fine.\u201d<br>You (who always say fine): \u201cYou look like a person who's about to win the raffle.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Three short scenes. In each one, pick the move that is yours, not the one you were taught.","items":[{"type":"scene","title":"Thursday, 6:10pm, the Corner Table","setting":"Clara has slid a folded card across the table with your name on it. Inside is a list: four lifts, two nights on her sofa and one borrowed charger.","meters":{"you":60,"them":50},"beats":[{"who":"Clara","text":"\u201cI wrote it all down so we're square. Don't argue.\u201d","cue":"smoothing the card flat with both palms","lines":[{"text":"\u201cClara, you didn't need to do this. We're not counting.\u201d","tag":"ok","you":0,"them":2,"outcome":"\u201cI know,\u201d she says, in the voice that means she'll keep counting anyway, and tucks the pen back into her bag.","why":"This is the polite script. It is kind, and it skips the card, which is the thing she actually made."},{"text":"\u201cThe writing gets smaller towards the bottom, and there's a coffee ring on \u2018sofa nights\u2019. You spent a good while on this.\u201d","tag":"best","you":3,"them":4,"outcome":"Clara goes pink. \u201cForty minutes,\u201d she says. \u201cThe ring is last night's cocoa.\u201d","why":"You notice what is actually on the page, the shrinking handwriting and the ring. Noticing gives her something real back."},{"text":"\u201cTypical. Now I owe you for the card as well, and you'll count that too.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Clara folds the card in half and puts it away without a word.","why":"This turns a gift into a debt. The card becomes a ledger entry, and she will add the price to the list."}]},{"who":"Clara","text":"\u201cSay something about it, anything. Or I'll bin it.\u201d","cue":"reaching to take it back","lines":[{"text":"\u201cI'm keeping it. You drew a tiny car next to \u2018lifts\u2019, and I'm going to look at that car whenever I'm cross.\u201d","tag":"best","you":3,"them":4,"outcome":"Clara stops with her hand halfway. \u201cIt's a Fiat,\u201d she says, and her ears go red.","why":"You say how you are, with a small true detail from the card. It is a fresh line, not the 'it's very thorough' you would have said at the start of the year."},{"text":"\u201cIt's very thorough, Clara.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She nods and tucks the card under her saucer.","why":"This is the scripted small talk. It closes the door on the one thing she asked for."}]},{"who":"Clara","text":"\u201cIs that Omar? He said ten past. It's twelve past. Tell me what you see.\u201d","cue":"not turning round, hands flat on the table","lines":[{"text":"\u201cGrey coat, wet shoulders, a paper bag held in both hands as if something might spill. He's looking for you.\u201d","tag":"best","you":3,"them":4,"outcome":"Clara breathes out and turns round. \u201cHe bought the bun,\u201d she says, \u201cthe one I pretended I didn't want.\u201d","why":"You notice the coat, the damp and the bag exactly, and you hand the picture over without an opinion. It has warmth in it because it is specific."},{"text":"\u201cYes, that's him. Smile.\u201d","tag":"ok","you":0,"them":-1,"outcome":"She smiles too early, a wide stretched one, and Omar asks if she has cramp.","why":"A friendly instruction that ends the moment. There is nothing wrong with it, and nothing new in it either."}]}],"payoff":"Thursday, 6:20pm. Clara puts the card away and orders a pot of tea for one. Omar arrives to a table where nobody is looking at anybody.","example":"Birthday dinner, Saturday, 8:00pm.<br>Friend: \u201cI've listed what I owe you from last year.\u201d<br>You: \u201cYou've drawn a hat over the pizza night. What's the hat?\u201d"},{"type":"scene","title":"Friday, 12:40pm, the Halden canteen","setting":"Omar has carried his tray to your table without being asked. His soup is going cold while he works up to something.","meters":{"you":55,"them":45},"beats":[{"who":"Omar","text":"\u201cYou're her friend. Did she say anything about Saturday? Don't say it's not your place.\u201d","cue":"tapping the spoon on the rim of the bowl","lines":[{"text":"\u201cIt's not my place, Omar. You should ask her.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"He nods slowly. \u201cRight,\u201d he says, and eats his soup without tasting it.","why":"This is the trained reply. It answers the question and closes the door, so the two of you carry on apart."},{"text":"\u201cI'm not saying. I'll say this: ask her something with a day and a time in it, and watch what her face does.\u201d","tag":"best","you":4,"them":4,"outcome":"Omar sits up. \u201cA day and a time,\u201d he says, as if you had given him a map.","why":"You answer from a fresh place, with a cheeky and warm feeling. It breaks the old loop, and you protect her confidence without hiding behind 'not my place'."},{"text":"\u201cShe's mad about you, obviously. Don't tell her I said. Go and fix it before she does something silly.\u201d","tag":"game","you":-5,"them":-5,"outcome":"The scene stops there. Omar thanks you, a bit stiffly, and goes back to his desk looking at Clara's chair.","why":"This is a sting dressed up as help. It gives away her secret, makes you the messenger, and sets Omar up to say something he has not been invited to say."}]},{"who":"Omar","text":"\u201cHow do I ask without making it a Thing? I'm no good at pretending it's nothing.\u201d","cue":"pushing the soup away","lines":[{"text":"\u201cJust be yourself, Omar. It'll be fine.\u201d","tag":"ok","you":-1,"them":0,"outcome":"He nods and picks the spoon up again without being any wiser.","why":"A kind line that sends him off with nothing new. It is safe, and the worry stays where it was."},{"text":"\u201cTry it on me. I'll be Clara and I'll be rubbish on purpose: I'll say \u2018Oh, I'm so busy\u2019 and look at the ceiling.\u201d","tag":"best","you":3,"them":4,"outcome":"Omar laughs so hard a man at the next table turns round. \u201cRight. Go. Ceiling.\u201d","why":"You pick the silly, free voice that you were never taught to use at work. It makes practice safe, and it costs nothing."}]},{"who":"Omar","text":"\u201cSaturday, the Regent, the old film. Come with me. How was that?\u201d","cue":"going red at the ears","lines":[{"text":"\u201cI'm grinning, and I'm ridiculously proud of you. Say \u2018come with me\u2019 once more, slower.\u201d","tag":"best","you":3,"them":4,"outcome":"Omar says it again, slower, and his voice drops half a note. \u201cBetter,\u201d you tell him. \u201cThat one I'd say yes to.\u201d","why":"You show a warm feeling out loud, from the whole range you have, and you make a specific request. That is a fresh line, and it helps him more than a grade would."},{"text":"\u201cThat was fine.\u201d","tag":"ok","you":0,"them":-1,"outcome":"He nods, deflated, and asks whether 'fine' is good or bad.","why":"A safe verdict that ends the moment. There is nothing wrong with it, and nothing new in it either."}]}],"payoff":"Friday, 12:50pm. Omar spends the afternoon watching Clara's desk. By five, she has heard from three people that he knows.","example":"Garden fence, Sunday, 3:00pm.<br>Neighbour: \u201cDoes your sister like my brother? Don't say it's not your place.\u201d<br>You: \u201cShe won't tell me either. Bring him round for tea and watch.\u201d"},{"type":"scene","title":"Friday, 9:30pm, on the phone","setting":"Clara rings from the night bus, the engine growling behind her. Omar said yes at six, and she has been alone with it for three hours.","meters":{"you":50,"them":50},"beats":[{"who":"Clara","text":"\u201cHe said yes. Tell me the truth: have I been awful this week? Everyone's been polite.\u201d","cue":"low and quick, the bus lurching round a corner","lines":[{"text":"\u201cNot at all! You've been lovely.\u201d","tag":"ok","you":-1,"them":-3,"outcome":"Clara says \u201cGood, good,\u201d and then fills ten minutes with tomorrow's schedule, which means she heard the gap in your voice.","why":"This is the script: the reassurance that closes the call on the worry. It sounds loving, and it leaves her with an answer she can't check."},{"text":"\u201cA bit awful, yes. You've been so busy being useful that I couldn't tell what you wanted. I've missed you, and I'm glad you asked.\u201d","tag":"best","you":4,"them":5,"outcome":"There is a long pause. Then Clara says she would rather hear it than be handled, and asks for the example.","why":"This is being real: plain candour with no game in it. You don't have to sound only kind, and she can hear where you actually are."},{"text":"\u201cYou always do this, Clara. You fish for the nice thing so you can wave it off.\u201d","tag":"game","you":-5,"them":-6,"outcome":"The scene stops there. Clara says \u201cRight,\u201d and the line goes dead before you can answer.","why":"This turns her question into a charge against her. The real answer disappears under the old story about how she deflects."}]},{"who":"Clara","text":"\u201cThen what do you want from me this weekend? Tell me, and I'll do it.\u201d","cue":"the bus announcement cutting across her","lines":[{"text":"\u201cTell me about the film itself, not the schedule. And let me be pleased for you without a favour owed.\u201d","tag":"best","you":3,"them":4,"outcome":"Clara goes quiet, then laughs. \u201cThere'll be no schedule,\u201d she says. \u201cI'll tell you what the ending was.\u201d","why":"You say what you want, plainly, without asking her to fix your week. That is a real request for company, not a rescue."},{"text":"\u201cNothing, just enjoy it.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"She says she'll write down a few highlights for you, in a list.","why":"This is the scripted close. It takes the need off the table and tells her the real thing isn't wanted."}]},{"who":"Clara","text":"\u201cTell me something from your week. I always do the talking.\u201d","cue":"the engine noise dropping as the bus stops","lines":[{"text":"\u201cI ate lunch on the bench in the rain on Tuesday and didn't want to go back in. It was the best ten minutes I had.\u201d","tag":"best","you":4,"them":6,"outcome":"Clara laughs, properly, for the first time in the call. \u201cA bench in the rain,\u201d she says. \u201cNext time, I'll bring the flask.\u201d","why":"You offer a small, true detail from your week, which is a real gift to her. It doesn't need to be a confession to count as intimacy."},{"text":"\u201cNothing much. Work's work.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She says \u201cOkay,\u201d in the voice that means it isn't, and the bus doors hiss shut.","why":"This is the scripted close. It leaves her with the sense of a door shut, which is exactly what she was afraid of."}]}],"payoff":"Friday, 9:35pm. The line goes dead mid-stop. On Saturday morning a text arrives from Clara: \u201cSpreadsheet says I'm busy. Sorry.\u201d Omar's ticket stays in his coat pocket.","example":"Phone call, Sunday, 8:00pm.<br>Cousin: \u201cBe honest, was I rude at the wedding?\u201d<br>You: \u201cA bit, yes. You talked over Auntie Joan twice. I still want you at mine.\u201d"}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Name the part that was missing from that reply. Then sort three more moments.","items":[{"type":"pick","who":"Clara","text":"\u201cIt's only a film, Omar. Come if you like. No big deal.\u201d You know she turned down two other plans for Saturday, and the ticket stubs are poking out of her bag where he can see them.","cue":"tickets half out of her bag","options":["Spontaneity. 'No big deal' is the sentence she was taught, and no other feeling got a turn there.","Awareness. She was so wrapped up in her plan that she missed how Omar looked.","Intimacy. She hinted instead of asking, so a game stood where candour should be."],"answer":2,"why":"She wanted him there, gave up two other plans for it, and then left the stubs where he would see them while saying it was no big deal. Intimacy is candour with no game in it, and a hint is the opposite of asking plainly.","traps":{"0":"Spontaneity. 'No big deal' is a taught line, and that is part of it. But the missing piece is plain asking, and the stubs in the bag show the hook in action.","1":"Awareness. Nothing in the scene says she missed what was in front of her. She watched him closely, which is partly why she hid the wish."},"example":"Supermarket queue, Wednesday, 5:50pm.<br>Colleague: \u201cFree on Saturday? No pressure.\u201d<br>You: \u201cOh, probably nothing on.\u201d You cancelled your own plans this morning, and you are carrying the invitation in your coat pocket."},{"type":"sort","prompt":"Three more moments, each with one capacity missing. Put each in the bin for the one that was missing.","bins":["Awareness","Spontaneity","Intimacy"],"items":[{"text":"\u201cOmar was telling me his news on the phone and I was reading the football score the whole time. I asked him to say it again.\u201d","answer":0,"why":"Ears on the call, eyes on the score. Awareness is hearing and seeing for yourself in the here and now, and his news went by unheard."},{"text":"\u201cWhen Omar said \u2018You look nice\u2019, I said \u2018This old thing?\u2019, same as always, though I wanted to say thank you and mean it.\u201d","answer":1,"why":"One rehearsed line covered a range of feelings. Spontaneity is having that range to choose from, and here only the taught reply got a turn."},{"text":"\u201cI told Clara I didn't mind who paid, then sulked until she noticed and offered.\u201d","answer":2,"why":"The sulk is a hook. Intimacy is candour with no game in it, and waiting to be offered is the opposite of asking plainly."}],"example":"Caf\u00e9 till, Friday, 1:15pm.<br>Waiter: \u201cHaving a nice day?\u201d<br>You, mind on your inbox: \u201cMm.\u201d<br>He gives you the wrong change, and you don't count it."}]}]}]};</script>
