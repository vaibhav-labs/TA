<script>window.TA_GAME = {"slot":"4.6","setting":"Friends & Community","title":"The Yes-But Loop","world":4,"worldName":"Conversation Traps","week":4,"weekName":"Conversation Traps","mechanic":"Many-handed","concept":"After this one you can stop a yes, but loop at a Sunday table by handing the problem back to the one who owns it, without leaving the room.","plainWord":"yes, but","bookTerm":"Why Don't You, Yes But","bookIdea":"Why Don't You, Yes But is a party game in which one person presents a problem and the others offer solutions, each turned down with a yes, but. Its aim is to reject suggestions, not to get one, and the payoff is the silence when the helpers run out.","bookSource":"Games People Play, ch. 8","opener":{"setting":"Sunday, 7:20pm, The Corner Table, the long table by the window. Five people and one problem. Nadia is at the counter with her back turned.","lines":[{"who":"Clara","text":"\u201cDaniel moved the release to Friday, again. I've done the test plan twice, and I can't say no to him.\u201d","cue":"both hands round a cup of tea, not drinking it"},{"who":"Nadia","text":"\u201cThen say it to the table, and listen to what comes back.\u201d","cue":"at the counter, wiping a cup, not turning round yet"}],"ask":"Stay at the table without giving advice, and find the one line that hands the problem back to the person who owns it."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four moves run this table: a suggestion, a yes, but, the helper's sigh and a hand-back. Tap the move in each line.","items":[{"type":"pick","who":"Omar","text":"\u201cWhy don't you just tell him no, Clara? Say it once and see what happens.\u201d","cue":"already reaching for the biscuits","options":["a suggestion","a yes, but","a hand-back"],"answer":0,"why":"It starts with why don't you and offers a fix. Nothing is asked of Clara except to take the fix. That is a suggestion, and it is the first step of the loop.","traps":{"1":"This would be a yes, but if Clara had just turned down a fix and Omar were answering her. Here Omar has heard no reason yet, he is only offering one.","2":"This would be a hand-back if it gave the problem to Clara with a question about what she will do. Omar has taken the problem off her and put his own fix on it."},"example":"A driver at a bus stop, Monday. \u201cWhy don't you just take the auto, sir? Quicker.\u201d The man with the umbrella says nothing and keeps his place in the queue."},{"type":"pick","who":"Clara","text":"\u201cYes, but he'll say I'm not a team player. And Omar, you don't even work for him.\u201d","cue":"shaking her head, a little too quickly","options":["a suggestion","a yes, but","a hand-back"],"answer":1,"why":"She grants that the idea has a point, then gives the reason it won't work. That is the yes, but, and it keeps the loop running by inviting the next suggestion.","traps":{"0":"This would be a suggestion if she were offering a plan for the release. Here she is only explaining why a plan will fail.","2":"This would be a hand-back if she were saying the decision was hers to make. She is handing back a reason, not the decision."},"example":"A mother at the school gate: \u201cWhy don't you buy the uniform online? Yes, but the sizes are wrong, and the shop never answers.\u201d"},{"type":"pick","who":"Maya","text":"\u201cI'm only trying to help you! Why won't you just listen to one idea?\u201d","cue":"hands up, leaning back in the chair","options":["the helper's sigh","a suggestion","a hand-back"],"answer":0,"why":"The helper is frustrated that the fix was refused. The book calls this side I'm Only Trying to Help You, and the helper's bewilderment at not being thanked is what it pays out. Now the one with the problem has to manage the helper's feelings, and the problem stops being hers.","traps":{"1":"This would be a suggestion if it proposed a new action. It doesn't. It only complains that the last one was refused.","2":"This would be a hand-back if it asked Clara what she will do. Maya is asking Clara to take her advice, which is the opposite."},"example":"A friend at a wedding: \u201cI'm only trying to help you, why won't you let me fix the seating?\u201d The seating stays as it is, and both of you are cross."},{"type":"pick","who":"Nadia","text":"\u201cThat's a difficult problem. What are you going to do about it?\u201d","cue":"from the counter, still not turning round","options":["a suggestion","the helper's sigh","a hand-back"],"answer":2,"why":"It names the problem as real, then gives it back to the person who owns it. There is no fix in it, no reason and no sigh. Only a question about what happens next, and it goes to Clara.","traps":{"0":"This would be a suggestion if it said what Clara should do next. It asks her what she will do, which is a different job.","1":"This would be the helper's sigh if it complained that nobody listens. It doesn't blame anyone, and it hands the problem back."},"example":"A teacher at parents' evening: \u201cThat's a difficult spelling problem. What are you going to do about it at home?\u201d The parent says, \u201cRead with him, I suppose.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Yes-But Night. Five people and one problem, and you are one of the helpers. Keep both meters above half at the end. Each suggestion you make feeds the loop, so watch every line.","items":[{"type":"scene","title":"Sunday, 7:24pm, the long table","setting":"The Corner Table, the long table by the window. Clara has her cup in both hands, and the others have their chairs pulled in. <i>The Heckler, in your head: \u201cGive her one good idea, and everyone will see you know what you're doing.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Clara","text":"\u201cYes, but he'll say I'm not a team player. And Omar, you don't even work for him.\u201d","cue":"shaking her head, a little too quickly","lines":[{"text":"\u201cClara, that's a difficult problem. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Clara looks at the table for a long second. \u201cTell him Friday's too soon, I suppose. In writing.\u201d It is her answer, and nobody else is holding it.","why":"You stop feeding the loop and hand the problem back to the person who owns it. Her answer is slower than a fix and better, because it is hers."},{"text":"\u201cThen tell him that, and say you'll hit the Friday test plan.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cYes, but Friday's the test plan,\u201d Clara says, and Maya leans in with the next idea.","why":"It sounds kind, and it is still a suggestion. The loop takes it as a new fix, and Clara's next yes, but is already loaded."},{"text":"\u201cI'm only trying to help you, Clara. Why do you keep saying no?\u201d","tag":"game","you":-3,"them":-6,"outcome":"Clara looks at you as though you had changed sides. \u201cYou're only trying to help yourself,\u201d she says, and the table goes silent.","why":"The helper's sigh turns the problem into your hurt feelings. Clara now has to look after you, and the release has dropped off the table."}]},{"who":"Maya","text":"\u201cWhy don't you do the test on Saturday? Then he can't say you were late.\u201d","cue":"already wiping the table in front of you","lines":[{"text":"\u201cThat's a difficult problem, Clara. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Maya stops wiping. Clara says, \u201cI don't know yet,\u201d and it is the first real pause at the table.","why":"The same line, handed back again. A second suggestion arrived, and you did not pick it up. The owner has to choose, and she is slower now, which is what you want."},{"text":"\u201cSaturday might work, if you're not wiped out by then.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cI'm wiped out every Saturday,\u201d Maya says, and Clara says, \u201cYes, but I'd have to ask Omar.\u201d","why":"A kind-looking yes that keeps the loop turning. You joined the suggestions, so the next yes, but now has two owners."},{"text":"\u201cMaya, you always take the weekend and then complain. I'm only trying to help.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Maya puts the cloth down. \u201cRight, so it's my fault now,\u201d she says, and the table splits in two.","why":"The helper's sigh, aimed at a third person. The problem now has two owners, and both of them are cross with you."}]},{"who":"Clara","text":"\u201cYes, but Omar's review is on Saturday, and Daniel would notice. And Maya, you work weekends. I don't.\u201d","cue":"one finger tapping the rim of the cup","lines":[{"text":"\u201cThat's a difficult problem, Clara. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Clara breathes out. \u201cI'll tell him Friday is too soon, on Monday, in writing.\u201d The sentence is hers.","why":"The third hand-back, short and flat. Each yes, but has been answered with the same question, and the question is what finally breaks the loop."},{"text":"\u201cThen give the test to Omar on Saturday, and you do the release.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Omar says, \u201cWhy would I do her test?\u201d and the table starts arguing about Saturday.","why":"A new fix, handed to someone who never agreed to take it. The loop gets a fresh set of yes, buts."},{"text":"\u201cYes, but you're the one who keeps saying yes to Daniel, Clara.\u201d","tag":"game","you":-3,"them":-6,"outcome":"Clara's face closes. \u201cThanks,\u201d she says, and reaches for the tea she still hasn't drunk.","why":"A verdict on her habits, dressed up as a remark. It makes the table choose sides, and the problem disappears behind the choosing."}]},{"who":"Sam","text":"\u201cWhy don't you quit? There are a thousand jobs in the city, and I'd have quit by now.\u201d","cue":"grinning, pushing the biscuit plate towards you","lines":[{"text":"\u201cThat's a difficult problem, Clara. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Sam laughs, then stops. \u201cFair. It's your release,\u201d he says, and the table waits.","why":"The line gives the problem back again while the joke is still in the air. The table has nothing to answer with except Clara's own plan."},{"text":"\u201cHaha, not everyone is you, Sam. Maybe look at the job boards this week?\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cMaybe,\u201d Clara says, which is the most polite yes, but on the table.","why":"A joke, then a suggestion. The joke made the suggestion easy to take, and the loop found a softer way to keep going."},{"text":"\u201cSam, you sell things for a living. You'd sell anyone anything. I'm only trying to help.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Sam's grin drops, and the table turns to you. \u201cThat's not fair,\u201d he says, and Omar says nothing.","why":"The helper's sigh, now aimed at the adviser beside you. You have made the table about you, and the problem has slid under the biscuits."}]},{"who":"Clara","text":"\u201cYes, but if I quit, Daniel wins, and I'm not giving him that either.\u201d","cue":"quieter now, looking at the window","lines":[{"text":"\u201cThat's a difficult problem, Clara. What are you going to do about it?\u201d","tag":"best","you":4,"them":5,"outcome":"She turns the cup once, slowly. \u201cI'm going to say Friday is too soon, in writing, before the review.\u201d","why":"The hand-back worked because it stayed short. Her answer is the first one all evening that nobody pushed into her hands."},{"text":"\u201cOkay, then Monday for the test, and Friday for the release.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cMonday,\u201d Clara repeats, and Sam says, \u201cSee? That's the answer,\u201d and the loop starts up again.","why":"You offered a schedule, which is still a fix. Clara can now argue about the schedule, and the yes, but has a new target."},{"text":"\u201cYou're making excuses, Clara. I'm trying to help you.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Clara puts her cup down, hard. \u201cThen I'll sort it out on my own,\u201d she says, and gets up.","why":"A trap move: you named the excuse and then made the helping the issue. The one with the problem leaves the table, and the loop wins the night."}]}],"payoff":"Clara picks up her bag and says she will sort it out alone. The table goes quiet, and the problem goes home with her, still unanswered.","fallout":{"them":"Clara stands and walks out into the street with her bag. Nobody offers her a lift, and the group's next suggestion is about the biscuits."}},{"type":"scene","title":"Sunday, 8:10pm, the cold tea","setting":"The same table, the tea gone cold in the cups. Nadia turns from the counter with a cloth in her hand, for the first time all evening. <i>The Heckler, in your head: \u201cSay something clever now, and they will all remember it.\u201d<\/i>","meters":{"you":50,"them":50},"beats":[{"who":"Nadia","text":"\u201cWhat just happened?\u201d","cue":"putting the cloth down, one hand on the counter","lines":[{"text":"\u201cEveryone gave Clara a suggestion, and she said yes, but to each one. I stopped giving advice and handed the problem back to her.\u201d","tag":"best","you":4,"them":3,"outcome":"Nadia nods. \u201cGood. Keep going, and see where it leads her.\u201d","why":"A plain account of the loop: the advice, the yes, but, and the hand-back that stopped the feeding. Naming the move is what lets you make the right one again on purpose."},{"text":"\u201cClara didn't want any of our ideas. That's her problem.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Nadia says, \u201cIs it? Look at who offered the most ideas.\u201d","why":"Partly true, and it puts the blame on Clara. The loop had four helpers, and you were one of them. The diagnosis has to include your own part."},{"text":"\u201cClara is the difficult one here, and I'm the only one who tried.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Nadia says, \u201cThat's the trap, and you've just shown us. Thanks,\u201d and goes back to the counter.","why":"The helper's sigh, said out loud to the group. The diagnosis you were asked for turns into another round of the same loop, and the table learns nothing."}]},{"who":"Clara","text":"\u201cI don't know. Maybe I'll tell him Friday is too soon, on Monday, in writing. Then I'll see what he says.\u201d","cue":"one hand flat on the table, the cup pushed aside","lines":[{"text":"\u201cThen say that to him in your words, Clara, and tell us on Monday what he said.\u201d","tag":"best","you":3,"them":4,"outcome":"She nods. \u201cMonday. In writing. I'll tell you what he says.\u201d","why":"The problem and the answer both stay with her, and the check-in is a date, not a rescue. The loop has nothing left to feed on."},{"text":"\u201cGood, and Omar can read your email before you send it.\u201d","tag":"ok","you":-2,"them":0,"outcome":"Omar says, \u201cHappy to,\u201d and Clara says, \u201cYes, but send it tonight,\u201d and the table laughs.","why":"You handed her a helper for the email. The rescue is small, but it puts advice back on the table, and a yes, but comes straight after it."},{"text":"\u201cDon't blame me if Daniel is furious, Clara.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Clara looks at her cup and says nothing, and the table lets the silence sit.","why":"A trap move: you put the consequence on her before she has acted. The loop ends with blame, and nobody has the answer."}]},{"who":"Omar","text":"\u201cWell, that was four people's advice, and not one of us got to finish a sentence.\u201d","cue":"pulling his coat on, a bad back in every movement","lines":[{"text":"\u201cThen the end of the sentence is Clara's to write, Omar. What did she say she'll do?\u201d","tag":"best","you":3,"them":3,"outcome":"Omar pauses at the door. \u201cMonday, in writing. Right,\u201d he says, and sits back down.","why":"You send the question back to the owner one more time. Omar has to hear her answer rather than finish his own."},{"text":"\u201cThen let's all send her a list of what to do.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cGood, a list,\u201d Sam says, and reaches for his phone.","why":"A list is another round of suggestions. It sounds like teamwork, and it starts the loop again."},{"text":"\u201cYou're leaving because nobody let you finish, Omar. Like always.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Omar says nothing, goes out, and the door shuts behind him.","why":"A trap move: you named his habit and used it as the verdict. He leaves, the table loses an adviser, and the problem stays exactly where it started."}]}],"payoff":"The table breaks up before the tea is warm. Clara takes the problem home, and the advice goes home with everyone else."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions about the table. Pick the explanation that fits what happened.","items":[{"type":"pick","who":"Nadia","text":"Why does the yes, but keep the table going round?","cue":"the cold tea, the biscuits, nobody leaving","options":["Because Clara secretly enjoys being given advice, and wants more of it.","Each suggestion gets a reason it can't work, so the helpers keep offering new ones and nobody has to act.","Because the helpers are being paid to keep talking."],"answer":1,"why":"The yes, but does two jobs. It turns each fix down, and it invites the next one. The aim is to reject the suggestions, not to get one, so the loop runs until the helpers run dry. The silence that follows is the payoff, because it shows the helpers to be inadequate. Meanwhile the problem stays at the table.","traps":{"0":"Clara does not want the advice. The point of the loop is to turn suggestions down, so more advice is not what she is after. The loop needs the suggestions to keep coming and each one to be turned down.","2":"Nobody is paid for advice. It keeps going because every suggestion invites the next one."},"example":"A family dinner: \u201cWhy don't you ask the landlord for a fresh coat of paint?\u201d \u201cYes, but he never answers.\u201d \u201cWhy don't you write to him, then?\u201d \u201cYes, but he never reads the post.\u201d"},{"type":"pick","who":"Nadia","text":"Why does \u201cThat's a difficult problem. What are you going to do about it?\u201d break the loop?","cue":"the same line, handed back each time","options":["It shames the helpers into stopping, so they sit down.","It hands the problem back to the person who owns it, so the next move is theirs and not the table's.","It shows the problem is too big to solve, so everyone gives up."],"answer":1,"why":"The line names the problem as real, then asks the owner to act. It declines the helper's part. Once the owner has to answer, the helpers have no fix left to offer, and the one with the problem is left at a loss or answers from a different voice, so the frustration shows and can be talked about.","traps":{"0":"The helpers may feel shamed, but a shamed table can keep suggesting for the rest of the night. Shame does not stop the loop, and it makes the room cold.","2":"It says the problem is hard, which is true, and it does not say the problem is too big. The loop stops because the owner is asked to act, not because anyone gives up."},"example":"A school meeting about the bus timetable: \u201cThat's a difficult problem. What are you going to do about it with the other parents?\u201d The parent who keeps proposing new times has to choose one."}]}],"debrief":{"nadia":"Five people and one problem, and nobody short of advice. The only thing that moved the table was the one who gave the problem back. Next Sunday somebody will ask what you think, so decide now what you will say.","bookTerm":"Why Don't You, Yes But","bookNote":"The books describe Why Don't You, Yes But as a party game. One person presents a problem and the others offer solutions, each turned down with a yes, but. The aim is to reject the suggestions, and the payoff is the silence when the helpers run out. The book's way out is not to play the helper, for example by saying it is a difficult problem and asking what the person is going to do about it."},"reflection":{"prompt":"Where did you say yes, but this week, and what would handing the problem back to the person who owns it have sounded like?"},"next":"5.1","baseStory":{"setting":"Friends & Community","blurb":"Five people at a long table advise Clara about a moved release, and she turns every idea down."},"moreStories":[{"setting":"Home & Flatmates","blurb":"Sam's cousin has been on the sofa for nineteen days, and Sam cannot tell him to go.","opener":{"setting":"Thursday, 9:10pm. Hawthorn Court, the shared flat, the kitchen. Wes's trainers are by the door, and his charger snakes across the counter.","lines":[{"who":"Sam","text":"\u201cWes said Friday when he came. I even wrote it on the calendar.\u201d","cue":"holding a mug he has already emptied"},{"who":"Maya","text":"\u201cThat was nineteen days ago. I have a column for it.\u201d","cue":"pen on the fridge sheet, not writing yet"}],"ask":"Stay in the kitchen without giving advice, and find the one line that hands the problem back to Sam."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four moves run this scene: a suggestion, a yes, but, the helper's sigh and a hand-back. Tap the move in each line.","items":[{"type":"pick","who":"Maya","text":"\u201cWhy don't you put his bag in the hall tonight? He'll get the message.\u201d","cue":"tapping the fridge sheet with the pen","options":["a yes, but","a suggestion","a hand-back"],"answer":1,"why":"It opens with why don't you and a ready-made fix. Sam is asked to do nothing except carry it out. That is a suggestion, and it is the first step of the loop.","traps":{"0":"This would be a yes, but if Maya were turning down a fix someone else had offered. Nobody has offered one yet.","2":"This would be a hand-back if it asked Sam what he will do. Maya has already decided for him: the bag, the hall, tonight."},"example":"A cinema queue, Saturday.<br>\u201cWhy don't you ask them to move seats? They're in yours.\u201d<br>The woman holding the tickets keeps holding them and looks at the screen."},{"type":"pick","who":"Sam","text":"\u201cYes, but his mum would ring my mum, and then it's a whole thing.\u201d","cue":"turning the mug round by its handle","options":["a suggestion","the helper's sigh","a yes, but"],"answer":2,"why":"He grants that the idea has a point, then gives the reason it will fail. That is the yes, but, and the reason leaves a gap for the next helper to fill.","traps":{"0":"This would be a suggestion if Sam were proposing a plan of his own. He is only explaining why Maya's plan fails.","1":"This would be the helper's sigh if he complained that nobody listens. Sam is not complaining, he is politely closing the door on the idea."},"example":"A call to a landlord.<br>\u201cWhy don't you ask the neighbours to turn it down?\u201d<br>\u201cYes, but they sit on the residents' committee.\u201d"},{"type":"pick","who":"Maya","text":"\u201cI'm only trying to help! I made Wes a sheet and everything, and you won't even look at it.\u201d","cue":"pen down, voice climbing","options":["a hand-back","a suggestion","the helper's sigh"],"answer":2,"why":"Maya is hurt that her fix was refused. The book calls this side I'm Only Trying to Help You. Now Sam has to look after Maya's feelings, and the sofa is no longer the problem.","traps":{"0":"This would be a hand-back if it asked Sam what he will do. Maya is asking him to admire her sheet and take it.","1":"This would be a suggestion if it proposed something new. It only complains that the last fix was turned down."},"example":"Two friends packing a van.<br>\u201cI'm only trying to help! I labelled every box and you keep opening them.\u201d<br>The labelling is now the argument."},{"type":"pick","who":"Grace","text":"\u201cThat sounds like a hard one, Sam. What are you going to do about it?\u201d","cue":"holding a parcel that is not hers, one foot still in the hall","options":["the helper's sigh","a hand-back","a suggestion"],"answer":1,"why":"She calls the problem real, then gives it back to the person who owns it. There is no fix in it, no reason and no sigh. The only thing it asks for is what Sam does next.","traps":{"0":"This would be a sigh if Grace were upset that nobody had listened to her. She has not been refused anything yet.","2":"This would be a suggestion if she said what Sam should do. She asks him instead, which is a different job."},"example":"A mechanic at the counter.<br>\u201cThat's a worrying noise. What do you want to do about it?\u201d<br>The driver says, \u201cBook it in, I suppose.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Yes-But Night. You are one of the helpers. Keep both meters above half at the end. Each suggestion you make feeds the loop, so watch every line.","items":[{"type":"scene","title":"Thursday, 9:20pm, the kitchen","setting":"The shared flat, the kitchen. Sam holds the mug in both hands, Maya has the sheet, and a pan is going cold on the hob. <i>The Heckler, in your head: \u201cFind the line that gets Wes out by Sunday, and everyone will be grateful.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Sam","text":"\u201cYes, but his mum would ring my mum, and then it's a whole thing.\u201d","cue":"turning the mug round by its handle","lines":[{"text":"\u201cNineteen days is a long time, Sam. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Sam looks at the calendar on the wall, the one with Friday circled in pen. \u201cTell him this weekend,\u201d he says. \u201cI think. Yes.\u201d","why":"You stop feeding the loop and give the problem back to the person who owns it. His answer is slower than a fix and better, because it is his."},{"text":"\u201cThen ring your mum first and warn her, so it isn't a surprise.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cYes, but she'll tell mine anyway,\u201d Sam says, and Maya's pen lifts off the sheet.","why":"It sounds practical and it is still a fix. The loop takes it as one more idea, and Sam's next yes, but is already loaded."},{"text":"\u201cI'm only trying to help you, Sam. Why do you always make it so hard?\u201d","tag":"game","you":-3,"them":-6,"outcome":"Sam says, \u201cSorry, sorry,\u201d three times and starts wiping a counter that is already clean. He is looking after you now.","why":"The helper's sigh turns his problem into your hurt feelings. Sam has to manage you, and Wes has dropped off the table."}]},{"who":"Maya","text":"\u201cWhy don't you tell him the sofa is needed? Say Gran is coming to stay.\u201d","cue":"uncapping the pen, then capping it again","lines":[{"text":"\u201cIt's a hard one, Sam. What are you going to say to him?\u201d","tag":"best","you":4,"them":4,"outcome":"Maya's pen stops. \u201cI don't know yet,\u201d Sam says, and it is the first real pause in the kitchen.","why":"A second fix arrived and you did not pick it up. The owner has to choose, and he is slower now, which is what you want."},{"text":"\u201cA story about Gran might work, if Wes believes it.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cHe'd ask Gran, she lives downstairs,\u201d Sam says. \u201cYes, but she likes him.\u201d Maya sighs through her nose.","why":"You joined the pile of fixes. It looks like support, and now the yes, but has two ideas to turn down instead of one."},{"text":"\u201cMaya, you'd have had him out by day three, and you still charge us for the bins. I'm only trying to help.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Maya puts the pen down. \u201cRight, so the sheet is my fault now,\u201d she says, and Sam gets up to look for bin bags he does not need.","why":"The sigh, aimed at a third person. The problem now has two owners, and both of them are cross with you."}]},{"who":"Sam","text":"\u201cYes, but if I say it, he'll think I've been angry the whole time. I haven't. I just want my sofa back.\u201d","cue":"voice dropping, eyes on the folded duvet through the doorway","lines":[{"text":"\u201cThat's your first sentence, Sam. What are you going to do with it?\u201d","tag":"best","you":4,"them":4,"outcome":"Sam breathes out. \u201cTell him Sunday that I need the sofa from the weekend after. Out loud, not a note.\u201d","why":"The third hand-back, built from his own words. Every yes, but has been answered by a question, and the question is what finally breaks the loop."},{"text":"\u201cThen text him a date with a smiley, so it doesn't sound angry.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cYes, but he'll think the smiley means I'm joking,\u201d Sam says, and the pan ticks as it cools.","why":"A new fix with a new way to fail. The smiley gave Sam something fresh to turn down."},{"text":"\u201cYou're avoiding it because you like being the nice one, Sam.\u201d","tag":"game","you":-3,"them":-6,"outcome":"Sam's face drops. \u201cSorry,\u201d he says, and means it in the worst way.","why":"A verdict on his habits, dressed up as an observation. It makes the room choose sides, and Wes disappears behind the choosing."}]},{"who":"Grace","text":"\u201cWhy don't you move out for a weekend yourself? Nobody argues with an empty flat.\u201d","cue":"putting the parcel on the table, still in her coat","lines":[{"text":"\u201cIt's your flat and your cousin, Sam. What are you going to do?\u201d","tag":"best","you":4,"them":4,"outcome":"Grace laughs, then stops. \u201cFair. It's his sofa,\u201d she says, and the kitchen waits.","why":"The line gives the problem back while the joke is still in the air. The room has nothing left to answer with except Sam's own plan."},{"text":"\u201cHa, Grace. Sam could stay at a friend's for a night and see if Wes notices.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cMaybe,\u201d Sam says, which is the politest yes, but in the building.","why":"A joke, then a suggestion. The joke made the fix easy to swallow, and the loop found a softer way to keep going."},{"text":"\u201cGrace, you've never shared a flat in your life. I'm only trying to help.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Grace's smile goes. \u201cI lived with three people for six years,\u201d she says, and Maya looks at the floor.","why":"The sigh, now aimed at the neighbour. You have made the room about you, and the problem has slid under the parcel."}]},{"who":"Sam","text":"\u201cYes, but if he goes, he goes home, and his mum says I threw him out. I can't be that person.\u201d","cue":"quieter now, thumb on the rim of the mug","lines":[{"text":"\u201cThat's the hard part, Sam. What are you going to do about it?\u201d","tag":"best","you":4,"them":5,"outcome":"He sets the mug down. \u201cI'm going to tell him on Sunday, to his face. He can say what he likes to his mum.\u201d","why":"The hand-back worked because it stayed short. His answer is the first one all evening that nobody pushed into his hands."},{"text":"\u201cTell him it's only for now and you'll miss him. Then it won't sound like throwing him out.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cGood idea,\u201d Maya says, and Sam says, \u201cYes, but I won't miss him,\u201d and everyone laughs while the loop starts up again.","why":"You offered wording, which is still a fix. Sam can argue with the wording, and the yes, but has a new target."},{"text":"\u201cYou're making excuses, Sam. I'm trying to help you.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Sam puts the mug in the sink. \u201cI'll sort it out on my own,\u201d he says, and goes to his room.","why":"You named the excuse and then made the helping the issue. The one with the problem leaves the room, and the loop wins the night."}]}],"payoff":"Sam takes his mug to his room and shuts the door. The calendar still has Friday circled, and Wes's key turns in the lock at ten.","fallout":{"them":"Sam goes to his room and closes the door. Maya wipes the table twice, and nobody mentions the sofa again."}},{"type":"scene","title":"Thursday, 10:05pm, the cold pan","setting":"The same kitchen. The pan has gone cold, and Wes's key has not turned yet. Maya turns the sheet face down. <i>The Heckler, in your head: \u201cSum it up cleverly, and they will all remember who got it.\u201d<\/i>","meters":{"you":50,"them":50},"beats":[{"who":"Maya","text":"\u201cWhat just happened? Four of us, and Wes still has a bed.\u201d","cue":"turning the sheet face down on the table","lines":[{"text":"\u201cEveryone gave Sam a fix, and he turned each one down. I stopped giving them and handed the problem back to him.\u201d","tag":"best","you":4,"them":3,"outcome":"Maya nods slowly. \u201cRight. That worked, and I hated it.\u201d","why":"A plain account of the loop: the advice, the yes, but, and the hand-back that stopped the feeding. Naming the move lets you make it again on purpose."},{"text":"\u201cSam didn't want help. He wanted to complain.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Maya says, \u201cDid he? Count how many fixes were mine.\u201d","why":"Partly true, and it puts the blame on Sam. The loop had three helpers, and you were one of them."},{"text":"\u201cSam is the difficult one here, and I'm the only one who tried.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Maya says, \u201cThat's the trap, and you've just shown it to us,\u201d and picks up the cold pan.","why":"The helper's sigh, said out loud. The question you were asked turns into another round of the same loop."}]},{"who":"Sam","text":"\u201cI don't know. Maybe Sunday, when he's got his shoes off. I'll say I need the sofa from the weekend after.\u201d","cue":"hand flat on the table, mug pushed aside","lines":[{"text":"\u201cThen say it in your own words on Sunday, and tell us on Monday how it went.\u201d","tag":"best","you":3,"them":4,"outcome":"He nods. \u201cSunday. Out loud. I'll tell you Monday.\u201d","why":"The problem and the answer both stay with him, and the check-in is a date, not a rescue. The loop has nothing left to feed on."},{"text":"\u201cGood, and Maya can write you a script so you don't lose your nerve.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cHappy to,\u201d Maya says, and Sam says, \u201cYes, but make it short,\u201d and they both laugh.","why":"You handed him a helper for the speech. The rescue is small, but it puts a fix back on the table."},{"text":"\u201cDon't blame me if Wes sulks for a month, Sam.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Sam studies the mug. \u201cSorry,\u201d he says, to nobody.","why":"You put the consequence on him before he has acted. The loop ends in blame, and nobody owns the answer."}]},{"who":"Maya","text":"\u201cI made the sheet anyway. Dates, bin days, a column for Wes. It's no use if Sam never reads it.\u201d","cue":"squaring the sheet against the table edge","lines":[{"text":"\u201cKeep it for the bins, Maya. The date for Wes is Sam's to set. Sam, what is it?\u201d","tag":"best","you":3,"them":3,"outcome":"\u201cSunday, after tea,\u201d Sam says, and Maya writes it in the Wes column, small.","why":"You send the question back to the owner one more time. Maya hears his answer instead of finishing her own sheet."},{"text":"\u201cThen stick the sheet on Wes's bag where he'll see it.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cBrilliant,\u201d Sam says, and reaches for the tape, and nobody asks him whether he will say anything.","why":"A sheet on a bag is another fix. It saves Sam the sentence, which is the thing he needs to say."},{"text":"\u201cYou made this complicated, Maya. Like always.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Maya folds the sheet in four and goes to her room.","why":"You named her habit and used it as the verdict. She leaves, the flat loses an adviser, and the problem stays where it started."}]}],"payoff":"The pan stays cold on the hob. Wes's key turns in the lock, and the problem goes back under the duvet with him."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions about the loop. Pick the explanation that fits what happened.","items":[{"type":"pick","who":"Maya","text":"Why does Sam's yes, but keep everyone in the kitchen?","cue":"the cold pan, the sheet, nobody leaving","options":["Each fix gets a reason it will fail, so more fixes arrive and Sam never has to speak to Wes.","Sam secretly wants Wes to stay for good, and he is too embarrassed to say it out loud.","Maya's sheet is so thorough that nobody in the flat can think of anything to add to it."],"answer":0,"why":"The yes, but does two jobs. It turns each fix down, and it invites the next one. The aim is to reject the suggestions, so the loop runs until the helpers run dry. Meanwhile the sentence Sam has to say stays unsaid.","traps":{"1":"The story says the opposite: Sam wants his sofa back. The loop needs the fixes to keep coming and each one to fail, whatever he secretly feels.","2":"The sheet is one more fix in the pile. It does not stop anything, and Sam's yes, but is waiting for it like the others."},"example":"A family WhatsApp group.<br>\u201cWhy don't you ask Dad to drive?\u201d \u201cYes, but he hates night roads.\u201d<br>\u201cThen book a taxi?\u201d \u201cYes, but the fare is silly.\u201d"},{"type":"pick","who":"Maya","text":"Why does \u201cIt's a hard one. What are you going to do about it?\u201d break the loop?","cue":"the same question, handed back each time","options":["It makes the helpers feel so guilty that they go quiet and the kitchen empties.","It says Wes is too big a problem for anyone, so everyone gives up and goes to bed.","It gives the problem back to Sam, so the next move is his and the fixes have nowhere to land."],"answer":2,"why":"The line names the problem as real, then asks the owner to act. It turns down the helper's job. Once Sam has to answer, there are no fixes left to refuse, and what he actually thinks can come out.","traps":{"0":"Guilty helpers can go on suggesting for the rest of the night, or sulk. Guilt does not stop the loop, and it makes the room colder.","1":"The line says the problem is hard, and it does not say it is hopeless. The loop stops because Sam is asked to act, not because anyone gives up."},"example":"A flat meeting about the rota.<br>\u201cThat's a tricky one. What are you going to do about the Tuesday bins?\u201d<br>The one who keeps proposing new rotas has to pick one."}]}]},{"setting":"Family","blurb":"Gran's hearing-test letter has sat on the fridge since August, and everyone has a fix.","opener":{"setting":"Sunday, 1:15pm. Hawthorn Court, Gran's kitchen downstairs. Mum is on speaker, propped against the teapot, and the dal is going cold.","lines":[{"who":"Gran","text":"\u201cThe clinic wrote in August. It is on the fridge. It says telephone to book.\u201d","cue":"tapping the letter with one finger, not picking it up"},{"who":"Mum","text":"\u201cIt's October. Have you not rung them yet?\u201d","cue":"from the phone against the teapot, the television on mute behind her"}],"ask":"Stay at the table without giving advice, and find the one line that hands the problem back to Gran."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four moves run this scene: a suggestion, a yes, but, the helper's sigh and a hand-back. Tap the move in each line.","items":[{"type":"pick","who":"Mrs Kale","text":"\u201cWhy don't you let me ring them? I've got a free minute right now.\u201d","cue":"already holding out her hand for the letter","options":["a hand-back","a yes, but","a suggestion"],"answer":2,"why":"It opens with why don't you and offers a ready fix. Gran is asked to do nothing except hand over the letter. That is a suggestion, and it is the first step of the loop.","traps":{"0":"This would be a hand-back if it asked Gran what she will do. Mrs Kale has already taken the phone call out of her hands.","1":"This would be a yes, but if Mrs Kale were turning down someone else's fix. Nobody has offered one yet."},"example":"A neighbour at the post office.<br>\u201cWhy don't you let me carry that, dear?\u201d<br>The old man tightens his grip on the parcel and says nothing."},{"type":"pick","who":"Gran","text":"\u201cYes, but the machine talks too fast, and then it asks for a number and I have to find my glasses.\u201d","cue":"arms folded over her apron","options":["a yes, but","a suggestion","the helper's sigh"],"answer":0,"why":"She grants that ringing is the answer, then gives the reason she cannot. That is the yes, but, and the reason invites the next helper to solve the machine.","traps":{"1":"This would be a suggestion if Gran were proposing a plan. She is only explaining why Mrs Kale's plan will fail.","2":"This would be a sigh if she complained that nobody listens. She is politely shutting the door on the idea."},"example":"A bank queue.<br>\u201cWhy don't you use the app, Dad?\u201d \u201cYes, but I can't see the numbers.\u201d<br>\u201cMake the text bigger.\u201d \u201cYes, but then it won't fit.\u201d"},{"type":"pick","who":"Mum","text":"\u201cI'm only trying to help! I've set the reminder on your phone three times, and you keep switching it off.\u201d","cue":"from the speaker against the teapot, the television on mute behind her","options":["a suggestion","the helper's sigh","a hand-back"],"answer":1,"why":"Mum is hurt that her fix was refused. The book calls this side I'm Only Trying to Help You. Now Gran has to look after Mum's feelings, and the letter on the fridge goes unanswered.","traps":{"0":"This would be a suggestion if Mum proposed something new. She is complaining about the last fix being turned off.","2":"This would be a hand-back if she asked Gran what she will do. Mum is asking Gran to take her reminders."},"example":"Two sisters planning a party.<br>\u201cI'm only trying to help! I booked the hall and you didn't even say thank you.\u201d<br>The hall is now the argument."},{"type":"pick","who":"Leo","text":"\u201cGran, what are you going to do about your ears?\u201d","cue":"not looking up from the tablet","options":["a hand-back","a suggestion","the helper's sigh"],"answer":0,"why":"It gives the problem to the one who owns it. There is no fix in it, no reason and no sigh, only a question about what happens next. It sounds rude coming from an eight-year-old, and it is the cleanest hand-back at the table.","traps":{"1":"This would be a suggestion if Leo said what Gran should do. He asks her, and does not tell her.","2":"This would be the sigh if he complained that nobody listens. Leo is not cross, he is curious."},"example":"A child at a bus stop.<br>\u201cGrandad, what are you going to do about your hat? It's blowing away.\u201d<br>Grandad takes it off and puts it in his pocket."}]},{"level":"Play","label":"Play, the week in motion","intro":"Yes-But Night. You are one of the helpers. Keep both meters above half at the end. Each suggestion you make feeds the loop, so watch every line.","items":[{"type":"scene","title":"Sunday, 1:20pm, Gran's kitchen","setting":"Gran's kitchen, the radio low, Mum on speaker against the teapot, Mrs Kale on the other chair. Leo is under the table with the tablet. <i>The Heckler, in your head: \u201cFix it for her, and you will be the one who rang the clinic.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Gran","text":"\u201cYes, but the machine talks too fast, and then it asks for a number and I have to find my glasses.\u201d","cue":"arms folded over her apron","lines":[{"text":"\u201cIt's a hard one, Gran. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Gran looks at the letter for a long second. \u201cGo in person,\u201d she says. \u201cTuesday, when the bus is quiet.\u201d It is her answer, and nobody else is holding it.","why":"You stop feeding the loop and give the problem back to the person who owns it. Her answer is slower than a fix and better, because it is hers."},{"text":"\u201cThen I'll ring from here and put it on speaker, so you only have to say yes.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cYes, but you'll mumble,\u201d Gran says, and Mrs Kale leans in with a fourth idea.","why":"It is kind, and it takes the problem away from her. The loop accepts it as another fix, and Gran's next yes, but is ready."},{"text":"\u201cI'm only trying to help, Gran. Why won't you ever let anyone?\u201d","tag":"game","you":-3,"them":-6,"outcome":"Gran slides the letter back under the magnet. \u201cNobody asked you to,\u201d she says.","why":"The helper's sigh, aimed at an eighty-year-old. Gran now has to look after your feelings, and the clinic is forgotten."}]},{"who":"Mum","text":"\u201cWhy don't you write down what the machine says? Keep a pencil by the phone.\u201d","cue":"a little tinny from the speaker, the television still on mute","lines":[{"text":"\u201cThat's a hard one, Gran. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"The speaker goes silent. \u201cI don't know yet,\u201d Gran says, and it is the first real pause in the kitchen.","why":"Another fix arrived from 600 km away and you did not pick it up. The owner has to choose, and she is slower now, which is what you want."},{"text":"\u201cA pencil by the phone might work, if Gran can find one.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cI can find a pencil,\u201d Gran says. \u201cYes, but I can't read what I wrote.\u201d","why":"You joined Mum's fix with a polite tail. The yes, but now has a pencil to turn down."},{"text":"\u201cMum, you ring every Sunday and tell her what to do from 600 km away. I'm only trying to help.\u201d","tag":"game","you":-3,"them":-5,"outcome":"Mum's voice goes small. \u201cRight. I'll go, then,\u201d she says, and the line clicks.","why":"The sigh, aimed at a third person. The problem now has two owners, and both of them are cross with you."}]},{"who":"Gran","text":"\u201cYes, but if I go in person they'll put me in a little room and ask me things. I don't like the beeps.\u201d","cue":"straightening the letter with the flat of her hand","lines":[{"text":"\u201cThe beeps are the hard part, Gran. What are you going to do about them?\u201d","tag":"best","you":4,"them":4,"outcome":"Gran breathes out. \u201cI'll ask Grace to sit with me. She doesn't fill up a waiting room with talk.\u201d","why":"The third hand-back, built from her own words. Every yes, but has met the same kind of question, and the question is what breaks the loop."},{"text":"\u201cThen I'll come with you and hold your hand through the beeps.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cYou'll hold the wrong hand,\u201d Gran says, and Mrs Kale offers to come as well, and now there is a rota.","why":"A new fix, and you have volunteered. It looks like love, and it gives the loop a fresh set of reasons."},{"text":"\u201cYou always find a reason, Gran. Every single time.\u201d","tag":"game","you":-3,"them":-6,"outcome":"Gran's mouth goes small. \u201cDo I,\u201d she says, and turns to the sink.","why":"A verdict on her habits, dressed up as a remark. It makes the table choose sides, and the clinic disappears behind the choosing."}]},{"who":"Mrs Kale","text":"\u201cWhy don't you get one of those hearing apps? My nephew has one. It tells you who is talking.\u201d","cue":"waving her teacup, a biscuit still in the other hand","lines":[{"text":"\u201cIt's your hearing, Gran. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Mrs Kale puts the cup down. \u201cFair. It's her ears,\u201d she says, and the kitchen waits.","why":"The line gives the problem back while the app is still in the air. The table has nothing left to answer with except Gran's own plan."},{"text":"\u201cAn app is a good idea, Mrs Kale. Gran, I could set it up for you tonight.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cYes, but the screen is so small,\u201d Gran says, and Leo slides his tablet out from under the table.","why":"A kind offer and a fresh fix. The loop found a new gadget to turn down."},{"text":"\u201cMrs Kale, your nephew sells phones. Everything with you is an app. I'm only trying to help.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Mrs Kale's face closes. \u201cI was being kind,\u201d she says, and goes to find her coat.","why":"The sigh, now aimed at the neighbour. You have made the table about you, and the clinic has slid under the biscuits."}]},{"who":"Gran","text":"\u201cYes, but if they say I need the little things in my ears, your mother will ring every night about it.\u201d","cue":"quieter now, looking at the speaker","lines":[{"text":"\u201cThat's the real worry, Gran. What are you going to do about it?\u201d","tag":"best","you":4,"them":5,"outcome":"Gran turns her cup once. \u201cI'll ring them myself on Monday. And she is not to ring me about it.\u201d The speaker waits, and then Mum says, \u201cAll right.\u201d","why":"The hand-back worked because it stayed short. Her answer is the first one all afternoon that nobody pushed into her hands."},{"text":"\u201cMum won't, Gran. Mum, you won't, will you?\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cI might,\u201d says the speaker. \u201cYes, but you will,\u201d says Gran, and the loop starts up again.","why":"You turned yourself into a negotiator. It is another fix, and now it has two owners."},{"text":"\u201cYou're making excuses, Gran. We are all trying to help you.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Gran stands, takes her plate to the sink and does not turn round.","why":"You named the excuse and then made the helping the issue. The one with the problem leaves the table, and the loop wins the afternoon."}]}],"payoff":"Gran puts the letter back under the magnet and says she will sort it out alone. The dal goes cold, and the speaker clicks off.","fallout":{"them":"Gran turns the radio up, and nobody is allowed to say the word clinic again."}},{"type":"scene","title":"Sunday, 2:10pm, the cold dal","setting":"The same kitchen. The dal has skinned over and Mum has gone from the speaker. Mrs Kale is rinsing cups. <i>The Heckler, in your head: \u201cSay something wise, and they will tell Mum you were the sensible one.\u201d<\/i>","meters":{"you":50,"them":50},"beats":[{"who":"Mrs Kale","text":"\u201cWhat just happened? I only said about the app.\u201d","cue":"a cup in each hand, the tap still running","lines":[{"text":"\u201cEveryone gave Gran a fix, and she turned each one down. I stopped giving them and handed the problem back to her.\u201d","tag":"best","you":4,"them":3,"outcome":"Mrs Kale turns off the tap. \u201cHm. I did offer four, didn't I.\u201d","why":"A plain account of the loop: the advice, the yes, but and the hand-back that stopped the feeding. Naming it lets you do it again on purpose."},{"text":"\u201cGran doesn't want help. She wants to be fussed over.\u201d","tag":"ok","you":-2,"them":-2,"outcome":"Mrs Kale says, \u201cIs that so? Count how many of us fussed.\u201d","why":"Partly true, and it puts the blame on Gran. There were three helpers, and you were one of them."},{"text":"\u201cGran is the awkward one here, and I'm the only one who tried.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Mrs Kale says, \u201cThat's the trap, and you've just shown it to me,\u201d and turns the tap back on.","why":"The helper's sigh, said out loud. The question you were asked turns into another round of the same loop."}]},{"who":"Gran","text":"\u201cI will go on Tuesday, in person, and I will take Grace. We shall see about the beeps.\u201d","cue":"hand flat on the table, the letter in front of her","lines":[{"text":"\u201cThen do it your way, Gran, and tell me on Tuesday evening what they said.\u201d","tag":"best","you":3,"them":4,"outcome":"She nods. \u201cTuesday. I'll tell you over tea.\u201d","why":"The problem and the answer both stay with her, and the check-in is a day, not a rescue. The loop has nothing left to feed on."},{"text":"\u201cGood, and I'll write the clinic's address on the envelope in big letters.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cI know where the clinic is,\u201d Gran says, \u201cyes, but thank you,\u201d and she pushes the envelope away.","why":"You handed her a helper for the trip. It is small, and it puts a fix back on the table."},{"text":"\u201cDon't blame me if the bus is late, Gran.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Gran looks at the letter and says nothing, and the kitchen lets the silence sit.","why":"You put the consequence on her before she has acted. The loop ends in blame, and nobody owns the answer."}]},{"who":"Leo","text":"\u201cGran, are the beeps like in Clash? Can I come?\u201d","cue":"head out from under the table, tablet in hand","lines":[{"text":"\u201cAsk Gran, Leo. It's her appointment.\u201d","tag":"best","you":3,"them":3,"outcome":"Leo looks up. \u201cGran, can I come and see the beeps?\u201d \u201cMaybe next time,\u201d Gran says, and nearly smiles.","why":"A small hand-back, and an eight-year-old learns it too. The answer belongs to Gran, and she gives it."},{"text":"\u201cNot this time, Leo. Gran's going with Grace.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cThat's not fair,\u201d Leo says, and Gran says, \u201cWho decided?\u201d and looks at you.","why":"You answered for Gran, which is another fix. It was kind and it took her say away."},{"text":"\u201cLeo, stop interrupting. Gran has enough on her plate.\u201d","tag":"game","you":-3,"them":-5,"outcome":"The tablet goes back under the table and the sound of Clash goes with it. \u201cHe was only asking,\u201d Gran says.","why":"The sigh, aimed at a child. The kitchen splits, and Gran now has to look after both of you."}]}],"payoff":"Leo goes under the table with his tablet and Gran turns to the sink. The beeps are not mentioned again."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions about the loop. Pick the explanation that fits what happened.","items":[{"type":"pick","who":"Mrs Kale","text":"Why did Gran's yes, but keep coming, whatever anyone offered?","cue":"the letter under the magnet, the cold dal","options":["Gran enjoys an argument, and the kitchen only comes alive when someone is cross with her.","Each fix was met with a reason it would fail, which invited the next fix and left the clinic unrung.","Gran cannot hear the suggestions, so she answers a different question every time."],"answer":1,"why":"The yes, but does two jobs. It turns a fix down and it invites the next one. The aim is to reject the suggestions, so the loop runs until the helpers run out. The phone call to the clinic stays exactly where it was.","traps":{"0":"Gran is not looking for a row. The loop needs fixes to keep coming and each one to fail, and a fight is not what feeds it.","2":"Her answers match what was said. The reasons she gives are all about the machine and the beeps, so she heard every fix."},"example":"A phone call home.<br>\u201cWhy don't you ask the doctor for something stronger?\u201d \u201cYes, but he never has time.\u201d<br>\u201cThen ring the surgery.\u201d \u201cYes, but they put me on hold.\u201d"},{"type":"pick","who":"Mrs Kale","text":"Why did \u201cWhat are you going to do about it?\u201d work when the app and the lift to the clinic did not?","cue":"the same question, handed back to Gran","options":["It was gentler than the app, so Gran felt cared for and gave in.","It gave the problem back to Gran, who was the only one at the table who could act on it.","It showed Gran she was being silly, and she did not want to look silly in front of Leo."],"answer":1,"why":"The question names the problem as real, then asks the owner to move. It turns down the helper's job. Gran has to choose, and a choice she makes herself is one she keeps.","traps":{"0":"Gran did not give in. She named a plan of her own, and a plan of her own is different from agreeing with someone else's.","2":"Shaming would have sent her to the sink, as the harsher lines did. The question worked because it respected her, not because it made her feel small."},"example":"A parents' evening.<br>\u201cThat's a hard spelling problem. What are you going to do about it at home?\u201d<br>The parent who kept asking for a tutor says, \u201cRead with him, I suppose.\u201d"}]}]},{"setting":"Relationships","blurb":"Clara has a note from Omar she cannot answer, and her friends all have a fix.","opener":{"setting":"Wednesday, 1:05pm. A bench outside Halden, by the bike racks. Clara's cheese roll is still in its paper.","lines":[{"who":"Clara","text":"\u201cHe left a note on my monitor. 'Thursday, the cafe? Or not. Either is fine.' I've read it eleven times.\u201d","cue":"holding the note flat on her knee with two fingers"},{"who":"Sam","text":"\u201cSo say yes. It's one word.\u201d","cue":"mouth full, already reaching for her crisps"}],"ask":"Stay on the bench without giving advice, and find the one line that hands the problem back to Clara."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"Four moves run this scene: a suggestion, a yes, but, the helper's sigh and a hand-back. Tap the move in each line.","items":[{"type":"pick","who":"Sam","text":"\u201cWhy don't you write 'Yes' on the same note and stick it back on his screen?\u201d","cue":"wiping mayonnaise off his thumb with a napkin","options":["a suggestion","a yes, but","a hand-back"],"answer":0,"why":"It opens with why don't you and offers a ready fix. Clara is asked to do nothing except copy it. That is a suggestion, and it is the first step of the loop.","traps":{"1":"This would be a yes, but if Sam were turning down a fix Clara had offered. She has not offered one.","2":"This would be a hand-back if it asked Clara what she will do. Sam has already written her reply for her."},"example":"A bus queue, Friday.<br>\u201cWhy don't you text him back with a thumbs-up?\u201d<br>The woman with the phone puts it in her bag and looks up the road."},{"type":"pick","who":"Clara","text":"\u201cYes, but he only asked because I fixed his build on Tuesday. He's being polite.\u201d","cue":"pinning the note to her knee with two fingers","options":["a suggestion","the helper's sigh","a yes, but"],"answer":2,"why":"She grants that the note is real, then gives the reason it cannot count. That is the yes, but, and it leaves room for the next helper to argue with the reason.","traps":{"0":"This would be a suggestion if Clara were proposing a plan. She is only explaining why Sam's plan fails.","1":"This would be the sigh if she complained that nobody listens. She is closing the door politely, not slamming it."},"example":"A shop floor.<br>\u201cWhy don't you ask for a rise?\u201d \u201cYes, but they only gave me the last one because I covered for Theo.\u201d"},{"type":"pick","who":"Sam","text":"\u201cI'm only trying to help! I am giving you the actual words and you keep looking at them like they're a bill.\u201d","cue":"crisp packet crushed in one fist","options":["a hand-back","a suggestion","the helper's sigh"],"answer":2,"why":"Sam is hurt that his fix was refused. The book calls this side I'm Only Trying to Help You. Now Clara has to look after Sam's feelings, and Omar's note is no longer the subject.","traps":{"0":"This would be a hand-back if it asked Clara what she will do. Sam is asking her to take his words.","1":"This would be a suggestion if it proposed something new. It only complains that the last one was refused."},"example":"A neighbour on a stair.<br>\u201cI'm only trying to help! I carried it up for you and you won't even say thanks.\u201d<br>The box stays on the landing."},{"type":"pick","who":"Ella","text":"\u201cThat's a hard one, Clara. What are you going to do about it?\u201d","cue":"folding her sandwich paper into a neat square","options":["a hand-back","the helper's sigh","a suggestion"],"answer":0,"why":"She calls the problem real, then gives it back to the person who owns it. There is no fix in it, no reason and no sigh. The only thing it asks about is what Clara does next.","traps":{"1":"This would be the sigh if Ella were upset that her last idea had been refused. She has offered no idea yet.","2":"This would be a suggestion if she said what Clara should do. She asks, which is a different job."},"example":"A teacher at the gate.<br>\u201cThat's a difficult timetable. What are you going to do about Tuesdays?\u201d<br>The parent says, \u201cSwap with my sister, I suppose.\u201d"}]},{"level":"Play","label":"Play, the week in motion","intro":"Yes-But Night. You are one of the helpers. Keep both meters above half at the end. Each suggestion you make feeds the loop, so watch every line.","items":[{"type":"scene","title":"Wednesday, 1:10pm, the bench","setting":"Outside Halden, the bench by the bike racks, a wind that keeps lifting the note. <i>The Heckler, in your head: \u201cGive her the perfect line, and she will thank you on Thursday.\u201d<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Clara","text":"\u201cYes, but he only asked because I fixed his build on Tuesday. He's being polite.\u201d","cue":"pinning the note down with her thumb","lines":[{"text":"\u201cThat's a hard one, Clara. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Clara watches a cyclist chain up a bike. \u201cAnswer him,\u201d she says slowly. \u201cBefore four, so it doesn't sit.\u201d It is her answer, and nobody else is holding it.","why":"You stop feeding the loop and give the problem back to the person who owns it. Her answer is slower than a fix and better, because it is hers."},{"text":"\u201cThen thank him for the note and say you'll think about it.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cYes, but 'think about it' sounds like no,\u201d Clara says, and Sam gets another idea.","why":"It sounds careful and it is still a fix. The loop takes it as one more idea, and Clara's next yes, but is already loaded."},{"text":"\u201cI'm only trying to help, Clara. Why can't you just believe somebody likes you?\u201d","tag":"game","you":-3,"them":-6,"outcome":"Clara folds the note into eighths. \u201cBecause it isn't that simple,\u201d she says, and now you are one more thing she has to manage.","why":"The helper's sigh, with a verdict inside it. Clara has to look after your hurt feelings, and the note drops off the bench."}]},{"who":"Sam","text":"\u201cWhy don't you buy his cheese roll on Thursday? Then you're even.\u201d","cue":"bouncing the crisp packet on his knee","lines":[{"text":"\u201cIt's a hard one, Clara. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Sam stops chewing. \u201cI don't know yet,\u201d Clara says, and it is the first real pause on the bench.","why":"Another fix arrived and you did not pick it up. The owner has to choose, and she is slower now, which is what you want."},{"text":"\u201cA roll is a nice gesture, if you pay before he can.\u201d","tag":"ok","you":-2,"them":1,"outcome":"\u201cYes, but then it looks like I'm paying him off,\u201d Clara says, and Ella's eyebrows go up.","why":"You joined Sam's fix with a polite tail. The yes, but now has a roll to turn down."},{"text":"\u201cSam, you've never paid for anything without a voucher. I'm only trying to help.\u201d","tag":"game","you":-3,"them":-5,"outcome":"\u201cThat's low,\u201d Sam says, mouth full, and Clara tucks the note away.","why":"The sigh, aimed at a third person. The problem now has two owners, and both are cross with you."}]},{"who":"Clara","text":"\u201cYes, but if I say yes, then I'm someone who said yes, and he'll expect me to be good at it.\u201d","cue":"tearing a corner off the note, then smoothing it flat","lines":[{"text":"\u201cIt's yours to decide, Clara. What are you going to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Clara looks at the note. \u201cWrite 'Yes' on it and put it where he'll find it. Then I'll have to turn up.\u201d","why":"The third hand-back, short and flat. Every yes, but has met the same kind of question, and the question is what breaks the loop."},{"text":"\u201cYou don't have to be good at a cafe, Clara. Just say yes and be yourself.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cYes, but I don't know who that is on a Thursday,\u201d Clara says, and Sam snorts.","why":"It is warm advice and it is still advice. It gave her a fresh phrase to turn down."},{"text":"\u201cYou're the one who keeps finding reasons, Clara. Every time.\u201d","tag":"game","you":-3,"them":-6,"outcome":"Clara's face closes. \u201cThanks,\u201d she says, and reaches for the cheese roll she hasn't touched.","why":"A verdict on her habits, dressed up as a remark. The bench picks sides, and the note disappears behind the choosing."}]},{"who":"Ella","text":"\u201cMaybe write it down first? Then you can just read it out if your mouth freezes.\u201d","cue":"squaring the folded paper on her knee","lines":[{"text":"\u201cThat's a hard one, Clara. What do you want to do about it?\u201d","tag":"best","you":4,"them":4,"outcome":"Ella shrugs. \u201cFair. It's her note,\u201d she says, and the bench waits.","why":"Even the calm helper slipped a fix in. You hand it back with the same short question, and the owner gets her turn."},{"text":"\u201cElla's right. I could read it over before you hand it to him.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cYes, but you'd change the commas,\u201d Clara says, and Sam says, \u201cShe would,\u201d and the loop starts again.","why":"You volunteered to be the editor. A kind offer and another fix, and the yes, but has a new target."},{"text":"\u201cElla, you've never asked anyone out on purpose. I'm only trying to help.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Ella's smile goes thin. \u201cI asked my husband out in a lift,\u201d she says, and the bench goes cold.","why":"The sigh, now aimed at the quiet one. You have made the bench about you, and the note has slid under the paper."}]},{"who":"Clara","text":"\u201cYes, but if he says it was only a kindness, I'll have made a fool of myself in front of the whole team room.\u201d","cue":"quieter now, watching the cyclist unlock a bike","lines":[{"text":"\u201cThat's the real risk, Clara. What are you going to do about it?\u201d","tag":"best","you":4,"them":5,"outcome":"She turns the note over once. \u201cI'll write yes, sign it, and leave it before four.\u201d","why":"The hand-back worked because it stayed short. Her answer is the first one all lunchtime that nobody pushed into her hands."},{"text":"\u201cNobody will see, Clara. We'll stand guard by the printer.\u201d","tag":"ok","you":-2,"them":1,"outcome":"Sam says, \u201cI'll bring a lookout hat,\u201d and Clara says, \u201cYes, but you'd draw attention,\u201d and the bench laughs while the loop starts up.","why":"A joke with a plan inside. It feels like backup, and it gives the yes, but one more thing to answer."},{"text":"\u201cYou're hiding behind excuses, Clara. I'm trying to help you.\u201d","tag":"game","you":-4,"them":-6,"outcome":"Clara pockets the note. \u201cI'll sort it out on my own,\u201d she says, and walks back inside.","why":"You named the excuse and then made the helping the issue. The one with the problem leaves the bench, and the loop wins the lunch hour."}]}],"payoff":"Clara stands, pockets the note and goes back through the revolving door. The cheese roll stays on the bench in its paper, and the wind lifts the corner.","fallout":{"them":"Clara walks back into Halden without her roll. Her answer to Omar stays in her pocket, unwritten."}},{"type":"scene","title":"Wednesday, 1:40pm, the bench again","setting":"The same bench. Omar comes round the bike racks with two cheese rolls on a coffee tray, and the note is back in Clara's hand. <i>The Heckler, in your head: \u201cTell him she has thought of nothing else, and watch his face.\u201d<\/i>","meters":{"you":50,"them":50},"beats":[{"who":"Omar","text":"\u201cYou three look like a jury. Am I the defendant?\u201d","cue":"holding the tray up like a plea","lines":[{"text":"\u201cNot you. Clara's working something out, and it's hers to say.\u201d","tag":"best","you":3,"them":4,"outcome":"Omar nods and sits at the far end, passing Clara her roll first. \u201cRight. No rush,\u201d he says.","why":"You hand it back without naming her problem. The answer stays hers, and Omar gets a calm bench instead of a case."},{"text":"\u201cJust lunch gossip, Omar. Nothing to worry about.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cRight,\u201d Omar says, in the voice of someone who has seen the note.","why":"A small cover story. It takes the moment out of Clara's hands, and Omar notices the cover."},{"text":"\u201cClara got your note, Omar, and she's been in a state about it all lunch.\u201d","tag":"game","you":-4,"them":-7,"outcome":"Clara's face closes. \u201cThanks,\u201d she says, and Omar looks at the cyclist, anywhere else.","why":"Telling on her, with kindness as the excuse. The thing she was building to say is now said, and not by her."}]},{"who":"Sam","text":"\u201cJust tell him yes! She's been rehearsing since nine!\u201d","cue":"grinning, one hand over his own mouth too late","lines":[{"text":"\u201cThat's hers to say, Sam.\u201d","tag":"best","you":3,"them":3,"outcome":"Sam mimes zipping his mouth. The bench goes still, and Omar's coffee steams in the wind.","why":"A short hand-back to the helper who is still pushing. It protects the owner's turn."},{"text":"\u201cSam, give her a minute. She's nearly there.\u201d","tag":"ok","you":-2,"them":0,"outcome":"\u201cNearly where?\u201d Omar asks, and Clara's thumb goes white on the note.","why":"A kind hint that gives the secret away. It softens Sam and tells Omar there is something to ask."},{"text":"\u201cSam's right, Clara. You've been rehearsing since nine. Just say it.\u201d","tag":"game","you":-4,"them":-6,"outcome":"\u201cI wasn't rehearsing,\u201d Clara says, and she was. Omar looks away on purpose.","why":"The sigh with an audience. Pushing her to say it makes the saying a performance, and she does not want that."}]},{"who":"Clara","text":"\u201cThursday. If you're still... yes. Thursday is good.\u201d","cue":"holding the note out, her hand not quite steady","lines":[{"text":"\u201cThen that's settled, and it was yours to say. I'm going to find some tea.\u201d","tag":"best","you":3,"them":3,"outcome":"Omar takes the note, reads the yes on it and says, \u201cThursday, then.\u201d You are already walking.","why":"You step out of the way once she has said it. Nothing is left for the helpers to add."},{"text":"\u201cSay it once more for Omar, Clara, with the time this time.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"\u201cSix,\u201d Clara says. \u201cSix is fine,\u201d says Omar, and both of them look at you as if you were the chaperone.","why":"Coaching her again. It adds a detail she would have supplied herself."},{"text":"\u201cSee, Omar? She was just frightened. I told you she liked you.\u201d","tag":"game","you":-4,"them":-7,"outcome":"\u201cI didn't ask you to tell me,\u201d Omar says, gently, and Clara's thumb goes through the note.","why":"You reported her feelings for her. It takes the answer out of the owner's mouth at the last minute."}]}],"payoff":"The note tears down the middle. Omar says he will see her around, and carries his roll back to the team room."}]},{"level":"Analyse","label":"Analyse, explain it","intro":"Two questions about the loop. Pick the explanation that fits what happened.","items":[{"type":"pick","who":"Ella","text":"Why does each yes, but send the bench round again?","cue":"the note on the knee, the cheese roll in its paper","options":["Clara has already decided to say no, and the yes, buts are her way of telling the others politely.","Sam talks so fast that nobody on the bench has time to think about what Clara wants.","Each idea is turned down for a reason, so the next idea arrives and Clara's answer stays unwritten."],"answer":2,"why":"The yes, but does two jobs. It turns each fix down, and it invites the next one. The aim is to reject the suggestions, so the loop runs until the helpers run dry. The note in Clara's hand stays unanswered.","traps":{"0":"Clara wants to say yes, which is why she keeps the note. The loop needs the fixes to keep coming, and each one to be refused.","1":"Speed has nothing to do with it. The same loop would run at half the pace, because every fix gets a reason it fails."},"example":"A group chat about a holiday.<br>\u201cWhy don't you go in May?\u201d \u201cYes, but the flights are dear.\u201d<br>\u201cThen go in June.\u201d \u201cYes, but Mum's birthday.\u201d"},{"type":"pick","who":"Ella","text":"Why was \u201cWhat are you going to do about it?\u201d better than telling Clara that Omar obviously likes her?","cue":"the same question, handed back each time","options":["It comforted Clara more, and a comforted person always does what she is told.","It kept the decision with Clara. Reassurance would only have given her a new fact to turn down.","It proved that Omar's note was only polite, so she could stop worrying about it."],"answer":1,"why":"Telling her he likes her is one more fix, and her yes, but turns it down in a breath. The question names the problem as real and puts the next move in her hands, where only she can use it.","traps":{"0":"Comfort is not the trick. Several comforting lines fed the loop, and nobody on the bench did what they were told.","2":"The question says nothing about Omar's note. It proves nothing, and it does not need to, because Clara decides what the note means."},"example":"A friend choosing a flat.<br>\u201cIt is a good one, you should take it.\u201d \u201cYes, but the stairs.\u201d<br>\u201cWhich one do you want? What are you going to do?\u201d<br>\u201cTake the one with the stairs.\u201d"}]}]}]};</script>

<script>

  // Content fields may carry <b>, <i> and <br> only. Other tags are dropped, and open

  function rich(s) {

    var out = String(s).replace(/<[^<>]*>|</g, function (tok) {
      if (tok === "<") return "&lt;";

      if (!m) return "";

      if (name === "br") return closing ? "" : "<br>";
      if (name !== "b" && name !== "i") return "";

      open.push(name);
      return "<" + name + ">";
    });
    while (open.length) out += "</" + open.pop() + ">";
    return out;
  }

      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  function shuffled(n) {
    var idx = [], i, j, t, attempt;

      for (i = n - 1; i > 0; i--) {

  // Flat list of items across the three rounds; one progress segment each.

    opener: GAME.opener, rounds: GAME.rounds
  }].concat(GAME.moreStories || []) : [];
  var cur = 0;

    cur = i;
    ITEMS = [];
    ((STORIES[i] && STORIES[i].rounds) || []).forEach(function (round) {
      (round.items || []).forEach(function (item, j) {
        ITEMS.push({ round: round, item: item, first: j === 0 });
      });
