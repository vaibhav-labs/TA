<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Plan Board · You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #171233; --bg-2: #241c47;
    --surface: #f2eefb; --surface-2: #c9b8e6; --surface-3: #bda8e2;
    --accent: #6c5fe0; --accent-deep: #4a3fa0;
    --pink: #d9699f; --blue: #5b8fd9;
    --ok: #1f7568; --wrong: #a8407a; --alt: #5c4fb0;
    --text: #231c3f; --text-dim: #675f82;
    --on-bg: #ece7fb; --on-bg-dim: #b4abd9;
    --shadow: rgba(23, 18, 51, 0.28);
    --parent: #7b5fe0; --adult: #4f8fd9; --childv: #d9699f;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, var(--bg-2), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, #2c1f4a, transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, #2a1840, transparent);
    color: var(--on-bg);
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  .stage { width: 100%; max-width: 580px; min-width: 0; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .series { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); font-weight: 600; }
  .series small { color: var(--on-bg-dim); font-weight: 500; letter-spacing: 0.08em; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--on-bg-dim); text-decoration: none; white-space: nowrap; }
  .tag:hover { color: var(--pink); }
  @media (max-width: 480px) { .series small { display: none; } .masthead .right { gap: 10px; } }
  button.tag { background: none; border: 0; cursor: pointer; padding: 0; }
  .linkbtn { background: none; border: 0; padding: 10px 0 0; color: var(--on-bg-dim, #94a3b8); font: 600 12.5px "IBM Plex Mono", monospace; cursor: pointer; }
  .linkbtn:hover { color: var(--wc, #fffc00); }
  .story-card { display: block; text-align: left; width: 100%; }
  .story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .story-top b { font-size: 16px; }
  .story-blurb { display: block; font-size: 14px; line-height: 1.45; color: var(--text-dim, #a3b1c6); }
  .played-tag { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #080a10; background: var(--wc, #fffc00); border-radius: 999px; padding: 2px 8px; }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); color: var(--text); border-radius: 22px; box-shadow: 0 24px 60px var(--shadow); padding: 32px 28px 28px; position: relative; min-width: 0; overflow-wrap: anywhere; }
  .card:focus { outline: none; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .card-head > div:first-child { min-width: 0; }
  h1 { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 27px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  h1.h2 { font-size: 21px; margin: 0 0 12px; }
  .deck { font-size: 14.5px; color: var(--text-dim); margin: 0; max-width: 40ch; line-height: 1.5; }
  .case-no { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; padding-top: 4px; }
  .tagline { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; letter-spacing: 0.03em; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px; }

  .progress { display: flex; gap: 5px; margin-bottom: 24px; }
  .progress i { height: 5px; flex: 1; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .progress i.done { background: linear-gradient(90deg, var(--accent), var(--pink)); }
  .progress i.current::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--accent); opacity: .55; }

  .round-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .round-intro { font-size: 15px; line-height: 1.55; color: var(--text-dim); margin: 0 0 16px; }

  .exchange { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; }
  .exchange .line { font-size: 15.5px; line-height: 1.5; margin: 0 0 8px; }
  .exchange .line:last-child { margin-bottom: 0; }
  .exchange .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.03em; }
  .exchange .cue { font-size: 13.5px; color: var(--text-dim); font-style: italic; margin: 6px 0 12px; }
  .exchange .cue:last-child { margin-bottom: 0; }

  .lede { font-family: Inter, system-ui, sans-serif; font-size: 17.5px; font-weight: 500; font-style: italic; color: var(--accent-deep); line-height: 1.5; margin: 0 0 14px; }
  .prompt { font-size: 16.5px; line-height: 1.55; margin: 0 0 18px; font-weight: 500; }
  .setting { font-size: 15px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin: 0 0 16px; }
  .scene-title { font-family: Inter, system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; text-align: left;
    padding: 14px 17px; min-height: 44px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--text);
    cursor: pointer; transition: background 120ms, transform 80ms, box-shadow 120ms; line-height: 1.4;
  }
  button.choice:hover { background: var(--surface-3); box-shadow: 0 6px 16px rgba(108,95,224,0.16); }
  button.choice:active { transform: scale(0.99); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent) inset; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wrong) 40%, transparent) inset; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--alt) 40%, transparent) inset; }
  button.choice[disabled] { cursor: default; opacity: 0.6; }
  button.choice[disabled]:hover { background: var(--surface-2); box-shadow: none; }
  button.choice.correct[disabled], button.choice.wrong[disabled], button.choice.amber[disabled] { opacity: 1; }
  button.choice.pal { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill { display: inline-block; max-width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; letter-spacing: 0.02em; background: var(--accent); overflow-wrap: anywhere; }
  .pill.p { background: var(--parent); }
  .pill.a { background: var(--adult); }
  .pill.c { background: var(--childv); }

  .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
  .stamp.ok { background: var(--ok); }
  .stamp.cross { background: var(--wrong); }
  .stamp.amber { background: var(--alt); }

  .why-box { border-radius: 16px; padding: 16px 18px 17px 20px; margin: 0 0 16px; border-left: 5px solid transparent; box-shadow: 0 8px 22px rgba(23,18,51,0.12); }
  .why-box .stamp { margin-bottom: 10px; }
  .why-box .feedback { margin: 0 0 12px; }
  .why-box .feedback:last-child { margin-bottom: 0; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 45%, white); border-left-color: var(--ok); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 42%, white); border-left-color: var(--wrong); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 40%, white); border-left-color: var(--alt); }
  .why-box.neutral { background: color-mix(in srgb, var(--accent) 22%, white); border-left-color: var(--accent); }

  .feedback { font-size: 16px; line-height: 1.6; color: var(--text); margin: 0 0 14px; padding-top: 2px; }
  .feedback b { color: inherit; }

  .example { background: color-mix(in srgb, var(--accent) 38%, white); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px 15px 18px; margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: var(--text); box-shadow: 0 8px 22px rgba(23,18,51,0.10); }
  .ex-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px; }

  .nextbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button.next, a.next {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; border: none; text-decoration: none;
    padding: 12px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(108,95,224,0.35);
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
  }
  button.next:hover, a.next:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.next[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; filter: none; }
  .next-soon { font-size: 14px; color: var(--text-dim); margin: 0; }

  .meters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 18px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meter .name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .meter .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .meter.them .fill { background: linear-gradient(90deg, var(--blue), var(--accent)); }
  .meter.empty .fill { background: var(--wrong); }
  .meter .num { text-align: right; color: var(--text); font-weight: 600; }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .total b { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: 500; color: var(--text); }
  .band { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 8px; }
  .band .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 300ms ease; }
  .band .fill.over { background: var(--wrong); }
  .val { flex: none; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .counter-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button.ghost { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; background: transparent; color: var(--text); border: 2px solid var(--surface-3); padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; }
  button.ghost[disabled] { opacity: .45; cursor: default; }
  .counter-fb:empty, .order-fb:empty { display: none; }

  .sort-item { margin: 0 0 16px; }
  .sort-item + .sort-item { padding-top: 16px; border-top: 1px solid var(--surface-2); }
  .sort-item .exchange { margin-bottom: 12px; }
  .seq { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .seq:empty { display: none; }
  .seq li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .seq .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-deep); }
  .seq .ct { display: block; font-size: 15px; line-height: 1.5; }
  .seq .why { display: block; font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
  .pool { margin: 0 0 14px; }

  .intro-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-box { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
  .rules-box .round-label { margin-bottom: 10px; }
  .rules-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .rules-list li { font-size: 14px; line-height: 1.45; display: flex; gap: 10px; color: var(--text); }
  .rules-list .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 7px; }
  .ask { background: var(--bg-2); color: var(--on-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 0 0 18px; }
  .ask .kicker { color: var(--on-bg-dim); margin-bottom: 6px; }
  .ask p { font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.45; margin: 0; }

  .end-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
  .source { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .source b { color: var(--text); }
  .end-nav { margin-top: 18px; }

  .reflect-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  textarea.reflect-box { display: block; width: 100%; min-height: 120px; resize: vertical; font-family: Inter, system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: none; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 0 0 2px transparent inset; }
  textarea.reflect-box::placeholder { color: var(--text-dim); }
  textarea.reflect-box:focus { outline: none; box-shadow: 0 0 0 2px var(--accent) inset; }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 24px; }
    h1.h2 { font-size: 20px; }
    .meter { grid-template-columns: 44px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Visual refresh: dark console look from docs/VISUAL_GUIDE.md (presentation only) ===== */
  :root {
    color-scheme: dark;
    --wc: #fffc00;
    --bg: #080a10; --bg-2: #0f131f;
    --surface: #151a2a; --surface-2: #1e243b; --surface-3: #2a3250;
    --accent: var(--wc); --accent-deep: color-mix(in srgb, var(--wc) 70%, #fff);
    --pink: color-mix(in srgb, var(--wc) 55%, #ffb800); --blue: #06b6d4;
    --ok: #10b981; --wrong: #f43f5e; --alt: #fbbf24;
    --text: #f1f5f9; --text-dim: #a3b1c6;
    --on-bg: #f1f5f9; --on-bg-dim: #94a3b8;
    --shadow: rgba(0, 0, 0, 0.5);
    --parent: #be123c; --adult: #0e7490; --childv: #b45309;
  }
  [data-world="1"] { --wc: #ff9500; } [data-world="2"] { --wc: #00e5ff; }
  [data-world="3"] { --wc: #a855f7; } [data-world="4"] { --wc: #f43f5e; }
  [data-world="5"] { --wc: #06b6d4; } [data-world="6"] { --wc: #10b981; }
  [data-world="7"] { --wc: #f59e0b; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 820px 560px at 12% -8%, color-mix(in srgb, var(--wc) 14%, transparent), transparent),
      radial-gradient(ellipse 680px 520px at 108% 12%, rgba(168, 85, 247, 0.07), transparent),
      radial-gradient(ellipse 600px 420px at 60% 110%, rgba(6, 182, 212, 0.07), transparent);
    background-attachment: fixed;
  }
  .card { background: rgba(21, 26, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px var(--shadow), inset 0 2px 0 color-mix(in srgb, var(--wc) 70%, transparent); }
  h1, h1.h2, .scene-title { font-weight: 800; letter-spacing: -0.02em; }
  .lede { font-style: italic; color: var(--accent-deep); }
  .series { color: var(--wc); }
  .tagline { background: var(--surface-2); color: var(--text-dim); }
  .progress i.done { background: linear-gradient(90deg, var(--wc), #10b981); }
  .progress i.current::after { background: var(--wc); }

  /* Speech bubbles with tails */
  .exchange { background: transparent; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .exchange .line { position: relative; margin: 0; padding: 10px 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); max-width: 92%; }
  .exchange .line::before { content: ""; position: absolute; left: -6px; bottom: 10px; width: 10px; height: 12px; background: #f1f5f9; clip-path: polygon(100% 0, 0 100%, 100% 100%); }
  .exchange .who { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .exchange .cue { color: var(--text-dim); margin: 2px 0 0; }

  /* Options */
  button.choice { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid var(--wc); }
  button.choice:hover { background: var(--surface-3); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); }
  button.choice.correct { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok); box-shadow: none; }
  button.choice.wrong { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); border-color: var(--wrong); box-shadow: 0 0 18px color-mix(in srgb, var(--wrong) 45%, transparent); animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  button.choice.amber { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); border-color: var(--alt); box-shadow: none; }
  button.choice[disabled]:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  button.choice.correct[disabled]:hover { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  button.choice.wrong[disabled]:hover { background: color-mix(in srgb, var(--wrong) 22%, var(--surface)); }
  button.choice.amber[disabled]:hover { background: color-mix(in srgb, var(--alt) 18%, var(--surface)); }
  .card.shake { animation: ta-shake 400ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes ta-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

  /* Feedback and examples */
  .stamp, .pill { color: #fff; }
  .stamp.ok { background: #047857; } .stamp.cross { background: #be123c; } .stamp.amber { background: #b45309; }
  .why-box { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-left-width: 5px; }
  .why-box.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .why-box.cross { background: color-mix(in srgb, var(--wrong) 16%, var(--surface)); }
  .why-box.amber { background: color-mix(in srgb, var(--alt) 14%, var(--surface)); }
  .why-box.neutral { background: color-mix(in srgb, var(--wc) 12%, var(--surface)); }
  .example { background: color-mix(in srgb, var(--wc) 11%, var(--surface)); color: var(--text); }
  .ex-label, .end-badge { color: var(--accent-deep); }
  .end-badge { color: var(--ok); }
  .ask { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--wc); color: var(--text); }

  /* Buttons, meters, chips */
  button.next, a.next { background: linear-gradient(135deg, var(--wc), var(--pink)); color: #080a10; box-shadow: 0 10px 24px color-mix(in srgb, var(--wc) 35%, transparent); }

ne\"/><circle cx=\"9\" cy=\"27\" r=\"4\" fill=\"url(#w6g)\" stroke=\"#fff\" stroke-width=\"1.2\"/><circle cx=\"27\" cy=\"27\" r=\"4\" fill=\"url(#w6g)\" stroke=\"#fff\" stroke-width=\"1.2\"/><line x1=\"12.5\" y1=\"24\" x2=\"23.5\" y2=\"24\" stroke=\"#FFFC00\" stroke-width=\"1.5\" stroke-dasharray=\"2 2\"/></svg>", "7": "<svg class=\"emb\" viewBox=\"0 0 36 36\" aria-hidden=\"true\" focusable=\"false\"><radialGradient id=\"w7g\" cx=\"50%\" cy=\"100%\" r=\"80%\"><stop offset=\"0%\" stop-color=\"#FFFC00\"/><stop offset=\"60%\" stop-color=\"#F59E0B\"/><stop offset=\"100%\" stop-color=\"#D97706\"/></radialGradient><path d=\"M7 23 A11 11 0 0 1 29 23 Z\" fill=\"url(#w7g)\" stroke=\"#FFFC00\" stroke-width=\"1.5\"/><line x1=\"3\" y1=\"23\" x2=\"33\" y2=\"23\" stroke=\"#FDE68A\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><g stroke=\"#FFFC00\" stroke-width=\"2.5\" stroke-linecap=\"round\"><line x1=\"18\" y1=\"5\" x2=\"18\" y2=\"9\"/><line x1=\"8\" y1=\"9\" x2=\"11\" y2=\"12\"/><line x1=\"28\" y1=\"9\" x2=\"25\" y2=\"12\"/><line x1=\"31\" y1=\"17\" x2=\"27\" y2=\"18\"/><line x1=\"5\" y1=\"17\" x2=\"9\" y2=\"18\"/></g></svg>"};</script>
<script>window.TA_GAME = {"slot":"6.6","setting":"Friends & Community","title":"The Plan Board","world":6,"worldName":"The Story You Wrote","week":6,"weekName":"The Story You Wrote","mechanic":"Build","concept":"After this one you can place a life story's Don'ts, Musts, how-tos and plan on the Plan Board, name the decision under them, and propose a new line that can be acted on this month.","plainWord":"the Plan Board","bookTerm":"Script matrix","bookIdea":"A script matrix is a diagram of the messages each parent sends, the counterscript from the parent's Parent, the injunctions from the parent's Child and the program that shows how, plus the decision the child makes in answer.","bookSource":"Scripts People Live, ch. 4, 6 and 21; TA Today, ch. 13","opener":{"setting":"Sunday, 9:40am. The Corner Table, the back table. Nadia has printed Gran's life story on one long sheet, and the Plan Board beside it is still blank.","lines":[{"who":"Nadia","text":"\u201cGran's board first, then yours. Read her story for the Don'ts and the Musts, and don't rush the last few lines.\u201d","cue":"sliding the printed sheet across the table"},{"who":"Sam","text":"\u201cSorry, sorry, I'm late. Is it the one with the grid? I hate the grid.\u201d","cue":"dropping into a chair with a mug in each hand"}],"ask":"Build Gran's Plan Board first, and find the decision she made as a girl. Then propose a new line she could act on, and build your own from your Plan Board."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>Gran's life story, in her own words.<\/b><br>I was the middle one of four girls, in a town with one bus a day.<br>My mother ran the house like a clock. She never sat down while the rest of us ate.<br>When I said I wanted to finish school, she said, \u201cSit down. Your opinion isn't needed.\u201d<br>My father was a quiet man. When we cried, he said, \u201cBe strong. Let the neighbours see that we are fine.\u201d<br>He also said, \u201cYou're still my little girl. Stay home where I can see you.\u201d<br>My mother said, \u201cBe the good one. Never cause trouble for the family.\u201d<br>So I was the good one. I did what I was told, and I was never the loud one.<br>I married at nineteen. My husband was kind, and he was away for work half the year.<br>We had two children. I did their lunches and their homework.<br>My husband died when the youngest was eleven. I did the building society and the school fees.<br>People said, \u201cGran, you're so strong.\u201d I was pleased, and also tired.<br>Every time I wanted something for myself, I put it on the list for later.<br>The sewing class, and the course in accounts. Later, I said. Later.<br>\u201cI'll live properly once the children are settled,\u201d I told myself, and I believed it.<br>The children grew up and did well. My son went to Canada for work and rings on Sundays, most weeks.<br>My daughter has a flat of her own and little time for her old mother.<br>I thought, once they are both settled, I'll go to the temple every morning and sit for an hour.<br>But there is always one more thing. The knees, and the letter from the building society.<br>Leo comes on Saturdays. I make his tea at four, sweet, the way he likes it.<br>Once he showed me a drawing with twelve wheels. I put it under the newspaper and said I'd look later.<br>He stopped bringing me drawings after that. It is my fault, and it is nobody's fault.<br>Now I wonder what I would have done with the years I put on the list.<br>I wonder if the children were ever the reason, or only the excuse.<br>I'm sixty-four. The knees are bad and the list is still long.<br>Nobody asked me what I wanted. I didn't ask either, because the answer came too late to be useful.","items":[{"type":"sort","prompt":"Gran's life story, line by line. Put each line on the Plan Board.","bins":["A Don't from her mother","A Don't from her father","A Must, from either parent","The how-to she was shown","The plan she decided","Not part of the Plan"],"items":[{"text":"\u201cSit down. Your opinion isn't needed.\u201d","answer":0,"why":"Her mother's message is that Gran doesn't count. It is a Don't: she is told not to be important, and she learns to take the chair at the edge."},{"text":"\u201cBe the good one. Never cause trouble for the family.\u201d","answer":2,"why":"This is a Must. It says 'be good' as a condition: keep the rule and you are safe. It comes in plain words, which Musts usually do, and it is a rule she has to keep."},{"text":"\u201cYou're still my little girl. Stay home where I can see you.\u201d","answer":1,"why":"Her father's message keeps her small. It is a Don't: don't grow up, and don't go where he cannot see you."},{"text":"\u201cBe strong. Let the neighbours see that we are fine.\u201d","answer":2,"why":"Another Must, this time from her father. 'Be strong' is a rule with a condition in it: show the family as fine even when it isn't."},{"text":"\u201cMy mother ran the house like a clock. She never sat down while the rest of us ate.\u201d","answer":3,"why":"Nobody tells Gran to do anything in this line. Her mother shows her how, by doing it in front of her. Showing a child how to follow a message is the program, and here it teaches the good one how to serve and never sit."},{"text":"\u201cI'll live properly once the children are settled.\u201d","answer":4,"why":"This one is the plan itself. It puts the living behind a condition, and that is the decision she made and has kept."},{"text":"\u201cI make his tea at four, sweet, the way he likes it.\u201d","answer":5,"why":"A present choice, kind and freely made. It doesn't come from a message she got as a girl, so it isn't part of the Plan."}]},{"type":"pick","who":"Neighbours","text":"\u201cGran, you're so strong.\u201d","cue":"said at the lift, and she is pleased and also tired","options":["Be strong","Hurry up","Try hard"],"answer":0,"why":"The praise is for being strong, which is a Must. Being pleased is the reward, and being tired is the cost. The Must keeps earning the praise, so it keeps running.","traps":{"1":"This would be hurry up if the praise were about speed, as in 'you get everything done so fast'. Nobody praises her for speed in the story, only for holding on.","2":"This would be try hard if the praise were about effort, as in 'you keep trying so hard'. The praise is about strength, and strength is what the Must is for."},"example":"A school prize day. The headmaster tells a boy who came first every year, \u201cYou're so strong, you never need help,\u201d and the boy stops asking for help in class."},{"type":"pick","who":"Gran","text":"\u201cI put it under the newspaper and said I'd look later.\u201d","cue":"read from her story, about the drawing with twelve wheels","options":["Don't be important","Don't feel","Don't be close"],"answer":0,"why":"The drawing is pushed out of sight and called later. The Don't that Gran passes on to Leo is don't be important: what a child makes doesn't count.","traps":{"1":"This would be don't feel if Gran had cried over the drawing. There are no tears here. She puts the drawing away and moves on, and what that says is about worth.","2":"This would be don't be close if she had pushed him away from the table. Leo is still at her side, and what goes is the drawing."},"example":"A family group chat, Sunday. A father posts a photo of his son's model rocket, and the reply is \u201cNice. Now delete it, the group is full.\u201d"},{"type":"pick","who":"Her son (Canada)","text":"\u201cMum, do the sewing class. I'll pay the fee, and you don't have to ask me first.\u201d","cue":"a Sunday call from Canada, Gran on speaker by the kettle","options":["A Don't","A Must","A permission"],"answer":2,"why":"A permission. It says Gran may do the thing she keeps putting off, and the fee comes with the line. Nothing in it asks her to be good first.","traps":{"0":"A Don't would shut a door, like \u201cStay home where I can see you.\u201d This line opens one, and it pays for the way in.","1":"A Must would set a condition, like \u201cBe the good one.\u201d This line has no condition in it, and nobody is keeping score."},"example":"A family WhatsApp group, Sunday.<br>Your brother: \u201cGo on, book the trip. I'll cover the hotel.\u201d<br>Nobody asks what you did to deserve it. He has said yes, and he has put money behind it."}]},{"level":"Play","label":"Play, the week in motion","intro":"The boss runs harder. The lines have more beats, and some of the kindest-sounding options keep the trap running. Watch what each line does to Gran's chair.","items":[{"type":"scene","title":"Saturday, the pudding and the list","setting":"Saturday, 4:05pm. Gran's flat downstairs, the kitchen. Leo is at the window. He is drawing a bus. <i>The Heckler, in your head: 'Don't make a fuss. Let her finish the pudding.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Gran","text":"\u201cI'm sixty-four, my knees are bad, and the children are not settled. I'll live once they are, I suppose.\u201d","cue":"stirring the pudding, not looking up","lines":[{"text":"\u201cGran, what's one thing you'd do this month if it needed nobody's permission but yours?\u201d","tag":"best","you":4,"them":4,"outcome":"She stops stirring. 'Nothing. There's Leo, the building society, the knees.' But she has heard the question.","why":"A question that puts the choice in her hands. Her line is about waiting, and this question asks her to act on something this month."},{"text":"\u201cThat's sad, Gran. Still, the children will settle one day.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She nods and goes back to stirring. The wait is kept, and the afternoon goes on.","why":"It sounds kind, but it agrees the wait is fine. The Plan is safe when someone agrees with it."},{"text":"\u201cOh Gran, you've carried everyone. Sit down, I'll finish the pudding. You've done enough.\u201d","tag":"game","you":3,"them":3,"outcome":"She sits, and the spoon is in your hand. 'Well, you've done enough,' she says, and the pudding goes cold.","why":"A trap move. It looks like help, but it takes her out of the chair she could stand up from. 'Sit down, you've done enough' also repeats her mother's Don't. It ends the scene early."}]},{"who":"Gran","text":"\u201cNothing. I haven't got time for a list. There's Leo, the building society, my knees.\u201d","cue":"pointing the spoon at the window","lines":[{"text":"\u201cYou're allowed to start the list now, Gran. Pick the smallest thing and put a day on it.\u201d","tag":"best","you":5,"them":3,"outcome":"'The smallest thing,' she says slowly. 'The class at the hall, on a Thursday, maybe.'","why":"A permission and a small, dated step. The list grew one 'later' at a time. A day on it makes it a plan she can act on."},{"text":"\u201cMaybe next year, when things calm down.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"'Next year,' she says, and the list stays on the shelf.","why":"Next year is another condition. The Plan just moves the finish line again."}]},{"who":"Gran","text":"\u201cThe class is at the community hall. My daughter says I should go, but she says it on the phone and then forgets.\u201d","cue":"turning off the gas, one hand on her hip","lines":[{"text":"\u201cThen ring her and say it plainly. Tell her Thursday at ten, and ask her to ring you on Friday to hear how it went.\u201d","tag":"best","you":5,"them":3,"outcome":"'She'll say I'm being silly,' Gran says. 'Still, she'll ring.'","why":"A clear plan with a net under it: a fixed day and time, plus someone to check in. The green light comes with the net, so the step is less likely to be dropped."},{"text":"\u201cYes, yes, she means well.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"The phone call stays in the future, along with the class.","why":"Agreeing with the daughter's vagueness keeps the plan vague, and a vague plan never gets a day."}]},{"who":"Leo","text":"\u201cGran, can I come on Thursday? I'll draw in the hall.\u201d","cue":"pencil in the air, looking at Gran, not at you","lines":[{"text":"\u201cThat's a good plan, Leo. Ask her yourself, and tell her what you'll draw.\u201d","tag":"best","you":3,"them":4,"outcome":"Leo turns to her. 'I'll draw a bus. With twelve wheels.' Gran looks up for the first time since the pudding.","why":"You send the question back to the person who can answer it, and Leo gets to be important for a minute. The Don't loses some of its grip when a child asks for something and is heard."},{"text":"\u201cAsk your Gran, not me.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"Leo shrugs and goes back to the window. Gran doesn't look up.","why":"It is correct in form and cold in tone. The one child in the room is sent off, and the Don't keeps working."}]},{"who":"Gran","text":"\u201cThursday, the hall, at ten. I suppose the children can manage one hour without me.\u201d","cue":"not looking at the pudding, looking at Leo","lines":[{"text":"\u201cThat's a new line, Gran. Say it once more, the one about the children managing.\u201d","tag":"best","you":4,"them":5,"outcome":"'The children can manage one hour without me,' she says, and she laughs at herself.","why":"Naming the new line out loud makes it hers. Repeating it helps her hear it as a plan she can keep."},{"text":"\u201cGood. Eat some pudding, then.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"She eats one spoon and says the pudding has gone cold.","why":"Kind, but it lets the new line slide past. The plan needs to be heard once more."}]}],"payoff":"Gran sits, and the pudding goes cold. The old line wins again: I'll live once the children are settled. You helped it win by doing the work for her.","example":"A neighbour's mother who says \u201cAfter the wedding\u201d about the holiday she wants. The day after the wedding, it is \u201cAfter the baby.\u201d"},{"type":"pick","who":"Nadia","text":"\u201cGran needs a new line, one she can say today. Which one is a real rewrite of the line, and not the old Plan in a new coat?\u201d","cue":"turning the blank Plan Board round to face you","options":["I'll live properly once the children are settled.","I'll start on Thursday at the hall, and the children can manage an hour without me.","I'll rest after Leo's exams are over, and then I'll decide."],"answer":1,"why":"A rewritten line is one she can say today and act on. The second option names a day and a place, and the line is hers. The first is the old line, and the third moves the condition again, which is the old Plan with a new date on it.","traps":{"0":"This is the old line, word for word. Saying it again would keep the wait in place, and Gran would leave the board exactly as it was.","2":"This sounds like progress, but it moves the condition to Leo's exams. Gran would have a new finish line and the same wait, and the Thursday hall would still be empty."},"example":"A retired bank clerk who said \u201cOnce the grandchildren are older, I'll learn the violin.\u201d She booked a Tuesday class instead and rang her sister to say so."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cPut Gran's Musts and Don'ts together. Which line is the decision underneath them?\u201d","cue":"running a finger down the board, then tapping the last box","options":["My life starts once the others are taken care of.","I must always look strong in front of the neighbours.","I'll always be the one who makes the tea."],"answer":0,"why":"The books call this the script decision: the choice a child makes between her own needs and the pressure of the messages around her, which then steers the rest of the Plan. The Don'ts and Musts are the material. The decision itself is that her life starts once the others are looked after, and she has kept it since she was small.","traps":{"1":"This reading would send the talk to looking strong and the neighbours, and it would stop at the family's pride. The decision under it, about her own life, would go unnoticed.","2":"This reading would send the talk to tea. It is a loving habit, but the decision costing her years is somewhere else."},"example":"A neighbour who ran the family accounts for thirty years and says he never had time for a hobby. The hobby kit is still in the box in the loft."},{"type":"pick","who":"Nadia","text":"\u201cYour new line is only a wish until something holds it up. What helps a person revoke an old decision and make a new one?\u201d","cue":"pushing the sheet back across the table to Gran's side","options":["A promise to feel differently by next year.","A present choice she can act on this month, with permission and protection under it.","A clever argument that proves the old line was wrong."],"answer":1,"why":"The books call this revoking the old decision, or redecision. Permission lets a person go against the old message, and protection keeps her from sliding back when she feels alone and frightened. A promise to feel differently has no step in it, and an argument alone seldom moves a plan.","traps":{"0":"This answer would have Gran wait for a feeling next year. The Until line would stay exactly where it is.","2":"This answer would give Gran a debate and nothing to do on Thursday. A clever argument can win the room and still leave her at home."},"example":"A football coach tells a boy who always apologises, \u201cYou may take the free kick. I'll stand by the goal if you miss.\u201d The permission and the net are both in the sentence."}]}],"debrief":{"nadia":"Gran made her decision as a girl, and she has kept it for more than fifty years. Her mother and father gave her the Don'ts and the Musts, her mother showed her how, and she did the rest herself, which was the waiting. Your own Plan Board is the same kind of drawing, and the line on it can be written again.","bookTerm":"Script matrix","bookNote":"The books call this the script matrix: a diagram of the messages each parent sends, the Musts from the parent's Parent, the Don'ts from the parent's Child and the how-to the same-sex parent shows, and the decision the child makes in answer."},"reflection":{"prompt":"Now build your own Plan Board from your choices so far. Which Don't sits under the Must you use most, and what did it cost you the last time it ran?"},"next":"7.1","baseStory":{"setting":"Friends & Community","blurb":"A grandmother's life story on one long sheet, and a Thursday class she keeps putting off."},"moreStories":[{"setting":"Home & Flatmates","blurb":"Maya's fridge sheet balances to the penny, but her own life story has never been checked.","opener":{"setting":"Sunday, 8:50pm. Hawthorn Court, apartment 3B, the balcony. Maya has written her story on the back of the rota, and a blank Plan Board is taped to the fridge door behind you.","lines":[{"who":"Maya","text":"\u201cIt's for Nadia's group. Read it for the Don'ts and the Musts. Not aloud, Sam. That means you.\u201d","cue":"holding the sheet against her chest, then letting go of one corner"},{"who":"Sam","text":"\u201cSorry, sorry, I wasn't going to. Is it the one with the grid? I'm hopeless at grids.\u201d","cue":"backing in from the kitchen with two forks and one yoghurt"}],"ask":"Build Maya's Plan Board first, and find the decision she made as a girl. Then propose a new line she could act on this month, and build your own from your Plan Board."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>Maya's life story, in her own words.<\/b><br>I was the eldest of three, in a flat above a launderette that smelled of hot sheets.<br>My mother did nights at a care home. She kept the money in a biscuit tin and counted it on Friday, alone, with the door shut.<br>When I asked for new school shoes, she said, \u201cDon't ask me for things. I've got enough.\u201d<br>My father drove a lorry and rang on Sundays. When I cried on the phone, he said, \u201cBe strong. Your brothers are watching you.\u201d<br>He also said, \u201cDon't make a fuss, love. A fuss costs more than the thing.\u201d<br>My mother said, \u201cBe the sensible one. Somebody has to be.\u201d<br>So I was sensible. I packed the lunches and signed my own forms.<br>I got through nursing school on a night job and a bus pass.<br>At Hawthorn Court I made the sheet for the fridge, with the dates and the amounts, so nobody could say I took more than my share.<br>People say, \u201cMaya, you're a rock.\u201d I like hearing it, and I am tired.<br>Every time I wanted something, I put it on a list for when the sheet was clear.<br>A pottery evening, a week at the coast, a day off with nothing in it. Later, I said. Later.<br>\u201cI'll ask for help once I've done more than my share,\u201d I told myself, and I believed it.<br>My brothers are grown. One is in Leeds and rings when he needs a form filled in.<br>On Fridays I make a curry for the flat. I like the smell of the onions, and nobody has to pay me back.<br>When my headphones broke, Sam lent me his. I put them back on his bed with a note: \u201cThanks, we're square.\u201d<br>He looked at the note for a long time.<br>I'm twenty-nine. The sheet has balanced for two years and the list is still long.<br>Nobody asked what I wanted. I didn't ask either, because the answer would have meant owing someone.","items":[{"type":"sort","prompt":"Maya's life story, line by line. Put each line on the Plan Board.","bins":["A Don't from her mother","A Don't from her father","A Must, from either parent","The how-to she was shown","The plan she decided","Not part of the Plan"],"items":[{"text":"\u201cDon't ask me for things. I've got enough.\u201d","answer":0,"why":"Her mother's message is that Maya's wants are a cost. It is a Don't: don't be a need, and don't be a bother, so she learns to ask for nothing."},{"text":"\u201cBe the sensible one. Somebody has to be.\u201d","answer":2,"why":"A Must. It sets a condition: be sensible and you are safe, and somebody else is let off. It comes in plain words, which Musts usually do."},{"text":"\u201cDon't make a fuss, love. A fuss costs more than the thing.\u201d","answer":1,"why":"Her father's message turns a want into a price. It is a Don't: don't take up room with what you need, because it will cost the family."},{"text":"\u201cBe strong. Your brothers are watching you.\u201d","answer":2,"why":"Another Must, from her father this time. 'Be strong' has a condition in it: stay steady in front of the others, even when she is crying."},{"text":"\u201cShe kept the money in a biscuit tin and counted it on Friday, alone, with the door shut.\u201d","answer":3,"why":"Nobody tells Maya to do anything in this line. Her mother shows her how, by doing it in front of her. A sheet of dates and amounts is the same habit with a fridge magnet on it."},{"text":"\u201cI'll ask for help once I've done more than my share.\u201d","answer":4,"why":"This is the plan itself. It puts the asking behind a condition that can never quite be met, and it is the decision she has kept."},{"text":"\u201cOn Fridays I make a curry for the flat.\u201d","answer":5,"why":"A present choice, freely made and nobody keeps score of it. It doesn't come from a message she got as a girl, so it isn't part of the Plan."}]},{"type":"pick","who":"Sam","text":"\u201cMaya, you're a rock. I'd fall apart without you.\u201d","cue":"said in the hallway with a laundry basket, and she is pleased and also tired","options":["Hurry up","Try hard","Be strong"],"answer":2,"why":"The praise is for being a rock, which is a Must. Being pleased is the reward, and being tired is the cost. Praise keeps the Must running because it pays.","traps":{"0":"This would be hurry up if the praise were about speed, as in 'you get through the washing so fast'. Sam praises her for holding up, not for pace.","1":"This would be try hard if the praise were about effort, as in 'you really give it everything'. 'A rock' is about being steady, which is what the Must is for."},"example":"A sixth-form common room. A teacher tells a girl who stays calm in every row, \u201cYou're a rock, you never need anyone,\u201d and the girl stops saying when she is struggling."},{"type":"pick","who":"Maya","text":"\u201cThanks, we're square.\u201d","cue":"on a note, left on Sam's bed with his headphones","options":["Don't be important","Don't be close","Don't feel"],"answer":1,"why":"The note pays the loan back to the last penny and turns a kindness into a settled debt. The Don't she hands on is don't be close: nobody owes anybody, so nobody is tied.","traps":{"0":"This would be don't be important if she had waved her own broken headphones off as no big deal. The note is about the loan, and what goes missing is the friendship.","2":"This would be don't feel if she had cried over the headphones and then hidden it. There are no feelings in the note at all, which is a different thing from hiding them."},"example":"A family WhatsApp group. An aunt sends a cousin the exact sum for a lift to the station, with \u201cAll square now x\u201d, and the cousin never offers a lift again."},{"type":"pick","who":"Sam","text":"\u201cMaya, book the pottery evening. I'll cover your Friday curry, and you don't have to pay me back.\u201d","cue":"over the kettle, not looking at her","options":["A permission","A Don't","A Must"],"answer":0,"why":"A permission. It says Maya may do the thing she keeps putting off, and the cover for Friday comes with it. Nothing in it asks her to be sensible first, and no sheet is kept.","traps":{"1":"A Don't would shut a door, like \u201cDon't make a fuss.\u201d This line opens one, and it pays for the way in.","2":"A Must would set a condition, like \u201cBe the sensible one.\u201d This line has no condition in it, and nobody is keeping score."},"example":"A flat group chat, Sunday.<br>Your flatmate: \u201cGo on, take the Saturday off. I'll do the bins and the shop.\u201d<br>Nobody asks what you did to deserve it."}]},{"level":"Play","label":"Play, the week in motion","intro":"The boss runs harder. The lines have more beats, and some of the kindest-sounding options keep the trap running. Watch what each line does to Maya's chair.","items":[{"type":"scene","title":"Saturday, the curry and the sheet","setting":"Saturday, 6:15pm. Apartment 3B, the kitchen. Maya is frying onions. The sheet is on the fridge door, and Sam is carrying in shopping behind you. <i>The Heckler, in your head: 'Don't make a fuss. Let her finish the curry.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Maya","text":"\u201cI'm twenty-nine, my feet hurt, and the sheet is still not clear. I'll do the pottery thing once it is, I suppose.\u201d","cue":"stirring the onions, not looking up","lines":[{"text":"\u201cMaya, what's one thing you'd do this month if it needed nobody's say-so but yours?\u201d","tag":"best","you":4,"them":4,"outcome":"She stops stirring. 'Nothing. There's the rota, the gas bill, Sam's half of the bins.' But she has heard the question.","why":"A question that puts the choice in her hands. Her line is about waiting, and this question asks her to act on something this month."},{"text":"\u201cThat's a shame, Maya. Still, the sheet will clear one day.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She nods and goes back to the onions. The wait is kept, and the evening goes on.","why":"It sounds kind, but it agrees the wait is fine. The Plan is safe when someone agrees with it."},{"text":"\u201cOh Maya, you do everything. Give me the spoon, I'll finish the curry. You've done enough.\u201d","tag":"game","you":3,"them":3,"outcome":"She hands over the spoon and takes a pen from the fridge door. 'Right. I'll put that down as yours,' she says, and writes a line on the sheet.","why":"A trap move. It looks like help, but it takes her out of the chair she could stand up from, and the favour goes straight into the ledger. It ends the scene early."}]},{"who":"Maya","text":"\u201cNothing. I haven't got time for a list. There's the rota, the gas bill, Sam's half of the bins.\u201d","cue":"pointing the spoon at the sheet on the fridge","lines":[{"text":"\u201cYou're allowed to start the list now, Maya. Pick the smallest thing and put a day on it.\u201d","tag":"best","you":5,"them":3,"outcome":"'The smallest thing,' she says slowly. 'The pottery evening at the hall, on a Wednesday, maybe.'","why":"A permission and a small, dated step. The list grew one 'later' at a time. A day on it makes it a plan she can act on."},{"text":"\u201cMaybe after the next gas bill, when things are straight.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"'After the gas bill,' she says, and the list stays under the sheet.","why":"Another finish line is another condition. The Plan just moves the date again."}]},{"who":"Maya","text":"\u201cThe pottery evening is at the community hall. Sam says I should go, but he says it on his way out of the door and then he's gone.\u201d","cue":"turning off the gas, one hand on her hip","lines":[{"text":"\u201cThen tell him plainly. Wednesday at seven, and ask him to have the kettle on when you get back.\u201d","tag":"best","you":5,"them":3,"outcome":"'He'll say sorry about eleven times,' Maya says. 'Still, he'll have the kettle on.'","why":"A clear plan with a net under it: a fixed day and time, plus someone to be there at the end. The green light comes with the net, so the step is less likely to be dropped."},{"text":"\u201cYes, yes, he means well.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"The conversation with Sam stays in the future, along with the class.","why":"Agreeing with Sam's vagueness keeps the plan vague, and a vague plan never gets a day."}]},{"who":"Sam","text":"\u201cCan I come on Wednesday? I'll carry the clay home. I'm not good at much, but I can carry.\u201d","cue":"still holding a bag in each hand, looking at Maya, not at you","lines":[{"text":"\u201cThat's a good offer, Sam. Ask her yourself, and say it once without a sorry in it.\u201d","tag":"best","you":3,"them":4,"outcome":"Sam puts the bags down. 'I'll carry the clay home,' he says, and nothing else. Maya looks up for the first time since the onions.","why":"You send the question back to the person who can answer it, and Sam gets to be useful for a minute. The Don't loses some grip when someone offers and is heard."},{"text":"\u201cAsk Maya, not me.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"Sam shrugs and starts unpacking. Maya doesn't look up.","why":"It is correct in form and cold in tone. The one person offering something is sent off, and the Don't keeps working."}]},{"who":"Maya","text":"\u201cWednesday, the hall, at seven. I suppose the sheet can manage one evening without me.\u201d","cue":"not looking at the fridge, looking at Sam","lines":[{"text":"\u201cThat's a new line, Maya. Say it once more, the one about the sheet managing.\u201d","tag":"best","you":4,"them":5,"outcome":"'The sheet can manage one evening without me,' she says, and she laughs at herself.","why":"Naming the new line out loud makes it hers. Repeating it helps her hear it as a plan she can keep."},{"text":"\u201cGood. Mind the onions, then.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"She turns back to the pan, and the line goes with the smoke.","why":"Kind, but it lets the new line slide past. The plan needs to be heard once more."}]}],"payoff":"Maya hands over the spoon, and the curry becomes a line on the sheet. The old line wins again: I'll ask once I've done more than my share. You helped it win by giving her something new to owe.","example":"A flatmate who says \u201cAfter the deadline\u201d about the weekend away. The day after the deadline, it is \u201cAfter the move.\u201d"},{"type":"pick","who":"Maya","text":"\u201cNadia says I need a new line, one I can say today. Which one is a real rewrite, and not the old sheet in a new coat?\u201d","cue":"tapping the pen against the fridge door","options":["I'll ask for help once the sheet has balanced for a full year and nobody owes me.","I'll ask for help once I've done more than my share, and I'll keep a note of it.","I'll start on Wednesday at the hall, and the sheet can manage one evening without me."],"answer":2,"why":"A rewritten line is one she can say today and act on. The third option names a day and a place, and the line is hers. The first moves the condition to a year from now, which is the old Plan with a new date, and the second is the old line with a ledger attached.","traps":{"0":"This sounds like progress, but it sets a new finish line. Maya would have a fresh condition and the same wait, and the Wednesday evening would still be empty.","1":"This is the old line almost word for word. Saying it again would keep the wait in place, and the board would be exactly as she found it."},"example":"A nurse on nights who said \u201cWhen the rota settles, I'll learn to swim.\u201d She booked Thursday lessons at the pool instead and told her sister the day."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Nadia","text":"\u201cPut Maya's Musts and Don'ts together. Which line is the decision underneath them?\u201d","cue":"running a finger down the board, then tapping the last box","options":["Needing something puts a debt on me, so I'll ask for nothing until I'm even.","I must always stay sensible in front of my brothers.","I'll always be the one who makes the Friday curry for the flat."],"answer":0,"why":"The books call this the script decision: the choice a child makes between her own needs and the pressure of the messages around her, which then steers the rest of the Plan. The Don'ts and Musts are the material. The decision is that a want is a debt, so she keeps the sheet balanced and asks for nothing.","traps":{"1":"This reading would send the talk to her brothers and being sensible. It stops at a rule she was given, and the decision under it, about her own wants, goes unnoticed.","2":"This reading would send the talk to the curry. It is a warm habit, and the decision costing her years is somewhere else."},"example":"A neighbour who paid back every lift and every cup of sugar for thirty years and says he never really knew anyone on the landing. The thank-you cards are still in a drawer."},{"type":"pick","who":"Nadia","text":"\u201cYour new line is only a wish until something holds it up. What helps a person revoke an old decision and make a new one?\u201d","cue":"pushing the sheet back across the balcony table to Maya's side","options":["A promise to feel easier about asking by the spring.","A tidy argument that proves the sheet was never needed.","A step she can take this month, with permission to take it and someone beside her."],"answer":2,"why":"The books call this revoking the old decision, or redecision. Permission lets a person go against the old message, and protection keeps her from sliding back when she feels alone and frightened. A promise to feel better has no step in it, and an argument alone seldom moves a plan.","traps":{"0":"This answer would have Maya wait for a feeling in the spring. The Until line would stay exactly where it is.","1":"This answer would give Maya a debate and nothing to do on Wednesday. A clever argument can win the balcony and still leave her at home."},"example":"A football coach tells a girl who always apologises, \u201cYou may take the free kick. I'll stand by the goal if you miss.\u201d The permission and the net are both in the sentence."}]}]},{"setting":"Family","blurb":"Mum's long Sunday message sits on Gran's kitchen table, and Leo wants to do the boxes.","opener":{"setting":"Sunday, 4:40pm. Gran's flat downstairs, the kitchen. The phone is propped against the teapot, and Mum's typed message is open on it.","lines":[{"who":"Gran","text":"\u201cShe's rung twice already. Read it before she rings a third time, and don't rush the last few lines.\u201d","cue":"pushing the phone across the oilcloth with one finger"},{"who":"Leo","text":"\u201cIs it the one with the grid? Can I do the boxes? I've got the good pencil.\u201d","cue":"from under the table, a pencil case open in his lap"}],"ask":"Build Mum's Plan Board first, and find the decision she made as a girl. Then propose a new line she could act on this month, and build your own from your Plan Board."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>Mum's life story, typed in a long message the night before.<\/b><br>I grew up above my parents' shop, with the bell going all day.<br>My mother ran the till and the stockroom and the dinner. She never sat down before nine at night.<br>If I brought her a drawing, she said, \u201cNot now. Don't get under my feet.\u201d<br>My father ate standing up, with one eye on the clock. When I cried at the table, he said, \u201cStop that. I can't think with the noise.\u201d<br>He also said, \u201cHurry up, girl. The bus won't wait.\u201d<br>My mother said, \u201cBe useful. Somebody in this house has to be.\u201d<br>So I hurried, and I was useful. I did my homework on the stairs and ate my dinner in ten minutes.<br>I married and moved six hundred kilometres for his work.<br>I rang my mother every Sunday. She always had to go in five minutes.<br>People say, \u201cYou're always on the go. How do you do it?\u201d I am proud, and I haven't sat down since Tuesday.<br>Every time I wanted to rest, I said, when this is done.<br>A walk by the river, the book club, an afternoon with nothing in it. Later, I said. Later.<br>\u201cI'll sit down once everyone has eaten and called back,\u201d I told myself, and I believed it.<br>My child lives in the city now, and I ring three times a week to ask if there has been a proper meal.<br>Last month they rang to tell me something, and I said, \u201cTell me later. The kettle's on.\u201d They didn't ring back that night.<br>Every March I bake a lemon cake for my sister's birthday. I like the smell of the zest, and no one has to say thank you.<br>I'm fifty-eight. The oven is on and the list is still long.<br>Nobody asked what I wanted. I didn't ask either, because the answer would have meant stopping.","items":[{"type":"sort","prompt":"Mum's life story, line by line. Put each line on the Plan Board.","bins":["A Don't from her mother","A Don't from her father","A Must, from either parent","The how-to she was shown","The plan she decided","Not part of the Plan"],"items":[{"text":"\u201cNot now. Don't get under my feet.\u201d","answer":0,"why":"Her mother's message turns a child away. It is a Don't: don't come close, so a girl with a drawing learns to take it back to the stairs."},{"text":"\u201cStop that. I can't think with the noise.\u201d","answer":1,"why":"Her father's message shuts the feeling off. It is a Don't: don't feel it out loud, because it gets in the way of the clock."},{"text":"\u201cHurry up, girl. The bus won't wait.\u201d","answer":2,"why":"A Must. It says 'hurry up' as a condition: keep the pace and you are safe. It comes in plain words, which Musts usually do."},{"text":"\u201cBe useful. Somebody in this house has to be.\u201d","answer":2,"why":"Another Must, from her mother this time. 'Be useful' has a condition in it: you earn your place by being busy."},{"text":"\u201cMy father ate standing up, with one eye on the clock.\u201d","answer":3,"why":"Nobody tells her to do anything in this line. Her father shows her how, by doing it in front of her. Eating fast and watching the time is the program for hurrying."},{"text":"\u201cI'll sit down once everyone has eaten and called back.\u201d","answer":4,"why":"This is the plan itself. It puts the resting behind a condition that is never finished, and it is the decision she has kept."},{"text":"\u201cEvery March I bake a lemon cake for my sister's birthday.\u201d","answer":5,"why":"A present choice, warm and freely made. It doesn't come from a message she got as a girl, so it isn't part of the Plan."}]},{"type":"pick","who":"Neighbours","text":"\u201cYou're always on the go. How do you do it?\u201d","cue":"said over the fence, and she is proud and hasn't sat down since Tuesday","options":["Try hard","Hurry up","Be strong"],"answer":1,"why":"The praise is for never stopping, which is a Must. Being proud is the reward, and having no time to sit is the cost. Praise keeps the Must running because it pays.","traps":{"0":"This would be try hard if the praise were about effort, as in 'you give it so much'. Nobody praises her for trying, only for the pace.","2":"This would be be strong if the praise were about coping, as in 'you never let it get to you'. This praise is about speed and busyness, and speed is what the Must is for."},"example":"A school gate. A dinner lady tells a mother, \u201cYou're always rushing in, bless you, you must never stop,\u201d and the mother starts leaving the house ten minutes earlier."},{"type":"pick","who":"Mum","text":"\u201cTell me later. The kettle's on.\u201d","cue":"on the phone last month, when you rang to tell her something","options":["Don't feel","Don't be close","Don't be important"],"answer":2,"why":"The news is put off and called later. The Don't she hands on is don't be important: what her child has to say can wait behind the kettle.","traps":{"0":"This would be don't feel if she had said \u201cDon't cry about it.\u201d There are no tears here. She puts the news aside and moves on, and what that says is about worth.","1":"This would be don't be close if she had put the phone down on you. She stays on the line, and what goes is the news."},"example":"A father in a car park on a Sunday. His daughter says she has made the team, and he says, \u201cGood. Put your belt on, we're late.\u201d"},{"type":"pick","who":"Dad","text":"\u201cGo to the book club, love. I'll do Wednesday's tea, and you needn't ring to check.\u201d","cue":"from behind her, the television on mute","options":["A Don't","A permission","A Must"],"answer":1,"why":"A permission. It says Mum may do the thing she keeps putting off, and the tea comes with the line. Nothing in it asks her to be useful first.","traps":{"0":"A Don't would shut a door, like \u201cStop that. I can't think.\u201d This line opens one, and it pays for the way in.","2":"A Must would set a condition, like \u201cBe useful.\u201d This line has no condition in it, and nobody is keeping score."},"example":"A family WhatsApp group, Sunday.<br>Your brother: \u201cGo on, book the trip. I'll cover the hotel.\u201d<br>Nobody asks what you did to deserve it. He has said yes, and he has put effort behind it."}]},{"level":"Play","label":"Play, the week in motion","intro":"The boss runs harder. The lines have more beats, and some of the kindest-sounding options keep the trap running. Watch what each line does to Mum's chair.","items":[{"type":"scene","title":"Sunday, the call and the soup","setting":"Sunday, 4:55pm. Gran's kitchen downstairs. Mum is on speaker against the teapot, and you can hear a pan lid on her end. Leo is under the table with his pencil case. <i>The Heckler, in your head: 'Don't make a fuss. Let her finish the call.'<\/i>","meters":{"you":60,"them":50},"beats":[{"who":"Mum","text":"\u201cI've got the oven on, the washing out, and your father hasn't eaten. I'll sit down when it's all done, I suppose.\u201d","cue":"a cupboard door shutting somewhere near the phone","lines":[{"text":"\u201cMum, what's one thing you'd do this month if it needed nobody's say-so but yours?\u201d","tag":"best","you":4,"them":4,"outcome":"The pan lid stops. 'Nothing. There's your father, the washing, the soup you'll want posting.' But she has heard the question.","why":"A question that puts the choice in her hands. Her line is about waiting, and this question asks her to act on something this month."},{"text":"\u201cThat's a lot, Mum. Still, it'll all be done by tonight.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"She says 'Yes, it will,' and the pan lid starts up again. The wait is kept, and the call goes on.","why":"It sounds kind, but it agrees the wait is fine. The Plan is safe when someone agrees with it."},{"text":"\u201cOh Mum, you do everything. Go and sit down, I'll ring Dad about his dinner. You've done enough.\u201d","tag":"game","you":3,"them":3,"outcome":"'No, no, he won't answer you,' she says. 'I'll do it. You're a good child. Have you eaten?' The oven timer goes.","why":"A trap move. It looks like help, but it takes a job off her list so she can start another, and 'go and sit down' repeats the push of her own mother. It ends the scene early."}]},{"who":"Mum","text":"\u201cNothing. I haven't got time for a list. There's your father, the washing, and the soup to post.\u201d","cue":"the tap running, a plate going into the rack","lines":[{"text":"\u201cYou're allowed to start the list now, Mum. Pick the smallest thing and put a day on it.\u201d","tag":"best","you":5,"them":3,"outcome":"'The smallest thing,' she says slowly. 'The book club at the library, on a Wednesday, maybe.'","why":"A permission and a small, dated step. The list grew one 'later' at a time. A day on it makes it a plan she can act on."},{"text":"\u201cMaybe in the summer, once things quieten down.\u201d","tag":"ok","you":-2,"them":-1,"outcome":"'The summer,' she says, and the list goes back in the drawer.","why":"Another finish line is another condition. The Plan just moves the date again."}]},{"who":"Mum","text":"\u201cThe book club meets at the library on Wednesdays. Your father says I should go, but he says it from the settee and then the match comes on.\u201d","cue":"a sigh, and the tap turned off","lines":[{"text":"\u201cThen ask him plainly, Mum. Tell him Wednesday at two, and ask him to have the kettle on when you get home.\u201d","tag":"best","you":5,"them":3,"outcome":"'He'll say 'mm',' Mum says. 'Still, he'll have the kettle on. He's good with a kettle.'","why":"A clear plan with a net under it: a fixed day and time, plus someone there at the end. The green light comes with the net, so the step is less likely to be dropped."},{"text":"\u201cYes, yes, he means well.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"The talk with Dad stays in the future, along with the book club.","why":"Agreeing with Dad's vagueness keeps the plan vague, and a vague plan never gets a day."}]},{"who":"Leo","text":"\u201cGran's got a pen. Can I write BOOK CLUB on the calendar, on Wednesday? In big letters, so Mum sees it on the video.\u201d","cue":"a pencil in the air, looking at the phone, not at you","lines":[{"text":"\u201cThat's a good job for you, Leo. Ask Mum what time to write, and say it back to her.\u201d","tag":"best","you":3,"them":4,"outcome":"Leo pulls himself up to the table. 'What time, Mum?' he says. 'Two o'clock,' she says, and her voice goes soft.","why":"You send the question to the person who can answer it, and Leo gets to be important for a minute. The Don't loses some grip when a child asks for something and is heard."},{"text":"\u201cAsk your Gran, not me.\u201d","tag":"ok","you":-1,"them":-2,"outcome":"Leo shrugs and goes back to his pencil case. Mum is silent on the line.","why":"It is correct in form and cold in tone. The one child in the room is sent off, and the Don't keeps working."}]},{"who":"Mum","text":"\u201cWednesday, two o'clock, the library. I suppose your father can find a tin of soup without me.\u201d","cue":"the oven timer silent for once","lines":[{"text":"\u201cThat's a new line, Mum. Say it once more, the one about Dad and the soup.\u201d","tag":"best","you":4,"them":5,"outcome":"'Your father can find a tin of soup without me,' she says, and she laughs at herself.","why":"Naming the new line out loud makes it hers. Repeating it helps her hear it as a plan she can keep."},{"text":"\u201cGood. Ring and tell me if it falls through.\u201d","tag":"ok","you":-1,"them":-1,"outcome":"'It won't fall through,' she says, a bit stiffly, and asks if you have eaten.","why":"Kind, but it plants a doubt. The new line needs to be heard once more, not checked for cracks."}]}],"payoff":"Mum hands the call over to the oven timer, and one job comes off her list so another can go on. The old line wins again: I'll sit down once everyone is all right. You helped it win by taking one task and leaving the rest.","example":"A neighbour's mother who says \u201cAfter the wedding\u201d about the holiday she wants. The day after the wedding, it is \u201cAfter the baby.\u201d"},{"type":"pick","who":"Gran","text":"\u201cYour mother needs a new line, one she can say today. Which one is a real rewrite, and not the old Plan in a new coat?\u201d","cue":"tapping the typed message with a spoon","options":["I'll go to the library on Wednesday at two, and your father can find the soup without me.","I'll sit down properly once everyone has eaten and called back and the washing is in.","I'll sit down after your father's check-up in March, and then I'll decide."],"answer":0,"why":"A rewritten line is one she can say today and act on. The first option names a day, a time and a place, and the line is hers. The second is the old line with more on the end, and the third moves the condition to March, which is the old Plan with a new date.","traps":{"1":"This is the old line, with a little more attached. Saying it again would keep the wait in place, and Mum would leave the board exactly as it was.","2":"This sounds like progress, but it moves the condition to the check-up. Mum would have a new finish line and the same wait, and the library chair would stay empty."},"example":"A retired postwoman who said \u201cOnce the grandchildren are older, I'll learn the violin.\u201d She booked a Tuesday class instead and rang her sister to say so."}]},{"level":"Analyse","label":"Analyse, explain it","items":[{"type":"pick","who":"Gran","text":"\u201cPut your Mum's Musts and Don'ts together. Which line is the decision underneath them?\u201d","cue":"running a finger down the board, then tapping the last box","options":["I must always move fast, or the bus will leave without me.","I'll always be the one who rings round to ask if everyone has eaten.","My rest comes last, after everyone else is looked after, so it never comes."],"answer":2,"why":"The books call this the script decision: the choice a child makes between her own needs and the pressure of the messages around her, which then steers the rest of the Plan. The Don'ts and Musts are the material. The decision is that her rest comes after everyone else's, and she has kept it since she was small.","traps":{"0":"This reading would send the talk to speed and the bus. It stops at a rule she was given, and the decision under it, about her own rest, goes unnoticed.","1":"This reading would send the talk to the phone calls. They are a loving habit, and the decision costing her years is somewhere else."},"example":"A neighbour who ran the school fair for thirty years and says she never had time to be a guest. The invitation to her own cousin's wedding is still on the shelf."},{"type":"pick","who":"Gran","text":"\u201cYour Mum's new line is only a wish until something holds it up. What helps a person revoke an old decision and make a new one?\u201d","cue":"pushing the typed message back across the oilcloth towards the phone","options":["A step she can take this week, with permission to take it and someone to keep her to it.","A firm promise to herself that she will feel calmer about resting by the spring.","A clear argument that proves the hurry was never needed and the old messages were wrong."],"answer":0,"why":"The books call this revoking the old decision, or redecision. Permission lets a person go against the old message, and protection keeps her from sliding back when she feels alone and frightened. A promise to feel calmer has no step in it, and an argument alone seldom moves a plan.","traps":{"1":"This answer would have Mum wait for a feeling in the spring. The Until line would stay exactly where it is.","2":"This answer would give Mum a debate and nothing to do on Wednesday. A clever argument can win the kitchen and still leave her at the oven."},"example":"A swimming teacher tells a girl who freezes at the deep end, \u201cYou may stop whenever you like. I'll walk beside you.\u201d The permission and the net are both in the sentence."}]}]},{"setting":"School & College","blurb":"Sam's coursework is due Friday with five pages and a title, and his story is on the table.","opener":{"setting":"Tuesday, 7:50pm. The college library, the study room off the second floor. Ms Pritchard has printed Sam's reflection on one long sheet, and the Plan Board beside it is still blank.","lines":[{"who":"Ms Pritchard","text":"\u201cSam has agreed we can use his sheet. Read it for the Don'ts and the Musts, and take the last few lines slowly.\u201d","cue":"sliding the printed pages across the table with a green pen"},{"who":"Sam","text":"\u201cSorry, sorry, it's rubbish. Is it the one with the grid? I'll get the boxes wrong.\u201d","cue":"setting down a tin of ginger biscuits and then not opening it"}],"ask":"Build Sam's Plan Board first, and find the decision he made as a boy. Then propose a new line he could act on this month, and build your own from your Plan Board."},"rounds":[{"level":"Spot","label":"Spot, round 1","intro":"<b>Sam's reflection, written for the unit on how you work.<\/b><br>I was the youngest, in a house with a lot of half-finished things.<br>My mother had a drawer of half-knitted jumpers. She said she'd finish them once she'd got the hang of it.<br>When I got the top mark in the class, I told her at tea. She said, \u201cDon't show off. Nobody likes the boy who knows the answer.\u201d<br>My father checked my sums at the table. When I cried over a bad one, he said, \u201cStop that. Dry your eyes.\u201d<br>He also said, \u201cGive it everything or don't bother.\u201d<br>My mother said, \u201cBe nice to everyone, and they'll be nice to you.\u201d<br>So I was nice, and I tried. I tried at football and I tried at piano, and I was good enough to be asked back.<br>I left school at sixteen for a job at a depot, and I told myself I'd go back for the real qualification.<br>People say, \u201cSam, you try so hard.\u201d I like it, and I notice nobody says I did it.<br>Every time I got near the end of something, I found a reason for one more draft.<br>The accounts course, the spreadsheet module. When it's ready, I said. When it's ready.<br>\u201cI'll hand it in once I've got the hang of it,\u201d I told myself, and I believed it.<br>I enrolled in the evening class in September. The coursework is due on Friday. It has five pages and a title.<br>Imogen from the second row sits next to me and asks to see my draft. I turn the page over and say it's rubbish.<br>She asked less after the second week. It is my fault, and it is nobody's fault.<br>On Tuesdays I bring the ginger biscuits for the class. I like seeing everyone take two.<br>I'm thirty. I have five pages and a title.<br>Nobody asked what I was afraid of. I didn't say, because saying it would have meant finishing.","items":[{"type":"sort","prompt":"Sam's reflection, line by line. Put each line on the Plan Board.","bins":["A Don't from his mothis","A Don't from his fathis","A Must, from eithis parent","The how-to she was shown","The plan she decided","Not part of the Plan"],"items":[{"text":"\u201cDon't show off. Nobody likes the boy who knows the answer.\u201d","answer":0,"why":"His mother's message makes his cleverness a danger. It is a Don't: don't be important, and don't stand out, so a boy with the top mark learns to stay small."},{"text":"\u201cStop that. Dry your eyes.\u201d","answer":1,"why":"His father's message shuts the feeling off. It is a Don't: don't feel it where anyone can see, so a bad sum becomes something to hide."},{"text":"\u201cBe nice to everyone, and they'll be nice to you.\u201d","answer":2,"why":"A Must. It sets a condition: please everyone and you are safe. It comes in plain words, which Musts usually do."},{"text":"\u201cGive it everything or don't bother.\u201d","answer":2,"why":"Another Must, from his father this time. It sets a bar that is never quite reached, and the only way to keep it is to keep trying."},{"text":"\u201cMy
